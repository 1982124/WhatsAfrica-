<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>WhatsAfrica — Partager</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>:root{--bg:#090d17;--card:#111827;--line:#26334c;--gold:#f2b84b;--teal:#22c7a3;--muted:#98a5bb}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#273652,#090d17 50%);color:#f8f5eb;font:15px system-ui}.wrap{max-width:780px;margin:auto;padding:24px 16px}.card{background:linear-gradient(145deg,#141c2b,#0f1521);border:1px solid var(--line);border-radius:20px;padding:20px;margin:12px 0}.brand{font-size:23px;font-weight:900}.brand b{color:var(--gold)}.muted{color:var(--muted);line-height:1.6}.row{display:flex;gap:9px;flex-wrap:wrap}.row>*{flex:1;min-width:180px}select{width:100%;padding:12px;background:#0b1220;color:#fff;border:1px solid var(--line);border-radius:10px}.btn{border:0;border-radius:11px;padding:12px 15px;font-weight:850;cursor:pointer}.primary{background:var(--gold);color:#171208}.ghost{background:transparent;color:#fff;border:1px solid var(--line)}.result{word-break:break-all;background:#0b1220;border:1px solid var(--line);padding:12px;border-radius:10px;margin-top:12px}.ok{color:#65d8b8}.err{color:#ff9c96}</style></head><body><main class="wrap"><div class="brand">Whats<b>Africa</b> / Partager</div><p class="muted">Créez un SmartLink sécurisé pour une conversation, un message, un appel ou une communauté. Le serveur stocke uniquement l’empreinte du jeton.</p><section id="auth" class="card"><h2>Connexion requise</h2><a class="btn primary" href="/dashboard">Ouvrir mon cockpit</a></section><section id="app" class="card" style="display:none"><label>Type de contenu</label><select id="type"><option value="conversation">Conversation</option><option value="message">Message</option><option value="call">Appel</option><option value="group">Communauté</option><option value="smart_link">Smart Link business</option></select><label style="display:block;margin-top:12px">Identifiant du contenu</label><input id="id" style="width:100%;padding:12px;background:#0b1220;color:#fff;border:1px solid var(--line);border-radius:10px" placeholder="UUID"><label style="display:block;margin-top:12px">Accès</label><select id="permission"><option value="limited">Limité — recommandé</option><option value="private">Privé</option><option value="public">Public</option></select><div class="row" style="margin-top:12px"><button class="btn primary" id="create">Créer le SmartLink</button><a class="btn ghost" href="/inbox">Retour aux messages</a></div><div id="result"></div></section></main><script>const db=supabase.createClient('https://dzifpwqrqnvssfhwjccj.supabase.co','sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV'),$=id=>document.getElementById(id);async function boot(){const r=await db.auth.getUser();if(!r.data?.user){$('auth').style.display='block';return}$('auth').style.display='none';$('app').style.display='block'}$('create').onclick=async()=>{const type=$('type').value,id=$('id').value.trim(),permission=$('permission').value;if(!id){$('result').innerHTML='<p class="err">Identifiant requis.</p>';return}$('create').disabled=true;$('create').textContent='Création…';try{const r=await db.rpc('create_share_link',{p_resource_type:type,p_resource_id:id,p_permission:permission,p_max_uses:20});if(r.error)throw r.error;const token=r.data?.[0]?.token;if(!token)throw Error('Jeton indisponible');const link=location.origin+'/s/'+token;$('result').innerHTML='<div class="ok">SmartLink créé.</div><div class="result">'+link+'</div><div class="row" style="margin-top:8px"><button class="btn primary" id="copy">Copier</button><button class="btn ghost" id="share">Partager</button></div>';$('copy').onclick=()=>navigator.clipboard?.writeText(link);$('share').onclick=()=>navigator.share?navigator.share({title:'WhatsAfrica',text:'Contenu partagé via WhatsAfrica',url:link}):navigator.clipboard?.writeText(link)}catch(e){$('result').innerHTML='<p class="err">'+String(e.message||e).replace(/[<>]/g,'')+'</p>'}finally{$('create').disabled=false;$('create').textContent='Créer le SmartLink'}};boot();</script></body></html>
