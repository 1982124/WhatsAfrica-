<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WhatsAfrica — Réinitialiser le mot de passe</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--accent:#e8a83c;--bg:#090d17;--card:#111827;--line:#26334c;--muted:#98a5bb;--ok:#57d39b;--err:#ff8f8f}*{box-sizing:border-box}body{margin:0;min-height:100vh;font:15px system-ui;background:var(--bg);color:#f8f5eb;display:grid;place-items:center}.wrap{width:min(100%,520px);padding:24px}.brand{text-align:center;font-size:28px;font-weight:900;margin-bottom:8px}.brand b{color:var(--accent)}.tag{text-align:center;color:var(--muted);margin-bottom:24px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 18px 60px #0004}h1{font-size:24px;margin:0 0 8px}p{line-height:1.5}.muted{color:var(--muted)}input{width:100%;padding:13px;margin:7px 0;background:#0b1220;color:#fff;border:1px solid var(--line);border-radius:10px}.btn{width:100%;border:0;border-radius:10px;padding:12px 14px;margin-top:10px;font-weight:800;cursor:pointer;background:var(--accent);color:#101010}.ghost{background:transparent;color:#fff;border:1px solid var(--line)}.ok{color:var(--ok)}.err{color:var(--err)}.notice{margin-top:14px;padding:11px;border:1px solid var(--line);border-radius:10px;background:#0b1220}.hidden{display:none}.security{text-align:center;color:var(--muted);font-size:13px;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
<div class="brand">Whats<b>Africa</b></div>
<div class="tag">Communiquez. Découvrez. Vendez.</div>
<section id="card" class="card">
<h1>🔐 Nouveau mot de passe</h1>
<p class="muted">Choisissez un nouveau mot de passe pour sécuriser votre compte WhatsAfrica.</p>
<input id="password" type="password" minlength="6" autocomplete="new-password" placeholder="Nouveau mot de passe">
<input id="confirm" type="password" minlength="6" autocomplete="new-password" placeholder="Confirmer le mot de passe">
<button id="save" class="btn">Enregistrer le nouveau mot de passe</button>
<button id="back" class="btn ghost">Retour à la connexion</button>
<div id="msg" class="notice muted">Vérification du lien de récupération…</div>
</section>
<p class="security">🔒 Votre espace reste privé et sécurisé.</p>
</div>
<script>
const SUPABASE_URL='https://dzifpwqrqnvssfhwjccj.supabase.co',SUPABASE_ANON_KEY='sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const $=id=>document.getElementById(id);
function msg(text,ok=false){$('msg').innerHTML='<span class="'+(ok?'ok':'err')+'">'+String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</span>'}
function hasRecovery(){const q=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.replace(/^#/,'').replace(/^\?/,'').replace(/&/g,'&'));return q.get('type')==='recovery'||h.get('type')==='recovery'||h.has('access_token')}
async function boot(){try{const r=await db.auth.getSession();if(r.error)throw r.error;if(!hasRecovery()&&!r.data.session){msg('Ce lien de récupération est absent ou expiré. Demandez un nouveau lien depuis la connexion.');$('save').disabled=true;return}msg('Lien de récupération prêt. Choisissez votre nouveau mot de passe.',true)}catch(e){msg(e.message||'Impossible de vérifier le lien de récupération.');$('save').disabled=true}}
$('save').onclick=async()=>{const p=$('password').value,c=$('confirm').value;if(p.length<6)return msg('Le mot de passe doit contenir au moins 6 caractères.');if(p!==c)return msg('Les deux mots de passe ne correspondent pas.');$('save').disabled=true;$('msg').textContent='Enregistrement…';try{const r=await db.auth.updateUser({password:p});if(r.error)throw r.error;msg('Mot de passe modifié avec succès. Vous pouvez maintenant vous connecter.',true);$('password').value='';$('confirm').value='';setTimeout(async()=>{await db.auth.signOut().catch(()=>{});location.href='/cockpit.html'},1200)}catch(e){msg(e.message||'Impossible de modifier le mot de passe.');$('save').disabled=false}};
$('back').onclick=async()=>{await db.auth.signOut().catch(()=>{});location.href='/cockpit.html'};
db.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')msg('Lien de récupération prêt. Choisissez votre nouveau mot de passe.',true)});
boot();
</script>
</body>
</html>
