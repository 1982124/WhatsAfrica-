<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d17"><title>WhatsAfrica — Nouveau mot de passe</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>:root{--bg:#090d17;--panel:#111827;--text:#f8f5eb;--muted:#98a5bb;--gold:#f2b84b;--teal:#22c7a3;--line:#26334c}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 75% 15%,#22c7a31c,transparent 38%),var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:20px}.card{width:min(470px,100%);background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 25px 80px #0008}h1{font:700 38px Georgia,serif;margin:0 0 10px}h1 b{color:var(--gold)}p{color:var(--muted);line-height:1.6}label{display:block;margin:14px 0 6px;font-weight:800;font-size:12px;color:var(--muted)}input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#0b1220;color:var(--text)}button{width:100%;border:0;border-radius:12px;padding:13px;margin-top:16px;background:var(--gold);color:#171208;font-weight:900;cursor:pointer}.msg{min-height:24px;font-size:13px}.ok{color:var(--teal)}.err{color:#ff8f8f}.back{display:inline-block;margin-top:18px;color:var(--muted);text-decoration:none}</style></head><body><main class="card"><h1>Whats<b>Africa</b></h1><h2>Créer un nouveau mot de passe</h2><p>Choisissez un mot de passe d’au moins 8 caractères. Le lien de récupération est sécurisé par Supabase Auth.</p><form id="form"><label for="p1">Nouveau mot de passe</label><input id="p1" type="password" autocomplete="new-password" minlength="8" required><label for="p2">Confirmer</label><input id="p2" type="password" autocomplete="new-password" minlength="8" required><button id="save">Enregistrer le nouveau mot de passe</button></form><p id="msg" class="msg" role="alert"></p><a class="back" href="/auth">← Retour à la connexion</a></main><script>const db=window.supabase.createClient('https://dzifpwqrqnvssfhwjccj.supabase.co','sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV');const $=id=>document.getElementById(id);let recoveryReady=false;function message(t,ok=false){$('msg').textContent=t;$('msg').className='msg '+(ok?'ok':'err')}db.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&session){recoveryReady=true;message('Lien de récupération validé. Vous pouvez choisir votre nouveau mot de passe.',true)}});db.auth.getSession().then(({data,error})=>{if(error){message(error.message);return}if(data.session){recoveryReady=true;message('Session de récupération active. Choisissez votre nouveau mot de passe.',true)}else if(location.hash.includes('access_token')){message('Validation du lien en cours…',true)}else{message('Le lien de récupération est expiré ou invalide. Demandez un nouveau lien depuis la page de connexion.');$('save').disabled=true}});$('form').onsubmit=async e=>{e.preventDefault();const p1=$('p1').value,p2=$('p2').value;if(p1.length<8)return message('Le mot de passe doit contenir au moins 8 caractères.');if(p1!==p2)return message('Les deux mots de passe ne correspondent pas.');if(!recoveryReady)return message('Le lien de récupération est expiré ou invalide.');$('save').disabled=true;$('save').textContent='Enregistrement…';const r=await db.auth.updateUser({password:p1});if(r.error){$('save').disabled=false;$('save').textContent='Enregistrer le nouveau mot de passe';message(r.error.message);return}message('Mot de passe mis à jour. Vous pouvez maintenant vous connecter.',true);setTimeout(async()=>{await db.auth.signOut().catch(()=>{});location.href='/auth'},900)};</script></body></html>
