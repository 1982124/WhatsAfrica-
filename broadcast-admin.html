<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WhatsAfrica — Broadcast</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#090d17;color:#fff;font:15px system-ui}.wrap{max-width:760px;margin:auto;padding:24px}.card{background:#111827;border:1px solid #26334c;border-radius:18px;padding:22px;margin:16px 0}input,textarea{width:100%;box-sizing:border-box;padding:13px;margin:8px 0;background:#0b1220;color:#fff;border:1px solid #26334c;border-radius:10px}textarea{min-height:160px}.btn{padding:12px 16px;border:0;border-radius:10px;font-weight:800;background:#e8a83c;cursor:pointer}.muted{color:#98a5bb}.ok{color:#57d39b}.err{color:#ff8f8f}</style></head><body><div class="wrap"><h1>📣 WhatsAfrica — Diffusion officielle</h1><p class="muted">Message critique ou annonce importante à tous les abonnés WhatsAfrica.</p><div class="card"><input id="email" type="email" placeholder="E-mail administrateur"><input id="password" type="password" placeholder="Mot de passe"><button class="btn" id="login">Se connecter</button><p id="authMsg" class="muted"></p></div><div id="panel" class="card" style="display:none"><input id="title" maxlength="140" placeholder="Titre de l'annonce"><textarea id="body" maxlength="2000" placeholder="Votre message…"></textarea><button class="btn" id="send">Envoyer à tous les abonnés</button><p id="msg" class="muted"></p><p class="muted">Protection intégrée : accès administrateur uniquement + limitation à 1 diffusion/minute.</p></div></div><script>const db=supabase.createClient('https://dzifpwqrqnvssfhwjccj.supabase.co','sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV'),$=x=>document.getElementById(x);$('login').onclick=async()=>{const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error){$('authMsg').textContent=r.error.message;return}const u=await db.auth.getUser();const a=await db.from('platform_admins').select('user_id').eq('user_id',u.data.user.id).maybeSingle();if(a.error||!a.data){$('authMsg').textContent='Accès administrateur requis.';await db.auth.signOut();return}$('panel').style.display='block';$('authMsg').innerHTML='<span class="ok">Administrateur authentifié.</span>'};$('send').onclick=async()=>{const title=$('title').value.trim(),body=$('body').value.trim();if(title.length<2||body.length<2){$('msg').innerHTML='<span class="err">Titre et message obligatoires.</span>';return}if(!confirm('Envoyer cette annonce à tous les abonnés WhatsAfrica ?'))return;const r=await db.rpc('publish_platform_broadcast',{p_title:title,p_body:body});if(r.error){$('msg').innerHTML='<span class="err">'+r.error.message+'</span>';return}const d=r.data||{};$('msg').innerHTML='<span class="ok">Diffusion envoyée à '+(d.delivered??0)+' abonnés.</span>';$('title').value='';$('body').value=''};</script></body></html>
