<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d17"><title>WhatsAfrica — Confirmation</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>:root{--bg:#090d17;--panel:#111827;--text:#f8f5eb;--muted:#98a5bb;--gold:#f2b84b;--teal:#22c7a3;--line:#26334c}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 70% 20%,#22c7a31c,transparent 40%),var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:20px}.card{width:min(520px,100%);background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:32px;text-align:center;box-shadow:0 25px 80px #0008}.icon{font-size:54px}h1{font:700 40px Georgia,serif;margin:10px 0}h1 b{color:var(--gold)}p{color:var(--muted);line-height:1.6}.btn{display:inline-block;margin-top:16px;padding:13px 18px;border-radius:12px;background:var(--gold);color:#171208;text-decoration:none;font-weight:900}</style></head><body><main class="card"><div class="icon">✉️</div><h1>Whats<b>Africa</b></h1><h2 id="title">Confirmation de votre e-mail</h2><p id="msg">Validation de votre compte en cours…</p><a class="btn" href="/auth">Ouvrir ma connexion</a></main><script>const db=window.supabase.createClient('https://dzifpwqrqnvssfhwjccj.supabase.co','sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV');db.auth.getSession().then(({data})=>{if(data.session){document.getElementById('title').textContent='E-mail confirmé 🎉';document.getElementById('msg').textContent='Votre compte WhatsAfrica est confirmé. Vous pouvez maintenant accéder à votre espace.'}else{document.getElementById('title').textContent='E-mail traité';document.getElementById('msg').textContent='Si la confirmation a réussi, connectez-vous avec votre e-mail et votre mot de passe.'}}).catch(()=>{document.getElementById('title').textContent='Confirmation terminée';document.getElementById('msg').textContent='Retournez à la connexion pour continuer.'});</script></body></html>
