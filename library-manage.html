<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>WASSAFRICA — Gérer mes collections</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--g:#173d2d;--gold:#e7a72f;--bg:#f7f3e9;--ink:#18231e;--muted:#68746d;--line:#ddd9cf}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui}.wrap{max-width:980px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-weight:950;font-size:22px;color:var(--g);text-decoration:none}.btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 15px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-weight:900;text-decoration:none;cursor:pointer}.primary{background:var(--g);border-color:var(--g);color:#fff}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:14px}.hero{background:linear-gradient(135deg,#173d2d,#245941);color:#fff}.hero h1{font:800 38px Georgia;margin:7px 0}.muted{color:var(--muted)}.hero .muted{color:#dcebe3}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-top:11px}.field label{display:block;font-size:12px;font-weight:900;margin-bottom:6px}.input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;font:inherit}.list{display:grid;gap:8px;margin-top:12px}.row{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:13px;padding:10px;background:#fffdf9}.row input{width:18px;height:18px}.cover{width:52px;height:52px;border-radius:9px;object-fit:cover;background:#eee}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.status{min-height:22px;margin-top:9px;font-weight:800}.ok{color:#287a4d}.err{color:#b42318}.collection{border:1px solid var(--line);border-radius:15px;padding:13px}.collection h3{margin:0 0 4px}.collection .items{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.tag{padding:5px 8px;background:#f1eadc;border-radius:999px;font-size:11px;font-weight:800}@media(max-width:700px){.grid{grid-template-columns:1fr}.actions .btn{width:100%}.hero h1{font-size:32px}}</style></head><body><main class="wrap"><header class="top"><a class="brand" href="/dashboard">WASSAFRICA</a><a class="btn" href="/library">📚 Bibliothèque</a></header><section class="card hero"><div style="font-size:11px;font-weight:950;letter-spacing:2px;color:#f7d98c">COCKPIT LIVRES</div><h1>Créer et organiser mes collections</h1><p class="muted">Réunissez vos livres numériques dans des collections publiées sur WASSAFRICA.</p></section><section id="gate" class="card">Vérification…</section><section id="editor" class="card" hidden><h2>Nouvelle collection</h2><div class="grid"><div class="field"><label>Nom *</label><input id="name" class="input" required></div><div class="field"><label>Prix de la collection</label><input id="price" class="input" type="number" min="0" placeholder="Prix sur demande"></div><div class="field" style="grid-column:1/-1"><label>Description</label><textarea id="desc" class="input" rows="3"></textarea></div></div><div class="field"><label>Livres à inclure</label><div id="books" class="list"></div></div><div class="actions"><button id="create" class="btn primary">Créer la collection</button><a class="btn" href="/offer-create?type=digital">➕ Créer un livre</a></div><div id="msg" class="status"></div></section><section class="card"><h2>Mes collections</h2><div id="collections" class="list"><div class="muted">Chargement…</div></div></section></main><script>
(async()=>{const db=supabase.createClient('https://dzifpwqrqnvssfhwjccj.supabase.co','sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),$=id=>document.getElementById(id);let user,biz,books=[],collections=[];const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const msg=(x,ok=false)=>$('msg').innerHTML='<span class="'+(ok?'ok':'err')+'">'+esc(x)+'</span>';
async function bootstrap(){const s=await db.auth.getSession();user=s.data?.session?.user;if(!user){$('gate').innerHTML='<b>Connexion requise.</b> <a class="btn primary" href="/auth?next=/library/manage">Se connecter</a>';return false}let r=await db.from('businesses').select('id,name,owner_id').eq('owner_id',user.id).maybeSingle();if(r.error)throw r.error;if(!r.data){$('gate').innerHTML='<b>Créez d’abord votre activité dans le cockpit.</b>';return false}biz=r.data;const br=await db.from('products').select('id,title,image_url,content_kind,product_type,is_published').eq('business_id',biz.id).eq('product_type','digital').eq('content_kind','book').order('created_at',{ascending:false});if(br.error)throw br.error;books=br.data||[];renderBooks();await loadCollections();$('gate').innerHTML='<b>🟢 '+esc(biz.name)+'</b><div class="muted">Gestion des collections active.</div>';$('editor').hidden=false;return true}
function renderBooks(){$('books').innerHTML=books.length?books.map(b=>'<label class="row"><input type="checkbox" value="'+b.id+'"><img class="cover" src="'+esc(b.image_url||'')+'" onerror="this.style.display=\'none\'" alt=""><span><b>'+esc(b.title)+'</b><br><small class="muted">'+(b.is_published?'Publié':'Brouillon')+'</small></span></label>').join(''):'<div class="muted">Aucun livre trouvé. Créez un livre puis revenez ici.</div>'}
async function loadCollections(){const {data,error}=await db.from('product_collections').select('id,name,description,price,currency,is_published,sort_order').eq('business_id',biz.id).order('sort_order',{ascending:true});if(error)throw error;collections=data||[];const ids=collections.map(x=>x.id);let items=[];if(ids.length){const r=await db.from('product_collection_items').select('collection_id,product_id,sort_order').in('collection_id',ids).order('sort_order',{ascending:true});if(r.error)throw r.error;items=r.data||[]}const by=new Map(books.map(x=>[x.id,x.title]));$('collections').innerHTML=collections.length?collections.map(c=>'<div class="collection"><h3>'+esc(c.name)+'</h3><div class="muted">'+esc(c.description||'')+' · '+(c.is_published?'Publié':'Brouillon')+'</div><div class="items">'+items.filter(i=>i.collection_id===c.id).map(i=>'<span class="tag">'+esc(by.get(i.product_id)||'Livre')+'</span>').join('')+'</div></div>').join(''):'<div class="muted">Aucune collection pour le moment.</div>'}
$('create').onclick=async()=>{try{const name=$('name').value.trim();if(!name)throw Error('Le nom de la collection est requis.');const selected=[...document.querySelectorAll('#books input:checked')].map(x=>x.value);if(!selected.length)throw Error('Sélectionnez au moins un livre.');msg('Création…',true);const r=await db.from('product_collections').insert({business_id:biz.id,name,description:$('desc').value.trim()||null,price:$('price').value===''?null:Number($('price').value),currency:'XOF',is_published:false}).select('id').single();if(r.error)throw r.error;const items=selected.map((id,i)=>({collection_id:r.data.id,product_id:id,sort_order:i}));const ir=await db.from('product_collection_items').insert(items);if(ir.error){await db.from('product_collections').delete().eq('id',r.data.id);throw ir.error}msg('Collection créée en brouillon. Publiez-la depuis votre espace de gestion.',true);$('name').value='';$('desc').value='';$('price').value='';document.querySelectorAll('#books input').forEach(x=>x.checked=false);await loadCollections()}catch(e){msg(e.message||'Création impossible')}}
await bootstrap()})().catch(e=>{document.getElementById('gate').innerHTML='<span class="err">'+String(e.message||e).replace(/[<>]/g,'')+'</span>'});
</script></body></html>
