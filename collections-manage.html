<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WASSAFRICA — Collection Studio</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f7f3ea;color:#17231e;font:15px/1.5 system-ui}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #ded8ca;border-radius:20px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.row{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}.btn{border:1px solid #d8d3c8;background:#fff;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer;text-decoration:none;color:inherit}.primary{background:#173d2d;color:#fff}.muted{color:#6c746f}.field{margin:9px 0}.field label{display:block;font-weight:700;margin-bottom:5px}input,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d8d3c8;border-radius:9px;font:inherit}.item{border:1px solid #e1ddd4;border-radius:12px;padding:10px;margin:7px 0}.pill{background:#edf3ee;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:800}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="row"><h1>WASSAFRICA · Collection Studio</h1><a class="btn" href="/digital-products">+ Produit numérique</a></div><p class="muted">Identité · médias · bibliothèque · offre · partage.</p><section class="card"><h2>Créer une collection</h2><div class="grid"><div class="field"><label>Nom</label><input id="n" placeholder="Ex. Les Héros Inoubliables de l’Afrique"></div><div class="field"><label>Sous-titre</label><input id="s" placeholder="Une bibliothèque à découvrir"></div><div class="field"><label>Description</label><textarea id="d" rows="3"></textarea></div><div class="field"><label>Public cible</label><input id="a" placeholder="Enfants, étudiants, professionnels…"></div></div><button class="btn primary" onclick="create()">Créer</button></section><div id="list">Chargement…</div></main><script>
const db=supabase.createClient('https://dzifpwqrqnvssfhwjccj.supabase.co','sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV',{auth:{persistSession:true,autoRefreshToken:true,storage:localStorage,storageKey:'whatsafrica-auth'}});let bid=null;const $=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function init(){const s=await db.auth.getSession();if(!s.data.session)return location.href='/auth?next='+encodeURIComponent(location.href);const r=await db.from('businesses').select('id').eq('owner_id',s.data.session.user.id).limit(1).maybeSingle();if(!r.data)return $('list').textContent='Aucune activité commerciale associée.';bid=r.data.id;load()}
async function create(){if(!$('n').value.trim())return alert('Nom requis.');const r=await db.from('product_collections').insert({business_id:bid,name:$('n').value.trim(),subtitle:$('s').value.trim()||null,description:$('d').value.trim()||null,audience:$('a').value.trim()||null,is_published:false});if(r.error)alert(r.error.message);else load()}
async function load(){const r=await db.from('product_collections').select('*').eq('business_id',bid).order('created_at',{ascending:false});$('list').innerHTML=(r.data||[]).map(c=>'<section class="card"><div class="row"><h2>'+esc(c.name)+'</h2><span class="pill">'+(c.is_published?'PUBLIÉE':'BROUILLON')+'</span></div><div class="grid"><div><div class="field"><label>Nom</label><input id="n'+c.id+'" value="'+esc(c.name)+'"></div><div class="field"><label>Sous-titre</label><input id="s'+c.id+'" value="'+esc(c.subtitle||'')+'"></div><div class="field"><label>Description</label><textarea id="d'+c.id+'" rows="4">'+esc(c.description||'')+'</textarea></div><div class="field"><label>Public cible</label><input id="a'+c.id+'" value="'+esc(c.audience||'')+'"></div><div class="field"><label>Âge</label><input id="age'+c.id+'" value="'+esc(c.age_range||'')+'"></div><div class="field"><label>Langue / Région / Catégorie</label><input id="meta'+c.id+'" value="'+esc([c.language,c.region,c.category].filter(Boolean).join(' · '))+'"></div><div class="field"><label>Prix Collection</label><input id="p'+c.id+'" type="number" min="0" value="'+(c.price??'')+'"></div><div class="field"><label>Devise</label><input id="cur'+c.id+'" value="'+esc(c.currency||'XOF')+'"></div><button class="btn primary" onclick="save(\''+c.id+'\')">Enregistrer</button></div><div><div class="field"><label>Couverture (URL)</label><input id="cover'+c.id+'" value="'+esc(c.cover_url||'')+'" placeholder="https://…"></div><div class="field"><label>Teaser vidéo (URL)</label><input id="teaser'+c.id+'" value="'+esc(c.teaser_video_url||'')+'" placeholder="URL MP4/WebM"></div><div class="field"><label>Présentation vidéo (URL)</label><input id="present'+c.id+'" value="'+esc(c.presentation_video_url||'')+'" placeholder="URL MP4/WebM"></div><button class="btn" onclick="save(\''+c.id+'\')">Enregistrer les médias</button><h3>Bibliothèque</h3><div id="items'+c.id+'">Chargement…</div><input id="q'+c.id+'" oninput="products(\''+c.id+'\')" placeholder="Rechercher un produit"><div id="results'+c.id+'"></div></div></div><p><a class="btn primary" href="/collection/'+c.id+'?preview=1" target="_blank">Aperçu</a> <button class="btn" onclick="publish(\''+c.id+'\','+(!c.is_published)+')">'+(c.is_published?'Dépublier':'Publier')+'</button></p></section>').join('')||'<section class="card muted">Aucune collection.</section>';for(const c of r.data||[])items(c.id)}
async function save(id){const meta=$('meta'+id).value.split('·').map(x=>x.trim()).filter(Boolean);const r=await db.from('product_collections').update({name:$('n'+id).value.trim(),subtitle:$('s'+id).value.trim()||null,description:$('d'+id).value.trim()||null,audience:$('a'+id).value.trim()||null,age_range:$('age'+id).value.trim()||null,language:meta[0]||null,region:meta[1]||null,category:meta[2]||null,price:$('p'+id).value===''?null:Number($('p'+id).value),currency:($('cur'+id).value.trim()||'XOF').toUpperCase(),cover_url:$('cover'+id).value.trim()||null,teaser_video_url:$('teaser'+id).value.trim()||null,presentation_video_url:$('present'+id).value.trim()||null}).eq('id',id).eq('business_id',bid);if(r.error)alert(r.error.message);else load()}
async function publish(id,v){const r=await db.from('product_collections').update({is_published:v}).eq('id',id).eq('business_id',bid);if(r.error)alert(r.error.message);else load()}
async function items(id){const r=await db.from('collection_items').select('product_id,sort_order,products(title,price,currency)').eq('collection_id',id).order('sort_order');$('items'+id).innerHTML=(r.data||[]).map(x=>'<div class="item"><b>'+esc(x.products?.title)+'</b> · '+Number(x.products?.price||0).toLocaleString('fr-FR')+' '+esc(x.products?.currency||'XOF')+' <button class="btn" onclick="removeItem(\''+id+'\',\''+x.product_id+'\')">Retirer</button></div>').join('')||'<span class="muted">Aucun produit.</span>'}
async function products(id){const q=$('q'+id).value.trim();if(q.length<2)return $('results'+id).innerHTML='';const r=await db.from('products').select('id,title,price,currency').eq('business_id',bid).eq('is_published',true).ilike('title','%'+q.replace(/[%_]/g,'')+'%').limit(10);$('results'+id).innerHTML=(r.data||[]).map(p=>'<div class="item"><b>'+esc(p.title)+'</b> · '+Number(p.price||0).toLocaleString('fr-FR')+' '+esc(p.currency||'XOF')+' <button class="btn" onclick="addItem(\''+id+'\',\''+p.id+'\')">Ajouter</button></div>').join('')||'<span class="muted">Aucun résultat.</span>'}
async function addItem(cid,pid){const r=await db.from('collection_items').select('product_id').eq('collection_id',cid).eq('product_id',pid).maybeSingle();if(r.data)return;const m=await db.from('collection_items').select('sort_order').eq('collection_id',cid).order('sort_order',{ascending:false}).limit(1);const n=((m.data||[])[0]?.sort_order||0)+1;const x=await db.from('collection_items').insert({collection_id:cid,product_id:pid,sort_order:n});if(x.error)alert(x.error.message);else load()}
async function removeItem(cid,pid){const r=await db.from('collection_items').delete().eq('collection_id',cid).eq('product_id',pid);if(r.error)alert(r.error.message);else load()}init();
</script></body></html>
