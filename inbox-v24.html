<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>WASSAFRICA — Messages</title><style>body{font:15px system-ui,sans-serif;margin:0;background:#f5f7f6;color:#17211b}.wrap{max-width:1100px;margin:auto;padding:12px}.card{background:#fff;border:1px solid #dce5e1;border-radius:16px;padding:12px;margin:8px 0}.row{display:flex;gap:8px}.row>*{flex:1}.btn{border:0;border-radius:12px;padding:11px 14px;background:#e8a83c;font-weight:800;cursor:pointer}.btn:disabled{opacity:.55}.muted{color:#66756e;font-size:13px}.err{color:#b42318}.ok{color:#18845d}.layout{display:grid;grid-template-columns:300px 1fr;gap:10px}.list{max-height:68vh;overflow:auto}.conv,.result{padding:12px;border-radius:12px;cursor:pointer}.conv:hover,.result:hover{background:#eef4f1}.chat{min-height:68vh;display:flex;flex-direction:column}.msgs{flex:1;min-height:52vh;overflow:auto}.msg{max-width:82%;width:max-content;padding:9px 11px;border-radius:14px;background:#eef2f0;margin:6px 0;white-space:pre-wrap;overflow-wrap:anywhere}.mine{margin-left:auto;background:#dcf8c6}.gate{font-weight:700}.result{border:1px solid #dce5e1;margin:6px 0}input{border:1px solid #dce5e1;border-radius:12px;padding:11px;font:inherit}@media(max-width:760px){.layout{grid-template-columns:1fr}.row{flex-direction:column}}</style></head><body><div class="wrap"><h2>WASSAFRICA · Messages</h2><section id="gate" class="card gate">Initialisation sécurisée…</section><main id="app" hidden><section class="card"><b>Nouveau message</b><div class="row"><input id="target" autocomplete="off" placeholder="Nom ou numéro +223…"><button id="start" class="btn">Démarrer</button></div><div id="results"></div><div id="status" class="muted"></div></section><div class="layout"><section class="card"><b>Conversations</b><div id="list" class="list"></div></section><section class="card chat"><div id="chat" hidden><b id="title">Conversation</b><div id="secure" class="muted"></div><div id="msgs" class="msgs"></div><form id="composer" class="row"><input id="body" maxlength="4000" autocomplete="off" placeholder="Écrire un message…"><button id="send" class="btn" type="submit">➤</button></form></div><div id="empty">Choisissez une conversation.</div></section></div></main></div><script src="/wa-media-p2p.js"></script><script src="/wa-message-invite.js"></script><script>(async()=>{'use strict';const $=id=>document.getElementById(id),SB='https://dzifpwqrqnvssfhwjccj.supabase.co',KEY='sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV',AUTH='whatsafrica-auth',DB='wassafrica-msg-v20',te=new TextEncoder(),td=new TextDecoder();let session=null,user=null,device=null,current=null,busy=false,timer=null,keyCache=new Map();const gate=$('gate');const esc=v=>String(v??'').replace(/[<>]/g,'');const status=(t,c='')=>{$('status').textContent=t;$('status').className='muted '+c};const phase=t=>{gate.hidden=false;gate.textContent=t};const b64=x=>{let s='';new Uint8Array(x).forEach(b=>s+=String.fromCharCode(b));return btoa(s)};const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));function readSession(){try{const ks=Array.from({length:localStorage.length},(_,i)=>localStorage.key(i)).filter(Boolean),order=[AUTH,...ks.filter(k=>k!==AUTH)];for(const k of order){try{const x=JSON.parse(localStorage.getItem(k)||'null'),s=x?.access_token?x:x?.session||x?.currentSession||x?.data?.session;if(s?.access_token&&s.user?.id)return s}catch{}}}catch{}return null}async function api(path,opt={}){const h=new Headers(opt.headers||{});h.set('apikey',KEY);if(session?.access_token)h.set('Authorization','Bearer '+session.access_token);if(opt.body&&!h.has('Content-Type'))h.set('Content-Type','application/json');const r=await fetch(SB+path,{...opt,headers:h});let d=null;try{d=await r.json()}catch{}if(!r.ok){const e=new Error(d?.message||d?.error_description||d?.hint||d?.details||d?.code||('HTTP_'+r.status));e.code=d?.code;e.status=r.status;throw e}return d}const rest=(t,p='',o={})=>api('/rest/v1/'+t+(p?'?'+p:''),o),rpc=(f,b)=>api('/rest/v1/rpc/'+f,{method:'POST',body:JSON.stringify(b)});function vault(){return new Promise((ok,no)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('k'))r.result.createObjectStore('k')};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function vg(k){const d=await vault();return new Promise((ok,no)=>{const r=d.transaction('k').objectStore('k').get(k);r.onsuccess=()=>{d.close();ok(r.result||null)};r.onerror=()=>no(r.error)})}async function vp(k,v){const d=await vault();return new Promise((ok,no)=>{const tx=d.transaction('k','readwrite');tx.objectStore('k').put(v,k);tx.oncomplete=()=>{d.close();ok()};tx.onerror=()=>no(tx.error)})}async function identity(){const saved=await vg('id:'+user.id);if(saved)return{record:saved,privateKey:await crypto.subtle.importKey('jwk',saved.privateJwk,{name:'RSA-OAEP',hash:'SHA-256'},true,['decrypt'])};const g=await crypto.subtle.generateKey({name:'RSA-OAEP',modulusLength:2048,publicExponent:new Uint8Array([1,0,1]),hash:'SHA-256'},true,['encrypt','decrypt']),record={publicJwk:await crypto.subtle.exportKey('jwk',g.publicKey),privateJwk:await crypto.subtle.exportKey('jwk',g.privateKey)};await vp('id:'+user.id,record);return{record,privateKey:g.privateKey}}async function ensureDevice(force=false){if(device&&!force)return device;const i=await identity(),r=await rpc('ensure_web_device',{p_identity_public_key:i.record.publicJwk}),d=Array.isArray(r)?r[0]:r;if(!d?.id)throw Error('DEVICE_NOT_AVAILABLE');device={id:d.id,identity_public_key:d.identity_public_key||i.record.publicJwk,privateKey:i.privateKey};return device}async function rsaWrap(j,k){const p=await crypto.subtle.importKey('jwk',j,{name:'RSA-OAEP',hash:'SHA-256'},true,['encrypt']);return new Uint8Array(await crypto.subtle.encrypt({name:'RSA-OAEP'},p,k))}async function addEnv(c,d,k,v){try{await rest('conversation_key_envelopes','',{method:'POST',body:JSON.stringify({conversation_id:c,device_id:d.id,key_version:v,algorithm:'RSA-OAEP-2048-SHA256+AES-256-GCM',wrapped_key:b64(await rsaWrap(d.identity_public_key,k))})})}catch(e){if(String(e.code)!=='23505'&&!String(e.message||e).toLowerCase().includes('duplicate'))throw e}}async function distribute(c,k,v){const mem=await rest('conversation_members','select=user_id&conversation_id=eq.'+encodeURIComponent(c));for(const uid of [...new Set((mem||[]).map(x=>x.user_id))]){const ds=await rest('user_devices','select=id,identity_public_key&user_id=eq.'+encodeURIComponent(uid)+'&device_label=eq.Web&revoked_at=is.null&order=last_seen_at.desc&limit=20');for(const d of ds||[])if(d.identity_public_key)await addEnv(c,d,k,v)}}async function fetchKey(c,v){const hit=keyCache.get(c+':'+v);if(hit)return hit;const q='select=wrapped_key,key_version&conversation_id=eq.'+encodeURIComponent(c)+'&device_id=eq.'+encodeURIComponent(device.id)+'&key_version=eq.'+encodeURIComponent(v)+'&revoked_at=is.null&limit=1';const r=(await rest('conversation_key_envelopes',q))?.[0];if(!r)return null;const k=new Uint8Array(await crypto.subtle.decrypt({name:'RSA-OAEP'},device.privateKey,ub64(r.wrapped_key))),out={key:k,version:Number(r.key_version)};keyCache.set(c+':'+v,out);return out}async function ensureKey(c){const cached=[...keyCache.entries()].find(([k])=>k.startsWith(c+':'))?.[1];if(cached)return cached;const latest=await fetchKey(c,999999);if(latest)return latest;const epoch=await rpc('start_conversation_key_epoch',{p_conversation_id:c,p_device_id:device.id}),v=Number(Array.isArray(epoch)?(epoch[0]?.key_version??epoch[0]):(epoch?.key_version??epoch));if(!Number.isInteger(v)||v<1)throw Error('KEY_EPOCH_INVALID');const key=crypto.getRandomValues(new Uint8Array(32));await distribute(c,key,v);const out={key,version:v};keyCache.set(c+':'+v,out);return out}async function list(){phase('Initialisation 3/5 — conversations…');const m=await rest('conversation_members','select=conversation_id&user_id=eq.'+encodeURIComponent(user.id)),ids=new Set((m||[]).map(x=>x.conversation_id)),rows=await rest('conversations','select=id,title,created_at&order=created_at.desc&limit=100'),box=$('list');box.innerHTML='';for(const c of rows||[])if(ids.has(c.id)){const d=document.createElement('div');d.className='conv';d.textContent=c.title||'Conversation directe';d.onclick=()=>openConv(c);box.appendChild(d)}if(!box.children.length)box.textContent='Aucune conversation.'}async function find(v){$('results').innerHTML='';status('Recherche…');try{const rs=(await rpc('search_public_profiles',{p_query:v})||[]).filter(x=>x.user_id!==user.id);if(!rs.length){$('results').textContent='Aucun profil trouvé.';window.WA_MESSAGE_INVITES?.init?.();return}for(const p of rs.slice(0,10)){const d=document.createElement('div');d.className='result';d.textContent=(p.display_name||p.public_display_name||'Profil WASSAFRICA')+(p.country?' · '+p.country:'');d.onclick=()=>startUser(p);$('results').appendChild(d)}}catch(e){status('Recherche impossible : '+esc(e.message||e),'err')}}async function startUser(p){if(!p?.user_id||p.user_id===user.id)return status('Impossible : choisissez un autre membre.','err');const r=await rpc('start_direct_conversation_by_user_id',{p_user_id:p.user_id}),x=Array.isArray(r)?r[0]:r;if(!x?.conversation_id)throw Error('CONTACT_NOT_FOUND');$('results').innerHTML='';await openConv({id:x.conversation_id,title:x.contact_name||p.display_name||'Conversation directe'})}async function start(){const v=$('target').value.trim();if(!v)return status('Saisissez un nom ou un numéro.','err');$('start').disabled=true;try{const c=v.replace(/[\s().-]/g,'');if(/^\+?[1-9][0-9]{7,14}$/.test(c)){const phone=c.startsWith('+')?c:'+'+c;const own=String(user?.phone||user?.user_metadata?.phone||'').replace(/[\s().-]/g,'');if(own&&own===phone)return status('Impossible : vous avez saisi votre propre numéro.','err');const r=await rpc('start_direct_conversation_by_phone',{p_phone:phone}),x=Array.isArray(r)?r[0]:r;if(!x?.conversation_id)throw Error('CONTACT_NOT_FOUND');await openConv({id:x.conversation_id,title:x.contact_name||'Conversation directe'})}else await find(v)}catch(e){if(String(e.code||e.message).includes('CONTACT_NOT_FOUND'))window.WA_MESSAGE_INVITES?.init?.();else status('Impossible : '+esc(e.message||e),'err')}finally{$('start').disabled=false}}async function decrypt(row,k){const m=row.encryption_metadata||{},cid=m.conversation_id||row.conversation_id,id=m.message_id||row.id;if(!m.iv||!row.ciphertext)throw Error('MESSAGE_ENCRYPTION_METADATA_INVALID');const kk=await crypto.subtle.importKey('raw',k,{name:'AES-GCM'},false,['decrypt']);return td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(m.iv),additionalData:te.encode('whatsafrica:v2:'+cid+':'+id)},kk,ub64(row.ciphertext)))}async function load(){if(!current)return;const latest=await latestKey(current.id);const rows=await rest('messages_v2','select=id,sender_id,created_at,ciphertext,encryption_metadata,message_type,media_path,media_mime,media_duration_ms&conversation_id=eq.'+encodeURIComponent(current.id)+'&order=created_at.asc&limit=200'),nodes=[];let bad=0;for(const r of rows||[]){let text='🔒 Message chiffré';if(r.message_type!=='text')text='📎 '+(r.encryption_metadata?.file_name||r.message_type||'Fichier');else try{const v=Number(r.encryption_metadata?.key_version);if(!Number.isInteger(v)||v<1)throw Error('MESSAGE_KEY_VERSION_MISSING');const exact=v===latest.version?latest:await fetchKey(current.id,v);if(!exact)throw Error('KEY_VERSION_NOT_FOUND_'+v);text=await decrypt(r,exact.key)}catch(e){bad++}const d=document.createElement('div');d.className='msg '+(r.sender_id===user.id?'mine':'');d.textContent=text;nodes.push(d)}$('msgs').replaceChildren(...nodes);$('msgs').scrollTop=$('msgs').scrollHeight;$('secure').textContent='🔒 E2EE actif · clé v'+latest.version+(bad?' · '+bad+' message(s) illisible(s)':'')}async function latestKey(c){const q='select=wrapped_key,key_version&conversation_id=eq.'+encodeURIComponent(c)+'&device_id=eq.'+encodeURIComponent(device.id)+'&revoked_at=is.null&order=key_version.desc&limit=1';const r=(await rest('conversation_key_envelopes',q))?.[0];if(!r)throw Error('KEY_NOT_FOUND');const k=new Uint8Array(await crypto.subtle.decrypt({name:'RSA-OAEP'},device.privateKey,ub64(r.wrapped_key))),out={key:k,version:Number(r.key_version)};keyCache.set(c+':'+out.version,out);return out}async function openConv(c){current=c;keyCache.clear();$('empty').hidden=true;$('chat').hidden=false;$('title').textContent=c.title||'Conversation';await load();if(timer)clearInterval(timer);timer=setInterval(()=>load().catch(e=>status('Synchronisation : '+esc(e.message||e),'err')),3500)}async function send(e){e.preventDefault();const text=$('body').value.trim();if(!text||!current)return;$('send').disabled=true;try{const x=await latestKey(current.id),id=crypto.randomUUID(),iv=crypto.getRandomValues(new Uint8Array(12)),aad=te.encode('whatsafrica:v2:'+current.id+':'+id),kk=await crypto.subtle.importKey('raw',x.key,{name:'AES-GCM'},false,['encrypt']),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:aad},kk,te.encode(text));await rest('messages_v2','',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({id,conversation_id:current.id,sender_id:user.id,body:null,message_type:'text',encryption_version:1,ciphertext:b64(ct),encryption_metadata:{v:2,alg:'AES-256-GCM',iv:b64(iv),conversation_id:current.id,message_id:id,key_version:x.version}})});$('body').value='';await load();status('🔒 Message envoyé.','ok')}catch(e){status('Message non envoyé : '+esc(e.message||e),'err')}finally{$('send').disabled=false}}window.addEventListener('error',e=>gate.innerHTML='❌ Erreur navigateur : <b>'+esc(e.message||e)+'</b>');window.addEventListener('unhandledrejection',e=>gate.innerHTML='❌ Erreur asynchrone : <b>'+esc(e.reason?.message||e.reason||e)+'</b>');try{phase('Initialisation 1/5 — session…');session=readSession();if(!session)throw Error('AUTH_REQUIRED');user=session.user;if(!use
