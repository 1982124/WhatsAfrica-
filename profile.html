<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WASSAFRICA — Mon profil</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/brand-normalizer.js"></script><style>body{margin:0;background:#f5f7f6;color:#17211b;font:15px system-ui,sans-serif}.wrap{max-width:760px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #dce5e1;border-radius:18px;padding:20px;margin:12px 0}h1{margin:0}.muted{color:#66756e}.field{margin:12px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #dce5e1;border-radius:12px;font:inherit}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:12px;padding:12px 16px;background:#e8a83c;font-weight:800;cursor:pointer}.ghost{background:transparent;border:1px solid #dce5e1}.avatar{width:90px;height:90px;border-radius:50%;object-fit:cover;background:#eef2f0;display:block;margin-bottom:8px}.status{min-height:22px;margin-top:10px}.ok{color:#18845d}.err{color:#b42318}@media(max-width:650px){.row{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><h1>Mon profil WASSAFRICA</h1><p class="muted">Complétez les informations que les autres membres pourront utiliser pour vous retrouver et vous reconnaître.</p></div><button id="logout" class="btn ghost">Déconnexion</button></div></section><section class="card"><form id="form"><div class="field"><label>Photo de profil</label><img id="avatar" class="avatar" alt="Photo de profil"><input id="avatar_url" type="url" placeholder="https://…"><small class="muted">URL publique de votre photo.</small></div><div class="row"><div class="field"><label>Prénom</label><input id="first_name" maxlength="80"></div><div class="field"><label>Nom</label><input id="last_name" maxlength="80"></div></div><div class="field"><label>Nom affiché</label><input id="display_name" maxlength="120" required placeholder="Ex. Françoise Adjiboye"></div><div class="field"><label>Nom public</label><input id="public_display_name" maxlength="120" placeholder="Nom visible dans la recherche"></div><div class="row"><div class="field"><label>Pays</label><input id="country" maxlength="80" placeholder="Mali, Bénin…"></div><div class="field"><label>Numéro public</label><input id="public_phone" type="tel" maxlength="20" placeholder="+223…"></div></div><div class="field"><label>Présentation</label><textarea id="bio" rows="5" maxlength="500" placeholder="Présentez-vous en quelques mots…"></textarea></div><div class="field"><label>Identifiant SmartLink</label><input id="smartlink_slug" maxlength="80" pattern="[A-Za-z0-9_-]+"><small class="muted">Lettres, chiffres, tirets et underscores.</small></div><div class="field"><label><input id="phone_public" type="checkbox" style="width:auto"> Afficher mon numéro public dans mon profil</label></div><div id="status" class="status" role="status"></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" type="submit">Enregistrer mon profil</button><a class="btn ghost" href="/inbox" style="text-decoration:none;color:inherit">Retour à la messagerie</a></div></form></section></main><script>(async()=>{const URL='https://dzifpwqrqnvssfhwjccj.supabase.co',KEY='sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV',AUTH='whatsafrica-auth',db=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:localStorage,storageKey:AUTH}}),$=id=>document.getElementById(id);let user=null,profile=null;const status=(t,ok=false)=>{$('status').textContent=t;$('status').className='status '+(ok?'ok':'err')};async function boot(){const s=await db.auth.getSession();if(!s.data.session){location.href='/auth?next=/profile';return}user=s.data.session.user;const r=await db.from('profiles').select('*').eq('user_id',user.id).maybeSingle();if(r.error)throw r.error;if(!r.data){const name=user.user_metadata?.display_name||user.email?.split('@')[0]||'Membre WASSAFRICA';const i=await db.from('profiles').insert({user_id:user.id,display_name:name,public_display_name:name}).select('*').single();if(i.error)throw i.error;profile=i.data}else profile=r.data;for(const id of ['first_name','last_name','display_name','public_display_name','country','public_phone','bio','smartlink_slug'])$(id).value=profile[id]||'';$('phone_public').checked=!!profile.phone_public;$('avatar_url').value=profile.avatar_url||profile.profile_image_url||profile.profile_photo_url||'';renderAvatar()}function renderAvatar(){const u=$('avatar_url').value.trim();$('avatar').src=u||'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="90" height="90"><rect width="100%" height="100%" rx="45" fill="#e8a83c"/><text x="50%" y="58%" text-anchor="middle" font-size="38">👤</text></svg>')}$('avatar_url').oninput=renderAvatar;$('form').onsubmit=async e=>{e.preventDefault();status('Enregistrement…',true);const data={first_name:$('first_name').value.trim()||null,last_name:$('last_name').value.trim()||null,display_name:$('display_name').value.trim(),public_display_name:$('public_display_name').value.trim()||$('display_name').value.trim(),country:$('country').value.trim()||null,public_phone:$('public_phone').value.trim()||null,phone_public:$('phone_public').checked,bio:$('bio').value.trim()||null,smartlink_slug:$('smartlink_slug').value.trim()||null,avatar_url:$('avatar_url').value.trim()||null};if(!data.display_name)return status('Le nom affiché est obligatoire.');const r=await db.from('profiles').update(data).eq('user_id',user.id).select('*').single();if(r.error){status(r.error.message);return}profile=r.data;status('Profil enregistré avec succès.','ok');renderAvatar()};$('logout').onclick=async()=>{await db.auth.signOut();location.href='/auth'};try{await boot()}catch(e){status('Impossible de charger le profil : '+(e.message||e))}})();</script></body></html>
