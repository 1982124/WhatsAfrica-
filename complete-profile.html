<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#075e54"><title>WASSAFRICA — Compléter mon profil</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#071b16;color:#f5f7f3;font:16px system-ui,-apple-system,sans-serif;display:grid;place-items:center}.card{width:min(520px,calc(100% - 28px));background:#f7f1df;color:#17211d;border-radius:24px;padding:26px;box-shadow:0 20px 70px #0005}.brand{font-weight:950;font-size:22px;color:#176b46;margin-bottom:22px}.brand span{color:#b78221}.ey{font-size:11px;font-weight:900;letter-spacing:1.8px;color:#9a7127;text-transform:uppercase}.card h1{font-size:32px;margin:8px 0}.lead{color:#69736e;line-height:1.5}.label{display:block;font-size:11px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:#65716b;margin:18px 0 7px}input,select{width:100%;height:50px;border:1px solid #d7d1c4;border-radius:14px;background:#fffdf8;padding:0 14px;font:inherit;color:#17211d}.btn{width:100%;height:50px;border:0;border-radius:14px;background:#1d744a;color:white;font-weight:900;margin-top:18px;cursor:pointer}.status{margin-top:14px;padding:11px 13px;border-radius:12px;background:#e9eee9;color:#3d5d4d;font-size:13px}.error{background:#ffe8e6;color:#9b2d25}.small{font-size:12px;color:#7a817d;margin-top:12px}</style><script src="/brand-normalizer.js"></script></head><body><main class="card"><div class="brand">WASSAFRICA <span>✦</span></div><div class="ey">Dernière étape</div><h1>Complétez votre profil</h1><p class="lead">Votre compte est créé. Ajoutez les informations utiles, puis nous vous ramenons directement à votre conversation.</p><label class="label" for="name">Nom ou nom public</label><input id="name" autocomplete="name" placeholder="Votre nom"><label class="label" for="country">Pays</label><select id="country"><option value="">Choisir un pays</option><option>Mali</option><option>Bénin</option><option>Burkina Faso</option><option>Côte d’Ivoire</option><option>Sénégal</option><option>Togo</option><option>Cameroun</option><option>Niger</option><option>Nigeria</option><option>Ghana</option><option>France</option><option>États-Unis</option><option>Autre</option></select><button id="save" class="btn">Continuer vers ma conversation →</button><div id="status" class="status">Votre conversation visiteur est conservée pendant cette étape.</div><div class="small">Vous pourrez modifier ces informations plus tard dans votre compte.</div></main><script>(async()=>{const URL='https://dzifpwqrqnvssfhwjccj.supabase.co',KEY='sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV',db=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:localStorage,storageKey:'whatsafrica-auth'}}),$=id=>document.getElementById(id),params=new URLSearchParams(location.search),next=params.get('next')||'/inbox',status=(t,e=false)=>{$('status').textContent=t;$('status').className='status'+(e?' error':'')};function safeNext(n){return /^\/(?!\/)/.test(n)?n:'/inbox'}const {data}=await db.auth.getSession();if(!data.session){location.href='/auth?next='+encodeURIComponent(safeNext(next));return}const u=data.session.user,p=u.user_metadata||{};$('name').value=p.full_name||p.name||u.phone||u.email?.split('@')[0]||'';$('save').onclick=async()=>{const name=$('name').value.trim();const country=$('country').value;if(name.length<2){status('Indiquez au moins un nom ou nom public.',true);return}$('save').disabled=true;try{const {error}=await db.from('profiles').upsert({user_id:u.id,display_name:name,public_display_name:name,country:country||null,country_public:true,phone_public:false,identity_mode:'pseudo',avatar_mode:'initials',template:'default',accent_color:'#08783b'},{onConflict:'user_id'});if(error)throw error;location.href=safeNext(next)}catch(e){status('Impossible d’enregistrer le profil : '+(e.message||String(e)),true);$('save').disabled=false}}})();</script></body></html>
