<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#075e54"><title>Communauté — WASSAFRICA</title><style>/* WhatsAfrica community detail v2: member-first messaging flow */body{margin:0;background:#f6f8f5;color:#172019;font:15px system-ui,-apple-system,sans-serif}.wrap{max-width:900px;margin:auto;padding:16px}.top{background:#062e20;color:#fff}.topin{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{color:#fff;text-decoration:none;font-size:22px;font-weight:950}.brand b{color:#e7b735}.btn{border:1px solid #dfe7e1;background:#fff;border-radius:11px;padding:10px 13px;font-weight:850;cursor:pointer;text-decoration:none;color:#172019;display:inline-flex;justify-content:center}.primary{background:#075e54;border-color:#075e54;color:#fff}.hero,.members,.postbox,.post{margin-top:14px;background:#fff;border:1px solid #dfe7e1;border-radius:18px;padding:16px}.hero{overflow:hidden;padding:0}.hero img{width:100%;height:280px;object-fit:cover;display:block}.body{padding:20px}.pill{font-size:11px;font-weight:900;color:#075e54}h1{font:800 clamp(34px,7vw,54px)/1 Georgia,serif;margin:8px 0}.muted{color:#68746e;line-height:1.55}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.members-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.member{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid #dfe7e1}.member:first-child{border-top:0}.avatar{width:48px;height:48px;border-radius:50%;background:#d9e8e4;display:grid;place-items:center;color:#075e54;font-weight:900;flex:none;background-size:cover;background-position:center}.member-main{min-width:0;flex:1}.member-name{font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.member-meta{font-size:12px;color:#68746e}.message{white-space:nowrap}.postbox textarea{width:100%;min-height:90px;border:1px solid #dfe7e1;border-radius:12px;padding:11px;font:inherit;box-sizing:border-box}.postbox button{margin-top:9px}.post time{display:block;color:#68746e;font-size:12px;margin-top:8px}.status{min-height:22px;margin-top:8px}.err{color:#a32121;font-weight:800}.ok{color:#087b45;font-weight:800}.empty{padding:20px;text-align:center;color:#68746e}@media(max-width:560px){.wrap{padding:10px}.hero img{height:220px}.actions .btn{width:100%}.member .message{padding:9px 10px}.members{padding:14px}.members-head{align-items:flex-start;flex-direction:column}.member{gap:9px}.avatar{width:44px;height:44px}}</style><script src="/brand-normalizer.js"></script>
<script src="/brand-observer.js"></script></head><body><header class="top"><div class="wrap topin"><a class="brand" href="/">WASSAFRICA</a><a class="btn" href="/groups">← Communautés</a></div></header><main class="wrap"><section id="hero" class="hero"><div class="body">Chargement…</div></section><section class="members"><div class="members-head"><div><h2 style="margin:0">👥 Membres de la communauté</h2><div id="memberHint" class="muted">Choisissez directement une personne pour lui écrire.</div></div><a class="btn primary" href="/inbox">💬 Discussions</a></div><div id="memberList"><div class="empty">Chargement des membres…</div></div><div id="memberStatus" class="status muted"></div></section><section id="composer" class="postbox" style="display:none"><b>💬 Participer à la discussion</b><textarea id="body" maxlength="4000" placeholder="Écrivez un message à la communauté…"></textarea><button id="publish" class="btn primary">Publier</button><div id="status" class="status muted"></div></section><section><h2>Discussion</h2><div id="posts"><div class="post muted">Chargement…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(function(){const db=supabase.createClient('https://dzifpwqrqnvssfhwjccj.supabase.co','sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV'),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));const id=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||'');let user=null,joined=false;async function session(){const r=await db.auth.getSession();return r.data.session}async function load(){if(!id)throw Error('Communauté introuvable.');const g=await db.from('groups').select('id,name,description,is_business,owner_slug,image_url,image_alt').eq('id',id).maybeSingle();if(g.error)throw g.error;if(!g.data)throw Error('Communauté introuvable.');const x=g.data;$('hero').innerHTML=`${x.image_url?`<img src="${esc(x.image_url)}" alt="${esc(x.image_alt||x.name)}">`:''}<div class="body"><span class="pill">${x.is_business?'💼 Communauté business':'👥 Communauté'}</span><h1>${esc(x.name)}</h1><p class="muted">${esc(x.description||'Un espace WhatsAfrica pour échanger et avancer ensemble.')}</p><div class="muted">Créée par ${esc(x.owner_slug||'un membre WhatsAfrica')}</div><div class="actions"><button id="join" class="btn primary">Rejoindre la communauté</button><button id="share" class="btn">↗️ Partager</button></div><div id="heroStatus" class="status muted"></div></div>`;const s=await session();user=s?.user||null;if(user){const m=await db.from('group_members').select('user_id').eq('group_id',id).eq('user_id',user.id).maybeSingle();joined=!!m.data;if(joined){$('join').textContent='✓ Vous êtes membre';$('join').disabled=true;$('composer').style.display='block'}}$('join').onclick=async()=>{const s=await session();if(!s){location.href='/auth?next='+encodeURIComponent(location.pathname);return}const r=await db.from('group_members').insert({group_id:id,user_id:s.user.id,role:'member'});if(r.error&&!String(r.error.message).toLowerCase().includes('duplicate')){$('heroStatus').textContent='Impossible de rejoindre : '+r.error.message;$('heroStatus').className='status err';return}joined=true;$('join').textContent='✓ Vous êtes membre';$('join').disabled=true;$('composer').style.display='block';await loadPosts();await loadMembers()};$('share').onclick=async()=>{try{if(navigator.share)await navigator.share({title:x.name,text:x.description||'Communauté WhatsAfrica',url:location.href});else{await navigator.clipboard.writeText(location.href);$('heroStatus').textContent='✓ Lien copié';$('heroStatus').className='status ok'}}catch(e){}};await loadMembers();await loadPosts()}async function loadMembers(){const r=await db.from('group_members').select('user_id,role,created_at').eq('group_id',id).order('created_at',{ascending:true}).limit(200);if(r.error){$('memberList').innerHTML='<div class="empty">La liste des membres est momentanément indisponible.</div>';return}const ms=r.data||[];if(!ms.length){$('memberList').innerHTML='<div class="empty">Aucun membre pour le moment.</div>';return}const ids=ms.map(x=>x.user_id);const p=await db.from('profiles').select('user_id,display_name,public_display_name,first_name,last_name,country,profile_image_url,profile_photo_url,avatar_url,public_phone,smartlink_slug').in('user_id',ids);const by=new Map((p.data||[]).map(x=>[x.user_id,x]));$('memberList').innerHTML=ms.map(m=>{const x=by.get(m.user_id)||{};const name=x.public_display_name||x.display_name||[x.first_name,x.last_name].filter(Boolean).join(' ')||'Membre WhatsAfrica';const avatar=x.avatar_url||x.profile_photo_url||x.profile_image_url||'';const canMsg=!!x.public_phone;return `<div class="member"><div class="avatar" ${avatar?`style="background-image:url('${esc(avatar)}')"`:''}>${avatar?'':esc(name.slice(0,1).toUpperCase())}</div><div class="member-main"><div class="member-name">${esc(name)} ${m.role==='owner'?'👑':''}</div><div class="member-meta">${esc(x.country||'Afrique')}${x.public_phone?' · Téléphone disponible':''}</div></div>${canMsg?`<button class="btn primary message" data-phone="${esc(x.public_phone)}" data-name="${esc(name)}">💬 Message</button>`:`<a class="btn message" href="/inbox">💬 Discussions</a>`}</div>`}).join('');document.querySelectorAll('[data-phone]').forEach(b=>b.onclick=()=>messageMember(b.dataset.phone,b.dataset.name))}async function messageMember(phone,name){$('memberStatus').className='status muted';$('memberStatus').textContent='Ouverture de la discussion avec '+name+'…';try{const s=await session();if(!s){location.href='/auth?next='+encodeURIComponent(location.pathname);return}const r=await db.rpc('start_direct_conversation_by_phone',{p_phone:phone});if(r.error)throw r.error;const x=r.data?.[0];if(!x)throw Error('CONTACT_NOT_FOUND');location.href='/inbox'}catch(e){$('memberStatus').textContent='Impossible d’ouvrir la discussion : '+(e.message||'erreur')+' — utilisez Discussions pour rechercher son numéro.';$('memberStatus').className='status err'}}async function loadPosts(){const r=await db.from('group_posts').select('id,body,created_at').eq('group_id',id).order('created_at',{ascending:false}).limit(50);if(r.error){$('posts').innerHTML='<div class="post err">Discussion momentanément indisponible.</div>';return}$('posts').innerHTML=r.data?.length?r.data.map(p=>`<article class="post"><div>${esc(p.body)}</div><time>${new Date(p.created_at).toLocaleString('fr-FR')}</time></article>`).join(''):'<div class="post muted">Aucun message pour le moment. Soyez le premier à lancer la discussion.</div>'}$('publish').onclick=async()=>{const s=await session();const text=$('body').value.trim();if(!s){location.href='/auth?next='+encodeURIComponent(location.pathname);return}if(!joined||!text)return;$('publish').disabled=true;$('status').textContent='Publication…';const r=await db.from('group_posts').insert({group_id:id,author_id:s.user.id,body:text});if(r.error){$('status').textContent='Impossible de publier : '+r.error.message;$('status').className='status err'}else{$('body').value='';$('status').textContent='✓ Message publié';$('status').className='status ok';await loadPosts()}$('publish').disabled=false};load().catch(e=>{$('hero').innerHTML='<div class="body"><b>Communauté introuvable.</b><p><a class="btn primary" href="/groups">Retour aux communautés</a></p></div>'})})();</script></body></html>
