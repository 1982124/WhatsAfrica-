<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WASSAFRICA — Radar par zones</title><style>body{font:15px system-ui;margin:0;background:#f5f7f4;color:#17211b}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #dfe5df;border-radius:18px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,button{font:inherit;padding:11px;border-radius:11px;border:1px solid #cfd7d0;width:100%;box-sizing:border-box}.btn{background:#1b4332;color:#fff;font-weight:800;cursor:pointer}.muted{color:#68746d}.empty{padding:20px;text-align:center;background:#f7f9f7;border-radius:14px}.row{padding:12px 0;border-bottom:1px solid #edf0ed}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf4ef;font-size:12px;font-weight:700}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><script src="/admin-sso.js"></script></head><body><div class="wrap"><p><a href="/admin-global-command.html">← Global Command Center</a></p><h1>📍 Radar mondial par zones</h1><p class="muted">Les pays et zones sont entièrement libres. Les produits sont facultatifs : le moteur les découvre automatiquement.</p><section class="card grid"><div><label><b>Pays, dans le même ordre que les zones</b></label><input id="countries" value="Chine, Mali, USA" placeholder="Chine, Mali, USA"></div><div><label><b>Villes / zones</b></label><input id="zones" value="Shanghai, Bamako, Baltimore" placeholder="Shanghai, Bamako, Baltimore"></div><div><label><b>Produits / services (facultatif)</b></label><input id="products" placeholder="Laisser vide = découverte automatique"></div><div><label><b>Fenêtre en heures</b></label><input id="hours" type="number" min="1" max="168" value="168"></div><button id="run" class="btn">🔎 Détecter les demandes</button></section><section id="out" class="card"><div class="empty">Prêt.</div></section></div><script>const $=id=>document.getElementById(id),csv=v=>String(v||'').split(',').map(x=>x.trim()).filter(Boolean),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function run(){const btn=$('run');btn.disabled=true;$('out').innerHTML='<div class="empty">Recherche publique par zone en cours…</div>';try{const s=await window.WA_ADMIN_SSO.requireAdmin();if(!s?.session)return;const countries=csv($('countries').value),zones=csv($('zones').value),products=csv($('products').value),locations=zones.map((location,i)=>({country:countries[i]||countries[0]||'',location})).filter(x=>x.country);if(!locations.length)throw Error('Indiquez au moins un pays et une zone.');const q=new URLSearchParams({mode:'geo-radar',hours:String($('hours').value||168),locations:JSON.stringify(locations)});if(products.length)q.set('products',products.join(','));const r=await fetch('/api/demand-report?'+q,{headers:{Authorization:'Bearer '+s.session.access_token},cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.web_error_message||d.error||d.reason||'Recherche indisponible');let h='<h2>Résultats</h2><p><b>'+esc(d.discovered_count)+'</b> produits/besoins · <b>'+esc(d.signal_count)+'</b> signaux · <b>'+esc(d.community_count)+'</b> communautés · <b>'+esc(d.contact_count)+'</b> contacts publics</p>';for(const z of d.zones||[]){h+='<div class="card"><h3>📍 '+esc(z.country)+' — '+esc(z.location)+'</h3>';if(!z.products?.length){h+='<div class="empty">Aucun signal suffisamment documenté.</div>'}else for(const p of z.products){const e=p.evidence?.[0];h+='<div class="row"><b>'+esc(p.product)+'</b> · '+esc(p.signal_count)+' signal(s) · '+esc(p.confidence)+'<br><span class="muted">'+esc(p.intent||'')+'</span>'+(e?.source_url?'<br><a href="'+esc(e.source_url)+'" target="_blank" rel="noopener">'+esc(e.source_title||'Source')+'</a>':'')+'</div>'}h+='</div>'}$('out').innerHTML=h}catch(e){$('out').innerHTML='<div class="empty"><b>🟡 Recherche indisponible</b><br>'+esc(e.message)+'</div>'}finally{btn.disabled=false}}$('run').onclick=run;</script></body></html>
