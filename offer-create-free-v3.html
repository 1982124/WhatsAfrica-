<!doctype html><html lang="fr"><head><script src="/i18n.js" defer></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>WASSAFRICA — Créer</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--g:#173d2d;--gold:#e7a72f;--bg:#f7f3e9;--ink:#18231e;--muted:#68746d;--line:#ddd9cf}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui}.wrap{max-width:960px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-weight:950;font-size:22px;color:var(--g);text-decoration:none}.btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 15px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-weight:900;text-decoration:none;cursor:pointer}.primary{background:var(--g);border-color:var(--g);color:#fff}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;margin-top:14px}.hero{background:linear-gradient(135deg,#173d2d,#245941);color:#fff}.hero h1{font:800 clamp(34px,6vw,58px)/1.02 Georgia;margin:8px 0}.hero p{color:#dcebe3}.types{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.type{border:1px solid #ffffff33;background:#ffffff10;color:#fff;border-radius:16px;padding:15px;text-align:left;cursor:pointer}.type.active{border-color:var(--gold);box-shadow:0 0 0 2px #e7a72f55}.type b{display:block}.type span{font-size:12px;color:#dcebe3}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-top:12px}.field label{display:block;font-size:12px;font-weight:900;margin-bottom:6px}.input,.field textarea,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;font:inherit}.hidden{display:none!important}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.status{min-height:22px;margin-top:10px;font-weight:800}.ok{color:#287a4d}.err{color:#b42318}.result a{margin-top:8px}@media(max-width:680px){.types,.grid{grid-template-columns:1fr}.actions .btn{width:100%}}</style><script src="/brand-normalizer.js"></script><script src="/brand-observer.js"></script></head><body><main class="wrap"><header class="top"><a class="brand" href="/dashboard">WASSAFRICA</a><a class="btn" href="/dashboard">← Cockpit</a></header><section class="hero"><div style="font-size:11px;font-weight:950;letter-spacing:2px;color:#f7d98c">COMMERCE · GRATUIT AU DÉMARRAGE</div><h1>Créez ce que vous vendez.</h1><p>Produit physique, produit digital ou service. Votre première offre peut être créée et publiée sans abonnement obligatoire.</p><div class="types"><button class="type active" data-type="physical"><b>🛍️ Produit physique</b><span>Objet, marchandise, stock</span></button><button class="type" data-type="digital"><b>📚 Produit digital</b><span>PDF, audio, vidéo, formation, fichier</span></button><button class="type" data-type="service"><b>🧰 Service</b><span>Prestation à distance ou sur place</span></button></div></section><section id="gate" class="card">Vérification…</section><section id="editor" class="card hidden"><form id="form"><div class="grid"><div class="field"><label>Nom *</label><input id="title" class="input" required></div><div class="field"><label>Catégorie</label><input id="category" class="input"></div><div class="field" style="grid-column:1/-1"><label>Description</label><textarea id="description" rows="4" class="input"></textarea></div><div class="field"><label>Prix</label><input id="price" class="input" type="number" min="0" value="0"></div><div class="field"><label>Devise</label><input id="currency" class="input" value="XOF"></div></div><div id="physical"><div class="field"><label>Stock</label><input id="stock" class="input" type="number" min="0" value="0"></div><div class="field"><label>📸 Photo</label><input id="cover" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></div></div><div id="digital" class="hidden"><div class="field"><label>📸 Couverture</label><input id="digitalCover" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></div><div class="field"><label>📁 Fichier vendu *</label><input id="digitalFile" type="file"></div></div><div id="service" class="hidden"><div class="grid"><div class="field"><label>Mode</label><select id="serviceMode" class="input"><option value="remote">À distance</option><option value="onsite">Sur place</option><option value="hybrid">Hybride</option></select></div><div class="field"><label>Catégorie de service</label><input id="serviceCategory" class="input"></div></div><div class="field"><label>📸 Image du service</label><input id="serviceCover" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></div></div><div class="actions"><button id="draft" class="btn" type="button">Brouillon</button><button class="btn primary" type="submit">Publier</button><a class="btn" href="/market">Marché</a></div><div id="msg" class="status"></div></form></section><section id="result" class="card hidden"><h2>Votre page est prête</h2><div id="resultBody" class="result"></div></section></main><script>(async()=>{const db=supabase.createClient('https://dzifpwqrqnvssfhwjccj.supabase.co','sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),$=id=>document.getElementById(id);let user,biz,type=new URLSearchParams(location.search).get('type')||'physical';const esc=x=>String(x??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));const slug=x=>String(x||'activite').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'activite';const setType=t=>{type=['physical','digital','service'].includes(t)?t:'physical';document.querySelectorAll('.type').forEach(b=>b.classList.toggle('active',b.dataset.type===type));['physical','digital','service'].forEach(x=>$(x).classList.toggle('hidden',x!==type))};document.querySelectorAll('.type').forEach(b=>b.onclick=()=>setType(b.dataset.type));setType(type);const status=(t,ok=false)=>$('msg').innerHTML='<span class="'+(ok?'ok':'err')+'">'+esc(t)+'</span>';async function upload(bucket,file,path,max){if(!file)return null;if(file.size>max)throw Error('Fichier trop volumineux.');const r=await db.storage.from(bucket).upload(path,file,{upsert:false,contentType:file.type||'application/octet-stream'});if(r.error)throw r.error;return db.storage.from(bucket).getPublicUrl(path).data.publicUrl}async function bootstrap(){const s=await db.auth.getSession();user=s.data?.session?.user;if(!user){$('gate').innerHTML='<b>Connexion requise.</b><p class="muted">Votre destination sera conservée.</p><a class="btn primary" href="/auth?next='+encodeURIComponent(location.pathname+location.search)+'">Se connecter</a>';return}let r=await db.from('businesses').select('id,name,slug,owner_id').eq('owner_id',user.id).maybeSingle();if(r.error)throw r.error;if(!r.data){const base=slug(user.user_metadata?.full_name||user.email?.split('@')[0]||'activite');r=await db.from('businesses').insert({owner_id:user.id,name:user.user_metadata?.full_name||'Mon activité WASSAFRICA',slug:base,smartlink_tier:'free',is_personal:true,business_type:'business',activity:'Activité'}).select('id,name,slug,owner_id').single();if(r.error)throw r.error}biz=r.data;const l=await db.from('smart_links').select('id,slug').eq('business_id',biz.id).eq('is_public',true).maybeSingle();if(!l.data){const q=await db.from('smart_links').insert({business_id:biz.id,owner_id:user.id,slug:biz.slug,title:biz.name,is_public:true}).select('id,slug').single();if(q.error)throw q.error}$('gate').innerHTML='<b>🟢 '+esc(biz.name)+'</b><p class="muted">Votre espace commercial est prêt.</p>';$('editor').classList.remove('hidden')}async function create(publish){const title=$('title').value.trim();if(!title)throw Error('Le nom est requis.');const id=crypto.randomUUID();if(type==='service'){const f=$('serviceCover').files[0],image=f?await upload('product-media',f,user.id+'/service-'+id+'-'+f.name.replace(/[^a-zA-Z0-9._-]+/g,'-'),10*1024*1024):null;const r=await db.from('marketplace_services').insert({id,seller_id:user.id,title,description:$('description').value.trim()||'Service WASSAFRICA',category:$('serviceCategory').value.trim()||$('category').value.trim()||'Service',price:Number($('price').value||0),currency:$('currency').value.trim()||'XOF',status:publish?'published':'draft',delivery_mode:$('serviceMode').value,metadata:{cover_url:image}}).select('id').single();if(r.error)throw r.error;return done('service',r.data.id,title,publish)}const cover=type==='digital'?$('digitalCover').files[0]:$('cover').files[0],image=cover?await upload('product-media',cover,user.id+'/'+id+'-cover-'+cover.name.replace(/[^a-zA-Z0-9._-]+/g,'-'),10*1024*1024):null,file=type==='digital'?$('digitalFile').files[0]:null;if(type==='digital'&&!file)throw Error('Sélectionnez le fichier numérique.');let filePath=null;if(file){filePath=user.id+'/'+id+'/'+file.name.replace(/[^a-zA-Z0-9._-]+/g,'-');const r=await db.storage.from('digital-products').upload(filePath,file,{upsert:false,contentType:file.type||'application/octet-stream'});if(r.error)throw r.error}const r=await db.from('products').insert({id,business_id:biz.id,title,description:$('description').value.trim()||null,price:Number($('price').value||0),currency:$('currency').value.trim()||'XOF',category:$('category').value.trim()||null,stock:type==='physical'?Number($('stock').value||0):null,is_published:!!publish,product_type:type,image_url:image,digital_storage_path:filePath,digital_file_name:file?.name||null,digital_mime_type:file?.type||null,digital_byte_size:file?.size||null}).select('id').single();if(r.error)throw r.error;return done(type,r.data.id,title,publish)}function done(kind,id,title,publish){$('result').classList.remove('hidden');$('resultBody').innerHTML='<b>'+esc(publish?'Publication réussie':'Brouillon enregistré')+'</b><div>'+esc(title)+'</div>'+(publish?'<a class="btn primary" href="/'+encodeURIComponent(biz.slug)+'">Voir ma vitrine</a>':'')+(publish?'<a class="btn" href="/'+kind+'/'+encodeURIComponent(id)+'">Ouvrir la page dédiée</a>':'');status(publish?'Publié.':'Brouillon enregistré.',true)}$('draft').onclick=()=>create(false).catch(e=>status(e.message||'Impossible de créer'));$('form').onsubmit=e=>{e.preventDefault();create(true).catch(e=>status(e.message||'Publication impossible'))};await bootstrap()})().catch(e=>{$('gate').innerHTML='<span class="err">'+String(e.message||e).replace(/[<>]/g,'')+'</span>'})</script></body></html>
