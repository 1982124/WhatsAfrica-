<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120f1f"><meta name="description" content="WhatsAfrica — Smart Link, assistant commercial, commande, paiement et communauté.">
<title>WhatsAfrica — Smart Link</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#100d19;--panel:#1b1730;--panel2:#241f3c;--gold:#e8a83c;--teal:#17a889;--text:#f8f3e7;--muted:#a9a2b7;--line:#ffffff18;--danger:#d8644d;--ok:#69d7a7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#30264e,#100d19 48%);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{max-width:860px;margin:auto;padding:0 16px}.nav{position:sticky;top:0;z-index:20;background:#100d19ed;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.navrow{min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font:bold 20px Georgia;text-decoration:none;color:var(--text)}.brand b{color:var(--gold)}.btn{border:0;border-radius:999px;padding:11px 16px;font-weight:850;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}.primary{background:var(--gold);color:#17120b}.secondary{background:transparent;color:var(--text);border:1px solid var(--line)}.danger{background:#d8644d;color:white}.hero{text-align:center;padding:38px 0 22px}.avatar{width:92px;height:92px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);margin:auto auto 13px;display:block;background:var(--gold)}.eyebrow{font:10px monospace;letter-spacing:2px;color:var(--teal);text-transform:uppercase}.hero h1,h2{font-family:Georgia,serif}.hero h1{font-size:34px;margin:8px 0}.bio,.desc{color:#f8f3e7aa;line-height:1.6}.meta{font-size:13px;color:var(--muted)}.card,.assistant,.checkout,.success{background:linear-gradient(145deg,#211b38,#18142a);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.product-img{width:100%;max-height:340px;object-fit:cover;border-radius:12px}.prodrow{display:flex;justify-content:space-between;gap:12px;margin-top:11px}.price{color:var(--gold);font-weight:900;white-space:nowrap}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions .btn{flex:1;min-width:145px}.chat{height:290px;overflow:auto;background:#0c0a12;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}.bubble{max-width:88%;padding:9px 12px;border-radius:15px;white-space:pre-wrap;line-height:1.45}.bot{background:#ffffff0b}.user{align-self:flex-end;background:var(--teal);color:#05271f}.composer{display:flex;gap:8px;margin-top:9px}.composer input{flex:1;min-width:0;padding:11px;border-radius:999px;border:1px solid var(--line);background:#11101b;color:white}.field{margin:11px 0}.field label{display:block;font-size:12px;color:#ffffff88;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:#11101b;color:var(--text)}.field textarea{min-height:75px;resize:vertical}.choice{display:flex;gap:10px;flex-wrap:wrap}.choice label{flex:1;min-width:150px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#ffffff06;cursor:pointer}.choice input{margin-right:7px}.summary{display:flex;justify-content:space-between;padding:7px 0;color:#ffffffbb}.summary.total{border-top:1px solid var(--line);padding-top:12px;margin-top:8px;font-size:18px;font-weight:900;color:var(--text)}.notice{padding:10px 12px;border-radius:10px;background:#17a88918;color:#9cebd7;font-size:13px}.error{padding:10px 12px;border-radius:10px;background:#d8644d18;color:#ffc0b2;font-size:13px}.paybox{padding:14px;border-radius:14px;background:#e8a83c12;border:1px solid #e8a83c35}.linkpill{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;color:#fff}.footer{text-align:center;color:#ffffff55;padding:28px 0 42px;font-size:12px}.empty{text-align:center;padding:55px 10px;color:#ffffff77}.hidden{display:none!important}.track{font-family:monospace;word-break:break-all;color:var(--gold)}@media(max-width:560px){.prodrow{flex-direction:column}.actions .btn{width:100%;min-width:0}.navrow{padding:8px 0}.hero h1{font-size:29px}.wrap{padding:0 12px}}
</style>
</head>
<body>
<header class="nav"><div class="wrap navrow"><a class="brand" href="/">Whats<b>Africa</b></a><a class="btn secondary" href="/">Découvrir</a></div></header>
<main class="wrap" id="page"><div class="empty">Chargement…</div></main>
<footer class="wrap footer">WhatsAfrica — Communiquez. Découvrez. Vendez.</footer>
<script>
const SUPABASE_URL='https://dzifpwqrqnvssfhwjccj.supabase.co';
const SUPABASE_KEY='sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const slug=decodeURIComponent(location.pathname.replace(/^\/+/, '').split('/')[0]||'');
let link=null,business=null,products=[],statuses=[],paymentLinks=[],chatHistory=[],selectedProduct=null,orderResult=null;
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>\'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[m]));
const img=v=>{try{const u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:null}catch{return null}};
const money=(v,c='XOF')=>new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0}).format(Number(v||0))+' '+c;
function event(type,entityType=null,entityId=null,metadata={}){if(!link?.id)return;db.from('smart_link_events').insert({smart_link_id:link.id,event_type:type,entity_type:entityType,entity_id:entityId,metadata}).then(()=>{});}
async function load(){
 if(!slug)return fail('Smart Link introuvable','Le lien est incomplet.');
 const r=await db.from('smart_links').select('id,business_id,owner_id,slug,title,description,is_public').eq('slug',slug).eq('is_public',true).maybeSingle();
 if(r.error||!r.data)return fail('Smart Link introuvable','Cette vitrine n’existe pas ou n’est pas publique.');
 link=r.data;
 const b=link.business_id?await db.from('businesses').select('id,name,description,country,city,logo_url,template,accent_color,phone,delivery_enabled,delivery_fee,payment_methods').eq('id',link.business_id).maybeSingle():null;
 business=b?.data||{name:link.title,description:link.description,payment_methods:['cash_on_delivery']};
 if(link.business_id){const p=await db.from('products').select('id,title,description,price,currency,image_url,category,stock,is_published').eq('business_id',link.business_id).eq('is_published',true).order('created_at',{ascending:false}).limit(60);products=p.data||[]}
 const s=await db.from('statuses').select('id,text_content,image_url,caption,media_type,created_at,expires_at').eq('owner_id',link.owner_id).gt('expires_at',new Date().toISOString()).order('created_at',{ascending:false}).limit(6);statuses=s.data||[];
 const pl=await db.from('public_payment_links').select('id,business_id,product_id,smart_link_id,provider,label,url,is_active').eq('is_active',true).or('smart_link_id.eq.'+link.id+(link.business_id?',business_id.eq.'+link.business_id:''));
 paymentLinks=pl.data||[];
 document.documentElement.style.setProperty('--gold',business.accent_color||'#e8a83c');
 event('smart_link_opened','smart_link',link.id);
 render();
}
function fail(a,b){$('page').innerHTML='<section class="empty"><div class="eyebrow">WHATS AFRICA</div><h1>'+esc(a)+'</h1><p class="bio">'+esc(b)+'</p><a class="btn primary" href="/">Ouvrir WhatsAfrica</a></section>'}
function paymentForProduct(id){return paymentLinks.filter(x=>x.product_id===id||x.smart_link_id===link.id||x.business_id===link.business_id)}
function render(){
 const name=business.name||link.title||'Entreprise WhatsAfrica';const logo=img(business.logo_url);const avatar=logo?'<img class="avatar" src="'+esc(logo)+'" alt="'+esc(name)+'">':'<div class="avatar" style="display:flex;align-items:center;justify-content:center;font:bold 25px Georgia;color:#120f19">'+esc(name.slice(0,2).toUpperCase())+'</div>';
 const productsHtml=products.length?products.map(p=>{const image=img(p.image_url),price=p.price!==null&&p.price!==''?money(p.price,p.currency||'XOF'):'Prix sur demande',stock=p.stock===0?'Rupture de stock':p.stock>0?'Disponible':'';const pays=paymentForProduct(p.id);return '<article class="card">'+(image?'<img class="product-img" src="'+esc(image)+'" alt="'+esc(p.title)+'" loading="lazy">':'')+'<div class="prodrow"><div><strong>'+esc(p.title)+'</strong><div class="desc">'+esc(p.description||'')+'</div>'+(stock?'<div class="meta">'+esc(stock)+'</div>':'')+'</div><div class="price">'+price+'</div></div><div class="actions">'+(p.stock===0?'<button class="btn secondary" disabled>Indisponible</button>':'<button class="btn primary" data-buy="'+esc(p.id)+'">🛒 Commander</button>')+(pays.length?'<button class="btn secondary" data-pay="'+esc(p.id)+'">💳 Payer maintenant</button>':'')+'<button class="btn secondary" data-share="'+esc(p.title)+'">↗️ Partager</button></div></article>'}).join(''):'<div class="card"><div class="desc">Aucun produit publié pour le moment.</div></div>';
 const statusHtml=statuses.length?'<section><h2>Actualités</h2>'+statuses.map(s=>{const i=img(s.image_url);return '<article class="card">'+(s.caption||s.text_content?'<div>'+esc(s.caption||s.text_content)+'</div>':'')+(i?'<img class="product-img" src="'+esc(i)+'" alt="" loading="lazy">':'')+'</article>'}).join('')+'</section>':'';
 $('page').innerHTML='<section class="hero">'+avatar+'<div class="eyebrow">SMART LINK PUBLIC</div><h1>'+esc(name)+'</h1><p class="bio">'+esc(business.description||link.description||'Découvrez cette activité sur WhatsAfrica.')+'</p>'+(business.city||business.country?'<div class="meta">'+esc([business.city,business.country].filter(Boolean).join(' · '))+'</div>':'')+'<div class="actions" style="max-width:600px;margin:16px auto"><button class="btn primary" id="sharePage">🔗 Partager</button><button class="btn secondary" id="askTop">💬 Assistant commercial</button></div></section><section><h2>Produits & services</h2>'+productsHtml+'</section>'+statusHtml+'<section class="assistant" id="assistant"><div class="eyebrow">VOTRE ASSISTANT COMMERCIAL</div><h2>Une question ?</h2><p class="desc">Votre assistant vous aide à choisir, comprendre et commander.</p><div id="chat" class="chat"><div class="bubble bot">Bonjour 👋 Je suis votre assistant commercial. Que souhaitez-vous savoir ?</div></div><div class="composer"><input id="q" maxlength="2000" placeholder="Ex. Quel produit me conseillez-vous ?"><button class="btn primary" id="send">Envoyer</button></div><div class="actions"><button class="btn secondary" data-quick="💰 Quels sont les prix ?">💰 Prix</button><button class="btn secondary" data-quick="📦 Qu’est-ce qui est disponible ?">📦 Disponibilité</button><button class="btn secondary" data-quick="🚚 Livrez-vous ?">🚚 Livraison</button><button class="btn secondary" data-quick="🛒 Je veux commander">🛒 Commander</button></div></section><section class="card"><div class="eyebrow">APRÈS-VENTE</div><h2>Une relation qui continue</h2><p class="desc">Après votre commande, vous pourrez contacter le vendeur et rejoindre sa communauté de clients, si elle est proposée.</p></section>';
 bind();
}
function bind(){
 $('sharePage').onclick=()=>share(business.name||link.title);$('askTop').onclick=()=>$('assistant').scrollIntoView({behavior:'smooth'});
 document.querySelectorAll('[data-share]').forEach(b=>b.onclick=()=>share(b.dataset.share));
 document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{selectedProduct=products.find(p=>p.id===b.dataset.buy);if(selectedProduct){event('checkout_started','product',selectedProduct.id);checkout()}});
 document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>showPaymentChooser(products.find(p=>p.id===b.dataset.pay)));
 document.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>sendMessage(b.dataset.quick));$('send').onclick=()=>sendMessage($('q').value);$('q').onkeydown=e=>{if(e.key==='Enter')sendMessage($('q').value)};
}
async function share(title){const data={title,text:'Découvrez '+title+' sur WhatsAfrica',url:location.href};if(navigator.share)navigator.share(data).catch(()=>{});else if(navigator.clipboard)await navigator.clipboard.writeText(location.href);event('smart_link_shared','smart_link',link.id,{title})}
function append(role,text){const d=document.createElement('div');d.className='bubble '+(role==='user'?'user':'bot');d.textContent=text;$('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight;return d}
async function sendMessage(text){const t=String(text||'').trim();if(!t)return;append('user',t);$('q').value='';const p=append('bot','…');try{const payload={message:t,history:chatHistory.slice(-10),business:{display_name:business.name,country:business.country,bio:business.description,smartlink_slug:slug,delivery_enabled:!!business.delivery_enabled,delivery_fee:business.delivery_fee||0,payment_methods:business.payment_methods||['cash_on_delivery'],articles:products.map(x=>({id:x.id,title:x.title,description:x.description,price:x.price,currency:x.currency||'XOF',kind:'produit',stock:x.stock}))}};const r=await fetch('/api/assistant',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();p.remove();const a=d.answer||d.error||'Service momentanément indisponible.';append('bot',a);chatHistory.push({role:'user',content:t},{role:'assistant',content:a});event('assistant_message','smart_link',link.id,{length:t.length})}catch(e){p.remove();append('bot','Connexion momentanément indisponible. Vous pouvez contacter directement le vendeur.')}}
function showPaymentChooser(product){const links=paymentForProduct(product.id);if(!links.length)return;const html='<section class="paybox"><div class="eyebrow">PAIEMENT EXTERNE</div><h2>'+esc(product.title)+'</h2><p class="desc">WhatsAfrica vous redirige vers le prestataire choisi par le vendeur. Le paiement est confirmé par le prestataire, pas par un simple clic.</p><div class="actions">'+links.map(x=>'<button class="btn primary" data-external="'+esc(x.id)+'">💳 '+esc(x.label||x.provider)+'</button>').join('')+'</div><button class="btn secondary" id="closePay">Fermer</button></section>';$('page').insertAdjacentHTML('afterbegin',html);document.querySelectorAll('[data-external]').forEach(b=>b.onclick=()=>{const x=links.find(v=>v.id===b.dataset.external);if(!x)return;event('external_payment_clicked','payment_link',x.id,{provider:x.provider,product_id:product.id});window.open(x.url,'_blank','noopener,noreferrer')});$('closePay').onclick=()=>document.querySelector('.paybox')?.remove()}
function checkout(){const p=selectedProduct;$('page').innerHTML='<section class="checkout"><button class="btn secondary" id="back">← Retour</button><div class="eyebrow" style="margin-top:18px">COMMANDE</div><h1 style="font:600 30px Georgia,serif">Commander '+esc(p.title)+'</h1><div class="card"><div class="summary"><span>Produit</span><strong>'+esc(p.title)+'</strong></div><div class="summary"><span>Prix</span><strong>'+money(p.price,p.currency||'XOF')+'</strong></div></div><div class="field"><label>Nom complet *</label><input id="buyerName" autocomplete="name" placeholder="Votre nom"></div><div class="field"><label>Téléphone *</label><input id="buyerPhone" inputmode="tel" autocomplete="tel" placeholder="+223 …"></div><div class="field"><label>Ville</label><input id="buyerCity" autocomplete="address-level2" placeholder="Bamako"></div><div class="field"><label>Livraison</label><div class="choice"><label><input type="radio" name="delivery" value="pickup" checked> Retrait</label><label><input type="radio" name="delivery" value="delivery" '+(!business.delivery_enabled?'disabled':'')+'> Livraison</label></div></div><div class="field"><label>Adresse de livraison (si livraison)</label><textarea id="buyerAddress" autocomplete="street-address" placeholder="Quartier, rue, repère"></textarea></div><div class="field"><label>Paiement</label><div class="choice"><label><input type="radio" name="pay" value="cash_on_delivery" '+((business.payment_methods||[]).includes('cash_on_delivery')?'checked':'disabled')+'> À la livraison</label><label><input type="radio" name="pay" value="mobile_money" '+((business.payment_methods||[]).includes('mobile_money')?'':'disabled')+'> Mobile Money</label><label><input type="radio" name="pay" value="online" '+((business.payment_methods||[]).includes('online')?'':'disabled')+'> En ligne</label></div></div><div id="checkoutMsg"></div><button class="btn primary" id="placeOrder" style="width:100%;margin-top:10px">Confirmer la commande</button></section>';bindCheckout()}
function bindCheckout(){$('back').onclick=render;document.querySelectorAll('input[name=delivery]').forEach(x=>x.onchange=()=>{});$('placeOrder').onclick=createOrder}
async function createOrder(){const msg=$('checkoutMsg');msg.innerHTML='';const name=$('buyerName').value.trim(),phone=$('buyerPhone').value.trim(),delivery=document.querySelector('input[name=delivery]:checked')?.value,pay=document.querySelector('input[name=pay]:checked')?.value;if(name.length<2)return msg.innerHTML='<div class="error">Nom invalide.</div>';if(phone.replace(/\D/g,'').length<8)return msg.innerHTML='<div class="error">Téléphone invalide.</div>';if(!delivery||!pay)return msg.innerHTML='<div class="error">Choisissez livraison et paiement.</div>';const key=crypto.randomUUID()+'-'+crypto.randomUUID();const {data:userData}=await db.auth.getUser();try{$('placeOrder').disabled=true;$('placeOrder').textContent='Création…';const r=await db.rpc('create_guest_order',{p_business_id:business.id,p_smart_link_id:link.id,p_buyer_name:name,p_buyer_phone:phone,p_delivery_city:$('buyerCity').value.trim(),p_delivery_address:$('buyerAddress').value.trim(),p_delivery_method:delivery,p_payment_method:pay,p_items:[{product_id:selectedProduct.id,quantity:1}],p_idempotency_key:key,p_buyer_user_id:userData?.user?.id||null});if(r.error)throw r.error;orderResult=r.data;event('order_created','order',orderResult.order_id,{total:orderResult.total,currency:orderResult.currency,payment_method:pay});showSuccess(pay)}catch(e){msg.innerHTML='<div class="error">'+esc(e.message||'Commande impossible. Veuillez réessayer.')+'</div>';$('placeOrder').disabled=false;$('placeOrder').textContent='Confirmer la commande'}}
async function showSuccess(pay){const o=orderResult;let links=paymentForProduct(selectedProduct.id);let payment='';if(pay==='online'&&links.length){payment='<div class="paybox"><strong>Étape paiement</strong><p class="desc">Choisissez votre prestataire. WhatsAfrica ne marquera pas la commande comme payée sans confirmation vérifiable du prestataire.</p><div class="actions">'+links.map(x=>'<button class="btn primary" data-order-pay="'+esc(x.id)+'">💳 '+esc(x.label||x.provider)+'</button>').join('')+'</div></div>'}const {data:userData}=await db.auth.getUser();let conversation='<div class="notice">Connectez-vous pour ouvrir une conversation WhatsAfrica chiffrée avec le vendeur.</div><a class="btn secondary" href="/dashboard">Se connecter / créer mon compte</a>';if(userData?.user){try{const r=await db.rpc('start_order_conversation',{p_order_id:o.order_id});if(!r.error)conversation='<button class="btn primary" id="talkSeller">💬 Contacter le vendeur</button>'}catch(e){}}$('page').innerHTML='<section class="success"><div class="eyebrow">COMMANDE ENREGISTRÉE</div><h1 style="font:600 30px Georgia,serif">Merci pour votre commande</h1><p class="desc">Votre commande a été transmise au vendeur.</p><div class="card"><div class="summary"><span>Commande</span><strong class="track">#'+esc(String(o.order_id).slice(0,8))+'</strong></div><div class="summary"><span>Total</span><strong>'+money(o.total,o.currency)+'</strong></div><div class="summary"><span>Paiement</span><strong>'+esc(o.payment_status||'pending')+'</strong></div><div class="summary"><span>Suivi</span><strong class="track">'+esc(o.tracking_token||'')+'</strong></div></div>'+payment+'<div class="actions">'+conversation+'</div><div id="communityBox" class="card"><div class="eyebrow">FIDÉLISATION</div><h2>Rejoindre la communauté du vendeur</h2><p class="desc">Si une communauté clients existe, vous pourrez la rejoindre volontairement.</p><button class="btn secondary" id="joinCommunity">Découvrir la communauté</button></div><div class="actions"><button class="btn secondary" id="backHome">← Retour à la vitrine</button></div></section>';document.querySelectorAll('[data-order-pay]').forEach(b=>b.onclick=()=>{const x=links.find(v=>v.id===b.dataset.orderPay);if(!x)return;event('external_payment_clicked','payment_link',x.id,{provider:x.provider,order_id:o.order_id,product_id:selectedProduct.id});window.open(x.url,'_blank','noopener,noreferrer')});$('backHome').onclick=render;if($('talkSeller'))$('talkSeller').onclick=async()=>{const r=await db.rpc('start_order_conversation',{p_order_id:o.order_id});if(r.error)return alert('Impossible d’ouvrir la conversation.');event('seller_conversation_opened','order',o.order_id,{conversation_id:r.data});location.href='/inbox?conversation='+encodeURIComponent(r.data)};$('joinCommunity').onclick=async()=>{const {data:userData}=await db.auth.getUser();if(!userData?.user){alert('Connectez-vous pour rejoindre la communauté.');location.href='/dashboard';return}const r=await db.rpc('create_customer_community_invite',{p_order_id:o.order_id});if(r.error)return alert('Invitation indisponible pour le moment.');event('community_invite_created','order',o.order_id,{group_id:r.data?.group_id});if(r.data?.already_member)return $('communityBox').innerHTML='<div class="notice">Vous êtes déjà membre de cette communauté.</div>';if(r.data?.token){const url='/group-manager.html?invite='+encodeURIComponent(r.data.token);$('communityBox').innerHTML='<div class="notice">Votre invitation est prête. Vous choisissez vous-même de rejoindre la communauté.</div><a class="btn primary" href="'+url+'">Rejoindre la communauté</a>'}else $('communityBox').innerHTML='<div class="notice">Aucune communauté client n’est proposée pour cette activité.</div>'}}
load().catch(e=>fail('Service indisponible','Impossible de charger cette vitrine pour le moment.'));
</script>
</body>
</html>
