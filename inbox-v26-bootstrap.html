<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>WASSAFRICA — Messages</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f8f7;color:#18231d;font:15px system-ui,-apple-system,Segoe UI,sans-serif}.card{width:min(520px,calc(100% - 32px));padding:22px;border:1px solid #dde6e1;border-radius:20px;background:#fff;box-shadow:0 10px 35px #18231d0f;text-align:center}.muted{color:#738078;line-height:1.5}.err{color:#a52b22}</style>
</head>
<body><main class="card"><strong>WASSAFRICA · Messages</strong><p id="status" class="muted">Sécurisation de votre session…</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async()=>{
'use strict';
const URL='https://dzifpwqrqnvssfhwjccj.supabase.co';
const KEY='sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV';
const LEGACY='whatsafrica-auth';
const SHARED='sb-dzifpwqrqnvssfhwjccj-auth-token';
const status=document.getElementById('status');
const db=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function save(s){
  if(!s)return;
  const copy=JSON.stringify(s);
  try{localStorage.setItem(LEGACY,copy);localStorage.setItem(SHARED,copy)}catch{}
}
function valid(s){return !!(s&&s.access_token&&s.user&&s.user.id)}
try{
  let s=(await db.auth.getSession()).data.session||null;
  if(!valid(s)){await wait(250);s=(await db.auth.getSession()).data.session||null}
  if(valid(s)){
    save(s);
    try{sessionStorage.setItem('wa-inbox-session-bridge-v1','1')}catch{}
    location.replace('/inbox-v25.html');
    return;
  }
  status.innerHTML='<b>Connectez-vous pour accéder à vos messages.</b><br><br><a href="/auth?next=%2Finbox">Se connecter</a>';
}catch(e){
  status.className='muted err';
  status.textContent='Impossible de vérifier la session. Réessayez.';
}
})();
</script>
</body></html>
