<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>WASSAFRICA — Mes offres</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#f7f3e9;--card:#fff;--ink:#18231e;--muted:#68746d;--line:#ddd9cf;--green:#173d2d;--gold:#e7a72f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui}.wrap{max-width:980px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-weight:950;font-size:22px;color:var(--green);text-decoration:none}.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-weight:850;text-decoration:none;cursor:pointer}.primary{background:var(--green);border-color:var(--green);color:#fff}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px}.item{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;border-top:1px solid var(--line);padding:16px 0}.item:first-child{border-top:0}.title{font-weight:900;font-size:17px}.muted{color:var(--muted)}.price{font-size:18px;font-weight:950;margin-top:5px}.edit{display:flex;gap:7px;align-items:center}.edit input{width:150px;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit}.status{min-height:22px;margin-top:8px;font-weight:800}.ok{color:#16734b}.err{color:#b42318}@media(max-width:650px){.item{grid-template-columns:1fr}.edit{flex-wrap:wrap}.edit input{flex:1;min-width:130px}.edit .btn{flex:1}}</style></head><body><main class="wrap"><header class="top"><a class="brand" href="/dashboard">WASSAFRICA</a><a class="btn" href="/dashboard">← Cockpit</a></header><section class="card"><h1>Mes offres</h1><p class="muted">Modifiez le prix de vos produits à tout moment. La modification s'applique au catalogue publié après enregistrement.</p><div id="gate">Vérification de votre espace…</div></section><section id="list" class="card" hidden><div id="items"></div></section></main><script>
const db=supabase.createClient('https://dzifpwqrqnvssfhwjccj.supabase.co','sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.localStorage,storageKey:'whatsafrica-auth'}}),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function money(v,c){return new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0}).format(Number(v||0))+' '+(c||'XOF')}async function init(){try{const {data,error}=await db.auth.getSession();if(error)throw error;const user=data?.session?.user;if(!user){$('gate').innerHTML='<b>Connexion requise.</b><p class="muted">Connectez-vous pour gérer vos offres.</p><a class="btn primary" href="/auth?next=/my-offers.html">Se connecter</a>';return}const {data:b,error:be}=await db.from('businesses').select('id,name').eq('owner_id',user.id).maybeSingle();if(be)throw be;if(!b){$('gate').innerHTML='<b>Aucune activité commerciale trouvée.</b>';return}const {data:products,error:pe}=await db.from('products').select('id,title,price,currency,is_published,product_type').eq('business_id',b.id).order('created_at',{ascending:false});if(pe)throw pe;$('gate').innerHTML='<b>'+esc(b.name)+'</b><p class="muted">Vous êtes autorisé à modifier les offres de cette activité.</p>';$('list').hidden=false;const rows=products||[];$('items').innerHTML=rows.length?rows.map(p=>'<div class="item" data-id="'+esc(p.id)+'"><div><div class="title">'+esc(p.title)+'</div><div class="muted">'+(p.is_published?'Publié':'Brouillon')+(p.product_type==='digital'?' · Digital':'')+'</div><div class="price" id="price-'+p.id+'">'+money(p.price,p.currency)+'</div></div><div><div class="edit"><input id="input-'+p.id+'" type="number" min="0" step="1" value="'+esc(p.price)+'" aria-label="Nouveau prix de '+esc(p.title)+'"><button class="btn primary" data-save="'+esc(p.id)+'">Enregistrer</button></div><div class="status" id="status-'+p.id+'"></div></div></div>').join(''):'<p class="muted">Aucune offre à gérer.</p>';document.querySelectorAll('[data-save]').forEach(btn=>btn.onclick=()=>save(btn.dataset.save))}catch(e){console.error(e);$('gate').innerHTML='<b>Impossible de charger vos offres.</b><p class="muted">Réessayez dans un instant.</p>'}}async function save(id){const input=$('input-'+id),status=$('status-'+id),value=Number(input.value);if(!Number.isFinite(value)||value<0){status.className='status err';status.textContent='Prix invalide.';return}const btn=document.querySelector('[data-save="'+id+'"]');btn.disabled=true;status.className='status';status.textContent='Enregistrement…';const {data,error}=await db.from('products').update({price:value}).eq('id',id).select('id,price,currency').single();btn.disabled=false;if(error){status.className='status err';status.textContent='Modification refusée : '+(error.message||'vérifiez vos droits.');return}status.className='status ok';status.textContent='Prix enregistré.';$('price-'+id).textContent=money(data.price,data.currency)}init();
</script></body></html>
