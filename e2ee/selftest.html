<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WhatsAfrica — E2EE Self-Test</title><style>body{font:16px system-ui;max-width:900px;margin:40px auto;padding:0 16px;background:#090d17;color:#f8f5eb}pre{white-space:pre-wrap;background:#111827;border:1px solid #26334c;border-radius:14px;padding:16px}.ok{color:#57d39b}.warn{color:#e8a83c}</style></head><body><h1>WhatsAfrica E2EE — Browser Self-Test</h1><p>Test cryptographique local sans création de données de production.</p><pre id="out">Exécution…</pre><script src="/e2ee.js"></script><script>(async()=>{const o=document.getElementById('out'),L=[],pass=x=>L.push('🟢 '+x),fail=(x,e)=>L.push('🔴 '+x+' — '+String(e?.message||e));try{const c=window.WhatsAfricaCrypto;if(!c)throw Error('WhatsAfricaCrypto indisponible');const key=c.generateConversationKey(),text='WhatsAfrica E2EE self-test '+crypto.randomUUID(),mid=crypto.randomUUID(),cid=crypto.randomUUID(),env=await c.createEncryptedMessageEnvelope(text,cid,key,mid);if(!env.ciphertext||env.encryption_version!==1||env.id!==mid)throw Error('envelope invalide');if(env.ciphertext.includes(text))throw Error('plaintext détecté dans ciphertext');pass('AES-256-GCM : chiffrement');const row={id:mid,encryption_version:1,ciphertext:env.ciphertext,encryption_metadata:env.encryption_metadata};if(await c.decryptMessageEnvelope(row,key)!==text)throw Error('texte déchiffré différent');pass('AES-256-GCM : déchiffrement');let bad=false;try{await c.decryptMessageEnvelope(row,c.generateConversationKey())}catch{bad=true}if(!bad)throw Error('mauvaise clé acceptée');pass('AES-256-GCM : mauvaise clé rejetée');const a=await c.generateIdentity(),b=await c.generateIdentity(),pub=await c.exportJwk(b.publicKey),wrapped=await c.wrapKey(key,pub),unwrapped=await c.unwrapKey(wrapped,b.privateKey);if(Array.from(unwrapped).join(',')!==Array.from(key).join(','))throw Error('clé RSA différente');pass('RSA-OAEP-2048-SHA256 : enveloppe de clé');const tampered={...row,encryption_metadata:{...row.encryption_metadata,message_id:crypto.randomUUID()}};bad=false;try{await c.decryptMessageEnvelope(tampered,key)}catch{bad=true}if(!bad)throw Error('AAD tampering acceptée');pass('AES-GCM AAD : altération rejetée');L.push('','🟢 SELF-TEST LOCAL RÉUSSI','⚠️ Ceci ne certifie PAS encore A↔B avec deux sessions authentifiées.')}catch(e){fail('Self-test global',e)}o.textContent=L.join('\n')})()</script></body></html>
