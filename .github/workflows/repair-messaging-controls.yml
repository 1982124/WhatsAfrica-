name: Repair messaging controls

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair disabled messaging commands
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('messaging-v2.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
            '<button class="btn ghost" disabled>📞 Appel audio</button>': '<button id="quickAudio" class="btn ghost" type="button">📞 Appel audio</button>',
            '<button class="btn ghost" disabled>📹 Appel vidéo</button>': '<button id="quickVideo" class="btn ghost" type="button">📹 Appel vidéo</button>',
            '<button class="btn ghost" disabled>🎙️ Micro</button>': '<button id="quickVoice" class="btn ghost" type="button">🎙️ Micro</button>',
            '<button class="btn gold" disabled>➤ Envoyer</button>': '<button id="quickSend" class="btn gold" type="button">➤ Envoyer</button>',
            '<button class="btn ghost" disabled>▶ Lire</button>': '<button id="quickRead" class="btn ghost" type="button">▶ Lire</button>',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          marker = '</script></body></html>'
          addon = r'''<script>
          (function(){
            function byId(id){return document.getElementById(id)}
            function hasChat(){var c=byId('chat');return c&&!c.classList.contains('hide')}
            function focusStart(){var p=byId('phone');if(p){p.focus();p.scrollIntoView({behavior:'smooth',block:'center'})}}
            function focusComposer(){var b=byId('body');if(b){b.focus();b.scrollIntoView({behavior:'smooth',block:'center'})}}
            function clickIf(id){var e=byId(id);if(e&&!e.disabled)e.click()}
            byId('quickAudio')?.addEventListener('click',function(){if(hasChat())clickIf('audioCall');else focusStart()})
            byId('quickVideo')?.addEventListener('click',function(){if(hasChat())clickIf('videoCall');else focusStart()})
            byId('quickVoice')?.addEventListener('click',function(){if(hasChat())clickIf('voice');else focusStart()})
            byId('quickSend')?.addEventListener('click',function(){if(hasChat())focusComposer();else focusStart()})
            byId('quickRead')?.addEventListener('click',function(){
              if(!hasChat()){focusStart();return}
              var box=byId('messages');
              var b=box&&box.querySelector('button');
              if(b)b.click();else if(box)box.scrollTop=box.scrollHeight;
            })
            document.querySelectorAll('.guide div').forEach(function(card){
              card.style.cursor='pointer';card.setAttribute('role','button');
              card.addEventListener('click',function(){
                var text=(card.innerText||'').toLowerCase();
                if(text.includes('rechercher'))focusStart();
                else if(text.includes('écrire')){if(hasChat())focusComposer();else focusStart()}
                else if(text.includes('vocal')){if(hasChat())clickIf('voice');else focusStart()}
                else if(text.includes('appeler')){if(hasChat())clickIf('audioCall');else focusStart()}
              })
            })
          })();
          </script>'''
          if 'id="quickAudio"' in s and 'function focusStart()' not in s:
              s = s.replace(marker, '</script>'+addon+'</body></html>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name "WhatsAfrica CTO"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add messaging-v2.html
          git diff --cached --quiet || git commit -m "fix(messaging): make all command controls actionable"
          git push
