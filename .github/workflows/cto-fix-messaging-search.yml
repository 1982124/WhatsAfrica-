name: CTO finalize messaging search patch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove accidental literal newline escape and cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('inbox-v25.html')
          s = p.read_text(encoding='utf-8')
          old = '}\\nasync function send'
          new = '}\nasync function send'
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          git config user.name "WASSAFRICA CTO"
          git config user.email "cto@wassafrica.local"
          git add inbox-v25.html
          git rm .github/workflows/cto-fix-messaging-search.yml
          git diff --cached --quiet && exit 0 || true
          git commit -m "fix messaging search script syntax and cleanup"
          git push
