name: WASSAFRICA media read hotfix

on:
  push:
    paths:
      - .github/workflows/wa-media-read-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch private media read endpoint
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('inbox-v26.html')
          s = p.read_text(encoding='utf-8')
          old = "SB+'/storage/v1/object/'+encodeURIComponent('private-chat-media')+'/'+row.media_path,{headers:{apikey:KEY,Authorization:'Bearer '+session.access_token}}"
          new = "SB+'/storage/v1/object/authenticated/'+encodeURIComponent('private-chat-media')+'/'+row.media_path,{headers:{apikey:KEY,Authorization:'Bearer '+session.access_token}}"
          if old not in s:
              raise SystemExit('MEDIA_READ_PATTERN_NOT_FOUND')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "WASSAFRICA CTO"
          git config user.email "cto@wassafrica.local"
          git add inbox-v26.html
          git commit -m "fix(messaging): use authenticated private media endpoint"
          git push
