name: WASSAFRICA global brand check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.html'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify canonical WASSAFRICA branding without mutating source
        shell: python
        run: |
          from pathlib import Path
          import re

          forbidden = re.compile(r'Whats\s*Africa', re.I)
          bad = []

          for path in Path('.').rglob('*.html'):
              if any(part in {'.git', 'node_modules'} for part in path.parts):
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              parts = re.split(r'(<(?:script|style)\b[^>]*>.*?</(?:script|style)>)', text, flags=re.I | re.S)
              visible = ''.join(parts[i] for i in range(0, len(parts), 2))
              if forbidden.search(visible):
                  bad.append(str(path))

          if bad:
              print('Forbidden legacy visible brand found:')
              print('\n'.join(bad))
              raise SystemExit(1)
          print('Global brand check passed: no legacy visible brand detected.')
