name: patch inbox call bridge
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch inbox identity and calls
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('inbox-v25.html')
          s=p.read_text()
          changed=False
          old='<script src="/wa-media-p2p.js"></script><script src="/wa-message-invite.js"></script>'
          new='<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/wa-calls-v2.js"></script><script src="/wa-media-p2p.js"></script><script src="/wa-message-invite.js"></script><script src="/wa-inbox-call-bridge.js"></script>'
          if old in s:
              s=s.replace(old,new,1); changed=True
          marker='async function openConv(c){current=c;'
          repl='async function openConv(c){current=c;window.__WA_CURRENT_CONVERSATION_ID=c.id;'
          if marker in s and 'window.__WA_CURRENT_CONVERSATION_ID=c.id' not in s:
              s=s.replace(marker,repl,1); changed=True
          marker2="const av=document.createElement('div');av.className='avatar';av.textContent=(p.display_name||'W').trim().charAt(0).toUpperCase();const main=document.createElement('div');"
          repl2="const av=document.createElement('div');av.className='avatar';const photo=p.avatar_url||p.profile_image_url||p.profile_photo_url||'';if(photo){av.style.backgroundImage='url(\\\"'+String(photo).replace(/\\\"/g,'&quot;')+'\\\")';av.style.backgroundSize='cover';av.style.backgroundPosition='center';av.textContent=''}else av.textContent=(p.display_name||'W').trim().charAt(0).toUpperCase();const main=document.createElement('div');"
          if marker2 in s:
              s=s.replace(marker2,repl2,1); changed=True
          if not changed:
              print('No changes required; patch already present.')
          else:
              p.write_text(s)
              print('Inbox patched.')
          PY
      - name: Commit patch
        run: |
          git config user.name "WASSAFRICA CTO"
          git config user.email "cto@wassafrica.local"
          git add inbox-v25.html
          git diff --cached --quiet || git commit -m "fix inbox identity and call integration"
          git push
      - name: Remove one-shot workflow
        if: always()
        shell: bash
        run: |
          git rm -f .github/workflows/patch-inbox-call-bridge.yml || true
          git commit -m "chore: remove one-shot inbox bridge patch" || true
          git push || true
