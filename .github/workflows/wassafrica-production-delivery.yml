name: WASSAFRICA — Production Delivery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wassafrica-production
  cancel-in-progress: false

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@48.10.2

      - name: Static integrity gate
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jsfiles < <(find . -type f -name '*.js' -not -path './node_modules/*' -not -path './.git/*' | sort)
          for f in "${jsfiles[@]}"; do node --check "$f"; done
          test -f inbox.html
          test -f smartlink-public.html
          grep -Fq 'wa:inbox-ready' inbox.html
          grep -Fq 'smart_links' smartlink-public.html
          grep -Fq 'Strict-Transport-Security' vercel.json

      - name: Require Vercel access token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$VERCEL_TOKEN" ]]; then
            echo "::error::Missing GitHub Actions secret VERCEL_TOKEN. Add it in Settings > Secrets and variables > Actions. Never commit or paste the token into source code."
            exit 1
          fi

      - name: Pull production environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --scope="team_mx52snHfM2FwA3sXVop7HSNI"

      - name: Build exact production artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN" --scope="team_mx52snHfM2FwA3sXVop7HSNI"

      - name: Deploy exact artifact to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" --scope="team_mx52snHfM2FwA3sXVop7HSNI")"
          echo "DEPLOYMENT_URL=$url" >> "$GITHUB_ENV"
          echo "Production deployment: $url"

      - name: Verify production routes
        shell: bash
        run: |
          set -euo pipefail
          base='https://wassafrica.vercel.app'
          for path in / /auth /inbox /messaging /market /marketplace /marche /dashboard /offer-create /manifesto /install /manifest.webmanifest /sw.js /robots.txt /sitemap.xml; do
            code=$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 30 "$base$path")
            echo "$path -> $code"
            case "$code" in 200|204|301|302|303) ;; *) exit 1 ;; esac
          done

      - name: Verify canonical production content
        run: |
          set -euo pipefail
          curl -L -sS --max-time 30 https://wassafrica.vercel.app/inbox | grep -Fq 'Messages WassAfrica'
          curl -L -sS --max-time 30 https://wassafrica.vercel.app/market | grep -Fq 'WassAfrica'
          curl -L -sS --max-time 30 https://wassafrica.vercel.app/robots.txt | grep -Fq 'Sitemap: https://wassafrica.vercel.app/sitemap.xml'
          curl -L -sS --max-time 30 https://wassafrica.vercel.app/sitemap.xml | grep -Fq 'https://wassafrica.vercel.app/marche'

      - name: Verify production security headers
        shell: bash
        run: |
          set -euo pipefail
          headers="$(curl -L -sS -D - -o /dev/null --max-time 30 https://wassafrica.vercel.app/auth)"
          printf '%s\n' "$headers" | grep -qi '^strict-transport-security:'
          printf '%s\n' "$headers" | grep -qi '^x-content-type-options:'
          printf '%s\n' "$headers" | grep -qi '^x-frame-options:'
          printf '%s\n' "$headers" | grep -qi '^permissions-policy:'

      - name: Delivery report
        run: |
          echo "WASSAFRICA PRODUCTION DELIVERY VERIFIED"
          echo "Commit: $GITHUB_SHA"
          echo "Deployment: $DEPLOYMENT_URL"
