name: CTO fix offer commerce UUID runtime
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cto-fix-offer-uuid-runtime.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch offer session binding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('offer-create-v4.html')
          s=p.read_text()
          old="}user=s;const sub=await db.from('user_subscriptions')"
          new="}user=s.user;const sub=await db.from('user_subscriptions')"
          if old not in s:
              raise SystemExit('EXPECTED_OLD_PATTERN_NOT_FOUND')
          s=s.replace(old,new,1)
          old2="plan=sub.data.plan_code;user=s.user;business=await activate();"
          new2="plan=sub.data.plan_code;business=await activate();"
          if old2 not in s:
              raise SystemExit('EXPECTED_DUPLICATE_PATTERN_NOT_FOUND')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Verify no pre-query session bug
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('offer-create-v4.html').read_text()
          a=s.index('async function init()')
          b=s.index('init().catch',a)
          x=s[a:b]
          assert "}user=s.user;const sub=await db.from('user_subscriptions')" in x
          assert "}user=s;const sub=await db.from('user_subscriptions')" not in x
          assert "plan=sub.data.plan_code;business=await activate();" in x
          print('OFFER_UUID_RUNTIME_FIX_VERIFIED')
          PY
      - name: Commit fix
        run: |
          git config user.name 'WASSAFRICA CTO'
          git config user.email 'cto@users.noreply.github.com'
          git add offer-create-v4.html
          git diff --cached --quiet && { echo 'NO_CHANGE'; exit 0; }
          git commit -m 'fix offer commerce UUID runtime binding'
          git push origin main
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/cto-fix-offer-uuid-runtime.yml
          git commit -m 'cleanup temporary offer UUID fix workflow'
          git push origin main