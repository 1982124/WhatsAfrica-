name: Patch messaging first-send E2EE UX
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch messaging
        shell: python
        run: |
          from pathlib import Path
          p=Path('messaging-v6.html')
          s=p.read_text()
          changes=[]

          replacements=[
            ("if(k)return k;", "if(k){try{await syncConversationKeyEnvelopes(k)}catch(e){console.warn('E2EE envelope sync',e)}return k;}"),
            ("if(valid.length<2)throw Error('Le chiffrement attend encore un appareil sécurisé du correspondant.');await WhatsAfricaCrypto.createKeyEnvelopes(db,current.id,1,raw,valid.map(x=>x.id));", "if(valid.length<1)throw Error('Aucun appareil sécurisé disponible.');await WhatsAfricaCrypto.createKeyEnvelopes(db,current.id,1,raw,valid.map(x=>x.id));"),
            ("Conversation chiffrée non prête", "Préparation sécurisée en cours"),
            ("Appareil sécurisé indisponible.", "Préparation sécurisée indisponible pour le moment."),
            ("Aucun appareil sécurisé disponible.", "Préparation sécurisée en cours."),
            ("Clé de conversation créée mais indisponible sur cet appareil.", "Préparation sécurisée en cours. Réessayez dans un instant."),
            ("Ouvrez une conversation sécurisée avant le vocal.", "Ouvrez une conversation avant d'envoyer un vocal."),
            ("Conversation créée ; le chiffrement attend le correspondant.", "⏳ Préparation sécurisée en cours. Vous pouvez continuer ; WhatsAfrica réessaiera automatiquement."),
          ]
          for old,new in replacements:
            if old in s:
              s=s.replace(old,new,1)
              changes.append(old)

          anchor="async function ensureKey(){"
          helper="""async function syncConversationKeyEnvelopes(rawKey){if(!current||!rawKey)return;const mem=await db.from('conversation_members').select('user_id').eq('conversation_id',current.id);if(mem.error)throw mem.error;const ids=[...new Set((mem.data||[]).map(x=>x.user_id))];const devs=await db.from('user_devices').select('id,user_id,identity_public_key').in('user_id',ids).is('revoked_at',null);if(devs.error)throw devs.error;const valid=(devs.data||[]).filter(x=>x.identity_public_key);if(valid.length)await WhatsAfricaCrypto.createKeyEnvelopes(db,current.id,1,rawKey,valid.map(x=>x.id));}"""
          if helper not in s:
            if anchor not in s: raise SystemExit('ensureKey anchor not found')
            s=s.replace(anchor,helper+anchor,1)
            changes.append('helper')

          # Make returning to a conversation retry the secure outbox silently.
          anchor2="window.addEventListener('online',()=>{WhatsAfricaCrypto.flushEncryptedOutbox(db,{onItem:()=>{}}).catch(e=>console.warn('WhatsAfrica outbox retry deferred',e))});"
          replacement2=anchor2+"document.addEventListener('visibilitychange',()=>{if(!document.hidden&&current){ensureKey().then(k=>{key=k;return WhatsAfricaCrypto.flushEncryptedOutbox(db,{conversationId:current.id,onItem:()=>{}})}).catch(e=>console.warn('WhatsAfrica secure retry deferred',e))}});"
          if anchor2 in s and replacement2 not in s:
            s=s.replace(anchor2,replacement2,1)
            changes.append('visibility-retry')

          # Keep the user-facing media error free of internal implementation wording.
          s=s.replace("status('Échec média : '+(e.message||e))", "status('Impossible d’envoyer ce média pour le moment. Réessayez.')")
          s=s.replace("status('Échec de l’envoi : '+(queueError.message||e.message||e))", "status('Impossible d’envoyer pour le moment. Réessayez.')")

          p.write_text(s)
          print('patched:', ', '.join(changes))
      - name: Commit patch
        run: |
          git config user.name 'WhatsAfrica CTO Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add messaging-v6.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix(ux): hide technical encryption states from users'
          git push
