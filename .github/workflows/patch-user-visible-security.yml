name: Deep cleanup user-visible security wording
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clean all technical security messages
        shell: python
        run: |
          from pathlib import Path
          p=Path('messaging-v6.html')
          s=p.read_text(encoding='utf-8')
          replacements={
            '⏳ Envoi en attente : WhatsAfrica finalisera automatiquement le chiffrement dès que le compte correspondant sera prêt.':'Message en attente…',
            'Envoi en attente : WhatsAfrica finalisera automatiquement le chiffrement dès que le compte correspondant sera prêt.':'Message en attente…',
            'WhatsAfrica finalisera automatiquement le chiffrement dès que le compte correspondant sera prêt.':'Message en attente…',
            '🔐 Préparation sécurisée en cours':'',
            'Préparation sécurisée en cours. Vous pouvez continuer ; WhatsAfrica réessaiera automatiquement.':'',
            'Préparation sécurisée en cours.':'',
            'Préparation sécurisée indisponible pour le moment.':'Impossible de préparer la discussion pour le moment. Réessayez.',
            'Appareil sécurisé indisponible.':'Impossible de préparer la discussion pour le moment. Réessayez.',
            'Aucun appareil sécurisé disponible.':'Impossible de préparer la discussion pour le moment. Réessayez.',
            'Clé de conversation créée mais indisponible sur cet appareil.':'Impossible de préparer la discussion pour le moment. Réessayez.',
            'Conversation chiffrée non prête':'Discussion indisponible pour le moment',
            'Ouvrez une conversation sécurisée avant le vocal.':'Ouvrez une conversation avant d’envoyer un vocal.',
            'chiffrement attend le correspondant':'',
            'Échec de l’envoi :':'Impossible d’envoyer pour le moment. Réessayez.',
            'Échec média :':'Impossible d’envoyer ce média pour le moment. Réessayez.'
          }
          for a,b in replacements.items():
            s=s.replace(a,b)
          p.write_text(s,encoding='utf-8')
      - name: Verify forbidden user wording is absent
        run: |
          ! grep -Eiq 'finalisera automatiquement le chiffrement|Préparation sécurisée|Appareil sécurisé|Aucun appareil sécurisé|Clé de conversation.*indisponible|Conversation chiffrée non prête|chiffrement attend le correspondant' messaging-v6.html
      - name: Commit patch
        run: |
          git config user.name 'whatsafrica-cto-bot'
          git config user.email 'cto-bot@whatsafrica.local'
          git add messaging-v6.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix(ux): make security invisible in messaging [skip ci]'
          git push
