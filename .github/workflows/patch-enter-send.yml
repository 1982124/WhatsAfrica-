name: Patch Enter sends message
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make Enter submit the message composer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('messaging-v6.html')
          s=p.read_text()
          marker='</script>'
          patch="""\n<script>\n(()=>{\n  const body=document.getElementById('body');\n  const composer=document.getElementById('composer');\n  if(!body||!composer||body.dataset.enterSendReady==='1') return;\n  body.dataset.enterSendReady='1';\n  body.addEventListener('keydown',(event)=>{\n    if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){\n      event.preventDefault();\n      event.stopPropagation();\n      if(typeof composer.requestSubmit==='function') composer.requestSubmit(document.getElementById('send'));\n      else composer.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));\n    }\n  },true);\n})();\n</script>"""
          if 'data-enter-send-ready' in s or 'dataset.enterSendReady' in s:
              raise SystemExit(0)
          idx=s.rfind(marker)
          if idx<0: raise SystemExit('script marker not found')
          s=s[:idx]+patch+'\n'+s[idx:]
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'whatsafrica-cto-bot'
          git config user.email 'cto-bot@whatsafrica.local'
          git add messaging-v6.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix(messaging): make Enter send the message [skip ci]'
          git push
