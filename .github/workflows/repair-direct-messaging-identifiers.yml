name: Repair direct messaging identifiers

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch routed inbox identifier UX and WhatsApp fallback
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in ('messaging-v4.html', 'messaging-v6.html'):
              p = Path(name)
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')

              s = s.replace('Utilisez le numéro international du correspondant.', 'Téléphone, e-mail ou ID WhatsAfrica — un seul champ.', 1)
              s = s.replace('placeholder="+223…"', 'placeholder="Téléphone +223…, e-mail ou ID WhatsAfrica"', 2)
              s = s.replace('placeholder="Numéro +223…"', 'placeholder="Téléphone +223…, e-mail ou ID WhatsAfrica"', 1)
              s = s.replace('inputmode="tel"', 'inputmode="text"', 2)

              old_norm = r'''const norm=v=>{let x=String(v||'').trim().replace(/[\s().-]/g,'');if(x.startsWith('00'))x='+'+x.slice(2);return /^\+[1-9][0-9]{7,14}$/.test(x)?x:null};'''
              new_norm = r'''const norm=v=>{const raw=String(v||'').trim();let x=raw.replace(/[\s().-]/g,'');if(x.startsWith('00'))x='+'+x.slice(2);if(/^\+[1-9][0-9]{7,14}$/.test(x))return x;if(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(raw))return raw.toLowerCase();if(/^[0-9]{4,20}$/.test(raw))return raw;return null};const phoneOnly=v=>{let x=String(v||'').trim().replace(/[\s().-]/g,'');if(x.startsWith('00'))x='+'+x.slice(2);return /^\+[1-9][0-9]{7,14}$/.test(x)?x:null};const inviteWhatsApp=v=>{const p=phoneOnly(v);if(!p)return status('Aucun compte WhatsAfrica trouvé. Pour inviter via WhatsApp, utilisez un numéro international.');const text='Bonjour 👋 Je t’invite à continuer cette discussion sur WhatsAfrica. Inscris-toi gratuitement ici : https://whatsafrica.vercel.app/auth';const href='https://wa.me/'+p.slice(1)+'?text='+encodeURIComponent(text);['statusSide','statusMobile'].forEach(id=>{const e=$(id);if(e)e.innerHTML='Ce contact n’est pas encore disponible sur WhatsAfrica. <a href="'+href+'" target="_blank" rel="noopener" style="font-weight:800;color:var(--g2)">🟢 Inviter via WhatsApp</a>'})};'''
              if old_norm in s:
                  s = s.replace(old_norm, new_norm, 1)

              old_catch = r'''status(String(e.message||e).includes('CONTACT_NOT_FOUND')?'Ce numéro n’a pas encore de compte WhatsAfrica.':'Impossible d’ouvrir la conversation : '+(e.message||e))'''
              new_catch = r'''if(String(e.message||e).includes('CONTACT_NOT_FOUND'))inviteWhatsApp(value);else status('Impossible d’ouvrir la conversation : '+(e.message||e))'''
              if old_catch in s:
                  s = s.replace(old_catch, new_catch, 1)

              s = s.replace("if(!p)return status('Numéro international requis, exemple +223…');", "if(!p)return status('Entrez un téléphone international, un e-mail ou un ID WhatsAfrica.');", 1)
              s = s.replace("status('🔐 Chiffrement pas encore prêt. Ouvrez WhatsAfrica sur le correspondant.');return", "status('🔐 Préparation sécurisée de la conversation…');try{key=await ensureKey()}catch(e){status('⏳ Envoi en attente : WhatsAfrica finalisera automatiquement le chiffrement dès que le compte correspondant sera prêt.');return}", 1)
              s = s.replace("(e.message||'Le correspondant doit ouvrir WhatsAfrica une première fois.')", "(e.message||'Le chiffrement de cette conversation est en cours de préparation.')", 1)

              p.write_text(s, encoding='utf-8')
          PY

      - name: Patch routed authentication device bootstrap
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('auth-v5.html')
          if p.exists():
              s = p.read_text(encoding='utf-8')
              if 'id="wa-e2ee-bootstrap"' not in s:
                  inject = '''<script src="/e2ee.js"></script><script id="wa-e2ee-bootstrap">(()=>{'use strict';const boot=async()=>{try{const s=await db.auth.getSession();const u=s.data?.session?.user;if(u&&window.WhatsAfricaCrypto)await window.WhatsAfricaCrypto.registerDevice(db,u.id,'Web')}catch(e){console.warn('WhatsAfrica E2EE device bootstrap deferred',e)}};boot();db.auth.onAuthStateChange((event,session)=>{if(session?.user&&['SIGNED_IN','TOKEN_REFRESHED'].includes(event))setTimeout(boot,0)})})();</script>'''
                  s = s.replace('</body></html>', inject + '</body></html>', 1)
                  p.write_text(s, encoding='utf-8')
          PY

      - name: Activate encrypted offline outbox and automatic retry
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in ('messaging-v4.html', 'messaging-v6.html'):
              p = Path(name)
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')

              old_boot = "await register();await list();WA_CALLS.init(db,user)"
              new_boot = "await register();await list();try{await WhatsAfricaCrypto.flushEncryptedOutbox(db,{onItem:()=>{}})}catch(e){console.warn('WhatsAfrica outbox flush deferred',e)};window.addEventListener('online',()=>{WhatsAfricaCrypto.flushEncryptedOutbox(db,{onItem:()=>{}}).catch(e=>console.warn('WhatsAfrica outbox retry deferred',e))});WA_CALLS.init(db,user)"
              if old_boot in s:
                  s = s.replace(old_boot, new_boot, 1)

              old_open = "await subscribe(c.id);try{key=await ensureKey();await loadMessages();status('🟢 Conversation prête.')}"
              new_open = "await subscribe(c.id);try{key=await ensureKey();try{await WhatsAfricaCrypto.flushEncryptedOutbox(db,{conversationId:c.id,onItem:()=>{}})}catch(e){console.warn('WhatsAfrica conversation outbox flush deferred',e)}await loadMessages();status('🟢 Conversation prête.')}"
              if old_open in s:
                  s = s.replace(old_open, new_open, 1)

              old_send = "async function sendText(){const body=$('body'),text=body.value.trim();if(!text||!current)return;if(!key){status('🔐 Préparation sécurisée de la conversation…');try{key=await ensureKey()}catch(e){status('⏳ Envoi en attente : WhatsAfrica finalisera automatiquement le chiffrement dès que le compte correspondant sera prêt.');return}}const btn=$('send');btn.disabled=true;try{await WhatsAfricaCrypto.sendEncryptedMessage(db,{conversationId:current.id,senderId:user.id,text,rawKey:key,messageType:'text'});body.value='';await loadMessages();status('Message envoyé.')}catch(e){status('Échec de l’envoi : '+(e.message||e))}finally{btn.disabled=false}}"
              new_send = "async function sendText(){const body=$('body'),text=body.value.trim();if(!text||!current)return;if(!key){status('🔐 Préparation sécurisée de la conversation…');try{key=await ensureKey()}catch(e){status('⏳ Envoi en attente : WhatsAfrica finalisera automatiquement le chiffrement dès que le compte correspondant sera prêt.');return}}const btn=$('send');btn.disabled=true;try{const messageId=crypto.randomUUID();await WhatsAfricaCrypto.sendEncryptedMessage(db,{conversationId:current.id,senderId:user.id,text,rawKey:key,messageType:'text',messageId});body.value='';await loadMessages();status('Message envoyé.')}catch(e){try{await WhatsAfricaCrypto.queueEncryptedMessage({conversationId:current.id,senderId:user.id,text,rawKey:key,messageType:'text',messageId});body.value='';status('⏳ Message sécurisé mis en attente. Il sera envoyé automatiquement dès que la connexion sera rétablie.')}catch(queueError){status('Échec de l’envoi : '+(queueError.message||e.message||e))}}finally{btn.disabled=false}}"
              if old_send in s:
                  s = s.replace(old_send, new_send, 1)

              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit routed messaging and auth patches
        run: |
          git config user.name "WhatsAfrica CTO"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add messaging-v4.html messaging-v6.html auth-v5.html
          git diff --cached --quiet || git commit -m "feat(messaging): activate encrypted offline outbox"
          git push