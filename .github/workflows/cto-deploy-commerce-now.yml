name: CTO deploy commerce now
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cto-deploy-commerce-now.yml'
permissions:
  contents: write
jobs:
  deploy-trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Touch verified commerce page
        run: |
          printf '\n<!-- WASSAFRICA CTO: production deployment trigger for verified session UUID fix -->\n' >> offer-create-v4.html
          grep -q 'production deployment trigger for verified session UUID fix' offer-create-v4.html
          grep -q '}user=s.user;const sub=await db.from('"'"'user_subscriptions'"'"')' offer-create-v4.html
      - name: Commit deployment trigger
        run: |
          git config user.name 'WASSAFRICA CTO'
          git config user.email 'cto@wassafrica.local'
          git add offer-create-v4.html
          git commit -m 'deploy commerce session fix to production'
          git push origin main
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/cto-deploy-commerce-now.yml
          git commit -m 'cleanup commerce deployment trigger'
          git push origin main