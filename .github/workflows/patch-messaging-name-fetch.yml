name: CTO repair unified member search and conversation opening
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'whatsafrica-cto-bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch messaging flow
        shell: python
        run: |
          from pathlib import Path
          p=Path('messaging-v6.html')
          s=p.read_text(encoding='utf-8')
          old='Téléphone, e-mail ou ID WhatsAfrica — un seul champ.'
          new='Nom, téléphone, e-mail ou ID WhatsAfrica — un seul champ.'
          if old in s: s=s.replace(old,new,1)
          old='placeholder="Téléphone +223…, e-mail ou ID WhatsAfrica"'
          new='placeholder="Nom, téléphone +223…, e-mail ou ID WhatsAfrica"'
          s=s.replace(old,new)
          old="async function startByPhone(value){const p=norm(value);if(!p)return status('Entrez un téléphone international, un e-mail ou un ID WhatsAfrica.');$('start').disabled=true;try{await register();const r=await db.rpc('start_direct_conversation_by_phone',{p_phone:p});"
          new="async function startByPhone(value){const p=norm(value);if(!p)return status('Entrez un nom, téléphone international, e-mail ou ID WhatsAfrica.');$('start').disabled=true;try{const r=await db.rpc('start_direct_conversation_by_phone',{p_phone:p});"
          if old not in s: raise SystemExit('startByPhone anchor not found')
          s=s.replace(old,new,1)
          old='window.__WA_CURRENT_CONVERSATION={id:c.id,peerId:await peerOf(c.id)};'
          new='window.__WA_CURRENT_CONVERSATION={id:c.id,peerId:current.peer_id||null};'
          if old not in s: raise SystemExit('peerId anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "whatsafrica-cto-bot"
          git config user.email "cto-bot@whatsafrica.local"
          git add messaging-v6.html
          git commit -m "fix(messaging): repair name search conversation fetch [skip ci]" || exit 0
          git push