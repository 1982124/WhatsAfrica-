name: Temporary Messaging Syntax Repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor == '1982124'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair inline voice syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('messaging-v6.html')
          s=p.read_text()
          pat=r"recording\.done\.then\(x=>\{.*?\}\)\.catch\(e=>status\(e\.message\|\|'Erreur micro'\)\)\}catch\(e\)\{status"
          repl="recording.done.then(x=>{recording.result=x;$('voiceStatus').textContent='🎙️ '+Math.round(x.durationMs/1000)+' s — prêt à envoyer';}).catch(e=>status(e.message||'Erreur micro'));}catch(e){status"
          ns,n=re.subn(pat,repl,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f'voice syntax anchor not found: replacements={n}')
          p.write_text(ns)
          PY
          python3 - <<'PY'
          from pathlib import Path
          s=Path('messaging-v6.html').read_text(); a=s.find('async function startVoice'); b=s.find('</script>',a)
          Path('/tmp/inline.js').write_text(s[a:b])
          PY
          node --check /tmp/inline.js
      - name: Commit
        shell: bash
        run: |
          git config user.name 'whatsafrica-cto-bot'
          git config user.email 'cto-bot@whatsafrica.local'
          git add messaging-v6.html
          git commit -m 'fix(messaging): repair inline voice syntax' || exit 0
          git push
