name: Temporary Messaging Syntax Repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor == '1982124'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair inline voice syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('messaging-v6.html')
          s=p.read_text()
          s=s.replace("d'envoyer", "d’envoyer")
          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          s=Path('messaging-v6.html').read_text(); a=s.find('async function startVoice'); b=s.find('</script>',a)
          Path('/tmp/inline.js').write_text(s[a:b])
          PY
          node --check /tmp/inline.js
      - name: Commit
        shell: bash
        run: |
          git config user.name 'whatsafrica-cto-bot'
          git config user.email 'cto-bot@whatsafrica.local'
          git add messaging-v6.html
          git commit -m 'fix(messaging): repair inline voice syntax' || exit 0
          git push
