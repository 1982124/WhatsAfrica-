name: Temporary Messaging Syntax Repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor == '1982124'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair inline voice function
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('messaging-v6.html')
          s=p.read_text()
          old="async function startVoice(){if(!current||!key)return status('Ouvrez une conversation avant d\'envoyer un vocal.');try{recording=await WhatsAfricaVoice.startRecording();$('voicebar').classList.add('on');$('voiceStatus').textContent='🎙️ Enregistrement en cours…';recording.done.then(x=>{recording.result=x;$('voiceStatus').textContent='🎙️ '+Math.round(x.durationMs/1000)+' s — prêt à envoyer';}).catch(e=>status(e.message||'Erreur micro'))}catch(e){status(e.message||'Micro indisponible')}}"
          new="async function startVoice(){if(!current||!key)return status('Ouvrez une conversation avant d\'envoyer un vocal.');try{recording=await WhatsAfricaVoice.startRecording();$('voicebar').classList.add('on');$('voiceStatus').textContent='🎙️ Enregistrement en cours…';recording.done.then(x=>{recording.result=x;$('voiceStatus').textContent='🎙️ '+Math.round(x.durationMs/1000)+' s — prêt à envoyer';}).catch(e=>status(e.message||'Erreur micro'));}catch(e){status(e.message||'Micro indisponible')}}"
          if old not in s:
              raise SystemExit('startVoice exact anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check <(python3 -c "from html.parser import HTMLParser; from pathlib import Path; p=Path('messaging-v6.html').read_text(); a=p.find('async function startVoice'); b=p.find('</script>',a); print(p[a:b])")
      - name: Commit
        shell: bash
        run: |
          git config user.name 'whatsafrica-cto-bot'
          git config user.email 'cto-bot@whatsafrica.local'
          git add messaging-v6.html
          git commit -m 'fix(messaging): repair inline voice syntax' || exit 0
          git push
