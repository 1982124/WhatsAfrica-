name: Activate message delivery and read receipts

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject receipt engine into routed inbox
        run: |
          python - <<'PY'
          from pathlib import Path
          changed=False
          for name in ('messaging-v4.html','messaging-v6.html'):
              p=Path(name)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              old='<script src="/e2ee.js"></script>'
              new=old+'<script src="/wa-receipts.js"></script>'
              if '/wa-receipts.js' not in s and old in s:
                  s=s.replace(old,new,1)
              old_open='await subscribe(c.id);'
              new_open='await subscribe(c.id);if(window.WA_RECEIPTS)window.WA_RECEIPTS.setConversation(c.id);'
              if 'WA_RECEIPTS.setConversation(c.id)' not in s and old_open in s:
                  s=s.replace(old_open,new_open,1)
              p.write_text(s,encoding='utf-8')
              changed=True
          PY

      - name: Commit receipt integration
        run: |
          git config user.name "WhatsAfrica CTO"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add messaging-v4.html messaging-v6.html
          git diff --cached --quiet || git commit -m "feat(messaging): show sent delivered and read times"
          git push