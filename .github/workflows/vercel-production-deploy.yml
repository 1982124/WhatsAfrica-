name: WASSAFRICA — Vercel Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: prj_h1PSYw1DMyDhmoaVc2Qy4uRsgJbh
          VERCEL_ORG_ID: team_mx52snHfM2FwA3sXVop7HSNI
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          npx --yes vercel@latest link --yes --project "$VERCEL_PROJECT_ID" --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prod --yes --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN"
