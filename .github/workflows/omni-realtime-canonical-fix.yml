name: OMNI Realtime Canonical Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix(messaging): patch canonical inbox realtime subscription'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch canonical inbox realtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('inbox-canonical-v1.html')
          s=p.read_text()
          start=s.index('async function subscribe(c){')
          end=s.index('async function openConv(c){', start)
          new="""async function subscribe(c){if(currentChannel){await sb.removeChannel(currentChannel);currentChannel=null}await sb.realtime.setAuth(session.access_token);const ch=sb.channel('wa-messages-v2-live').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages_v2',filter:'conversation_id=eq.'+c.id},p=>{const r=p?.new;if(r?.conversation_id===c.id){upsertMessage(r);renderMessages();markRead().catch(()=>{})}}).on('postgres_changes',{event:'UPDATE',schema:'public',table:'messages_v2',filter:'conversation_id=eq.'+c.id},p=>{const r=p?.new;if(r?.conversation_id===c.id){upsertMessage(r);renderMessages()}}).on('postgres_changes',{event:'DELETE',schema:'public',table:'messages_v2',filter:'conversation_id=eq.'+c.id},p=>{const r=p?.old;if(r?.id)removeMessage(r.id)});currentChannel=ch;return new Promise((resolve,reject)=>{let done=false;const finish=(fn,v)=>{if(done)return;done=true;fn(v)};ch.subscribe(st=>{if(st==='SUBSCRIBED'){status('🟢 Connecté en temps réel');finish(resolve)}else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED'){status('⚠️ Temps réel indisponible — resynchronisation');finish(reject,Error(st))}});setTimeout(()=>finish(reject,Error('REALTIME_TIMEOUT')),10000)})}"""
          p.write_text(s[:start]+new+s[end:])
          PY
      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name "WASSAFRICA CTO"
          git config user.email "cto@wassafrica.local"
          git add inbox-canonical-v1.html
          git commit -m "fix(messaging): patch canonical inbox realtime subscription"
          git rm .github/workflows/omni-realtime-canonical-fix.yml
          git commit -m "chore: remove one-shot realtime patch workflow"
          git push