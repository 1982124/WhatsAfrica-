name: CTO fix offer session order
on:
  push:
    paths:
      - '.github/workflows/cto-fix-offer-session-order.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move user binding before UUID queries
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('offer-create-v4.html')
          s=p.read_text()
          old="}user=s;const sub=await db.from('user_subscriptions')"
          new="}user=s.user;const sub=await db.from('user_subscriptions')"
          if old not in s:
              raise SystemExit('expected offer init user binding not found')
          s=s.replace(old,new,1)
          s=s.replace("plan=sub.data.plan_code;user=s.user;business=await activate();","plan=sub.data.plan_code;business=await activate();",1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add offer-create-v4.html
          git commit -m 'fix offer session user binding before subscription query'
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/cto-fix-offer-session-order.yml
          git commit -m 'remove temporary CTO offer session workflow'
          git push