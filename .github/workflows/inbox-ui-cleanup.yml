name: cleanup-inbox-generic-subtitle

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: "!contains(github.event.head_commit.message, '[inbox-ui-cleanup]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove generic conversation subtitle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('inbox-v25.html')
          s = p.read_text(encoding='utf-8')
          patterns = [
              (r"main\.append\(name,sub\);", "main.append(name);"),
              (r"main\.append\(name, sub\);", "main.append(name);"),
          ]
          for old, new in patterns:
              s2, n = re.subn(old, new, s, count=1)
              if n:
                  s = s2
                  break
          else:
              raise SystemExit('Target inbox list append pattern not found; refusing unrelated changes.')
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          git diff -- inbox-v25.html
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inbox-v25.html
          git commit -m 'fix inbox conversation list subtitle [inbox-ui-cleanup]'
          git push
