name: WASSAFRICA Global Fallback Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fallback-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Audit global fallback invariants
        run: python3 fallback-audit.py
      - name: Validate canonical production domain
        shell: bash
        run: |
          set -euo pipefail
          test -f vercel.json
          if grep -RIn --exclude-dir=.git --exclude-dir=.vercel --exclude-dir=node_modules --exclude-dir=android --include='*.html' --include='*.js' --include='*.mjs' --include='*.cjs' --include='*.json' --include='*.yml' --include='*.yaml' --exclude='wassafrica-fallback-gate.yml' 'https://whatsafrica.vercel.app' .; then
            echo 'Legacy production domain reference detected. Canonical domain is https://wassafrica.vercel.app.'
            exit 1
          fi
          grep -Fq '"/inbox"' vercel.json
