name: CTO temporary name search patch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch messaging identifier normalization
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('messaging-v6.html')
          s=p.read_text()
          old="const norm=v=>{const raw=String(v||'').trim();let x=raw.replace(/[\\s().-]/g,'');if(x.startsWith('00'))x='+'+x.slice(2);if(/^\\+[1-9][0-9]{7,14}$/.test(x))return x;if(/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(raw))return raw.toLowerCase();if(/^[0-9]{4,20}$/.test(raw))return raw;return null};"
          new="const norm=v=>{const raw=String(v||'').trim();let x=raw.replace(/[\\s().-]/g,'');if(x.startsWith('00'))x='+'+x.slice(2);if(/^\\+[1-9][0-9]{7,14}$/.test(x))return x;if(/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(raw))return raw.toLowerCase();if(/^[0-9]{4,20}$/.test(raw))return raw;if(raw.length>=2&&/[A-Za-zÀ-ÿ]/.test(raw))return raw;return null};"
          if old not in s:
              raise SystemExit('normalization block not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name "whatsafrica-cto"
          git config user.email "cto@users.noreply.github.com"
          git add messaging-v6.html
          git commit -m "fix(messaging): support member search by name"
          git push
