name: WASSAFRICA brand normalization

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize-brand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize visible brand in every application page
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          injector = '<script src="/brand-normalizer.js"></script>'
          changed = []

          def normalize_visible_html(text):
              # Replace brand copy in HTML while deliberately leaving executable
              # JavaScript and CSS untouched (storage keys, RPC names, etc.).
              parts = re.split(r'(<(?:script|style)\b[^>]*>.*?</(?:script|style)>)', text, flags=re.I | re.S)
              for i in range(0, len(parts), 2):
                  parts[i] = (parts[i]
                      .replace('WhatsAfrica', 'WASSAFRICA')
                      .replace('Whats Africa', 'WASSAFRICA')
                      .replace('WHATS AFRICA', 'WASSAFRICA'))
              return ''.join(parts)

          for path in root.rglob('*.html'):
              if any(part in {'.git', 'node_modules'} for part in path.parts):
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              new = normalize_visible_html(text)
              if '/brand-normalizer.js' not in new:
                  if re.search(r'</head>', new, flags=re.I):
                      new = re.sub(r'</head>', injector + '\n</head>', new, count=1, flags=re.I)
                  elif re.search(r'</body>', new, flags=re.I):
                      new = re.sub(r'</body>', injector + '\n</body>', new, count=1, flags=re.I)
                  else:
                      new += '\n' + injector + '\n'
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))

          for path in [root / 'README.md', root / 'manifest.json']:
              if path.exists():
                  text = path.read_text(encoding='utf-8')
                  new = text.replace('WhatsAfrica', 'WASSAFRICA').replace('Whats Africa', 'WASSAFRICA').replace('WHATS AFRICA', 'WASSAFRICA')
                  if new != text:
                      path.write_text(new, encoding='utf-8')
                      changed.append(str(path))

          print(f'Changed {len(changed)} files')
          for item in changed:
              print(item)

      - name: Commit normalization
        shell: bash
        run: |
          git config user.name 'WASSAFRICA CTO'
          git config user.email 'cto@wassafrica.local'
          git add '*.html' README.md manifest.json
          if git diff --cached --quiet; then
            echo 'No brand normalization changes required.'
            exit 0
          fi
          git commit -m 'chore(brand): normalize visible copy to WASSAFRICA'
          git push
