name: CTO assistant identity rollout
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  rollout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply assistant identity changes
        shell: python
        run: |
          from pathlib import Path

          def edit(path, fn):
              p=Path(path); s=p.read_text(encoding='utf-8'); n=fn(s)
              if n != s: p.write_text(n, encoding='utf-8')

          def cockpit(s):
              needle='<div class="card wide"><h2>🔗 Mon Smart Link</h2>'
              block='''<div class="card wide" id="assistantIdentityCard"><h2>🤖 Votre assistant commercial</h2><p class="muted">Donnez-lui un prénom ou un nom. Il l’utilisera naturellement dans les conversations avec vos clients.</p><input id="assistantName" maxlength="60" placeholder="Ex. Françoise" autocomplete="off"><div class="hint" style="margin-top:4px">Exemple : « Je suis Françoise, votre assistante commerciale. »</div><button class="btn" id="saveAssistantName" style="margin-top:10px">Enregistrer le nom</button><p id="assistantNameMsg" class="muted"></p></div>'''
              if 'id="assistantIdentityCard"' not in s and needle in s:
                  s=s.replace(needle, block+needle, 1)
              s=s.replace("$('countryPublic').checked=profile.country_public!==false;$('template').value=profile.template||'business';", "$('countryPublic').checked=profile.country_public!==false;$('assistantName').value=profile.assistant_name||'Votre assistant';$('template').value=profile.template||'business';")
              s=s.replace("country_public:$('countryPublic').checked,template:$('template').value,accent_color:$('accentColor').value", "country_public:$('countryPublic').checked,assistant_name:($('assistantName')?.value||'Votre assistant').trim().slice(0,60)||'Votre assistant',template:$('template').value,accent_color:$('accentColor').value")
              marker="$('saveProfile').onclick=async()=>"
              handler="""$('saveAssistantName').onclick=async()=>{try{const u=await getCurrentUser();const name=($('assistantName').value||'Votre assistant').trim().slice(0,60)||'Votre assistant';const r=await db.from('profiles').update({assistant_name:name}).eq('user_id',u.id);if(r.error)throw r.error;profile.assistant_name=name;$('assistantNameMsg').innerHTML='<span class=\"ok\">Nom enregistré : '+escapeHtml(name)+'</span>';}catch(e){showError('assistantNameMsg',e.message)}};"""
              if 'saveAssistantName' not in s[s.find('<script>'):]:
                  s=s.replace(marker, handler+marker, 1)
              return s
          edit('cockpit.html', cockpit)

          def public_commerce(s):
              s=s.replace("let link=null,business=null,products=[],statuses=[],chatHistory=[],cart=[];", "let link=null,business=null,products=[],statuses=[],chatHistory=[],cart=[],assistantName='Votre assistant';")
              s=s.replace("if(link.business_id){const p=await db.from('products')", "const ap=await db.from('profiles').select('assistant_name').eq('user_id',link.owner_id).maybeSingle();assistantName=(ap.data?.assistant_name||'Votre assistant').trim()||'Votre assistant';\n if(link.business_id){const p=await db.from('products')")
              old='''<div class="bubble bot">Bonjour 👋 Je suis votre assistant commercial. Que souhaitez-vous savoir ?</div>'''
              new='''<div class="bubble bot">Bonjour 👋 Je suis ${esc(assistantName)}, votre assistante commerciale. Que souhaitez-vous savoir ?</div>'''
              s=s.replace(old,new)
              s=s.replace("delivery_enabled:!!business.delivery_enabled,delivery_fee:business.delivery_fee||0,payment_methods", "assistant_name:assistantName,delivery_enabled:!!business.delivery_enabled,delivery_fee:business.delivery_fee||0,payment_methods")
              return s
          edit('public-commerce.html', public_commerce)

          def api(s):
              s=s.replace("return{display_name:clean(value.display_name,120),country", "return{assistant_name:clean(value.assistant_name,60)||'Votre assistant',display_name:clean(value.display_name,120),country")
              s=s.replace("function catalogFallback(question,business){", "function assistantIntro(business){const n=business?.assistant_name||'Votre assistant';return `Je suis **${n}**, votre assistante commerciale.`;}\nfunction catalogFallback(question,business){")
              s=s.replace("return items?`Je peux vous renseigner sur : ${items}. Que souhaitez-vous savoir ?`:`Je suis votre assistant commercial. Que souhaitez-vous savoir sur cette activité ?`;", "return items?`${assistantIntro(business)} Je peux vous renseigner sur : ${items}. Que souhaitez-vous savoir ?`:`${assistantIntro(business)} Que souhaitez-vous savoir sur cette activité ?`;")
              s=s.replace("return`Tu es « Votre assistant commercial » de WhatsAfrica.", "return`Tu es « ${business?.assistant_name||'Votre assistant'}, votre assistante commerciale » de WhatsAfrica.")
              return s
          edit('api/assistant.js', api)

          def appv6(s):
              s=s.replace("function renderAssistant(){$('screen').innerHTML=`<section class=\"panel\"><div class=\"ey\">Votre assistant commercial</div><h2>Testez-le comme un client.", "function renderAssistant(){$('screen').innerHTML=`<section class=\"panel\"><div class=\"ey\">${esc(profile.assistant_name||'Votre assistant')}, votre assistante commerciale</div><h2>Testez-le comme un client.")
              s=s.replace("smartlink_slug:profile.smartlink_slug,articles:products", "smartlink_slug:profile.smartlink_slug,assistant_name:profile.assistant_name||'Votre assistant',articles:products")
              return s
          edit('app-v6.html', appv6)

          import subprocess
          subprocess.run(['git','config','user.name','WhatsAfrica CTO'],check=True)
          subprocess.run(['git','config','user.email','cto@whatsafrica.local'],check=True)
          subprocess.run(['git','add','cockpit.html','public-commerce.html','api/assistant.js','app-v6.html'],check=True)
          r=subprocess.run(['git','diff','--cached','--quiet'])
          if r.returncode==1:
              subprocess.run(['git','commit','-m','feat: personalize commercial assistant identity'],check=True)
              subprocess.run(['git','push'],check=True)
          else:
              print('No changes to commit')
