name: Repair messaging first send

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Harden first-send action
        shell: python
        run: |
          from pathlib import Path
          p = Path('messaging-v6.html')
          s = p.read_text(encoding='utf-8')
          old = """async function sendText(){const body=$('body'),text=body.value.trim();if(!text||!current)return;if(!key){status('🔐 Préparation sécurisée de la conversation…');try{key=await ensureKey()}catch(e){status('⏳ Envoi en attente : WhatsAfrica finalisera automatiquement le chiffrement dès que le compte correspondant sera prêt.');return}}const btn=$('send');btn.disabled=true;try{await WhatsAfricaCrypto.sendEncryptedMessage(db,{conversationId:current.id,senderId:user.id,text,rawKey:key,messageType:'text'});body.value='';await loadMessages();status('Message envoyé.')}catch(e){status('Échec de l’envoi : '+(e.message||e))}finally{btn.disabled=false}}"""
          new = """async function sendText(){const body=$('body'),text=body.value.trim();if(!text||!current)return;const btn=$('send');btn.disabled=true;btn.setAttribute('aria-busy','true');const show=t=>{status(t);const m=$('messages');if(m&&!m.classList.contains('hide')){const n=document.createElement('div');n.className='status err';n.textContent=t;m.appendChild(n);m.scrollTop=m.scrollHeight}};try{if(!key){show('🔐 Sécurisation de la conversation…');let last=null;for(let i=0;i<3&&!key;i++){try{key=await ensureKey()}catch(e){last=e;await new Promise(r=>setTimeout(r,500*(i+1)))}}if(!key){show('⚠️ Envoi non effectué : '+(last?.message||last||'clé de conversation indisponible'));return}}show('⏳ Envoi…');await WhatsAfricaCrypto.sendEncryptedMessage(db,{conversationId:current.id,senderId:user.id,text,rawKey:key,messageType:'text'});body.value='';await loadMessages();show('✅ Message envoyé.')}catch(e){show('❌ Échec de l’envoi : '+(e.message||e))}finally{btn.disabled=false;btn.removeAttribute('aria-busy')}}"""
          if old not in s:
              raise SystemExit('sendText target not found; no change made')
          p.write_text(s.replace(old,new,1), encoding='utf-8')

      - name: Commit patch only when changed
        run: |
          git config user.name "WhatsAfrica CTO"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add messaging-v6.html
          git diff --cached --quiet || git commit -m "fix(messaging): make send action reliable and visible"
          git push