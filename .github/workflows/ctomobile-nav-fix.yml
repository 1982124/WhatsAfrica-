name: CTO Mobile Navigation Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-mobile-nav:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Android navigation fix
        shell: python
        run: |
          from pathlib import Path
          p = Path('messaging-whatsapp.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* wa-mobile-nav-v1 */'
          if marker in s:
              print('Mobile navigation fix already present.')
              raise SystemExit(0)

          old_css = '@media(max-width:760px){.wrap{padding:7px}.grid{grid-template-columns:1fr}.list{max-height:25vh}.chat{min-height:68vh}.messages{max-height:none}.msg{max-width:92%}.top .brand{font-size:19px}.btn{padding:10px}.desktop-only{display:none}}'
          new_css = marker + '@media(max-width:760px){body{padding-bottom:74px}.wrap{padding:7px}.grid{grid-template-columns:1fr}.list{max-height:25vh}.chat{min-height:68vh}.messages{max-height:none}.msg{max-width:92%}.top .brand{font-size:19px}.btn{padding:10px}.desktop-only{display:none}.top nav{display:none}.wa-mobile-nav{position:fixed;left:0;right:0;bottom:0;z-index:1000;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;margin:0;padding:6px 4px calc(6px + env(safe-area-inset-bottom));background:#08101cf7;border-top:1px solid var(--line);backdrop-filter:blur(12px)}.wa-mobile-nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0;padding:6px 2px;border:0;border-radius:10px;color:var(--muted);font-size:11px;line-height:1.15;white-space:nowrap;text-decoration:none}.wa-mobile-nav a .wa-nav-icon{font-size:19px;line-height:1}.wa-mobile-nav a.active{background:var(--gold);color:#111!important}.wa-mobile-nav a:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}}@media(min-width:761px){.wa-mobile-nav{display:none!important}}'
          if old_css not in s:
              raise SystemExit('Expected mobile CSS block not found; aborting safely.')
          s = s.replace(old_css, new_css, 1)

          old_nav = '<nav><a class="active" href="/inbox">💬 Discussions</a><a href="/universe">🔎 Explorer</a><a href="/groups">👥 Communautés</a><a href="/market">🛍️ Marché</a><a href="/calls">📞 Appels</a><a href="/dashboard">👤 Moi</a></nav>'
          new_nav = old_nav + '<nav class="wa-mobile-nav" aria-label="Navigation principale mobile"><a class="active" href="/inbox"><span class="wa-nav-icon">💬</span><span>Discussions</span></a><a href="/universe"><span class="wa-nav-icon">🔎</span><span>Explorer</span></a><a href="/market"><span class="wa-nav-icon">🛍️</span><span>Marché</span></a><a href="/calls"><span class="wa-nav-icon">📞</span><span>Appels</span></a><a href="/dashboard"><span class="wa-nav-icon">👤</span><span>Moi</span></a></nav>'
          if old_nav not in s:
              raise SystemExit('Expected navigation markup not found; aborting safely.')
          s = s.replace(old_nav, new_nav, 1)
          p.write_text(s, encoding='utf-8')
          print('Applied Android mobile navigation: Discussions, Explorer, Marché, Appels, Moi.')

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "WhatsAfrica CTO"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add messaging-whatsapp.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "fix(mobile): keep primary navigation visible on Android"
            git push
          fi
