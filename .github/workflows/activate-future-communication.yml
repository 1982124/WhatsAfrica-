name: Activate WhatsAfrica future communication UX
on:
  push:
    branches: [main]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inject zero-cost communication layer
        shell: python
        run: |
          from pathlib import Path
          changed=[]
          def inject_script(path, marker, script):
            p=Path(path); s=p.read_text(encoding='utf-8')
            if script in s: return False
            needle=marker
            if needle not in s: return False
            s=s.replace(needle, needle+'<script src="/'+script+'"></script>', 1)
            p.write_text(s, encoding='utf-8'); changed.append(path); return True
          inject_script('messaging-v6.html','<script src="/wa-calls-v2.js"></script>','wa-call-future.js')
          p=Path('messaging-v6.html'); s=p.read_text(encoding='utf-8')
          anchor='await subscribe(c.id);'
          patch='window.__WA_CURRENT_CONVERSATION={id:c.id,peerId:await peerOf(c.id)};'
          if patch not in s and anchor in s:
            s=s.replace(anchor,anchor+patch,1); p.write_text(s,encoding='utf-8'); changed.append(str(p))
          p=Path('calls-v1.html'); s=p.read_text(encoding='utf-8')
          if '<script src="/wa-calls-v2.js"></script>' not in s:
            s=s.replace('</head>','<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/wa-calls-v2.js"></script><script src="/wa-call-future.js"></script><script src="/wa-direct-call.js"></script></head>',1)
            p.write_text(s,encoding='utf-8'); changed.append(str(p))
          print('changed:',changed)
      - name: Commit patch if needed
        run: |
          git config user.name "WhatsAfrica CTO"
          git config user.email "cto@whatsafrica.local"
          git add messaging-v6.html calls-v1.html
          git diff --cached --quiet && exit 0
          git commit -m "feat(calls): simplify direct audio video calls and activate sound UX"
          git push
