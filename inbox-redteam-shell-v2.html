<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>WASSAFRICA — Messages</title><script src="/wa-redteam-runtime-guard-v1.js"></script></head><body><div id="waBoot" style="font:600 15px system-ui;padding:24px;text-align:center">Ouverture de vos messages…</div><script>(async()=>{'use strict';try{const r=await fetch('/inbox-production-media.html',{cache:'no-store'});if(!r.ok)throw Error('INBOX_SOURCE_'+r.status);const html=await r.text(),doc=new DOMParser().parseFromString(html,'text/html');document.title=doc.title||'WASSAFRICA — Messages';for(const n of [...doc.head.children])if(n.tagName==='STYLE')document.head.appendChild(n.cloneNode(true));document.body.innerHTML=doc.body.innerHTML;for(const old of [...document.body.querySelectorAll('script')]){const s=document.createElement('script');for(const a of old.attributes)s.setAttribute(a.name,a.value);if(old.src){await new Promise((ok,no)=>{s.onload=ok;s.onerror=()=>no(Error('SCRIPT_LOAD_FAILED'));document.body.appendChild(s)})}else{s.textContent=old.textContent;document.body.appendChild(s)}}const load=(src,next)=>{const s=document.createElement('script');s.src=src;s.onload=next;s.onerror=next;document.body.appendChild(s)};load('/wa-messaging-key-recovery-v1.js',()=>load('/wa-messaging-finalizer-v1.js',()=>load('/wa-wassafrica-studio-v1.js',()=>load('/wa-media-healing-v1.js',()=>load('/wa-external-connect-v1.js',()=>load('/wa-responsive-media-v1.js',()=>load('/wa-wassafrica-brand-v1.js',()=>{})))))));}catch(e){document.body.innerHTML='<div style="font:600 15px system-ui;padding:24px;text-align:center"><b>Messagerie temporairement indisponible.</b><p>Réessayez dans quelques secondes.</p></div>';console.error(e)}})();</script></body></html>
