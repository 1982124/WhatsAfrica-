 const ap=await db.from('profiles').select('assistant_name').eq('user_id',link.owner_id).maybeSingle();assistantName=(ap.data?.assistant_name||'Votre assistant').trim()||'Votre assistant';

function fail(a,b){document.querySelector('#page').innerHTML='<section class="empty"><div class="eyebrow">WHATS AFRICA</div><h1>'+esc(a)+'</h1><p class="bio">'+esc(b)+'</p><a class="btn primary" href="/">Ouvrir WhatsAfrica</a></section>'}
function render(){
 const name=business.name||link.title||'Entreprise WhatsAfrica',logo=safeImage(business.logo_url),avatar=logo?'<img class="avatar" src="'+esc(logo)+'" alt="'+esc(name)+'">':'<div class="avatar" style="display:flex;align-items:center;justify-content:center;font:bold 25px Georgia;color:#120f1f">'+esc(name.slice(0,2).toUpperCase())+'</div>';
 document.title=name+' — WhatsAfrica';
 const productsHtml=products.length?products.map(p=>{const image=safeImage(p.image_url);const price=p.price!==null&&p.price!==''?money(p.price,p.currency||'XOF'):'Prix sur demande';const stock=p.stock===0?'Rupture de stock':p.stock>0?'Disponible':'';return '<article class="card">'+(image?'<img class="product-img" src="'+esc(image)+'" alt="'+esc(p.title)+'" loading="lazy">':'')+'<div class="prodrow"><div><strong>'+esc(p.title)+'</strong><div class="desc">'+esc(p.description||'')+'</div>'+(stock?'<div class="meta">'+esc(stock)+'</div>':'')+'</div><div class="price">'+price+'</div></div><div class="actions">'+(p.stock===0?'<button class="btn secondary" disabled>Indisponible</button>':'<button class="btn primary" data-buy="'+esc(p.id)+'">🛒 Commander</button>')+'<button class="btn secondary" data-share="'+esc(p.title)+'">↗️ Partager</button></div></article>'}).join(''):'<div class="card"><div class="desc">Aucun produit publié pour le moment.</div></div>';
 const statusesHtml=statuses.length?'<section><h2>Actualités</h2>'+statuses.map(s=>{const image=safeImage(s.image_url);return '<article class="card status">'+(s.caption||s.text_content?'<div>'+esc(s.caption||s.text_content)+'</div>':'')+(image?'<img src="'+esc(image)+'" alt="" loading="lazy">':'')+'</article>'}).join('')+'</section>':'';
 document.querySelector('#page').innerHTML='<section class="hero">'+avatar+'<div class="eyebrow">SMART LINK</div><h1>'+esc(name)+'</h1><p class="bio">'+esc(business.description||link.description||'Découvrez cette activité sur WhatsAfrica.')+'</p>'+(business.city||business.country?'<div class="meta">'+esc([business.city,business.country].filter(Boolean).join(' · '))+'</div>':'')+'<div class="actions" style="max-width:560px;margin:16px auto 0"><button class="btn primary" id="sharePage">🔗 Partager cette vitrine</button><button class="btn secondary" id="askTop">💬 Poser une question</button></div></section><section><h2>Produits & services</h2>'+productsHtml+'</section>'+statusesHtml+'<section class="assistant" id="assistant"><div class="eyebrow">VOTRE ASSISTANT COMMERCIAL</div><h2>Une question ?</h2><p class="desc">Je réponds à partir des informations publiques de cette activité.</p><div id="chat" class="chat"><div class="bubble bot">Bonjour 👋 Je suis ${esc(assistantName)}, votre assistante commerciale. Que souhaitez-vous savoir ?</div></div><div class="composer"><input id="q" maxlength="2000" placeholder="Ex. Quel est le prix ?"><button class="btn primary" id="send">Envoyer</button></div><div class="actions"><button class="btn secondary" data-quick="💰 Quel est le prix ?">💰 Prix</button><button class="btn secondary" data-quick="📦 Est-ce disponible ?">📦 Disponibilité</button><button class="btn secondary" data-quick="🚚 Livrez-vous ?">🚚 Livraison</button><button class="btn secondary" data-quick="🛒 Je veux commander">🛒 Commander</button></div></section><section class="cta"><strong>Vous aussi, présentez votre activité sur WhatsAfrica.</strong><p class="desc">Créez gratuitement votre Smart Link et partagez-le sur WhatsApp.</p><a class="btn primary" href="/dashboard">Créer mon Smart Link</a></section>';

function bindPage(name){
 document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const p=products.find(x=>x.id===b.dataset.buy);if(p){track('checkout_started','product',p.id);openCheckout(p)}});
 document.querySelectorAll('[data-share]').forEach(b=>b.onclick=()=>share(b.dataset.share));
 $('sharePage').onclick=()=>share(name);
 $('askTop').onclick=()=>document.querySelector('#assistant').scrollIntoView({behavior:'smooth'});
 document.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>sendMessage(b.dataset.quick));
 $('send').onclick=()=>sendMessage($('q').value);$('q').onkeydown=e=>{if(e.key==='Enter')sendMessage($('q').value)};
}
async function share(title){const data={title,text:'Découvrez '+title+' sur WhatsAfrica',url:location.href};if(navigator.share)navigator.share(data).catch(()=>{});else if(navigator.clipboard)await navigator.clipboard.writeText(location.href);track('smart_link_shared','smart_link',link.id,{title})}
function append(role,text){const d=document.createElement('div');d.className='bubble '+(role==='user'?'user':'bot');d.textContent=text;$('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight;return d}
async function sendMessage(text){const t=String(text||'').trim();if(!t)return;append('user',t);$('q').value='';const pending=append('bot','…');try{const payload={message:t,history:chatHistory.slice(-10),business:{display_name:business.name,country:business.country,bio:business.description,smartlink_slug:slug,assistant_name:assistantName,assistant_name:assistantName,assistant_name:assistantName,assistant_name:assistantName,assistant_name:assistantName,assistant_name:assistantName,assistant_name:assistantName,assistant_name:assistantName,assistant_name:assistantName,assistant_name:assistantName,assistant_name:assistantName,assistant_name:assistantName,assistant_name:assistantName,assistant_name:assistantName,delivery_enabled:!!business.delivery_enabled,delivery_fee:business.delivery_fee||0,payment_methods:business.payment_methods||['cash_on_delivery'],articles:products.map(p=>({id:p.id,title:p.title,description:p.description,price:p.price,currency:p.currency||'XOF',kind:'produit',stock:p.stock}))}};const r=await fetch('/api/assistant',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)}),d=await r.json();pending.remove();const answer=d.answer||d.error||'Service momentanément indisponible.';append('bot',answer);chatHistory.push({role:'user',content:t},{role:'assistant',content:answer});track('assistant_message','smart_link',link.id,{length:t.length})}catch(e){pending.remove();append('bot','Connexion momentanément indisponible. Vous pouvez contacter directement le vendeur.')}}
function openCheckout(first){cart=[{product:first,quantity:1}];document.querySelector('#page').innerHTML=checkoutHtml();renderCheckout();track('checkout_opened','product',first.id)}
function checkoutHtml(){return '<section class="checkout"><div class="back"><button class="btn secondary" id="back">← Retour aux produits</button></div><div class="eyebrow">COMMANDE</div><h1 style="font:600 30px Georgia,serif">Votre commande</h1><div id="cart"></div><div class="field"><label>Nom complet *</label><input id="buyerName" autocomplete="name" placeholder="Votre nom"></div><div class="field"><label>Téléphone *</label><input id="buyerPhone" inputmode="tel" autocomplete="tel" placeholder="Ex. 7X XX XX XX"></div><div class="field"><label>Mode de livraison</label><div class="choice"><label><input type="radio" name="delivery" value="pickup" checked> Retrait / rendez-vous</label>'+(business.delivery_enabled?'<label><input type="radio" name="delivery" value="delivery"> Livraison · '+money(business.delivery_fee||0,'XOF')+'</label>':'')+'</div></div><div id="deliveryFields" class="hidden"><div class="field"><label>Ville</label><input id="city" placeholder="Bamako"></div><div class="field"><label>Adresse / point de rendez-vous *</label><textarea id="address" placeholder="Quartier, rue, repère…"></textarea></div></div><div class="field"><label>Paiement</label><div id="paymentChoices" class="choice"></div></div><div id="checkoutMsg"></div><button class="btn primary" style="width:100%;margin-top:12px" id="placeOrder">✅ Confirmer la commande</button><p class="meta" style="margin-top:10px">Aucun compte n’est nécessaire pour commander.</p></section>'}
function renderCheckout(){
 $('back').onclick=()=>render();

 document.querySelectorAll('input[name=delivery]').forEach(x=>x.onchange=()=>{$('deliveryFields').classList.toggle('hidden',x.value!=='delivery')});
 $('placeOrder').onclick=placeOrder;updateCart();
}
function updateCart(){
 $('cart').innerHTML=cart.map((x,i)=>'<div class="card"><div class="summary"><span><strong>'+esc(x.product.title)+'</strong></span><span>'+money(x.product.price*x.quantity,x.product.currency||'XOF')+'</span></div><div class="meta">Quantité <button class="btn secondary" style="padding:5px 10px" data-minus="'+i+'">−</button> '+x.quantity+' <button class="btn secondary" style="padding:5px 10px" data-plus="'+i+'">+</button></div></div>').join('');document.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>{cart[+b.dataset.minus].quantity=Math.max(1,cart[+b.dataset.minus].quantity-1);updateCart()});document.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>{const x=cart[+b.dataset.plus];x.quantity=Math.min(99,x.quantity+1);if(x.product.stock!==null)x.quantity=Math.min(x.quantity,x.product.stock);updateCart()});
 const sub=cart.reduce((a,x)=>a+Number(x.product.price||0)*x.quantity,0);const del=document.querySelector('input[name=delivery]:checked')?.value==='delivery'?Number(business.delivery_fee||0):0;$('cart').insertAdjacentHTML('beforeend','<div class="summary"><span>Sous-total</span><strong>'+money(sub,cart[0]?.product.currency||'XOF')+'</strong></div><div class="summary"><span>Livraison</span><strong>'+money(del,cart[0]?.product.currency||'XOF')+'</strong></div><div class="summary total"><span>Total</span><strong>'+money(sub+del,cart[0]?.product.currency||'XOF')+'</strong></div>');
}
async function placeOrder(){
 const name=$('buyerName').value.trim(),phone=$('buyerPhone').value.trim(),delivery=document.querySelector('input[name=delivery]:checked')?.value||'pickup',payment=document.querySelector('input[name=payment]:checked')?.value||'cash_on_delivery';
 const msg=$('checkoutMsg');msg.innerHTML='';if(name.length<2||phone.replace(/\D/g,'').length<8){msg.innerHTML='<div class="error">Veuillez renseigner un nom et un numéro de téléphone valides.</div>';return}if(delivery==='delivery'&&!$('address').value.trim()){msg.innerHTML='<div class="error">Veuillez renseigner l’adresse de livraison.</div>';return}
 $('placeOrder').disabled=true;$('placeOrder').textContent='Enregistrement…';
 const idempotency=crypto.randomUUID()+'-'+Date.now();const items=cart.map(x=>({product_id:x.product.id,quantity:x.quantity}));
 const {data,error}=await db.rpc('create_guest_order',{p_business_id:business.id,p_smart_link_id:link.id,p_buyer_name:name,p_buyer_phone:phone,p_delivery_city:delivery==='delivery'?$('city').value.trim():null,p_delivery_address:delivery==='delivery'?$('address').value.trim():null,p_delivery_method:delivery,p_payment_method:payment,p_items:items,p_idempotency_key:idempotency,p_buyer_user_id:null});
 if(error){msg.innerHTML='<div class="error">'+esc(error.message||'Impossible de créer la commande.')+'</div>';$('placeOrder').disabled=false;$('placeOrder').textContent='✅ Confirmer la commande';return}

}
function renderSuccess(data,name,payment){document.querySelector('#page').innerHTML='<section class="success"><div class="eyebrow">COMMANDE CONFIRMÉE</div><h1 style="font:600 32px Georgia,serif">Merci '+esc(name)+' 🎉</h1><div class="notice">Votre commande a été enregistrée. Le vendeur a été notifié.</div><p>Commande <span class="order-id">#'+esc(String(data.order_id).slice(0,8).toUpperCase())+'</span></p><p>Montant : <strong>'+money(data.total,data.currency||'XOF')+'</strong></p><p>Paiement : <strong>'+esc(payment==='cash_on_delivery'?'À la livraison / au retrait':payment)+'</strong></p><p class="meta">Conservez ce lien de suivi :</p><div class="track">'+esc(location.origin+'/commande/'+data.tracking_token)+'</div><div class="actions"><button class="btn primary" id="copyTrack">📋 Copier le suivi</button><a class="btn secondary" href="/">Découvrir WhatsAfrica</a></div><div class="cta"><strong>Vous voulez retrouver vos commandes ?</strong><p class="desc">Créez votre espace WhatsAfrica avec votre email et votre mot de passe.</p><a class="btn primary" href="/dashboard">Créer mon espace</a></div></section>';$('copyTrack').onclick=()=>navigator.clipboard?.writeText(location.origin+'/commande/'+data.tracking_token);track('order_confirmation_viewed','order',data.order_id)}
async function loadTracking(token){const r=await db.from('orders').select('id,status,payment_status,total,currency,buyer_name,created_at').eq('tracking_token',token).maybeSingle();if(r.error||!r.data){fail('Commande introuvable','Vérifiez votre lien de suivi.');return}const o=r.data;document.querySelector('#page').innerHTML='<section class="success"><div class="eyebrow">SUIVI DE COMMANDE</div><h1 style="font:600 32px Georgia,serif">Commande #'+esc(String(o.id).slice(0,8).toUpperCase())+'</h1><p>Bonjour '+esc(o.buyer_name)+'.</p><div class="notice">Statut : <strong>'+esc(statusLabel(o.status))+'</strong></div><p>Paiement : '+esc(o.payment_status)+'</p><p>Total : <strong>'+money(o.total,o.currency||'XOF')+'</strong></p><a class="btn primary" href="/'+esc(slug)+'">Retour à la boutique</a></section>'}
function statusLabel(s){return({pending:'En attente de confirmation',confirmed:'Commande confirmée',preparing:'En préparation',shipping:'En livraison',delivered:'Livrée',cancelled:'Annulée',problem:'Problème à traiter'})[s]||s}
const trackingMatch=location.pathname.match(/^\/commande\/([^/]+)/);if(trackingMatch)loadTracking(trackingMatch[1]);else load().catch(()=>fail('Erreur temporaire','Réessayez dans quelques instants.'));
</script>
</body></html>
