<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>Collection — WASSAFRICA</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f7f3ea;color:#17231e;font:15px/1.55 system-ui}.wrap{max-width:1050px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #ded8ca;border-radius:22px;padding:20px;margin:14px 0}.hero{display:grid;grid-template-columns:1fr 1fr;gap:20px}.cover,.thumb{width:100%;object-fit:cover;border-radius:16px;background:#edf1ed}.cover{max-height:480px}.thumb{height:190px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.item{border:1px solid #e1ddd4;border-radius:17px;padding:14px}.btn{display:inline-block;padding:10px 13px;border-radius:10px;background:#173d2d;color:#fff;text-decoration:none;font-weight:850;border:0}.share{display:flex;gap:8px;flex-wrap:wrap}.muted{color:#6c746f}.media{width:100%;max-height:430px;border-radius:16px;background:#111}@media(max-width:760px){.hero,.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a href="/marche" class="btn">← Marché</a><div id="app" class="card">Chargement…</div></main><script>
const db=supabase.createClient('https://dzifpwqrqnvssfhwjccj.supabase.co','sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV',{auth:{persistSession:true,autoRefreshToken:true,storage:localStorage,storageKey:'whatsafrica-auth'}});const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const id=decodeURIComponent(location.pathname.split('/')[2]||'');const enc=encodeURIComponent;
async function load(){if(!id)return app.textContent='Collection introuvable.';const preview=new URLSearchParams(location.search).get('preview')==='1';let c;if(preview){const s=await db.auth.getSession();if(!s.data.session)return app.innerHTML='<h2>Aperçu réservé au propriétaire</h2><p class="muted">Connectez-vous pour prévisualiser cette Collection en brouillon.</p><a class="btn" href="/auth?next='+encodeURIComponent(location.href)+'">Se connecter</a>';c=await db.from('product_collections').select('*,businesses(name,owner_id)').eq('id',id).single();if(c.error||c.data?.businesses?.owner_id!==s.data.session.user.id)return app.textContent='Aperçu non autorisé.';}else{c=await db.from('product_collections').select('*,businesses(name)').eq('id',id).eq('is_published',true).single();if(c.error)return app.textContent='Collection introuvable ou non publiée.';}const i=await db.from('product_collection_items').select('product_id,sort_order,products(id,title,description,price,currency,image_url,is_published,author_name)').eq('collection_id',id).order('sort_order');const ps=(i.data||[]).map(x=>x.products).filter(p=>p?.is_published);const m=await db.from('collection_media').select('media_type,media_url,title,alt_text,sort_order').eq('collection_id',id).order('sort_order');const media=m.data||[],gallery=media.filter(x=>x.media_type==='gallery'),videos=media.filter(x=>['teaser_video','presentation_video'].includes(x.media_type));const d=c.data,cover=d.cover_url||media.find(x=>x.media_type==='cover')?.media_url,u=location.href;
app.innerHTML='<section class="card hero"><div>'+(cover?'<img class="cover" src="'+esc(cover)+'" alt="'+esc(d.name)+'">':'')+'</div><div><h1>'+esc(d.name)+'</h1>'+(d.subtitle?'<h2>'+esc(d.subtitle)+'</h2>':'')+'<p>'+esc(d.description||'')+'</p><p class="muted">'+[d.audience,d.age_range,d.language,d.region,d.category].filter(Boolean).map(esc).join(' · ')+'</p>'+(d.price!=null?'<p><b>'+Number(d.price).toLocaleString('fr-FR')+' '+esc(d.currency||'XOF')+'</b> pour toute la Collection</p>':'')+'<p>Par <b>'+esc(d.businesses?.name||'')+'</b> · '+ps.length+' produit(s)</p><div class="share"><a class="btn" href="https://wa.me/?text='+enc('Découvrez cette Collection WASSAFRICA : '+u)+'">WhatsApp</a><a class="btn" href="https://www.facebook.com/sharer/sharer.php?u='+enc(u)+'">Facebook</a><a class="btn" href="https://t.me/share/url?url='+enc(u)+'&text='+enc(d.name)+'">Telegram</a><button class="btn" onclick="navigator.clipboard.writeText(location.href)">Copier</button></div></div></section>'+(d.teaser_video_url?'<section class="card"><h2>Découvrez la Collection</h2><video class="media" controls playsinline src="'+esc(d.teaser_video_url)+'"></video></section>':'')+(videos.length?'<section class="card"><h2>Présentation</h2>'+videos.map(v=>'<video class="media" controls playsinline src="'+esc(v.media_url)+'"></video>').join('')+'</section>':'')+(gallery.length?'<section class="card"><h2>Galerie</h2><div class="grid">'+gallery.map(g=>'<img class="thumb" src="'+esc(g.media_url)+'" alt="'+esc(g.alt_text||g.title||'')+'">').join('')+'</div></section>':'')+'<section class="card"><h2>Dans cette Collection</h2><div class="grid">'+(ps.map(p=>'<article class="item">'+(p.image_url?'<img class="thumb" src="'+esc(p.image_url)+'" alt="">':'')+'<h3>'+esc(p.title)+'</h3>'+(p.author_name?'<p class="muted">Par '+esc(p.author_name)+'</p>':'')+'<p class="muted">'+esc((p.description||'').slice(0,220))+'</p><p><b>'+Number(p.price||0).toLocaleString('fr-FR')+' '+esc(p.currency||'XOF')+'</b></p><a class="btn" href="/product/'+enc(p.id)+'">Voir / acheter</a></article>').join('')||'<p class="muted">Cette Collection ne contient pas encore de produit publié.</p>')+'</div></section>';};load();
</script></body></html>
