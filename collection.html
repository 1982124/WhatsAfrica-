<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>Collection — WASSAFRICA</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f7f3ea;color:#17231e;font:15px/1.5 system-ui}.wrap{max-width:1000px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #ded8ca;border-radius:20px;padding:18px;margin:14px 0}.cover{width:100%;max-height:360px;object-fit:cover;border-radius:16px;background:#edf1ed}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.item{border:1px solid #e1ddd4;border-radius:16px;padding:14px;background:#fff}.btn{display:inline-block;padding:10px 13px;border-radius:10px;background:#173d2d;color:#fff;text-decoration:none;font-weight:850}.muted{color:#6c746f}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a href="/marche" class="btn">← Marché</a><section id="app" class="card">Chargement…</section></main><script>
const db=supabase.createClient('https://dzifpwqrqnvssfhwjccj.supabase.co','sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV');const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const id=decodeURIComponent(location.pathname.split('/')[2]||'');async function load(){if(!id){app.textContent='Collection introuvable.';return}const c=await db.from('product_collections').select('id,name,description,cover_url,business_id,is_published,businesses(name)').eq('id',id).eq('is_published',true).single();if(c.error){app.textContent='Collection introuvable ou non publiée.';return}const i=await db.from('collection_items').select('product_id,sort_order,products(id,title,description,price,currency,product_type,is_published)').eq('collection_id',id).order('sort_order');const products=(i.data||[]).map(x=>x.products).filter(Boolean).filter(x=>x.is_published);app.innerHTML=(c.data.cover_url?'<img class="cover" src="'+esc(c.data.cover_url)+'" alt="">':'')+'<h1>'+esc(c.data.name)+'</h1><p class="muted">'+esc(c.data.description||'')+'</p><p>Par <b>'+esc(c.data.businesses?.name||'')+'</b> · '+products.length+' produit(s)</p><div class="grid">'+products.map(p=>'<article class="item"><h2>'+esc(p.title)+'</h2><p class="muted">'+esc(p.description||'').slice(0,180)+'</p><p><b>'+Number(p.price||0).toLocaleString('fr-FR')+' '+esc(p.currency||'XOF')+'</b></p><a class="btn" href="/product/'+encodeURIComponent(p.id)+'">Voir / acheter</a></article>').join('')+'</div>';};load();
</script></body></html>
