<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WASSAFRICA — Message</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#f5f7f6;--card:#fff;--line:#dce5e1;--text:#17211b;--muted:#66756e;--primary:#e8a83c;--mine:#dcf8c6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,sans-serif}.wrap{max-width:720px;margin:auto;padding:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;margin:10px 0;padding:14px}.top{display:flex;align-items:center;gap:10px}.avatar{width:46px;height:46px;border-radius:50%;background:#eef4f1;display:grid;place-items:center;font-weight:900}.name{font-size:18px;font-weight:900}.muted{color:var(--muted);font-size:13px}.messages{min-height:52vh;max-height:65vh;overflow:auto;padding:8px}.msg{max-width:82%;width:max-content;padding:9px 11px;border-radius:14px;background:#eef2f0;margin:7px 0;white-space:pre-wrap;overflow-wrap:anywhere}.mine{margin-left:auto;background:var(--mine)}.composer{display:flex;gap:8px;margin-top:10px}.composer input{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit}.btn{border:0;border-radius:12px;padding:11px 15px;background:var(--primary);font-weight:850;cursor:pointer}.status{padding:8px 0}.err{color:#b42318}.ok{color:#18845d}</style></head><body><div class="wrap"><div class="top"><b>🌍 WASSAFRICA</b><span class="muted">Trouve. Parle. Fais affaire.</span></div><section class="card"><div class="top"><div id="avatar" class="avatar">W</div><div><div id="name" class="name">Chargement…</div><div id="country" class="muted"></div></div></div><div class="muted" style="margin-top:9px">💬 Vous pouvez écrire directement, <b>sans créer de compte</b>.</div></section><section class="card"><div id="messages" class="messages"></div><form id="composer" class="composer"><input id="body" maxlength="4000" autocomplete="off" placeholder="Écrire un message…"><button id="send" class="btn">➤ Envoyer</button></form><div id="status" class="status muted"></div></section></div><script>(function(){'use strict';const URL='https://dzifpwqrqnvssfhwjccj.supabase.co',KEY='sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV',db=window.supabase.createClient(URL,KEY);const $=id=>document.getElementById(id);let token=localStorage.getItem('wa-guest-lead-token');if(!token){const a=new Uint8Array(32);crypto.getRandomValues(a);token=Array.from(a).map(x=>x.toString(16).padStart(2,'0')).join('');localStorage.setItem('wa-guest-lead-token',token)}let target=null;function params(){const u=new URLSearchParams(location.search);return{to:u.get('to'),slug:u.get('slug')}}function status(t,c){$('status').textContent=t;$('status').className='status '+(c||'muted')}function escText(s){return String(s||'')}async function resolve(){const p=params();let r;if(p.slug)r=await db.rpc('resolve_public_profile',{p_slug:p.slug});else if(p.to)r=await db.from('profiles').select('user_id,display_name,public_display_name,country,avatar_url,profile_image_url,profile_photo_url').or('user_id.eq.'+p.to+',id.eq.'+p.to).limit(1);else throw Error('DESTINATION_REQUIRED');if(r.error)throw r.error;target=r.data?.[0];if(!target)throw Error('TARGET_NOT_FOUND');const n=target.public_display_name||target.display_name||'Membre WhatsAfrica';$('name').textContent=n;$('country').textContent=target.country||'';const av=target.avatar_url||target.profile_image_url||target.profile_photo_url;if(av)$('avatar').style.background='url('+av+') center/cover';else $('avatar').textContent=n.slice(0,1).toUpperCase()}function render(rows){const box=$('messages');box.innerHTML='';for(const m of rows||[]){const d=document.createElement('div');d.className='msg '+(m.sender_role==='guest'?'mine':'');d.textContent=escText(m.body);box.appendChild(d)}box.scrollTop=box.scrollHeight}async function load(){const r=await db.rpc('get_guest_messages',{p_guest_token:token});if(r.error)throw r.error;render(r.data)}async function startWithFirst(text){const r=await db.rpc('start_guest_conversation',{p_target_user_id:target.user_id,p_guest_token:token,p_guest_name:null,p_message:text||null});if(r.error)throw r.error;return r.data}async function send(e){e.preventDefault();const input=$('body'),text=input.value.trim();if(!text)return;input.disabled=true;$('send').disabled=true;try{await startWithFirst(text);input.value='';await load();status('Message envoyé. Vous restez sans compte.','ok')}catch(err){status('Envoi impossible : '+(err.message||err),'err')}finally{input.disabled=false;$('send').disabled=false;input.focus()}}async function poll(){try{await load()}catch(e){}}$('composer').addEventListener('submit',send);(async()=>{try{await resolve();await load();status('Messagerie publique prête.','ok');setInterval(poll,2500)}catch(e){$('name').textContent='Messagerie indisponible';status(e.message||String(e),'err')}})();})();</script></body></html>
