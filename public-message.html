<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#075e54"><title>WASSAFRICA — Messages</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#efeae2;--card:#fff;--line:#d8ddd9;--text:#17211b;--muted:#66756e;--primary:#075e54;--mine:#d9fdd3;--soft:#f0f2f5;--accent:#25d366}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,sans-serif}.app{height:100%;max-width:980px;margin:auto;display:flex;flex-direction:column;background:var(--bg)}.top{background:var(--primary);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}.back{color:#fff;text-decoration:none;font-size:22px}.avatar{width:42px;height:42px;border-radius:50%;background:#dfe8e5;display:grid;place-items:center;font-weight:900;color:#075e54;background-size:cover;background-position:center;flex:0 0 42px}.head{min-width:0;flex:1}.name{font-size:17px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.presence{font-size:12px;opacity:.82}.icon{border:0;background:transparent;color:#fff;font-size:21px;cursor:pointer;padding:7px}.messages{flex:1;overflow:auto;padding:18px 12px 10px;background-color:#efeae2;background-image:radial-gradient(#d9d0c5 1px,transparent 1px);background-size:18px 18px}.bubble{max-width:min(78%,620px);width:max-content;padding:8px 10px 6px;border-radius:8px;background:#fff;margin:6px 0;box-shadow:0 1px 1px #00000012;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.mine{margin-left:auto;background:var(--mine)}.meta{font-size:10px;color:#66756e;text-align:right;margin-top:3px}.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted);padding:30px}.composerWrap{padding:8px;background:#f0f2f5;display:flex;gap:8px;align-items:center;position:sticky;bottom:0}.composer{display:flex;gap:8px;flex:1}.composer input{flex:1;min-width:0;border:0;border-radius:22px;padding:12px 16px;background:#fff;color:inherit;font:inherit;outline:none}.send{width:44px;height:44px;border:0;border-radius:50%;background:var(--primary);color:#fff;font-size:19px;cursor:pointer}.send:disabled{opacity:.55}.status{padding:4px 12px;background:#f0f2f5;color:var(--muted);font-size:12px;min-height:18px}.ok{color:#18845d}.err{color:#b42318}.join{display:none;margin:10px auto;padding:12px 14px;max-width:650px;background:#fff;border:1px solid var(--line);border-radius:14px}.join.show{display:block}.join a{display:inline-block;margin-top:8px;text-decoration:none;color:#fff;background:var(--primary);padding:10px 14px;border-radius:10px;font-weight:800}@media(min-width:981px){.app{margin-top:12px;height:calc(100% - 24px);border-radius:16px;overflow:hidden;box-shadow:0 12px 50px #00000018}} </style><script src="/brand-normalizer.js"></script></head><body><div class="app"><header class="top"><a class="back" href="javascript:history.back()" aria-label="Retour">‹</a><div id="avatar" class="avatar">W</div><div class="head"><div id="name" class="name">Chargement…</div><div id="presence" class="presence">Messagerie WASSAFRICA</div></div><button class="icon" title="Appeler" aria-label="Appeler" id="call">☎</button><button class="icon" title="Informations" aria-label="Informations" id="info">⋮</button></header><main id="messages" class="messages"><div id="empty" class="empty"><div><div style="font-size:42px">💬</div><b>Ouverture de la conversation…</b></div></div></main><div id="status" class="status">Messagerie publique prête.</div><div id="join" class="join"><b>👤 Gardez votre conversation sur WASSAFRICA</b><div class="muted">Créez un compte après votre premier message. L'inscription n'est pas nécessaire pour écrire.</div><a id="joinLink" href="/auth?next=/guest-claim.html">Créer mon compte</a></div><footer class="composerWrap"><span style="font-size:22px">＋</span><form id="composer" class="composer"><input id="body" maxlength="4000" autocomplete="off" autofocus placeholder="Écrire un message…"><button id="send" class="send" aria-label="Envoyer">➤</button></form></footer></div><script>(function(){'use strict';const URL='https://dzifpwqrqnvssfhwjccj.supabase.co',KEY='sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV',db=window.supabase.createClient(URL,KEY);const $=id=>document.getElementById(id);let target=null,token=sessionStorage.getItem('wa-guest-session-v2'),lastCount=0,pollTimer=null;function params(){const u=new URLSearchParams(location.search);return{to:u.get('to'),slug:u.get('slug'),business:u.get('business')}}function status(t,c){$('status').textContent=t;$('status').className='status '+(c||'')}async function ensureGuestSession(){if(token)return token;const r=await db.rpc('bootstrap_guest_session');if(r.error)throw r.error;token=r.data?.token;if(!token)throw Error('GUEST_SESSION_INIT_FAILED');sessionStorage.setItem('wa-guest-session-v2',token);return token}async function resolve(){const p=params();let r;if(p.slug)r=await db.rpc('resolve_public_profile',{p_slug:p.slug});else if(p.business){const b=await db.from('businesses').select('owner_id,name,phone').eq('id',p.business).maybeSingle();if(b.error)throw b.error;if(!b.data?.owner_id)throw Error('BUSINESS_NOT_FOUND');r=await db.rpc('resolve_public_profile',{p_slug:'__invalid__'});r={data:[]};r.data=[{user_id:b.data.owner_id,display_name:b.data.name,public_display_name:b.data.name,country:'',avatar_url:'',profile_image_url:'',profile_photo_url:'',phone:b.data.phone||''}]}else if(p.to)r=await db.from('profiles').select('user_id,display_name,public_display_name,country,avatar_url,profile_image_url,profile_photo_url').or('user_id.eq.'+p.to+',id.eq.'+p.to).limit(1);else throw Error('DESTINATION_REQUIRED');if(r.error)throw r.error;target=r.data?.[0];if(!target)throw Error('TARGET_NOT_FOUND');const n=target.public_display_name||target.display_name||'Business WASSAFRICA';$('name').textContent=n;$('presence').textContent='En ligne sur WASSAFRICA';const av=target.avatar_url||target.profile_image_url||target.profile_photo_url;if(av)$('avatar').style.backgroundImage='url('+JSON.stringify(av)+')';else $('avatar').textContent=n.slice(0,1).toUpperCase();if(target.phone)$('call').onclick=()=>location.href='tel:'+target.phone;else $('call').style.display='none'}function render(rows){const box=$('messages');const data=rows||[];if(!data.length){box.innerHTML='<div class="empty"><div><div style="font-size:42px">💬</div><b>Commencez la conversation</b><div style="margin-top:6px">Votre premier message part directement au business.</div></div></div>';lastCount=0;return}box.innerHTML='';for(const m of data){const d=document.createElement('div');d.className='bubble '+(m.sender_role==='guest'?'mine':'');d.textContent=String(m.body||'');const meta=document.createElement('div');meta.className='meta';meta.textContent=new Date(m.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});d.appendChild(meta);box.appendChild(d)}box.scrollTop=box.scrollHeight;lastCount=data.length}async function load(silent=false){if(!token)return;const r=await db.rpc('get_guest_messages',{p_guest_token:token});if(r.error)throw r.error;const changed=(r.data?.length||0)!==lastCount;if(changed)render(r.data);if(!silent)status('Messagerie publique prête.','ok')}async function send(e){e.preventDefault();const input=$('body'),text=input.value.trim();if(!text||!target?.user_id)return;input.disabled=true;$('send').disabled=true;const optimistic={sender_role:'guest',body:text,created_at:new Date().toISOString()};const box=$('messages');if(lastCount===0)box.innerHTML='';const d=document.createElement('div');d.className='bubble mine';d.textContent=text;const meta=document.createElement('div');meta.className='meta';meta.textContent='Envoi…';d.appendChild(meta);box.appendChild(d);box.scrollTop=box.scrollHeight;try{await ensureGuestSession();const r=await db.rpc('start_guest_conversation',{p_target_user_id:target.user_id,p_guest_token:token,p_guest_name:null,p_message:text});if(r.error)throw r.error;input.value='';$('join').classList.add('show');meta.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+' ✓';lastCount=lastCount+1;status('Envoyé. Le business peut répondre immédiatement.','ok');await load(true)}catch(err){d.remove();const m=String(err.message||err);status(m.includes('RATE_LIMITED')?'Trop de messages. Réessayez plus tard.':m.includes('GUEST_SESSION_EXPIRED')?'Session expirée. Rechargez la page.':'Envoi impossible : '+m,'err')}finally{input.disabled=false;$('send').disabled=false;input.focus()}}$('composer').addEventListener('submit',send);$('body').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('composer').requestSubmit()}});$('info').onclick=()=>status('Conversation publique WASSAFRICA · inscription facultative.');(async()=>{try{await resolve();await ensureGuestSession();await load();clearInterval(pollTimer);pollTimer=setInterval(()=>load(true).catch(()=>{}),1000);$('body').focus()}catch(e){$('name').textContent='Messagerie indisponible';status(e.message||String(e),'err')}})();})();</script></body></html>
