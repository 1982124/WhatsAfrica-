<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WhatsAfrica — CRM</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font:15px system-ui;background:#090d17;color:#f8f5eb}*{box-sizing:border-box}.wrap{max-width:1200px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #26334c;padding-bottom:16px}.brand{font-size:24px;font-weight:900}.brand b{color:#f2b84b}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;background:#f2b84b}.ghost{background:transparent;color:#fff;border:1px solid #26334c}.card{background:#111827;border:1px solid #26334c;border-radius:16px;padding:18px;margin-top:16px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.stat{font-size:28px;font-weight:900}.muted{color:#98a5bb}input,select,textarea{width:100%;padding:11px;margin:6px 0;background:#0b1220;color:#fff;border:1px solid #26334c;border-radius:9px}.pipeline{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.col{min-height:300px;background:#0b1220;border:1px solid #26334c;border-radius:12px;padding:10px}.lead{background:#111827;border:1px solid #26334c;border-radius:10px;padding:11px;margin:8px 0}.hidden{display:none}.ok{color:#57d39b}.err{color:#ff8f8f}@media(max-width:900px){.grid,.pipeline{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid,.pipeline{grid-template-columns:1fr}.wrap{padding:14px}}</style></head><body><div class="wrap"><div class="top"><div class="brand">Whats<b>Africa</b> <span class="muted">/ CRM</span></div><div><a class="btn ghost" href="/dashboard">Dashboard</a> <button id="logout" class="btn ghost">Déconnexion</button></div></div><div id="auth" class="card"><h2>Connexion CRM</h2><p class="muted">E-mail + mot de passe. Accès réservé à votre activité.</p><input id="email" type="email" placeholder="E-mail"><input id="password" type="password" placeholder="Mot de passe"><button id="login" class="btn">Se connecter</button><p id="authMsg" class="muted"></p></div><main id="app" class="hidden"><h1>Inbox & CRM</h1><p class="muted">Transformez les conversations, Smart Links, statuts et Lives en prospects suivis.</p><div class="grid"><div class="card"><div class="muted">Nouveaux</div><div id="s_new" class="stat">0</div></div><div class="card"><div class="muted">Qualifiés</div><div id="s_qualified" class="stat">0</div></div><div class="card"><div class="muted">Offres</div><div id="s_offer" class="stat">0</div></div><div class="card"><div class="muted">Gagnés</div><div id="s_won" class="stat">0</div></div><div class="card"><div class="muted">Relances</div><div id="s_follow" class="stat">0</div></div></div><div class="card"><h2>➕ Nouveau prospect</h2><div class="grid"><input id="name" placeholder="Nom"><input id="phone" placeholder="Téléphone"><input id="email2" placeholder="E-mail"><input id="source" placeholder="Source : Smart Link, Statut, Live…"><input id="value" type="number" placeholder="Valeur potentielle"></div><textarea id="notes" placeholder="Besoin / notes"></textarea><button id="add" class="btn">Créer le prospect</button><span id="msg" class="muted"></span></div><div class="card"><h2>Pipeline commercial</h2><div id="pipeline" class="pipeline"></div></div></main></div><script>const db=supabase.createClient('https://dzifpwqrqnvssfhwjccj.supabase.co','sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV'),$=x=>document.getElementById(x);let user=null,business=null;const stages=[['new','Nouveau'],['contacted','Contacté'],['qualified','Qualifié'],['offer','Offre'],['negotiation','Négociation'],['won','Gagné']];async function init(){const s=await db.auth.getSession();if(!s.data.session)return;user=s.data.session.user;const b=await db.from('businesses').select('id,name,slug').eq('owner_id',user.id).maybeSingle();business=b.data;if(!business){$('authMsg').textContent='Aucune activité créée. Créez votre Smart Link depuis le Dashboard.';return}$('auth').classList.add('hidden');$('app').classList.remove('hidden');load()}async function load(){const r=await db.from('leads').select('*').eq('business_id',business.id).order('updated_at',{ascending:false});if(r.error){$('msg').textContent=r.error.message;return}const leads=r.data||[];for(const [key] of stages)$('s_'+key).textContent=leads.filter(x=>x.status===key).length;$('s_follow').textContent=leads.filter(x=>x.next_follow_up_at&&new Date(x.next_follow_up_at)<=new Date()).length;$('pipeline').innerHTML=stages.map(([key,label])=>`<section class="col"><strong>${label}</strong>${leads.filter(x=>x.status===key).map(x=>`<article class="lead"><b>${esc(x.contact_name||'Prospect')}</b><div class="muted">${esc(x.source||'—')} ${x.value_amount?'· '+x.value_amount:''}</div><p>${esc(x.notes||'')}</p><select data-id="${x.id}" class="stage">${stages.map(([k,l])=>`<option value="${k}" ${x.status===k?'selected':''}>${l}</option>`).join('')}</select></article>`).join('')||'<p class="muted">Aucun prospect</p>'}</section>`).join('');document.querySelectorAll('.stage').forEach(s=>s.onchange=async()=>{const r=await db.from('leads').update({status:s.value,updated_at:new Date().toISOString()}).eq('id',s.dataset.id).eq('business_id',business.id);if(!r.error)load()})}function esc(v){return String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}$('login').onclick=async()=>{const r=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error)$('authMsg').textContent=r.error.message;else init()};$('logout').onclick=()=>db.auth.signOut().then(()=>location.reload());$('add').onclick=async()=>{if(!business)return;$('msg').textContent='';const r=await db.from('leads').insert({business_id:business.id,user_id:null,source:$('source').value.trim()||'manuel',status:'new',priority:'normal',contact_name:$('name').value.trim(),contact_email:$('email2').value.trim()||null,contact_phone:$('phone').value.trim()||null,notes:$('notes').value.trim()||null,value_amount:Number($('value').value)||null}).select().single();if(r.error){$('msg').innerHTML='<span class="err">'+esc(r.error.message)+'</span>'}else{$('msg').innerHTML='<span class="ok">Prospect créé.</span>';$('name').value=$('phone').value=$('email2').value=$('source').value=$('value').value=$('notes').value='';load()}};init();</script></body></html>
