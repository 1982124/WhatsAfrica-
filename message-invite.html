<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071b16"><title>WASSAFRICA — Message sécurisé</title><style>:root{--bg:#071b16;--panel:#0e2922;--line:#23473b;--ink:#f5f7f3;--muted:#aebbb4;--green:#42c77a;--gold:#e8b64b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 5%,#2c8b5b33,transparent 32%),linear-gradient(145deg,#071b16,#0a211b 52%,#061510);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{width:min(760px,100%);margin:auto;padding:20px}.brand{font-weight:950;font-size:23px;margin-bottom:18px}.card{background:#0f241f;border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 18px 55px #0005;margin-top:14px}.badge{display:inline-flex;align-items:center;gap:8px;border:1px solid #42c77a55;background:#42c77a12;color:#8ce8b8;padding:7px 10px;border-radius:999px;font-weight:850;font-size:12px}.title{font-size:clamp(30px,7vw,48px);line-height:1;margin:16px 0 12px;letter-spacing:-2px}.muted{color:var(--muted);line-height:1.6}.msg{margin-top:18px;background:#dcf8c6;color:#17211b;border-radius:18px 18px 18px 5px;padding:16px 17px;font-size:18px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;min-height:58px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:900;cursor:pointer;background:var(--green);color:#08160f;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.secondary{background:#162e27;color:var(--ink);border:1px solid var(--line)}.status{min-height:24px;margin-top:12px;color:var(--muted);font-size:13px}.warn{background:#35271b;border:1px solid #6c4e27;color:#f6db9c;border-radius:14px;padding:12px;line-height:1.5;margin-top:14px}.hidden{display:none!important}@media(max-width:520px){.wrap{padding:12px}.card{padding:19px;border-radius:20px}.actions .btn{width:100%}}</style></head><body><main class="wrap"><div class="brand">WASSAFRICA</div><section class="card"><span class="badge">🔒 MESSAGE SÉCURISÉ</span><h1 class="title" id="title">Un message vous attend.</h1><p class="muted" id="lead">Le message a été chiffré par l'expéditeur. Aucun compte WASSAFRICA n'est requis pour lire ce premier message dans ce lien.</p><div id="msg" class="msg hidden"></div><div id="warn" class="warn hidden"></div><div class="actions"><button id="accept" class="btn hidden">✅ Rejoindre la conversation</button><a id="login" class="btn secondary hidden" href="/auth?next=%2Fmessage-invite.html">Créer mon compte gratuitement</a></div><div id="status" class="status">Vérification de l'invitation…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(async()=>{'use strict';const SB='https://dzifpwqrqnvssfhwjccj.supabase.co',KEY='sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV',STORE='wa-message-invite-token-v1';const $=id=>document.getElementById(id),setStatus=t=>$('status').textContent=t;function linkToken(){const m=location.hash.match(/(?:^#|[&;])t=([^&;]+)/);return m?decodeURIComponent(m[1]):''}function token(){const t=linkToken();if(t)return t;try{return localStorage.getItem(STORE)||''}catch{return ''}}function save(t){try{localStorage.setItem(STORE,t)}catch{}}function clear(){try{localStorage.removeItem(STORE)}catch{}}function bin(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}async function key(t){return new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))}async function decrypt(t,ct,iv,cid){const raw=await key(t),k=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt']);const aad=new TextEncoder().encode('wassafrica:invite:'+cid);const p=await crypto.subtle.decrypt({name:'AES-GCM',iv:bin(iv),additionalData:aad},k,bin(ct));return new TextDecoder().decode(p)}async function main(){const t=token();if(!t){$('title').textContent='Invitation introuvable';$('lead').textContent='Le lien est incomplet.';setStatus('INVITE_REQUIRED');return}save(t);const sb=window.supabase?.createClient?.(SB,KEY);if(!sb){setStatus('Configuration indisponible.');return}try{const {data,error}=await sb.rpc('get_conversation_invite_payload',{p_token:t});if(error)throw error;const row=Array.isArray(data)?data[0]:data;if(!row){$('title').textContent='Invitation expirée';$('lead').textContent='Cette invitation n’est plus disponible.';setStatus('INVITE_EXPIRED');return}const text=await decrypt(t,row.initial_ciphertext,row.initial_iv,row.conversation_id);$('title').textContent='Message reçu';$('msg').textContent=text;$('msg').classList.remove('hidden');const s=await sb.auth.getSession();if(s.data?.session?.user){$('accept').classList.remove('hidden');$('accept').onclick=async()=>{setStatus('Connexion à la conversation…');$('accept').disabled=true;try{const r=await sb.rpc('accept_conversation_invite',{p_token:t});if(r.error)throw r.error;clear();$('accept').textContent='✅ Conversation rejointe';setStatus('Conversation rejointe.');setTimeout(()=>location.href='/inbox',450)}catch(e){$('accept').disabled=false;setStatus('❌ '+(e.message||'Impossible de rejoindre la conversation.'))}}}else{$('login').classList.remove('hidden');$('login').href='/auth?next='+encodeURIComponent('/message-invite.html#t='+encodeURIComponent(t));setStatus('Message déchiffré localement. Créez votre compte pour continuer.')}}catch(e){console.error('message invite',e);$('title').textContent='Invitation indisponible';$('lead').textContent='Le lien est invalide, expiré ou déjà consommé.';setStatus('❌ '+(e.message||'INVITE_INVALID'))}}main()})();</script></body></html>
