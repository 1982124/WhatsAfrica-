<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071b16"><meta name="robots" content="noindex,nofollow"><title>WASSAFRICA — Message sécurisé</title><style>:root{--bg:#071b16;--panel:#0e2922;--line:#23473b;--ink:#f5f7f3;--muted:#aebbb4;--green:#42c77a;--gold:#e8b64b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 5%,#2c8b5b33,transparent 32%),linear-gradient(145deg,#071b16,#0a211b 52%,#061510);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{width:min(760px,100%);margin:auto;padding:20px}.brand{font-weight:950;font-size:23px;margin-bottom:18px}.card{background:#0f241f;border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 18px 55px #0005;margin-top:14px}.badge{display:inline-flex;align-items:center;gap:8px;border:1px solid #42c77a55;background:#42c77a12;color:#8ce8b8;padding:7px 10px;border-radius:999px;font-weight:850;font-size:12px}.title{font-size:clamp(30px,7vw,48px);line-height:1;margin:16px 0 12px;letter-spacing:-2px}.muted{color:var(--muted);line-height:1.6}.msg{margin-top:18px;background:#dcf8c6;color:#17211b;border-radius:18px 18px 18px 5px;padding:16px 17px;font-size:18px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;min-height:58px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:900;cursor:pointer;background:var(--green);color:#08160f;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.secondary{background:#162e27;color:var(--ink);border:1px solid var(--line)}.status{min-height:24px;margin-top:12px;color:var(--muted);font-size:13px}.hidden{display:none!important}@media(max-width:520px){.wrap{padding:12px}.card{padding:19px;border-radius:20px}.actions .btn{width:100%}}</style></head><body><main class="wrap"><div class="brand">WASSAFRICA</div><section class="card"><span class="badge">🔒 MESSAGE SÉCURISÉ</span><h1 class="title" id="title">Un message vous attend.</h1><p class="muted" id="lead">Le message est chiffré côté expéditeur. Le lien d’invitation sert de passerelle sécurisée pour remettre la clé de cette conversation.</p><div id="msg" class="msg hidden"></div><div class="actions"><button id="accept" class="btn hidden">✅ Rejoindre la conversation</button><a id="login" class="btn secondary hidden" href="/auth?next=%2Fmessage-invite">Créer mon compte gratuitement</a></div><div id="status" class="status">Vérification de l'invitation…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(async()=>{'use strict';const SB='https://dzifpwqrqnvssfhwjccj.supabase.co',KEY='sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV',AUTH='whatsafrica-auth',DBNAME='wassafrica-msg-v20',STORE='wa-message-invite-token-v1';const $=id=>document.getElementById(id),te=new TextEncoder(),td=new TextDecoder();function tokenFromLink(){const m=location.hash.match(/(?:^#|[&;])t=([^&;]+)/);return m?decodeURIComponent(m[1]):''}function getToken(){const t=tokenFromLink();if(t)return t;try{return localStorage.getItem(STORE)||''}catch{return ''}}function saveToken(t){try{localStorage.setItem(STORE,t)}catch{}}function clearToken(){try{localStorage.removeItem(STORE)}catch{}}function bin(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}function session(){try{const keys=[AUTH,...Array.from({length:localStorage.length},(_,i)=>localStorage.key(i)).filter(k=>k&&k!==AUTH)];for(const k of keys){const x=JSON.parse(localStorage.getItem(k)||'null'),s=x?.access_token?x:x?.session||x?.currentSession||x?.data?.session;if(s?.access_token&&s.user?.id)return s}}catch{}return null}async function api(path,opt={}){const s=session();const h=new Headers(opt.headers||{});h.set('apikey',KEY);if(s?.access_token)h.set('Authorization','Bearer '+s.access_token);if(opt.body&&!h.has('Content-Type'))h.set('Content-Type','application/json');const r=await fetch(SB+path,{...opt,headers:h});let d=null;try{d=await r.json()}catch{}if(!r.ok){const e=new Error(d?.message||d?.hint||d?.details||d?.code||('HTTP_'+r.status));e.code=d?.code;throw e}return d}const rpc=(f,b)=>api('/rest/v1/rpc/'+f,{method:'POST',body:JSON.stringify(b)});const rest=(t,p='',o={})=>api('/rest/v1/'+t+(p?'?'+p:''),o);async function digest(s){return new Uint8Array(await crypto.subtle.digest('SHA-256',te.encode(s)))}async function decryptInvite(token,ciphertext,iv,conversationId){const raw=await digest(token),k=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bin(iv),additionalData:te.encode('wassafrica:invite:'+conversationId)},k,bin(ciphertext));return td.decode(plain)}async function decryptKeyWrap(token,packed,cid){const dot=packed.indexOf('.');if(dot<10)throw Error('INVITE_KEY_WRAP_INVALID');const iv=bin(packed.slice(0,dot)),ct=bin(packed.slice(dot+1)),raw=await digest(token),k=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt']);return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv,additionalData:te.encode('wassafrica:invite-key:'+cid)},k,ct))}function vault(){return new Promise((ok,no)=>{const r=indexedDB.open(DBNAME,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('k'))r.result.createObjectStore('k')};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function getLocal(k){const d=await vault();return new Promise((ok,no)=>{const r=d.transaction('k').objectStore('k').get(k);r.onsuccess=()=>{d.close();ok(r.result||null)};r.onerror=()=>no(r.error)})}async function putLocal(k,v){const d=await vault();return new Promise((ok,no)=>{const tx=d.transaction('k','readwrite');tx.objectStore('k').put(v,k);tx.oncomplete=()=>{d.close();ok()};tx.onerror=()=>no(tx.error)})}async function ensureDevice(){const s=session();if(!s)throw Error('AUTH_REQUIRED');let i=await getLocal('id:'+s.user.id);if(!i){const g=await crypto.subtle.generateKey({name:'RSA-OAEP',modulusLength:2048,publicExponent:new Uint8Array([1,0,1]),hash:'SHA-256'},true,['encrypt','decrypt']);i={publicJwk:await crypto.subtle.exportKey('jwk',g.publicKey),privateJwk:await crypto.subtle.exportKey('jwk',g.privateKey)};await putLocal('id:'+s.user.id,i)}const priv=await crypto.subtle.importKey('jwk',i.privateJwk,{name:'RSA-OAEP',hash:'SHA-256'},true,['decrypt']);const r=await rpc('ensure_web_device',{p_identity_public_key:i.publicJwk}),d=Array.isArray(r)?r[0]:r;if(!d?.id)throw Error('DEVICE_NOT_AVAILABLE');return{id:d.id,publicJwk:d.identity_public_key||i.publicJwk,privateKey:priv}}async function rsaWrap(publicJwk,keyBytes){const p=await crypto.subtle.importKey('jwk',publicJwk,{name:'RSA-OAEP',hash:'SHA-256'},true,['encrypt']);return btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.encrypt({name:'RSA-OAEP'},p,keyBytes))))}async function accept(row,token){const d=await ensureDevice(),conversationKey=await decryptKeyWrap(token,row.initial_key_wrap,row.conversation_id),cid=await rpc('accept_conversation_invite',{p_token:token});if(!cid)throw Error('INVITE_ACCEPT_FAILED');const messages=await rest('messages_v2','select=encryption_metadata&id=eq.'+encodeURIComponent(row.initial_message_id)+'&conversation_id=eq.'+encodeURIComponent(row.conversation_id)+'&limit=1'),v=Number(messages?.[0]?.encryption_metadata?.key_version);if(!Number.isInteger(v)||v<1)throw Error('INVITE_KEY_VERSION_MISSING');try{await rest('conversation_key_envelopes','',{method:'POST',body:JSON.stringify({conversation_id:row.conversation_id,device_id:d.id,key_version:v,algorithm:'RSA-OAEP-2048-SHA256+AES-256-GCM',wrapped_key:await rsaWrap(d.publicJwk,conversationKey)})})}catch(e){if(!String(e.message||'').toLowerCase().includes('duplicate'))throw e}return true}async function main(){const t=getToken();if(!t){$('title').textContent='Invitation introuvable';$('lead').textContent='Le lien est incomplet.';$('login').classList.add('hidden');return setStatus('INVITE_REQUIRED')}saveToken(t);const sb=window.supabase?.createClient?.(SB,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.localStorage,storageKey:AUTH}});if(!sb){setStatus('Configuration indisponible.');return}try{const {data,error}=await sb.rpc('get_conversation_invite_payload',{p_token:t});if(error)throw error;const row=Array.isArray(data)?data[0]:data;if(!row){$('title').textContent='Invitation expirée';$('lead').textContent='Cette invitation n’est plus disponible.';setStatus('INVITE_EXPIRED');return}const text=await decryptInvite(t,row.initial_ciphertext,row.initial_iv,row.conversation_id);$('title').textContent='Message reçu';$('msg').textContent=text;$('msg').classList.remove('hidden');const s=await sb.auth.getSession();if(s.data?.session?.user){$('accept').classList.remove('hidden');$('accept').onclick=async()=>{setStatus('🔐 Sécurisation de votre appareil…');$('accept').disabled=true;try{await accept(row,t);clearToken();$('accept').textContent='✅ Conversation rejointe';setStatus('Conversation sécurisée. Ouverture de vos messages…');setTimeout(()=>location.href='/inbox',650)}catch(e){$('accept').disabled=false;setStatus('❌ '+(e.message||'Impossible de rejoindre la conversation.'))}}}else{$('login').classList.remove('hidden');$('login').href='/auth?next='+encodeURIComponent('/message-invite#t='+encodeURIComponent(t));setStatus('Message reçu. Créez votre compte gratuitement pour rejoindre la conversation.')}}catch(e){console.error('WASSAFRICA message invite',e);$('title').textContent='Invitation indisponible';$('lead').textContent='Le lien est invalide, expiré ou ne permet plus de récupérer le message.';setStatus('❌ '+(e.message||'INVITE_INVALID'))}}function setStatus(t){$('status').textContent=t}main()})();</script></body></html>
