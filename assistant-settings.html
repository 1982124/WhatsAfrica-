<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WhatsAfrica — Nom de votre assistant</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#090d17;--card:#111827;--line:#26334c;--muted:#98a5bb;--gold:#f2b84b;--teal:#22c7a3;--text:#f8f5eb}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#25334a,#090d17 50%);color:var(--text);font:15px system-ui}.wrap{max-width:720px;margin:auto;padding:24px}.card{margin-top:70px;background:linear-gradient(145deg,var(--card),#18243b);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 25px 70px #0006}.brand{font-size:24px;font-weight:900}.brand b{color:var(--gold)}.ey{color:var(--teal);font:800 11px monospace;letter-spacing:2px;text-transform:uppercase;margin-top:35px}h1{font:600 42px Georgia;margin:10px 0 14px}p{color:var(--muted);line-height:1.6}input{width:100%;padding:14px;background:#090d17;color:#fff;border:1px solid var(--line);border-radius:12px;font-size:17px;margin:12px 0}.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:850;cursor:pointer;background:var(--gold);color:#171208}.ghost{background:transparent;color:#fff;border:1px solid var(--line)}.row{display:flex;gap:10px;flex-wrap:wrap}.preview{margin-top:20px;padding:15px;border:1px solid var(--line);border-radius:14px;background:#ffffff06}.ok{color:var(--teal)}.err{color:#ff8f8f}@media(max-width:600px){h1{font-size:34px}.card{margin-top:30px;padding:20px}}</style></head><body><main class="wrap"><div class="brand">Whats<b>Africa</b></div><section class="card"><div class="ey">Personnalisation</div><h1>Donnez un nom à votre assistant commercial.</h1><p>Votre assistant peut avoir sa propre identité. Par exemple : <strong>Françoise</strong>.</p><input id="name" maxlength="60" placeholder="Ex. Françoise" autocomplete="off"><div class="preview">Dans une conversation, il dira :<br><strong id="sample">« Je suis Françoise, votre assistante commerciale. »</strong></div><div class="row" style="margin-top:18px"><button class="btn" id="save">Enregistrer</button><a class="btn ghost" href="/dashboard">Retour au cockpit</a></div><p id="msg"></p></section></main><script>const URL='https://dzifpwqrqnvssfhwjccj.supabase.co',KEY='sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV',db=supabase.createClient(URL,KEY),$=x=>document.getElementById(x);let user=null;function update(){const n=($('name').value.trim()||'Françoise').slice(0,60);$('sample').textContent='« Je suis '+n+', votre assistante commerciale. »'}$('name').oninput=update;async function boot(){const r=await db.auth.getUser();if(r.error||!r.data?.user){location.href='/dashboard';return}user=r.data.user;const p=await db.from('profiles').select('assistant_name').eq('user_id',user.id).maybeSingle();$('name').value=p.data?.assistant_name||'Votre assistant';update()}$('save').onclick=async()=>{const name=($('name').value.trim()||'Votre assistant').slice(0,60);const r=await db.from('profiles').update({assistant_name:name}).eq('user_id',user.id);$('msg').textContent=r.error?r.error.message:'Nom enregistré : '+name;$('msg').className=r.error?'err':'ok';update()};boot();</script></body></html>
