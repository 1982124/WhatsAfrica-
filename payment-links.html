<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WhatsAfrica — Liens de paiement</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#090d17;color:#fff;font:15px system-ui}.wrap{max-width:860px;margin:auto;padding:24px}.card{background:#111827;border:1px solid #26334c;border-radius:18px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select{width:100%;box-sizing:border-box;padding:12px;background:#0b1220;color:#fff;border:1px solid #26334c;border-radius:10px}.btn{padding:12px 15px;border:0;border-radius:10px;font-weight:800;background:#e8a83c;cursor:pointer}.ghost{background:transparent;color:#fff;border:1px solid #26334c}.muted{color:#98a5bb}.ok{color:#57d39b}.err{color:#ff8f8f}.item{padding:14px 0;border-top:1px solid #26334c}.item a{color:#e8a83c;word-break:break-all}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>💳 Liens de paiement externes</h1><p class="muted">Connectez un lien de paiement existant à votre activité WhatsAfrica. Maketou et Chariow sont pris en charge, ainsi que tout autre prestataire HTTPS.</p><div class="card"><h2>Ajouter un lien</h2><div class="grid"><select id="provider"><option value="maketou">Maketou</option><option value="chariow">Chariow</option><option value="other">Autre</option></select><input id="label" value="Payer maintenant" maxlength="80" placeholder="Libellé du bouton"></div><input id="url" type="url" placeholder="https://…" autocomplete="url"><input id="product" placeholder="ID produit WhatsAfrica (facultatif)"><input id="smart" placeholder="ID Smart Link (facultatif)"><button class="btn" id="save">Enregistrer le lien</button><p id="msg" class="muted"></p></div><div class="card"><h2>Mes liens</h2><div id="list" class="muted">Chargement…</div></div></div><script>const db=supabase.createClient('https://dzifpwqrqnvssfhwjccj.supabase.co','sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV'),$=x=>document.getElementById(x);let user=null;async function boot(){const r=await db.auth.getUser();if(r.error||!r.data.user){location.href='/dashboard';return}user=r.data.user;await load()}async function load(){const r=await db.from('external_payment_links').select('*').eq('owner_id',user.id).order('created_at',{ascending:false});if(r.error){$('list').textContent=r.error.message;return}if(!r.data.length){$('list').textContent='Aucun lien de paiement.';return}$('list').innerHTML=r.data.map(x=>`<div class="item"><b>${escapeHtml(x.label)}</b> · ${escapeHtml(x.provider)}<br><a href="${escapeAttr(x.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(x.url)}</a></div>`).join('')}function escapeHtml(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}function escapeAttr(s){return String(s??'').replace(/[^a-zA-Z0-9_:\/.?&=%+#-]/g,'')}$('save').onclick=async()=>{try{const url=$('url').value.trim();if(!/^https:\/\//i.test(url))throw Error('Le lien doit commencer par https://');const product=$('product').value.trim()||null,smart=$('smart').value.trim()||null;if(!product&&!smart)throw Error('Indiquez au moins un ID produit ou Smart Link.');const r=await db.from('external_payment_links').insert({owner_id:user.id,provider:$('provider').value,label:$('label').value.trim()||'Payer maintenant',url,product_id:product,smart_link_id:smart,is_active:true});if(r.error)throw r.error;$('msg').innerHTML='<span class="ok">Lien de paiement enregistré.</span>';$('url').value='';await load()}catch(e){$('msg').innerHTML='<span class="err">'+escapeHtml(e.message)+'</span>'}};boot();</script></body></html>
