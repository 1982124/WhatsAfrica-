<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>WASSAFRICA — Rapports Intelligence</title><style>body{font:15px system-ui;margin:0;background:#fdfbf7;color:#1e1e1e}.wrap{max-width:1180px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #ddd9cf;border-radius:16px;padding:16px;margin:12px 0}.btn{font:inherit;padding:10px 14px;border-radius:10px;border:1px solid #1b4332;background:#1b4332;color:#fff;font-weight:800;cursor:pointer}.ghost{background:#fff;color:#1b4332;border-color:#ddd9cf}.muted{color:#68746d}.ok{color:#16734b}.err{color:#a33a3a}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.stat{border:1px solid #ddd9cf;border-radius:12px;padding:12px}.stat b{display:block;font-size:23px;margin-top:3px}.report{border:1px solid #ddd9cf;border-radius:14px;padding:14px;margin:10px 0}.report h3{margin:0 0 5px}.pill{display:inline-block;border-radius:999px;padding:4px 8px;background:#edf4ef;margin-right:5px}.detail{white-space:pre-wrap;line-height:1.5;background:#faf9f5;border-radius:10px;padding:10px;margin-top:10px}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}}</style><script src="/admin-sso.js"></script></head><body><div class="wrap"><p><a href="/admin-cockpit-v3.html">← Admin Cockpit</a> · <a href="/admin-global-command.html">🌍 Command Center</a></p><h1>📊 Rapports Intelligence des besoins</h1><p class="muted">Les rapports générés par l'analyse et l'automatisation sont conservés ici en plus de leur diffusion email.</p><section id="auth" class="card" style="display:none"></section><main id="app" style="display:none"><section class="card"><div class="grid"><div class="stat">Rapports<b id="count">—</b></div><div class="stat">Demandes<b id="demands">—</b></div><div class="stat">Groupements<b id="clusters">—</b></div><div class="stat">Contactables<b id="contactable">—</b></div><div class="stat">Gaps récurrents<b id="recurring">—</b></div><div class="stat">Couverture<b id="coverage">—</b></div></div><p style="margin-bottom:0"><button id="refresh" class="btn ghost">↻ Actualiser les rapports</button></p></section><section class="card"><h2>Historique exploitable</h2><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px"><input id="q" placeholder="Produit, pays, zone…" style="padding:10px;border:1px solid #ddd9cf;border-radius:10px"><select id="status" style="padding:10px;border:1px solid #ddd9cf;border-radius:10px"><option value="">Tous les statuts</option><option value="generated">Générés</option><option value="failed">Échecs</option></select><select id="confidence" style="padding:10px;border:1px solid #ddd9cf;border-radius:10px"><option value="">Toutes les confiances</option><option value="high">Haute</option><option value="medium">Moyenne</option><option value="low">Faible</option></select><select id="evolution"><option value="">Toutes les évolutions</option><option value="new">Nouveau</option><option value="progressing">En progression</option><option value="stable">Stable</option><option value="recurring">Récurrent</option><option value="declining">En baisse</option><option value="disappeared">Disparu</option></select><select id="matching"><option value="">Toutes les correspondances</option><option value="matched">Offre trouvée</option><option value="unmatched">Aucune offre</option></select><select id="days" style="padding:10px;border:1px solid #ddd9cf;border-radius:10px"><option value="0">Toute l’histoire</option><option value="1">24 h</option><option value="7">7 jours</option><option value="30">30 jours</option></select></div><div id="trend" class="muted" style="margin-bottom:10px"></div><div id="list" class="muted">Chargement…</div></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const U='https://dzifpwqrqnvssfhwjccj.supabase.co',K='sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV',db=supabase.createClient(U,K),$=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function session(){const x=await window.WA_ADMIN_SSO.requireAdmin();return x.session}async function boot(){const x=await window.WA_ADMIN_SSO.requireAdmin();$('auth').style.display='none';$('app').style.display='block';await load()}function jsonSummary(v){if(!v)return '';try{const x=typeof v==='string'?JSON.parse(v):v;return JSON.stringify(x,null,2)}catch{return String(v)}}let REPORTS=[];function reportText(x){return jsonSummary(x.report||x.top_demands||{})}
function allSignalValues(x,key){const t=reportText(x),out=new Set(),re=new RegExp('"'+key+'"\\s*:\\s*"([^"]+)"','gi');let m;while((m=re.exec(t)))out.add(String(m[1]).toLowerCase());return [...out]}
function signalStates(x){return allSignalValues(x,'signal_state')}
function matchStates(x){return allSignalValues(x,'market_match_status')}
function confidenceStates(x){return allSignalValues(x,'confidence')}
function evolutionOf(x){return signalStates(x)[0]||''}
function evolutionLabel(v){return ({new:'Nouveau',progressing:'En progression',stable:'Stable',recurring:'Récurrent',declining:'En baisse',disappeared:'Disparu'})[v]||''}
function evolutionLabels(x){return signalStates(x).map(evolutionLabel).filter(Boolean)}
function matchingOf(x){return matchStates(x)[0]||''}
function matchingLabels(x){return matchStates(x).map(v=>v==='matched'?'Offre trouvée':v==='unmatched'?'Aucune offre':v).filter(Boolean)}
function confidenceOf(x){return confidenceStates(x)[0]||''}
function confidenceLabels(x){return confidenceStates(x).map(v=>v==='high'?'Haute':v==='medium'?'Moyenne':v==='low'?'Faible':v).filter(Boolean)}function filtered(){const q=$('q').value.trim().toLowerCase(),s=$('status').value,c=$('confidence').value,e=$('evolution').value,m=$('matching').value,d=Number($('days').value||0),cut=d?Date.now()-d*86400000:0;return REPORTS.filter(x=>{const text=reportText(x).toLowerCase(),okQ=!q||text.includes(q),okS=!s||String(x.generation_status||'generated')===s,okC=!c||confidenceStates(x).includes(c),okE=!e||signalStates(x).includes(e),okM=!m||matchStates(x).includes(m),okD=!cut||new Date(x.generated_at).getTime()>=cut;return okQ&&okS&&okC&&okE&&okM&&okD})}function render(){const rows=filtered();const selectedDemand=rows.reduce((n,x)=>n+Number(x.demand_count||0),0);const selectedCoverage=rows.map(x=>{try{const r=typeof x.report==='string'?JSON.parse(x.report):x.report||{};return Number(r.matching?.coverage_rate)}catch{return NaN}}).filter(Number.isFinite);const avgCoverage=selectedCoverage.length?(selectedCoverage.reduce((a,b)=>a+b,0)/selectedCoverage.length):0;$('trend').textContent=rows.length+' rapport(s) affiché(s) · '+selectedDemand.toLocaleString('fr-FR')+' demandes cumulées · couverture Marketplace moyenne '+avgCoverage.toFixed(1)+' %';$('list').innerHTML=rows.map((x,i)=>{const status=x.generation_status||'generated',conf=confidenceOf(x),evo=evolutionOf(x),mat=matchingOf(x);const confs=confidenceLabels(x),evos=evolutionLabels(x),mats=matchingLabels(x);const mt=(()=>{try{const r=typeof x.report==='string'?JSON.parse(x.report):x.report||{};return r.matching||null}catch{return null}})();return '<article class="report"><h3>Rapport #'+(i+1)+' · '+new Date(x.generated_at).toLocaleString('fr-FR')+'</h3><span class="pill">'+esc(status)+'</span><span class="pill">'+Number(x.demand_count||0)+' demandes</span><span class="pill">'+Number(x.grouped_product_count||0)+' regroupements</span><span class="pill">'+Number(x.contactable_count||0)+' contactables</span>'+(confs.length?'<span class="pill">Confiances : '+esc(confs.join(' · '))+'</span>':'')+(evos.length?'<span class="pill">Évolutions : '+esc(evos.join(' · '))+'</span>':'')+(mats.length?'<span class="pill">Correspondances : '+esc(mats.join(' · '))+'</span>':'')+(mt?'<p class="muted">Couverture Marketplace : '+Number(mt.coverage_rate||0)+' % · '+Number(mt.matched_signal_count||0)+' signal(s) avec offre · '+Number(mt.unmatched_signal_count||0)+' sans offre · '+Number(mt.gaps?.length||0)+' gap(s).</p>'+(Array.isArray(mt.gaps)&&mt.gaps.length?'<div class="gapbox"><strong>Besoins non couverts :</strong> '+mt.gaps.slice(0,5).map(g=>esc((g.product||'Besoin')+' · '+(g.zone||'zone inconnue')+' · '+(g.country||'pays inconnu')+' · '+Number(g.count||0)+' signal(s) · '+(g.gap_state==='recurring'?'récurrent':g.gap_state==='progressing'?'en progression':g.gap_state==='declining'?'en baisse':'nouveau')+' · priorité '+Number(g.priority_score||0))).join(' · ')+'</div>':''):'')+'<p class="muted">Période : '+new Date(x.period_start).toLocaleString('fr-FR')+' → '+new Date(x.period_end).toLocaleString('fr-FR')+'</p>'+(x.error_message?'<p class="err">'+esc(x.error_message)+'</p>':'')+'<details><summary>Voir le rapport complet</summary><div class="detail">'+esc(reportText(x))+'</div></details></article>'}).join('')||'<p class="muted">Aucun rapport ne correspond aux filtres.</p>'}async function load(){const r=await db.rpc('admin_list_demand_reports',{p_limit:100});if(r.error){$('list').textContent='Impossible de charger les rapports : '+r.error.message;return}REPORTS=r.data||[];$('count').textContent=REPORTS.length.toLocaleString('fr-FR');$('demands').textContent=REPORTS.reduce((n,x)=>n+Number(x.demand_count||0),0).toLocaleString('fr-FR');$('clusters').textContent=REPORTS.reduce((n,x)=>n+Number(x.grouped_product_count||0),0).toLocaleString('fr-FR');$('contactable').textContent=REPORTS.reduce((n,x)=>n+Number(x.contactable_count||0),0).toLocaleString('fr-FR');const recurring=REPORTS.reduce((n,x)=>n+(reportText(x).match(/"signal_state"\s*:\s*"recurring"/gi)||[]).length,0);$('recurring').textContent=recurring.toLocaleString('fr-FR');const coverage=REPORTS.map(x=>{try{const r=typeof x.report==='string'?JSON.parse(x.report):x.report||{};return Number(r.matching?.coverage_rate)}catch{return NaN}}).filter(Number.isFinite);$('coverage').textContent=(coverage.length?(coverage.reduce((a,b)=>a+b,0)/coverage.length).toFixed(1):'0')+' %';render()}$('q').oninput=render;$('status').onchange=render;$('confidence').onchange=render;$('evolution').onchange=render;$('matching').onchange=render;$('days').onchange=render;$('refresh').onclick=load;boot().catch(()=>{});</script></body></html>
