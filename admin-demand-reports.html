bottom:0"><button id="refresh" class="btn ghost">↻ Actualiser les rapports</button></p></section><section class="card"><h2>Historique exploitable</h2><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px"><input id="q" placeholder="Produit, pays, zone…" style="padding:10px;border:1px solid #ddd9cf;border-radius:10px"><select id="status" style="padding:10px;border:1px solid #ddd9cf;border-radius:10px"><option value="">Tous les statuts</option><option value="generated">Générés</option><option value="failed">Échecs</option></select><select id="confidence" style="padding:10px;border:1px solid #ddd9cf;border-radius:10px"><option value="">Toutes les confiances</option><option value="high">Haute</option><option value="medium">Moyenne</option><option value="low">Faible</option></select><select id="evolution"><option value="">Toutes les évolutions</option><option value="new">Nouveau</option><option value="progressing">En progression</option><option value="stable">Stable</option><option value="declining">En baisse</option><option value="disappeared">Disparu</option></select><select id="matching"><option value="">Toutes les correspondances</option><option value="matched">Offre trouvée</option><option value="unmatched">Aucune offre</option></select><select id="days" style="padding:10px;border:1px solid #ddd9cf;border-radius:10px"><option value="0">Toute l’histoire</option><option value="1">24 h</option><option value="7">7 jours</option><option value="30">30 jours</option></select></div><div id="trend" class="muted" style="margin-bottom:10px"></div><div id="list" class="muted">Chargement…</div></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const U='https://dzifpwqrqnvssfhwjccj.supabase.co',K='sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV',db=supabase.createClient(U,K),$=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function session(){const x=await window.WA_ADMIN_SSO.requireAdmin();return x.session}async function boot(){const x=await window.WA_ADMIN_SSO.requireAdmin();$('auth').style.display='none';$('app').style.display='block';await load()}function jsonSummary(v){if(!v)return '';try{const x=typeof v==='string'?JSON.parse(v):v;return JSON.stringify(x,null,2)}catch{return String(v)}}let REPORTS=[];function reportText(x){return jsonSummary(x.report||x.top_demands||{})}function evolutionOf(x){const t=reportText(x);if(/"signal_state"\s*:\s*"disappeared"/i.test(t))return 'disappeared';if(/"signal_state"\s*:\s*"progressing"/i.test(t))return 'progressing';if(/"signal_state"\s*:\s*"declining"/i.test(t))return 'declining';if(/"signal_state"\s*:\s*"new"/i.test(t))return 'new';if(/"signal_state"\s*:\s*"stable"/i.test(t))return 'stable';return ''}function evolutionLabel(v){return ({new:'Nouveau',progressing:'En progression',stable:'Stable',declining:'En baisse',disappeared:'Disparu'})[v]||''}function matchingOf(x){const t=reportText(x);if(/"market_match_status"\s*:\s*"matched"/i.test(t))return 'matched';if(/"market_match_status"\s*:\s*"unmatched"/i.test(t))return 'unmatched';return ''}function confidenceOf(x){const t=reportText(x);if(/"confidence"\\s*:\\s*"high"/i.test(t))return 'high';if(/"confidence"\\s*:\\s*"medium"/i.test(t))return 'medium';if(/"confidence"\\s*:\\s*"low"/i.test(t))return 'low';return ''}function filtered(){const q=$('q').value.trim().toLowerCase(),s=$('status').value,c=$('confidence').value,e=$('evolution').value,m=$('matching').value,d=Number($('days').value||0),cut=d?Date.now()-d*86400000:0;return REPORTS.filter(x=>{const text=reportText(x).toLowerCase(),okQ=!q||text.includes(q),okS=!s||String(x.generation_status||'generated')===s,okC=!c||confidenceOf(x)===c,okE=!e||evolutionOf(x)===e,okM=!m||matchingOf(x)===m,okD=!cut||new Date(x.generated_at).getTime()>=cut;return okQ&&okS&&okC&&okE&&okM&&okD})}function render(){const rows=filtered();$('trend').textContent=rows.length+' rapport(s) affiché(s) · '+rows.reduce((n,x)=>n+Number(x.demand_count||0),0).toLocaleString('fr-FR')+' demandes cumulées sur la sélection';$('list').innerHTML=rows.map((x,i)=>{const status=x.generation_status||'generated',conf=confidenceOf(x),evo=evolutionOf(x),mat=matchingOf(x);const mt=(()=>{try{const r=typeof x.report==='string'?JSON.parse(x.report):x.report||{};return r.matching||null}catch{return null}})();return '<article class="report"><h3>Rapport #'+(i+1)+' · '+new Date(x.generated_at).toLocaleString('fr-FR')+'</h3><span class="pill">'+esc(status)+'</span><span class="pill">'+Number(x.demand_count||0)+' demandes</span><span class="pill">'+Number(x.grouped_product_count||0)+' regroupements</span><span class="pill">'+Number(x.contactable_count||0)+' contactables</span>'+(conf?'<span class="pill">Confiance '+esc(conf)+'</span>':'')+(evo?'<span class="pill">Évolution '+esc(evolutionLabel(evo))+'</span>':'')+(mat?'<span class="pill">'+(mat==='matched'?'✓ Offre trouvée':'⚠ Aucune offre')+'</span>':'')+(mt?'<p class="muted">Couverture Marketplace : '+Number(mt.coverage_rate||0)+' % · '+Number(mt.matched_signal_count||0)+' signal(s) avec offre · '+Number(mt.unmatched_signal_count||0)+' sans offre.</p>':'')+'<p class="muted">Période : '+new Date(x.period_start).toLocaleString('fr-FR')+' → '+new Date(x.period_end).toLocaleString('fr-FR')+'</p>'+(x.error_message?'<p class="err">'+esc(x.error_message)+'</p>':'')+'<details><summary>Voir le rapport complet</summary><div class="detail">'+esc(reportText(x))+'</div></details></article>'}).join('')||'<p class="muted">Aucun rapport ne correspond aux filtres.</p>')}async function load(){const r=await db.rpc('admin_list_demand_reports',{p_limit:100});if(r.error){$('list').textContent='Impossible de charger les rapports : '+r.error.message;return}REPORTS=r.data||[];$('count').textContent=REPORTS.length.toLocaleString('fr-FR');$('demands').textContent=REPORTS.reduce((n,x)=>n+Number(x.demand_count||0),0).toLocaleString('fr-FR');$('clusters').textContent=REPORTS.reduce((n,x)=>n+Number(x.grouped_product_count||0),0).toLocaleString('fr-FR');$('contactable').textContent=REPORTS.reduce((n,x)=>n+Number(x.contactable_count||0),0).toLocaleString('fr-FR');render()}$('q').oninput=render;$('status').onchange=render;$('confidence').onchange=render;$('evolution').onchange=render;$('matching').onchange=render;$('days').onchange=render;$('refresh').onclick=load;boot().catch(()=>{});</script></body></html>
