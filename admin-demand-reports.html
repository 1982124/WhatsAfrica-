<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>WASSAFRICA — Rapports Intelligence</title><style>body{font:15px system-ui;margin:0;background:#fdfbf7;color:#1e1e1e}.wrap{max-width:1180px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #ddd9cf;border-radius:16px;padding:16px;margin:12px 0}.btn{font:inherit;padding:10px 14px;border-radius:10px;border:1px solid #1b4332;background:#1b4332;color:#fff;font-weight:800;cursor:pointer}.ghost{background:#fff;color:#1b4332;border-color:#ddd9cf}.muted{color:#68746d}.ok{color:#16734b}.err{color:#a33a3a}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{border:1px solid #ddd9cf;border-radius:12px;padding:12px}.stat b{display:block;font-size:23px;margin-top:3px}.report{border:1px solid #ddd9cf;border-radius:14px;padding:14px;margin:10px 0}.report h3{margin:0 0 5px}.pill{display:inline-block;border-radius:999px;padding:4px 8px;background:#edf4ef;margin-right:5px}.detail{white-space:pre-wrap;line-height:1.5;background:#faf9f5;border-radius:10px;padding:10px;margin-top:10px}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><p><a href="/admin-cockpit-v3.html">← Admin Cockpit</a> · <a href="/admin-global-command.html">🌍 Command Center</a></p><h1>📊 Rapports Intelligence des besoins</h1><p class="muted">Les rapports générés par l'analyse et l'automatisation sont conservés ici en plus de leur diffusion email.</p><section id="auth" class="card"><b>Vérification administrateur</b><p id="authmsg" class="muted">Connexion…</p><button id="otp" class="btn">Envoyer le code MFA</button><div id="verify" style="display:none;margin-top:10px"><input id="code" inputmode="numeric" maxlength="6" placeholder="Code à 6 chiffres" style="padding:10px;border:1px solid #ccc;border-radius:10px"><button id="check" class="btn">Vérifier</button></div></section><main id="app" style="display:none"><section class="card"><div class="grid"><div class="stat">Rapports<b id="count">—</b></div><div class="stat">Demandes<b id="demands">—</b></div><div class="stat">Groupements<b id="clusters">—</b></div><div class="stat">Contactables<b id="contactable">—</b></div></div><p style="margin-bottom:0"><button id="refresh" class="btn ghost">↻ Actualiser les rapports</button></p></section><section class="card"><h2>Historique</h2><div id="list" class="muted">Chargement…</div></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const U='https://dzifpwqrqnvssfhwjccj.supabase.co',K='sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV',db=supabase.createClient(U,K),$=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function session(){return (await db.auth.getSession()).data.session}async function boot(){const s=await session();if(!s){$('authmsg').textContent='Session administrateur requise.';return}const a=await db.rpc('is_platform_admin');if(a.error||a.data!==true){$('authmsg').textContent='Compte non administrateur.';return}$('authmsg').textContent='Session administrateur détectée. MFA requis.'}$('otp').onclick=async()=>{try{const s=await session();const r=await fetch('/api/admin-overview',{method:'POST',headers:{Authorization:'Bearer '+s.access_token,'Content-Type':'application/json'},body:JSON.stringify({action:'send_admin_otp'}),cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'OTP_SEND_FAILED');$('verify').style.display='block';$('authmsg').className='ok';$('authmsg').textContent='Code envoyé. Il expire dans 10 minutes.'}catch(e){$('authmsg').className='err';$('authmsg').textContent='Envoi impossible : '+e.message}};$('check').onclick=async()=>{try{const r=await db.rpc('verify_admin_email_otp',{p_code:$('code').value.trim()});if(r.error)throw r.error;$('auth').style.display='none';$('app').style.display='block';await load()}catch(e){$('authmsg').className='err';$('authmsg').textContent='Code invalide ou expiré.'}};function jsonSummary(v){if(!v)return '';try{const x=typeof v==='string'?JSON.parse(v):v;return JSON.stringify(x,null,2)}catch{return String(v)}}async function load(){const r=await db.rpc('admin_list_demand_reports',{p_limit:50});if(r.error){$('list').textContent='Impossible de charger les rapports : '+r.error.message;return}const rows=r.data||[];$('count').textContent=rows.length.toLocaleString('fr-FR');$('demands').textContent=rows.reduce((n,x)=>n+Number(x.demand_count||0),0).toLocaleString('fr-FR');$('clusters').textContent=rows.reduce((n,x)=>n+Number(x.grouped_product_count||0),0).toLocaleString('fr-FR');$('contactable').textContent=rows.reduce((n,x)=>n+Number(x.contactable_count||0),0).toLocaleString('fr-FR');$('list').innerHTML=rows.map((x,i)=>{const status=x.generation_status||'generated';return '<article class="report"><h3>Rapport #'+(i+1)+' · '+new Date(x.generated_at).toLocaleString('fr-FR')+'</h3><span class="pill">'+esc(status)+'</span><span class="pill">'+Number(x.demand_count||0)+' demandes</span><span class="pill">'+Number(x.grouped_product_count||0)+' regroupements</span><span class="pill">'+Number(x.contactable_count||0)+' contactables</span><p class="muted">Période : '+new Date(x.period_start).toLocaleString('fr-FR')+' → '+new Date(x.period_end).toLocaleString('fr-FR')+'</p>'+(x.error_message?'<p class="err">'+esc(x.error_message)+'</p>':'')+'<details><summary>Voir le rapport complet</summary><div class="detail">'+esc(jsonSummary(x.report||x.top_demands||{}))+'</div></details></article>'}).join('')||'<p class="muted">Aucun rapport enregistré pour le moment.</p>'}$('refresh').onclick=load;boot();</script></body></html>
