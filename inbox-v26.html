ice,current,keyBytes,version=0,realtime=null,recording=null;const sb=supabase.createClient(SB,KEY);const status=(t,c='')=>{$('status').textContent=t;$('status').className='muted '+c};const b64=x=>{let s='';new Uint8Array(x).forEach(b=>s+=String.fromCharCode(b));return btoa(s)};const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));function readSession(){try{return JSON.parse(localStorage.getItem(AUTH)||'null')}catch{return null}}async function api(path,opt={}){const h=new Headers(opt.headers||{});h.set('apikey',KEY);if(session?.access_token)h.set('Authorization','Bearer '+session.access_token);if(!(opt.body instanceof Blob))h.set('Content-Type','application/json');const r=await fetch(SB+path,{...opt,headers:h});let d=null;try{d=await r.json()}catch{}if(!r.ok){const e=new Error(d?.message||d?.error_description||d?.hint||JSON.stringify(d)||('HTTP_'+r.status));e.code=d?.code;e.status=r.status;throw e}return d}async function rest(t,p='',o={}){return api('/rest/v1/'+t+(p?'?'+p:''),o)}async function rpc(fn,b){return api('/rest/v1/rpc/'+fn,{method:'POST',body:JSON.stringify(b)})}async function refresh(){if(!session?.refresh_token)return false;try{const d=await api('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:session.refresh_token})});session=d;localStorage.setItem(AUTH,JSON.stringify(d));return true}catch{return false}}async function auth(){session=readSession();if(!session)throw Error('AUTH_REQUIRED');if(session.expires_at&&Date.now()/1000>Number(session.expires_at)-30&&!await refresh())throw Error('AUTH_EXPIRED');user=session.user;if(!user?.id)throw Error('AUTH_REQUIRED');await sb.auth.setSession({access_token:session.access_token,refresh_token:session.refresh_token})}function openVault(){return new Promise((ok,no)=>{const r=indexedDB.open('wassafrica-msg-v13',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('k'))r.result.createObjectStore('k')};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function vget(k){const d=await openVault();return new Promise((ok,no)=>{const r=d.transaction('k').objectStore('k').get(k);r.onsuccess=()=>{d.close();ok(r.result||null)};r.onerror=()=>no(r.error)})}async function vput(k,v){const d=await openVault();return new Promise((ok,no)=>{const t=d.transaction('k','readwrite');t.objectStore('k').put(v,k);t.oncomplete=()=>{d.close();ok()};t.onerror=()=>no(t.error)})}async function ensureDevice(){if(device)return device;let x=await vget('id:'+user.id),pk;if(x)pk=await crypto.subtle.importKey('jwk',x.privateJwk,{name:'RSA-OAEP',hash:'SHA-256'},true,['decrypt']);else{const g=await crypto.subtle.generateKey({name:'RSA-OAEP',modulusLength:2048,publicExponent:new Uint8Array([1,0,1]),hash:'SHA-256'},true,['encrypt','decrypt']);x={publicJwk:await crypto.subtle.exportKey('jwk',g.publicKey),privateJwk:await crypto.subtle.exportKey('jwk',g.privateKey)};pk=g.privateKey;await vput('id:'+user.id,x)}const q=await rest('user_devices','select=id,identity_public_key&user_id=eq.'+encodeURIComponent(user.id)+'&device_label=eq.Web&revoked_at=is.null&order=last_seen_at.desc&limit=20');let d=(q||[]).find(z=>JSON.stringify(z.identity_public_key)===JSON.stringify(x.publicJwk));if(!d){const r=await rest('user_devices','select=id,identity_public_key',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({user_id:user.id,device_label:'Web',identity_public_key:x.publicJwk,last_seen_at:new Date().toISOString()})});d=r?.[0]}else await rest('user_devices','id=eq.'+d.id,{method:'PATCH',body:JSON.stringify({last_seen_at:new Date().toISOString()})});if(!d?.id)throw Error('DEVICE_NOT_AVAILABLE');device={id:d.id,identity_public_key:x.publicJwk,privateKey:pk}}async function wrap(j,k){const p=await crypto.subtle.importKey('jwk',j,{name:'RSA-OAEP',hash:'SHA-256'},true,['encrypt']);return b64(await crypto.subtle.encrypt({name:'RSA-OAEP'},p,k))}async function unwrap(s){return new Uint8Array(await crypto.subtle.decrypt({name:'RSA-OAEP'},device.privateKey,ub64(s)))}async function readKey(c,v=0){let p='select=wrapped_key,key_version&conversation_id=eq.'+encodeURIComponent(c)+'&device_id=eq.'+encodeURIComponent(device.id)+'&revoked_at=is.null&order=key_version.desc&limit=1';if(v)p='select=wrapped_key,key_version&conversation_id=eq.'+encodeURIComponent(c)+'&device_id=eq.'+encodeURIComponent(device.id)+'&revoked_at=is.null&key_version=eq.'+v;const r=(await rest('conversation_key_envelopes',p))?.[0];if(!r)return null;keyBytes=await unwrap(r.wrapped_key);version=Number(r.key_version);return keyBytes}async function addEnv(c,d,k,v){try{await rest('conversation_key_envelopes','',{method:'POST',body:JSON.stringify({conversation_id:c,device_id:d.id,key_version:v,algorithm:'RSA-OAEP-2048-SHA256+AES-256-GCM',wrapped_key:await wrap(d.identity_public_key,k)})})}catch(e){if(e.code!=='23505')throw e}}async function ensureKey(c){if(keyBytes&&current?.id===c)return{key:keyBytes,version};const k=await readKey(c);if(k)return{key:k,version};const r=await rpc('start_conversation_key_epoch',{p_conversation_id:c,p_device_id:device.id}),n=Number(Array.isArray(r)?(r[0]?.key_version??r[0]):(r?.key_version??r));if(!Number.isInteger(n)||n<1)throw Error('KEY_EPOCH_INVALID');const k2=crypto.getRandomValues(new Uint8Array(32));await addEnv(c,device,k2,n);const mem=await rest('conversation_members','select=user_id&conversation_id=eq.'+encodeURIComponent(c));for(const uid of [...new Set((mem||[]).map(z=>z.user_id))]){const ds=await rest('user_devices','select=id,identity_public_key&user_id=eq.'+encodeURIComponent(uid)+'&device_label=eq.Web&revoked_at=is.null');for(const d of ds||[])if(d.identity_public_key)await addEnv(c,d,k2,n)}keyBytes=k2;version=n;return{key:k2,version:n}}async function peer(c){const m=await rest('conversation_members','select=user_id&conversation_id=eq.'+encodeURIComponent(c)),pid=(m||[]).map(x=>x.user_id).find(x=>x!==user.id);if(!pid)return{};const p=(await rest('profiles','select=display_name,public_display_name,country,avatar_url,profile_image_url&user_id=eq.'+encodeURIComponent(pid)))?.[0]||{};return{name:p.public_display_name||p.display_name||'Membre WASSAFRICA',country:p.country||'',avatar:p.avatar_url||p.profile_image_url||''}}async function list(){const m=await rest('conversation_members','select=conversation_id&user_id=eq.'+encodeURIComponent(user.id)),ids=[...new Set((m||[]).map(x=>x.conversation_id))];$('list').replaceChildren();if(!ids.length){$('list').textContent='Aucune conversation.';return}const cs=await rest('conversations','select=id,title,created_at&order=created_at.desc&limit=100');for(const c of (cs||[]).filter(x=>ids.includes(x.id))){const p=await peer(c.id),d=document.createElement('div');d.className='conv';d.dataset.cid=c.id;d.textContent=p.name||c.title||'Conversation';d.onclick=()=>openConv({...c,...p});$('list').appendChild(d)}}async function search(v){$('results').replaceChildren();if(!v)return;try{const rs=(await rpc('search_public_profiles',{p_query:v})||[]).filter(x=>x.user_id!==user.id).slice(0,8);for(const p of rs){const d=document.createElement('div');d.className='conv';d.textContent=(p.display_name||p.public_display_name||'Membre WASSAFRICA')+(p.country?' · '+p.country:'');d.onclick=()=>startUser(p);$('results').appendChild(d)}}catch(e){status('Recherche indisponible : '+e.message,'err')}}async function startUser(p){const r=await rpc('start_direct_conversation_by_user_id',{p_user_id:p.user_id}),x=Array.isArray(r)?r[0]:r;if(!x?.conversation_id)throw Error('CONTACT_NOT_FOUND');$('results').replaceChildren();$('target').value='';await openConv({id:x.conversation_id,title:x.contact_name||p.display_name})}async function start(){const v=$('target').value.trim();if(!v)return status('Saisissez un nom ou un numéro.','err');$('start').disabled=true;try{const clean=v.replace(/[\s().-]/g,'');if(/^\+?[1-9][0-9]{7,14}$/.test(clean)){const r=await rpc('start_direct_conversation_by_phone',{p_phone:clean.startsWith('+')?clean:'+'+clean}),x=Array.isArray(r)?r[0]:r;if(!x?.conversation_id)throw Error('CONTACT_NOT_FOUND');await openConv({id:x.conversation_id,title:x.contact_name})}else await search(v)}catch(e){status('Impossible : '+e.message,'err')}finally{$('start').disabled=false}}async function decrypt(row,k){const m=row.encryption_metadata||{},iv=m.iv;if(!iv)throw Error('NO_IV');const aad=te.encode('whatsafrica:v2:'+m.conversation_id+':'+(m.message_id||row.id)),kk=await crypto.subtle.importKey('raw',k,{name:'AES-GCM'},false,['decrypt']);return td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(iv),additionalData:aad},kk,ub64(row.ciphertext)))}async function render(row,x){const d=document.createElement('div');d.className='msg '+(row.sender_id===user.id?'mine':'');const m=row.encryption_metadata||{};if(row.message_type==='text'){try{d.textContent=await decrypt(row,x.key)}catch{d.textContent='🔒 Message chiffré'}}else if(row.media_path){const el=document.createElement(row.message_type==='audio'?'audio':row.message_type==='video'?'video':'img');el.className='media';if(row.message_type==='audio')el.controls=true;if(row.message_type==='video')el.controls=true;try{const r=await fetch(SB+'/storage/v1/object/authenticated/'+encodeURIComponent('private-chat-media')+'/'+row.media_path,{headers:{apikey:KEY,Authorization:'Bearer '+session.access_token}});const buf=await r.arrayBuffer(),kk=await crypto.subtle.importKey('raw',x.key,{name:'AES-GCM'},false,['decrypt']),plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(m.media_iv),additionalData:te.encode('wassafrica:media:'+row.id)},kk,buf);el.src=URL.createObjectURL(new Blob([plain],{type:row.media_mime||'application/octet-stream'}));d.appendChild(el)}catch{d.textContent='🔒 Média sécurisé — restauration impossible'}}else d.textContent='📎 Média';$('msgs').appendChild(d)}async function load(){if(!current)return;const x=await ensureKey(current.id),rows=await rest('messages_v2','select=id,sender_id,created_at,ciphertext,encryption_metadata,message_type,media_path,media_mime,me crypt']),aad=te.encode('wassafrica:media:'+id),buf=await file.arrayBuffer(),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:aad},kk,buf),path=current.id+'/'+user.id+'/'+id+'.bin';const r=await fetch(SB+'/storage/v1/object/private-chat-media/'+path,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/octet-stream','x-upsert':'false'},body:ct});if(!r.ok)throw Error('MEDIA_UPLOAD_'+r.status);await rest('messages_v2','',{method:'POST',body:JSON.stringify({id,conversation_id:current.id,sender_id:user.id,body:null,message_type:type,encryption_version:1,ciphertext:null,media_path:path,media_mime:file.type||'application/octet-stream',media_duration_ms:null,encryption_metadata:{v:2,alg:'AES-256-GCM',media_iv:b64(iv),media_aad:'wassafrica:media:'+id,key_version:x.version}})});await load()}async function recordAudio(){if(recording)return;const stream=await navigator.mediaDevices.getUserMedia({audio:true});const chunks=[],mr=new MediaRecorder(stream);recording=mr;mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);mr.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());recording=null;try{await uploadMedia(new Blob(chunks,{type:mr.mimeType||'audio/webm'}),'audio');status('🔒 Audio envoyé.','ok')}catch(e){status('Audio non envoyé : '+e.message,'err')}};mr.start();$('recordBtn').textContent='⏹️ Stop audio';status('Enregistrement audio…');}async function stopAudio(){if(recording){recording.stop();$('recordBtn').textContent='🎙️ Audio'}}$('composer').onsubmit=async e=>{e.preventDefault();const b=$('body').value.trim();if(!b||!current)return;try{$('send').disabled=true;await sendText(b);$('body').value='';await load();status('🔒 Message envoyé.','ok')}catch(e){status('Message non envoyé : '+e.message,'err')}finally{$('send').disabled=false}};$('start').onclick=start;$('target').oninput=e=>{clearTimeout(window._st);window._st=setTimeout(()=>search(e.target.value.trim()),250)};$('target').onkeydown=e=>{if(e.key
