v></div></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(async()=>{const $=id=>document.getElementById(id),SB='https://dzifpwqrqnvssfhwjccj.supabase.co',KEY='sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV',AUTH='whatsafrica-auth',DB='wassafrica-msg-v26';let session,user,device,current,poll,keyCache=new Map();const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a))),ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(path,opt={}){const h=new Headers(opt.headers||{});h.set('apikey',KEY);if(session?.access_token)h.set('Authorization','Bearer '+session.access_token);if(opt.body&&!h.has('Content-Type'))h.set('Content-Type','application/json');const r=await fetch(SB+path,{...opt,headers:h});let d=null;try{d=await r.json()}catch{}if(!r.ok){const e=new Error(d?.message||d?.hint||d?.details||d?.code||'REQUEST_FAILED');e.code=d?.code;throw e}return d}const rest=(t,q='',o={})=>api('/rest/v1/'+t+(q?'?'+q:''),o),rpc=(f,b)=>api('/rest/v1/rpc/'+f,{method:'POST',body:JSON.stringify(b)});function readSession(){for(let i=0;i<localStorage.length;i++){try{const x=JSON.parse(localStorage.getItem(localStorage.key(i))||'null'),s=x?.access_token?x:x?.session;if(s?.access_token&&s.user?.id)return s}catch{}}return null}function vault(){return new Promise((ok,no)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function vg(k){const d=await vault();return new Promise((ok,no)=>{const r=d.transaction('k').objectStore('k').get(k);r.onsuccess=()=>{d.close();ok(r.result||null)};r.onerror=()=>no(r.error)})}async function vp(k,v){const d=await vault();return new Promise((ok,no)=>{const t=d.transaction('k','readwrite');t.objectStore('k').put(v,k);t.oncomplete=()=>{d.close();ok()};t.onerror=()=>no(t.error)})}async function ensureDevice(){if(device)return device;let s=await vg('id:'+user.id);if(!s){const g=await crypto.subtle.generateKey({name:'RSA-OAEP',modulusLength:2048,publicExponent:new Uint8Array([1,0,1]),hash:'SHA-256'},true,['encrypt','decrypt']);s={publicJwk:await crypto.subtle.exportKey('jwk',g.publicKey),privateJwk:await crypto.subtle.exportKey('jwk',g.privateKey)};await vp('id:'+user.id,s)}const pk=await crypto.subtle.importKey('jwk',s.privateJwk,{name:'RSA-OAEP',hash:'SHA-256'},true,['decrypt']),r=await rpc('ensure_web_device',{p_identity_public_key:s.publicJwk}),d=Array.isArray(r)?r[0]:r;device={id:d.id,identity_public_key:d.identity_public_key||s.publicJwk,privateKey:pk}}async function wrap(j,k){const p=await crypto.subtle.importKey('jwk',j,{name:'RSA-OAEP',hash:'SHA-256'},true,['encrypt']);return new Uint8Array(await crypto.subtle.encrypt({name:'RSA-OAEP'},p,k))}async function distribute(c,k,v){const mem=await rest('conversation_members','select=user_id&conversation_id=eq.'+c);for(const m of mem||[]){const ds=await rest('user_devices','select=id,identity_public_key&user_id=eq.'+m.user_id+'&device_label=eq.Web&revoked_at=is.null&order=last_seen_at.desc&limit=20');for(const d of ds||[])if(d.identity_public_key)try{await rest('conversation_key_envelopes','',{method:'POST',body:JSON.stringify({conversation_id:c,device_id:d.id,key_version:v,algorithm:'RSA-OAEP-2048-SHA256+AES-256-GCM',wrapped_key:b64(await wrap(d.identity_public_key,k))})})}catch(e){if(!String(e.message).toLowerCase().includes('duplicate'))throw e}}}async function getKey(c){if(keyCache.has(c))return keyCache.get(c);const r=await rest('conversation_key_envelopes','select=wrapped_key,key_version&conversation_id=eq.'+c+'&device_id=eq.'+device.id+'&revoked_at=is.null&order=key_version.desc&limit=1');if(!r?.length){const raw=crypto.getRandomValues(new Uint8Array(32)),v=Number(await rpc('start_conversation_key_epoch',{p_conversation_id:c,p_device_id:device.id}));await distribute(c,raw,v);return keyCache.set( gs').innerHTML='';for(const r of rows||[]){const d=document.createElement('div');d.className='bubble '+(r.sender_id===user.id?'mine':'');d.innerHTML=esc(await dec(current.id,r))+'<div class="meta">'+new Date(r.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+'</div>';$('msgs').appendChild(d)}$('msgs').scrollTop=$('msgs').scrollHeight}async function send(){if(!current)throw Error('Choisissez une conversation.');const text=$('body').value.trim();if(!text)return;const id=crypto.randomUUID(),e=await enc(current.id,text);await rest('messages_v2','',{method:'POST',body:JSON.stringify({id,conversation_id:current.id,sender_id:user.id,message_type:'text',encryption_version:1,ciphertext:e.ciphertext,encryption_metadata:{...e.meta,message_id:id}})});$('body').value='';$('send').disabled=true;await render();await load()}$('searchBtn').onclick=search;$('target').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();search()}};$('body').oninput=()=>{$('send').disabled=!$('body').value.trim()||!current};$('body').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('composer').requestSubmit()}};$('composer').onsubmit=e=>{e.preventDefault();if(!$('send').disabled)send().catch(x=>alert(x.message||'Envoi impossible'))};$('media').onclick=()=>current&&$('mediaInput').click();$('file').onclick=()=>current&&$('fileInput').click();$('camera').onclick=async()=>{if(!current)return alert('Choisissez une conversation.');try{const s=await navigator.mediaDevices.getUserMedia({video:true,audio:true});s.getTracks().forEach(t=>t.stop());alert('Caméra et micro autorisés.')}catch(e){alert('Autorisation caméra/micro refusée ou indisponible.')}};$('audio').onclick=async()=>{if(!current)return alert('Choisissez une conversation.');try{const s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(t=>t.stop());alert('Microphone autorisé.')}catch(e){alert('Autorisation microphone refusée ou indisponible.')}};try{session=readSession();if(!session)
