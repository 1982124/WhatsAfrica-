<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WhatsAfrica — Ma vitrine</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#0b1020;color:#f7f3e8;font:15px system-ui}.wrap{max-width:760px;margin:auto;padding:20px}.card{background:#121a2c;border:1px solid #26334c;border-radius:18px;padding:18px;margin:14px 0}input,textarea{width:100%;box-sizing:border-box;padding:12px;margin:6px 0 12px;border-radius:10px;border:1px solid #26334c;background:#09101d;color:#fff}textarea{min-height:110px}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer;background:#e8a83c}.ghost{background:transparent;color:#fff;border:1px solid #26334c}.row{display:flex;gap:10px;flex-wrap:wrap}.muted{color:#98a5bb}.ok{color:#57d39b}.err{color:#ff8f8f}.preview{width:100%;max-height:280px;object-fit:cover;border-radius:14px}.hidden{display:none!important}</style></head><body><div class="wrap"><div class="row"><a class="btn ghost" href="/dashboard">← Cockpit</a><a class="btn ghost" href="/">Découvrir</a></div><div class="card"><h1>🪧 Ma vitrine Smart Link</h1><p class="muted">Créez la petite affiche de présentation que vos visiteurs voient avant vos produits et services.</p><label>Nom de l'entreprise</label><input id="name"><label>Accroche</label><input id="tagline" placeholder="Ex. Solutions numériques africaines pour un monde connecté"><label>Présentation</label><textarea id="presentation" placeholder="Présentez clairement l'activité, les solutions, les réalisations et la proposition de valeur."></textarea><label>Adresse complète</label><input id="address" placeholder="Rue, quartier, ville, pays"><label>Ville</label><input id="city"><label>Pays</label><input id="country"><label>E-mail professionnel</label><input id="email" type="email"><label>Téléphone</label><input id="phone"><label>Site web</label><input id="website" type="url" placeholder="https://..."><label>Services / solutions (un par ligne)</label><textarea id="services" placeholder="Automatisation marketing\nÉducation numérique\nMobilité sûre..."></textarea><label>Image principale de la vitrine</label><input id="cover" type="file" accept="image/jpeg,image/png,image/webp"><img id="preview" class="preview hidden"><div class="row"><button class="btn" id="save">Enregistrer la vitrine</button><a class="btn ghost" id="view" target="_blank">Voir ma vitrine</a></div><p id="msg" class="muted"></p></div></div><script>const U='https://dzifpwqrqnvssfhwjccj.supabase.co',K='sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV',db=supabase.createClient(U,K),$=x=>document.getElementById(x);let b=null;const esc=v=>String(v??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));async function load(){const s=await db.auth.getSession();if(!s.data.session){location.href='/dashboard';return}const u=s.data.session.user;const r=await db.from('businesses').select('*').eq('owner_id',u.id).maybeSingle();if(r.error)throw r.error;if(!r.data){$('msg').textContent='Créez d’abord votre Smart Link depuis le cockpit.';return}b=r.data;$('name').value=b.name||'';$('tagline').value=b.tagline||'';$('presentation').value=b.presentation||b.description||'';$('address').value=b.address||'';$('city').value=b.city||'';$('country').value=b.country||'';$('email').value=b.email||'';$('phone').value=b.phone||'';$('website').value=b.website||'';$('services').value=Array.isArray(b.services)?b.services.join('\n'):'';if(b.cover_image_url){$('preview').src=b.cover_image_url;$('preview').classList.remove('hidden')}if(b.slug)$('view').href='/'+encodeURIComponent(b.slug)}$('save').onclick=async()=>{try{if(!b)return;const f=$('cover').files[0];let cover=b.cover_image_url||null;if(f){if(f.size>8*1024*1024)throw new Error('Image trop volumineuse (8 Mo max).');const ext=(f.name.split('.').pop()||'jpg').toLowerCase();const path=b.owner_id+'/business-cover-'+crypto.randomUUID()+'.'+ext;const up=await db.storage.from('profile-media').upload(path,f,{contentType:f.type,upsert:false});if(up.error)throw up.error;cover=db.storage.from('profile-media').getPublicUrl(path).data.publicUrl}const r=await db.from('businesses').update({name:$('name').value.trim(),tagline:$('tagline').value.trim(),presentation:$('presentation').value.trim(),description:$('presentation').value.trim(),address:$('address').value.trim(),city:$('city').value.trim(),country:$('country').value.trim(),email:$('email').value.trim(),phone:$('phone').value.trim(),website:$('website').value.trim(),services:$('services').value.split('\n').map(x=>x.trim()).filter(Boolean),cover_image_url:cover,updated_at:new Date().toISOString()}).eq('id',b.id);if(r.error)throw r.error;$('msg').innerHTML='<span class="ok">Vitrine enregistrée.</span>';await load()}catch(e){$('msg').innerHTML='<span class="err">'+esc(e.message)+'</span>'}};load().catch(e=>$('msg').textContent=e.message);</script></body></html>
