<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WASSAFRICA — Migration sécurisée</title><style>body{font:15px system-ui;margin:0;background:#f5f7f6;color:#17211b}.wrap{max-width:680px;margin:12vh auto;padding:24px}.card{background:#fff;border:1px solid #dce5e1;border-radius:16px;padding:24px}.ok{color:#18845d}.err{color:#b42318}</style><script src="/brand-observer.js"></script></head><body><div class="wrap"><section class="card"><h2>WASSAFRICA</h2><div id="s">Préparation de la messagerie sécurisée…</div></section></div><script>(async()=>{'use strict';const $=x=>document.getElementById(x);function openDB(name){return new Promise((ok,no)=>{let r=indexedDB.open(name);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}function readAll(db){return new Promise((ok,no)=>{let out=[];let r=db.transaction('k').objectStore('k').openCursor();r.onsuccess=e=>{let c=e.target.result;if(!c)return ok(out);out.push([c.key,c.value]);c.continue()};r.onerror=()=>no(r.error)})}async function ensureV7(){return new Promise((ok,no)=>{let r=indexedDB.open('wassafrica-msg-v7',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('k'))r.result.createObjectStore('k')};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function writeAll(db,rows){if(!rows.length)return;await new Promise((ok,no)=>{let t=db.transaction('k','readwrite'),s=t.objectStore('k');for(const [k,v] of rows)s.put(v,k);t.oncomplete=ok;t.onerror=()=>no(t.error)})}try{let old=null;try{old=await openDB('wassafrica-msg-v6')}catch{}let v7=await ensureV7();if(old){let rows=await readAll(old);old.close();let existing=await readAll(v7);let keys=new Set(existing.map(x=>String(x[0])));let missing=rows.filter(x=>!keys.has(String(x[0])));await writeAll(v7,missing);if(missing.length)$('s').textContent='Identité sécurisée migrée. Ouverture de la messagerie…'}else{$('s').textContent='Nouvelle identité sécurisée. Ouverture de la messagerie…'}v7.close();$('s').className='ok';location.replace('/inbox-v7.html')}catch(e){console.error(e);$('s').textContent='Migration sécurisée impossible : '+(e.message||e);$('s').className='err'}})()</script></body></html>
