id="body" maxlength="4000" autocomplete="off" placeholder="Écrire un message…"><button class="btn" type="submit">➤</button></form></div><div id="empty">Choisissez une conversation.</div></section></div></main></div><script>(function(){'use strict';const $=id=>document.getElementById(id),SB='https://dzifpwqrqnvssfhwjccj.supabase.co',KEY='sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV',AUTH='whatsafrica-auth',te=new TextEncoder(),td=new TextDecoder();let session,user,device,current,keyBytes,version=0,busy=false,timer;window.addEventListener('error',e=>{gate.hidden=false;gate.innerHTML='❌ Erreur navigateur : <b>'+String(e.message||e).replace(/[<>]/g,'')+'</b>'});const gate=$('gate');const status=(t,c='')=>{$('status').textContent=t;$('status').className='muted '+c};const secure=t=>$('secure').textContent=t;const b64=x=>{let s='';new Uint8Array(x).forEach(b=>s+=String.fromCharCode(b));return btoa(s)};const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));async function api(path,opt={}){const h=new Headers(opt.headers||{});h.set('apikey',KEY);if(session?.access_token)h.set('Authorization','Bearer '+session.access_token);h.set('Content-Type','application/json');const r=await fetch(SB+path,{...opt,headers:h});let data=null;try{data=await r.json()}catch{}if(!r.ok){const e=new Error(data?.message||data?.error_description||data?.hint||JSON.stringify(data)||('HTTP_'+r.status));e.code=data?.code;e.status=r.status;throw e}return data}async function rest(table,params='',opt={}){return api('/rest/v1/'+table+(params?'?'+params:''),opt)}async function rpc(fn,body){return api('/rest/v1/rpc/'+fn,{method:'POST',body:JSON.stringify(body)})}function readLocalSession(){try{const x=JSON.parse(localStorage.getItem(AUTH)||'null');return x?.access_token?x:null}catch{return null}}async function refreshSession(){if(!session?.refresh_token)return false;try{const d=await api('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:session.refresh_token})});se d:'PATCH',body:JSON.stringify({last_seen_at:new Date().toISOString()})})}else{const r=await rest('user_devices','select=id,identity_public_key',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({user_id:user.id,device_label:'Web',identity_public_key:i.x.publicJwk,last_seen_at:new Date().toISOString()})});d=r?.[0]}if(!d?.id)throw Error('DEVICE_NOT_AVAILABLE');device={id:d.id,deviceId:d.id,identity_public_key:i.x.publicJwk,publicJwk:i.x.publicJwk,privateKey:i.privateKey};return device}async function wrapKey(j,k){const p=await crypto.subtle.importKey('jwk',j,{name:'RSA-OAEP',hash:'SHA-256'},true,['encrypt']);return b64(await crypto.subtle.encrypt({name:'RSA-OAEP'},p,k))}async function unwrapKey(s){return new Uint8Array(await crypto.subtle.decrypt({name:'RSA-OAEP'},device.privateKey,ub64(s)))}async function readKey(c,v=0){let p='select=wrapped_key,key_version&conversation_id=eq.'+encodeURIComponent(c)+'&device_id=eq.'+encodeURIComponent(device.id)+'&revoked_at=is.null&order=key_version.desc&limit=1';if(v)p='select=wrapped_key,key_version&conversation_id=eq.'+encodeURIComponent(c)+'&device_id=eq.'+encodeURIComponent(device.id)+'&revoked_at=is.null&key_version=eq.'+v;const rows=await rest('conversation_key_envelopes',p);const r=rows?.[0];if(!r)return null;const k=await unwrapKey(r.wrapped_key);keyBytes=k;version=Number(r.key_version);return k}async function addEnv(c,d,k,v){const body={conversation_id:c,device_id:d.id,key_version:v,algorithm:'RSA-OAEP-2048-SHA256+AES-256-GCM',wrapped_key:await wrapKey(d.identity_public_key||d.identity_public_key,k)};try{await rest('conversation_key_envelopes','',{method:'POST',body:JSON.stringify(body)})}catch(e){if(e.code!=='23505')throw e}}async function distribute(c,k,v){const mem=await rest('conversation_members','select=user_id&conversation_id=eq.'+encodeURIComponent(c));for(const uid of [...new Set((mem||[]).map(x=>x.user_id))]){const ds=await rest('user_devices','select=id,identity_public_key&user_id=eq.'+e st d=document.createElement('div');d.className='conv';d.textContent=(p.display_name||p.public_display_name||'Membre WASSAFRICA')+' '+(p.country||'');d.onclick=()=>startUser(p);$('results').appendChild(d)}if(rs.length===1)await startUser(rs[0])}async function startUser(p){const r=await rpc('start_direct_conversation_by_user_id',{p_user_id:p.user_id}),x=Array.isArray(r)?r[0]:r;if(!x?.conversation_id)throw Error('CONTACT_NOT_FOUND');await openConv({id:x.conversation_id,title:x.contact_name||p.display_name})}async function start(){const v=$('target').value.trim();if(!v)return status('Saisissez un nom ou un numéro.','err');$('start').disabled=true;try{const clean=v.replace(/[\s().-]/g,'');if(/^\+?[1-9][0-9]{7,14}$/.test(clean)){const r=await rpc('start_direct_conversation_by_phone',{p_phone:clean.startsWith('+')?clean:'+'+clean}),x=Array.isArray(r)?r[0]:r;if(!x?.conversation_id)throw Error('CONTACT_NOT_FOUND');await openConv({id:x.conversation_id,title:x.contact_name})}else await find(v)}catch(e){status('Impossible : '+(e.message||e),'err')}finally{$('start').disabled=false}}async function decrypt(row,k){const m=row.encryption_metadata||{},aad=te.encode('whatsafrica:v2:'+m.conversation_id+':'+(m.message_id||row.id));const kk=await crypto.subtle.importKey('raw',k,{name:'AES-GCM'},false,['decrypt']);return td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(m.iv),additionalData:aad},kk,ub64(row.ciphertext)))}async function load(){if(!current)return;const x=await ensureKey(current.id),rows=await rest('messages_v2','select=id,sender_id,created_at,ciphertext,encryption_metadata&conversation_id=eq.'+encodeURIComponent(current.id)+'&order=created_at.asc&limit=200');const nodes=[];for(const r of rows||[]){let text='🔒 Message chiffré';try{const v=Number(r.encryption_metadata?.key_version||version),k=v===version?keyBytes:await readKey(current.id,v);if(k)text=await decrypt(r,k)}catch{}const d=document.createElement('div');d.className='msg '+(r.sender_id===user.id?'mine':'
