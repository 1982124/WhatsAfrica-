<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Vitrine commerciale WhatsAfrica"><title>WhatsAfrica — Vitrine</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--a:#e8a83c;--bg:#080d14;--panel:#111a28;--card:#152132;--line:#2b3b50;--muted:#a6b1c0;--green:#1fb487}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#284533,#080d14 50%);color:#f8f3e8;font:15px system-ui}.wrap{max-width:1160px;margin:auto;padding:0 16px}.nav{position:sticky;top:0;z-index:20;background:#080d14ed;backdrop-filter:blur(15px);border-bottom:1px solid var(--line)}.navrow{min-height:64px;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font:bold 22px Georgia;color:#fff;text-decoration:none}.brand b{color:var(--a)}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:#0e1723;color:#fff;text-decoration:none;font-weight:850;cursor:pointer}.primary{background:var(--a);color:#17120b;border-color:var(--a)}.green{background:var(--green);border-color:var(--green);color:#04241b}.hero{margin:18px 0;border:1px solid var(--line);border-radius:25px;overflow:hidden;background:#111a28}.cover{height:330px;width:100%;object-fit:cover;background:linear-gradient(135deg,#173c22,#2b2040,#d59b27)}.heroBody{padding:22px}.logo{width:105px;height:105px;border-radius:23px;object-fit:cover;border:2px solid var(--a);margin-top:-75px;position:relative;background:#172235}.ey{font:10px monospace;letter-spacing:2px;color:#5de0b8;font-weight:900}.h1{font:700 clamp(35px,6vw,62px)/1.02 Georgia;margin:8px 0}.tagline{font-size:20px;line-height:1.45}.muted{color:var(--muted);line-height:1.55}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.section{margin:25px 0}.section h2{font:700 29px Georgia;margin:0 0 5px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:linear-gradient(180deg,#162235,#111a28);border:1px solid var(--line);border-radius:18px;overflow:hidden}.media{height:220px;background:linear-gradient(135deg,#1d533e,#b4872e);display:grid;place-items:center;font-size:60px}.media img,.media video{width:100%;height:100%;object-fit:cover}.body{padding:15px}.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:#1fb4871a;color:#69e0bb;font-size:10px;font-weight:900}.price{color:var(--a);font-size:19px;font-weight:950;margin:9px 0}.contact{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.contact a{color:#fff;text-decoration:none}.empty{padding:38px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}.sharebar{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}.cover{height:190px}.actions .btn,.sharebar .btn{width:100%}}</style></head><body><header class="nav"><div class="wrap navrow"><a class="brand" href="/">Whats<b>Africa</b></a><div><a class="btn" href="/commerce">🛍️ Marché</a> <a class="btn primary" href="/inbox">💬 Discuter</a></div></div></header><main class="wrap" id="page"><div class="empty">Ouverture de la vitrine…</div></main><script>const db=supabase.createClient('https://dzifpwqrqnvssfhwjccj.supabase.co','sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV'),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));const safe=v=>{try{const u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:null}catch{return null}},money=(v,c)=>v==null?'Prix sur demande':new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0}).format(Number(v||0))+' '+(c||'XOF');const slug=decodeURIComponent(location.pathname.replace(/^\/+/, '').split('/')[0]||'');let business,products=[],services=[];async function load(){const l=await db.from('smart_links').select('id,business_id,title,description,slug,is_public').eq('slug',slug).eq('is_public',true).maybeSingle();if(l.error||!l.data)return fail('Cette vitrine n’est pas disponible.');const b=await db.from('businesses').select('*').eq('id',l.data.business_id).maybeSingle();if(b.error)throw b.error;business=b.data||{name:l.data.title,description:l.data.description};const [p,s]=await Promise.all([db.from('products').select('id,title,description,price,currency,image_url,video_url,product_type,category,is_published').eq('business_id',l.data.business_id).eq('is_published',true).order('created_at',{ascending:false}).limit(100),db.from('marketplace_services').select('id,title,description,category,price,currency,metadata,status').eq('seller_id',business.owner_id).eq('status','published').order('created_at',{ascending:false}).limit(100)]);products=p.data||[];services=s.data||[];render(l.data)}function fail(t){$('page').innerHTML='<div class="empty"><h1>'+esc(t)+'</h1><a class="btn primary" href="/">Ouvrir WhatsAfrica</a></div>'}function product(p){const im=safe(p.image_url),v=safe(p.video_url);return '<article class="card"><div class="media">'+(v?'<video controls preload="metadata" poster="'+esc(im||'')+'" src="'+esc(v)+'"></video>':im?'<img loading="lazy" src="'+esc(im)+'" alt="'+esc(p.title)+'">':'📦')+'</div><div class="body"><span class="tag">'+(p.product_type==='digital'?'PRODUIT DIGITAL':'PRODUIT')+'</span><h3>'+esc(p.title)+'</h3><p class="muted">'+esc(p.description||'')+'</p><div class="price">'+money(p.price,p.currency)+'</div><div class="actions"><a class="btn primary" href="/inbox">🛒 Commander / discuter</a></div></div></article>'}function service(s){const m=s.metadata&&typeof s.metadata==='object'?s.metadata:{};const im=safe(m.image_url||m.image);return '<article class="card"><div class="media">'+(im?'<img src="'+esc(im)+'" alt="'+esc(s.title)+'">':'🧰')+'</div><div class="body"><span class="tag">SERVICE</span><h3>'+esc(s.title)+'</h3><p class="muted">'+esc(s.description||'Solution proposée par cette entreprise.')+'</p>'+(s.price!=null?'<div class="price">'+money(s.price,s.currency)+'</div>':'')+'<div class="actions"><a class="btn primary" href="/inbox">💬 Demander</a></div></div></article>'}function render(link){document.documentElement.style.setProperty('--a',/^#[0-9a-f]{6}$/i.test(business.accent_color||'')?business.accent_color:'#e8a83c');const logo=safe(business.logo_url),cover=safe(business.cover_image_url)||logo,url=location.href;$('page').innerHTML='<section class="hero">'+(cover?'<img class="cover" src="'+esc(cover)+'" alt="'+esc(business.name)+'">':'')+'<div class="heroBody">'+(logo?'<img class="logo" src="'+esc(logo)+'" alt="Logo '+esc(business.name)+'">':'')+'<div class="ey">VITRINE COMMERCIALE WHATS AFRICA</div><h1 class="h1">'+esc(business.name||link.title)+'</h1>'+(business.tagline?'<div class="tagline">'+esc(business.tagline)+'</div>':'')+'<p class="muted">'+esc(business.presentation||business.description||link.description||'')+'</p><div class="contact">'+(business.city||business.country?'<span class="btn">🌍 '+esc([business.city,business.country].filter(Boolean).join(' · '))+'</span>':'')+(business.phone?'<a class="btn" href="tel:'+esc(business.phone)+'">📞 '+esc(business.phone)+'</a>':'')+(business.email?'<a class="btn" href="mailto:'+esc(business.email)+'">✉️ Contacter</a>':'')+'</div><div class="actions"><a class="btn primary" href="/inbox">💬 Parler à cette entreprise</a><a class="btn green" href="/digital-market">📚 Voir le marché digital</a></div><div class="sharebar"><button class="btn" id="share">🔗 Partager cette vitrine</button><button class="btn" id="copy">📋 Copier le lien</button></div></div></section><section class="section"><h2>🧰 Services & solutions</h2><p class="muted">Ce que cette entreprise peut faire pour vous.</p><div class="grid">'+(services.length?services.map(service).join(''):'<div class="empty">Aucun service publié pour le moment.</div>')+'</div></section><section class="section"><h2>🛍️ Produits</h2><p class="muted">Produits physiques et contenus digitaux, avec leur vraie image quand elle est disponible.</p><div class="grid">'+(products.length?products.map(product).join(''):'<div class="empty">Aucun produit publié pour le moment.</div>')+'</div></section>';$('share').onclick=()=>navigator.share?navigator.share({title:business.name,text:business.tagline||'Découvrez cette vitrine WhatsAfrica',url}):$('copy').click();$('copy').onclick=async()=>{await navigator.clipboard?.writeText(url);$('copy').textContent='✓ Lien copié'} }load().catch(e=>fail(e.message||'Erreur de chargement')); </script></body></html>
