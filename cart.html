<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panier — WASSAFRICA</title><style>:root{--bg:#f7f2e9;--s:#fffdf9;--i:#20242b;--m:#77766f;--l:#e5ddd1;--g:#287b36}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--i);font:15px system-ui}.wrap{max-width:1000px;margin:auto;padding:0 14px}.top{border-bottom:1px solid var(--l);background:#f7f2e9ee;position:sticky;top:0;z-index:5}.row{min-height:62px;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:22px;font-weight:950;color:inherit;text-decoration:none}.btn{border:1px solid var(--l);background:var(--s);color:inherit;border-radius:12px;padding:10px 13px;font-weight:850;text-decoration:none;cursor:pointer}.primary{background:var(--g);border-color:var(--g);color:#fff}.card{background:var(--s);border:1px solid var(--l);border-radius:18px;padding:16px;margin:14px 0}.item{display:grid;grid-template-columns:80px 1fr auto;gap:12px;align-items:center}.thumb{width:80px;height:80px;border-radius:12px;object-fit:cover;background:#e8e3d8}.qty{display:flex;align-items:center;gap:6px}.qty button{width:32px;height:32px;border:1px solid var(--l);background:#fff;border-radius:9px;cursor:pointer}.price{font-weight:950}.seller{font-size:12px;color:var(--m)}.empty{text-align:center;padding:50px;color:var(--m)}.total{font-size:22px;font-weight:950}@media(max-width:620px){.item{grid-template-columns:60px 1fr}.thumb{width:60px;height:60px}.item>.price{grid-column:2}.actions{display:flex;flex-direction:column}.actions .btn{width:100%;text-align:center}}</style><script src="/wa-cart.js"></script></head><body><header class="top"><div class="wrap row"><a class="brand" href="/">WASSAFRICA</a><a class="btn" href="/market">← Marché</a></div></header><main class="wrap"><section id="app" class="card">Chargement…</section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient('https://dzifpwqrqnvssfhwjccj.supabase.co','sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV');const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=(v,c)=>new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0}).format(Number(v||0))+' '+(c||'XOF');let data=[];
async function load(){const ids=WA_CART.load().map(x=>x.product_id);if(!ids.length){app.innerHTML='<div class="empty"><h2>Votre panier est vide</h2><p>Découvrez les offres et ajoutez celles qui vous intéressent.</p><a class="btn primary" href="/market">Découvrir le marché</a></div>';return}const r=await db.from('products').select('id,title,price,currency,image_url,business_id,product_type,stock,is_published').in('id',ids).eq('is_published',true);if(r.error)throw r.error;const map=new Map((r.data||[]).map(x=>[x.id,x]));data=WA_CART.load().map(x=>({...x,product:map.get(x.product_id)})).filter(x=>x.product);const bids=[...new Set(data.map(x=>x.product.business_id))];const br=await db.from('businesses').select('id,name,city,country,payment_methods,delivery_enabled,delivery_fee').in('id',bids);const bm=new Map((br.data||[]).map(x=>[x.id,x]));data.forEach(x=>x.business=bm.get(x.product.business_id));render()}
function render(){const groups=new Map();data.forEach(x=>{const id=x.product.business_id;if(!groups.has(id))groups.set(id,[]);groups.get(id).push(x)});let total=0;let html='<h1>🛒 Votre panier</h1><p style="color:#777">Les vendeurs sont séparés automatiquement pour préserver leurs conditions de paiement et de livraison.</p>';for(const [bid,items] of groups){const b=items[0].business||{};let sub=0;html+='<section class="card"><h2>'+esc(b.name||'Vendeur WASSAFRICA')+'</h2><div class="seller">'+esc([b.city,b.country].filter(Boolean).join(' · '))+'</div>';for(const x of items){const p=x.product,q=Math.min(99,x.quantity);const line=Number(p.price||0)*q;sub+=line;const img=p.image_url?'<img class="thumb" src="'+esc(p.image_url)+'" alt="">':'<div class="thumb"></div>';html+='<div class="item"><a href="/product/'+encodeURIComponent(p.id)+'">'+img+'</a><div><strong>'+esc(p.title)+'</strong><div class="seller">'+esc(p.product_type||'offre')+'</div><div class="qty"><button data-act="dec" data-id="'+p.id+'">−</button><b>'+q+'</b><button data-act="inc" data-id="'+p.id+'">+</button><button class="btn" data-act="remove" data-id="'+p.id+'">Retirer</button></div></div><div class="price">'+money(line,p.currency)+'</div></div>'}total+=sub;html+='<div style="display:flex;justify-content:space-between;margin-top:14px"><strong>Sous-total vendeur</strong><strong>'+money(sub,items[0].product.currency)+'</strong></div><div class="actions" style="margin-top:12px"><button class="btn primary" data-checkout="'+bid+'">Commander ce vendeur</button></div></section>'}html+='<section class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><strong>Total panier</strong><span class="total">'+money(total,data[0]?.product.currency)+'</span></div>'+(groups.size>1?'<div class="actions" style="margin-top:12px"><button class="btn primary" data-checkout-all>Commander tout le panier</button></div>':'')+'<p class="seller">En multi-vendeur, un checkout group crée une sous-commande par vendeur. Les paiements restent séparés et traçables.</p></section>';app.innerHTML=html}
document.addEventListener('click',async e=>{const el=e.target.closest('[data-act],[data-checkout]');if(!el)return;const id=el.dataset.id;if(el.dataset.act==='remove'){WA_CART.remove(id);await load();return}if(el.dataset.act==='inc'||el.dataset.act==='dec'){const x=WA_CART.load().find(x=>x.product_id===id);const p=data.find(x=>x.product_id===id)?.product;const next=(x?.quantity||1)+(el.dataset.act==='inc'?1:-1);if(next<1)return;if(p&&p.stock!=null&&next>Number(p.stock))return;if(x)WA_CART.setQty(id,next);await load();return}if(el.dataset.checkoutAll){
 const session=(await db.auth.getSession()).data.session;
 if(!session){alert('Connectez-vous pour utiliser le checkout multi-vendeur.');location.href='/auth?next=/cart';return}
 const groups=new Map();data.forEach(x=>{const bid=x.product.business_id;if(!groups.has(bid))groups.set(bid,[]);groups.get(bid).push(x)});
 const old=document.getElementById('waCheckoutOverlay');old?.remove();const overlay=document.createElement('div');overlay.id='waCheckoutOverlay';overlay.style='position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:50;display:grid;place-items:center;padding:16px';
 let sellerChoices='';for(const [bid,items] of groups){const b=items[0].business||{};const methods=Array.isArray(b.payment_methods)?b.payment_methods:[];const opts=(methods.length?methods:['cash_on_delivery']).map(m=>'<option value="'+esc(m)+'">'+esc(m==='cash_on_delivery'?'Paiement à la livraison':m==='mobile_money'?'Mobile Money':'Paiement en ligne')+'</option>').join('');sellerChoices+='<div style="padding:12px;border:1px solid #e5ddd1;border-radius:12px"><strong>'+esc(b.name||'Vendeur')+'</strong><div class="seller">'+esc([b.city,b.country].filter(Boolean).join(' · '))+'</div><label style="display:block;margin-top:8px">Paiement<select data-pay-method="'+bid+'" style="display:block;width:100%;padding:9px;border:1px solid #e5ddd1;border-radius:9px;margin-top:4px">'+opts+'</select></label></div>'}
 overlay.innerHTML='<div style="width:min(560px,100%);max-height:90vh;overflow:auto;background:#fffdf9;border:1px solid #e5ddd1;border-radius:18px;padding:18px"><h2 style="margin-top:0">Checkout multi-vendeur</h2><p class="seller">Chaque vendeur recevra sa propre sous-commande. Chaque paiement sera traité séparément.</p><form id="waMultiForm" style="display:grid;gap:10px"><input id="waName" required minlength="2" autocomplete="name" placeholder="Votre nom"><input id="waPhone" required minlength="8" autocomplete="tel" placeholder="Téléphone"><select id="waMethod" required><option value="pickup">Retrait / point de remise</option><option value="delivery">Livraison</option></select><input id="waCity" required placeholder="Ville"><input id="waAddress" placeholder="Adresse de livraison">'+sellerChoices+'<div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn" id="waCancel">Annuler</button><button type="submit" class="btn primary">Créer le checkout</button></div><p id="waCheckoutMsg" class="seller"></p></form></div>';
 document.body.appendChild(overlay);const form=document.getElementById('waMultiForm'),method=document.getElementById('waMethod'),address=document.getElementById('waAddress');const sync=()=>{address.required=method.value==='delivery';address.style.display=method.value==='delivery'?'block':'none'};method.onchange=sync;sync();document.getElementById('waCancel').onclick=()=>overlay.remove();overlay.onclick=x=>{if(x.target===overlay)overlay.remove()};
 form.onsubmit=async ev=>{ev.preventDefault();if(loading)return;loading=true;const msg=document.getElementById('waCheckoutMsg');msg.textContent='Création des sous-commandes…';try{
   const groupsPayload=[...groups.entries()].map(([bid,items])=>({business_id:bid,smart_link_id:null,payment_method:document.querySelector('[data-pay-method="'+bid+'"]').value,items:items.map(x=>({product_id:x.product_id,quantity:x.quantity}))}));
   const r=await db.rpc('create_multi_vendor_checkout',{p_buyer_name:document.getElementById('waName').value.trim(),p_buyer_phone:document.getElementById('waPhone').value.trim(),p_delivery_city:document.getElementById('waCity').value.trim()||null,p_delivery_address:method.value==='delivery'?address.value.trim():null,p_delivery_method:method.value,p_payment_method:'cash_on_delivery',p_groups:groupsPayload,p_idempotency_key:crypto.randomUUID()+crypto.randomUUID()});
   if(r.error)throw r.error;const g=r.data;if(!g?.checkout_group_id)throw new Error('Checkout group non créé');data.forEach(x=>WA_CART.remove(x.product_id));location.href='/checkout-group/'+encodeURIComponent(g.checkout_group_id);
 }catch(err){msg.textContent='Checkout impossible : '+String(err?.message||err).slice(0,240)}finally{loading=false}};return;
 }if(el.dataset.checkout){const bid=el.dataset.checkout;const items=data.filter(x=>x.product.business_id===bid);const b=items[0]?.business||{};if(!(b.payment_methods||[]).includes('cash_on_delivery')){alert('Paiement à la livraison non configuré pour ce vendeur. Contactez-le pour convenir du règlement.');return}const old=document.getElementById('waCheckoutOverlay');old?.remove();const overlay=document.createElement('div');overlay.id='waCheckoutOverlay';overlay.style='position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:50;display:grid;place-items:center;padding:16px';const delivery=b.delivery_enabled?'<option value="delivery">Livraison</option>':'';overlay.innerHTML='<div style="width:min(520px,100%);max-height:90vh;overflow:auto;background:#fffdf9;border:1px solid #e5ddd1;border-radius:18px;padding:18px"><h2 style="margin-top:0">Commander chez '+esc(b.name||'ce vendeur')+'</h2><form id="waCheckoutForm" style="display:grid;gap:10px"><input id="waName" required minlength="2" autocomplete="name" placeholder="Votre nom"><input id="waPhone" required minlength="8" autocomplete="tel" inputmode="tel" placeholder="Téléphone"><select id="waMethod" required><option value="pickup">Retrait / point de remise</option>'+delivery+'</select><input id="waCity" required placeholder="Ville" value="'+esc(b.city||'')+'"><input id="waAddress" placeholder="Adresse de livraison" autocomplete="street-address"><div style="padding:12px;border-radius:12px;background:#f4eee3;border:1px solid #e5ddd1;line-height:1.45">Paiement : <strong>Paiement à la livraison</strong>.<br>La commande sera créée en attente. WASSAFRICA ne simule aucun paiement.</div><div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn" id="waCancel">Annuler</button><button type="submit" class="btn primary">Créer la commande</button></div><p id="waCheckoutMsg" class="seller"></p></form></div>';document.body.appendChild(overlay);const form=document.getElementById('waCheckoutForm'),method=document.getElementById('waMethod'),address=document.getElementById('waAddress');const sync=()=>{address.required=method.value==='delivery';address.style.display=method.value==='delivery'?'block':'none'};method.onchange=sync;sync();document.getElementById('waCancel').onclick=()=>overlay.remove();overlay.onclick=x=>{if(x.target===overlay)overlay.remove()};form.onsubmit=async ev=>{ev.preventDefault();if(loading)return;loading=true;const msg=document.getElementById('waCheckoutMsg');msg.textContent='Création de la commande…';try{const buyer=(await db.auth.getUser()).data?.user?.id||null;const r=await db.rpc('create_guest_order',{p_business_id:bid,p_smart_link_id:null,p_buyer_name:document.getElementById('waName').value.trim(),p_buyer_phone:document.getElementById('waPhone').value.trim(),p_delivery_city:document.getElementById('waCity').value.trim()||null,p_delivery_address:method.value==='delivery'?address.value.trim():null,p_delivery_method:method.value,p_payment_method:'cash_on_delivery',p_items:items.map(x=>({product_id:x.product_id,quantity:x.quantity})),p_idempotency_key:crypto.randomUUID()+crypto.randomUUID(),p_buyer_user_id:buyer});if(r.error)throw r.error;const o=r.data||{};items.forEach(x=>WA_CART.remove(x.product_id));location.href='/commande/'+encodeURIComponent(o.tracking_token||'')+'?order_id='+encodeURIComponent(o.order_id||'')}catch(err){msg.className='error';msg.textContent='Commande impossible : '+String(err?.message||err).slice(0,220)}finally{loading=false}}}});load().catch(e=>app.innerHTML='<div class="empty">Impossible de charger le panier. '+esc(e.message||'Erreur')+'</div>');
