<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panier — WASSAFRICA</title><style>:root{--bg:#f7f2e9;--s:#fffdf9;--i:#20242b;--m:#77766f;--l:#e5ddd1;--g:#287b36}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--i);font:15px system-ui}.wrap{max-width:1000px;margin:auto;padding:0 14px}.top{border-bottom:1px solid var(--l);background:#f7f2e9ee;position:sticky;top:0;z-index:5}.row{min-height:62px;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:22px;font-weight:950;color:inherit;text-decoration:none}.btn{border:1px solid var(--l);background:var(--s);color:inherit;border-radius:12px;padding:10px 13px;font-weight:850;text-decoration:none;cursor:pointer}.primary{background:var(--g);border-color:var(--g);color:#fff}.card{background:var(--s);border:1px solid var(--l);border-radius:18px;padding:16px;margin:14px 0}.item{display:grid;grid-template-columns:80px 1fr auto;gap:12px;align-items:center}.thumb{width:80px;height:80px;border-radius:12px;object-fit:cover;background:#e8e3d8}.qty{display:flex;align-items:center;gap:6px}.qty button{width:32px;height:32px;border:1px solid var(--l);background:#fff;border-radius:9px;cursor:pointer}.price{font-weight:950}.seller{font-size:12px;color:var(--m)}.empty{text-align:center;padding:50px;color:var(--m)}.total{font-size:22px;font-weight:950}@media(max-width:620px){.item{grid-template-columns:60px 1fr}.thumb{width:60px;height:60px}.item>.price{grid-column:2}.actions{display:flex;flex-direction:column}.actions .btn{width:100%;text-align:center}}</style><script src="/wa-cart.js"></script></head><body><header class="top"><div class="wrap row"><a class="brand" href="/">WASSAFRICA</a><a class="btn" href="/market">← Marché</a></div></header><main class="wrap"><section id="app" class="card">Chargement…</section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient('https://dzifpwqrqnvssfhwjccj.supabase.co','sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV');const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=(v,c)=>new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0}).format(Number(v||0))+' '+(c||'XOF');let data=[];
async function load(){const ids=WA_CART.load().map(x=>x.product_id);if(!ids.length){app.innerHTML='<div class="empty"><h2>Votre panier est vide</h2><p>Découvrez les offres et ajoutez celles qui vous intéressent.</p><a class="btn primary" href="/market">Découvrir le marché</a></div>';return}const r=await db.from('products').select('id,title,price,currency,image_url,business_id,product_type,stock,is_published').in('id',ids).eq('is_published',true);if(r.error)throw r.error;const map=new Map((r.data||[]).map(x=>[x.id,x]));data=WA_CART.load().map(x=>({...x,product:map.get(x.product_id)})).filter(x=>x.product);const bids=[...new Set(data.map(x=>x.product.business_id))];const br=await db.from('businesses').select('id,name,city,country,payment_methods,delivery_enabled,delivery_fee').in('id',bids);const bm=new Map((br.data||[]).map(x=>[x.id,x]));data.forEach(x=>x.business=bm.get(x.product.business_id));render()}
function render(){const groups=new Map();data.forEach(x=>{const id=x.product.business_id;if(!groups.has(id))groups.set(id,[]);groups.get(id).push(x)});let total=0;let html='<h1>🛒 Votre panier</h1><p style="color:#777">Les vendeurs sont séparés automatiquement pour préserver leurs conditions de paiement et de livraison.</p>';for(const [bid,items] of groups){const b=items[0].business||{};let sub=0;html+='<section class="card"><h2>'+esc(b.name||'Vendeur WASSAFRICA')+'</h2><div class="seller">'+esc([b.city,b.country].filter(Boolean).join(' · '))+'</div>';for(const x of items){const p=x.product,q=Math.min(99,x.quantity);const line=Number(p.price||0)*q;sub+=line;const img=p.image_url?'<img class="thumb" src="'+esc(p.image_url)+'" alt="">':'<div class="thumb"></div>';html+='<div class="item"><a href="/product/'+encodeURIComponent(p.id)+'">'+img+'</a><div><strong>'+esc(p.title)+'</strong><div class="seller">'+esc(p.product_type||'offre')+'</div><div class="qty"><button data-act="dec" data-id="'+p.id+'">−</button><b>'+q+'</b><button data-act="inc" data-id="'+p.id+'">+</button><button class="btn" data-act="remove" data-id="'+p.id+'">Retirer</button></div></div><div class="price">'+money(line,p.currency)+'</div></div>'}total+=sub;html+='<div style="display:flex;justify-content:space-between;margin-top:14px"><strong>Sous-total vendeur</strong><strong>'+money(sub,items[0].product.currency)+'</strong></div><div class="actions" style="margin-top:12px"><button class="btn primary" data-checkout="'+bid+'">Commander ce vendeur</button></div></section>'}html+='<section class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><strong>Total panier</strong><span class="total">'+money(total,data[0]?.product.currency)+'</span></div><p class="seller">Le checkout multi-vendeur complet avec paiement groupé sera activé dans le prochain lot; chaque commande vendeur reste indépendante et traçable.</p></section>';app.innerHTML=html}
document.addEventListener('click',async e=>{const el=e.target.closest('[data-act],[data-checkout]');if(!el)return;const id=el.dataset.id;if(el.dataset.act==='remove'){WA_CART.remove(id);await load()}else if(el.dataset.act==='inc'||el.dataset.act==='dec'){const x=WA_CART.load().find(x=>x.product_id===id);WA_CART.setQty(id,(x?.quantity||1)+(el.dataset.act==='inc'?1:-1));await load()}else if(el.dataset.checkout){const bid=el.dataset.checkout;const items=data.filter(x=>x.product.business_id===bid);const b=items[0].business||{};const name=prompt('Votre nom pour la commande :');if(!name)return;const phone=prompt('Votre téléphone :');if(!phone)return;const payment=(b.payment_methods||['cash_on_delivery'])[0];const r=await db.rpc('create_guest_order',{p_business_id:bid,p_smart_link_id:null,p_buyer_name:name.trim(),p_buyer_phone:phone.trim(),p_delivery_city:b.city||null,p_delivery_address:null,p_delivery_method:'pickup',p_payment_method:payment,p_items:items.map(x=>({product_id:x.product_id,quantity:x.quantity})),p_idempotency_key:crypto.randomUUID()+crypto.randomUUID(),p_buyer_user_id:(await db.auth.getUser()).data.user?.id||null});if(r.error){alert('Commande impossible : '+(r.error.message||r.error));return}const o=r.data||{};items.forEach(x=>WA_CART.remove(x.product_id));await load();location.href='/commande/'+encodeURIComponent(o.tracking_token||'')+'?order_id='+encodeURIComponent(o.order_id||'')}});load().catch(e=>app.innerHTML='<div class="empty">Impossible de charger le panier. '+esc(e.message||'Erreur')+'</div>');
</script></body></html>
