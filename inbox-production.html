<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18231d;background:#f5f7f5;--g:#173d2d;--gold:#d79b2d;--line:#dce5df}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f7f9f7,#edf2ef);min-height:100vh}.wrap{max-width:1180px;margin:auto;padding:16px}.shell{display:grid;grid-template-columns:320px 1fr;gap:14px;min-height:calc(100vh - 32px)}.card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 35px #18231d0f}.sidebar{padding:14px;display:flex;flex-direction:column;min-height:0}.brand{font-size:20px;font-weight:900;color:var(--g);margin-bottom:12px}.search{display:flex;gap:8px}.search input,.composer input{width:100%;border:1px solid var(--line);border-radius:15px;padding:12px 13px;font:inherit;outline:none;background:#fbfcfb}.search button,.composer button,.tool{border:1px solid var(--line);border-radius:14px;padding:11px 13px;font-weight:800;cursor:pointer;background:#fff}.search button,.composer button{background:var(--g);color:#fff;border-color:var(--g)}button:disabled{opacity:.5;cursor:default}.list{overflow:auto;min-height:0;flex:1;margin-top:10px}.conv{padding:12px;border-radius:15px;display:flex;gap:10px;align-items:center;cursor:pointer}.conv:hover{background:#eff4f1}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#e7eeea;font-weight:900;flex:none;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.name{font-weight:800}.sub{font-size:12px;color:#748078}.chat{display:flex;flex-direction:column;min-height:0;overflow:hidden}.top{padding:15px 18px;border-bottom:1px solid #e5ebe7;display:flex;align-items:center;gap:12px}.msgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:7px;background:#f7f9f7}.bubble{max-width:min(78%,650px);width:max-content;padding:9px 12px;border-radius:17px;background:#fff;border:1px solid #dfe7e2;white-space:pre-wrap;overflow-wrap:anywhere}.mine{align-self:flex-end;background:#e8f6dc;border-color:#d4e9c8}.meta{font-size:10px;color:#7a867e;text-align:right;margin-top:4px}.composer-wrap{padding:12px;border-top:1px solid #e5ebe7;background:#fff}.tools{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}.notice{font-size:12px;color:#768279;text-align:center;margin-top:7px}.empty{margin:auto;text-align:center;color:#748079;padding:30px}.hidden{display:none!important}.status{font-size:12px;color:#66736b;padding:8px 2px;text-align:center}@media(max-width:820px){.shell{grid-template-columns:1fr}.sidebar{min-height:250px}.chat{min-height:72vh}.bubble{max-width:88%}}
</style></head><body><div class="wrap"><div id="gate" class="card" style="padding:18px;text-align:center">Ouverture de vos messages…</div><main id="app" class="shell hidden"><aside class="card sidebar"><div class="brand">WASSAFRICA · Messages</div><div class="search"><input id="target" autocomplete="off" placeholder="Nom, numéro ou activité…"><button id="searchBtn" type="button" disabled>Rechercher</button></div><div id="list" class="list"></div></aside><section class="card chat"><header class="top"><div id="chatAvatar" class="avatar">W</div><div><div id="title" class="name">Choisissez une conversation</div><div id="subtitle" class="sub"></div></div></header><div id="msgs" class="msgs"><div class="empty">Vos conversations apparaîtront ici.</div></div><div class="composer-wrap"><div class="tools"><button id="camera" class="tool" type="button">📷 Caméra</button><button id="audio" class="tool" type="button">🎙️ Audio</button><button id="media" class="tool" type="button">🖼️ Photo / vidéo</button><button id="file" class="tool" type="button">📎 Fichier</button><input id="mediaInput" class="hidden" type="file" accept="image/*,video/*"><input id="fileInput" class="hidden" type="file"></div><form id="composer" class="composer"><input id="body" maxlength="4000" autocomplete="off" placeholder="Écrire un message…"><button id="send" type="submit" disabled>➤</button></form><div id="status" class="status">Entrée envoie le message · Maj+Entrée crée une nouvelle ligne.</div><div class="notice">Les messages restent dans la conversation jusqu’à suppression.</div></div></section></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(async()=>{'use strict';const $=id=>document.getElementById(id),SB='https://dzifpwqrqnvssfhwjccj.supabase.co',KEY='sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV',AUTH='whatsafrica-auth',DB='wassafrica-production-msg-v1',te=new TextEncoder(),td=new TextDecoder();let session,user,device,current,timer,keyCache=new Map(),conversations=[];
const b64=x=>{let s='';new Uint8Array(x).forEach(b=>s+=String.fromCharCode(b));return btoa(s)},ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(path,opt={}){const h=new Headers(opt.headers||{});h.set('apikey',KEY);if(session?.access_token)h.set('Authorization','Bearer '+session.access_token);if(opt.body&&!h.has('Content-Type'))h.set('Content-Type','application/json');const r=await fetch(SB+path,{...opt,headers:h});let d=null;try{d=await r.json()}catch{}if(!r.ok){throw new Error(d?.message||d?.hint||d?.details||d?.code||('HTTP '+r.status))}return d}const rest=(t,q='',o={})=>api('/rest/v1/'+t+(q?'?'+q:''),o),rpc=(f,b)=>api('/rest/v1/rpc/'+f,{method:'POST',body:JSON.stringify(b)});
function readSession(){for(let i=0;i<localStorage.length;i++){try{const x=JSON.parse(localStorage.getItem(localStorage.key(i))||'null'),s=x?.access_token?x:x?.session;if(s?.access_token&&s.user?.id)return s}catch{}}return null}
function vault(){return new Promise((ok,no)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function vg(k){const d=await vault();return new Promise((ok,no)=>{const r=d.transaction('k').objectStore('k').get(k);r.onsuccess=()=>{d.close();ok(r.result||null)};r.onerror=()=>no(r.error)})}async function vp(k,v){const d=await vault();return new Promise((ok,no)=>{const tx=d.transaction('k','readwrite');tx.objectStore('k').put(v,k);tx.oncomplete=()=>{d.close();ok()};tx.onerror=()=>no(tx.error)})}
async function ensureDevice(){if(device)return device;let s=await vg('id:'+user.id);if(!s){const g=await crypto.subtle.generateKey({name:'RSA-OAEP',modulusLength:2048,publicExponent:new Uint8Array([1,0,1]),hash:'SHA-256'},true,['encrypt','decrypt']);s={publicJwk:await crypto.subtle.exportKey('jwk',g.publicKey),privateJwk:await crypto.subtle.exportKey('jwk',g.privateKey)};await vp('id:'+user.id,s)}const pk=await crypto.subtle.importKey('jwk',s.privateJwk,{name:'RSA-OAEP',hash:'SHA-256'},true,['decrypt']),r=await rpc('ensure_web_device',{p_identity_public_key:s.publicJwk}),d=Array.isArray(r)?r[0]:r;if(!d?.id)throw Error('DEVICE_NOT_AVAILABLE');device={id:d.id,identity_public_key:d.identity_public_key||s.publicJwk,privateKey:pk}}
async function wrap(j,k){const p=await crypto.subtle.importKey('jwk',j,{name:'RSA-OAEP',hash:'SHA-256'},true,['encrypt']);return new Uint8Array(await crypto.subtle.encrypt({name:'RSA-OAEP'},p,k))}
async function distribute(c,k,v){const mem=await rest('conversation_members','select=user_id&conversation_id=eq.'+encodeURIComponent(c));for(const m of mem||[]){const ds=await rest('user_devices','select=id,identity_public_key&user_id=eq.'+encodeURIComponent(m.user_id)+'&device_label=eq.Web&revoked_at=is.null&order=last_seen_at.desc&limit=20');for(const d of ds||[])if(d.identity_public_key){try{await rest('conversation_key_envelopes','',{method:'POST',body:JSON.stringify({conversation_id:c,device_id:d.id,key_version:v,algorithm:'RSA-OAEP-2048-SHA256+AES-256-GCM',wrapped_key:b64(await wrap(d.identity_public_key,k))})})}catch(e){if(!String(e.message||e).toLowerCase().includes('duplicate'))throw e}}}}
async function latestKey(c){if(keyCache.has(c))return keyCache.get(c);const q='select=wrapped_key,key_version&conversation_id=eq.'+encodeURIComponent(c)+'&device_id=eq.'+encodeURIComponent(device.id)+'&revoked_at=is.null&order=key_version.desc&limit=1';const r=await rest('conversation_key_envelopes',q);if(r?.[0]){const x=r[0],raw=new Uint8Array(await crypto.subtle.decrypt({name:'RSA-OAEP'},device.privateKey,ub64(x.wrapped_key))),out={key:raw,version:Number(x.key_version)};keyCache.set(c,out);return out}return null}
async function ensureKey(c){const found=await latestKey(c);if(found)return found;const version=Number(await rpc('start_conversation_key_epoch',{p_conversation_id:c,p_device_id:device.id}));if(!Number.isInteger(version)||version<1)throw Error('KEY_EPOCH_INVALID');const raw=crypto.getRandomValues(new Uint8Array(32));await distribute(c,raw,version);const out={key:raw,version};keyCache.set(c,out);return out}
async function encrypt(c,id,text,k,v){const iv=crypto.getRandomValues(new Uint8Array(12)),ck=await crypto.subtle.importKey('raw',k,{name:'AES-GCM'},false,['encrypt']),aad=te.encode('whatsafrica:v2:'+c+':'+id),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:aad},ck,te.encode(text));return{ciphertext:b64(ct),iv:b64(iv),version:v}}
async function decrypt(c,r){const m=r.encryption_metadata||{},v=Number(m.key_version),q='select=wrapped_key,key_version&conversation_id=eq.'+encodeURIComponent(c)+'&device_id=eq.'+encodeURIComponent(device.id)+'&key_version=eq.'+encodeURIComponent(v)+'&revoked_at=is.null&limit=1',x=(await rest('conversation_key_envelopes',q))?.[0];if(!x)throw Error('KEY_UNAVAILABLE');const raw=new Uint8Array(await crypto.subtle.decrypt({name:'RSA-OAEP'},device.privateKey,ub64(x.wrapped_key))),ck=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt']),aad=te.encode('whatsafrica:v2:'+c+':'+(m.message_id||r.id));return td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(m.iv),additionalData:aad},ck,ub64(r.ciphertext)))}
async function loadList(){const mem=await rest('conversation_members','select=conversation_id&user_id=eq.'+encodeURIComponent(user.id));const ids=new Set((mem||[]).map(x=>x.conversation_id));const rows=await rest('conversations','select=id,title,created_at&order=created_at.desc&limit=100');conversations=(rows||[]).filter(x=>ids.has(x.id));const box=$('list');box.innerHTML='';for(const c of conversations){const d=document.createElement('div');d.className='conv';const av=document.createElement('div');av.className='avatar';av.textContent=(c.title||'W').trim().charAt(0).toUpperCase();const main=document.createElement('div');const n=document.createElement('div');n.className='name';n.textContent=(c.title||'Conversation').replace(/^Conversation directe$/,'Discussion');const s=document.createElement('div');s.className='sub';s.textContent='Conversation privée';main.append(n,s);d.append(av,main);d.onclick=()=>openConv(c);box.append(d)}if(!box.children.length)box.innerHTML='<div class="empty">Aucune conversation.</div>'}
async function search(){const q=$('target').value.trim();if(!q)return;$('status').textContent='Recherche…';try{const rows=(await rpc('search_public_profiles',{p_query:q})||[]).filter(x=>x.user_id!==user.id);const box=$('list');box.innerHTML='';for(const p of rows.slice(0,12)){const d=document.createElement('div');d.className='conv';const av=document.createElement('div');av.className='avatar';if(p.avatar_url){const im=document.createElement('img');im.src=p.avatar_url;av.append(im)}else av.textContent=(p.display_name||'W').trim().charAt(0).toUpperCase();const main=document.createElement('div');const n=document.createElement('div');n.className='name';n.textContent=p.display_name||p.public_display_name||'Profil WASSAFRICA';const s=document.createElement('div');s.className='sub';s.textContent=p.country||'';main.append(n,s);d.append(av,main);d.onclick=async()=>{try{const r=await rpc('start_direct_conversation_by_user_id',{p_user_id:p.user_id}),x=Array.isArray(r)?r[0]:r;if(!x?.conversation_id)throw Error('CONTACT_NOT_FOUND');await loadList();const c=conversations.find(v=>v.id===x.conversation_id)||{id:x.conversation_id,title:x.contact_name||p.display_name};await openConv(c)}catch(e){setStatus('Impossible d’ouvrir la conversation : '+e.message,true)}};box.append(d)}if(!box.children.length)box.innerHTML='<div class="empty">Aucun membre trouvé.</div>';setStatus(rows.length?'Sélectionnez le membre à contacter.':'Aucun résultat.')}catch(e){setStatus('Recherche impossible : '+e.message,true)}}
async function openConv(c){current=c;keyCache.clear();$('title').textContent=(c.title||'Conversation').replace(/^Conversation directe$/,'Discussion');$('chatAvatar').textContent=(c.title||'W').trim().charAt(0).toUpperCase();await render();clearInterval(timer);timer=setInterval(()=>render().catch(()=>{}),3500);update()}
async function render(){if(!current)return;const rows=await rest('messages_v2','select=id,sender_id,created_at,ciphertext,encryption_metadata,message_type&conversation_id=eq.'+encodeURIComponent(current.id)+'&order=created_at.asc&limit=300');const box=$('msgs');box.innerHTML='';for(const r of rows||[]){const b=document.createElement('div');b.className='bubble '+(r.sender_id===user.id?'mine':'');if(r.message_type==='text'){try{b.append(document.createTextNode(await decrypt(current.id,r)))}catch{b.append(document.createTextNode('Message chiffré — clé indisponible'))}}else b.append(document.createTextNode('Fichier partagé'));const m=document.createElement('div');m.className='meta';m.textContent=new Date(r.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});b.append(m);box.append(b)}box.scrollTop=box.scrollHeight}
function update(){$('send').disabled=!(current&&$('body').value.trim());$('searchBtn').disabled=!$('target').value.trim()}
function setStatus(t,err=false){$('status').textContent=t}
async function send(e){e.preventDefault();const text=$('body').value.trim();if(!current||!text)return;$('send').disabled=true;setStatus('Envoi…');try{const k=await ensureKey(current.id),id=crypto.randomUUID(),x=await encrypt(current.id,id,text,k.key,k.version),meta={v:2,alg:'AES-256-GCM',iv:x.iv,conversation_id:current.id,message_id:id,key_version:x.version};await rest('messages_v2','',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({id,conversation_id:current.id,sender_id:user.id,body:null,message_type:'text',encryption_version:1,ciphertext:x.ciphertext,encryption_metadata:meta})});$('body').value='';setStatus('Envoyé');await render();await loadList()}catch(e){setStatus('Échec de l’envoi : '+e.message);alert('Échec de l’envoi : '+e.message)}finally{update();$('body').focus()}}
$('searchBtn').onclick=search;$('target').oninput=update;$('target').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();search()}};$('body').oninput=update;$('body').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('composer').requestSubmit()}};$('composer').onsubmit=send;$('media').onclick=()=>current&&$('mediaInput').click();$('file').onclick=()=>current&&$('fileInput').click();$('camera').onclick=async()=>{if(!current)return alert('Choisissez une conversation.');try{const s=await navigator.mediaDevices.getUserMedia({video:true,audio:true});s.getTracks().forEach(t=>t.stop());setStatus('Caméra et micro autorisés.')}catch(e){alert('Autorisation caméra/micro refusée ou indisponible.')}};$('audio').onclick=async()=>{if(!current)return alert('Choisissez une conversation.');try{const s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(t=>t.stop());setStatus('Microphone autorisé.')}catch(e){alert('Autorisation microphone refusée ou indisponible.')}};
try{session=readSession();if(!session)throw Error('AUTH_REQUIRED');user=session.user;await ensureDevice();$('app').classList.remove('hidden');$('gate').classList.add('hidden');await loadList();const q=new URLSearchParams(location.search).get('recipient');if(q){const r=await rpc('start_direct_conversation_by_user_id',{p_user_id:q}),x=Array.isArray(r)?r[0]:r;if(x?.conversation_id)await openConv({id:x.conversation_id,title:x.contact_name||'Conversation'})}}catch(e){$('gate').innerHTML='<b>Connexion requise.</b><p>Connectez-vous puis revenez à la messagerie.</p><a href="/auth?next=/inbox">Se connecter</a>'}})();
