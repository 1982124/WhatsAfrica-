<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#120f1f"><title>WhatsAfrica — Smart Link</title><meta name="description" content="Vitrine, produits et assistant commercial WhatsAfrica."><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#120f1f;--panel:#1c1832;--gold:#e8a83c;--teal:#17a889;--cream:#f6f1e4;--muted:#aaa39a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--cream);font:15px system-ui}.wrap{max-width:720px;margin:auto;padding:0 16px}.nav{border-bottom:1px solid #ffffff14}.navrow{height:60px;display:flex;align-items:center;justify-content:space-between}.brand{font:bold 20px Georgia}.brand b{color:var(--gold)}.btn{border:0;border-radius:999px;padding:11px 16px;font-weight:800;text-decoration:none;display:inline-flex;justify-content:center;cursor:pointer}.primary{background:var(--gold);color:var(--bg)}.secondary{background:transparent;color:var(--cream);border:1px solid #ffffff22}.hero{text-align:center;padding:38px 0 20px}.avatar{width:86px;height:86px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);display:block;margin:auto auto 14px;background:var(--gold)}.eyebrow{font:10px monospace;letter-spacing:2px;color:var(--teal)}h1,h2{font-family:Georgia,serif}.bio{color:#f6f1e4bb;line-height:1.6}.card,.assistant{background:var(--panel);border:1px solid #ffffff10;border-radius:18px;padding:14px;margin:10px 0}.product-img{width:100%;max-height:300px;object-fit:cover;border-radius:12px}.prodrow{display:flex;justify-content:space-between;gap:10px;margin-top:10px}.price{color:var(--gold);font-weight:900;white-space:nowrap}.desc{color:#f6f1e499;line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions .btn{flex:1;min-width:140px}.chat{height:280px;overflow:auto;background:#0d0b15;border-radius:14px;padding:9px;display:flex;flex-direction:column;gap:8px}.bubble{max-width:88%;padding:9px 12px;border-radius:15px;white-space:pre-wrap}.bot{background:#ffffff0b}.user{align-self:flex-end;background:var(--teal);color:#04231c}.composer{display:flex;gap:8px;margin-top:9px}.composer input{flex:1;min-width:0;padding:11px;border-radius:999px;border:1px solid #ffffff18;background:#111827;color:white}.footer{text-align:center;color:#ffffff55;padding:28px 0}.error{text-align:center;padding:60px 0}@media(max-width:520px){.prodrow{flex-direction:column}.actions .btn{width:100%}}</style></head><body><header class="nav"><div class="wrap navrow"><a class="brand" href="/">Whats<b>Africa</b></a><a class="btn secondary" href="/">Ouvrir WhatsAfrica</a></div></header><main class="wrap" id="page"><div class="error">Chargement…</div></main><footer class="wrap footer">WhatsAfrica — votre vitrine, votre assistant commercial, votre lien.</footer><script>const URL='https://dzifpwqrqnvssfhwjccj.supabase.co',KEY='sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV',db=supabase.createClient(URL,KEY),slug=decodeURIComponent(location.pathname.replace(/^\/+/, '').split('/')[0]||'');let link,business,products=[];const esc=v=>String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));const ok=v=>{try{let u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:null}catch{return null}};async function load(){if(!slug)return fail('Smart Link introuvable','Le lien est incomplet.');let r=await db.from('smart_links').select('id,business_id,owner_id,slug,title,description,is_public').eq('slug',slug).eq('is_public',true).maybeSingle();if(r.error||!r.data)return fail('Smart Link introuvable','Cette vitrine n’existe pas ou n’est pas publique.');link=r.data;let b=link.business_id?await db.from('businesses').select('id,name,description,country,city,logo_url,template,accent_color').eq('id',link.business_id).maybeSingle():null;business=b?.data||{name:link.title,description:link.description};let p=link.business_id?await db.from('products').select('id,title,description,price,currency,image_url,category,stock,is_published').eq('business_id',link.business_id).eq('is_published',true).order('created_at',{ascending:false}).limit(60):null;products=p?.data||[];document.documentElement.style.setProperty('--gold',business.accent_color||'#e8a83c');render()}function fail(a,b){document.querySelector('#page').innerHTML='<section class="error"><div class="eyebrow">WHATS AFRICA</div><h1>'+esc(a)+'</h1><p class="bio">'+esc(b)+'</p><a class="btn primary" href="/">Ouvrir WhatsAfrica</a></section>'}function render(){let name=business.name||link.title||'Entreprise WhatsAfrica',avatar=business.logo_url?'<img class="avatar" src="'+esc(business.logo_url)+'" alt="'+esc(name)+'">':'<div class="avatar" style="display:flex;align-items:center;justify-content:center;font:bold 25px Georgia;color:#120f1f">'+esc(name.slice(0,2).toUpperCase())+'</div>';let html=products.length?products.map(p=>{let share='https://wa.me/?text='+encodeURIComponent('Bonjour, je viens de votre Smart Link WhatsAfrica et souhaite des informations sur '+p.title);return '<article class="card">'+(p.image_url?'<img class="product-img" src="'+esc(p.image_url)+'" alt="'+esc(p.title)+'" loading="lazy">':'')+'<div class="prodrow"><div><strong>'+esc(p.title)+'</strong><div class="desc">'+esc(p.description||'')+'</div></div><div class="price">'+esc(p.price??'')+' '+esc(p.currency||'FCFA')+'</div></div><div class="actions"><a class="btn primary" href="'+share+'" target="_blank" rel="noopener">Contacter</a></div></article>'}).join(''):'<div class="card"><div class="desc">Aucun produit publié pour le moment.</div></div>';document.title=name+' — WhatsAfrica';document.querySelector('#page').innerHTML='<section class="hero">'+avatar+'<div class="eyebrow">SMART LINK</div><h1>'+esc(name)+'</h1><p class="bio">'+esc(business.description||link.description||'Découvrez cette activité sur WhatsAfrica.')+'</p></section><section><h2>Produits & services</h2>'+html+'</section><section class="assistant" id="assistant"><div class="eyebrow">VOTRE ASSISTANT COMMERCIAL</div><h2>Une question ?</h2><p class="desc">Je réponds à partir des informations publiques de cette activité.</p><div id="chat" class="chat"><div class="bubble bot">Bonjour 👋 Que souhaitez-vous savoir ?</div></div><div class="composer"><input id="q" maxlength="2000" placeholder="Ex. Quel est le prix ?"><button class="btn primary" id="send">Envoyer</button></div></section><div class="footer"><a href="/">Découvrir WhatsAfrica</a></div>';const q=document.getElementById('q');async function send(){let t=q.value.trim();if(!t)return;append('user',t);q.value='';let x=append('bot','…');try{let r=await fetch('/api/assistant',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:t,history:[],business:{display_name:name,country:business.country,bio:business.description,smartlink_slug:slug,articles:products}})}),d=await r.json();x.remove();append('bot',d.answer||d.error||'Service momentanément indisponible.')}catch{ x.remove();append('bot','Connexion momentanément indisponible.')}}document.getElementById('send').onclick=send;q.onkeydown=e=>{if(e.key==='Enter')send()}}function append(r,t){let d=document.createElement('div');d.className='bubble '+r;d.textContent=t;document.getElementById('chat').appendChild(d);let c=document.getElementById('chat');c.scrollTop=c.scrollHeight;return d}load().catch(()=>fail('Erreur temporaire','Réessayez dans quelques instants.'));</script></body></html>
