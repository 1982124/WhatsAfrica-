<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#120f1f"><meta name="description" content="Vitrine, produits et assistant commercial WhatsAfrica."><title>WhatsAfrica — Smart Link</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#120f1f;--panel:#1c1832;--gold:#e8a83c;--teal:#17a889;--cream:#f6f1e4;--muted:#aaa39a;--line:#ffffff12}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#2b2449,#120f1f 45%);color:var(--cream);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{max-width:760px;margin:auto;padding:0 16px}.nav{border-bottom:1px solid var(--line);background:#120f1fee;backdrop-filter:blur(12px);position:sticky;top:0;z-index:10}.navrow{min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font:bold 20px Georgia;color:var(--cream);text-decoration:none}.brand b{color:var(--gold)}.btn{border:0;border-radius:999px;padding:11px 16px;font-weight:850;text-decoration:none;display:inline-flex;justify-content:center;align-items:center;cursor:pointer}.primary{background:var(--gold);color:var(--bg)}.secondary{background:transparent;color:var(--cream);border:1px solid var(--line)}.hero{text-align:center;padding:40px 0 22px}.avatar{width:92px;height:92px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);display:block;margin:auto auto 14px;background:var(--gold)}.eyebrow{font:10px monospace;letter-spacing:2px;color:var(--teal);text-transform:uppercase}.hero h1,h2{font-family:Georgia,serif}.hero h1{font-size:34px;margin:9px 0}.bio{color:#f6f1e4bb;line-height:1.65}.meta{color:var(--muted);font-size:13px}.card,.assistant{background:linear-gradient(145deg,#211c39,#19152b);border:1px solid var(--line);border-radius:18px;padding:15px;margin:11px 0}.product-img{width:100%;max-height:310px;object-fit:cover;border-radius:12px}.prodrow{display:flex;justify-content:space-between;gap:12px;margin-top:11px}.price{color:var(--gold);font-weight:900;white-space:nowrap}.desc{color:#f6f1e499;line-height:1.55}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions .btn{flex:1;min-width:145px}.status{border-left:3px solid var(--teal);padding:12px 13px;background:#ffffff06}.status img{width:100%;max-height:320px;object-fit:cover;border-radius:12px;margin-top:8px}.chat{height:280px;overflow:auto;background:#0d0b15;border-radius:14px;padding:9px;display:flex;flex-direction:column;gap:8px}.bubble{max-width:88%;padding:9px 12px;border-radius:15px;white-space:pre-wrap}.bot{background:#ffffff0b}.user{align-self:flex-end;background:var(--teal);color:#04231c}.composer{display:flex;gap:8px;margin-top:9px}.composer input{flex:1;min-width:0;padding:11px;border-radius:999px;border:1px solid var(--line);background:#111827;color:white}.cta{margin:18px 0;padding:20px;text-align:center;background:linear-gradient(145deg,#25304a,#17152a);border:1px solid var(--line);border-radius:20px}.footer{text-align:center;color:#ffffff55;padding:28px 0 42px;font-size:12px}.error{text-align:center;padding:60px 0}@media(max-width:520px){.prodrow{flex-direction:column}.actions .btn{width:100%}.navrow{flex-wrap:wrap;padding:9px 0}}
</style></head><body><header class="nav"><div class="wrap navrow"><a class="brand" href="/">Whats<b>Africa</b></a><a class="btn secondary" href="/">Découvrir WhatsAfrica</a></div></header><main class="wrap" id="page"><div class="error">Chargement…</div></main><footer class="wrap footer">WhatsAfrica — votre vitrine, votre assistant commercial, votre lien.</footer><script>const URL='https://dzifpwqrqnvssfhwjccj.supabase.co',KEY='sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV',db=supabase.createClient(URL,KEY),slug=decodeURIComponent(location.pathname.replace(/^\/+/, '').split('/')[0]||'');let link,business,products=[],statuses=[];const esc=v=>String(v??'').replace(/[&<>\'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));const shareText=t=>encodeURIComponent('Bonjour, je viens de votre Smart Link WhatsAfrica et souhaite des informations sur '+t);function waShare(t){return 'https://wa.me/?text='+shareText(t)}function safeImage(v){try{const u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:null}catch{return null}}async function load(){if(!slug)return fail('Smart Link introuvable','Le lien est incomplet.');let r=await db.from('smart_links').select('id,business_id,owner_id,slug,title,description,is_public').eq('slug',slug).eq('is_public',true).maybeSingle();if(r.error||!r.data)return fail('Smart Link introuvable','Cette vitrine n’existe pas ou n’est pas publique.');link=r.data;let b=link.business_id?await db.from('businesses').select('id,name,description,country,city,logo_url,template,accent_color').eq('id',link.business_id).maybeSingle():null;business=b?.data||{name:link.title,description:link.description};if(link.business_id){const p=await db.from('products').select('id,title,description,price,currency,image_url,category,stock,is_published').eq('business_id',link.business_id).eq('is_published',true).order('created_at',{ascending:false}).limit(60);products=p.data||[]}const s=await db.from('statuses').select('id,text_content,image_url,caption,media_type,created_at,expires_at').eq('owner_id',link.owner_id).gt('expires_at',new Date().toISOString()).order('created_at',{ascending:false}).limit(6);statuses=s.data||[];document.documentElement.style.setProperty('--gold',business.accent_color||'#e8a83c');render()}function fail(a,b){document.querySelector('#page').innerHTML='<section class="error"><div class="eyebrow">WHATS AFRICA</div><h1>'+esc(a)+'</h1><p class="bio">'+esc(b)+'</p><a class="btn primary" href="/">Ouvrir WhatsAfrica</a></section>'}function render(){const name=business.name||link.title||'Entreprise WhatsAfrica',logo=safeImage(business.logo_url),avatar=logo?'<img class="avatar" src="'+esc(logo)+'" alt="'+esc(name)+'">':'<div class="avatar" style="display:flex;align-items:center;justify-content:center;font:bold 25px Georgia;color:#120f1f">'+esc(name.slice(0,2).toUpperCase())+'</div>';const productsHtml=products.length?products.map(p=>{const image=safeImage(p.image_url);const price=p.price!==null&&p.price!==''?esc(p.price)+' '+esc(p.currency||'FCFA'):'Prix sur demande';const stock=p.stock===0?'Rupture de stock':p.stock>0?'Disponible':'';return '<article class="card">'+(image?'<img class="product-img" src="'+esc(image)+'" alt="'+esc(p.title)+'" loading="lazy">':'')+'<div class="prodrow"><div><strong>'+esc(p.title)+'</strong><div class="desc">'+esc(p.description||'')+'</div>'+(stock?'<div class="meta">'+esc(stock)+'</div>':'')+'</div><div class="price">'+price+'</div></div><div class="actions"><a class="btn primary" href="'+waShare(p.title)+'" target="_blank" rel="noopener">💬 Demander sur WhatsApp</a><button class="btn secondary" data-share="'+esc(p.title)+'">Partager</button></div></article>'}).join(''):'<div class="card"><div class="desc">Aucun produit publié pour le moment.</div></div>';const statusesHtml=statuses.length?'<section><h2>Actualités</h2>'+statuses.map(s=>{const image=safeImage(s.image_url);return '<article class="card status">'+(s.caption||s.text_content?'<div>'+esc(s.caption||s.text_content)+'</div>':'')+(image?'<img src="'+esc(image)+'" alt="" loading="lazy">':'')+'</article>'}).join('')+'</section>':'';document.title=name+' — WhatsAfrica';document.querySelector('#page').innerHTML='<section class="hero">'+avatar+'<div class="eyebrow">SMART LINK</div><h1>'+esc(name)+'</h1><p class="bio">'+esc(business.description||link.description||'Découvrez cette activité sur WhatsAfrica.')+'</p>'+(business.city||business.country?'<div class="meta">'+esc([business.city,business.country].filter(Boolean).join(' · '))+'</div>':'')+'<div class="actions" style="max-width:500px;margin:16px auto 0"><button class="btn primary" id="sharePage">🔗 Partager cette vitrine</button><a class="btn secondary" href="/">Créer ma propre vitrine</a></div></section><section><h2>Produits & services</h2>'+productsHtml+'</section>'+statusesHtml+'<section class="assistant" id="assistant"><div class="eyebrow">VOTRE ASSISTANT COMMERCIAL</div><h2>Une question ?</h2><p class="desc">Je réponds à partir des informations publiques de cette activité.</p><div id="chat" class="chat"><div class="bubble bot">Bonjour 👋 Que souhaitez-vous savoir ?</div></div><div class="composer"><input id="q" maxlength="2000" placeholder="Ex. Quel est le prix ?"><button class="btn primary" id="send">Envoyer</button></div></section><section class="cta"><strong>Vous aussi, présentez votre activité sur WhatsAfrica.</strong><p class="desc">Créez gratuitement votre Smart Link et partagez-le sur WhatsApp.</p><a class="btn primary" href="/dashboard">Créer mon Smart Link</a></section>';document.querySelectorAll('[data-share]').forEach(b=>b.onclick=()=>navigator.share?navigator.share({title:b.dataset.share,text:'Découvrez '+b.dataset.share+' sur WhatsAfrica',url:location.href}).catch(()=>{}):navigator.clipboard?.writeText(location.href));document.getElementById('sharePage').onclick=()=>navigator.share?navigator.share({title:name,text:'Découvrez '+name+' sur WhatsAfrica',url:location.href}).catch(()=>{}):navigator.clipboard?.writeText(location.href);const q=document.getElementById('q');async function send(){const t=q.value.trim();if(!t)return;append('user',t);q.value='';const x=append('bot','…');try{const r=await fetch('/api/assistant',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:t,history:[],business:{display_name:name,country:business.country,bio:business.description,smartlink_slug:slug,articles:products}})}),d=await r.json();x.remove();append('bot',d.answer||d.error||'Service momentanément indisponible.')}catch{x.remove();append('bot','Connexion momentanément indisponible.')}}document.getElementById('send').onclick=send;q.onkeydown=e=>{if(e.key==='Enter')send()}}function append(r,t){const d=document.createElement('div');d.className='bubble '+r;d.textContent=t;document.getElementById('chat').appendChild(d);const c=document.getElementById('chat');c.scrollTop=c.scrollHeight;return d}load().catch(()=>fail('Erreur temporaire','Réessayez dans quelques instants.'));</script></body></html>
