<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120F1F">
<title>WhatsAfrica — SmartLink</title>
<meta name="description" content="SmartLink WhatsAfrica — vitrine, produits, paiement et assistant commercial.">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#120f1f;--panel:#1c1832;--panel2:#241e3f;--gold:#e8a83c;--teal:#17a889;--cream:#f6f1e4;--muted:#aaa39a;--danger:#c1502e}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--cream);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}a{color:inherit}button,input{font:inherit}.wrap{max-width:720px;margin:auto;padding:0 18px}
.nav{position:sticky;top:0;z-index:10;background:#120f1fee;border-bottom:1px solid #ffffff12;backdrop-filter:blur(12px)}.navrow{min-height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font:700 19px Georgia,serif}.brand b{color:var(--gold)}
.btn{border:0;border-radius:999px;padding:11px 16px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer}.primary{background:var(--gold);color:var(--bg)}.secondary{background:transparent;color:var(--cream);border:1px solid #ffffff22}
.hero{padding:38px 0 22px;text-align:center}.avatar{width:86px;height:86px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);background:var(--panel2);display:block;margin:0 auto 14px}.initials{display:flex;align-items:center;justify-content:center;font:700 26px Georgia,serif;color:var(--bg);background:var(--gold)}
.eyebrow{font:10px monospace;letter-spacing:2px;text-transform:uppercase;color:var(--teal)}h1{font:600 32px/1.1 Georgia,serif;margin:8px 0}.bio{color:#f6f1e4bb;line-height:1.6;font-size:15px;margin:8px auto;max-width:600px}.country{font-size:12px;color:var(--muted)}
.section{padding:18px 0}.section h2{font:600 22px Georgia,serif;margin:0 0 12px}.card{background:var(--panel);border:1px solid #ffffff10;border-radius:18px;padding:14px;margin:10px 0}.product-img{width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin-bottom:10px}.prodrow{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.title{font-weight:800}.desc{font-size:12px;color:#f6f1e499;line-height:1.5;margin-top:4px}.price{color:var(--gold);font-weight:800;white-space:nowrap}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions .btn{flex:1;min-width:140px}
.assistant{background:linear-gradient(145deg,#19162c,#0f0d19);border:1px solid #ffffff12;border-radius:20px;padding:15px}.chat{height:300px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:8px;background:#0d0b15;border-radius:14px}.bubble{max-width:88%;padding:9px 12px;border-radius:15px;white-space:pre-wrap;line-height:1.45;font-size:13px}.bot{align-self:flex-start;background:#ffffff0b}.user{align-self:flex-end;background:var(--teal);color:#04231c}.composer{display:flex;gap:8px;margin-top:9px}.composer input{min-width:0;flex:1;background:var(--panel);color:var(--cream);border:1px solid #ffffff18;border-radius:999px;padding:11px 13px}.composer button{flex:0 0 auto}.note{font-size:10px;color:#f6f1e466;line-height:1.4;margin-top:8px}.error{padding:25px 0;text-align:center}.error h1{font-size:25px}.footer{text-align:center;color:#f6f1e44d;font-size:10px;padding:28px 0 36px}
@media(max-width:520px){.wrap{padding:0 14px}.navrow{min-height:56px}.nav .btn{padding:9px 12px;font-size:12px}.hero{padding-top:28px}h1{font-size:28px}.avatar{width:78px;height:78px}.actions .btn{width:100%}.card{padding:12px}.prodrow{flex-direction:column}.price{font-size:14px}.chat{height:42vh}.composer input{font-size:16px}}
</style>
</head>
<body>
<header class="nav"><div class="wrap navrow"><a class="brand" href="/">Whats<b>Africa</b></a><a class="btn secondary" href="/">Ouvrir l'app</a></div></header>
<main class="wrap" id="page"><div class="error"><p>Chargement…</p></div></main>
<footer class="wrap footer">WhatsAfrica — votre vitrine, votre assistant commercial, votre lien.</footer>
<script>
const SUPABASE_URL='https://dzifpwqrqnvssfhwjccj.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const slug=decodeURIComponent(location.pathname.replace(/^\/+/, '').split('/')[0]||'');let profile=null,products=[];
const esc=v=>String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));
const fmt=v=>String(v??'').trim();
function linkOk(v){try{const u=new URL(v);return ['http:','https:'].includes(u.protocol)?u.href:null}catch{return null}}
function publicPrice(a){return fmt(a.price)?`${esc(a.price)} ${esc(a.currency||'FCFA')}`:''}
async function load(){if(!slug)return fail('SmartLink introuvable','Le lien public demandé est incomplet.');const p=await db.from('profiles').select('display_name,country,smartlink_slug,bio,payment_link,template,accent_color,profile_image_url').eq('smartlink_slug',slug).maybeSingle();if(p.error||!p.data)return fail('SmartLink introuvable','Cette vitrine n’existe pas ou n’est plus disponible.');profile=p.data;const a=await db.from('articles').select('id,title,description,price,currency,payment_link,image_url,product_type,teaser,created_at').eq('owner_slug',slug).order('created_at',{ascending:false}).limit(60);products=a.data||[];document.documentElement.style.setProperty('--gold',profile.accent_color||'#e8a83c');render()}
function fail(title,text){document.title='WhatsAfrica — SmartLink';document.querySelector('#page').innerHTML=`<section class="error"><div class="eyebrow">WHATS AFRICA</div><h1>${esc(title)}</h1><p class="bio">${esc(text)}</p><a class="btn primary" href="/">Ouvrir WhatsAfrica</a></section>`}
function render(){const initials=esc((profile.display_name||'WA').split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase());const avatar=profile.profile_image_url?`<img class="avatar" src="${esc(profile.profile_image_url)}" alt="${esc(profile.display_name)}" loading="eager">`:`<div class="avatar initials">${initials}</div>`;const productsHtml=products.length?products.map(a=>{const pay=linkOk(a.payment_link||profile.payment_link);const share=`https://wa.me/?text=${encodeURIComponent('Bonjour, je viens de votre SmartLink WhatsAfrica et je souhaite des informations sur '+a.title)}`;return `<article class="card">${a.image_url?`<img class="product-img" src="${esc(a.image_url)}" alt="${esc(a.title)}" loading="lazy">`:''}<div class="prodrow"><div><div class="title">${esc(a.title)}</div><div class="desc">${esc(a.description||a.teaser||'')}</div></div><div class="price">${publicPrice(a)}</div></div><div class="actions">${pay?`<a class="btn primary" href="${esc(pay)}" target="_blank" rel="noopener noreferrer">Acheter / Payer</a>`:''}<a class="btn secondary" href="${share}" target="_blank" rel="noopener noreferrer">Contacter</a></div></article>`}).join(''):`<div class="card"><div class="desc">Aucun produit ou service publié pour le moment.</div></div>`;const generalPay=linkOk(profile.payment_link);document.title=`${profile.display_name} — WhatsAfrica`;document.querySelector('#page').innerHTML=`<section class="hero">${avatar}<div class="eyebrow">SMARTLINK</div><h1>${esc(profile.display_name)}</h1><div class="country">${esc(profile.country||'Afrique')}</div><p class="bio">${esc(profile.bio||'Présentez votre activité et découvrez nos offres.')}</p><div class="actions" style="max-width:520px;margin:16px auto 0">${generalPay?`<a class="btn primary" href="${esc(generalPay)}" target="_blank" rel="noopener noreferrer">Payer / commander</a>`:''}<button class="btn secondary" onclick="document.getElementById('assistant').scrollIntoView({behavior:'smooth'})">Votre assistant commercial</button></div></section><section class="section"><h2>Produits & services</h2>${productsHtml}</section><section class="section" id="assistant"><div class="assistant"><div class="eyebrow">VOTRE ASSISTANT COMMERCIAL</div><h2 style="margin-top:7px">Une question ?</h2><p class="desc">Je réponds uniquement à partir des informations publiques de cette activité.</p><div id="chat" class="chat"><div class="bubble bot">Bonjour 👋 Je suis votre assistant commercial. Que souhaitez-vous savoir ?</div></div><div class="composer"><input id="q" maxlength="2000" placeholder="Ex. Combien coûtent les chaussures homme ?" autocomplete="off"><button class="btn primary" id="send">Envoyer</button></div><div class="note">Aucun compte n’est nécessaire pour visiter cette vitrine. Le paiement est effectué via le lien du vendeur.</div></div></section>`;const q=document.getElementById('q');const send=async()=>{const text=q.value.trim();if(!text)return;append('user',text);q.value='';const typing=append('bot','…');try{const r=await fetch('/api/assistant',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,history:[],business:{display_name:profile.display_name,country:profile.country,bio:profile.bio,smartlink_slug:profile.smartlink_slug,articles:products}})});const d=await r.json().catch(()=>({}));typing.remove();append('bot',d.answer||d.error||'Le service est momentanément indisponible.')}catch{typing.remove();append('bot','Connexion momentanément indisponible. Vous pouvez continuer directement avec le vendeur.')}};document.getElementById('send').onclick=send;q.onkeydown=e=>{if(e.key==='Enter')send()}}
function append(role,text){const d=document.createElement('div');d.className='bubble '+role;d.textContent=text;const c=document.getElementById('chat');c.appendChild(d);c.scrollTop=c.scrollHeight;return d}
load().catch(()=>fail('Erreur temporaire','La vitrine est momentanément indisponible. Réessayez dans quelques instants.'));
</script>
</body>
</html>
