<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Vitrine business WhatsAfrica"><title>WhatsAfrica — Vitrine</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--accent:#e8a83c;--bg:#0b0f19;--card:#151c2c;--line:#2b3850;--muted:#9eabc0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#293552,#0b0f19 48%);color:#f8f4ea;font:15px system-ui}.wrap{max-width:920px;margin:auto;padding:0 15px}.nav{position:sticky;top:0;z-index:5;background:#0b0f19ed;border-bottom:1px solid #ffffff18}.navrow{min-height:62px;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font:bold 20px Georgia;color:#fff;text-decoration:none}.brand b{color:var(--accent)}.btn{border:0;border-radius:999px;padding:11px 16px;font-weight:850;cursor:pointer;text-decoration:none;display:inline-flex;justify-content:center;align-items:center;gap:7px}.primary{background:var(--accent);color:#17120b}.ghost{background:transparent;color:#fff;border:1px solid var(--line)}.hero{padding:25px 0}.poster{position:relative;overflow:hidden;border:1px solid #ffffff22;border-radius:24px;background:linear-gradient(145deg,#211c36,#121827);box-shadow:0 18px 50px #0007}.cover{width:100%;height:270px;object-fit:cover;display:block}.posterbody{padding:22px}.logo{width:88px;height:88px;border-radius:20px;object-fit:cover;border:2px solid var(--accent);background:var(--accent);margin-top:-64px;position:relative}.eyebrow{font:10px monospace;letter-spacing:2px;color:#47c9ad;text-transform:uppercase}.poster h1{font:36px Georgia;margin:8px 0}.tagline{font-size:18px;color:#fff;line-height:1.45}.text{color:#d8d4c9;line-height:1.7;white-space:pre-line}.contacts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}.contact{padding:13px;border:1px solid var(--line);border-radius:14px;background:#ffffff07}.contact b{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.contact a{color:#fff}.services{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.pill{border:1px solid #ffffff1c;border-radius:999px;padding:8px 11px;background:#ffffff08}.section{margin:20px 0}.section h2{font:24px Georgia}.products{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.product{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}.product img{width:100%;height:210px;object-fit:cover}.pbody{padding:14px}.price{color:var(--accent);font-weight:900}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.row .btn{flex:1}.assistant{background:#121827;border:1px solid var(--line);border-radius:18px;padding:16px}.chat{height:220px;overflow:auto;background:#080c14;border-radius:13px;padding:10px}.bubble{max-width:88%;padding:9px 12px;border-radius:14px;margin:7px 0;white-space:pre-wrap}.bot{background:#ffffff0b}.user{margin-left:auto;background:#18a98b;color:#06241e}.composer{display:flex;gap:8px;margin-top:8px}.composer input,.modal input,.modal textarea{flex:1;min-width:0;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0a101c;color:#fff}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:15px;z-index:20}.modalbox{max-width:560px;width:100%;max-height:90vh;overflow:auto;background:#151c2c;border:1px solid var(--line);border-radius:20px;padding:18px}.modal.show{display:flex}.field{margin:9px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.notice{padding:10px;border-radius:10px;background:#18a98b18;color:#a4eedc}.error{color:#ffb1a3}.empty{text-align:center;padding:70px 10px}.footer{text-align:center;color:#ffffff55;padding:30px}.hidden{display:none!important}@media(max-width:650px){.products,.contacts{grid-template-columns:1fr}.cover{height:190px}.poster h1{font-size:29px}.product img{height:180px}}</style></head><body><header class="nav"><div class="wrap navrow"><a class="brand" href="/">Whats<b>Africa</b></a><a class="btn ghost" href="/">Découvrir</a></div></header><main class="wrap" id="page"><div class="empty">Chargement de la vitrine…</div></main><div class="modal" id="modal"><div class="modalbox"><div class="row"><button class="btn ghost" id="close">Fermer</button></div><div id="modalContent"></div></div></div><footer class="wrap footer">WhatsAfrica — Communiquez. Découvrez. Vendez.</footer><script>const U='https://dzifpwqrqnvssfhwjccj.supabase.co',K='sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV',db=supabase.createClient(U,K),slug=decodeURIComponent(location.pathname.replace(/^\/+/, '').split('/')[0]||''),$=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));const url=v=>{try{const u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:null}catch{return null}},money=(v,c)=>new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0}).format(Number(v||0))+' '+(c||'XOF');let link,business,products=[],payments=[],history=[];async function load(){if(!slug)return fail('Smart Link introuvable');const l=await db.from('smart_links').select('id,business_id,owner_id,slug,title,description,is_public').eq('slug',slug).eq('is_public',true).maybeSingle();if(l.error||!l.data)return fail('Cette vitrine n’existe pas ou n’est pas publique.');link=l.data;const b=await db.from('businesses').select('id,name,description,country,city,logo_url,template,accent_color,phone,delivery_enabled,delivery_fee,payment_methods,tagline,address,email,website_url,cover_image_url,presentation,services').eq('id',link.business_id).maybeSingle();business=b.data||{name:link.title,description:link.description,services:[]};const p=await db.from('products').select('id,title,description,price,currency,image_url,stock,is_published').eq('business_id',link.business_id).eq('is_published',true).order('created_at',{ascending:false}).limit(60);products=p.data||[];const pl=await db.from('public_payment_links').select('id,business_id,product_id,smart_link_id,provider,label,url,is_active').eq('is_active',true).or('smart_link_id.eq.'+link.id+',business_id.eq.'+link.business_id);payments=pl.data||[];document.documentElement.style.setProperty('--accent',business.accent_color||'#e8a83c');render()}function fail(t){$('page').innerHTML='<div class="empty"><h1>'+esc(t)+'</h1><a class="btn primary" href="/">Ouvrir WhatsAfrica</a></div>'}function render(){const logo=url(business.logo_url),cover=url(business.cover_image_url)||logo;const services=Array.isArray(business.services)?business.services:[];const mapUrl=business.address?('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent([business.address,business.city,business.country].filter(Boolean).join(', '))):null;const contact='<div class="contacts">'+(business.address?'<div class="contact"><b>📍 ADRESSE</b>'+esc(business.address)+(business.city||business.country?'<br>'+esc([business.city,business.country].filter(Boolean).join(', ')):'')+(mapUrl?'<br><a target="_blank" rel="noopener" href="'+esc(mapUrl)+'">Ouvrir dans Maps →</a>':'')+'</div>':'')+(business.email?'<div class="contact"><b>✉️ E-MAIL</b><a href="mailto:'+esc(business.email)+'">'+esc(business.email)+'</a></div>':'')+(business.phone?'<div class="contact"><b>📞 TÉLÉPHONE</b><a href="tel:'+esc(business.phone)+'">'+esc(business.phone)+'</a></div>':'')+(business.website_url?'<div class="contact"><b>🌐 SITE WEB</b><a target="_blank" rel="noopener" href="'+esc(url(business.website_url)||'#')+'">Visiter le site →</a></div>':'')+'</div>';const ps=products.length?products.map(p=>{const im=url(p.image_url);const pay=payments.find(x=>x.product_id===p.id)||payments.find(x=>x.smart_link_id===link.id)||payments.find(x=>x.business_id===business.id);return '<article class="product">'+(im?'<img src="'+esc(im)+'" alt="'+esc(p.title)+'" loading="lazy">':'')+'<div class="pbody"><h3>'+esc(p.title)+'</h3><div class="text">'+esc(p.description||'')+'</div><p class="price">'+money(p.price,p.currency)+'</p><div class="row"><button class="btn primary" data-buy="'+esc(p.id)+'">🛒 Commander</button>'+(pay?'<a class="btn ghost" target="_blank" rel="noopener" href="'+esc(pay.url)+'">💳 Payer</a>':'')+'</div></div></article>'}).join(''):'<div class="notice">Aucun produit publié pour le moment.</div>';$('page').innerHTML='<section class="hero"><article class="poster">'+(cover?'<img class="cover" src="'+esc(cover)+'" alt="Image de présentation de '+esc(business.name||'l’entreprise')+'">':'')+'<div class="posterbody">'+(logo?'<img class="logo" src="'+esc(logo)+'" alt="'+esc(business.name)+'">':'')+'<div class="eyebrow">VITRINE BUSINESS WHATS AFRICA</div><h1>'+esc(business.name||link.title)+'</h1>'+(business.tagline?'<div class="tagline">'+esc(business.tagline)+'</div>':'')+'<p class="text">'+esc(business.presentation||business.description||link.description||'')+'</p>'+(services.length?'<div class="services">'+services.map(s=>'<span class="pill">✓ '+esc(s)+'</span>').join('')+'</div>':'')+contact+'<div class="row"><button class="btn primary" id="share">🔗 Partager la vitrine</button>'+(business.phone?'<a class="btn ghost" href="tel:'+esc(business.phone)+'">📞 Contacter</a>':'')+'<button class="btn ghost" id="assistantBtn">🤝 Votre assistant commercial</button></div></div></article></section><section class="section"><h2>🛍️ Produits & services</h2><div class="products">'+ps+'</div></section><section class="section assistant" id="assistant"><div class="eyebrow">VOTRE ASSISTANT COMMERCIAL</div><h2>Besoin d'aide ?</h2><div class="chat" id="chat"><div class="bubble bot">Bonjour 👋 Je suis votre assistant commercial. Je peux vous aider à comprendre l'offre, choisir un produit ou préparer une commande.</div></div><div class="composer"><input id="q" maxlength="2000" placeholder="Posez votre question…"><button class="btn primary" id="send">Envoyer</button></div></section>';$('share').onclick=share;$('assistantBtn').onclick=()=>$('assistant').scrollIntoView({behavior:'smooth'});$('send').onclick=()=>ask($('q').value);$('q').onkeydown=e=>{if(e.key==='Enter')ask($('q').value)};document.querySelectorAll('[data-buy]').forEach(x=>x.onclick=()=>checkout(products.find(p=>p.id===x.dataset.buy)))}async function share(){const data={title:business.name,text:business.tagline||'Découvrez cette entreprise sur WhatsAfrica',url:location.href};if(navigator.share)await navigator.share(data).catch(()=>{});else if(navigator.clipboard)await navigator.clipboard.writeText(location.href)}function append(role,text){const d=document.createElement('div');d.className='bubble '+role;d.textContent=text;$('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight;return d}async function ask(t){t=String(t||'').trim();if(!t)return;append('user',t);$('q').value='';const wait=append('bot','…');try{const r=await fetch('/api/assistant',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:t,history:history.slice(-10),business:{display_name:business.name,country:business.country,bio:business.presentation||business.description,smartlink_slug:slug,delivery_enabled:!!business.delivery_enabled,delivery_fee:business.delivery_fee||0,payment_methods:business.payment_methods||['cash_on_delivery'],articles:products.map(p=>({id:p.id,title:p.title,description:p.description,price:p.price,currency:p.currency||'XOF',kind:'produit',stock:p.stock}))}})});const d=await r.json();wait.remove();const a=d.answer||d.error||'Service indisponible.';append('bot',a);history.push({role:'user',content:t},{role:'assistant',content:a})}catch(e){wait.remove();append('bot','Connexion momentanément indisponible.')}}function checkout(p){if(!p)return;$('modalContent').innerHTML='<h2>Commander : '+esc(p.title)+'</h2><div class="field"><label>Nom</label><input id="buyerName" autocomplete="name"></div><div class="field"><label>Téléphone</label><input id="buyerPhone" inputmode="tel" autocomplete="tel"></div><div class="field"><label>Ville</label><input id="city" value="'+esc(business.city||'')+'"></div><div class="field"><label>Adresse de livraison</label><textarea id="address"></textarea></div><div class="field"><label>Mode de livraison</label><input id="delivery" value="'+(business.delivery_enabled?'Livraison':'Retrait')+'"></div><div class="field"><label>Mode de paiement</label><input id="payment" value="'+esc(Array.isArray(business.payment_methods)?business.payment_methods[0]||'À confirmer':'À confirmer')+'"></div><button class="btn primary" id="confirm">Confirmer la commande</button><p id="orderMsg"></p>';$('modal').classList.add('show');$('confirm').onclick=async()=>{const btn=$('confirm');btn.disabled=true;btn.textContent='Enregistrement…';try{const key=crypto.randomUUID();const s=await db.auth.getSession();const r=await db.rpc('create_guest_order',{p_business_id:business.id,p_smart_link_id:link.id,p_buyer_name:$('buyerName').value.trim(),p_buyer_phone:$('buyerPhone').value.trim(),p_delivery_city:$('city').value.trim(),p_delivery_address:$('address').value.trim(),p_delivery_method:$('delivery').value.trim(),p_payment_method:$('payment').value.trim(),p_items:[{product_id:p.id,quantity:1,unit_price:p.price,title:p.title}],p_idempotency_key:key,p_buyer_user_id:s.data.session?.user?.id||null});if(r.error)throw r.error;const orderId=r.data?.id||r.data?.order_id,token=r.data?.tracking_token;if(!orderId||!token)throw new Error('Référence de suivi indisponible.');$('orderMsg').innerHTML='<div class="notice"><b>Commande enregistrée.</b><br>Référence : '+esc(orderId)+'<br><small>Conservez votre code de suivi pour vérifier le paiement et l’avancement.</small><div class="row"><button class="btn primary" id="trackOrder">📦 Suivre ma commande</button>'+(payments.find(x=>x.product_id===p.id)||payments.find(x=>x.smart_link_id===link.id)||payments.find(x=>x.business_id===business.id)?'<button class="btn ghost" id="payNow">💳 Ouvrir le paiement</button>':'')+'</div></div>';if($('trackOrder'))$('trackOrder').onclick=()=>trackOrder(orderId,token);const pay=payments.find(x=>x.product_id===p.id)||payments.find(x=>x.smart_link_id===link.id)||payments.find(x=>x.business_id===business.id);if(pay)$('payNow').onclick=()=>window.open(pay.url,'_blank','noopener');}catch(e){$('orderMsg').innerHTML='<span class="error">'+esc(e.message||'Impossible d’enregistrer la commande.')+'</span>'}finally{btn.disabled=false;btn.textContent='Confirmer la commande'}}}$('close').onclick=()=>$('modal').classList.remove('show');load().catch(e=>fail(e.message));async function trackOrder(orderId,token){$('modalContent').innerHTML='<h2>📦 Suivi de commande</h2><p>Chargement…</p>';$('modal').classList.add('show');try{const r=await db.rpc('get_public_order_status',{p_order_id:orderId,p_tracking_token:token});if(r.error)throw r.error;const d=r.data;const payment=d.payment_status||'pending';const labels={unpaid:'Non payé',pending:'En attente de paiement',paid:'Paiement confirmé',failed:'Paiement échoué',cancelled:'Paiement annulé',refunded:'Remboursé'};$('modalContent').innerHTML='<h2>📦 Suivi de commande</h2><div class="notice"><b>Commande : '+esc(d.order_id)+'</b><br>État : '+esc(d.status||'pending')+'<br>Paiement : <strong>'+esc(labels[payment]||payment)+'</strong><br>Total : '+money(d.total,d.currency)+(d.payment_paid_at?'<br>Confirmé le : '+esc(new Date(d.payment_paid_at).toLocaleString('fr-FR')):'')+'</div><div class="row"><button class="btn primary" id="refreshTrack">🔄 Actualiser</button><button class="btn ghost" id="closeTrack">Fermer</button></div><p class="text">Le paiement n’est considéré comme confirmé qu’après validation par le prestataire de paiement. L’ouverture d’un lien de paiement ne confirme pas la transaction.</p>';$('refreshTrack').onclick=()=>trackOrder(orderId,token);$('closeTrack').onclick=()=>$('modal').classList.remove('show')}catch(e){$('modalContent').innerHTML='<div class="error">Impossible de retrouver cette commande. Vérifiez votre référence et votre code de suivi.</div><div class="row"><button class="btn ghost" id="closeTrack">Fermer</button></div>';$('closeTrack').onclick=()=>$('modal').classList.remove('show')}}async function share(){const data={title:business.name,text:business.tagline||'Découvrez cette entreprise sur WhatsAfrica',url:location.href};if(navigator.share)await navigator.share(data).catch(()=>{});else if(navigator.clipboard)await navigator.clipboard.writeText(location.href)}function append(role,text){const d=document.createElement('div');d.className='bubble '+role;d.textContent=text;$('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight;return d}async function ask(t){t=String(t||'').trim();if(!t)return;append('user',t);$('q').value='';const wait=append('bot','…');try{const r=await fetch('/api/assistant',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:t,history:history.slice(-10),business:{display_name:business.name,country:business.country,bio:business.presentation||business.description,smartlink_slug:slug,delivery_enabled:!!business.delivery_enabled,delivery_fee:business.delivery_fee||0,payment_methods:business.payment_methods||['cash_on_delivery'],articles:products.map(p=>({id:p.id,title:p.title,description:p.description,price:p.price,currency:p.currency||'XOF',kind:'produit',stock:p.stock}))}})});const d=await r.json();wait.remove();const a=d.answer||d.error||'Service indisponible.';append('bot',a);history.push({role:'user',content:t},{role:'assistant',content:a})}catch(e){wait.remove();append('bot','Connexion momentanément indisponible.')}}$('close').onclick=()=>$('modal').classList.remove('show');</script></body></html>
