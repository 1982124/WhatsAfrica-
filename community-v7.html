</head><body><header class="top"><div class="wrap topin"><a class="brand" href="/">WhatsAfrica</a><nav class="mainnav" aria-label="Navigation principale"><a href="/inbox">💬 Discussions</a><a href="/universe">🌍 Explorer</a><a href="/groups">👥 Communautés</a><a href="/market">🛒 Marché</a><a href="/dashboard">👤 Moi</a></nav><div class="headtools"><button id="bell" class="btn" aria-label="Notifications">🔔 <span id="badge" class="badge" style="display:none">0</span></button></div></div></header><div id="notif" class="notif hidden"><div style="display:flex;justify-content:space-between"><b>Notifications</b><button id="read" class="btn">Tout lire</button></div><div id="notifs" class="muted">Chargement…</div></div><main class="wrap"><section id="hero" class="card hero"><div class="body">Chargement…</div></section><section class="card"><h2>👥 Membres</h2><div class="muted">Messagerie privée directe</div><div class="search"><input id="filter" placeholder="🔎 Rechercher"></div><div id="members">Chargement…</div></section><section id="composer" class="card" style="display:none"><h2>📝 Nouveau sujet</h2><textarea id="body" maxlength="4000" placeholder="De quoi voulez-vous parler ?"></textarea><div class="actions"><button id="publish" class="btn primary">Publier</button><button id="cancel" class="btn">Annuler</button></div></section><section><div style="display:flex;justify-content:space-between;align-items:center;margin:18px 2px 8px"><div><h2>💬 Conversation publique</h2><div class="muted">Sujets, réactions et commentaires.</div></div><button id="new" class="btn primary">＋ Sujet</button></div><div id="posts">Chargement…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(async()=>{const db=supabase.createClient('https://dzifpwqrqnvssfhwjccj.supabase.co','sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV'),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m])),gid=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||'');let me=null,isMember=false,profiles=new Map(),members=[];const icons={like:'👍',love:'❤️',laugh:'😂',support:'👏'},pname=id=>{const p=profiles.get(id)||{};return p.public_display_name||p.display_name||[p.first_name,p.last_name].filter(Boolean).join(' ')||'Membre WhatsAfrica'},av=(id,sm)=>{const p=profiles.get(id)||{},a=p.avatar_url||p.profile_photo_url||p.profile_image_url||'';return '<div class="avatar '+(sm?'sm':'')+'" '+(a?'style="background-image:url(\''+esc(a)+'\')"':'')+'>'+(a?'':esc(pname(id)[0]||'W'))+'</div>'};async function getMe(){return(await db.auth.getSession()).data.session?.user||null}function notice(t){const s=$('hero').querySelector('.status');if(s)s.textContent=t}async function init(){me=await getMe();const g=await db.from('groups').select('id,name,description,is_business,image_url,image_alt').eq('id',gid).maybeSingle();if(g.error||!g.data){$('hero').innerHTML='<div class="body"><b>Communauté introuvable.</b></div>';return}const x=g.data;$('hero').innerHTML=(x.image_url?'<img src="'+esc(x.image_url)+'" alt="'+esc(x.image_alt||x.name)+'">':'')+'<div class="body"><div class="muted">'+(x.is_business?'💼 Communauté business':'👥 Communauté')+'</div><h1>'+esc(x.name)+'</h1><p class="muted">'+esc(x.description||'Un espace WhatsAfrica pour échanger ensemble.')+'</p><div class="actions"><button id="join" class="btn primary">Rejoindre</button><button id="share" class="btn">↗️ Partager</button></div><div class="status muted"></div></div>';if(me){const m=await db.from('group_members').select('user_id').eq('group_id',gid).eq('user_id',me.id).maybeSingle();isMember=!!m.data}if(isMember){$('join').textContent='✓ Vous êtes membre';$('join').disabled=true}$('join').onclick=async()=>{if(!me)return location.href='/auth?next='+encodeURIComponent(location.pathname);const r=await db.from('group_members').insert({group_id:gid,user_id:me.id,role:'member'});if(r.error&&!String(r.error.message).toLowerCase().includes('duplicate'))return notice(r.error.message);isMember=true;$('join').textContent='✓ Vous êtes membre';$('join').disabled=true;await refresh()};$('share').onclick=async()=>{try{if(navigator.share)await navigator.share({title:x.name,url:location.href});else await navigator.clipboard.writeText(location.href)}catch(e){}};await refresh();subscribe()}async function refresh(){await loadMembers();await loadPosts();await loadNotifications()}async function loadMembers(){if(!me){$('members').innerHTML='<div class="muted">Connectez-vous pour voir les membres.</div>';return}const r=await db.from('group_members').select('user_id,role').eq('group_id',gid).order('created_at').limit(500);if(r.error){$('members').innerHTML='<div class="muted">Membres indisponibles.</div>';return}members=r.data||[];const ids=members.map(x=>x.user_id);if(ids.length){const p=await db.from('profiles').select('user_id,display_name,public_display_name,first_name,last_name,country,avatar_url,profile_photo_url,profile_image_url').in('user_id',ids);(p.data||[]).forEach(x=>profiles.set(x.user_id,x))}renderMembers()}function renderMembers(){const q=$('filter').value.toLowerCase(),a=members.filter(x=>pname(x.user_id).toLowerCase().includes(q));$('members').innerHTML=a.length?a.map(x=>'<div class="member">'+av(x.user_id)+'<div class="grow"><div class="name">'+esc(pname(x.user_id))+'</div><div class="meta">'+esc((profiles.get(x.user_id)||{}).country||'Afrique')+'</div></div>'+(x.user_id===me?.id?'':'<button class="btn primary" data-chat="'+x.user_id+'">💬</button>')+'</div>').join(''):'<div class="muted">Aucun membre trouvé.</div>';document.querySelectorAll('[data-chat]').forEach(b=>b.onclick=async()=>{const r=await db.rpc('start_direct_conversation_by_user_id',{p_user_id:b.dataset.chat});if(!r.error&&r.data?.[0]?.conversation_id)location.href='/inbox?conversation='+r.data[0].conversation_id})}$('filter').oninput=renderMembers;$('new').onclick=()=>{if(!me)return location.href='/auth?next='+encodeURIComponent(location.pathname);$('composer').style.display='block';$('new').style.display='none';$('body').focus()};$('cancel').onclick=()=>{$('composer').style.display='none';$('new').style.display='inline-flex'};$('publish').onclick=async()=>{const text=$('body').value.trim();if(!text)return;const r=await db.from('group_posts').insert({group_id:gid,author_id:me.id,body:text});if(r.error)return notice(r.error.message);$('body').value='';$('composer').style.display='none';$('new').style.display='inline-flex';await loadPosts()};async function loadPosts(){const p=await db.from('group_posts').select('id,body,created_at,author_id').eq('group_id',gid).order('created_at',{ascending:false}).limit(50);if(p.error){$('posts').innerHTML='<div class="card">Conversation indisponible.</div>';return}const posts=p.data||[],pids=posts.map(x=>x.id);let comments=[];if(pids.length){const cr=await db.from('group_comments').select('id,post_id,body,created_at,author_id').in('post_id',pids).order('created_at');comments=cr.data||[]}const users=[...new Set(posts.map(x=>x.author_id).concat(comments.map(x=>x.author_id)))];if(users.length){const pr=await db.from('profiles').select('user_id,display_name,public_display_name,first_name,last_name,avatar_url,profile_photo_url,profile_image_url').in('user_id',users);(pr.data||[]).forEach(x=>profiles.set(x.user_id,x))}const targets=pids.concat(comments.map(x=>x.id));let reactions=[];if(targets.length){const rr=await db.from('community_reactions').select('target_type,target_id,user_id,reaction_type').in('target_id',targets);reactions=rr.data||[]}const by={};reactions.forEach(x=>{const k=x.target_type+':'+x.target_id;(by[k]??=[]).push(x)});$('posts').innerHTML=posts.length?posts.map(x=>postHtml(x,comments.filter(y=>y.post_id===x.id),by)).join(''):'<div class="card muted">Aucun sujet pour le moment. Soyez le premier 👋</div>';document.querySelectorAll('[data-react]').forEach(b=>b.onclick=()=>react(b.dataset.kind,b.dataset.id,b.dataset.type));document.querySelectorAll('[data-send]').forEach(b=>b.onclick=()=>comment(b.dataset.send));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editPost(b.dataset.edit))}function reactHtml(kind,id,by){const a=by[kind+':'+id]||[],mine=a.find(x=>x.user_id===me?.id)?.reaction_type;return '<div class="reacts">'+Object.entries(icons).map(([k,e])=>'<button class="react '+(mine===k?'active':'')+'" data-react="1" data-kind="'+kind+'" data-id="'+id+'" data-type="'+k+'">'+e+' '+(a.filter(x=>x.reaction_type===k).length||'')+'</button>').join('')+'</div>'}function postHtml(p,cs,by){const edit=me&&p.author_id===me.id?'<button class="btn" data-edit="'+p.id+'">✏️ Modifier</button>':'';return '<article class="post"><div class="posthead">'+av(p.author_id,true)+'<div class="grow"><div class="name">'+esc(pname(p.author_id))+'</div><time>'+new Date(p.created_at).toLocaleString('fr-FR')+'</time></div>'+edit+'</div><div class="postbody" data-post-body="'+p.id+'">'+esc(p.body)+'</div><div style="padding:0 16px">'+reactHtml('post',p.id,by)+'</div><div class="comments"><div class="meta">💬 '+cs.length+' commentaire'+(cs.length>1?'s':'')+'</div>'+cs.map(x=>'<div class="comment">'+av(x.author_id,true)+'<div class="grow"><div class="bubble"><b>'+esc(pname(x.author_id))+'</b><br>'+esc(x.body)+'</div><time>'+new Date(x.created_at).toLocaleString('fr-FR')+'</time>'+reactHtml('comment',x.id,by)+'</div></div>').join('')+(me?'<div style="display:flex;gap:7px;margin-top:8px"><textarea data-input="'+p.id+'" rows="1" maxlength="2000" placeholder="Écrire un commentaire…"></textarea><button class="btn primary" data-send="'+p.id+'">Envoyer</button></div>':'<div class="muted">Connectez-vous pour commenter et réagir.</div>')+'</div></article>'}function editPost(id){const body=document.querySelector('[data-post-body="'+CSS.escape(id)+'"]');if(!body)return;const old=body.textContent;body.className='postedit';body.innerHTML='<textarea id="edit-'+id+'" maxlength="4000">'+esc(old)+'</textarea><div class="actions"><button class="btn primary" data-save-edit="'+id+'">Enregistrer</button><button class="btn" data-cancel-edit="'+id+'">Annuler</button></div>';document.querySelector('[data-save-edit="'+CSS.escape(id)+'"]').onclick=()=>savePostEdit(id);document.querySelector('[data-cancel-edit="'+CSS.escape(id)+'"]').onclick=()=>{body.className='postbody';body.textContent=old}}async function savePostEdit(id){const body=document.querySelector('[data-post-body="'+CSS.escape(id)+'"]'),input=document.getElementById('edit-'+id),text=input?.value.trim();if(!body||!text)return;const r=await db.from('group_posts').update({body:text}).eq('id',id).eq('author_id',me.id);if(r.error){notice(r.error.message);return}await loadPosts()}async function react(kind,id,type){if(!me)return location.href='/auth?next='+encodeURIComponent(location.pathname);const q=await db.from('community_reactions').select('id,reaction_type').eq('target_type',kind).eq('target_id',id).eq('user_id',me.id).maybeSingle();if(q.data){if(q.data.reaction_type===type)await db.from('community_reactions').delete().eq('id',q.data.id);else{await db.from('community_reactions').delete().eq('id',q.data.id);await db.from('community_reactions').insert({target_type:kind,target_id:id,user_id:me.id,reaction_type:type})}}else await db.from('community_reactions').insert({target_type:kind,target_id:id,user_id:me.id,reaction_type:type});await loadPosts()}async function comment(post){const i=document.querySelector('[data-input="'+CSS.escape(post)+'"]'),text=i?.value.trim();if(!text)return;const r=await db.from('group_comments').insert({post_id:post,author_id:me.id,body:text});if(r.error)return notice(r.error.message);i.value='';await loadPosts()}async function loadNotifications(){if(!me){$('notifs').innerHTML='<div class="muted">Connectez-vous pour voir vos notifications.</div>';return}const r=await db.from('notifications').select('id,title,body,read_at,created_at').order('created_at',{ascending:false}).limit(40);if(r.error)return;const a=r.data||[],u=a.filter(x=>!x.read_at).length;$('badge').style.display=u?'inline':'none';$('badge').textContent=u>99?'99+':u;$('notifs').innerHTML=a.length?a.map(x=>'<div class="n '+(x.read_at?'':'unread')+'"><b>'+esc(x.title)+'</b><div class="muted">'+esc(x.body||'')+'</div><time>'+new Date(x.created_at).toLocaleString('fr-FR')+'</time></div>').join(''):'<div class="muted">Aucune notification.</div>'}$('bell').onclick=()=>{$('notif').classList.toggle('hidden');loadNotifications()};$('read').onclick=async()=>{if(me){await db.from('notifications').update({read_at:new Date().toISOString()}).eq('user_id',me.id).is('read_at',null);loadNotifications()}};function subscribe(){const ch=db.channel('community-v7-'+gid).on('postgres_changes',{event:'*',schema:'public',table:'group_posts',filter:'group_id=eq.'+gid},loadPosts).on('postgres_changes',{event:'*',schema:'public',table:'group_comments'},loadPosts).on('postgres_changes',{event:'*',schema:'public',table:'community_reactions'},loadPosts).on('postgres_changes',{event:'*',schema:'public',table:'notifications'},loadNotifications);ch.subscribe()}init().catch(e=>{console.error(e);$('hero').innerHTML='<div class="body"><b>Impossible de charger cette communauté.</b></div>'})})();</script></body></html>
