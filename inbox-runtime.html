<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WASSAFRICA — Messages</title><meta name="robots" content="noindex,nofollow"></head><body style="margin:0;background:#090d17;color:#f8f5eb;font-family:system-ui"><main id="boot" style="min-height:100vh;display:grid;place-items:center;padding:24px"><div style="text-align:center"><strong style="font-size:24px">WASSAFRICA</strong><p>Ouverture de la messagerie…</p></div></main><script>(async()=>{try{const r=await fetch('/inbox.html?runtime=1',{cache:'no-store'});if(!r.ok)throw Error('INBOX_SOURCE_'+r.status);let html=await r.text();html=html.replace("db=supabase.createClient(URL,KEY),$=id=>document.getElementById(id);","db=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.localStorage,storageKey:'whatsafrica-auth'}}),$=id=>document.getElementById(id);");html=html.replace("async function boot(){const s=await db.auth.getSession();if(!s.data.session)return;","async function boot(){const s=await db.auth.getSession();if(!s.data.session){location.replace('/auth?next='+encodeURIComponent('/inbox'));return;}");html=html.replace('<title>WhatsAfrica — Messages</title>','<title>WASSAFRICA — Messages</title>');html=html.replace('<div class="brand">Whats<b>Africa</b> <span class="hint">/ Messages</span></div>','<div class="brand">WASSAFRICA <span class="hint">/ Messages</span></div>');document.open();document.write(html);document.close()}catch(e){console.error(e);document.body.innerHTML='<main style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui;background:#090d17;color:#f8f5eb"><div style="text-align:center"><strong style="font-size:24px">WASSAFRICA</strong><p>Impossible d’ouvrir la messagerie. Réessayez.</p></div></main>'}})();</script></body></html>
