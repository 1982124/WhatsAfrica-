<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WASSAFRICA — Connexion</title><style>body{margin:0;background:#071b16;color:#f5f7f3;font:15px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;display:grid;place-items:center}.card{width:min(460px,calc(100% - 32px));background:#f7f1df;color:#17211d;border-radius:24px;padding:28px;box-sizing:border-box}.btn{width:100%;height:52px;border:0;border-radius:13px;margin-top:12px;font-weight:900;cursor:pointer}.primary{background:#21784c;color:#fff}.secondary{background:#fffdf8;border:1px solid #d7d1c4;color:#24312b}.muted{color:#65716b;line-height:1.5}.err{color:#b42318;margin-top:12px}</style></head><body><main class="card"><div style="font-size:23px;font-weight:950">WASSAFRICA</div><p style="color:#e8b64b;font-weight:900;letter-spacing:2px">💬 MESSAGE</p><h1>Parlez. Simplement.</h1><p class="muted">Connectez-vous avec Google pour conserver votre compte et votre identité WASSAFRICA.</p><button id="google" class="btn primary">🌐 Continuer avec Google</button><button id="back" class="btn secondary">← Retour à la messagerie</button><div id="status" class="muted"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(async()=>{const URL='https://dzifpwqrqnvssfhwjccj.supabase.co',KEY='sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV',STORAGE_KEY='whatsafrica-auth',db=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:localStorage,storageKey:STORAGE_KEY}}),q=new URLSearchParams(location.search),next=(()=>{const n=q.get('next')||'/inbox';try{const u=new URL(n,location.origin);return u.origin===location.origin&&u.pathname.startsWith('/')?u.pathname+u.search+u.hash:'/inbox'}catch{return'/inbox'}})(),status=t=>document.getElementById('status').textContent=t;sessionStorage.setItem('wassafrica-oauth-next',next);const code=q.get('code');if(code){try{const r=await db.auth.exchangeCodeForSession(code);if(r.error)throw r.error;sessionStorage.removeItem('wassafrica-oauth-next');location.replace(next);return}catch(e){status('Connexion Google impossible : '+(e.message||e));}}else{const s=await db.auth.getSession();if(s.data.session){location.replace(next);return}}document.getElementById('google').onclick=async()=>{document.getElementById('google').disabled=true;status('Ouverture de Google…');const r=await db.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+'/',queryParams:{prompt:'select_account'}}});if(r.error){status(r.error.message);document.getElementById('google').disabled=false}else if(r.data?.url)location.assign(r.data.url)};document.getElementById('back').onclick=()=>location.replace(next)})()</script></body></html>
