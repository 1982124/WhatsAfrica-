<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WASSAFRICA — Messages</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font:15px system-ui;margin:0;background:#f5f7f6;color:#17211b}.wrap{max-width:1050px;margin:auto;padding:12px}.card{background:#fff;border:1px solid #dce5e1;border-radius:16px;padding:12px;margin:8px 0}.row{display:flex;gap:8px}.row>*{flex:1}.btn{border:0;border-radius:12px;padding:11px 14px;background:#e8a83c;font-weight:800}.muted{color:#66756e;font-size:13px}.err{color:#b42318}.ok{color:#18845d}.layout{display:grid;grid-template-columns:280px 1fr;gap:10px}.list{max-height:65vh;overflow:auto}.conv{padding:12px;border-radius:12px;cursor:pointer}.conv:hover{background:#eef4f1}.chat{min-height:65vh;display:flex;flex-direction:column}.msgs{flex:1;min-height:50vh;overflow:auto}.msg{max-width:82%;width:max-content;padding:9px 11px;border-radius:14px;background:#eef2f0;margin:6px 0;white-space:pre-wrap}.mine{margin-left:auto;background:#dcf8c6}@media(max-width:760px){.layout{grid-template-columns:1fr}}</style><script src="/brand-normalizer.js"></script><script src="/brand-observer.js"></script></head><body><div class="wrap"><h2>WASSAFRICA · Messages</h2><section id="gate" class="card">Vérification de session… <button id="login" class="btn" hidden>Se connecter</button></section><main id="app" hidden><section class="card"><b>Nouveau message</b><div class="row"><input id="target" placeholder="Nom ou numéro +223…"><button id="start" class="btn">Démarrer</button></div><div id="results"></div><div id="status" class="muted"></div></section><div class="layout"><section class="card"><b>Conversations</b><div id="list" class="list"></div></section><section class="card chat"><div id="chat" hidden><b id="title">Conversation</b><div id="secure" class="muted"></div><div id="msgs" class="msgs"></div><form id="composer" class="row"><input id="body" maxlength="4000" placeholder="Écrire un message…"><button class="btn">➤</button></form></div><div id="empty">Choisissez une conversation.</div></section></div></main></div><script>(async()=>{'use strict';const U='https://dzifpwqrqnvssfhwjccj.supabase.co',K='sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV',db=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,flowType:'implicit',storageKey:'whatsafrica-auth'}}),$=x=>document.getElementById(x);let me,dev,cur,rawKey,ver=0,sub,pulse;const te=new TextEncoder(),td=new TextDecoder(),b64=x=>btoa(String.fromCharCode(...new Uint8Array(x))),bytes=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));function msg(t,c=''){$('status').textContent=t;$('status').className='muted '+c}async function vault(){return new Promise((ok,no)=>{let r=indexedDB.open('wassafrica-msg-v7',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function get(k){let d=await vault();return new Promise((ok,no)=>{let r=d.transaction('k').objectStore('k').get(k);r.onsuccess=()=>{d.close();ok(r.result||null)};r.onerror=()=>no(r.error)})}async function put(k,v){let d=await vault();return new Promise((ok,no)=>{let r=d.transaction('k','readwrite').objectStore('k').put(v,k);r.transaction.oncomplete=()=>{d.close();ok()};r.onerror=()=>no(r.error)})}async function identity(){let x=await get('id:'+me.id);if(x)return{publicJwk:x.publicJwk,privateKey:await crypto.subtle.importKey('jwk',x.privateJwk,{name:'RSA-OAEP',hash:'SHA-256'},true,['decrypt'])};let g=await crypto.subtle.generateKey({name:'RSA-OAEP',modulusLength:2048,publicExponent:new Uint8Array([1,0,1]),hash:'SHA-256'},true,['encrypt','decrypt']);let publicJwk=await crypto.subtle.exportKey('jwk',g.publicKey),privateJwk=await crypto.subtle.exportKey('jwk',g.privateKey);await put('id:'+me.id,{publicJwk,privateJwk});return{publicJwk,privateKey:g.privateKey}}async function device(){let i=await identity(),r=await db.rpc('ensure_web_device',{p_identity_public_key:i.publicJwk});if(r.error)throw r.error;let d=r.data?.[0];if(!d)throw Error('DEVICE_NOT_AVAILABLE');dev={id:d.id,publicJwk:i.publicJwk,privateKey:i.privateKey}}async function wrap(j,k){let x=await crypto.subtle.importKey('jwk',j,{name:'RSA-OAEP',hash:'SHA-256'},true,['encrypt']);return b64(await crypto.subtle.encrypt({name:'RSA-OAEP'},x,k))}async function unwrap(s){return new Uint8Array(await crypto.subtle.decrypt({name:'RSA-OAEP'},dev.privateKey,bytes(s)))}async function readKey(c,v=0){let q=db.from('conversation_key_envelopes').select('wrapped_key,key_version').eq('conversation_id',c).eq('device_id',dev.id).is('revoked_at',null);q=v?q.eq('key_version',v):q.order('key_version',{ascending:false}).limit(1);let r=await q.maybeSingle();if(r.error)throw r.error;if(!r.data)return null;rawKey=await unwrap(r.data.wrapped_key);ver=+r.data.key_version;return rawKey}async function addEnvelope(c,d,k,v){let r=await db.from('conversation_key_envelopes').insert({conversation_id:c,device_id:d.id,key_version:v,algorithm:'RSA-OAEP-2048-SHA256+AES-256-GCM',wrapped_key:await wrap(d.identity_public_key,k)});if(r.error&&r.error.code!=='23505')throw r.error}async function distribute(c,k,v){let m=await db.from('conversation_members').select('user_id').eq('conversation_id',c);if(m.error)throw m.error;for(let uid of [...new Set((m.data||[]).map(x=>x.user_id))]){let q=await db.from('user_devices').select('id,identity_public_key').eq('user_id',uid).eq('device_label','Web').is('revoked_at',null).order('last_seen_at',{ascending:false}).limit(1);if(q.error)throw q.error;if(q.data?.[0])await addEnvelope(c,q.data[0],k,v)}}async function waitForKey(c,tries=8){for(let i=0;i<tries;i++){let k=await readKey(c);if(k)return k;await new Promise(r=>setTimeout(r,500+i*250))}return null}async function key(c){await device();if(rawKey&&cur?.id===c){await distribute(c,rawKey,ver);return rawKey}let old=await waitForKey(c,6);if(old){await distribute(c,old,ver);return old}let claim=await db.rpc('claim_conversation_key_initializer',{p_conversation_id:c,p_key_version:1,p_device_id:dev.id});if(claim.error)throw claim.error;if(!claim.data){let k=await waitForKey(c,10);if(k){await distribute(c,k,ver);return k}throw Error('KEY_NOT_AVAILABLE_YET')}let k=crypto.getRandomValues(new Uint8Array(32));await addEnvelope(c,{id:dev.id,identity_public_key:dev.publicJwk},k,1);await distribute(c,k,1);rawKey=k;ver=1;return k}async function peer(c){let m=await db.from('conversation_members').select('user_id').eq('conversation_id',c);if(m.error)throw m.error;let id=(m.data||[]).map(x=>x.user_id).find(x=>x!==me.id);if(!id)return{};let p=await db.from('profiles').select('display_name,public_display_name,country').eq('user_id',id).maybeSingle();return{name:p.data?.public_display_name||p.data?.display_name||'Membre WASSAFRICA',country:p.data?.country||''}}async function list(){let m=await db.from('conversation_members').select('conversation_id').eq('user_id',me.id);if(m.error)throw m.error;let ids=(m.data||[]).map(x=>x.conversation_id);$('list').innerHTML='';if(!ids.length)return $('list').textContent='Aucune conversation.';let q=await db.from('conversations').select('id,title,created_at').in('id',ids).order('created_at',{ascending:false});if(q.error)throw q.error;for(let c of q.data||[]){let p=await peer(c.id),d=document.createElement('div');d.className='conv';d.textContent=p.name||c.title||'Conversation';d.onclick=()=>open({...c,...p});$('list').appendChild(d)}}async function findTarget(v){$('results').innerHTML='';if(/^\+?[0-9\s().-]+$/.test(v))return null;let r=await db.rpc('search_public_profiles',{p_query:v});if(r.error)throw r.error;let rows=(r.data||[]).filter(x=>x.user_id!==me.id);rows.slice(0,10).forEach(p=>{let d=document.createElement('div');d.className='conv';d.textContent=(p.display_name||'Membre WASSAFRICA')+' '+(p.country||'');d.onclick=()=>startUser(p);$('results').appendChild(d)});if(rows.length===1)return rows[0]}async function startUser(p){let r=await db.rpc('start_direct_conversation_by_user_id',{p_user_id:p.user_id});if(r.error)throw r.error;let x=r.data?.[0];if(!x)throw Error('CONTACT_NOT_FOUND');return open({id:x.conversation_id,title:x.contact_name||p.display_name,country:x.contact_country||p.country})}async function start(){let v=$('target').value.trim();if(!v)return msg('Saisissez un nom ou un numéro.','err');$('start').disabled=true;try{let p=v.replace(/[\s().-]/g,'');if(!/^\+?[1-9][0-9]{7,14}$/.test(p)){let x=await findTarget(v);if(x)return startUser(x);return msg('Sélectionnez le membre souhaité.','ok')}let r=await db.rpc('start_direct_conversation_by_phone',{p_phone:p.startsWith('+')?p:'+'+p});if(r.error)throw r.error;let x=r.data?.[0];if(!x)throw Error('CONTACT_NOT_FOUND');await open({id:x.conversation_id,title:x.contact_name,country:x.contact_country})}catch(e){msg('Impossible : '+(e.message||e),'err')}finally{$('start').disabled=false}}async function decrypt(r,k){let m=r.encryption_metadata,iv=bytes(m.iv),key=await crypto.subtle.importKey('raw',k,{name:'AES-GCM'},false,['decrypt']);return td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv},key,bytes(r.ciphertext)))}async function load(){if(!cur||!rawKey)return;let q=await db.from('messages_v2').select('id,sender_id,created_at,ciphertext,encryption_metadata').eq('conversation_id',cur.id).order('created_at',{ascending:true}).limit(200);if(q.error)throw q.error;$('msgs').innerHTML='';for(let r of q.data||[]){let text='🔒 Message chiffré';try{let v=+(r.encryption_metadata?.key_version||1),k=v===ver?rawKey:await readKey(cur.id,v);if(k)text=await decrypt(r,k)}catch{}let d=document.createElement('div');d.className='msg '+(r.sender_id===me.id?'mine':'');d.textContent=text;$('msgs').appendChild(d)}$('msgs').scrollTop=$('msgs').scrollHeight}async function open(c){cur=c;rawKey=null;ver=0;$('empty').hidden=true;$('chat').hidden=false;$('title').textContent=c.title||c.name||'Conversation';if(sub)await db.removeChannel(sub).catch(()=>{});if(pulse)clearInterval(pulse);sub=db.channel('wassafrica-msg-v7-'+c.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages_v2',filter:'conversation_id=eq.'+c.id},()=>load().catch(()=>{})).subscribe();try{await key(c.id);$('secure').textContent='🔒 Chiffrement actif · clé '+ver;await load();pulse=setInterval(()=>{if(cur?.id===c.id&&rawKey)distribute(c,rawKey,ver).catch(()=>{})},2500);msg('Conversation prête.','ok')}catch(e){$('secure').textContent='';msg('Clé indisponible : ouvre cette conversation puis laisse l’autre appareil actif quelques secondes. '+(e.message||e),'err')}}async function send(e){e.preventDefault();let text=$('body').value.trim();if(!text||!cur)return;$('composer').querySelector('button').disabled=true;try{await key(cur.id);let id=crypto.randomUUID(),iv=crypto.getRandomValues(new Uint8Array(12)),k=await crypto.subtle.importKey('raw',rawKey,{name:'AES-GCM'},false,['encrypt']),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,te.encode(text)),r=await db.from('messages_v2').insert({id,conversation_id:cur.id,sender_id:me.id,body:null,message_type:'text',encryption_version:1,ciphertext:b64(ct),encryption_metadata:{v:2,alg:'AES-256-GCM',iv:b64(iv),conversation_id:cur.id,message_id:id,key_version:ver}});if(r.error)throw r.error;$('body').value='';await load();msg('🔒 Message envoyé.','ok')}catch(e){msg('Message non envoyé : '+(e.message||e),'err')}finally{$('composer').querySelector('button').disabled=false}}let s=await db.auth.getSession();if(!s.data.session){$('gate').textContent='Connectez-vous pour accéder à la messagerie.';$('login').hidden=false}else{me=s.data.session.user;$('gate').hidden=true;$('app').hidden=false;try{await device();await list();msg('Messagerie prête.','ok')}catch(e){msg('Démarrage : '+(e.message||e),'err')}}$('login').onclick=()=>location.replace('/auth?next=/inbox-v7.html');$('start').onclick=start;$('composer').onsubmit=send;$('target').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();start()}}})()</script></body></html>
