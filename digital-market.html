<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Marché des produits digitaux WhatsAfrica"><title>WhatsAfrica — Marché Digital</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#f7f2e9;--surface:#fffdf9;--ink:#20242b;--muted:#77766f;--line:#e5ddd1;--green:#287b36;--deep:#173c22;--gold:#e5aa2f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui}.wrap{max-width:1160px;margin:auto;padding:0 16px}.nav{position:sticky;top:0;background:#f7f2e9ee;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);z-index:10}.navrow{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:22px;font-weight:950;color:var(--ink);text-decoration:none}.brand b{color:var(--gold)}.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 13px;font-weight:850;text-decoration:none;cursor:pointer}.primary{background:var(--green);color:#fff;border-color:var(--green)}.hero{margin:18px 0;padding:30px;border-radius:25px;background:linear-gradient(120deg,var(--deep),#2d7835 55%,#d59b27);color:#fff}.hero h1{font:700 clamp(34px,6vw,58px)/1.05 Georgia;margin:8px 0}.hero p{max-width:760px;line-height:1.6;color:#f7f4eb}.search{display:flex;gap:8px;margin-top:18px}.search input{flex:1;padding:13px;border:0;border-radius:12px;font:inherit}.filters{display:flex;gap:8px;overflow:auto;padding-bottom:14px}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px;font-weight:850;cursor:pointer}.chip.active{background:var(--green);color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}.media{height:210px;background:linear-gradient(135deg,#dfe9d9,#efd28a);display:grid;place-items:center;font-size:62px}.media img{width:100%;height:100%;object-fit:cover}.body{padding:15px}.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:#dff0d9;color:var(--green);font-size:11px;font-weight:900}.card h2{margin:9px 0 5px;font:700 22px Georgia}.muted{color:var(--muted);line-height:1.5}.price{font-size:19px;font-weight:950;margin:10px 0}.actions{display:flex;gap:8px;margin-top:10px}.actions .btn{flex:1;text-align:center}.empty{padding:45px;text-align:center;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}@media(max-width:820px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}.search{flex-direction:column}}</style></head><body><header class="nav"><div class="wrap navrow"><a class="brand" href="/">Whats<b>Africa</b> / Digital</a><div><a class="btn" href="/commerce">Marché</a> <a class="btn primary" href="/dashboard">Vendre</a></div></div></header><main class="wrap"><section class="hero"><div>📚 MARKETPLACE DES PRODUITS DIGITAUX</div><h1>Apprendre. Télécharger. Vendre.</h1><p>Découvrez des e-books, formations, audio, vidéo, documents et autres contenus numériques publiés par les entrepreneurs WhatsAfrica.</p><div class="search"><input id="q" placeholder="Rechercher une formation, un e-book, une vidéo…"><button class="btn primary" id="searchBtn">Rechercher</button></div></section><div class="filters"><button class="chip active" data-f="all">Tout</button><button class="chip" data-f="digital">Produits digitaux</button><button class="chip" data-f="business">Entreprises</button></div><section id="grid" class="grid"><div class="empty">Chargement du marché digital…</div></section></main><script>const db=supabase.createClient('https://dzifpwqrqnvssfhwjccj.supabase.co','sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV'),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));let rows=[],filter='all';const safe=v=>{try{const u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:null}catch{return null}};function money(v,c){return v==null?'Prix sur demande':new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0}).format(Number(v||0))+' '+(c||'XOF')}function render(){const q=$('q').value.trim().toLowerCase();const out=rows.filter(x=>(filter==='all'||filter==='digital')&&(!q||[x.title,x.description,x.business,x.category].join(' ').toLowerCase().includes(q)));$('grid').innerHTML=out.length?out.map(x=>'<article class="card"><div class="media">'+(safe(x.image)?'<img loading="lazy" src="'+esc(x.image)+'" alt="'+esc(x.title)+'">':'📦')+'</div><div class="body"><span class="tag">PRODUIT DIGITAL</span><h2>'+esc(x.title)+'</h2><div class="muted"><b>'+esc(x.business||'Créateur WhatsAfrica')+'</b>'+((x.city||x.country)?' · '+esc([x.city,x.country].filter(Boolean).join(', ')):'')+'</div><p class="muted">'+esc(x.description||'Contenu numérique disponible sur WhatsAfrica.')+'</p><div class="price">'+money(x.price,x.currency)+'</div><div class="actions"><a class="btn primary" href="'+esc(x.href)+'">👀 Voir la vitrine</a></div></div></article>').join(''):'<div class="empty">Aucun produit digital ne correspond à votre recherche.</div>'}async function load(){const p=await db.from('products').select('id,title,description,price,currency,image_url,product_type,is_published,category,business_id').eq('product_type','digital').eq('is_published',true).order('created_at',{ascending:false}).limit(120);if(p.error)throw p.error;const ids=[...new Set((p.data||[]).map(x=>x.business_id).filter(Boolean))];let bs=[];if(ids.length){const b=await db.from('businesses').select('id,name,city,country').in('id',ids);if(b.error)throw b.error;bs=b.data||[]}const bm=new Map(bs.map(b=>[b.id,b]));let links=[];if(ids.length){const l=await db.from('smart_links').select('business_id,slug').in('business_id',ids).eq('is_public',true);links=l.data||[]}const lm=new Map(links.map(l=>[l.business_id,l]));rows=(p.data||[]).map(x=>{const b=bm.get(x.business_id)||{},l=lm.get(x.business_id);return{...x,business:b.name,city:b.city,country:b.country,image:x.image_url,href:l?'/'+encodeURIComponent(l.slug):'/commerce'}});render()}document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));render()});$('q').oninput=render;$('searchBtn').onclick=render;load().catch(e=>{$('grid').innerHTML='<div class="empty">Le marché digital est momentanément indisponible.</div>';console.error(e)});</script></body></html>
