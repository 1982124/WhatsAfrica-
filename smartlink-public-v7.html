<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow,max-image-preview:large"><meta name="description" content="Vitrine commerciale WASSAFRICA : découvrez des produits, services, offres et contactez directement les vendeurs."><meta property="og:title" content="WASSAFRICA — Vitrine commerciale"><meta property="og:description" content="Découvrez des produits, services et offres africaines sur WASSAFRICA."><meta property="og:type" content="website"><meta property="og:url" content=""><meta property="og:image" content="https://wassafrica.vercel.app/icon-512.svg"><meta name="twitter:card" content="summary_large_image"><title>WASSAFRICA — Vitrine commerciale africaine</title><script src="/brand-normalizer.js"></script><script src="/wa-media.js"></script><script src="/wa-smart-link-engine.js" defer></script><style>:root{--g:#173d2d;--g2:#245941;--gold:#e7a72f;--sand:#f5efe4;--ink:#18231e;--muted:#68746d;--line:#ddd9cf;--accent:#173d2d}*{box-sizing:border-box}body{margin:0;background:var(--sand);color:var(--ink);font:15px/1.55 system-ui}.wrap{max-width:1120px;margin:auto;padding:16px}.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-bottom:12px}.brand{font-weight:950;font-size:23px;color:var(--g);text-decoration:none}.btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 15px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:900;text-decoration:none;cursor:pointer}.primary{background:var(--accent);border-color:var(--accent);color:#fff}.hero{overflow:hidden;border-radius:30px;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;box-shadow:0 18px 50px #18332620}.cover{width:100%;background:#101914;line-height:0}.cover img{display:block;width:100%;height:auto;max-width:100%}.heroBody{padding:26px}.ey{font-size:11px;letter-spacing:2px;font-weight:950;color:#f7d98c}.hero h1{font:800 clamp(38px,7vw,68px)/.98 Georgia;margin:8px 0 12px}.hero p{color:#e4eee8;max-width:780px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.section{margin-top:30px}.section h2{font:800 clamp(27px,4vw,42px)/1.1 Georgia;margin:0 0 8px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden}.media{height:210px;background:#e9eee9}.media img,.media video{width:100%;height:100%;object-fit:cover;display:block}.body{padding:16px}.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef4ef;color:var(--g);font-size:10px;font-weight:950}.price{font-size:19px;font-weight:950;color:var(--accent);margin-top:8px}.empty{padding:28px;text-align:center;border:1px dashed var(--line);border-radius:18px;color:var(--muted);background:#fff}.contact{margin-top:30px;display:grid;grid-template-columns:1fr .8fr;gap:13px}.contactBox,.share{padding:22px;border-radius:22px;background:#fff;border:1px solid var(--line)}.share{background:var(--g);color:#fff}.share p{color:#dcebe3}.footer{text-align:center;color:var(--muted);font-size:12px;padding:34px 0 50px}@media(max-width:760px){.grid,.contact{grid-template-columns:1fr 1fr}}@media(max-width:520px){.wrap{padding:12px}.grid,.contact{grid-template-columns:1fr}.actions .btn{width:100%}}</style></head><body><main class="wrap"><header class="nav"><a class="brand" href="/">WASSAFRICA</a><a class="btn" href="/smartlink">Créer ma vitrine</a></header><div id="app"><div class="empty">Ouverture de la vitrine…</div></div><footer class="footer">WASSAFRICA — Connecter l’Afrique. Ouvrir le monde.</footer></main><script>
(async()=>{
'use strict';
const SB='https://dzifpwqrqnvssfhwjccj.supabase.co';
const KEY='sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV';
function dbPublicUrl(bucket,path){try{const base=SB+'/storage/v1/object/public/'+encodeURIComponent(bucket)+'/';return base+String(path).split('/').map(encodeURIComponent).join('/')}catch{return ''}}
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#39;");
const safe=v=>WAMedia.safe(v);
const money=(v,c)=>v==null?'Prix sur demande':new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0}).format(Number(v||0))+' '+(c||'XOF');
const _parts=location.pathname.split('/').filter(Boolean).map(decodeURIComponent);\nconst slug=(_parts[0]==='marche'&&_parts[1]==='boutique')?_parts[2]:(_parts[0]==='smartlink'?_parts[1]:_parts[0]);
let smartLinkId=null;
async function query(table,params){
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),8000);
  try{
    const u=new URL(SB+'/rest/v1/'+table);
    Object.entries(params||{}).forEach(([k,v])=>u.searchParams.set(k,v));
    const r=await fetch(u,{headers:{apikey:KEY,Authorization:'Bearer '+KEY},cache:'no-store',signal:controller.signal});
    if(!r.ok)throw Error('PUBLIC_DATA_'+r.status);
    return await r.json();
  }finally{clearTimeout(timer)}
}
function track(event,extra={}){
  try{window.WA_SMART_LINK?.track(event,{smart_link_id:smartLinkId,...extra})}catch{}
}
function contact(owner){
  track('smart_link_contact_clicked');
  location.href='/inbox?recipient='+encodeURIComponent(owner);
}
function productCard(p){
  const rawImage=slug==='wassafrica'?(p.title==='Smart Link WASSAFRICA'?'/assets/product-smartlink.jpg':p.title==='Présence commerciale WASSAFRICA'?'/assets/product-presence.jpg':p.title==='Vitrine WASSAFRICA'?'/assets/product-vitrine.jpg':safe(p._cover_url||p.image_url)):safe(p._cover_url||p.image_url);const image=WAMedia.resolve(rawImage,p.title==='Vitrine WASSAFRICA'?'vitrine':p.title==='Smart Link WASSAFRICA'?'smartlink':'product');
  return '<article class="card">'+(image?'<div class="media"><img loading="lazy" decoding="async" src="'+esc(image)+'" alt="'+esc(p.title)+'" onerror="this.onerror=null;this.src=\''+WAMedia.fallback(p.title==='Vitrine WASSAFRICA'?'vitrine':p.title==='Smart Link WASSAFRICA'?'smartlink':'product')+'\';"></div>':'<div class="media" style="display:grid;place-items:center;font-size:58px">🛍️</div>')+'<div class="body"><span class="tag">'+(p.product_type==='digital'?'PRODUIT DIGITAL':'PRODUIT')+'</span><h3>'+esc(p.title)+'</h3><p class="muted">'+esc(p.description||'')+'</p>'+(p.price!=null?'<div class="price">'+money(p.price,p.currency)+'</div>':'')+'<div class="actions"><a class="btn primary" href="/product/'+encodeURIComponent(p.id)+'">Voir la page</a></div></div></article>';
}
function serviceCard(s){
  const sm=WAMedia.serviceImage(s.metadata,s.title);const image=sm.url||WAMedia.fallback(sm.kind);
  return '<article class="card">'+(image?'<div class="media"><img loading="lazy" decoding="async" src="'+esc(image)+'" alt="'+esc(s.title)+'" onerror="this.onerror=null;this.src=\''+WAMedia.fallback(sm.kind)+'\';"></div>':'<div class="media" style="display:grid;place-items:center;font-size:58px">🧰</div>')+'<div class="body"><span class="tag">SERVICE</span><h3>'+esc(s.title)+'</h3><p class="muted">'+esc(s.description||'')+'</p>'+(s.price!=null?'<div class="price">'+money(s.price,s.currency)+'</div>':'')+'<div class="actions"><a class="btn primary" href="/service/'+encodeURIComponent(s.id)+'">Voir le service</a></div></div></article>';
}
async function load(){
  const links=await query('smart_links',{select:'id,business_id,title,description',slug:'eq.'+encodeURIComponent(slug),is_public:'eq.true',limit:'1'});
  const link=Array.isArray(links)?links[0]:null;
  if(!link)throw Error('NOT_FOUND');
  smartLinkId=link.id;
  const businesses=await query('businesses',{select:'id,owner_id,name,description,presentation,tagline,city,country,logo_url,cover_image_url,phone,accent_color',id:'eq.'+link.business_id,limit:'1'});
  const b=Array.isArray(businesses)?businesses[0]:null;
  if(!b)throw Error('BUSINESS_NOT_FOUND');
  const accent=/^#[0-9a-f]{6}$/i.test(b.accent_color||'')?b.accent_color:'#173d2d';
  document.documentElement.style.setProperty('--accent',accent);
  const [media,products,services]=await Promise.all([
    query('smart_link_media',{select:'kind,public_url,sort_order',smart_link_id:'eq.'+link.id,order:'sort_order.asc'}),
    query('products',{select:'id,title,description,price,currency,image_url,product_type',business_id:'eq.'+b.id,is_published:'eq.true',order:'created_at.desc',limit:'60'}),
    query('marketplace_services',{select:'id,title,description,price,currency,status,metadata',seller_id:'eq.'+b.owner_id,status:'eq.published',order:'created_at.desc',limit:'60'})
  ]);
  const productIds=(products||[]).map(x=>x.id).filter(Boolean);
  if(productIds.length){
    const pm=await query('product_media',{select:'product_id,media_type,storage_bucket,storage_path,sort_order',product_id:'in.('+productIds.join(',')+')',order:'sort_order.asc'});
    const byProduct=new Map();
    for(const m of (pm||[])){
      if(m.media_type!=='cover') continue;
      if(!byProduct.has(m.product_id)){
        const bucket=m.storage_bucket||'public-media';
        const path=m.storage_path;
        if(path) byProduct.set(m.product_id,dbPublicUrl(bucket,path));
      }
    }
    for(const p of (products||[])) p._cover_url=byProduct.get(p.id)||null;
  }
  const cover=safe(b.cover_image_url)||WAMedia.fallback('vitrine');
  const gallery=(media||[]).filter(x=>x.kind==='gallery'||x.kind==='image').map(x=>safe(x.public_url)).filter(Boolean).slice(0,6);
  const videos=(media||[]).filter(x=>x.kind==='video').map(x=>safe(x.public_url)).filter(Boolean).slice(0,3);
  document.title=(b.name||link.title||'Activité')+' — WASSAFRICA';
  $('app').innerHTML=
    '<section class="hero"><div class="cover"><img loading="eager" decoding="async" src="'+esc(cover)+'" alt="'+esc(b.name||link.title||'Vitrine WASSAFRICA')+'" onerror="this.onerror=null;this.src=\''+WAMedia.fallback(\'vitrine\')+'\';">'+'</div><div class="heroBody"><div class="ey">WASSAFRICA · '+esc([b.city,b.country].filter(Boolean).join(' · ')||'AFRIQUE')+'</div><h1>'+esc(b.name||link.title||'Activité WASSAFRICA')+'</h1><p>'+esc(b.presentation||b.description||link.description||b.tagline||'Découvrez cette activité, ses offres et son univers.')+'</p><div class="actions"><button id="wa-contact" class="btn primary">💬 Parler directement</button>'+(b.phone?'<a class="btn" href="tel:'+encodeURIComponent(b.phone)+'">📞 Appeler</a>':'')+'<button id="wa-share" class="btn">↗ Partager</button></div></div></section>'+
    (gallery.length?'<section class="section"><h2>Notre activité</h2><p class="muted">Des images réelles de l’activité.</p><div class="grid">'+gallery.map(x=>'<article class="card"><div class="media"><img loading="lazy" src="'+esc(x)+'" alt=""></div></article>').join('')+'</div></section>':'')+
    (videos.length?'<section class="section"><h2>En vidéo</h2><p class="muted">Une vidéo fournie par l’activité.</p><div class="grid">'+videos.map(x=>'<article class="card"><div class="media"><video controls playsinline preload="metadata" src="'+esc(x)+'"></video></div></article>').join('')+'</div></section>':'')+
    '<section class="section"><h2>Produits</h2><p class="muted">Découvrez les offres publiées sur WASSAFRICA.</p>'+(products?.length?'<div class="grid">'+products.map(productCard).join('')+'</div>':'<div class="empty">Aucun produit publié pour le moment.</div>')+'</section>'+
    '<section class="section"><h2>Votre parcours commercial</h2><div class="grid"><article class="card"><div class="body"><span class="tag">01 · DÉCOUVERTE</span><h3>Smart Link</h3><p class="muted">Une adresse simple pour présenter votre activité.</p></div></article><article class="card"><div class="body"><span class="tag">02 · INTÉRÊT</span><h3>Catalogue</h3><p class="muted">Produits, services, prix et disponibilité.</p></div></article><article class="card"><div class="body"><span class="tag">03 · CONVERSION</span><h3>Conversation</h3><p class="muted">Passez directement de la découverte au contact.</p></div></article></div></section>'+
    '<section class="section"><h2>Services</h2><p class="muted">Des services publiés par cette activité.</p>'+(services?.length?'<div class="grid">'+services.map(serviceCard).join('')+'</div>':'<div class="empty">Aucun service publié pour le moment.</div>')+'</section>'+
    '<section class="contact"><article class="contactBox"><div class="ey">CONTACT DIRECT</div><h2>Parler avec '+esc(b.name||'cette activité')+'</h2><p class="muted">La conversation s’ouvre directement dans WASSAFRICA.</p><button id="wa-contact-bottom" class="btn primary">💬 Ouvrir la messagerie</button></article><article class="share"><div class="ey" style="color:#f7d98c">POUR LES ACTIVITÉS</div><h2>Votre activité mérite son propre lien.</h2><p>Identité, contenu, produits, services et conversation au même endroit.</p><a class="btn" href="/smartlink">Créer ma vitrine</a></article></section>';
  $('wa-contact')?.addEventListener('click',()=>contact(b.owner_id));
  $('wa-contact-bottom')?.addEventListener('click',()=>contact(b.owner_id));
  $('wa-share')?.addEventListener('click',()=>{track('smart_link_share_clicked');if(navigator.share)navigator.share({title:document.title,url:location.href}).catch(()=>{});else navigator.clipboard?.writeText(location.href)});
  track('smart_link_viewed');
}
load().catch(e=>{$('app').innerHTML='<div class="empty"><b>Cette vitrine n’est pas disponible pour le moment.</b><div style="margin-top:8px">Le contenu public n’a pas pu être chargé. Réessayez dans un instant.</div><div style="margin-top:14px"><a class="btn primary" href="/">Retour à WASSAFRICA</a></div></div>';console.error('[WassAfrica] public Smart Link',e)});
})();
</script></body></html>
