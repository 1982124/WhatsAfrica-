<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#075e54"><title>Contacter le vendeur — WASSAFRICA</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f6f8f5;color:#172019;font:16px system-ui}.wrap{max-width:620px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #dfe7e1;border-radius:20px;padding:24px;text-align:center}h1{font:800 38px Georgia,serif}.btn{display:inline-flex;padding:12px 16px;border-radius:12px;background:#075e54;color:#fff;text-decoration:none;font-weight:900;border:0}.muted{color:#68746e;line-height:1.5}.status{margin-top:15px;font-weight:800}</style><script src="/brand-normalizer.js"></script>
<script src="/brand-observer.js"></script></head><body><main class="wrap"><section class="card"><div style="font-size:50px">💬</div><h1>Contacter le vendeur</h1><p id="text" class="muted">Préparation de votre discussion…</p><a id="login" class="btn" href="#" style="display:none">Se connecter</a><div id="status" class="status"></div></section></main><script>const db=supabase.createClient('https://dzifpwqrqnvssfhwjccj.supabase.co','sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV'),p=new URLSearchParams(location.search),phone=p.get('phone'),name=p.get('name')||'ce vendeur';function norm(v){let x=String(v||'').trim().replace(/[\s().-]/g,'');if(x.startsWith('00'))x='+'+x.slice(2);return/^\+[1-9][0-9]{7,14}$/.test(x)?x:null}async function run(){const s=await db.auth.getSession();if(!s.data.session){$('login').style.display='inline-flex';$('login').href='/auth?next='+encodeURIComponent(location.href);$('text').textContent='Connectez-vous pour ouvrir directement la discussion avec '+name+'.';return}const ph=norm(phone);if(!ph){$('text').textContent='Le vendeur n’a pas de numéro WhatsAfrica public. Ouvrez sa vitrine pour le contacter autrement.';$('status').innerHTML='<a class="btn" href="/market">Retour au Marché</a>';return}const r=await db.rpc('start_direct_conversation_by_phone',{p_phone:ph});if(r.error){$('text').textContent='La discussion n’a pas pu être ouverte automatiquement.';$('status').textContent=r.error.message;return}const x=r.data?.[0];if(!x){$('text').textContent='Ce vendeur n’est pas encore joignable par numéro sur WhatsAfrica.';$('status').innerHTML='<a class="btn" href="/inbox">Ouvrir Discussions</a>';return}location.href='/inbox'}const $=id=>document.getElementById(id);run().catch(e=>{$('text').textContent='Une erreur est survenue. Réessayez depuis Discussions.';$('status').innerHTML='<a class="btn" href="/inbox">Discussions</a>'})</script></body></html>
