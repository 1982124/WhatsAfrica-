<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WhatsAfrica — Votre assistant commercial</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>

rder:0;color:var(--m);font-size:24px}.field{margin:10px 0}.field label{display:block;color:var(--m);font-size:12px;margin-bottom:5px}.field input,.field textarea{width:100%;background:var(--bg);color:var(--t);border:1px solid #fff2;border-radius:10px;padding:10px}.msg{color:var(--r);font-size:12px;min-height:18px}.app{display:none}.app.on{display:block}.tabs{display:flex;gap:6px;overflow:auto;padding:9px 16px;border-bottom:1px solid #fff2;position:sticky;top:64px;background:#0b0e14ed;z-index:4}.tab{background:none;border:0;color:var(--m);padding:9px 12px;border-radius:999px;white-space:nowrap}.tab.on{background:var(--p2);color:var(--t)}.screen{max-width:1100px;margin:auto;padding:22px 16px 60px}.link{word-break:break-all;color:var(--g)}.chat{height:48vh;min-height:300px;overflow:auto;background:#070a0f;border:1px solid #fff2;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}.bubble{max-width:86%;padding:9px 12px;border-radius:15px;white-space:pre-wrap;line-height:1.45}.mine{align-self:flex-end;background:var(--a);color:#06251d}.theirs{align-self:flex-start;background:#fff1}.composer{display:flex;gap:8px;margin-top:9px}.composer input{flex:1;background:var(--p);color:var(--t);border:1px solid #fff2;border-radius:999px;padding:11px}.empty{padding:25px;text-align:center;color:var(--m);border:1px dashed #fff2;border-radius:14px}@media(max-width:700px){.hero{padding-top:48px}.hero h1{font-size:48px}}
</style></head><body><div id="public"></div><div id="app" class="app"><div class="nav"><div class="wrap navin"><div class="brand">Whats<b>Africa</b></div><div><span id="user" class="muted"></span> <button class="btn ghost" onclick="logout()">Sortir</button></div></div></div><div class="tabs"><button class="tab on" data-s="home" onclick="screen('home')">Accueil</button><button class="tab" data-s="smart" onclick="screen('smart')">Mon SmartLink</button><button class="tab" data-s="assistant" onclick="screen('assistant')">Assistant commercial</button><button class="tab" data-s="community" onclick="screen('community')">Communauté</button></div><main id="screen" class="screen"></main></div>
<div id="auth" class="modal"><div class="box"><button class="close" onclick="closeAuth()">×</button><h2 id="authTitle">Créer mon espace</h2><p class="muted">Email + mot de passe pour gérer votre business. Les visiteurs n'ont aucun compte à créer.</p><div id="nameField" class="field"><label>Nom affiché</label><input id="name" placeholder="Ex. Ma Boutique"></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Mot de passe</label><input id="password" type="password" autocomplete="current-password"></div><div id="authMsg" class="msg"></div><button id="authSubmit" class="btn primary" style="width:100%" onclick="authSubmit()">Créer mon espace</button><button id="authSwitch" class="btn ghost" style="width:100%;margin-top:8px" onclick="authSwitch()">J’ai déjà un compte</button></div></div>

<script>
const URL='https://dzifpwqrqnvssfhwjccj.supabase.co',KEY='sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV',db=supabase.createClient(URL,KEY);let user=null,profile=null,products=[],mode='signup',history=[],community=null;const $=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}function openAuth(m){mode=m;$('authTitle').textContent=m==='signup'?'Créer mon espace':'Se connecter';$('nameField').style.display=m==='signup'?'block':'none';$('authSubmit').textContent=m==='signup'?'Créer mon espace':'Se connecter';$('authSwitch').textContent=m==='signup'?'J’ai déjà un compte':'Créer un compte';$('authMsg').textContent='';$('auth').classList.add('on')}function closeAuth(){$('auth').classList.remove('on')}function authSwitch(){openAuth(mode==='signup'?'login':'signup')}
async function authSubmit(){const email=$('email').value.trim(),password=$('password').value,name=$('name').value.trim();if(!email||password.length<8||(mode==='signup'&&!name))return $('authMsg').textContent='Complétez les champs requis.';const r=mode==='signup'?await db.auth.signUp({email,password,options:{data:{display_name:name}}}):await db.auth.signInWithPassword({email,password});if(r.error)return $('authMsg').textContent=r.error.message;if(mode==='signup'&&!r.data.session)return $('authMsg').textContent='Compte créé. Vérifiez votre email puis connectez-vous.';closeAuth();boot(r.data.session.user)}
async function slugFor(n){const b=(n.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,30)||'espace');for(let i=0;i<8;i++){const s=b+'-'+Math.random().toString(36).slice(2,6),q=await db.from('profiles').select('id').eq('smartlink_slug',s).maybeSingle();if(!q.data)return s}return b+'-'+Date.now().toString(36).slice(-6)}
async function boot(u){user=u;let r=await db.from('profiles').select('*').eq('user_id',user.id).maybeSingle();if(r.error)return toast(r.error.message);if(!r.data){const n=user.user_metadata?.display_name||user.email.split('@')[0],s=await slugFor(n),i=await db.from('profiles').insert({user_id:user.id,display_name:n,country:'Mali',smartlink_slug:s,bio:'Bienvenue sur mon SmartLink WhatsAfrica.'}).select().single();if(i.error)return toast(i.error.message);profile=i.data}else profile=r.data;await loadProducts();await ensureCommunity();$('public').style.display='none';$('app').classList.add('on');$('user').textContent=profile.display_name;screen('home')}
async function loadProducts(){const r=await db.from('articles').select('*').eq('owner_slug',profile.smartlink_slug).order('created_at',{ascending:false});products=r.data||[]}
async function ensureCommunity(){let r=await db.from('conversations').select('*').eq('kind','community').limit(1).maybeSingle();if(r.data){community=r.data;const m=await db.from('conversation_members').select('conversation_id').eq('conversation_id',r.data.id).eq('user_id',user.id).maybeSingle();if(!m.data)await db.from('conversation_members').insert({conversation_id:r.data.id,user_id:user.id});return}const c=await db.from('conversations').insert({kind:'community',title:'Salon général WhatsAfrica',owner_id:user.id}).select().single();if(c.data){community=c.data;await db.from('conversation_members').insert({conversation_id:c.data.id,user_id:user.id,role:'owner'})}}
function screen(s){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.s===s));({home:renderHome,smart:renderSmart,assistant:renderAssistant,community:renderCommunity}[s]||renderHome)()}
function productCard(a){return `<article class="product">${a.image_url?`<img src="${esc(a.image_url)}" alt="${esc(a.title)}">`:''}<div class="body"><span class="badge">${a.product_type==='digital'?'Numérique':a.product_type==='service'?'Service':'Produit'}</span><h3>${esc(a.title)}</h3><div class="muted">${esc(a.description||'')}</div>${a.teaser?`<p>${esc(a.teaser)}</p>`:''}${a.price?`<div class="price">${esc(a.price)} ${esc(a.currency||'FCFA')}</div>`:''}${a.payment_link?`<button class="btn primary" style="width:100%;margin-top:9px" onclick="buy('${esc(a.payment_link)}')">${a.product_type==='digital'?'Accéder / acheter':'Commander'}</button>`:''}</div></article>`}
function renderHome(){$('screen').innerHTML=`<section class="panel"><div class="ey">Votre assistant commercial</div><h1>${esc(profile.display_name)}</h1><p class="muted">${esc(profile.bio||'Votre business sur WhatsAfrica.')}</p><div class="link">${esc(location.origin+'/'+profile.smartlink_slug)}</div><div class="actions"><button class="btn primary" onclick="copyLink()">Partager mon SmartLink</button><button class="btn ghost" onclick="screen('smart')">Gérer ma vitrine</button></div></section><section class="section"><div class="ey">Catalogue</div><h2>Produits & services</h2>${products.length?`<div class="cards">${products.slice(0,6).map(productCard).join('')}</div>`:'<div class="empty">Ajoutez votre premier produit.</div>'}</section>`}
function renderSmart(){$('screen').innerHTML=`<div class="grid"><section class="panel"><div class="ey">Identité</div><h2>${esc(profile.display_name)}</h2><div class="field"><label>Bio</label><textarea id="bio" rows="5">${esc(profile.bio||'')}</textarea></div><div class="field"><label>Pays</label><input id="country" value="${esc(profile.country||'')}"></div><button class="btn primary" onclick="saveProfile()">Enregistrer</button></section><section class="panel"><div class="ey">Vitrine</div><h2>Votre lien public</h2><p class="link">${esc(location.origin+'/'+profile.smartlink_slug)}</p><button class="btn primary" onclick="openModal()">+ Ajouter un produit</button></section></div><section class="section"><div class="cards">${products.map(productCard).join('')||'<div class="empty">Aucun produit.</div>'}</div></section>`}
function renderAssistant(){$('screen').innerHTML=`<section class="panel"><div class="ey">${esc(profile.assistant_name||'Votre assistant')}, votre assistante commerciale</div><h2>Testez-le comme un client.</h2><div id="chat" class="chat">${history.map(m=>`<div class="bubble ${m.role==='user'?'mine':'theirs'}">${esc(m.content)}</div>`).join('')||'<div class="empty">Exemple : « Combien coûte mon produit phare ? »</div>'}</div><div class="composer"><input id="q" placeholder="Posez une question…" onkeydown="if(event.key==='Enter')ask()"><button class="btn primary" onclick="ask()">Envoyer</button></div></section>`;setTimeout(()=>{const c=$('chat');c.scrollTop=c.scrollHeight},0)}
async function ask(){const q=$('q').value.trim();if(!q)return;history.push({role:'user',content:q});renderAssistant();try{const r=await fetch('/api/assistant',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q,history:history.slice(-8),business:{display_name:profile.display_name,country:profile.country,bio:profile.bio,smartlink_slug:profile.smartlink_slug,assistant_name:profile.assistant_name||'Votre assistant',articles:products}})},d=await r.json();history.push({role:'assistant',content:d.answer||d.error||'Réponse indisponible.'})}catch(e){history.push({role:'assistant',content:'Le service est momentanément indisponible.'})}renderAssistant()}
async function renderCommunity(){if(!community)return;$('screen').innerHTML='<section class="panel"><div class="ey">Communauté</div><h2>Salon général WhatsAfrica</h2><div id="c" class="chat"><div class="empty">Votre communauté est prête.</div></div><div class="composer"><input id="cq" placeholder="Écrire un message…" onkeydown="if(event.key===\'Enter\')sendCommunity()"><button class="btn green" onclick="sendCommunity()">Envoyer</button></div></section>';const r=await db.from('messages_v2').select('*').eq('conversation_id',community.id).order('created_at',{ascending:true}).limit(100),box=$('c');box.innerHTML=(r.data||[]).map(m=>`<div class="bubble ${m.sender_id===user.id?'mine':'theirs'}">${esc(m.body||'')}</div>`).join('')||'<div class="empty">Soyez le premier à écrire.</div>'}
async function sendCommunity(){const q=$('cq').value.trim();if(!q)return;const r=await db.from('messages_v2').insert({conversation_id:community.id,sender_id:user.id,body:q,message_type:'text'});if(r.error)return toast(r.error.message);renderCommunity()}
async function saveProfile(){const r=await db.from('profiles').update({bio:$('bio').value.trim(),country:$('country').value.trim()}).eq('id',profile.id).eq('user_id',user.id);if(r.error)return toast(r.error.message);profile.bio=$('bio').value.trim();profile.country=$('country').value.trim();toast('Profil enregistré')}
async function upload(file){if(!file)return null;const ext=(file.name.split('.').pop()||'jpg').toLowerCase(),p=`${user.id}/${crypto.randomUUID()}.${ext}`,r=await db.storage.from('whatsafrica-media').upload(p,file,{contentType:file.type});if(r.error)throw r.error;return db.storage.from('whatsafrica-media').getPublicUrl(p).data.publicUrl}
async function saveProduct(){const title=$('pt').value.trim();if(!title)return $('pmsg').textContent='Le nom est requis.';$('pmsg').textContent='Publication…';try{const r=await db.from('articles').insert({owner_slug:profile.smartlink_slug,title,description:$('pd').value.trim(),teaser:$('px').value.trim(),price:$('pp').value.trim(),currency:'FCFA',payment_link:$('pl').value.trim()||null,image_url:await upload($('pi').files[0])});if(r.error)throw r.error;closeModal();await loadProducts();screen('smart');toast('Produit publié')}catch(e){$('pmsg').textContent=e.message||'Impossible de publier.'}}
function buy(u){if(/^https?:\/\//i.test(u))window.open(u,'_blank','noopener,noreferrer');else toast('Lien invalide')}function copyLink(){navigator.clipboard?.writeText(location.origin+'/'+profile.smartlink_slug);toast('Lien copié')}function openModal(){$('productModal').classList.add('on')}function closeModal(){$('productModal').classList.remove('on')}function logout(){db.auth.signOut().then(()=>location.reload())}
async function publicPage(){const slug=decodeURIComponent(location.pathname.replace(/^\//,'').replace(/\/$/,'')).trim();if(!slug||slug==='app-v6.html')return landing();const p=await db.from('profiles').select('*').eq('smartlink_slug',slug).maybeSingle();if(!p.data)return $('public').innerHTML='<main class="wrap hero"><h1>SmartLink introuvable</h1><p class="muted">Ce lien n’existe pas ou n’est plus disponible.</p></main>';profile=p.data;const a=await db.from('articles').select('*').eq('owner_slug',slug).order('created_at',{ascending:false});products=a.data||[];$('public').innerHTML=`<div class="nav"><div class="wrap navin"><div class="brand">Whats<b>Africa</b></div><button class="btn primary" onclick="openAuth('signup')">Créer mon SmartLink</button></div></div><main class="wrap"><section class="hero"><div class="ey">SMARTLINK · ${esc(profile.country||'AFRIQUE')}</div><h1>${esc(profile.display_name)}</h1><p>${esc(profile.bio||'Découvrez cette activité sur WhatsAfrica.')}</p></section><section class="section"><div class="ey">Catalogue</div><h2>Produits & services</h2>${products.length?`<div class="cards">${products.map(productCard).join('')}</div>`:'<div class="empty">Vitrine en préparation.</div>'}</section><section class="section"><div class="panel"><div class="ey">Votre assistant commercial</div><h2>Une question ?</h2><p class="muted">Aucun compte n'est nécessaire pour discuter avec l'assistant de ${esc(profile.display_name)}.</p><div id="publicChat" class="chat" style="height:320px;min-height:0"><div class="bubble theirs">Bonjour 👋 Je suis Votre assistant commercial. Que recherchez-vous ?</div></div><div class="composer"><input id="publicQ" placeholder="Ex. Combien coûte cet article ?" onkeydown="if(event.key==='Enter')publicAsk()"><button class="btn primary" onclick="publicAsk()">Envoyer</button></div></div></section></main>`;window.publicProducts=products}
function landing(){$('public').style.display='block';$('app').classList.remove('on');$('public').innerHTML=`<div class="nav"><div class="wrap navin"><div class="brand">Whats<b>Africa</b></div><div><button class="btn ghost" onclick="openAuth('login')">Se connecter</button> <button class="btn primary" onclick="openAuth('signup')">Créer mon espace</button></div></div></div><main class="wrap"><section class="hero"><div class="ey">RÉSEAU · SMARTLINK · COMMERCE</div><h1>Votre assistant commercial, ouvert au public.</h1><p>Les visiteurs découvrent votre activité, vos produits et parlent à <b>Votre assistant commercial</b> sans créer de compte. Les propriétaires gèrent leur espace avec email + mot de passe.</p><div class="actions"><button class="btn primary" onclick="openAuth('signup')">Créer mon SmartLink</button><button class="btn ghost" onclick="document.getElementById('discover').scrollIntoView({behavior:'smooth'})">Découvrir</button></div></section><section id="discover" class="section"><div class="grid"><div class="panel"><h3>🛍️ Vitrine publique</h3><p class="muted">Produits, services, prix et paiement externe.</p></div><div class="panel"><h3>🤖 Votre assistant commercial</h3><p class="muted">Le visiteur peut poser ses questions sans authentification.</p></div><div class="panel"><h3>🔐 Compte propriétaire</h3><p class="muted">Email + mot de passe uniquement pour gérer votre business.</p></div></div></section></main>`}
async function publicAsk(){const q=$('publicQ').value.trim();if(!q)return;$('publicQ').value='';const box=$('publicChat');box.insertAdjacentHTML('beforeend',`<div class="bubble mine">${esc(q)}</div><div id="typing" class="bubble theirs">…</div>`);try{const r=await fetch('/api/assistant',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q,history:[],business:{display_name:profile.display_name,country:profile.country,bio:profile.bio,smartlink_slug:profile.smartlink_slug,articles:window.publicProducts||[]}})},d=await r.json();$('typing')?.remove();box.insertAdjacentHTML('beforeend',`<div class="bubble theirs">${esc(d.answer||d.error||'Réponse indisponible.')}</div>`)}catch(e){$('typing')?.remove();box.insertAdjacentHTML('beforeend','<div class="bubble theirs">Connexion à l’assistant impossible.</div>')}box.scrollTop=box.scrollHeight}
