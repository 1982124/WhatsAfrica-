<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>WhatsAfrica — Inbox</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/wa-theme.js"></script><script src="/wa-i18n.js"></script><script src="/wa-accessibility.js"></script><script src="/wa-performance.js"></script><script src="/wa-network.js"></script><script src="/e2ee.js"></script><style>:root{--line:var(--wa-border,#26334c);--card:var(--wa-surface,#111827);--muted:var(--wa-muted,#98a5bb)}*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:var(--wa-background,var(--wa-bg,#090d17));color:var(--wa-text,#f8f5eb)}button,input{font:inherit}.wrap{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:14px}.brand{font-size:23px;font-weight:900}.brand b{color:var(--wa-primary,#e8a83c)}.grid{display:grid;grid-template-columns:320px 1fr;gap:14px;margin-top:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--wa-radius,16px);padding:14px;box-shadow:var(--wa-shadow,none)}.list{max-height:70vh;overflow:auto}.conv{padding:12px;border:1px solid transparent;border-radius:12px;cursor:pointer}.conv:hover,.conv.active{border-color:var(--line);background:var(--wa-surface-2,#0c1422)}.muted{color:var(--muted)}.messages{height:58vh;overflow:auto;padding:8px}.msg{max-width:78%;padding:9px 11px;border-radius:13px;margin:7px 0;background:#182338;white-space:pre-wrap;overflow-wrap:anywhere}.mine{margin-left:auto;background:#24344c}.composer{display:flex;gap:8px;margin-top:10px}.composer input{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--wa-surface-2,#0b1220);color:var(--wa-text,#fff)}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer;background:var(--wa-primary,#e8a83c);color:#101010}.ghost{background:transparent;color:inherit;border:1px solid var(--line)}.secure,.outbox{font-size:12px;color:var(--wa-muted,#98a5bb);margin-top:5px}.empty{display:grid;place-items:center;height:58vh;text-align:center}.status{margin-top:8px;min-height:20px}.err{color:#ff8f8f}.ok{color:#57d39b}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.network{display:none;margin-top:10px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--wa-surface-2,#0c1422)}.network.show{display:block}@media(max-width:760px){.grid{grid-template-columns:1fr}.list{max-height:32vh}.messages{height:52vh}.top{align-items:flex-start}.actions{justify-content:flex-end}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}</style></head><body><div class="wrap"><div class="top"><div class="brand">Whats<b>Africa</b> <span class="muted">/ Inbox</span></div><div class="actions"><button class="btn ghost" id="calls">📹 Appels</button><button class="btn ghost" id="logout">Déconnexion</button></div></div><div id="network" class="network" role="status" aria-live="polite"></div><div id="auth" class="card" style="margin-top:16px"><h2>Connexion requise</h2><p class="muted">Votre Inbox est privé et accessible après connexion.</p><button class="btn" id="goDashboard">Ouvrir le cockpit</button></div><main id="app" class="grid" style="display:none"><section class="card"><h2 style="margin-top:0">Conversations</h2><div id="conversations" class="list" aria-live="polite"></div></section><section class="card"><div id="empty" class="empty"><div><h2>Votre Inbox</h2><p class="muted">Sélectionnez une conversation pour commencer.</p></div></div><div id="chat" style="display:none"><div class="actions"><div style="flex:1"><h2 id="chatTitle" style="margin:4px 0"></h2><p id="chatMeta" class="muted"></p></div><button class="btn ghost" id="callCurrent">📞 Appeler</button></div><div id="secureBanner" class="secure" hidden>🔒 Chiffrement de bout en bout actif pour cette conversation</div><div id="messages" class="messages" aria-live="polite"></div><form id="composer" class="composer"><input id="body" maxlength="4000" autocomplete="off" placeholder="Écrire un message…" aria-label="Message"><button class="btn" id="send" type="submit">Envoyer</button></form><div id="outbox" class="outbox" aria-live="polite"></div><div id="status" class="status muted" role="status" aria-live="polite"></div></div></section></main></div><script>
const URL='https://dzifpwqrqnvssfhwjccj.supabase.co',KEY='sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV',db=supabase.createClient(URL,KEY),$=id=>document.getElementById(id);let user=null,current=null,channel=null,device=null,conversationKey=null,keyVersion=1,pendingMessageId=null,reconnectTimer=null;
function setStatus(t,k='muted'){$('status').textContent=t;$('status').className='status '+k;window.WA_A11Y?.announce?.(t)}
function setSecureState(active){$('secureBanner').hidden=!active}
function networkState(online){const n=$('network');n.textContent=online?'✓ Connexion rétablie. Synchronisation…':'⚠️ Hors connexion. Les messages déjà chiffrés restent en attente sur cet appareil.';n.classList.add('show');if($('status'))setStatus(online?'Connexion rétablie.':'Hors connexion.',online?'ok':'err');if(online){flushOutbox();if(current)loadMessages();setTimeout(()=>n.classList.remove('show'),2500)}}
async function updateOutbox(){const n=await WhatsAfricaCrypto.getOutboxCount().catch(()=>0);$('outbox').textContent=n?`📤 ${n} message${n>1?'s':''} en attente de synchronisation`:' '}
async function flushOutbox(){if(!WA_NETWORK.isOnline()||!user)return;const r=await WhatsAfricaCrypto.flushEncryptedOutbox(db,{conversationId:null}).catch(()=>({sent:0}));await updateOutbox();if(r.sent){setStatus(`${r.sent} message${r.sent>1?'s':''} synchronisé${r.sent>1?'s':''}.`,'ok');if(current)await loadMessages();if(current&&channel)channel.send({type:'broadcast',event:'message',payload:{conversation_id:current.id}}).catch(()=>{})}}
async function reconnect(){if(reconnectTimer||!current||!WA_NETWORK.isOnline())return;reconnectTimer=setTimeout(async()=>{reconnectTimer=null;if(channel)await db.removeChannel(channel).catch(()=>{});channel=db.channel('inbox-'+current.id,{config:{private:true}});channel.on('broadcast',{event:'message'},p=>{if(p.payload?.conversation_id===current.id)loadMessages()});const s=await channel.subscribe().catch(()=>null);if(s==='SUBSCRIBED'){setStatus('Temps réel reconnecté.','ok');await loadMessages()}else reconnect()},1000)}
async function boot(){networkState(WA_NETWORK.isOnline());const s=await db.auth.getSession();if(!s.data.session){$('auth').style.display='block';$('logout').style.display='none';return}user=s.data.session.user;try{device=await WhatsAfricaCrypto.registerDevice(db,user.id,'Web')}catch(e){console.warn('E2EE device registration unavailable',e)}$('auth').style.display='none';$('app').style.display='grid';await loadConversations();await flushOutbox();await updateOutbox();db.auth.onAuthStateChange(e=>{if(e==='SIGNED_OUT')location.reload()})}
async function loadConversations(){if(!WA_NETWORK.isOnline())return;const r=await WA_NETWORK.retry(()=>db.from('conversations').select('id,kind,title,owner_id,created_at').order('created_at',{ascending:false}).limit(100),{attempts:3});if(r.error){$('conversations').textContent='Impossible de charger les conversations.';return}const rows=r.data||[];$('conversations').innerHTML='';if(!rows.length){$('conversations').textContent='Aucune conversation pour le moment.';return}rows.forEach(c=>{const d=document.createElement('div');d.className='conv';d.tabIndex=0;d.setAttribute('role','button');d.textContent=c.title||'Conversation';d.onclick=()=>openConversation(c,d);d.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openConversation(c,d)}};$('conversations').appendChild(d)})}
async function provisionConversationKey(rawKey){if(!current||!device||!rawKey)return;const devs=await db.from('user_devices').select('id,user_id,identity_public_key').is('revoked_at',null);if(devs.error)throw devs.error;const members=await db.from('conversation_members').select('user_id').eq('conversation_id',current.id);if(members.error)throw members.error;const allowed=new Set((members.data||[]).map(m=>m.user_id));const targets=(devs.data||[]).filter(d=>allowed.has(d.user_id)&&d.identity_public_key);if(!targets.length)throw new Error('Aucun appareil autorisé dans cette conversation');await WhatsAfricaCrypto.createKeyEnvelopes(db,current.id,keyVersion,rawKey,targets.map(x=>x.id))}
async function claimConversationKeyInitializer(){const r=await db.rpc('claim_conversation_key_initializer',{p_conversation_id:current.id,p_key_version:keyVersion,p_device_id:device.deviceId});if(r.error)throw r.error;return r.data===true}
async function ensureConversationKey(){if(!current||!device)throw new Error('Appareil E2EE non enregistré');let local=await WhatsAfricaCrypto.loadConversationKey(current.id,keyVersion);if(local){await provisionConversationKey(local);return local}if(!WA_NETWORK.isOnline())throw new Error('Hors connexion : clé E2EE non disponible localement');let fetched=await WhatsAfricaCrypto.fetchConversationKey(db,current.id,device.deviceId,device.privateKey,keyVersion);if(fetched){await provisionConversationKey(fetched);return fetched}const mayInitialize=await claimConversationKeyInitializer();if(mayInitialize){const candidate=await WhatsAfricaCrypto.generateConversationKey();await provisionConversationKey(candidate);fetched=await WhatsAfricaCrypto.fetchConversationKey(db,current.id,device.deviceId,device.privateKey,keyVersion);if(fetched)return fetched;throw new Error('Clé de conversation non disponible après initialisation')}await new Promise(r=>setTimeout(r,1200));fetched=await WhatsAfricaCrypto.fetchConversationKey(db,current.id,device.deviceId,device.privateKey,keyVersion);if(fetched){await provisionConversationKey(fetched);return fetched}throw new Error('Cette conversation est en cours de sécurisation par un appareil déjà autorisé. Réessayez dans un instant')}
async function openConversation(c,node){document.querySelectorAll('.conv').forEach(x=>x.classList.remove('active'));node.classList.add('active');current=c;conversationKey=null;setSecureState(false);pendingMessageId=null;$('empty').style.display='none';$('chat').style.display='block';$('chatTitle').textContent=c.title||'Conversation';$('chatMeta').textContent=c.kind==='direct'?'Conversation privée':'Conversation';try{conversationKey=await ensureConversationKey();setSecureState(true);setStatus('🔒 E2EE prêt','ok')}catch(e){setSecureState(false);setStatus('Chiffrement indisponible : '+(e.message||'erreur'),'err')}await loadMessages();if(channel)await db.removeChannel(channel).catch(()=>{});if(!WA_NETWORK.isOnline())return;channel=db.channel('inbox-'+c.id,{config:{private:true}});channel.on('broadcast',{event:'message'},p=>{if(p.payload?.conversation_id===c.id)loadMessages()});const s=await channel.subscribe().catch(()=>null);if(s!=='SUBSCRIBED')reconnect();await updateOutbox()}
async function loadMessages(){if(!current||!WA_NETWORK.isOnline())return;const r=await WA_NETWORK.retry(()=>db.from('messages_v2').select('id,sender_id,body,message_type,created_at,encryption_version,ciphertext,encryption_metadata').eq('conversation_id',current.id).order('created_at',{ascending:true}).limit(200),{attempts:3});if(r.error){setStatus('Lecture impossible.','err');return}let rows=r.data||[];if(conversationKey)rows=await WhatsAfricaCrypto.decryptMessageRows(rows,conversationKey);const box=$('messages');box.innerHTML='';rows.forEach(m=>{const d=document.createElement('div');d.className='msg '+(m.sender_id===user.id?'mine':'');d.textContent=m.encryption_version===1?(m.decryption_error||m.body||'🔒 Message chiffré'):(m.body||'[message]');if(m.decryption_error)d.classList.add('muted');box.appendChild(d)});box.scrollTop=box.scrollHeight}
$('composer').onsubmit=async e=>{e.preventDefault();if(!current)return;const text=$('body').value.trim();if(!text)return;$('send').disabled=true;const id=pendingMessageId||crypto.randomUUID();pendingMessageId=id;try{if(!conversationKey)conversationKey=await ensureConversationKey();setSecureState(true);if(!WA_NETWORK.isOnline()){await WhatsAfricaCrypto.queueEncryptedMessage({conversationId:current.id,senderId:user.id,text,rawKey:conversationKey,keyVersion,messageType:'text',messageId:id});$('body').value='';pendingMessageId=null;await updateOutbox();setStatus('📤 Message chiffré mis en attente. Il sera envoyé au retour du réseau.','ok');return}await WhatsAfricaCrypto.sendEncryptedMessage(db,{conversationId:current.id,senderId:user.id,text,rawKey:conversationKey,keyVersion,messageType:'text',messageId:id});$('body').value='';pendingMessageId=null;setStatus('🔒 Message envoyé et chiffré.','ok');await loadMessages();if(current&&channel)await channel.send({type:'broadcast',event:'message',payload:{conversation_id:current.id}}).catch(()=>{})}catch(e){if(!WA_NETWORK.isOnline()){await WhatsAfricaCrypto.queueEncryptedMessage({conversationId:current.id,senderId:user.id,text,rawKey:conversationKey,keyVersion,messageType:'text',messageId:id});$('body').value='';pendingMessageId=null;await updateOutbox();setStatus('📤 Réseau perdu : message mis en attente.','ok')}else setStatus('Message non envoyé. Réessayez sans changer le contenu.','err')}finally{$('send').disabled=false;$('body').focus()}};
WA_NETWORK.onChange(networkState);$('calls').onclick=()=>location.href='/calls';$('callCurrent').onclick=()=>location.href='/calls?conversation='+encodeURIComponent(current?.id||'');$('goDashboard').onclick=()=>location.href='/dashboard';$('logout').onclick=()=>db.auth.signOut().then(()=>location.reload());boot();
</script></body></html>
