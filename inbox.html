<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WhatsAfrica — Inbox</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/wa-theme.js"></script><style>:root{--line:var(--wa-border,#26334c);--card:var(--wa-surface,#111827);--muted:var(--wa-muted,#98a5bb)}*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:var(--wa-bg,#090d17);color:var(--wa-text,#f8f5eb)}.wrap{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:14px}.brand{font-size:23px;font-weight:900}.brand b{color:var(--wa-primary,#e8a83c)}.grid{display:grid;grid-template-columns:320px 1fr;gap:14px;margin-top:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.list{max-height:70vh;overflow:auto}.conv{padding:12px;border:1px solid transparent;border-radius:12px;cursor:pointer}.conv:hover,.conv.active{border-color:var(--line);background:#0c1422}.muted{color:var(--muted)}.messages{height:58vh;overflow:auto;padding:8px}.msg{max-width:78%;padding:9px 11px;border-radius:13px;margin:7px 0;background:#182338}.mine{margin-left:auto;background:#24344c}.composer{display:flex;gap:8px;margin-top:10px}.composer input{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0b1220;color:#fff}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer;background:var(--wa-primary,#e8a83c);color:#101010}.ghost{background:transparent;color:inherit;border:1px solid var(--line)}.empty{display:grid;place-items:center;height:58vh;text-align:center}.status{margin-top:8px}.err{color:#ff8f8f}.ok{color:#57d39b}@media(max-width:760px){.grid{grid-template-columns:1fr}.list{max-height:32vh}.messages{height:52vh}}</style></head><body><div class="wrap"><div class="top"><div class="brand">Whats<b>Africa</b> <span class="muted">/ Inbox</span></div><div><button class="btn ghost" id="calls">📹 Appels</button> <button class="btn ghost" id="logout">Déconnexion</button></div></div><div id="auth" class="card" style="margin-top:16px"><h2>Connexion requise</h2><p class="muted">Votre Inbox est privé et accessible après connexion.</p><button class="btn" id="goDashboard">Ouvrir le cockpit</button></div><main id="app" class="grid" style="display:none"><section class="card"><h2 style="margin-top:0">Conversations</h2><div id="conversations" class="list"></div></section><section class="card"><div id="empty" class="empty"><div><h2>Votre Inbox</h2><p class="muted">Sélectionnez une conversation pour commencer.</p></div></div><div id="chat" style="display:none"><div id="chatHead"><h2 id="chatTitle" style="margin:4px 0"></h2><p id="chatMeta" class="muted"></p></div><div id="messages" class="messages"></div><form id="composer" class="composer"><input id="body" maxlength="4000" autocomplete="off" placeholder="Écrire un message…"><button class="btn" type="submit">Envoyer</button></form><div id="status" class="status muted"></div></div></section></main></div><script>const URL='https://dzifpwqrqnvssfhwjccj.supabase.co',KEY='sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV',db=supabase.createClient(URL,KEY),$=id=>document.getElementById(id);let user=null,current=null,channel=null;
async function boot(){const s=await db.auth.getSession();if(!s.data.session){$('auth').style.display='block';return}user=s.data.session.user;$('auth').style.display='none';$('app').style.display='grid';await loadConversations()}
async function loadConversations(){const r=await db.from('conversations').select('*').order('updated_at',{ascending:false});if(r.error){$('conversations').innerHTML='<p class="err">Impossible de charger les conversations.</p>';return}const rows=r.data||[];if(!rows.length){$('conversations').innerHTML='<p class="muted">Aucune conversation pour le moment.</p>';return}$('conversations').innerHTML='';rows.forEach(c=>{const d=document.createElement('div');d.className='conv';d.textContent=c.title||c.name||'Conversation';d.onclick=()=>openConversation(c,d);$('conversations').appendChild(d)})}
async function openConversation(c,node){document.querySelectorAll('.conv').forEach(x=>x.classList.remove('active'));node.classList.add('active');current=c;$('empty').style.display='none';$('chat').style.display='block';$('chatTitle').textContent=c.title||c.name||'Conversation';$('chatMeta').textContent='Conversation privée';await loadMessages();if(channel)await db.removeChannel(channel);channel=db.channel('inbox-'+c.id,{config:{private:true}});channel.on('broadcast',{event:'message'},payload=>{if(payload.payload?.conversation_id===c.id)loadMessages()});await channel.subscribe()}
async function loadMessages(){if(!current)return;const r=await db.from('messages_v2').select('id,sender_id,body,message_type,created_at,encryption_version,ciphertext,encryption_metadata').eq('conversation_id',current.id).order('created_at',{ascending:true}).limit(200);if(r.error){$('status').innerHTML='<span class="err">Lecture impossible.</span>';return}const box=$('messages');box.innerHTML='';(r.data||[]).forEach(m=>{const d=document.createElement('div');d.className='msg '+(m.sender_id===user.id?'mine':'');if(m.encryption_version===1)d.textContent='🔒 Message chiffré — déchiffrement E2EE à venir dans cet Inbox';else d.textContent=m.body||'[message]';box.appendChild(d)});box.scrollTop=box.scrollHeight}
$('composer').onsubmit=async e=>{e.preventDefault();if(!current)return;const text=$('body').value.trim();if(!text)return;const r=await db.from('messages_v2').insert({conversation_id:current.id,sender_id:user.id,body:text,message_type:'text',encryption_version:0});if(r.error){$('status').innerHTML='<span class="err">Envoi impossible.</span>';return}$('body').value='';$('status').innerHTML='<span class="ok">Message envoyé.</span>';await loadMessages();if(channel)await channel.send({type:'broadcast',event:'message',payload:{conversation_id:current.id}})};
$('calls').onclick=()=>location.href='/calls';$('goDashboard').onclick=()=>location.href='/dashboard';$('logout').onclick=()=>db.auth.signOut().then(()=>location.reload());boot();</script></body></html>
