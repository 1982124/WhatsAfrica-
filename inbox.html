<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WASSAFRICA — Messages</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f5f7f6;--card:#fff;--line:#dce5e1;--text:#17211b;--muted:#66756e;--primary:#e8a83c;--mine:#dcf8c6;--soft:#eef4f1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,sans-serif}.wrap{max-width:1100px;margin:auto;padding:10px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 2px}.brand{font-size:22px;font-weight:900}.hint,.status{color:var(--muted);font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:8px 0;padding:12px}.new{display:flex;gap:8px}.new input,.composer input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;color:inherit;font:inherit}.btn{border:0;border-radius:12px;padding:11px 14px;background:var(--primary);color:#17120b;font-weight:850;cursor:pointer}.ghost{background:transparent;border:1px solid var(--line);color:inherit}.layout{display:grid;grid-template-columns:300px 1fr;gap:10px}.list{max-height:68vh;overflow:auto}.conv{padding:12px;border-radius:12px;cursor:pointer}.conv:hover,.conv.sel{background:var(--soft)}.conv-title{font-weight:800}.conv-sub{font-size:12px;color:var(--muted);margin-top:3px}.chat{min-height:68vh;display:flex;flex-direction:column}.chathead{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:10px}.avatar{width:42px;height:42px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:900;flex:0 0 42px}.headmain{flex:1;min-width:0}.headmain b{overflow-wrap:anywhere}.messages{flex:1;min-height:52vh;max-height:62vh;overflow:auto;padding:10px 2px}.msg{max-width:82%;width:max-content;padding:9px 11px;border-radius:14px;background:#eef2f0;margin:6px 0;white-space:pre-wrap;overflow-wrap:anywhere}.msg.mine{margin-left:auto;background:var(--mine)}.time{font-size:10px;color:var(--muted);margin-top:3px;text-align:right}.empty{min-height:52vh;display:grid;place-items:center;text-align:center}.ok{color:#18845d}.err{color:#b42318}.loading{opacity:.7}@media(max-width:760px){.layout{grid-template-columns:1fr}.list{max-height:28vh}.chat{min-height:55vh}.messages{max-height:none;min-height:45vh}.msg{max-width:92%}.new input{font-size:16px}}
</style>
</head>
<body>
<div class="wrap">
 <div class="top"><div class="brand">WASSAFRICA <span class="hint">/ Messages</span></div><button id="logout" class="btn ghost">Déconnexion</button></div>
 <section class="card" id="gate"><b>💬 Messagerie</b><div id="gateText" class="hint" style="margin:6px 0">Vérification de votre session…</div><button id="login" class="btn" style="display:none">Se connecter</button></section>
 <main id="app" style="display:none">
  <section class="card"><b>✉️ Nouveau message</b><div class="new" style="margin-top:8px"><input id="phone" inputmode="tel" autocomplete="tel" placeholder="Numéro international, ex. +223…"><button id="start" class="btn">Démarrer</button></div><div id="status" class="status" style="margin-top:6px"></div></section>
  <div class="layout">
   <section class="card"><b>Conversations</b><div id="conversations" class="list" style="margin-top:6px"></div></section>
   <section class="card chat">
    <div id="empty" class="empty"><div><div style="font-size:52px">💬</div><h2>Votre messagerie</h2><p class="hint">Choisissez une conversation ou démarrez-en une avec un numéro WhatsAfrica.</p></div></div>
    <div id="chat" style="min-height:100%;display:none;flex-direction:column">
      <div class="chathead"><div id="avatar" class="avatar">W</div><div class="headmain"><b id="title">Conversation</b><div id="country" class="hint"></div></div><div id="secure" class="hint">🔒 E2EE</div></div>
      <div id="messages" class="messages"></div>
      <form id="composer" class="composer"><input id="body" maxlength="4000" autocomplete="off" placeholder="Écrire un message…"><button id="send" class="btn" aria-label="Envoyer">➤</button></form>
    </div>
   </section>
  </div>
 </main>
</div>
<script>
(function(){'use strict';
const SUPABASE_URL='https://dzifpwqrqnvssfhwjccj.supabase.co',SUPABASE_KEY='sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV',STORAGE_KEY='whatsafrica-auth';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.localStorage,storageKey:STORAGE_KEY}});
const $=id=>document.getElementById(id);let user=null,device=null,current=null,rawKey=null,realtime=null,devicePromise=null;
function setStatus(t,kind){const e=$('status');e.textContent=t;e.className='status '+(kind||'')}
function norm(v){let x=String(v||'').trim().replace(/[\s().-]/g,'');if(x.startsWith('00'))x='+'+x.slice(2);return /^\+[1-9][0-9]{7,14}$/.test(x)?x:null}
const te=new TextEncoder(),td=new TextDecoder();
function b64(a){let s='';new Uint8Array(a).forEach(b=>s+=String.fromCharCode(b));return btoa(s)}function ub64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function aes(raw){return crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['encrypt','decrypt'])}
async function encrypt(text,key,conv,id){const iv=crypto.getRandomValues(new Uint8Array(12)),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:te.encode('whatsafrica:v2:'+conv+':'+id)},await aes(key),te.encode(text)));return{ciphertext:b64(ct),metadata:{v:2,alg:'AES-256-GCM',iv:b64(iv),conversation_id:conv,message_id:id,key_version:1}}}
async function decrypt(row,key){const m=row.encryption_metadata||{};if(row.encryption_version!==1||!row.ciphertext||!m.iv)return null;const aad=(m.v||1)===1?'whatsafrica:v1:'+m.conversation_id:'whatsafrica:v2:'+m.conversation_id+':'+(m.message_id||row.id);return td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(m.iv),additionalData:te.encode(aad)},await aes(key),ub64(row.ciphertext)))}
function openVault(){return new Promise((res,rej)=>{const r=indexedDB.open('whatsafrica-crypto',3);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('keys'))d.createObjectStore('keys');if(!d.objectStoreNames.contains('outbox'))d.createObjectStore('outbox',{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function vaultGet(k){const d=await openVault();return new Promise((res,rej)=>{const t=d.transaction('keys','readonly'),r=t.objectStore('keys').get(k);r.onsuccess=()=>{d.close();res(r.result??null)};r.onerror=()=>{d.close();rej(r.error)}})}
async function vaultPut(k,v){const d=await openVault();return new Promise((res,rej)=>{const t=d.transaction('keys','readwrite');t.objectStore('keys').put(v,k);t.oncomplete=()=>{d.close();res(true)};t.onerror=()=>{d.close();rej(t.error)}})}
async function identity(){const saved=await vaultGet('identity-jwk');if(saved?.privateJwk&&saved?.publicJwk)return{publicJwk:saved.publicJwk,privateKey:await crypto.subtle.importKey('jwk',saved.privateJwk,{name:'RSA-OAEP',hash:'SHA-256'},true,['decrypt'])};const kp=await crypto.subtle.generateKey({name:'RSA-OAEP',modulusLength:2048,publicExponent:new Uint8Array([1,0,1]),hash:'SHA-256'},true,['encrypt','decrypt']);const publicJwk=await crypto.subtle.exportKey('jwk',kp.publicKey),privateJwk=await crypto.subtle.exportKey('jwk',kp.privateKey);await vaultPut('identity-jwk',{v:3,publicJwk,privateJwk});return{publicJwk,privateKey:kp.privateKey}}
async function ensureDevice(){if(device)return device;if(devicePromise)return devicePromise;devicePromise=(async()=>{const id=await identity();const existing=await db.from('user_devices').select('id,identity_public_key,device_label').eq('user_id',user.id).eq('device_label','Web').is('revoked_at',null).limit(20);if(existing.error)throw existing.error;let same=(existing.data||[]).find(x=>JSON.stringify(x.identity_public_key)===JSON.stringify(id.publicJwk));let r;if(same)r=await db.from('user_devices').update({last_seen_at:new Date().toISOString()}).eq('id',same.id).select('id,identity_public_key').single();else r=await db.from('user_devices').insert({user_id:user.id,device_label:'Web',identity_public_key:id.publicJwk,last_seen_at:new Date().toISOString()}).select('id,identity_public_key').single();if(r.error)throw r.error;device={deviceId:r.data.id,privateKey:id.privateKey,publicJwk:id.publicJwk};await vaultPut('device-id',{id:device.deviceId,userId:user.id,publicJwk:id.publicJwk});return device})().catch(e=>{devicePromise=null;throw e});return devicePromise}
async function saveKey(conv,key){await vaultPut('conversation-key:'+conv+':1',{v:3,conversationId:conv,keyVersion:1,raw:Array.from(key)});return key}
async function loadKey(conv){const x=await vaultGet('conversation-key:'+conv+':1');return x?.raw?Uint8Array.from(x.raw):null}
async function unwrap(wrapped,privateKey){return new Uint8Array(await crypto.subtle.decrypt({name:'RSA-OAEP'},privateKey,ub64(wrapped)))}
async function fetchKey(conv,d){const r=await db.from('conversation_key_envelopes').select('wrapped_key').eq('conversation_id',conv).eq('device_id',d.deviceId).eq('key_version',1).is('revoked_at',null).maybeSingle();if(r.error)throw r.error;if(!r.data)return null;return saveKey(conv,await unwrap(r.data.wrapped_key,d.privateKey))}
async function wrap(key,jwk){const k=await crypto.subtle.importKey('jwk',jwk,{name:'RSA-OAEP',hash:'SHA-256'},true,['encrypt']);return b64(await crypto.subtle.encrypt({name:'RSA-OAEP'},k,key))}
async function ensureKey(){if(!current)throw Error('CONVERSATION_REQUIRED');const d=await ensureDevice();rawKey=await loadKey(current.id);if(rawKey)return rawKey;rawKey=await fetchKey(current.id,d);if(rawKey)return rawKey;const claim=await db.rpc('claim_conversation_key_initializer',{p_conversation_id:current.id,p_key_version:1,p_device_id:d.deviceId});if(claim.error)throw claim.error;if(claim.data!==true)throw Error('E2EE_KEY_NOT_ON_THIS_DEVICE');const candidate=crypto.getRandomValues(new Uint8Array(32));const mem=await db.from('conversation_members').select('user_id').eq('conversation_id',current.id);if(mem.error)throw mem.error;const ids=[...new Set((mem.data||[]).map(x=>x.user_id))];const devices=[];for(const uid of ids){const q=await db.from('user_devices').select('id,user_id,identity_public_key').eq('user_id',uid).is('revoked_at',null).order('last_seen_at',{ascending:false}).limit(1);if(q.error)throw q.error;if(q.data?.[0]?.identity_public_key)devices.push(q.data[0]);}if(!devices.length)throw Error('NO_AUTHORIZED_DEVICE');const rows=[];for(const x of devices)rows.push({conversation_id:current.id,device_id:x.id,key_version:1,algorithm:'RSA-OAEP-2048-SHA256+AES-256-GCM',wrapped_key:await wrap(candidate,x.identity_public_key)});const ins=await db.from('conversation_key_envelopes').insert(rows);if(ins.error&&ins.error.code!=='23505')throw ins.error;rawKey=await fetchKey(current.id,d);if(!rawKey)throw Error('E2EE_KEY_CREATION_FAILED');return rawKey}
async function peerInfo(convId){const m=await db.from('conversation_members').select('user_id').eq('conversation_id',convId);if(m.error)throw m.error;const peer=(m.data||[]).map(x=>x.user_id).find(x=>x!==user.id);if(!peer)return null;const p=await db.from('profiles').select('user_id,display_name,public_display_name,country,avatar_url,profile_image_url,profile_photo_url').eq('user_id',peer).maybeSingle();const x=p.data||{};return{peer_id:peer,contact_name:x.public_display_name||x.display_name||'Membre WhatsAfrica',contact_country:x.country||'',contact_avatar:x.avatar_url||x.profile_image_url||x.profile_photo_url||''}}
async function startByPhone(){const phone=norm($('phone').value);if(!phone)return setStatus('Entrez un numéro international valide.','err');$('start').disabled=true;setStatus('Recherche du compte…');try{const r=await db.rpc('start_direct_conversation_by_phone',{p_phone:phone});if(r.error)throw r.error;const x=r.data?.[0];if(!x)throw Error('CONTACT_NOT_FOUND');await openConversation({id:x.conversation_id,kind:'direct',title:x.contact_name,contact_name:x.contact_name,contact_country:x.contact_country,contact_avatar:x.contact_avatar,peer_id:x.contact_user_id});setStatus('Conversation prête. Vous pouvez envoyer.','ok')}catch(e){const m=String(e.message||e);setStatus(m.includes('CONTACT_NOT_FOUND')?'Ce numéro n’a pas encore de compte WhatsAfrica.':m.includes('CANNOT_MESSAGE_SELF')?'Vous ne pouvez pas vous écrire à vous-même.':'Impossible de démarrer la conversation : '+m,'err')}finally{$('start').disabled=false}}
async function list(){const m=await db.from('conversation_members').select('conversation_id').eq('user_id',user.id);if(m.error)throw m.error;const ids=(m.data||[]).map(x=>x.conversation_id);const box=$('conversations');box.innerHTML='';if(!ids.length){box.innerHTML='<div class="hint" style="padding:10px">Aucune conversation.</div>';return}const c=await db.from('conversations').select('id,kind,title,created_at').in('id',ids).order('created_at',{ascending:false}).limit(100);if(c.error)throw c.error;for(const row of c.data||[]){const info=await peerInfo(row.id).catch(()=>null);const n=document.createElement('div');n.className='conv';n.dataset.id=row.id;n.innerHTML='<div class="conv-title"></div><div class="conv-sub">Conversation privée</div>';n.querySelector('.conv-title').textContent=info?.contact_name||row.title||'Conversation';n.onclick=()=>openConversation({...row,...info,title:info?.contact_name||row.title});box.appendChild(n)}}
async function openConversation(c){current=c;rawKey=null;$('empty').style.display='none';$('chat').style.display='flex';$('title').textContent=c.contact_name||c.title||'Conversation';$('country').textContent=c.contact_country||'Conversation privée';$('avatar').textContent=(c.contact_name||c.title||'W').slice(0,1).toUpperCase();$('avatar').style.backgroundImage=c.contact_avatar?'url("'+String(c.contact_avatar).replace(/["\\]/g,'')+'")':'none';document.querySelectorAll('.conv').forEach(n=>n.classList.toggle('sel',n.dataset.id===c.id));if(realtime)await db.removeChannel(realtime).catch(()=>{});realtime=db.channel('wa-msg-'+c.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages_v2',filter:'conversation_id=eq.'+c.id},()=>loadMessages().catch(()=>{})).subscribe();try{await ensureKey();await loadMessages();setStatus('🔒 Conversation chiffrée prête.','ok')}catch(e){$('messages').innerHTML='<div class="hint" style="padding:12px">La conversation est ouverte, mais la clé de chiffrement de cet appareil n’est pas encore disponible. Réessayez après connexion du correspondant.</div>';setStatus('E2EE : '+(e.message||'clé indisponible'),'err')}}
async function loadMessages(){if(!current)return;const k=rawKey||await ensureKey();const r=await db.from('messages_v2').select('id,sender_id,message_type,created_at,encryption_version,ciphertext,encryption_metadata').eq('conversation_id',current.id).order('created_at',{ascending:true}).limit(200);if(r.error)throw r.error;const box=$('messages');box.innerHTML='';for(const row of r.data||[]){const d=document.createElement('div');d.className='msg '+(row.sender_id===user.id?'mine':'');let text='🔒 Message chiffré';try{text=(await decrypt(row,k))||text}catch{}d.textContent=text;const t=document.createElement('div');t.className='time';t.textContent=new Date(row.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});d.appendChild(t);box.appendChild(d)}box.scrollTop=box.scrollHeight}
async function send(){const text=$('body').value.trim();if(!text||!current)return;const btn=$('send');btn.disabled=true;try{const k=await ensureKey(),id=crypto.randomUUID(),e=await encrypt(text,k,current.id,id);const r=await db.from('messages_v2').insert({id,conversation_id:current.id,sender_id:user.id,body:null,message_type:'text',encryption_version:1,ciphertext:e.ciphertext,encryption_metadata:e.metadata});if(r.error)throw r.error;$('body').value='';await loadMessages();setStatus('🔒 Message envoyé.','ok')}catch(e){setStatus('Message non envoyé : '+(e.message||e),'err')}finally{btn.disabled=false}}
async function boot(){try{const s=await db.auth.getSession();if(!s.data.session){$('gateText').textContent='Connectez-vous pour accéder à la messagerie.';$('login').style.display='inline-block';return}user=s.data.session.user;$('gate').style.display='none';$('app').style.display='block';setStatus('Messagerie prête.');ensureDevice().catch(()=>{});await list();setStatus('Messagerie prête.','ok')}catch(e){$('gateText').textContent='Erreur de démarrage : '+(e.message||e);$('gateText').className='hint err'}}
$('login').onclick=()=>location.href='/auth?next=/inbox';$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};$('start').onclick=startByPhone;$('phone').onkeydown=e=>{if(e.key==='Enter')startByPhone()};$('composer').onsubmit=e=>{e.preventDefault();send()};window.addEventListener('error',e=>{if($('status'))setStatus('Erreur technique : '+(e.message||'JavaScript'),'err')});boot();
})();
</script>
</body></html>
