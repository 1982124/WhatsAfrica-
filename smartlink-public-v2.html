el)}.ey{font:10px monospace;letter-spacing:2px;color:var(--wa-accent);font-weight:900}.h1{font:700 clamp(34px,6vw,58px)/1.02 Georgia;margin:9px 0}.tagline{font-size:19px;line-height:1.45}.muted{color:var(--wa-muted);line-height:1.6}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.section{margin:26px 0}.section h2{font:700 29px Georgia;margin:0 0 5px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{overflow:hidden}.media{height:210px;background:var(--wa-hero);display:grid;place-items:center;font-size:55px}.media img,.media video{width:100%;height:100%;object-fit:cover}.body{padding:15px}.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:color-mix(in srgb,var(--wa-accent) 16%,transparent);color:var(--wa-accent);font-size:10px;font-weight:900}.price{color:var(--wa-accent);font-size:19px;font-weight:950;margin:8px 0}.empty{padding:34px;text-align:center;border:1px dashed var(--wa-line);border-radius:16px;color:var(--wa-muted)}.cta{margin:28px 0;padding:22px;text-align:center}.status{min-height:24px;margin:12px 0;color:var(--wa-accent)}.footer{text-align:center;color:var(--wa-muted);padding:30px 0 45px;font-size:12px}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.wrap{padding:0 12px}.cover{height:190px}.grid{grid-template-columns:1fr}.actions .btn{width:100%}.navrow{padding:8px 0}}</style></head><body><header class="nav"><div class="wrap navrow"><a class="brand" href="/">Whats<b>Africa</b></a><a class="btn primary" id="joinTop">Ouvrir & rejoindre</a></div></header><main class="wrap" id="page"><div class="empty">Ouverture de la vitrine…</div></main><footer class="wrap footer">WhatsAfrica — Connecter l’Afrique. Ouvrir le monde.</footer><script>'use strict';const db=supabase.createClient('https://dzifpwqrqnvssfhwjccj.supabase.co','sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV'),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m])),safe=v=>{try{const u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:null}catch{return null}},money=(v,c)=>v==null?'Prix sur demande':new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0}).format(Number(v||0))+' '+(c||'XOF');const slug=decodeURIComponent(location.pathname.replace(/^\/+/, '').split('/')[0]||'');let link,business,products=[],services=[];async function visitorHash(){try{let x=sessionStorage.getItem('wa_visitor');if(!x){x=crypto.randomUUID();sessionStorage.setItem('wa_visitor',x)}const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(x));return Array.from(new Uint8Array(b)).map(n=>n.toString(16).padStart(2,'0')).join('')}catch{return null}}async function track(type,entityType=null,entityId=null,metadata={}){if(!link?.id)return;try{await db.from('smart_link_events').insert({smart_link_id:link.id,event_type:type,entity_type:entityType,entity_id:entityId,visitor_hash:await visitorHash(),metadata})}catch{}}function joinUrl(extra=''){return '/join.html?source=smartlink&next='+encodeURIComponent('/'+encodeURIComponent(slug)+(extra?'?'+extra:''))}function fail(t){$('page').innerHTML='<div class="empty"><h1>'+esc(t)+'</h1><p>Cette vitrine n’est pas disponible.</p><a class="btn primary" href="/">Découvrir WhatsAfrica</a></div>'}function product(p){const im=safe(p.image_url),v=safe(p.video_url);return '<article class="card"><div class="media">'+(v?'<video controls preload="metadata" poster="'+esc(im||'')+'" src="'+esc(v)+'"></video>':im?'<img loading="lazy" src="'+esc(im)+'" alt="'+esc(p.title)+'">':'📦')+'</div><div class="body"><span class="tag">'+(p.product_type==='digital'?'PRODUIT DIGITAL':'PRODUIT')+'</span><h3>'+esc(p.title)+'</h3><p class="muted">'+esc(p.description||'')+'</p><div class="price">'+money(p.price,p.currency)+'</div><div class="actions"><a class="btn primary" href="'+joinUrl('product='+encodeURIComponent(p.id))+'" data-join-product="'+esc(p.id)+'">🛒 Commander</a><button class="btn" data-share="'+esc(p.id)+'">↗️ Partager</button></div></div></article>'}function service(s){const m=s.metadata&&typeof s.metadata==='object'?s.metadata:{};const im=safe(m.image_url||m.image);return '<article class="card"><div class="media">'+(im?'<img src="'+esc(im)+'" alt="'+esc(s.title)+'">':'🧰')+'</div><div class="body"><span class="tag">SERVICE</span><h3>'+esc(s.title)+'</h3><p class="muted">'+esc(s.description||'Solution proposée par cette entreprise.')+'</p>'+(s.price!=null?'<div class="price">'+money(s.price,s.currency)+'</div>':'')+'<div class="actions"><a class="btn primary" href="'+joinUrl('service='+encodeURIComponent(s.id))+'">💬 Demander</a></div></div></article>'}function render(){const logo=safe(business.logo_url),cover=safe(business.cover_image_url)||logo;applyWhatsAfricaTheme(business.template||'business',business.accent_color||'');document.title=(business.name||link.title||'WhatsAfrica')+' — WhatsAfrica';$('joinTop').href=joinUrl();$('page').innerHTML='<section class="hero">'+(cover?'<img class="cover" src="'+esc(cover)+'" alt="'+esc(business.name||link.title)+'">':'')+'<div class="heroBody">'+(logo?'<img class="logo" src="'+esc(logo)+'" alt="Logo '+esc(business.name||link.title)+'">':'')+'<div class="ey">SMART LINK WHATS AFRICA</div><h1 class="h1">'+esc(business.name||link.title)+'</h1>'+(business.tagline?'<div class="tagline">'+esc(business.tagline)+'</div>':'')+'<p class="muted">'+esc(business.presentation||business.description||link.description||'Découvrez cette activité sur WhatsAfrica.')+'</p>'+(business.city||business.country?'<p class="muted">🌍 '+esc([business.city,business.country].filter(Boolean).join(' · '))+'</p>':'')+'<div class="actions"><a class="btn primary" id="joinHero" href="'+joinUrl()+'">🚀 Ouvrir & rejoindre</a><button class="btn" id="share">🔗 Partager</button></div><div id="status" class="status"></div></div></section><section class="section"><h2>🧰 Services & solutions</h2><p class="muted">Découvrez ce que cette activité peut vous proposer.</p><div class="grid">'+(services.length?services.map(service).join(''):'<div class="empty">Aucun service publié pour le moment.</div>')+'</div></section><section class="section"><h2>🛍️ Produits</h2><p class="muted">Produits physiques et digitaux présentés avec leur prix et leurs médias.</p><div class="grid">'+(products.length?products.map(product).join(''):'<div class="empty">Aucun produit publié pour le moment.</div>')+'</div></section><section class="cta"><h2>🌍 Découvrez WhatsAfrica</h2><p class="muted">Communiquez, découvrez des activités, créez votre identité et transformez les conversations en opportunités.</p><a class="btn primary" id="joinCta" href="'+joinUrl()+'">Créer gratuitement mon compte WhatsAfrica</a></section>';['joinTop','joinHero','joinCta'].forEach(id=>$(id).onclick=()=>track('join_cta_clicked','smart_link',link.id,{source:'smartlink'}));$('share').onclick=async()=>{try{if(navigator.share)await navigator.share({title:business.name||'WhatsAfrica',text:business.tagline||'Découvrez cette vitrine sur WhatsAfrica',url:location.href});else await navigator.clipboard.writeText(location.href);$('status').textContent='✓ Lien prêt à être partagé'}catch{}await track('smart_link_shared','smart_link',link.id)};document.querySelectorAll('[data-join-product]').forEach(a=>a.onclick=()=>track('product_join_clicked','product',a.dataset.joinProduct));document.querySelectorAll('[data-share]').forEach(b=>b.onclick=async()=>{await track('product_shared','product',b.dataset.share);try{if(navigator.share)await navigator.share({title:business.name||'WhatsAfrica',text:'Découvrez ce produit sur WhatsAfrica',url:location.href+'?product='+encodeURIComponent(b.dataset.share)});else await navigator.clipboard.writeText(location.href+'?product='+encodeURIComponent(b.dataset.share))}catch{}})}async function load(){if(!slug)return fail('Smart Link introuvable');const l=await db.from('smart_links').select('id,business_id,title,description,slug,is_public').eq('slug',slug).eq('is_public',true).maybeSingle();if(l.error||!l.data)return fail('Cette vitrine n’est pas disponible');link=l.data;const b=await db.from('businesses').select('*').eq('id',link.business_id).maybeSingle();business=b.data||{name:link.title,description:link.description,owner_id:null,template:'business'};const [p,s]=await Promise.all([db.from('products').select('id,title,description,price,currency,image_url,video_url,product_type,category,stock,is_published').eq('business_id',link.business_id).eq('is_published',true).order('created_at',{ascending:false}).limit(100),db.from('marketplace_services').select('id,title,description,category,price,currency,metadata,status').eq('seller_id',business.owner_id).eq('status','published').order('created_at',{ascending:false}).limit(100)]);products=p.data||[];services=s.data||[];await track('smart_link_opened','smart_link',link.id);render()}load().catch(()=>fail('Erreur temporaire. Réessayez.'));</script></body></html>
