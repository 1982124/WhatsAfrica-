<!doctype html>

<style>
:root{--bg:#f6f4ef;--ink:#171717;--muted:#6e6b65;--panel:#fff;--line:#e5e0d7;--accent:#126b4f;--accent2:#d8a73c;--dark:#10251e;--radius:24px;--shadow:0 20px 60px rgba(25,30,25,.10)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1180px;margin:auto;padding:0 22px}.nav{position:sticky;top:0;z-index:20;background:rgba(246,244,239,.86);backdrop-filter:blur(18px);border-bottom:1px solid rgba(229,224,215,.8)}.navrow{min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{font-weight:950;font-size:20px;letter-spacing:-.5px;text-decoration:none;color:var(--ink)}.brand b{color:var(--accent)}.navlinks{display:flex;align-items:center;gap:8px}.lang{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:9px 12px;font-weight:800;color:var(--ink)}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:12px 16px;border-radius:14px;text-decoration:none;font-weight:900;cursor:pointer;transition:.2s transform,.2s box-shadow}.btn:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(0,0,0,.08)}.primary{background:var(--accent);border-color:var(--accent);color:#fff}.hero{margin:22px 0 42px;overflow:hidden;border-radius:32px;background:var(--dark);color:#fff;box-shadow:var(--shadow)}.cover{width:100%;height:min(58vw,520px);min-height:260px;object-fit:cover;display:block;opacity:.88}.heroBody{padding:30px 34px 36px;position:relative}.logo{width:104px;height:104px;border-radius:24px;object-fit:cover;border:5px solid var(--dark);margin-top:-78px;position:relative;background:#fff}.ey{font-size:11px;letter-spacing:2.4px;font-weight:900;color:#d9c68f;margin-top:18px}.h1{font:700 clamp(42px,7vw,82px)/.98 Georgia,serif;letter-spacing:-2.5px;margin:10px 0 14px}.tagline{font:500 clamp(19px,2.4vw,27px)/1.35 Georgia,serif;max-width:760px}.muted{color:var(--muted)}.hero .muted{color:#cbd5d0;max-width:780px;font-size:16px}.hero .actions{margin-top:22px}.actions{display:flex;flex-wrap:wrap;gap:9px}.section{margin:48px 0}.sectionHead{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:18px}.section h2{font:700 clamp(29px,4vw,44px)/1.05 Georgia,serif;margin:0;letter-spacing:-1px}.sectionLead{max-width:650px;color:var(--muted);margin:7px 0 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(25,30,25,.05)}.media{height:250px;background:#eae6dd;display:grid;place-items:center;font-size:54px}.media img,.media video{width:100%;height:100%;object-fit:cover}.body{padding:19px}.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:#edf4f0;color:var(--accent);font-size:10px;font-weight:950;letter-spacing:.6px}.card h3{font-size:20px;line-height:1.2;margin:10px 0 7px}.price{font-size:20px;font-weight:950;color:var(--accent);margin:11px 0}.mini{font-size:13px;color:var(--muted)}.contact{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.contactCard,.assistant,.shareCard{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:25px;box-shadow:var(--shadow)}.contactTitle{font:700 28px Georgia,serif;margin:0 0 5px}.contactRole{color:var(--muted);margin-bottom:18px}.assistant{background:linear-gradient(135deg,#10251e,#1b4436);color:#fff}.assistant .muted{color:#cbd5d0}.assistantBadge{display:inline-flex;padding:6px 10px;border-radius:999px;background:#ffffff18;border:1px solid #ffffff22;font-weight:900;font-size:11px}.shareCard{background:linear-gradient(135deg,#fff,#f0eadc)}.shareCard h2{font:700 30px Georgia,serif;margin:0 0 7px}.shareCard p{max-width:680px;color:#625e55}.shareActions{display:flex;flex-wrap:wrap;gap:9px;margin-top:15px}.status{min-height:22px;margin-top:10px;color:var(--accent);font-weight:800}.empty{padding:36px;text-align:center;border:1px dashed var(--line);border-radius:22px;color:var(--muted);background:#ffffff70}.footer{text-align:center;color:var(--muted);padding:35px 0 55px;font-size:12px}.bottomShare{position:fixed;right:18px;bottom:18px;z-index:15;border-radius:999px;box-shadow:0 16px 38px rgba(0,0,0,.18)}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.contact{grid-template-columns:1fr}.navlinks .topJoin{display:none}}@media(max-width:560px){.wrap{padding:0 13px}.navrow{min-height:62px}.lang{padding:8px 9px}.cover{height:240px}.heroBody{padding:24px 20px 28px}.logo{width:82px;height:82px;margin-top:-55px;border-radius:20px}.h1{font-size:45px;letter-spacing:-1.5px}.grid{grid-template-columns:1fr}.section{margin:36px 0}.sectionHead{display:block}.actions .btn{width:100%}.contactCard,.assistant,.shareCard{padding:21px}.bottomShare{left:13px;right:13px;bottom:13px;width:auto}}
</style>
<script src="/brand-normalizer.js"></script>
</head>
<body>
<header class="nav"><div class="wrap navrow"><a class="brand" href="/">Whats<b>Africa</b></a><div class="navlinks"><select class="lang" id="language" aria-label="Langue"><option value="fr">🇫🇷 Français</option><option value="en">🇬🇧 English</option><option value="pt">🇵🇹 Português</option><option value="es">🇪🇸 Español</option><option value="ar">🇸🇦 العربية</option></select><a class="btn primary topJoin" href="/auth?next=/smartlink">Créer mon Smart Link</a></div></div></header>
<main class="wrap" id="page"><div class="empty">Ouverture de la vitrine…</div></main>
<footer class="wrap footer">WhatsAfrica — Connecter l’Afrique. Ouvrir le monde.</footer>
<button class="btn primary bottomShare" id="floatingShare">🌍 Faire connaître WhatsAfrica</button>
<script>
'use strict';
const db=supabase.createClient('https://dzifpwqrqnvssfhwjccj.supabase.co','sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV');
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
const safe=v=>{try{const u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:null}catch{return null}};
const money=(v,c)=>v==null?'Prix sur demande':new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0}).format(Number(v||0))+' '+(c||'XOF');
const slug=decodeURIComponent(location.pathname.replace(/^\/+/, '').split('/')[0]||'');
let link,business,products=[],services=[];
const copy={fr:{hero:'Découvrez cette activité',products:'Produits',services:'Services & solutions',contact:'Contacter',assistant:'Votre assistante',shareTitle:'🌍 Faites avancer l’Afrique',shareText:'Faites connaître WhatsAfrica autour de vous.',shareBtn:'↗ Partager WhatsAfrica',activityShare:'↗ Partager cette activité',call:'📞 Appeler',message:'💬 Parler',video:'📹 Appel vidéo',discover:'Découvrir'},en:{hero:'Discover this activity',products:'Products',services:'Services & solutions',contact:'Contact',assistant:'Your assistant',shareTitle:'🌍 Move Africa forward',shareText:'Help spread the word about WhatsAfrica.',shareBtn:'↗ Share WhatsAfrica',activityShare:'↗ Share this activity',call:'📞 Call',message:'💬 Chat',video:'📹 Video call',discover:'Discover'},pt:{hero:'Descubra esta atividade',products:'Produtos',services:'Serviços e soluções',contact:'Contactar',assistant:'A sua assistente',shareTitle:'🌍 Fazer a África avançar',shareText:'Ajude a divulgar o WhatsAfrica.',shareBtn:'↗ Partilhar WhatsAfrica',activityShare:'↗ Partilhar esta atividade',call:'📞 Ligar',message:'💬 Conversar',video:'📹 Videochamada',discover:'Descobrir'},es:{hero:'Descubre esta actividad',products:'Productos',services:'Servicios y soluciones',contact:'Contacto',assistant:'Tu asistente',shareTitle:'🌍 Hacer avanzar África',shareText:'Ayuda a dar a conocer WhatsAfrica.',shareBtn:'↗ Compartir WhatsAfrica',activityShare:'↗ Compartir esta actividad',call:'📞 Llamar',message:'💬 Hablar',video:'📹 Videollamada',discover:'Descubrir'},ar:{hero:'اكتشف هذا النشاط',products:'المنتجات',services:'الخدمات والحلول',contact:'تواصل',assistant:'مساعدتك',shareTitle:'🌍 لنجعل أفريقيا تتقدم',shareText:'ساهم في التعريف بـ WhatsAfrica.',shareBtn:'↗ مشاركة WhatsAfrica',activityShare:'↗ مشاركة هذا النشاط',call:'📞 اتصال',message:'💬 محادثة',video:'📹 مكالمة فيديو',discover:'اكتشف'}};
let lang='fr';
async function visitorHash(){try{let x=sessionStorage.getItem('wa_visitor');if(!x){x=crypto.randomUUID();sessionStorage.setItem('wa_visitor',x)}const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(x));return Array.from(new Uint8Array(b)).map(n=>n.toString(16).padStart(2,'0')).join('')}catch{return null}}
async function track(type,entityType=null,entityId=null,metadata={}){if(!link?.id)return;try{await db.from('smart_link_events').insert({smart_link_id:link.id,event_type:type,entity_type:entityType,entity_id:entityId,visitor_hash:await visitorHash(),metadata})}catch{}}
async function shareActivity(){await track('activity_shared','smart_link',link?.id);try{if(navigator.share)await navigator.share({title:business?.name||'WhatsAfrica',text:business?.share_message||`Découvrez ${business?.name||'cette activité'} sur WhatsAfrica. 🌍`,url:location.href});else{await navigator.clipboard.writeText(location.href);alert('Lien de l’activité copié.')}}catch{}}
async function shareWhatsAfrica(){await track('share_whatsapp','smart_link',link?.id);const url=location.origin;const text=`🌍 ${copy[lang].shareText}\n${url}`;try{if(navigator.share)await navigator.share({title:'WhatsAfrica',text,url});else{await navigator.clipboard.writeText(text);alert('Message de partage WhatsAfrica copié.')}}catch{}}
function contactOwner(kind){const phone=(business?.phone||'').trim();if(kind==='call'&&phone){track('phone_call_click','business',business.id);location.href='tel:'+phone;return}if(kind==='message'){track('message_click','business',business.id);location.href='/auth?next='+encodeURIComponent('/inbox?business='+business.id);return}if(kind==='video'){track('video_call_click','business',business.id);location.href='/calls?business='+business.id;return}}
function product(p){const im=safe(p.image_url),v=safe(p.video_url);return `<article class="card"><div class="media">${v?`<video controls preload="metadata" poster="${esc(im||'')}" src="${esc(v)}"></video>`:im?`<img loading="lazy" src="${esc(im)}" alt="${esc(p.title)}">`:'📦'}</div><div class="body"><span class="tag">${p.product_type==='digital'?'PRODUIT DIGITAL':'PRODUIT'}</span><h3>${esc(p.title)}</h3><p class="mini">${esc(p.description||'')}</p><div class="price">${money(p.price,p.currency)}</div><div class="actions"><a class="btn primary" href="/auth?next=${encodeURIComponent('/inbox?business='+business.id+'&product='+p.id)}" data-product-contact="${esc(p.id)}">💬 Commander</a><button class="btn" data-product-share="${esc(p.id)}">↗ Partager</button></div></div></article>`}
function service(s){const m=s.metadata&&typeof s.metadata==='object'?s.metadata:{};const im=safe(m.image_url||m.image);return `<article class="card"><div class="media">${im?`<img loading="lazy" src="${esc(im)}" alt="${esc(s.title)}">`:'🧰'}</div><div class="body"><span class="tag">SERVICE</span><h3>${esc(s.title)}</h3><p class="mini">${esc(s.description||'Solution proposée par cette activité.')}</p>${s.price!=null?`<div class="price">${money(s.price,s.currency)}</div>`:''}<div class="actions"><button class="btn primary" data-service="${esc(s.id)}">💬 Demander</button></div></div></article>`}
function render(){const c=copy[lang]||copy.fr;const logo=safe(business.logo_url),cover=safe(business.cover_image_url)||logo;try{applyWhatsAfricaTheme(business.template||'business',business.accent_color||'')}catch{}document.title=(business.name||link.title||'WhatsAfrica')+' — WhatsAfrica';$('page').innerHTML=`<section class="hero">${cover?`<img class="cover" src="${esc(cover)}" alt="${esc(business.name||link.title)}">`:''}<div class="heroBody">${logo?`<img class="logo" src="${esc(logo)}" alt="Logo ${esc(business.name||link.title)}">`:''}<div class="ey">${esc(c.hero.toUpperCase())}</div><h1 class="h1">${esc(business.name||link.title)}</h1>${business.tagline?`<div class="tagline">${esc(business.tagline)}</div>`:''}<p class="muted">${esc(business.presentation||business.description||link.description||'')}</p>${business.city||business.country?`<p class="muted">🌍 ${esc([business.city,business.country].filter(Boolean).join(' · '))}</p>`:''}<div class="actions"><a class="btn primary" href="#offers">${c.discover} ↓</a><button class="btn" id="heroShare">${c.activityShare}</button></div></div></section>
<section class="section" id="offers"><div class="sectionHead"><div><h2>${esc(c.services)}</h2><p class="sectionLead">Des offres présentées clairement pour vous aider à choisir et passer à l’action.</p></div></div><div class="grid">${services.length?services.map(service).join(''):'<div class="empty">Aucun service publié pour le moment.</div>'}</div></section>
<section class="section"><div class="sectionHead"><div><h2>${esc(c.products)}</h2><p class="sectionLead">Découvrez les produits, leurs caractéristiques et leurs prix lorsqu’ils sont disponibles.</p></div></div><div class="grid">${products.length?products.map(product).join(''):'<div class="empty">Aucun produit publié pour le moment.</div>'}</div></section>
<section class="section contact"><div class="contactCard"><div class="ey">${esc(c.contact.toUpperCase())}</div><h2 class="contactTitle">${esc(business.contact_name||business.name||'Responsable')}</h2><div class="contactRole">${esc(business.contact_role||'Propriétaire / responsable de l’activité')}</div><div class="actions"><button class="btn primary" id="callBtn">${c.call}</button><button class="btn" id="messageBtn">${c.message}</button><button class="btn" id="videoBtn">${c.video}</button></div><div id="contactStatus" class="status"></div></div><div class="assistant"><span class="assistantBadge">✨ IA</span><h2 class="contactTitle">${esc(business.assistant_name||'Votre assistante')}</h2><p class="muted">Posez vos questions sur les produits, services et informations publiées par cette activité.</p><button class="btn" id="assistantBtn">💬 Poser une question</button></div></section>
<section class="section"><div class="shareCard"><h2>${esc(c.shareTitle)}</h2><p>${esc(c.shareText)} Chaque Smart Link peut devenir une nouvelle porte d’entrée vers l’économie numérique africaine.</p><div class="shareActions"><button class="btn primary" id="shareWA">${c.shareBtn}</button><button class="btn" id="shareActivity">${c.activityShare}</button></div><div id="shareStatus" class="status"></div></div></section>`;
$('heroShare').onclick=shareActivity;$('shareActivity').onclick=shareActivity;$('shareWA').onclick=shareWhatsAfrica;$('floatingShare').onclick=shareWhatsAfrica;$('callBtn').onclick=()=>contactOwner('call');$('messageBtn').onclick=()=>contactOwner('message');$('videoBtn').onclick=()=>contactOwner('video');$('assistantBtn').onclick=()=>{track('assistant_open','business',business.id);location.href='/auth?next='+encodeURIComponent('/inbox?business='+business.id+'&assistant=1')};document.querySelectorAll('[data-product-share]').forEach(b=>b.onclick=async()=>{await track('product_shared','product',b.dataset.productShare);try{const u=location.href.split('?')[0]+'?product='+encodeURIComponent(b.dataset.productShare);if(navigator.share)await navigator.share({title:business.name,text:`Découvrez ${business.name} sur WhatsAfrica`,url:u});else{await navigator.clipboard.writeText(u);$('shareStatus').textContent='✓ Lien produit copié.'}}catch{}});document.querySelectorAll('[data-product-contact]').forEach(a=>a.onclick=()=>track('product_contact_clicked','product',a.dataset.productContact));document.querySelectorAll('[data-service]').forEach(b=>b.onclick=()=>{track('service_contact_clicked','service',b.dataset.service);location.href='/auth?next='+encodeURIComponent('/inbox?business='+business.id+'&service='+b.dataset.service)});}
async function load(){if(!slug)return fail('Smart Link introuvable');const l=await db.from('smart_links').select('id,business_id,title,description,slug,is_public,share_message,visitor_languages').eq('slug',slug).eq('is_public',true).maybeSingle();if(l.error||!l.data)return fail('Cette vitrine n’est pas disponible');link=l.data;const b=await db.from('businesses').select('*').eq('id',link.business_id).maybeSingle();business=b.data||{name:link.title,description:link.description,owner_id:null,template:'business'};if(link.share_message&&!business.share_message)business.share_message=link.share_message;const [p,s]=await Promise.all([db.from('products').select('id,title,description,price,currency,image_url,video_url,product_type,category,stock,is_published').eq('business_id',link.business_id).eq('is_published',true).order('created_at',{ascending:false}).limit(100),db.from('marketplace_services').select('id,title,description,category,price,currency,metadata,status').eq('seller_id',business.owner_id).eq('status','published').order('created_at',{ascending:false}).limit(100)]);products=p.data||[];services=s.data||[];await track('smart_link_opened','smart_link',link.id);render()}
function fail(t){$('page').innerHTML=`<div class="empty"><h1>${esc(t)}</h1><p>Cette vitrine n’est pas disponible.</p><a class="btn primary" href="/">Découvrir WhatsAfrica</a></div>`}
$('language').onchange=e=>{lang=e.target.value;localStorage.setItem('wa_smartlink_lang',lang);render()};lang=localStorage.getItem('wa_smartlink_lang')||'fr';$('language').value=lang;load().catch(()=>fail('Erreur temporaire. Réessayez.'));
</script>
</body>
