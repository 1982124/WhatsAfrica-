<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#075e54"><title>Communauté — WASSAFRICA</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--g:#075e54;--deep:#062e20;--bg:#f6f8f5;--card:#fff;--ink:#172019;--muted:#68746e;--line:#dfe7e1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,sans-serif}.wrap{max-width:900px;margin:auto;padding:16px}.top{background:var(--deep);color:#fff}.topin{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{color:#fff;text-decoration:none;font-size:22px;font-weight:950}.brand b{color:#e7b735}.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 13px;font-weight:850;cursor:pointer;text-decoration:none;color:var(--ink);display:inline-flex;justify-content:center}.primary{background:var(--g);border-color:var(--g);color:#fff}.hero{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden}.hero img{width:100%;height:300px;object-fit:cover;display:block}.body{padding:20px}.pill{font-size:11px;font-weight:900;color:var(--g)}h1{font:800 clamp(34px,7vw,54px)/1 Georgia,serif;margin:8px 0}.muted{color:var(--muted);line-height:1.55}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.postbox,.post{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}.postbox textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:12px;padding:11px;font:inherit;box-sizing:border-box}.postbox button{margin-top:9px}.post time{display:block;color:var(--muted);font-size:12px;margin-top:8px}.hide{display:none!important}.status{min-height:22px;margin-top:8px}.err{color:#a32121;font-weight:800}.ok{color:#087b45;font-weight:800}@media(max-width:560px){.wrap{padding:12px}.hero img{height:230px}.actions .btn{width:100%}}</style><script src="/brand-normalizer.js"></script>
</head><body><header class="top"><div class="wrap topin"><a class="brand" href="/">WASSAFRICA</a><a class="btn" href="/groups">← Communautés</a></div></header><main class="wrap"><section id="hero" class="hero"><div class="body">Chargement…</div></section><section id="composer" class="postbox hide"><b>💬 Participer à la discussion</b><textarea id="body" maxlength="4000" placeholder="Écrivez un message à la communauté…"></textarea><button id="publish" class="btn primary">Publier</button><div id="status" class="status muted"></div></section><section><h2>Discussion</h2><div id="posts"><div class="post muted">Chargement…</div></div></section></main><script>const db=supabase.createClient('https://dzifpwqrqnvssfhwjccj.supabase.co','sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV'),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));const id=location.pathname.split('/').filter(Boolean).pop();let user=null,joined=false;async function session(){const r=await db.auth.getSession();return r.data.session}async function load(){if(!id)throw Error('Communauté introuvable.');const g=await db.from('groups').select('id,name,description,is_business,owner_slug,image_url,image_alt').eq('id',id).maybeSingle();if(g.error)throw g.error;if(!g.data)throw Error('Communauté introuvable.');const x=g.data;s('hero').innerHTML=`${x.image_url?`<img src="${esc(x.image_url)}" alt="${esc(x.image_alt||x.name)}">`:''}<div class="body"><span class="pill">${x.is_business?'💼 Communauté business':'👥 Communauté'}</span><h1>${esc(x.name)}</h1><p class="muted">${esc(x.description||'Un espace WhatsAfrica pour échanger et avancer ensemble.')}</p><div class="muted">Créée par ${esc(x.owner_slug||'un membre WhatsAfrica')}</div><div class="actions"><button id="join" class="btn primary">Rejoindre la communauté</button><button id="share" class="btn">↗️ Partager</button></div><div id="heroStatus" class="status muted"></div></div>`;const u=await session();user=u?.user||null;if(user){const m=await db.from('group_members').select('user_id').eq('group_id',id).eq('user_id',user.id).maybeSingle();joined=!!m.data;if(joined){$('join').textContent='✓ Vous êtes membre';$('join').disabled=true;$('composer').classList.remove('hide')}}$('join').onclick=async()=>{const s=await session();if(!s){location.href='/auth?next='+encodeURIComponent(location.pathname);return}const r=await db.from('group_members').insert({group_id:id,user_id:s.user.id,role:'member'});if(r.error&&!String(r.error.message).toLowerCase().includes('duplicate')){$('heroStatus').textContent='Impossible de rejoindre : '+r.error.message;$('heroStatus').className='status err';return}joined=true;$('join').textContent='✓ Vous êtes membre';$('join').disabled=true;$('composer').classList.remove('hide');await loadPosts()};$('share').onclick=async()=>{try{if(navigator.share)await navigator.share({title:x.name,text:x.description||'Communauté WhatsAfrica',url:location.href});else{await navigator.clipboard.writeText(location.href);$('heroStatus').textContent='✓ Lien copié';$('heroStatus').className='status ok'}}catch(e){}};await loadPosts()}async function loadPosts(){const r=await db.from('group_posts').select('id,body,created_at').eq('group_id',id).order('created_at',{ascending:false}).limit(50);if(r.error){$('posts').innerHTML='<div class="post err">Discussion momentanément indisponible.</div>';return}$('posts').innerHTML=r.data?.length?r.data.map(p=>`<article class="post"><div>${esc(p.body)}</div><time>${new Date(p.created_at).toLocaleString('fr-FR')}</time></article>`).join(''):'<div class="post muted">Aucun message pour le moment. Soyez le premier à lancer la discussion.</div>'}$('publish').onclick=async()=>{const s=await session();const text=$('body').value.trim();if(!s){location.href='/auth?next='+encodeURIComponent(location.pathname);return}if(!joined||!text)return;$('publish').disabled=true;$('status').textContent='Publication…';const r=await db.from('group_posts').insert({group_id:id,author_id:s.user.id,body:text});if(r.error){$('status').textContent='Impossible de publier : '+r.error.message;$('status').className='status err'}else{$('body').value='';$('status').textContent='✓ Message publié';$('status').className='status ok';await loadPosts()}$('publish').disabled=false};function s(id){return $(id)}load().catch(e=>{$('hero').innerHTML='<div class="body"><b>Communauté introuvable.</b><p><a class="btn primary" href="/groups">Retour aux communautés</a></p></div>'})</script></body></html>
