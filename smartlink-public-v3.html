<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#163A72">
<meta name="description" content="WASSAFRICA — découvrez, discutez et faites des affaires depuis un seul lien.">
<meta property="og:title" content="WASSAFRICA — Découvrez. Discutez. Faites des affaires.">
<meta property="og:description" content="Une vitrine commerciale, des produits, des services et une conversation directe.">
<title>WASSAFRICA — Smart Link</title>
<script src="https://cdn.jsdelivr.net/gh/1982124/WhatsAfrica-@main/wa-themes.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/brand-normalizer.js"></script><script src="/brand-observer.js"></script>
<style>
:root{--navy:#0D1B3D;--blue:#1E40AF;--electric:#2563EB;--orange:#F59E0B;--gold:#FFC107;--ink:#101828;--muted:#667085;--bg:#F5F7FB;--panel:#fff;--line:#E5EAF2;--radius:24px;--shadow:0 20px 60px rgba(13,27,61,.12)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1180px;margin:auto;padding:0 20px}.nav{position:sticky;top:0;z-index:50;background:#fffdeeff;backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.navrow{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:1000;font-size:21px;letter-spacing:-.7px;text-decoration:none;color:var(--navy)}.brand span{color:var(--orange)}.navlinks{display:flex;gap:8px;align-items:center}.lang,.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;padding:11px 14px;font-weight:850}.lang{border-radius:999px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;cursor:pointer;transition:.18s}.btn:hover{transform:translateY(-1px);box-shadow:0 10px 25px #0d1b3d18}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.orange{background:var(--orange);border-color:var(--orange);color:#0D1B3D}.hero{margin:22px 0 44px;border-radius:32px;overflow:hidden;background:linear-gradient(135deg,#0D1B3D,#163A72 62%,#2563EB);color:#fff;box-shadow:var(--shadow);position:relative}.heroGrid{display:grid;grid-template-columns:1.15fr .85fr;gap:20px;align-items:center;padding:44px}.eyebrow{font-size:11px;letter-spacing:2.5px;font-weight:950;color:#FFD166;text-transform:uppercase}.hero h1{font:800 clamp(42px,7vw,76px)/.98 Georgia,serif;letter-spacing:-2.8px;margin:10px 0 16px}.hero h1 span{color:#F59E0B}.lead{font-size:20px;max-width:680px;color:#E7EDF9}.heroActions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}.heroActions .btn{min-width:170px}.heroArt{display:grid;place-items:center;min-height:330px}.bubbleArt{width:min(100%,390px);aspect-ratio:1;border-radius:42px;background:linear-gradient(145deg,#2563EB,#163A72);display:grid;place-items:center;box-shadow:0 30px 80px #0005;position:relative}.bubbleArt:after{content:"";position:absolute;bottom:26px;left:36px;width:100px;height:38px;border-radius:0 0 45px 45px;background:#F59E0B;transform:skewX(-24deg)}.bubbleArt svg{width:58%;position:relative;z-index:2}.trust{display:flex;gap:14px;flex-wrap:wrap;margin-top:25px;color:#D7E2F5;font-size:13px}.trust b{color:#fff}.section{margin:52px 0}.sectionHead{margin-bottom:20px}.section h2{font:750 clamp(30px,4vw,46px)/1.05 Georgia,serif;margin:0;letter-spacing:-1px}.sectionLead{max-width:760px;color:var(--muted);margin:8px 0 0;font-size:16px}.valueGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.value{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 10px 30px #0d1b3d08}.valueArt{height:120px;border-radius:18px;background:linear-gradient(135deg,#eef4ff,#f9fbff);display:grid;place-items:center;margin-bottom:16px}.valueArt svg{width:90px;height:90px}.value h3{margin:0 0 7px;font-size:20px}.value p{margin:0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 10px 30px #0d1b3d08}.media{height:230px;background:#EDF2FA;display:grid;place-items:center;font-size:55px}.media img,.media video{width:100%;height:100%;object-fit:cover}.body{padding:19px}.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:#EAF1FF;color:#1E40AF;font-size:10px;font-weight:950;letter-spacing:.6px}.card h3{font-size:20px;line-height:1.2;margin:10px 0 7px}.mini{font-size:13px;color:var(--muted)}.price{font-size:20px;font-weight:950;color:#1E40AF;margin:11px 0}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}.actions .btn{flex:1;min-width:135px}.empty{padding:30px;text-align:center;border:1px dashed #CBD5E1;border-radius:20px;color:var(--muted);background:#fff}.contact{display:grid;grid-template-columns:1fr 1fr;gap:18px}.contactCard,.assistant,.shareCard{border-radius:24px;padding:26px;border:1px solid var(--line);box-shadow:var(--shadow)}.contactCard{background:#fff}.assistant{background:linear-gradient(135deg,#0D1B3D,#163A72);color:#fff}.assistant .muted{color:#D7E2F5}.assistant h2,.shareCard h2{font:750 30px Georgia,serif;margin:8px 0}.assistantBadge{display:inline-flex;padding:6px 10px;border-radius:999px;background:#ffffff18;border:1px solid #ffffff22;font-weight:900;font-size:11px}.shareCard{background:linear-gradient(135deg,#fff,#FFF7E8)}.shareCard p{color:#625e55}.benefitList{display:grid;gap:10px;margin:18px 0}.benefit{display:flex;gap:10px;align-items:flex-start}.benefit i{font-style:normal;font-size:20px}.footer{text-align:center;color:#667085;padding:35px 0 70px;font-size:12px}.bottom{position:fixed;right:18px;bottom:18px;z-index:40;border-radius:999px;box-shadow:0 16px 38px #0003}.status{margin:12px 0;color:#1E40AF;font-weight:800}@media(max-width:850px){.heroGrid{grid-template-columns:1fr;padding:32px}.heroArt{min-height:260px}.valueGrid,.grid{grid-template-columns:1fr 1fr}.contact{grid-template-columns:1fr}}@media(max-width:560px){.wrap{padding:0 13px}.navrow{min-height:62px}.topJoin{display:none}.hero{border-radius:24px}.heroGrid{padding:25px 20px}.hero h1{font-size:47px}.lead{font-size:18px}.heroActions .btn{width:100%}.bubbleArt{max-width:290px}.valueGrid,.grid{grid-template-columns:1fr}.section{margin:38px 0}.contactCard,.assistant,.shareCard{padding:21px}.bottom{left:13px;right:13px;bottom:13px;width:auto}}
</style>
</head>
<body>
<header class="nav"><div class="wrap navrow"><a class="brand" href="/">WASSA<span>FRICA</span></a><div class="navlinks"><select class="lang" id="language" aria-label="Langue"><option>🇫🇷 Français</option><option>🇬🇧 English</option><option>🇵🇹 Português</option><option>🇪🇸 Español</option><option>🇸🇦 العربية</option></select><a class="btn primary topJoin" href="/auth?next=/smartlink">Créer mon Smart Link</a></div></div></header>
<main class="wrap" id="page"><div class="empty">Ouverture de la vitrine WASSAFRICA…</div></main>
<footer class="wrap footer">WASSAFRICA — Connecter l’Afrique. Ouvrir le monde.</footer>
<button class="btn orange bottom" id="floatingShare">🌍 Faire connaître WASSAFRICA</button>
<script>
'use strict';
const db=window.supabase.createClient('https://dzifpwqrqnvssfhwjccj.supabase.co','sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV');
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
const safe=v=>{try{const u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:null}catch{return null}};
const money=(v,c)=>v==null?'Prix sur demande':new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0}).format(Number(v||0))+' '+(c||'XOF');
const slug=decodeURIComponent(location.pathname.replace(/^\/+/, '').split('/')[0]||'');
let link=null,business=null,products=[],services=[];
async function track(type,entityType=null,entityId=null,metadata={}){if(!link?.id)return;try{await db.from('smart_link_events').insert({smart_link_id:link.id,event_type:type,entity_type:entityType,entity_id:entityId,metadata})}catch{}}
function illustration(kind){const icons={discover:'<svg viewBox="0 0 120 120" fill="none"><circle cx="60" cy="60" r="42" fill="#fff"/><path d="M38 67c12-26 32-31 45-35-2 15-8 36-32 46z" fill="#2563EB"/><circle cx="73" cy="43" r="6" fill="#F59E0B"/></svg>',talk:'<svg viewBox="0 0 120 120" fill="none"><rect x="17" y="22" width="86" height="61" rx="20" fill="#2563EB"/><path d="M38 84l-3 20 22-20" fill="#2563EB"/><path d="M39 52h42M39 66h28" stroke="#fff" stroke-width="7" stroke-linecap="round"/><circle cx="90" cy="88" r="15" fill="#F59E0B"/><path d="M84 88h12" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg>',sell:'<svg viewBox="0 0 120 120" fill="none"><path d="M20 43h80l-7 58H27z" fill="#fff"/><path d="M28 43l9-23h46l9 23" fill="#2563EB"/><path d="M42 64h36M42 79h27" stroke="#0D1B3D" stroke-width="6" stroke-linecap="round"/><circle cx="88" cy="88" r="17" fill="#F59E0B"/><path d="M81 88h14M88 81v14" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg>'};return icons[kind]||icons.discover}
function cardProduct(p){const im=safe(p.image_url),v=safe(p.video_url);return `<article class="card"><div class="media">${v?`<video controls preload="metadata" poster="${esc(im||'')}" src="${esc(v)}"></video>`:im?`<img loading="lazy" src="${esc(im)}" alt="${esc(p.title)}">`:'🛍️'}</div><div class="body"><span class="tag">${p.product_type==='digital'?'PRODUIT DIGITAL':'PRODUIT'}</span><h3>${esc(p.title)}</h3><p class="mini">${esc(p.description||'Une offre présentée sur WASSAFRICA.')}</p><div class="price">${money(p.price,p.currency)}</div><div class="actions"><a class="btn primary" href="/auth?next=${encodeURIComponent('/inbox?business='+business.id+'&product='+p.id)}" data-contact="${esc(p.id)}">💬 Commander</a><button class="btn" data-share-product="${esc(p.id)}">↗ Partager</button></div></div></article>`}
function cardService(s){const m=s.metadata&&typeof s.metadata==='object'?s.metadata:{};const im=safe(m.image_url||m.image);return `<article class="card"><div class="media">${im?`<img loading="lazy" src="${esc(im)}" alt="${esc(s.title)}">`:'🧰'}</div><div class="body"><span class="tag">SERVICE</span><h3>${esc(s.title)}</h3><p class="mini">${esc(s.description||'Une solution proposée par cette activité.')}</p>${s.price!=null?`<div class="price">${money(s.price,s.currency)}</div>`:''}<div class="actions"><a class="btn primary" href="/auth?next=${encodeURIComponent('/inbox?business='+business.id+'&service='+s.id)}">💬 Demander</a></div></div></article>`}
function bind(){
 document.querySelectorAll('[data-share-product]').forEach(b=>b.onclick=()=>{const p=products.find(x=>x.id===b.dataset.shareProduct);shareText(`Découvrez ${p?.title||'cette offre'} sur WASSAFRICA`,location.href)});
 $('floatingShare').onclick=()=>shareActivity();
 $('language').onchange=e=>{const v=e.target.value.slice(-2).toLowerCase();if(v==='fr')location.reload();else alert('Cette vitrine est prête pour le multilingue WASSAFRICA.')};
 document.querySelectorAll('[data-contact]').forEach(b=>b.onclick=()=>track('product_contact','product',b.dataset.contact));
}
async function shareText(text,url){try{if(navigator.share)await navigator.share({title:'WASSAFRICA',text,url});else{await navigator.clipboard.writeText(text+'\n'+url);alert('Lien copié.')}}catch{} }
async function shareActivity(){await track('activity_shared','smart_link',link?.id);shareText(`🌍 Découvrez ${business?.name||'cette activité'} sur WASSAFRICA.`,location.href)}
function contact(kind){const phone=(business?.phone||'').trim();if(kind==='call'&&phone){track('phone_call_click','business',business.id);location.href='tel:'+phone;return}if(kind==='message'){track('message_click','business',business.id);location.href='/auth?next='+encodeURIComponent('/inbox?business='+business.id);return}if(kind==='video'){track('video_call_click','business',business.id);location.href='/calls?business='+business.id}}
function render(){
 const name=business?.name||link?.title||'Votre activité';const logo=safe(business?.logo_url),cover=safe(business?.cover_image_url)||logo;document.title=name+' — WASSAFRICA';
 const productHtml=products.length?products.map(cardProduct).join(''):'<div class="empty">Publiez vos produits ici pour permettre aux visiteurs de découvrir vos offres.</div>';
 const serviceHtml=services.length?services.map(cardService).join(''):'<div class="empty">Publiez vos services ici pour présenter clairement vos solutions.</div>';
 const contactBtns=`<div class="actions"><button class="btn primary" onclick="contact('message')">💬 Parler</button>${business?.phone?'<button class="btn" onclick="contact(\'call\')">📞 Appeler</button>':''}<button class="btn" onclick="contact('video')">📹 Appel vidéo</button></div>`;
 $('page').innerHTML=`<section class="hero"><div class="heroGrid"><div><div class="eyebrow">WASSAFRICA · SMART LINK</div><h1>Découvrez.<br><span>Discutez.</span><br>Faites des affaires.</h1><p class="lead">${esc(business?.description||link?.description||'Une présence commerciale simple pour présenter votre activité, vos produits, vos services et ouvrir une conversation directe.')}</p><div class="heroActions"><a class="btn orange" href="#offers">🛍️ Découvrir les offres</a><button class="btn" onclick="shareActivity()">↗ Partager cette activité</button></div><div class="trust"><span>✓ <b>Une seule vitrine</b></span><span>✓ <b>Conversation directe</b></span><span>✓ <b>Pensé pour l’Afrique</b></span></div></div><div class="heroArt"><div class="bubbleArt">${illustration('sell')}</div></div></div></section>
<section class="section"><div class="sectionHead"><div><h2>Pourquoi WASSAFRICA ?</h2><p class="sectionLead">Transformez votre présence en ligne en point d’entrée commercial : découverte, conversation et opportunité réunies.</p></div></div><div class="valueGrid"><article class="value"><div class="valueArt">${illustration('discover')}</div><h3>🌍 Soyez découvert</h3><p>Présentez votre activité dans une vitrine claire, mobile et facile à partager.</p></article><article class="value"><div class="valueArt">${illustration('talk')}</div><h3>💬 Transformez les visites en conversations</h3><p>Un visiteur peut poser une question, parler au vendeur ou demander une information.</p></article><article class="value"><div class="valueArt">${illustration('sell')}</div><h3>🛍️ Faites avancer vos affaires</h3><p>Produits, services, prix et appels à l’action rapprochent la découverte de la vente.</p></article></div></section>
<section class="section" id="offers"><div class="sectionHead"><h2>🛍️ Produits</h2><p class="sectionLead">Découvrez les offres publiées, leurs caractéristiques et leurs prix lorsqu’ils sont disponibles.</p></div><div class="grid">${productHtml}</div></section>
<section class="section"><div class="sectionHead"><h2>🧰 Services & solutions</h2><p class="sectionLead">Des services présentés clairement pour aider vos clients à choisir et passer à l’action.</p></div><div class="grid">${serviceHtml}</div></section>
<section class="section"><div class="contact"><article class="contactCard"><div class="eyebrow">CONTACTER</div><h2 class="contactTitle">${esc(name)}</h2><div class="contactRole">Propriétaire / responsable de l’activité${business?.city||business?.country?' · '+esc([business.city,business.country].filter(Boolean).join(' · ')):''}</div>${contactBtns}</article><article class="assistant"><span class="assistantBadge">✨ IA · ASSISTANT COMMERCIAL</span><h2>Une question avant d’acheter ?</h2><p class="muted">L’assistant peut aider à trouver un produit, comprendre une offre, connaître un prix ou préparer la mise en relation avec l’activité.</p><div class="benefitList"><div class="benefit"><i>💬</i><span>Questions sur les produits et services</span></div><div class="benefit"><i>💰</i><span>Prix et informations publiées</span></div><div class="benefit"><i>🤝</i><span>Passage vers une conversation humaine</span></div></div><a class="btn orange" href="/auth?next=${encodeURIComponent('/inbox?business='+business.id)}">💬 Parler avec l’activité</a></article></div></section>
<section class="section"><article class="shareCard"><div class="eyebrow">PROPULSEZ VOTRE ACTIVITÉ</div><h2>Votre activité mérite plus qu’une simple page.</h2><p>Avec WASSAFRICA, votre Smart Link devient une porte d’entrée vers votre activité : présenter → découvrir → discuter → qualifier → vendre → fidéliser.</p><div class="actions"><a class="btn primary" href="/auth?next=/smartlink">🚀 Créer mon Smart Link</a><button class="btn orange" onclick="shareActivity()">↗ Partager cette activité</button></div></article></section>`;
 bind();
}
function fail(){document.querySelector('#page').innerHTML='<section class="hero"><div class="heroGrid"><div><div class="eyebrow">WASSAFRICA</div><h1>Votre activité mérite d’être découverte.</h1><p class="lead">Cette vitrine n’est pas disponible pour le moment. Découvrez WASSAFRICA et créez votre propre Smart Link.</p><div class="heroActions"><a class="btn orange" href="/">Découvrir WASSAFRICA</a><a class="btn" href="/auth?next=/smartlink">Créer mon Smart Link</a></div></div><div class="heroArt"><div class="bubbleArt">${illustration('discover')}</div></div></div></section>'}
async function load(){if(!slug)return fail();const r=await db.from('smart_links').select('id,business_id,owner_id,slug,title,description,is_public').eq('slug',slug).eq('is_public',true).maybeSingle();if(r.error||!r.data)return fail();link=r.data;const b=link.business_id?await db.from('businesses').select('id,name,description,country,city,logo_url,cover_image_url,template,accent_color,phone').eq('id',link.business_id).maybeSingle():null;business=b?.data||{id:link.business_id,name:link.title,description:link.description};if(link.business_id){const p=await db.from('products').select('id,title,description,price,currency,image_url,video_url,product_type').eq('business_id',link.business_id).eq('is_published',true).order('created_at',{ascending:false}).limit(60);products=p.data||[];const s=await db.from('services').select('id,title,description,price,currency,metadata').eq('business_id',link.business_id).eq('is_published',true).order('created_at',{ascending:false}).limit(60);services=s.data||[]}await track('smart_link_opened','smart_link',link.id);render()}
load();
</script>
</body></html>
