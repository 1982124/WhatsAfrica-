<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="WhatsAfrica — Suivi sécurisé de commande"><title>WhatsAfrica — Suivre ma commande</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#100d19;--panel:#1b1730;--gold:#e8a83c;--teal:#17a889;--text:#f8f3e7;--muted:#aaa2b8;--line:#ffffff1a;--danger:#d8644d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#30264e,#100d19 48%);color:var(--text);font:15px system-ui}.wrap{max-width:650px;margin:auto;padding:18px}.nav{border-bottom:1px solid var(--line);background:#100d19ed}.navrow{min-height:62px;display:flex;align-items:center;justify-content:space-between}.brand{font:bold 20px Georgia;color:#fff;text-decoration:none}.brand b{color:var(--gold)}.card{margin-top:30px;background:linear-gradient(145deg,#211b38,#18142a);border:1px solid var(--line);border-radius:20px;padding:22px}.eyebrow{font:10px monospace;letter-spacing:2px;color:var(--teal)}h1,h2{font-family:Georgia,serif}.field{margin:14px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field input{width:100%;padding:13px;border-radius:10px;border:1px solid var(--line);background:#11101b;color:#fff}.btn{border:0;border-radius:999px;padding:12px 17px;font-weight:850;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.primary{background:var(--gold);color:#17120b}.secondary{background:transparent;color:#fff;border:1px solid var(--line)}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.row .btn{flex:1}.notice{padding:13px;border-radius:12px;background:#17a88918;color:#a5eddb}.error{padding:13px;border-radius:12px;background:#d8644d18;color:#ffc0b2}.result{margin-top:18px;border-top:1px solid var(--line);padding-top:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{padding:12px;border:1px solid var(--line);border-radius:12px;background:#ffffff06}.item b{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.status{font-weight:900;color:var(--gold)}.hint{color:var(--muted);line-height:1.55}.footer{text-align:center;color:#ffffff55;padding:30px}@media(max-width:520px){.grid{grid-template-columns:1fr}.row .btn{width:100%}}</style></head><body><header class="nav"><div class="wrap navrow"><a class="brand" href="/">Whats<b>Africa</b></a><a class="btn secondary" href="/">Découvrir</a></div></header><main class="wrap"><section class="card"><div class="eyebrow">SUIVI SÉCURISÉ</div><h1>Suivre ma commande</h1><p class="hint">Entrez la référence de commande et le code de suivi reçus après votre achat. Ces deux éléments sont nécessaires pour consulter l’état de la commande.</p><div class="field"><label>Référence de commande</label><input id="orderId" autocomplete="off" placeholder="Ex. 8f2…"></div><div class="field"><label>Code de suivi</label><input id="token" autocomplete="off" placeholder="Votre code de suivi"></div><div class="row"><button class="btn primary" id="track">📦 Afficher le statut</button><a class="btn secondary" href="/">Retour</a></div><div id="message"></div><div id="result" class="result" hidden></div></section><footer class="footer">WhatsAfrica — Communiquez. Découvrez. Vendez.</footer></main><script>const U='https://dzifpwqrqnvssfhwjccj.supabase.co',K='sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV',db=supabase.createClient(U,K),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));function fmt(v){return v?new Intl.DateTimeFormat('fr-FR',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v)):'—'}function show(type,text){$('message').innerHTML='<div class="'+type+'">'+esc(text)+'</div>';setTimeout(()=>{$('message').innerHTML=''},7000)}async function track(){const id=$('orderId').value.trim(),token=$('token').value.trim();if(!id||!token)return show('error','La référence et le code de suivi sont obligatoires.');const b=$('track');b.disabled=true;b.textContent='Vérification…';$('result').hidden=true;try{const r=await db.rpc('get_public_order_status',{p_order_id:id,p_tracking_token:token});if(r.error)throw r.error;const o=r.data;if(!o?.order_id)throw new Error('Commande introuvable');$('result').innerHTML='<h2>Commande '+esc(o.order_id.slice(0,8))+'…</h2><div class="grid"><div class="item"><b>État</b><span class="status">'+esc(o.status||'—')+'</span></div><div class="item"><b>Paiement</b><span class="status">'+esc(o.payment_status||'—')+'</span></div><div class="item"><b>Total</b>'+esc(new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0}).format(Number(o.total||0))+' '+(o.currency||'XOF'))+'</div><div class="item"><b>Dernière mise à jour</b>'+esc(fmt(o.updated_at))+'</div></div>'+(o.payment_paid_at?'<p class="hint">Paiement confirmé le '+esc(fmt(o.payment_paid_at))+'.</p>':'<p class="hint">Le paiement n’est considéré comme confirmé qu’après validation par le prestataire de paiement. Ouvrir un lien de paiement ne confirme pas la transaction.</p>');$('result').hidden=false}catch(e){show('error','Impossible de retrouver cette commande. Vérifiez la référence et le code de suivi.')}finally{b.disabled=false;b.textContent='📦 Afficher le statut'}}$('track').onclick=track;[$('orderId'),$('token')].forEach(x=>x.onkeydown=e=>{if(e.key==='Enter')track()});const q=new URLSearchParams(location.search);if(q.get('order_id'))$('orderId').value=q.get('order_id');if(q.get('token'))$('token').value=q.get('token');if(q.get('order_id')&&q.get('token'))track();</script></body></html>
