<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>WASSAFRICA — Messages</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#18231d;--g:#173d2d;--line:#dce5df}*{box-sizing:border-box}body{margin:0;background:#f4f7f5;min-height:100vh}.wrap{max-width:1180px;margin:auto;padding:16px}.shell{display:grid;grid-template-columns:320px 1fr;gap:14px;min-height:calc(100vh - 32px)}.card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 35px #18231d0f}.sidebar{padding:14px;display:flex;flex-direction:column;min-height:0}.brand{font-size:20px;font-weight:900;color:var(--g);margin-bottom:12px}.search{display:flex;gap:8px}.search input,.composer input{width:100%;border:1px solid var(--line);border-radius:15px;padding:12px;font:inherit;outline:none}.search button,.composer button,.tool,.modal button{border:1px solid var(--line);border-radius:14px;padding:11px 13px;font-weight:800;cursor:pointer;background:#fff}.search button,.composer button{background:var(--g);color:#fff;border-color:var(--g)}button:disabled{opacity:.5}.list{overflow:auto;min-height:0;flex:1;margin-top:10px}.conv{padding:12px;border-radius:15px;display:flex;gap:10px;align-items:center;cursor:pointer}.conv.active,.conv:hover{background:#eff4f1}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#e7eeea;font-weight:900;flex:none;overflow:hidden}.name{font-weight:800}.sub{font-size:12px;color:#748078}.chat{display:flex;flex-direction:column;min-height:0;overflow:hidden}.top{padding:15px 18px;border-bottom:1px solid #e5ebe7;display:flex;gap:12px;align-items:center}.msgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:7px;background:#f7f9f7}.bubble{max-width:min(78%,650px);width:max-content;padding:9px 12px;border-radius:17px;background:#fff;border:1px solid #dfe7e2;white-space:pre-wrap;overflow-wrap:anywhere}.mine{align-self:flex-end;background:#e8f6dc}.meta{font-size:10px;color:#7a867e;text-align:right;margin-top:4px}.composer-wrap{padding:12px;border-top:1px solid #e5ebe7}.tools{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}.status{text-align:center;font-size:12px;color:#66736b;padding:8px}.notice{text-align:center;font-size:12px;color:#768279}.empty{margin:auto;text-align:center;color:#748079;padding:30px}.hidden{display:none!important}.media{display:block;max-width:min(520px,80vw);max-height:420px;border-radius:12px}.filecard{display:flex;gap:10px;align-items:center}.modal{position:fixed;inset:0;background:#0b1711aa;display:grid;place-items:center;padding:18px;z-index:50}.modalbox{background:#fff;border-radius:22px;max-width:720px;width:100%;padding:16px}.preview{width:100%;max-height:60vh;background:#101512;border-radius:16px}.modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}@media(max-width:820px){.shell{grid-template-columns:1fr}.sidebar{min-height:250px}.chat{min-height:72vh}.bubble{max-width:88%}}</style></head><body><div class="wrap"><div id="gate" class="card" style="padding:18px;text-align:center">Ouverture sécurisée de vos messages…</div><main id="app" class="shell hidden"><aside class="card sidebar"><div class="brand">WASSAFRICA · Messages</div><div class="search"><input id="target" placeholder="Nom, numéro ou activité…"><button id="searchBtn" disabled>Rechercher</button></div><div id="list" class="list"></div></aside><section class="card chat"><header class="top"><div id="chatAvatar" class="avatar">W</div><div><div id="title" class="name">Choisissez une conversation</div><div class="sub">Conversation privée</div></div></header><div id="msgs" class="msgs"><div class="empty">Vos conversations apparaîtront ici.</div></div><div class="composer-wrap"><div class="tools"><button id="camera" class="tool">📷 Caméra</button><button id="audio" class="tool">🎙️ Audio</button><button id="media" class="tool">🖼️ Photo / vidéo</button><button id="file" class="tool">📎 Fichier</button><input id="mediaInput" class="hidden" type="file" accept="image/*,video/*"><input id="fileInput" class="hidden" type="file"></div><form id="composer"><input id="body" maxlength="4000" placeholder="Écrire un message…"><button id="send" disabled>➤</button></form><div id="status" class="status">Connexion sécurisée.</div><div class="notice">Chiffrement de bout en bout · temps réel · reprise des envois.</div></div></section></main></div><div id="modal" class="modal hidden"><div class="modalbox"><div id="modalTitle" class="name">Caméra WASSAFRICA</div><video id="preview" class="preview" autoplay playsinline muted></video><div id="recStatus" class="status"></div><div id="modalActions" class="modal-actions"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/tus-js-client@4/dist/tus.min.js"></script><script src="/wa-messaging-canonical-v2.js"></script></body></html>
