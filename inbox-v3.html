<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WASSAFRICA — Messages</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f5f7f6;color:#17211b;font:15px system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:12px}.top,.row,.composer{display:flex;gap:8px;align-items:center}.top{justify-content:space-between}.card{background:#fff;border:1px solid #dce5e1;border-radius:16px;padding:12px;margin:8px 0}.row input,.composer input{flex:1;min-width:0;padding:12px;border:1px solid #dce5e1;border-radius:12px;font:inherit}.btn{border:0;border-radius:12px;padding:11px 14px;background:#e8a83c;font-weight:800;cursor:pointer}.ghost{background:transparent;border:1px solid #dce5e1}.muted{color:#66756e;font-size:13px}.err{color:#b42318}.ok{color:#18845d}.layout{display:grid;grid-template-columns:300px 1fr;gap:10px}.list{max-height:65vh;overflow:auto}.conv,.result{padding:12px;border-radius:12px;cursor:pointer}.conv:hover,.result:hover{background:#eef4f1}.chat{min-height:65vh;display:flex;flex-direction:column}.msgs{flex:1;min-height:50vh;overflow:auto;padding:8px}.msg{max-width:82%;width:max-content;padding:9px 11px;border-radius:14px;background:#eef2f0;margin:6px 0;white-space:pre-wrap;overflow-wrap:anywhere}.mine{margin-left:auto;background:#dcf8c6}.results{margin-top:8px}@media(max-width:760px){.layout{grid-template-columns:1fr}.list{max-height:25vh}.msg{max-width:92%}}</style><script src="/brand-normalizer.js"></script></head><body><div class="wrap"><div class="top"><b style="font-size:22px">WASSAFRICA · Messages</b><button id="logout" class="btn ghost">Déconnexion</button></div><section id="gate" class="card"><b>💬 Messagerie</b><p id="gateText" class="muted">Vérification de votre session…</p><button id="login" class="btn" style="display:none">Se connecter</button></section><main id="app" style="display:none"><section class="card"><b>Nouveau message</b><div class="row"><input id="phone" autocomplete="off" placeholder="Nom ou numéro international, ex. +223…"><button id="start" class="btn">Démarrer</button></div><div id="results" class="results"></div><div id="status" class="muted"></div></section><div class="layout"><section class="card"><b>Conversations</b><div id="list" class="list"></div></section><section class="card chat"><div id="empty" style="display:grid;place-items:center;min-height:52vh;text-align:center"><div><div style="font-size:52px">💬</div><h2>Votre messagerie</h2><p class="muted">Choisissez une conversation ou démarrez-en une.</p></div></div><div id="chat" style="display:none;flex:1;flex-direction:column"><b id="title">Conversation</b><div id="country" class="muted"></div><div id="secure" class="muted"></div><div id="msgs" class="msgs"></div><form id="composer" class="composer"><input id="body" maxlength="4000" autocomplete="off" placeholder="Écrire un message…"><button id="send" class="btn" type="submit">➤</button></form></div></section></div></main></div><script>(async()=>{'use strict';const URL='https://dzifpwqrqnvssfhwjccj.supabase.co',KEY='sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV',AUTH='whatsafrica-auth',db=supabase.createClient(URL,KEY,{auth:{flowType:'implicit',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:localStorage,storageKey:AUTH}}),$=id=>document.getElementById(id);let user=null,device=null,current=null,key=null,version=0,channel=null;const te=new TextEncoder(),td=new TextDecoder(),enc=a=>btoa(String.fromCharCode(...new Uint8Array(a))),dec=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));const status=(t,c='')=>{$('status').textContent=t;$('status').className='muted '+c};function vault(){return new Promise((ok,no)=>{const r=indexedDB.open('wassafrica-msg-v4',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function getv(k){const d=await vault();return new Pro fetchKey(c,v=0){let q=db.from('conversation_key_envelopes').select('wrapped_key,key_version').eq('conversation_id',c).eq('device_id',device.deviceId).is('revoked_at',null);q=v?q.eq('key_version',v):q.order('key_version',{ascending:false}).limit(1);const r=await q.maybeSingle();if(r.error)throw r.error;if(!r.data)return null;const raw=await unwrap(r.data.wrapped_key);key=raw;version=Number(r.data.key_version);return raw}async function provision(c){const e=await db.rpc('start_conversation_key_epoch',{p_conversation_id:c,p_device_id:device.deviceId});if(e.error)throw e.error;const v=Number(e.data),raw=crypto.getRandomValues(new Uint8Array(32));const m=await db.from('conversation_members').select('user_id').eq('conversation_id',c);if(m.error)throw m.error;const ids=[...new Set((m.data||[]).map(x=>x.user_id))],targets=[];for(const uid of ids){if(uid===user.id)targets.push({id:device.deviceId,identity_public_key:device.publicJwk});else{let q=await db.from('user_devices').select('id,identity_public_key').eq('user_id',uid).eq('device_label','Web').is('revoked_at',null).order('last_seen_at',{ascending:false}).limit(1);if(q.error)throw q.error;if(q.data?.[0]?.identity_public_key)targets.push({id:q.data[0].id,identity_public_key:q.data[0].identity_public_key})}}if(!targets.length)throw Error('NO_RECIPIENT_DEVICE');const rows=await Promise.all(targets.map(async d=>({conversation_id:c,device_id:d.id,key_version:v,algorithm:'RSA-OAEP-2048-SHA256+AES-256-GCM',wrapped_key:await rsa(d.identity_public_key,raw)})));const ins=await db.from('conversation_key_envelopes').insert(rows);if(ins.error&&ins.error.code!=='23505')throw ins.error;key=raw;version=v;return raw}async function ensureKey(c){await ensureDevice();if(key&&current?.id===c)return key;try{const got=await fetchKey(c);if(got)return got}catch(e){if(!String(e?.name||'').includes('OperationError')&&!String(e?.message||'').includes('OperationError'))throw e}return provision(c)}async function peer(c){const m=await db.from('conversation_members').select('user_id').eq('conversation_id',c);if(m.error)throw m.error;const id=(m.data||[]).map(x=>x.user_id).find(x=>x!==user.id);if(!id)return{};const p=await db.from('profiles').select('display_name,public_display_name,country').eq('user_id',id).maybeSingle();return{contact_name:p.data?.public_display_name||p.data?.display_name||'Membre WASSAFRICA',contact_country:p.data?.country||''}}async function list(){const m=await db.from('conversation_members').select('conversation_id').eq('user_id',user.id);if(m.error)throw m.error;const ids=(m.data||[]).map(x=>x.conversation_id);$('list').innerHTML='';if(!ids.length){$('list').innerHTML='<p class="muted">Aucune conversation.</p>';return}const q=await db.from('conversations').select('id,kind,title,created_at').in('id',ids).order('created_at',{ascending:false}).limit(100);if(q.error)throw q.error;for(const c of q.data||[]){const p=await peer(c.id).catch(()=>({})),d=document.createElement('div');d.className='conv';d.textContent=p.contact_name||c.title||'Conversation';d.onclick=()=>open({...c,...p,title:p.contact_name||c.title});$('list').appendChild(d)}}async function searchName(q){const term=String(q||'').trim();$('results').innerHTML='';if(!term||/^\+?[0-9\s().-]+$/.test(term))return[];const r=await db.rpc('search_public_profiles',{p_query:term});if(r.error)throw r.error;const rows=(r.data||[]).filter(x=>x.user_id!==user.id);if(!rows.length){$('results').innerHTML='<div class="muted">Aucun membre trouvé.</div>';return[]}rows.slice(0,10).forEach(p=>{const d=document.createElement('div');d.className='result';d.innerHTML='<b></b><div class="muted"></div>';d.firstChild.textContent=p.display_name||'Membre WASSAFRICA';d.lastChild.textContent=p.country||'';d.onclick=()=>startByUser(p);$('results').appendChild(d)});return rows}async function startByUser(p){$('start').disabled=true;$('results').innerHTML='';try{const r=await db.rpc('start_direct_conversation_by_user_id',{p_user_id:p.user_id});if(r.error)throw r.error;const x=r.data?.[0];if(!x)throw Error('CONTACT_NOT_FOUND');await open({id:x.conversation_id,title:x.contact_name||p.display_name,contact_name:x.contact_name||p.display_name,contact_country:x.contact_country||p.country||''});status('Conversation prête.','ok')}catch(e){status('Impossible de démarrer : '+(e.message||e),'err')}finally{$('start').disabled=false}}async function start(){const raw=String($('phone').value||'').trim();$('results').innerHTML='';if(!raw)return status('Saisissez un nom ou un numéro.','err');const p=raw.replace(/[\s().-]/g,'');if(!/^\+?[1-9][0-9]{7,14}$/.test(p)){try{const rows=await searchName(raw);if(rows?.length===1)return startByUser(rows[0]);return rows?.length?status('Sélectionnez le membre souhaité.','ok'):null}catch(e){return status('Recherche impossible : '+(e.message||e),'err')}}$('start').disabled=true;try{const r=await db.rpc('start_direct_conversation_by_phone',{p_phone:p.startsWith('+')?p:'+'+p});if(r.error)throw r.error;const x=r.data?.[0];if(!x)throw Error('CONTACT_NOT_FOUND');await open({id:x.conversation_id,title:x.contact_name,contact_name:x.contact_name,contact_country:x.contact_country});status('Conversation prête.','ok')}catch(e){status('Impossible de démarrer : '+(e.message||e),'err')}finally{$('start').disabled=false}}async function decrypt(row,k){const m=row.encryption_metadata||{},iv=dec(m.iv);return td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv},await crypto.subtle.importKey('raw',k,{name:'AES-GCM'},false,['decrypt']),dec(row.ciphertext)))}async function load(){if(!current||!key)return;const q=await db.from('messages_v2').select('id,sender_id,created_at,ciphertext,encryption_metadata').eq('conversation_id',current.id).order('created_at',{ascending:true}).limit(200);if(q.error)throw q.error;const box=$('msgs');box.innerHTML='';for(const r of q.data||[]){let text='🔒 Message chiffré';try{const v=Number(r.encryption_metadata?.key_version||1);let k=key;if(v!==version)k=await fetchKey(current.id,v);text=await decry
