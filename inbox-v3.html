<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>WASSAFRICA — Messages</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#f5f7f6;--card:#fff;--line:#dce5e1;--text:#17211b;--muted:#66756e;--primary:#e8a83c;--mine:#dcf8c6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,sans-serif}.wrap{max-width:1100px;margin:auto;padding:10px}.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:8px 2px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:8px 0}.layout{display:grid;grid-template-columns:300px 1fr;gap:10px}.list{max-height:65vh;overflow:auto}.conv{padding:12px;border-radius:12px;cursor:pointer}.conv:hover,.conv.sel{background:#eef4f1}.chat{min-height:65vh;display:flex;flex-direction:column}.messages{flex:1;min-height:50vh;max-height:62vh;overflow:auto;padding:8px}.msg{max-width:82%;width:max-content;padding:9px 11px;border-radius:14px;background:#eef2f0;margin:6px 0;white-space:pre-wrap;overflow-wrap:anywhere}.mine{margin-left:auto;background:var(--mine)}.muted{color:var(--muted);font-size:13px}.ok{color:#18845d}.err{color:#b42318}.new,.composer{display:flex;gap:8px}.new input,.composer input{flex:1;min-width:0;padding:12px;border:1px solid var(--line);border-radius:12px;font:inherit}.btn{border:0;border-radius:12px;padding:11px 14px;background:var(--primary);font-weight:800;cursor:pointer}.ghost{background:transparent;border:1px solid var(--line)}@media(max-width:760px){.layout{grid-template-columns:1fr}.list{max-height:28vh}.msg{max-width:92%}}</style><script src="/brand-normalizer.js"></script>
</head><body><div class="wrap"><div class="top"><b style="font-size:22px">WASSAFRICA · Messages</b><button id="logout" class="btn ghost">Déconnexion</button></div><section id="gate" class="card"><b>Messagerie</b><p id="gateText" class="muted">Vérification de votre session…</p><button id="login" class="btn" style="display:none">Se connecter</button></section><main id="app" style="display:none"><section class="card"><b>Nouveau message</b><div class="new"><input id="phone" inputmode="tel" placeholder="Numéro international, ex. +223…"><button id="start" class="btn">Démarrer</button></div><div id="status" class="muted"></div></section><div class="layout"><section class="card"><b>Conversations</b><div id="conversations" class="list"></div></section><section class="card chat"><div id="empty" style="display:grid;place-items:center;min-height:55vh;text-align:center"><div><div style="font-size:52px">💬</div><h2>Votre messagerie</h2><p class="muted">Choisissez une conversation ou démarrez-en une.</p></div></div><div id="chat" style="display:none;flex:1;flex-direction:column"><div><b id="title">Conversation</b><div id="country" class="muted"></div><div id="secure" class="muted"></div></div><div id="messages" class="messages"></div><form id="composer" class="composer"><input id="body" maxlength="4000" autocomplete="off" placeholder="Écrire un message…"><button id="send" class="btn">➤</button></form></div></section></div></main></div><script>(async()=>{'use strict';const URL='https://dzifpwqrqnvssfhwjccj.supabase.co',KEY='sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV',AUTH='whatsafrica-auth',db=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:localStorage,storageKey:AUTH}}),$=id=>document.getElementById(id);let user=null,device=null,current=null,activeKey=null,activeVersion=0,channel=null,devicePromise=null;const te=new TextEncoder(),td=new TextDecoder();function status(t,k=''){const e=$('status');e.textContent=t;e.className='muted '+k}function norm(v){let x=String(v||'').trim().replace(/[\s().-]/g,'');if(x.startsWith('00'))x='+'+x.slice(2);return/^\+[1-9][0-9]{7,14}$/.test(x)?x:null}function b64(a){let s='';new Uint8Array(a).forEach(b=>s+=String.fromCharCode(b));return btoa(s)}function ub64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}function vault(){return new Promise((ok,no)=>{const r=indexedDB.open('wassafrica-msg-v3',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function vg(k){const d=await vault();return new Promise((ok,no)=>{const r=d.transaction('k','readonly').objectStore('k').get(k);r.onsuccess=()=>{d.close();ok(r.result??null)};r.onerror=()=>{d.close();no(r.error)}})}async function vp(k,v){const d=await vault();return new Promise((ok,no)=>{const r=d.transaction('k','readwrite').objectStore('k').put(v,k);r.onerror=()=>{d.close();no(r.error)};r.transaction.oncomplete=()=>{d.close();ok(true)}})}async function identity(){const key='id:'+user.id,old=await vg(key);if(old?.privateJwk&&old?.publicJwk)return{publicJwk:old.publicJwk,privateKey:await crypto.subtle.importKey('jwk',old.privateJwk,{name:'RSA-OAEP',hash:'SHA-256'},true,['decrypt'])};const p=await crypto.subtle.generateKey({name:'RSA-OAEP',modulusLength:2048,publicExponent:new Uint8Array([1,0,1]),hash:'SHA-256'},true,['encrypt','decrypt']);const publicJwk=await crypto.subtle.exportKey('jwk',p.publicKey),privateJwk=await crypto.subtle.exportKey('jwk',p.privateKey);await vp(key,{publicJwk,privateJwk});return{publicJwk,privateKey:p.privateKey}}async function ensureDevice(){if(device)return device;if(devicePromise)return devicePromise;devicePromise=(async()=>{const id=await identity(),saved=await vg('device:'+user.id);if(saved?.id){const q=await db.from('user_devices').select('id,identity_public_key,revoked_at').eq('id',saved.id).eq('user_id',user.id).maybeSingle();if(q.data&&!q.data.revoked_at){device={deviceId:q.data.id,publicJwk:id.publicJwk,privateKey:id.privateKey};await db.from('user_devices').update({last_seen_at:new Date().toISOString(),device_label:'Web'}).eq('id',q.data.id);return device}}const q=await db.from('user_devices').select('id,identity_public_key').eq('user_id',user.id).eq('device_label','Web').is('revoked_at',null).order('last_seen_at',{ascending:false}).limit(20);if(q.error)throw q.error;let same=(q.data||[]).find(x=>JSON.stringify(x.identity_public_key)===JSON.stringify(id.publicJwk));let r=same?await db.from('user_devices').update({last_seen_at:new Date().toISOString()}).eq('id',same.id).select('id').single():await db.from('user_devices').insert({user_id:user.id,device_label:'Web',identity_public_key:id.publicJwk,last_seen_at:new Date().toISOString()}).select('id').single();if(r.error)throw r.error;device={deviceId:r.data.id,publicJwk:id.publicJwk,privateKey:id.privateKey};await vp('device:'+user.id,{id:device.deviceId});return device})().catch(e=>{devicePromise=null;throw e});return devicePromise}async function aes(k,mode){return crypto.subtle.importKey('raw',k,{name:'AES-GCM'},false,[mode])}async function wrap(raw,jwk){const k=await crypto.subtle.importKey('jwk',jwk,{name:'RSA-OAEP',hash:'SHA-256'},true,['encrypt']);return b64(await crypto.subtle.encrypt({name:'RSA-OAEP'},k,raw))}async function unwrap(s){return new Uint8Array(await crypto.subtle.decrypt({name:'RSA-OAEP'},device.privateKey,ub64(s)))}async function loadLocal(c,v){const x=await vg('key:'+user.id+':'+c+':'+v);return x?.raw?Uint8Array.from(x.raw):null}async function saveLocal(c,v,k){await vp('key:'+user.id+':'+c+':'+v,{raw:Array.from(k)});return k}async function fetchEnvelope(c,v){const r=await db.from('conversation_key_envelopes').select('wrapped_key,key_version').eq('conversation_id',c).eq('device_id',device.deviceId).eq('key_version',v).is('revoked_at',null).maybeSingle();if(r.error)throw r.error;if(!r.data)return null;return saveLocal(c,v,await unwrap(r.data.wrapped_key))}async function latestVersion(c){const r=await db.from('conversation_key_envelopes').select('key_version').eq('conversation_id',c).eq('device_id',device.deviceId).is('revoked_at',null).order('key_version',{ascending:false}).limit(1).maybeSingle();if(r.error)throw r.error;return Number(r.data?.key_version||0)}async function provision(c){const e=await db.rpc('start_conversation_key_epoch',{p_conversation_id:c,p_device_id:device.deviceId});if(e.error)throw e.error;const v=Number(e.data);if(!v)throw Error('KEY_EPOCH_NOT_CREATED');const raw=crypto.getRandomValues(new Uint8Array(32));const m=await db.from('conversation_members').select('user_id').eq('conversation_id',c);if(m.error)throw m.error;const ids=[...new Set((m.data||[]).map(x=>x.user_id))];const targets=[];for(const uid of ids){if(uid===user.id){targets.push({id:device.deviceId,identity_public_key:device.publicJwk});continue}const q=await db.from('user_devices').select('id,identity_public_key').eq('user_id',uid).is('revoked_at',null).order('last_seen_at',{ascending:false}).limit(1);if(q.error)throw q.error;if(q.data?.[0]?.identity_public_key)targets.push(q.data[0])}const rows=[];for(const x of targets)rows.push({conversation_id:c,device_id:x.id,key_version:v,algorithm:'RSA-OAEP-2048-SHA256+AES-256-GCM',wrapped_key:await wrap(raw,x.identity_public_key)});const ins=await db.from('conversation_key_envelopes').insert(rows);if(ins.error&&ins.error.code!=='23505')throw ins.error;return saveLocal(c,v,raw)}async function ensureKey(c){const d=await ensureDevice();let v=await latestVersion(c);if(v){const k=await loadLocal(c,v)||await fetchEnvelope(c,v);if(k){activeVersion=v;activeKey=k;return k}}const k=await provision(c);activeVersion=Number(await latestVersion(c));activeKey=k;return k}function encMsg(text,c,id,k,v){const iv=crypto.getRandomValues(new Uint8Array(12));return aes(k,'encrypt').then(key=>crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:te.encode('wassafrica:v2:'+c+':'+id)},key,te.encode(text))).then(ct=>({ciphertext:b64(ct),encryption_metadata:{v:2,alg:'AES-256-GCM',iv:b64(iv),conversation_id:c,message_id:id,key_version:v}}))}async function decMsg(row,k){const m=row.encryption_metadata||{},key=await aes(k,'decrypt');return td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(m.iv),additionalData:te.encode('wassafrica:v2:'+m.conversation_id+':'+(m.message_id||row.id))},key,ub64(row.ciphertext)))}async function peer(c){const m=await db.from('conversation_members').select('user_id').eq('conversation_id',c);if(m.error)throw m.error;const p=(m.data||[]).map(x=>x.user_id).find(x=>x!==user.id);if(!p)return{};const q=await db.from('profiles').select('display_name,public_display_name,country').eq('user_id',p).maybeSingle();return{contact_name:q.data?.public_display_name||q.data?.display_name||'Membre WASSAFRICA',contact_country:q.data?.country||''}}async function list(){const m=await db.from('conversation_members').select('conversation_id').eq('user_id',user.id);if(m.error)throw m.error;const ids=(m.data||[]).map(x=>x.conversation_id);const box=$('conversations');box.innerHTML='';if(!ids.length){box.innerHTML='<p class="muted">Aucune conversation.</p>';return}const q=await db.from('conversations').select('id,kind,title,created_at').in('id',ids).order('created_at',{ascending:false}).limit(100);if(q.error)throw q.error;for(const c of q.data||[]){const p=await peer(c.id).catch(()=>({})),n=document.createElement('div');n.className='conv';n.dataset.id=c.id;n.innerHTML='<b></b><div class="muted">Conversation privée</div>';n.querySelector('b').textContent=p.contact_name||c.title||'Conversation';n.onclick=()=>open({...c,...p,title:p.contact_name||c.title});box.appendChild(n)}}async function load(){if(!current||!activeKey)return;const q=await db.from('messages_v2').select('id,sender_id,created_at,ciphertext,encryption_metadata').eq('conversation_id',current.id).order('created_at',{ascending:true}).limit(200);if(q.error)throw q.error;const box=$('messages');box.innerHTML='';for(const r of q.data||[]){let text='🔒 Message chiffré';try{const v=Number(r.encryption_metadata?.key_version||1),k=await loadLocal(current.id,v)||await fetchEnvelope(current.id,v);if(k)text=await decMsg(r,k)}catch{}const d=document.createElement('div');d.className='msg '+(r.sender_id===user.id?'mine':'');d.textContent=text;box.appendChild(d)}box.scrollTop=box.scrollHeight}async function open(c){current=c;$('empty').style.display='none';$('chat').style.display='flex';$('title').textContent=c.title||'Conversation';$('country').textContent=c.contact_country||'Conversation privée';document.querySelectorAll('.conv').forEach(x=>x.classList.toggle('sel',x.dataset.id===c.id));if(channel)await db.removeChannel(channel).catch(()=>{});channel=db.channel('wassafrica-v3-'+c.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages_v2',filter:'conversation_id=eq.'+c.id},()=>load().catch(()=>{})).subscribe();try{await ensureKey(c.id);$('secure').textContent='🔒 Chiffrement actif · clé '+activeVersion;await load();status('Conversation prête.','ok')}catch(e){status('E2EE : '+(e.message||e),'err')}}async function start(){const phone=norm($('phone').value);if(!phone)return status('Numéro international invalide.','err');$('start').disabled=true;try{const r=await db.rpc('start_direct_conversation_by_phone',{p_phone:phone});if(r.error)throw r.error;const x=r.data?.[0];if(!x)throw Error('CONTACT_NOT_FOUND');await open({id:x.conversation_id,title:x.contact_name,contact_name:x.contact_name,contact_country:x.contact_country});status('Conversation prête.','ok')}catch(e){status('Impossible de démarrer : '+(e.message||e),'err')}finally{$('start').disabled=false}}async function send(e){e.preventDefault();const text=$('body').value.trim();if(!text||!current)return;$('send').disabled=true;try{const k=await ensureKey(current.id),id=crypto.randomUUID(),x=await encMsg(text,current.id,id,k,activeVersion),r=await db.from('messages_v2').insert({id,conversation_id:current.id,sender_id:user.id,body:null,message_type:'text',encryption_version:1,ciphertext:x.ciphertext,encryption_metadata:x.encryption_metadata});if(r.error)throw r.error;$('body').value='';await load();status('🔒 Message envoyé.','ok')}catch(e){status('Message non envoyé : '+(e.message||e),'err')}finally{$('send').disabled=false}}async function boot(){const s=await db.auth.getSession();if(!s.data.session){$('gateText').textContent='Connectez-vous pour accéder à la messagerie.';$('login').style.display='inline-block';return}user=s.data.session.user;$('gate').style.display='none';$('app').style.display='block';try{await ensureDevice();await list();status('Messagerie prête.','ok')}catch(e){status('Démarrage : '+(e.message||e),'err')}}$('login').onclick=()=>location.replace('/auth?next=/inbox');$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};$('start').onclick=start;$('phone').onkeydown=e=>{if(e.key==='Enter')start()};$('composer').onsubmit=send;boot().catch(e=>status('Erreur : '+(e.message||e),'err'))})();</script></body></html>
