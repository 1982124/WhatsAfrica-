<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>WASSAFRICA — Membres</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>:root{--bg:#f7f2e9;--surface:#fffdf9;--ink:#20242b;--muted:#77766f;--line:#e7dfd3;--green:#287b36;--red:#d93d32}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}.app{max-width:1000px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px}.brand{font-size:21px;font-weight:950}.btn{display:inline-block;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 13px;font-weight:800;text-decoration:none;color:inherit}.hero{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px}.eyebrow{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--green);font-weight:900}h1{margin:7px 0;font:700 40px/1.05 Georgia,serif}.muted{color:var(--muted)}.tools{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}.tools input{flex:1;min-width:220px;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.count{font-weight:900}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}.member{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center}.avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#e8e0d4;display:grid;place-items:center;font-weight:900}.name{font-weight:900}.sub{font-size:12px;color:var(--muted);margin-top:3px}@media(max-width:620px){.grid{grid-template-columns:1fr}h1{font-size:34px}.app{padding:12px}}</style></head>
<body><div class="app"><header class="top"><div class="brand">💬 WASSAFRICA</div><a class="btn" href="/dashboard">← Mon espace</a></header><section class="hero"><div class="eyebrow">Réseau WASSAFRICA</div><h1>Les membres</h1><p class="muted">Les comptes inscrits sur WASSAFRICA sont conservés. Cette page affiche les profils rattachés aux comptes utilisateurs.</p><div class="tools"><input id="q" type="search" placeholder="Rechercher un membre…"><span id="count" class="count">Chargement…</span></div><div id="list" class="grid"></div><div id="msg" class="muted"></div></section></div>
<script>
const URL='https://dzifpwqrqnvssfhwjccj.supabase.co',KEY='sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV',db=window.supabase.createClient(URL,KEY);
const $=id=>document.getElementById(id); let members=[];
const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function render(){const q=$('q').value.trim().toLowerCase();const rows=members.filter(x=>(x.name+' '+(x.country||'')).toLowerCase().includes(q));$('count').textContent=members.length+' inscrit'+(members.length>1?'s':'');$('list').innerHTML=rows.map(x=>'<article class="member">'+(x.avatar?'<img class="avatar" src="'+esc(x.avatar)+'" alt="">':'<div class="avatar">'+esc((x.name||'M').slice(0,1).toUpperCase())+'</div>')+'<div><div class="name">'+esc(x.name)+'</div><div class="sub">'+esc(x.country||'Membre WASSAFRICA')+'</div></div></article>').join('');$('msg').textContent=rows.length?'':'Aucun membre trouvé.'}
async function init(){const {data,error}=await db.auth.getSession();if(error||!data.session){location.replace('/auth?next=/members');return}const r=await db.from('profiles').select('user_id,display_name,public_display_name,first_name,last_name,country,avatar_url,profile_photo_url,profile_image_url,created_at').not('user_id','is',null).order('created_at',{ascending:true});if(r.error){$('msg').textContent='Impossible de charger les membres.';return}members=(r.data||[]).map(p=>({name:p.public_display_name||p.display_name||[p.first_name,p.last_name].filter(Boolean).join(' ')||'Membre WASSAFRICA',country:p.country,avatar:p.avatar_url||p.profile_photo_url||p.profile_image_url}));render()}
$('q').addEventListener('input',render);init();
</script></body></html>
