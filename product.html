<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Produit WASSAFRICA — découvrez l'offre, les médias et le paiement."><meta name="theme-color" content="#173c22"><title>Produit — WASSAFRICA</title>
<style>
:root{--bg:#f7f2e9;--surface:#fffdf9;--ink:#20242b;--muted:#77766f;--line:#e5ddd1;--green:#287b36;--gold:#e5aa2f;--shadow:0 12px 30px rgba(38,34,25,.09)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}.wrap{max-width:980px;margin:auto;padding:0 16px}.top{background:#f7f2e9ee;backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.toprow{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{color:var(--ink);text-decoration:none;font-size:22px;font-weight:950}.brand b{color:var(--gold)}.btn{display:inline-block;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:11px 14px;font-weight:850;text-decoration:none;cursor:pointer}.primary{background:var(--green);border-color:var(--green);color:#fff}.card{margin:22px 0;background:var(--surface);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}.heroMedia{background:#ece7dc;padding:14px}.cover{width:100%;max-height:520px;object-fit:cover;border-radius:16px;display:block}.body{padding:24px}.pill{display:inline-flex;padding:6px 9px;border-radius:999px;background:#dff0d9;color:var(--green);font-size:11px;font-weight:900}.digital{background:#f7e5bc;color:#80510b}.h{font:700 clamp(32px,6vw,50px)/1.05 Georgia,serif;margin:12px 0}.muted{color:var(--muted);line-height:1.6}.price{font-size:22px;font-weight:950;margin:18px 0}.notice{margin-top:14px;padding:13px 14px;border-radius:14px;background:#f4eee3;border:1px solid var(--line);line-height:1.5}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.mediaSection{padding:0 24px 24px}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;border:1px solid var(--line)}.videoGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.videoCard{border:1px solid var(--line);border-radius:16px;padding:10px;background:#faf7f0}.videoCard h3{margin:4px 2px 10px;font-size:14px}.videoCard video{width:100%;border-radius:11px;display:block;background:#000}.empty{margin:30px 0;padding:36px;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:18px;color:var(--muted)}@media(max-width:650px){.wrap{padding:0 12px}.body,.mediaSection{padding:18px}.gallery,.videoGrid{grid-template-columns:1fr}.actions .btn{width:100%;text-align:center}}
</style><script src="/brand-normalizer.js"></script><script src="/brand-observer.js"></script><script src="/wa-smart-link-engine.js" defer></script></head>
<body><header class="top"><div class="wrap toprow"><a class="brand" href="/">WASSAFRICA</a><a class="btn" href="/market">← Marché</a></div></header><main class="wrap"><section id="app" class="empty">Chargement du produit…</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient('https://dzifpwqrqnvssfhwjccj.supabase.co','sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV');const esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));const id=new URLSearchParams(location.search).get('id');function money(v,c){return new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0}).format(Number(v||0))+' '+(c||'XOF')}
async function track(event_type,entity_type,entity_id,business_id,metadata){try{await db.from('analytics_events').insert({user_id:null,business_id:business_id||null,event_type,entity_type,entity_id,metadata:Object.assign({},metadata||{},{source:'public_product',path:location.pathname+location.search})})}catch(e){}}
function trackSmart(event,extra={}){try{window.WA_SMART_LINK?.track(event,{product_id:id||null,...extra})}catch{}}async function load(){if(!id)throw Error('missing_id');const {data:p,error:pe}=await db.from('products').select('id,title,description,price,currency,image_url,video_url,category,product_type,business_id,is_published,digital_file_name,digital_version').eq('id',id).eq('is_published',true).maybeSingle();if(pe)throw pe;if(!p)throw Error('not_found');track('product_view','product',p.id,p.business_id,{title:p.title,category:p.category});trackSmart('product_view',{title:p.title,category:p.category,business_id:p.business_id});document.title=p.title+' — WassAfrica';let b=null,l=null,pay=null;if(p.business_id){const br=await db.from('businesses').select('id,owner_id,name,slug,city,country,website_url,website,phone').eq('id',p.business_id).maybeSingle();if(br.error)throw br.error;b=br.data;const lr=await db.from('smart_links').select('slug,is_public').eq('business_id',p.business_id).eq('is_public',true).maybeSingle();if(!lr.error)l=lr.data}const mr=await db.from('product_media').select('media_type,storage_bucket,storage_path,sort_order').eq('product_id',p.id).order('sort_order',{ascending:true});if(mr.error)throw mr.error;const media=mr.data||[];const publicUrl=m=>db.storage.from(m.storage_bucket).getPublicUrl(m.storage_path).data.publicUrl;const cover=media.find(m=>m.media_type==='cover');const gallery=media.filter(m=>m.media_type==='gallery');const teaser=media.find(m=>m.media_type==='teaser_video');const presentation=media.find(m=>m.media_type==='presentation_video');const pr=await db.from('external_payment_links').select('provider,label,url').eq('product_id',p.id).eq('is_active',true).order('updated_at',{ascending:false}).limit(1).maybeSingle();if(!pr.error)pay=pr.data;const digital=p.product_type==='digital';const coverUrl=cover?publicUrl(cover):p.image_url;const buyUrl=pay?.url||null; if(buyUrl){document.addEventListener('click',e=>{if(e.target.closest('a[href="'+CSS.escape(buyUrl)+'"]'))track('product_checkout_click','product',p.id,p.business_id,{provider:pay.provider||null});trackSmart('checkout_clicked',{provider:pay.provider||null,business_id:p.business_id})})}const contact=b?.phone?`/contact-seller?phone=${encodeURIComponent(b.phone)}&name=${encodeURIComponent(b.name||'le vendeur')}`:'/inbox';const galleryHtml=gallery.length?`<section class="mediaSection"><h2>Photos</h2><div class="gallery">${gallery.map(m=>`<img src="${esc(publicUrl(m))}" alt="${esc(p.title)}">`).join('')}</div></section>`:'';const videos=[];if(teaser)videos.push(`<div class="videoCard"><h3>🎬 Teaser</h3><video controls playsinline preload="metadata" src="${esc(publicUrl(teaser))}"></video></div>`);if(presentation)videos.push(`<div class="videoCard"><h3>▶️ Vidéo de présentation</h3><video controls playsinline preload="metadata" src="${esc(publicUrl(presentation))}"></video></div>`);if(videos.length===0&&p.video_url)videos.push(`<div class="videoCard"><h3>🎬 Présentation</h3><video controls playsinline preload="metadata" src="${esc(p.video_url)}"></video></div>`);const videoHtml=videos.length?`<section class="mediaSection"><h2>Présentation vidéo</h2><div class="videoGrid">${videos.join('')}</div></section>`:'';$('app').className='card';$('app').innerHTML=`${coverUrl?`<div class="heroMedia"><img class="cover" src="${esc(coverUrl)}" alt="${esc(p.title)}"></div>`:''}<div class="body"><span class="pill ${digital?'digital':''}">${digital?'📚 PRODUIT DIGITAL':'🛍️ PRODUIT'}</span><h1 class="h">${esc(p.title)}</h1><div class="muted">${esc(b?.name||'Vendeur WASSAFRICA')}${b?.city?' · '+esc(b.city):''}${b?.country?' · '+esc(b.country):''}</div><p class="muted">${esc(p.description||'Découvrez cette offre et échangez directement avec le vendeur.')}</p>${p.category?`<div class="muted">Catégorie : ${esc(p.category)}</div>`:''}<div class="price">${money(p.price,p.currency)}</div>${digital?`<div class="notice"><strong>📚 Livraison digitale</strong><br>Le fichier vendu reste privé. Après paiement confirmé, le système de livraison sécurisé peut donner accès au téléchargement.</div>`:''}${!buyUrl?`<div class="notice"><strong>ℹ️ Paiement externe non configuré</strong><br>Le vendeur n’a pas encore relié de checkout. Vous pouvez quand même le contacter.</div>`:''}<div class="actions">${buyUrl?`<a class="btn primary" href="${esc(buyUrl)}" target="_blank" rel="noopener noreferrer">🛒 ${esc(pay.label||'Payer maintenant')}</a>`:''}<a class="btn" href="${esc(contact)}" id="contactSellerBtn">💬 Contacter le vendeur</a>${l?`<a class="btn" href="/${encodeURIComponent(l.slug)}">👤 Voir la vitrine</a>`:''}<button class="btn" id="shareBtn" type="button">↗️ Partager</button><a class="btn" href="/market">← Continuer le marché</a></div></div>${galleryHtml}${videoHtml}`;const contactBtn=document.getElementById('contactSellerBtn');if(contactBtn)contactBtn.onclick=()=>trackSmart('seller_contact_clicked',{business_id:p.business_id});const shareBtn=document.getElementById('shareBtn');if(shareBtn)shareBtn.onclick=async()=>{track('product_share','product',p.id,p.business_id,{title:p.title});trackSmart('product_share',{title:p.title,business_id:p.business_id});try{if(navigator.share)await navigator.share({title:p.title,text:`${p.title} — sur WASSAFRICA`,url:location.href});else{await navigator.clipboard.writeText(location.href);shareBtn.textContent='✓ Lien copié'}}catch(e){}}}
load().catch(e=>{document.getElementById('app').innerHTML='<div class="empty"><strong>Produit introuvable ou non publié.</strong><br><br><a class="btn primary" href="/market">Retour au Marché</a></div>'});
</script></body></html>
