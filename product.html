<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Produit WhatsAfrica — découvrez l'offre, le vendeur et la suite de la conversation."><meta name="theme-color" content="#173c22"><title>Produit — WhatsAfrica</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#f7f2e9;--surface:#fffdf9;--ink:#20242b;--muted:#77766f;--line:#e5ddd1;--green:#287b36;--deep:#173c22;--gold:#e5aa2f;--shadow:0 12px 30px rgba(38,34,25,.09)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}.wrap{max-width:920px;margin:auto;padding:0 16px}.top{background:#f7f2e9ee;backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.toprow{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{color:var(--ink);text-decoration:none;font-size:22px;font-weight:950}.brand b{color:var(--gold)}.btn{display:inline-block;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:11px 14px;font-weight:850;text-decoration:none}.primary{background:var(--green);border-color:var(--green);color:#fff}.card{margin:22px 0;background:var(--surface);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}.media{min-height:280px;background:linear-gradient(135deg,#dfe9d9,#f2d58e);display:grid;place-items:center;font-size:76px}.body{padding:24px}.pill{display:inline-flex;padding:6px 9px;border-radius:999px;background:#dff0d9;color:var(--green);font-size:11px;font-weight:900}.digital{background:#f7e5bc;color:#80510b}.h{font:700 clamp(32px,6vw,50px)/1.05 Georgia,serif;margin:12px 0}.muted{color:var(--muted);line-height:1.6}.price{font-size:22px;font-weight:950;margin:18px 0}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.empty{margin:30px 0;padding:36px;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:18px;color:var(--muted)}@media(max-width:560px){.wrap{padding:0 12px}.body{padding:18px}.actions .btn{width:100%;text-align:center}}
</style></head><body><header class="top"><div class="wrap toprow"><a class="brand" href="/">Whats<b>Africa</b></a><a class="btn" href="/market">← Marché</a></div></header><main class="wrap"><section id="app" class="empty">Chargement du produit…</section></main><script>const db=supabase.createClient('https://dzifpwqrqnvssfhwjccj.supabase.co','sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV');const esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));const id=new URLSearchParams(location.search).get('id');function money(v,c){return new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0}).format(Number(v||0))+' '+(c||'XOF')}async function load(){if(!id)throw new Error('missing_id');const {data:p,error:pe}=await db.from('products').select('id,title,description,price,currency,image_url,video_url,category,product_type,business_id,is_published,digital_file_name,digital_version').eq('id',id).eq('is_published',true).maybeSingle();if(pe)throw pe;if(!p)throw new Error('not_found');let b=null,l=null;if(p.business_id){const br=await db.from('businesses').select('id,name,slug,city,country').eq('id',p.business_id).maybeSingle();if(br.error)throw br.error;b=br.data;const lr=await db.from('smart_links').select('slug,is_public').eq('business_id',p.business_id).eq('is_public',true).maybeSingle();if(!lr.error)l=lr.data}const digital=p.product_type==='digital';const media=p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.title)}" style="width:100%;height:100%;object-fit:cover">`:digital?'📚':'🛍️';$('app').className='card';$('app').innerHTML=`<div class="media">${media}</div><div class="body"><span class="pill ${digital?'digital':''}">${digital?'📚 PRODUIT DIGITAL':'🛍️ PRODUIT PHYSIQUE'}</span><h1 class="h">${esc(p.title)}</h1><div class="muted">${esc(b?.name||'Vendeur WhatsAfrica')}${b?.city?' · '+esc(b.city):''}${b?.country?' · '+esc(b.country):''}</div><p class="muted">${esc(p.description||'Découvrez cette offre et échangez directement avec le vendeur sur WhatsAfrica.')}</p>${p.category?`<div class="muted">Catégorie : ${esc(p.category)}</div>`:''}<div class="price">${money(p.price,p.currency)}</div>${digital?`<div class="muted"><strong>Livraison digitale :</strong> après achat/attribution, le fichier reste protégé et la livraison se fait par accès sécurisé. ${p.digital_file_name?'Fichier : '+esc(p.digital_file_name)+'.':''}</div>`:''}<div class="actions">${l?`<a class="btn primary" href="/${encodeURIComponent(l.slug)}">👤 Voir la vitrine</a>`:''}<a class="btn" href="/inbox">💬 Discuter avec le vendeur</a><a class="btn" href="/market">← Continuer le marché</a></div></div>`}load().catch(e=>{console.error('product_load',e);$('app').innerHTML='<div class="empty"><strong>Produit introuvable ou non publié.</strong><br><br><a class="btn primary" href="/market">Retour au Marché</a></div>'})</script></body></html>
