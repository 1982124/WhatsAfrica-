<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">Le réseau total WASSAFRICA</title><desc id="d">La diaspora, les entreprises, les artisans, les commerçants et les marchés reliés dans une seule expérience WASSAFRICA.</desc>
<defs><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity=".12"/></filter></defs>
<rect width="1600" height="900" rx="42" fill="#f5f7fb"/>
<text x="800" y="75" text-anchor="middle" font-family="system-ui,sans-serif" font-size="46" font-weight="900" fill="#163a72">Le réseau total <tspan fill="#165f9e">WASSAFRICA.</tspan></text>
<text x="800" y="118" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" fill="#334155">La diaspora, les entreprises, les artisans, les commerçants et les marchés restent reliés dans une seule expérience.</text>
<g stroke="#94a3b8" stroke-width="4" fill="none" opacity=".65">
<path d="M470 260 C600 300 620 350 670 390"/><path d="M470 450 C590 450 610 450 650 450"/><path d="M470 640 C590 590 620 550 670 510"/>
<path d="M1130 260 C1000 300 980 350 930 390"/><path d="M1130 450 C1010 450 990 450 950 450"/><path d="M1130 640 C1010 590 980 550 930 510"/>
</g>
<g filter="url(#s)" font-family="system-ui,sans-serif">
<g><rect x="70" y="205" width="400" height="125" rx="25" fill="#fff" stroke="#16a34a" stroke-width="3"/><circle cx="115" cy="267" r="30" fill="#16a34a"/><text x="165" y="252" font-size="24" font-weight="900" fill="#166534">LA DIASPORA</text><text x="165" y="284" font-size="18" fill="#475569">Restez connecté à vos proches et opportunités.</text></g>
<g><rect x="70" y="387" width="400" height="125" rx="25" fill="#fff" stroke="#2563eb" stroke-width="3"/><circle cx="115" cy="449" r="30" fill="#2563eb"/><text x="165" y="434" font-size="24" font-weight="900" fill="#1d4ed8">ENTREPRISES</text><text x="165" y="466" font-size="18" fill="#475569">Équipes, clients, croissance et présence.</text></g>
<g><rect x="70" y="569" width="400" height="125" rx="25" fill="#fff" stroke="#f59e0b" stroke-width="3"/><circle cx="115" cy="631" r="30" fill="#f59e0b"/><text x="165" y="616" font-size="24" font-weight="900" fill="#c2410c">ARTISANS</text><text x="165" y="648" font-size="18" fill="#475569">Savoir-faire, produits et activité.</text></g>
<g><rect x="1130" y="205" width="400" height="125" rx="25" fill="#fff" stroke="#f59e0b" stroke-width="3"/><circle cx="1485" cy="267" r="30" fill="#f59e0b"/><text x="1170" y="252" font-size="24" font-weight="900" fill="#c2410c">COMMERÇANTS</text><text x="1170" y="284" font-size="18" fill="#475569">Vendez, gagnez en visibilité et fidélisez.</text></g>
<g><rect x="1130" y="387" width="400" height="125" rx="25" fill="#fff" stroke="#7c3aed" stroke-width="3"/><circle cx="1485" cy="449" r="30" fill="#7c3aed"/><text x="1170" y="434" font-size="24" font-weight="900" fill="#6d28d9">MARCHÉS</text><text x="1170" y="466" font-size="18" fill="#475569">Marchés locaux et en ligne accessibles.</text></g>
<g><rect x="1130" y="569" width="400" height="125" rx="25" fill="#fff" stroke="#0f766e" stroke-width="3"/><circle cx="1485" cy="631" r="30" fill="#0f766e"/><text x="1170" y="616" font-size="24" font-weight="900" fill="#0f766e">TOUS CONNECTÉS</text><text x="1170" y="648" font-size="18" fill="#475569">Une seule expérience, des possibilités multiples.</text></g>
<circle cx="800" cy="450" r="165" fill="#fff" stroke="#163a72" stroke-width="8"/><text x="800" y="410" text-anchor="middle" font-size="70" font-weight="950" fill="#2563eb">WA</text><text x="800" y="462" text-anchor="middle" font-size="34" font-weight="900" fill="#172033">WASSAFRICA</text><text x="800" y="500" text-anchor="middle" font-size="19" fill="#64748b">Connecter • Valoriser • Développer</text>
</g>
<g font-family="system-ui,sans-serif" font-weight="800" text-anchor="middle">
