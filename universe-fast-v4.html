<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173d2d"><title>WASSAFRICA — Explorer</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script><script src="/brand-normalizer.js" defer></script><style>:root{--g:#173d2d;--gold:#e7a72f;--bg:#f6f3eb;--ink:#172019;--muted:#68746d;--line:#e0e5e1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui}.top{background:var(--g);color:#fff}.topin,.wrap{max-width:1100px;margin:auto;padding:14px 16px}.topin{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{color:#fff;text-decoration:none;font-size:22px;font-weight:950}nav{display:flex;gap:6px;overflow:auto}nav a{white-space:nowrap;color:#fff;text-decoration:none;padding:8px 10px;border-radius:999px;font-weight:800}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;margin-top:16px}.heroCopy{border-radius:24px;padding:27px;background:linear-gradient(135deg,#173d2d,#245941);color:#fff}.hero h1{font:800 clamp(38px,7vw,64px)/.98 Georgia;margin:8px 0}.hero p{color:#dcebe3}.search{display:flex;gap:8px;margin-top:16px}.search input{flex:1;padding:13px;border:0;border-radius:12px;font:inherit}.search button{border:0;border-radius:12px;padding:0 16px;background:#fff;color:var(--g);font-weight:900}.heroPhoto{min-height:280px;border-radius:24px;overflow:hidden;background:#dfe9e2}.heroPhoto img{width:100%;height:100%;object-fit:cover;display:block}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.chip{border:1px solid #ffffff33;background:#ffffff12;color:#fff;border-radius:999px;padding:7px 10px;font-weight:800;cursor:pointer}.section{margin-top:24px}.head{display:flex;justify-content:space-between;align-items:center}.head h2{margin:0;font-size:24px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}.icon{width:45px;height:45px;border-radius:13px;background:#eaf2ec;display:grid;place-items:center;font-size:23px}.muted{color:var(--muted)}.btn{display:inline-flex;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:#fff;color:var(--ink);text-decoration:none;font-weight:850;margin-top:9px}.primary{background:var(--g);border-color:var(--g);color:#fff}.empty{padding:26px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--muted);grid-column:1/-1}.bottom{margin-top:28px;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px}.bottom a{text-align:center;padding:8px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:850}.bottom .active{color:var(--g);background:#edf4ef;border-radius:10px}@media(max-width:760px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{padding:12px}.search{display:grid;grid-template-columns:1fr}.search button{padding:12px}}</style></head><body><header class="top"><div class="topin"><a class="brand" href="/">WASSAFRICA</a><nav><a href="/inbox">💬 Discussions</a><a href="/universe">🌍 Explorer</a><a href="/groups">👥 Communautés</a><a href="/market">🛒 Marché</a><a href="/dashboard">👤 Moi</a></nav></div></header><main class="wrap"><section class="hero"><div class="heroCopy"><div style="font-size:11px;letter-spacing:2px;font-weight:900;color:#f7d98c">DÉCOUVRIR</div><h1>Explorez. Trouvez. Connectez.</h1><p>Des personnes, des activités, des communautés et des offres réelles à découvrir.</p><form id="search" class="search"><input id="q" placeholder="Personne, activité, communauté ou produit…"><button>Rechercher</button></form><div class="chips"><button class="chip" data-filter="all">Tout</button><button class="chip" data-filter="groups">👥 Communautés</button><button class="chip" data-filter="businesses">🏪 Activités</button><button class="chip" data-filter="products">🛒 Produits</button></div></div><div class="heroPhoto"><img src="https://images.pexels.com/photos/33569518/pexels-photo-33569518.jpeg?auto=compress&cs=tinysrgb&w=900" alt="Entrepreneure africaine" loading="lazy" decoding="async"></div></section><section class="section"><div class="head"><h2>À découvrir</h2><a href="/market">Voir le marché</a></div><div id="grid" class="grid"><div class="empty">Chargement…</div></div></section><div class="bottom"><a href="/inbox">💬<br>Discussions</a><a class="active" href="/universe">🌍<br>Explorer</a><a href="/groups">👥<br>Communautés</a><a href="/market">🛒<br>Marché</a><a href="/dashboard">👤<br>Moi</a></div></main><script>window.addEventListener('load',async()=>{const db=supabase.createClient('https://dzifpwqrqnvssfhwjccj.supabase.co','sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV'),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));let data={groups:[],businesses:[],products:[]},filter='all';const card=(t,x)=>t==='groups'?'<article class="card"><div class="icon">👥</div><h3>'+esc(x.name)+'</h3><p class="muted">'+esc(x.description||'Communauté WASSAFRICA')+'</p><a class="btn primary" href="/groups/'+encodeURIComponent(x.id)+'">Voir</a></article>':t==='businesses'?'<article class="card"><div class="icon">🏪</div><h3>'+esc(x.name)+'</h3><p class="muted">'+esc(x.tagline||x.business_type||'Activité')+'</p><p class="muted">'+esc([x.city,x.country].filter(Boolean).join(', '))+'</p>'+(x.slug?'<a class="btn primary" href="/'+encodeURIComponent(x.slug)+'">Découvrir</a>':'')+'</article>':'<article class="card"><div class="icon">🛒</div><h3>'+esc(x.title)+'</h3><p class="muted">'+esc(x.description||'Produit')+'</p><a class="btn primary" href="/product/'+encodeURIComponent(x.id)+'">Voir l’offre</a></article>';function render(){const q=$('q').value.trim().toLowerCase(),out=[];[['groups','👥 Communautés',data.groups],['businesses','🏪 Activités',data.businesses],['products','🛒 Produits',data.products]].forEach(([t,l,a])=>{if(filter!=='all'&&filter!==t)return;const r=a.filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q));if(r.length)out.push('<div style="grid-column:1/-1"><h2>'+l+'</h2></div>'+r.map(x=>card(t,x)).join(''))});$('grid').innerHTML=out.join('')||'<div class="empty">Aucun résultat.</div>'}$('search').onsubmit=e=>{e.preventDefault();render()};document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});const [g,b,p]=await Promise.all([db.from('groups').select('id,name,description,is_business').order('created_at',{ascending:false}).limit(12),db.from('businesses').select('id,name,slug,tagline,city,country,business_type').order('created_at',{ascending:false}).limit(12),db.from('products').select('id,title,description,price,currency,business_id').eq('is_published',true).order('created_at',{ascending:false}).limit(12)]);data.groups=g.data||[];data.businesses=b.data||[];data.products=p.data||[];render()})</script></body></html>
