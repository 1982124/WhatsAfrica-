<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WASSAFRICA Brand Engine Preview</title><script src="/wa-smartlink-brand-engine-v1.js"></script><style>body{margin:0;font:15px system-ui;background:#f4f4f1;color:#171717}.wrap{max-width:1100px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.card{border-radius:24px;overflow:hidden;border:1px solid #ddd;background:white}.hero{height:210px;padding:22px;display:flex;flex-direction:column;justify-content:flex-end}.meta{padding:18px}.ey{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;font-weight:900}.name{font:800 34px Georgia,serif;margin:8px 0}.sw{display:flex;gap:7px;margin-top:12px}.sw i{width:28px;height:28px;border-radius:50%;border:1px solid #0002}.row{display:flex;justify-content:space-between;font-size:12px;color:#666;margin-top:12px}</style><div class="wrap"><div class="ey">WASSAFRICA · Brand Engine V1</div><h1>Une identité différente pour chaque activité.</h1><p>Test visuel déterministe : métier + couleur préférée → palette cohérente, contraste et direction visuelle.</p><div id="grid" class="grid"></div></div><script>const cases=[['Mode / couture','#7d3342'],['Restaurant','#b55e35'],['Immobilier','#49657c'],['Finance','#244f73'],['Beauté','#a56b78'],['Tech','#4d5bd5'],['Agriculture','#657b42'],['Artisanat','#9a6037'],['Formation','#397b78']];document.getElementById('grid').innerHTML=cases.map(([name,color])=>{const p=WASSAFRICA_BRAND_ENGINE.build({activity:name,accent_color:color});return `<article class="card"><div class="hero" style="background:${p.hero};color:#fff"><span class="ey">${p.family}</span><div class="name">Votre activité</div><span>Une présentation qui vous ressemble.</span></div><div class="meta"><strong>${name}</strong><div class="sw"><i style="background:${p.accent}"></i><i style="background:${p.accentSoft}"></i><i style="background:${p.bg}"></i><i style="background:${p.ink}"></i></div><div class="row"><span>Contraste accent/blanc</span><b>${p.contrastOnWhite.toFixed(2)}:1</b></div><div class="row"><span>Direction</span><b>${p.font}</b></div></div></article>`}).join('')</script>
