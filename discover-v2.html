<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>WASSAFRICA — Découvrir qui vend quoi, où</title><meta name="description" content="Trouvez qui vend quoi, où, et contactez directement l'activité sur WASSAFRICA."><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f7f3ea;color:#17231e;font:16px system-ui}.wrap{max-width:1100px;margin:auto;padding:18px}.nav{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-weight:950;font-size:22px;color:#173d2d}.brand b{color:#c98a16}.btn{display:inline-flex;padding:11px 14px;border:1px solid #ddd6c8;border-radius:13px;background:#fff;color:#17231e;text-decoration:none;font-weight:850}.primary{background:#173d2d;color:#fff;border-color:#173d2d}.hero{padding:60px 0 25px}.ey{font-size:11px;letter-spacing:2px;color:#c98a16;font-weight:950}.hero h1{font:800 clamp(40px,7vw,70px)/1.02 Georgia,serif;margin:8px 0 15px}.hero p{max-width:720px;color:#68746d;font-size:18px}.search{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;margin-top:25px}.input{padding:14px;border:1px solid #ddd6c8;border-radius:13px;font:inherit;min-width:0}.hint{color:#68746d;font-size:13px;margin-top:10px}.meta{margin:25px 0 12px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:#fff;border:1px solid #e1dbcf;border-radius:20px;padding:17px}.where{color:#68746d;font-weight:700}.empty{text-align:center;padding:35px;border:1px dashed #cfc7b8;border-radius:20px;color:#68746d}@media(max-width:800px){.search{grid-template-columns:1fr 1fr}.search .q{grid-column:1/-1}.search button{grid-column:1/-1}.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.search,.grid{grid-template-columns:1fr}.search>*{grid-column:auto!important}.hero{padding-top:35px}}</style></head><body><main class="wrap"><nav class="nav"><div class="brand">WASSA<b>FRICA</b></div><a class="btn" href="/">Accueil</a></nav><section class="hero"><div class="ey">RÉSEAU D'ACTIVITÉS AFRICAINES</div><h1>Qui vend quoi, où ?</h1><p>Trouvez une activité, un produit ou un professionnel par besoin et localisation. Ensuite, ouvrez sa vitrine et contactez-le directement.</p><div class="search"><input id="q" class="input q" placeholder="Ex. chaussures, maçon, karité…"><input id="country" class="input" placeholder="Pays"><input id="city" class="input" placeholder="Ville"><button id="go" class="btn primary">Rechercher</button></div><div class="hint">Exemple : chaussures · Mali · Bamako</div></section><div id="meta" class="meta">Chargement…</div><section id="results" class="grid"><div class="empty">Chargement…</div></section></main><script>const db=supabase.createClient('https://dzifpwqrqnvssfhwjccj.supabase.co','sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV');const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function load(){const q=$('q').value.trim().toLowerCase(),country=$('country').value.trim().toLowerCase(),city=$('city').value.trim().toLowerCase();$('meta').textContent='Recherche…';let b=await db.from('businesses').select('id,name,description,presentation,country,city,phone').limit(200);if(b.error){$('meta').textContent='Recherche indisponible';$('results').innerHTML='<div class="empty">Impossible de charger les activités.</div>';return}let rows=(b.data||[]).filter(x=>x.name);if(q){const p=await db.from('products').select('business_id,title,description').eq('is_published',true).limit(500);const terms=new Map();(p.data||[]).forEach(x=>{const a=terms.get(x.business_id)||[];a.push(x.title,x.description);terms.set(x.business_id,a)});rows=rows.filter(x=>[x.name,x.description,x.presentation,x.country,x.city,...(terms.get(x.id)||[])].join(' ').toLowerCase().includes(q))}if(country)rows=rows.filter(x=>String(x.country||'').toLowerCase().includes(country));if(city)rows=rows.filter(x=>String(x.city||'').toLowerCase().includes(city));const s=await db.from('smart_links').select('business_id,slug').eq('is_public',true).limit(500);const map=new Map((s.data||[]).map(x=>[x.business_id,x.slug]));rows=rows.map(x=>({...x,slug:map.get(x.id)})).filter(x=>x.slug);$('meta').textContent=rows.length+(rows.length>1?' activités trouvées':' activité trouvée');$('results').innerHTML=rows.length?rows.map(x=>`<article class="card"><div class="ey">ACTIVITÉ</div><h2>${esc(x.name)}</h2><div class="where">${x.city||x.country?'📍 '+esc([x.city,x.country].filter(Boolean).join(' · ')):''}</div><p>${esc((x.presentation||x.description||'').slice(0,180))}</p><a class="btn primary" href="/${encodeURIComponent(x.slug)}">Voir la vitrine</a> ${x.phone?`<a class="btn" href="tel:${esc(x.phone)}">Appeler</a>`:''}</article>`).join(''):'<div class="empty">Aucune activité trouvée. Essayez un autre mot ou une autre ville.</div>'}$('go').onclick=load;['q','country','city'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')load()}));load();</script></body></html>
