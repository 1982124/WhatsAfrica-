<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WhatsAfrica — Paiements</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f7f8fa;color:#172033;font:15px system-ui,-apple-system,sans-serif}.wrap{max-width:920px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.card{background:#fff;border:1px solid #e4e8ef;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 4px 18px #1720330b}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.btn{display:block;width:100%;box-sizing:border-box;padding:13px;border:0;border-radius:12px;font-weight:800;cursor:pointer;background:#1f8f5f;color:#fff}.ghost{background:#fff;color:#172033;border:1px solid #d9dfe8}.muted{color:#667085}.status{padding:10px 12px;border-radius:10px;background:#f0f4f8}.item{padding:13px 0;border-top:1px solid #edf0f4}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2f6;font-size:12px}.ok{color:#16804b}.warn{color:#9a6700}@media(max-width:650px){.grid,.actions{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.wrap{padding:14px}}
</style></head><body><main class="wrap"><div class="top"><div><h1>💳 Paiements</h1><p class="muted">Utilisez vos services financiers depuis WhatsAfrica, avec des partenaires autorisés.</p></div><a class="btn ghost" href="/inbox" style="width:auto;text-decoration:none">Messages</a></div><section class="card"><div id="auth" class="status">Vérification de votre compte…</div><div id="app" hidden><h2>Mes services</h2><div id="connections" class="muted">Chargement…</div></div></section><section class="card" id="operations" hidden><h2>Opérations</h2><div class="actions"><button class="btn" data-kind="send">Envoyer une demande</button><button class="btn" data-kind="receive">Recevoir un paiement</button><button class="btn ghost" data-kind="deposit">Préparer un dépôt</button><button class="btn ghost" data-kind="withdrawal">Préparer un retrait</button></div><p id="msg" class="muted"></p></section><section class="card" id="history" hidden><h2>Mes demandes</h2><div id="requests" class="muted">Chargement…</div></section></main><script>const db=supabase.createClient('https://dzifpwqrqnvssfhwjccj.supabase.co','sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV'),$=id=>document.getElementById(id);let user=null;function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}async function boot(){const r=await db.auth.getUser();if(r.error||!r.data.user){$('auth').innerHTML='Connectez-vous pour accéder à vos paiements. <a href="/auth">Se connecter</a>';return}user=r.data.user;$('auth').innerHTML='<span class="ok">Compte connecté.</span>';$('app').hidden=false;$('operations').hidden=false;$('history').hidden=false;await Promise.all([loadConnections(),loadRequests()])}async function loadConnections(){const r=await db.from('payment_connections').select('provider,account_type,status,country_code').eq('user_id',user.id).order('created_at',{ascending:false});if(r.error){$('connections').textContent=r.error.message;return}if(!r.data.length){$('connections').innerHTML='<span class="warn">Aucun service financier partenaire n’est encore connecté à votre compte.</span><p class="muted">Vous pourrez relier Mobile Money, banque ou autre service dès qu’un partenaire compatible sera activé.</p>';return}$('connections').innerHTML=r.data.map(x=>`<div class="item"><b>${esc(x.provider)}</b> · ${esc(x.account_type)} · <span class="pill">${esc(x.status)}</span></div>`).join('')}async function loadRequests(){const r=await db.from('payment_requests').select('id,amount,currency,kind,status,created_at').eq('requester_id',user.id).order('created_at',{ascending:false}).limit(20);if(r.error){$('requests').textContent=r.error.message;return}if(!r.data.length){$('requests').textContent='Aucune demande pour le moment.';return}$('requests').innerHTML=r.data.map(x=>`<div class="item"><b>${esc(x.kind)}</b> · ${esc(x.amount)} ${esc(x.currency)} · <span class="pill">${esc(x.status)}</span><br><span class="muted">${new Date(x.created_at).toLocaleString('fr-FR')}</span></div>`).join('')}document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=async()=>{const kind=b.dataset.kind;const amount=prompt('Montant à préparer (ex. 5000)');if(!amount||Number(amount)<=0)return;const currency=prompt('Devise','XOF')||'XOF';const r=await db.from('payment_requests').insert({requester_id:user.id,amount:Number(amount),currency,purpose:'WhatsAfrica',kind,status:'created'});if(r.error){$('msg').textContent=r.error.message;return}$('msg').innerHTML='<span class="ok">Demande enregistrée. Aucun mouvement d’argent n’a été exécuté.</span>';await loadRequests()});boot();</script></body></html>
