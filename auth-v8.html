<!doctype html><html lang="fr"><head><script src="/i18n.js" defer></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WASSAFRICA — Connexion</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#071b16;color:#f5f7f3;font:15px system-ui;min-height:100vh;display:grid;place-items:center}.card{width:min(460px,calc(100% - 32px));background:#f7f1df;color:#17211d;border-radius:24px;padding:28px}.btn{width:100%;height:52px;border:0;border-radius:13px;margin-top:12px;font-weight:900;cursor:pointer}.primary{background:#21784c;color:#fff}.secondary{background:#fff;border:1px solid #d7d1c4;color:#24312b}.muted{color:#65716b;line-height:1.5}</style></head><body><main class="card"><strong style="font-size:23px">WASSAFRICA</strong><p style="color:#d49a2c;font-weight:900;letter-spacing:2px">ACCÈS</p><h1>Reprenez exactement votre parcours.</h1><p class="muted">La destination demandée est conservée pendant toute la connexion.</p><button id="google" class="btn primary">🌐 Continuer avec Google</button><button id="back" class="btn secondary">← Retour</button><p id="status" class="muted"></p></main><script>(async()=>{const URL='https://dzifpwqrqnvssfhwjccj.supabase.co',KEY='sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV',K='wa-auth-next-v2',db=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),q=new URLSearchParams(location.search);let next=q.get('next')||'/';try{const u=new URL(next,location.origin);next=u.origin===location.origin&&u.pathname!=='/auth'?u.pathname+u.search+u.hash:'/'}catch{next='/'}try{sessionStorage.setItem(K,next)}catch{}const status=t=>document.getElementById('status').textContent=t;const go=()=>{let d=next;try{const s=sessionStorage.getItem(K);if(s)d=s}catch{}location.replace(d||'/')};const s=await db.auth.getSession();if(s.data?.session){go();return}db.auth.onAuthStateChange((event,session)=>{if(session&&(event==='SIGNED_IN'||event==='INITIAL_SESSION'||event==='TOKEN_REFRESHED'))setTimeout(go,50)});document.getElementById('google').onclick=async()=>{document.getElementById('google').disabled=true;status('Ouverture de Google…');const r=await db.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+'/auth?next='+encodeURIComponent(next),queryParams:{prompt:'select_account'}}});if(r.error){status(r.error.message);document.getElementById('google').disabled=false}};document.getElementById('back').onclick=go})().catch(e=>document.getElementById('status').textContent=e.message||'Connexion impossible')</script></body></html>
