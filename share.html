essage'?'un message':x.resource_type==='group'?'une communauté':'une vitrine business';$('title').textContent='Découvrez '+label+' sur WhatsAfrica';$('desc').textContent='Ce contenu a été partagé avec vous via WhatsAfrica. Ouvrez-le, puis découvrez l’écosystème WhatsAfrica pour communiquer, explorer et faire des affaires.';const shareData={title:'WhatsAfrica — '+label,text:'Découvrez '+label+' sur WhatsAfrica. Communiquez, découvrez et faites des affaires.',url:location.href};$('share').onclick=async()=>{try{if(navigator.share){await navigator.share(shareData);return}}catch(e){if(e?.name==='AbortError')return}try{await navigator.clipboard.writeText(location.href);$('share').textContent='✓ Lien WhatsAfrica copié'}catch{}}}load();</script></body></html>
