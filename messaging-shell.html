pt>(?=<\/body>)/,'$1<\/script>');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<main class="boot"><div class="boot-card"><div class="boot-title">WASSAFRICA</div><div class="boot-text">Impossible d’ouvrir les discussions pour le moment. Réessayez dans un instant.</div></div></main>';console.error('WASSAFRICA inbox shell',e)}})();</script></body></html>
