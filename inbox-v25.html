async function ensureKey(c){const latest=await latestKey(c);if(latest)return latest;const r=await rpc('start_conversation_key_epoch',{p_conversation_id:c,p_device_id:device.id}),v=Number(Array.isArray(r)?(r[0]?.key_version??r[0]):(r?.key_version??r));if(!Number.isInteger(v)||v<1)throw Error('KEY_EPOCH_INVALID');const k=crypto.getRandomValues(new Uint8Array(32));await distribute(c,k,v);const out={key:k,version:v};keyCache.set(c+':'+v,out);return out}

async function editMessage(r,old){if((Date.now()-new Date(r.created_at).getTime())>15*60*1000)return;const next=window.prompt('Modifier le message',old);if(next==null)return;const text=next.trim();if(!text||text===old)return;try{const x=await latestKey(current.id),e=await encryptText(current.id,r.id,text,x.key,x.version);await rest('messages_v2','id=eq.'+encodeURIComponent(r.id)+'&sender_id=eq.'+encodeURIComponent(user.id),{method:'PATCH',body:JSON.stringify({body:null,ciphertext:e.ciphertext,encryption_metadata:{v:2,alg:'AES-256-GCM',iv:e.iv,conversation_id:current.id,message_id:r.id,key_version:x.version,edited_at:new Date().toISOString()}})});await loadMessages()}catch{}}
async function deleteForMe(id){uiState.hidden[id]=true;saveUI();await loadMessages()}
async function deleteForEveryone(id){if(!window.confirm('Supprimer ce message pour tous ?'))return;try{await rest('messages_v2','id=eq.'+encodeURIComponent(id)+'&sender_id=eq.'+encodeURIComponent(user.id),{method:'DELETE'});await loadMessages()}catch{}}
async function toggleStar(id){if(uiState.starred[id])delete uiState.starred[id];else uiState.starred[id]=true;saveUI();await loadMessages()}
async function reactMessage(id){const emoji=window.prompt('Réaction : 👍 ❤️ 😂 😮 😢 🙏','👍');if(!emoji||!['👍','❤️','😂','😮','😢','🙏'].includes(emoji.trim()))return;const reaction=emoji.trim();try{const exists=(reactionCache[id]||[]).find(x=>x.user_id===user.id&&x.reaction===reaction);if(exists)await rest('message_reactions','id=eq.'+encodeURIComponent(exists.id),{method:'DELETE'});else await rest('message_reactions','',{method:'POST',body:JSON.stringify({message_id:id,user_id:user.id,reaction})});await loadMessages()}catch{}}
async function showForward(r,text){const box=$('forwardList');box.innerHTML='';const targets=conversationCache.filter(c=>c.id!==current.id);for(const c of targets){const b=document.createElement('button');b.textContent=c.title||'Conversation';b.onclick=async()=>{try{const x=await ensureKey(c.id),id=crypto.randomUUID(),e=await encryptText(c.id,id,text,x.key,x.version);await rest('messages_v2','',{method:'POST',body:JSON.stringify({id,conversation_id:c.id,sender_id:user.id,body:null,message_type:'text',encryption_version:1,ciphertext:e.ciphertext,encryption_metadata:{v:2,alg:'AES-256-GCM',iv:e.iv,conversation_id:c.id,message_id:id,key_version:x.version,forwarded_from:r.id}})});$('forwardModal').classList.remove('show')}catch{}};box.appendChild(b)}if(!box.children.length)box.innerHTML='<div class="empty">Aucune autre conversation.</div>'; $('forwardModal').classList.add('show')}
async function send(e){e.preventDefault();const text=$('body').value.trim();if(!text||!current)return;$('send').disabled=true;try{const x=await latestKey(current.id),id=crypto.randomUUID(),e2=await encryptText(current.id,id,text,x.key,x.version);const meta={v:2,alg:'AES-256-GCM',iv:e2.iv,conversation_id:current.id,message_id:id,key_version:x.version};if(replyTo)meta.reply_to_id=replyTo.id;await rest('messages_v2','',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({id,conversation_id:current.id,sender_id:user.id,body:null,message_type:'text',encryption_version:1,ciphertext:e2.ciphertext,encryption_metadata:meta})});$('body').value='';clearReply();await loadMessages()}catch{ }finally{$('send').disabled=false;$('body').focus()}}
async function openConv(c){current=c;keyCache.clear();$('title').textContent=(c.title||'Conversation').replace(/^Conversation directe$/,'Discussion');$('subtitle').textContent='';$('chatAvatar').textContent=(c.title||'W').trim().charAt(0).toUpperCase();clearReply();if(timer)clearInterval(timer);await loadMessages();timer=setInterval(()=>loadMessages().catch(()=>{}),3500)}
async function boot(){try{await auth();await ensureDevice();$('app').hidden=false;await list();$('gate').hidden=true}catch(e){$('gate').innerHTML='<div style="font-weight:750;margin-bottom:6px">Connectez-vous pour accéder à vos messages.</div><a href="/auth">Se connecter</a>'}}
$('start').onclick=start;$('target').addEventListener('input',renderList);$('target').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();start()}});$('chatSearch').addEventListener('input',()=>loadMessages().catch(()=>{}));$('composer').addEventListener('submit',send);$('clearReply').onclick=clearReply;$('closeForward').onclick=()=>$('forwardModal').classList.remove('show');$('forwardModal').addEventListener('click',e=>{if(e.target.id==='forwardModal')$('forwardModal').classList.remove('show')});boot();
})();
</script>
