<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>WASSAFRICA — Appel Internet</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/brand-normalizer.js"></script><script src="/brand-observer.js"></script><style>:root{--bg:#071019;--card:#101c2a;--line:#26384d;--text:#fff;--muted:#aebdce;--gold:#f2b84b;--green:#22c7a3;--danger:#e85d75}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#213653,#071019 48%);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:900px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:23px;font-weight:950}.sub,.status{color:var(--muted);line-height:1.5}.card{background:linear-gradient(145deg,#122033,#0c1622);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}.btn{border:0;border-radius:13px;padding:12px 15px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.gold{background:var(--gold);color:#171208}.green{background:var(--green);color:#061511}.ghost{background:transparent;color:#fff;border:1px solid var(--line)}.danger{background:var(--danger);color:#fff}.row{display:flex;gap:9px;flex-wrap:wrap}.row .btn{flex:1}.hidden{display:none!important}.stage{display:grid;grid-template-columns:1fr 1fr;gap:12px}.video{position:relative;background:#000;border-radius:18px;overflow:hidden;aspect-ratio:16/10}.video video{width:100%;height:100%;object-fit:cover;display:block}.video .label{position:absolute;left:10px;bottom:10px;background:#0009;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:800}.controls{display:flex;gap:9px;justify-content:center;margin-top:12px}.controls .btn{min-width:120px}.incoming{border:1px solid #31506d;background:#0e2234;border-radius:16px;padding:14px;margin-top:10px}.incoming strong{display:block;margin-bottom:5px}@media(max-width:700px){.stage{grid-template-columns:1fr}.wrap{padding:10px}.controls .btn{min-width:0;flex:1}}</style></head><body><main class="wrap"><div class="top"><div><div class="brand">WASSAFRICA</div><div class="sub">Appels Internet · Wi‑Fi ou données mobiles</div></div><a class="btn ghost" href="/inbox">💬 Messages</a></div><section id="gate" class="card">Connexion sécurisée…</section><main id="app" class="hidden"><section class="card"><h2 id="title" style="margin:0 0 5px">Appel Internet</h2><p id="info" class="sub">Votre connexion Internet transporte l'appel. WASSAFRICA ne fournit pas de minutes téléphoniques.</p><div id="incoming"></div><div class="stage"><div class="video"><video id="remote" autoplay playsinline></video><span class="label">Correspondant</span></div><div class="video"><video id="local" autoplay playsinline muted></video><span class="label">Vous</span></div></div><div class="controls"><button id="mute" class="btn ghost">🎙️ Micro</button><button id="camera" class="btn ghost">📹 Caméra</button><button id="hangup" class="btn danger">☎ Terminer</button></div><p id="status" class="status"></p></section></main></main><script>(function(){'use strict';const SB='https://dzifpwqrqnvssfhwjccj.supabase.co',KEY='sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV',AUTH='whatsafrica-auth',db=supabase.createClient(SB,KEY),$=id=>document.getElementById(id),status=t=>{$('status').textContent=t};let session,user,pc,stream,currentCall,currentConv,seen=new Set(),pollTimer,initiator=false,offerStarted=false;const ice={iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun.cloudflare.com:3478']}],iceCandidatePoolSize:4};function readSession(){try{const x=JSON.parse(localStorage.getItem(AUTH)||'null');return x?.access_token?x:null}catch{return null}}async function auth(){session=readSession();if(!session?.access_token)throw Error('AUTH_REQUIRED');user=session.user;if(!user?.id)throw Error('AUTH_REQUIRED')}async function api(table,params='',opt={}){const h={apikey:KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json',...(opt.headers||{})};const r=await fetch(SB+'/rest/v1/'+table+(params?'?'+params:''),{...opt,headers:h});const d=await r.json().catch(()=>null);if(!r.ok)throw Error(d?.message||d?.hint||'HTTP_'+r.status);return d}async function rpc(fn,body){const r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>null);if(!r.ok)throw Error(d?.message||d?.hint||'RPC_'+r.status);return d}function q(){return new URLSearchParams(location.search)}async function resolveTarget(){const businessId=q().get('business');if(!businessId)return null;const rows=await api('businesses','select=id,name,owner_id,phone&id=eq.'+encodeURIComponent(businessId)+'&limit=1');const b=rows?.[0];if(!b?.owner_id)throw Error('BUSINESS_OWNER_NOT_FOUND');return b}async function startConversation(ownerId){const r=await rpc('start_direct_conversation_by_user_id',{p_user_id:ownerId}),x=Array.isArray(r)?r[0]:r;if(!x?.conversation_id)throw Error('CONVERSATION_NOT_AVAILABLE');return x.conversation_id}async function sendSignal(kind,payload){if(!currentCall)return;await api('call_signals','',{method:'POST',body:JSON.stringify({id:crypto.randomUUID(),call_id:currentCall,sender_id:user.id,kind,payload})})}async function makeSession(convId,mode){const id=crypto.randomUUID();const expires=new Date(Date.now()+90000).toISOString();await api('call_sessions','',{method:'POST',body:JSON.stringify({id,conversation_id:convId,initiator_id:user.id,status:'ringing',media_mode:mode,expires_at:expires})});await api('call_participants','',{method:'POST',body:JSON.stringify({call_id:id,user_id:user.id,role:'initiator'})});const members=await api('conversation_members','select=user_id&conversation_id=eq.'+encodeURIComponent(convId));const peer=[...new Set((members||[]).map(x=>x.user_id))].find(x=>x!==user.id);if(!peer)throw Error('PEER_NOT_FOUND');await api('call_participants','',{method:'POST',body:JSON.stringify({call_id:id,user_id:peer,role:'participant'})});await api('call_inbox','',{method:'POST',body:JSON.stringify({id:crypto.randomUUID(),call_id:id,recipient_id:peer,sender_id:user.id,status:'ringing'})});return{id,peer}}async function localMedia(mode){if(!navigator.mediaDevices?.getUserMedia)throw Error('MEDIA_UNAVAILABLE');if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia(mode==='audio'?{audio:true,video:false}:{audio:true,video:true});$('local').srcObject=stream}function setupPeer(){pc=new RTCPeerConnection(ice);stream?.getTracks().forEach(t=>pc.addTrack(t,stream));pc.ontrack=e=>{if(e.streams[0])$('remote').srcObject=e.streams[0]};pc.onicecandidate=e=>{if(e.candidate)sendSignal('ice',e.candidate.toJSON()).catch(()=>{})};pc.onconnectionstatechange=()=>{const s=pc.connectionState;if(s==='connected')status('🟢 Appel Internet connecté.');if(['failed','disconnected'].includes(s))status('⚠️ Connexion interrompue.');if(s==='closed')status('Appel terminé.')}}async function beginOffer(){if(offerStarted||!pc)return;offerStarted=true;const offer=await pc.createOffer();await pc.setLocalDescription(offer);await sendSignal('offer',pc.localDescription.toJSON());status('📞 Appel en attente de connexion…')}async function acceptIncoming(callId){currentCall=callId;initiator=false;const rows=await api('call_sessions','select=id,conversation_id,initiator_id,media_mode,status&id=eq.'+encodeURIComponent(callId)+'&limit=1');const c=rows?.[0];if(!c)throw Error('CALL_NOT_FOUND');currentConv=c.conversation_id;await api('call_sessions','id=eq.'+encodeURIComponent(callId),{method:'PATCH',body:JSON.stringify({status:'accepted',answered_at:new Date().toISOString()})});await api('call_participants','call_id=eq.'+encodeURIComponent(callId)+'&user_id=eq.'+encodeURIComponent(user.id),{method:'PATCH',body:JSON.stringify({joined_at:new Date().toISOString()})});await sendSignal('accept',{ok:true});await localMedia(c.media_mode);setupPeer();$('incoming').innerHTML='';status('🟢 Appel accepté. Connexion…')}async function rejectIncoming(callId){await api('call_sessions','id=eq.'+encodeURIComponent(callId),{method:'PATCH',body:JSON.stringify({status:'rejected',ended_at:new Date().toISOString()})});await api('call_inbox','call_id=eq.'+encodeURIComponent(callId)+'&recipient_id=eq.'+encodeURIComponent(user.id),{method:'PATCH',body:JSON.stringify({status:'rejected',seen_at:new Date().toISOString()})});$('incoming').innerHTML='';status('Appel refusé.')}async function showIncoming(){const rows=await api('call_inbox','select=call_id,sender_id,status,created_at&recipient_id=eq.'+encodeURIComponent(user.id)+'&status=eq.ringing&order=created_at.desc&limit=5');$('incoming').innerHTML=(rows||[]).map(r=>`<div class="incoming"><strong>📞 Appel WASSAFRICA entrant</strong><span class="sub">Un membre souhaite vous appeler via Internet.</span><div class="row" style="margin-top:10px"><button class="btn green" onclick="window.acceptCall('${r.call_id}')">Accepter</button><button class="btn danger" onclick="window.rejectCall('${r.call_id}')">Refuser</button></div></div>`).join('')}async function processSignals(){if(!currentCall)return;const rows=await api('call_signals','select=id,sender_id,kind,payload,created_at&call_id=eq.'+encodeURIComponent(currentCall)+'&order=created_at.asc&limit=100');for(const s of rows||[]){if(s.sender_id===user.id||seen.has(s.id))continue;seen.add(s.id);try{if(s.kind==='accept'&&initiator){await localMedia(q().get('mode')==='audio'?'audio':'audio_video');setupPeer();await beginOffer()}else if(s.kind==='offer'&&!initiator){await pc.setRemoteDescription(s.payload);const ans=await pc.createAnswer();await pc.setLocalDescription(ans);await sendSignal('answer',pc.localDescription.toJSON());status('🟢 Connexion vidéo en cours…')}else if(s.kind==='answer'&&initiator){await pc.setRemoteDescription(s.payload);status('🟢 Appel Internet connecté.')}else if(s.kind==='ice'&&pc){try{await pc.addIceCandidate(s.payload)}catch{}}else if(s.kind==='hangup'){finish(false)}else if(s.kind==='reject'){status('Appel refusé.');finish(false)}}catch(e){status('Signal d’appel : '+e.message)}}}async function startOutgoing(){const b=await resolveTarget();if(!b)throw Error('BUSINESS_REQUIRED');currentConv=await startConversation(b.owner_id);const mode=q().get('mode')==='audio'?'audio':'audio_video';const c=await makeSession(currentConv,mode);currentCall=c.id;initiator=true;$('title').textContent='Appel avec '+(b.name||'ce business');await api('call_inbox','call_id=eq.'+encodeURIComponent(currentCall)+'&sender_id=eq.'+encodeURIComponent(user.id),{method:'PATCH',body:JSON.stringify({status:'ringing'})});status('📞 Appel Internet lancé. Awa doit accepter sur son appareil.')}async function hangup(){if(!currentCall){history.back();return}try{await sendSignal('hangup',{ok:true});await api('call_sessions','id=eq.'+encodeURIComponent(currentCall),{method:'PATCH',body:JSON.stringify({status:'ended',ended_at:new Date().toISOString()})})}catch{}finish(true)}function finish(back){if(pc){pc.close();pc=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('local').srcObject=null;$('remote').srcObject=null;if(back)setTimeout(()=>history.back(),250)}window.acceptCall=acceptIncoming;window.rejectCall=rejectIncoming;window.addEventListener('beforeunload',()=>{try{stream?.getTracks().forEach(t=>t.stop());pc?.close()}catch{}});(async()=>{try{await auth();$('gate').classList.add('hidden');$('app').classList.remove('hidden');$('hangup').onclick=hangup;$('mute').onclick=()=>{const t=stream?.getAudioTracks?.()[0];if(t){t.enabled=!t.enabled;$('mute').textContent=t.enabled?'🎙️ Micro':'🔇 Micro coupé'}};$('camera').onclick=()=>{const t=stream?.getVideoTracks?.()[0];if(t){t.enabled=!t.enabled;$('camera').textContent=t.enabled?'📹 Caméra':'🚫 Caméra coupée'}};await showIncoming();const b=await resolveTarget();if(b){await startOutgoing()}else status('En attente d’un appel entrant…');pollTimer=setInterval(async()=>{try{await showIncoming();if(currentCall)await processSignals();if(currentCall){const s=(await api('call_sessions','select=status,expires_at&id=eq.'+encodeURIComponent(currentCall)+'&limit=1'))?.[0];if(s?.status==='ended'||s?.status==='rejected'||s?.status==='missed')finish(false);}}catch(e){status('Synchronisation : '+e.message)}},1500)}catch(e){$('gate').innerHTML=e.message==='AUTH_REQUIRED'?'<b>Connexion requise</b><p class="sub">Connectez-vous à WASSAFRICA pour utiliser les appels Internet.</p><a class="btn gold" href="/auth?next='+encodeURIComponent(location.pathname+location.search)+'">Se connecter</a>':'<b>Impossible de démarrer l’appel</b><p class="sub">'+String(e.message||e).replace(/[<>]/g,'')+'</p>'}})()})();</script></body></html>
