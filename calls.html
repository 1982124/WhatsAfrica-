<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WhatsAfrica — Appels</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="/wa-calls.js"></script><style>:root{--bg:#090d17;--p:#111827;--p2:#18243b;--t:#f8f5eb;--m:#98a5bb;--g:#f2b84b;--a:#22c7a3;--l:#26334c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#273652,#090d17 45%);color:var(--t);font:15px system-ui}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:linear-gradient(145deg,#131d30,#0f1624);border:1px solid var(--l);border-radius:18px;padding:20px;margin:14px 0}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.muted{color:var(--m)}select{width:100%;padding:12px;background:#0b1220;color:#fff;border:1px solid var(--l);border-radius:10px;margin:8px 0}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:850;cursor:pointer}.gold{background:var(--g);color:#171208}.ghost{background:transparent;color:#fff;border:1px solid var(--l)}.err{color:#ff8f8f}.ok{color:#57d39b}</style></head><body><main class="wrap"><div class="row"><div><b style="font-size:24px">Whats<span style="color:var(--g)">Africa</span></b><div class="muted">Appels audio & vidéo sécurisés</div></div><a class="btn ghost" href="/">Accueil</a></div><section id="auth" class="card"><h2>Connexion requise</h2><p class="muted">Les appels sont réservés aux membres authentifiés.</p><a class="btn gold" href="/dashboard">Ouvrir mon cockpit</a></section><section id="app" class="card" style="display:none"><h2>📹 Démarrer un appel</h2><p class="muted">Choisissez une conversation puis un correspondant. Le flux audio/vidéo n'est pas enregistré.</p><label>Conversation</label><select id="conversation"><option value="">Chargement…</option></select><label>Correspondant</label><select id="peer"><option value="">Choisissez d'abord une conversation</option></select><div class="row" style="justify-content:flex-start"><button id="call" class="btn gold">📹 Appel vidéo</button><button id="audio" class="btn ghost">🎙️ Appel audio</button></div><p id="msg" class="muted"></p></section><script>const URL='https://dzifpwqrqnvssfhwjccj.supabase.co',KEY='sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV',db=supabase.createClient(URL,KEY),$=id=>document.getElementById(id);let me=null,convs=[];async function load(){const r=await db.auth.getUser();if(!r.data?.user){$('auth').style.display='block';return}me=r.data.user;$('auth').style.display='none';$('app').style.display='block';window.WA_CALLS.init(db,me);const m=await db.from('conversation_members').select('conversation_id').eq('user_id',me.id);if(m.error)throw m.error;const ids=(m.data||[]).map(x=>x.conversation_id);if(!ids.length){$('conversation').innerHTML='<option value="">Aucune conversation</option>';return}const c=await db.from('conversations').select('id,title,kind').in('id',ids).order('created_at',{ascending:false});if(c.error)throw c.error;convs=c.data||[];$('conversation').innerHTML='<option value="">Choisir une conversation</option>'+convs.map(x=>`<option value="${x.id}">${x.title||'Conversation'} · ${x.kind||''}</option>`).join('');}async function peers(id){if(!id){$('peer').innerHTML='<option value="">Choisir une conversation</option>';return}const r=await db.from('conversation_members').select('user_id').eq('conversation_id',id).neq('user_id',me.id);if(r.error){$('msg').textContent=r.error.message;return}const ids=(r.data||[]).map(x=>x.user_id);if(!ids.length){$('peer').innerHTML='<option value="">Aucun autre participant</option>';return}const p=await db.from('profiles').select('user_id,display_name,public_display_name').in('user_id',ids);if(p.error){$('msg').textContent=p.error.message;return}$('peer').innerHTML='<option value="">Choisir un correspondant</option>'+(p.data||[]).map(x=>`<option value="${x.user_id}">${x.public_display_name||x.display_name||'Membre'}</option>`).join('')}function go(mode){const c=$('conversation').value,p=$('peer').value;if(!c||!p){$('msg').textContent='Choisissez une conversation et un correspondant.';return}$('msg').textContent='Demande d’appel…';window.WA_CALLS.start(c,p).catch(e=>$('msg').textContent=e.message||'Appel impossible.')}$('conversation').onchange=e=>peers(e.target.value);$('call').onclick=()=>go('video');$('audio').onclick=()=>go('audio');load().catch(e=>{$('msg').textContent=e.message||'Impossible de charger les conversations.'});</script></main></body></html>
