<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WhatsAfrica — Connexion</title>
<style>body{font-family:system-ui,sans-serif;max-width:520px;margin:auto;padding:24px}button,input,select{font:inherit;padding:12px;margin:5px 0;width:100%;box-sizing:border-box}.secondary{background:#fff}.hidden{display:none}.notice{padding:12px;border-radius:10px;background:#f3f5f4;margin:10px 0}.error{color:#b42318}.success{color:#08783b}</style>
</head>
<body>
<h1>WhatsAfrica</h1>
<p>Connectez-vous avec votre numéro de téléphone ou Google.</p>
<div id="notice" class="notice hidden"></div>
<section id="phoneBox">
<label for="country">Pays</label>
<select id="country"><option value="+223">Mali (+223)</option><option value="+225">Côte d’Ivoire (+225)</option><option value="+226">Burkina Faso (+226)</option><option value="+228">Togo (+228)</option><option value="+221">Sénégal (+221)</option><option value="+229">Bénin (+229)</option><option value="+234">Nigeria (+234)</option><option value="+233">Ghana (+233)</option><option value="+254">Kenya (+254)</option><option value="+27">Afrique du Sud (+27)</option><option value="+212">Maroc (+212)</option><option value="+213">Algérie (+213)</option><option value="+33">France (+33)</option></select>
<input id="phone" inputmode="tel" autocomplete="tel" placeholder="Numéro de téléphone">
<button id="sendOtp">Recevoir le code SMS</button>
<div id="otpBox" class="hidden"><input id="otp" inputmode="numeric" autocomplete="one-time-code" placeholder="Code reçu par SMS"><button id="verifyOtp">Vérifier et rejoindre WhatsAfrica</button><button id="resendOtp" class="secondary">Renvoyer le code</button><button id="changePhone" class="secondary">Changer de numéro</button></div>
</section>
<div id="oauth" class="social"><button class="secondary" id="google" type="button">Continuer avec Google</button></div>
<p><small>Votre numéro sert d'identité de connexion. Il n'est pas rendu public par défaut.</small></p>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://dzifpwqrqnvssfhwjccj.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV';
const sb=window.supabase?.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);let pendingPhone='';
function notice(msg,type=''){const n=$('notice');n.textContent=msg;n.className='notice '+type}
function normalizePhone(){let n=($('phone').value||'').replace(/[^0-9]/g,'');if(n.startsWith('0'))n=n.slice(1);return $('country').value+n}
function normalizeAuthError(e){const text=String(e?.message||e?.error_description||e||'');if(/unsupported phone provider|phone.*provider.*disabled|phone.*not.*enabled|sms.*provider|provider.*sms/i.test(text))return 'La connexion par SMS est prête côté WhatsAfrica, mais le fournisseur SMS n’est pas encore activé dans Supabase. Aucun faux code OTP ne sera généré.';return text||'Une erreur de connexion est survenue.'}
async function ensureProfile(user){if(!user)return;const display=user.user_metadata?.full_name||user.user_metadata?.name||user.phone||'Utilisateur WhatsAfrica';await sb.from('profiles').upsert({user_id:user.id,display_name:display,public_display_name:display,phone_public:false,identity_mode:'pseudo',country_public:true,avatar_mode:'initials',template:'default',accent_color:'#08783b',assistant_name:null},{onConflict:'user_id'});}
async function finish(){const next=new URLSearchParams(location.search).get('next')||'/inbox';location.href=/^\/(?!\/)/.test(next)?next:'/inbox'}
async function sendOtp(){try{pendingPhone=normalizePhone();if(pendingPhone.length<8)throw new Error('Numéro de téléphone invalide.');const {error}=await sb.auth.signInWithOtp({phone:pendingPhone,options:{shouldCreateUser:true}});if(error)throw error;$('otpBox').classList.remove('hidden');notice('Code SMS envoyé. Entrez-le pour rejoindre WhatsAfrica.','success')}catch(e){notice(normalizeAuthError(e),'error')}}
async function verifyOtp(){try{const token=($('otp').value||'').trim();if(!token)throw new Error('Entrez le code reçu.');const {data,error}=await sb.auth.verifyOtp({phone:pendingPhone,token,type:'sms'});if(error)throw error;await ensureProfile(data.user);await finish()}catch(e){notice(normalizeAuthError(e),'error')}}
async function oauth(provider){const {error}=await sb.auth.signInWithOAuth({provider,options:{redirectTo:location.origin+'/auth?next='+encodeURIComponent(new URLSearchParams(location.search).get('next')||'/inbox')}});if(error)notice(normalizeAuthError(error),'error')}
$('sendOtp').onclick=sendOtp;$('verifyOtp').onclick=verifyOtp;$('resendOtp').onclick=sendOtp;$('changePhone').onclick=()=>{$('otpBox').classList.add('hidden');pendingPhone='';$('otp').value='';notice('Saisissez un autre numéro.','')};$('google').onclick=()=>oauth('google');
(async()=>{if(!sb){notice('Configuration Supabase manquante.','error');return}const {data}=await sb.auth.getSession();if(data.session){await ensureProfile(data.session.user);await finish()}sb.auth.onAuthStateChange(async(_event,session)=>{if(session)await ensureProfile(session.user)})})();
</script>
</body>
</html>
