<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Smart Link WASSAFRICA"><title>WASSAFRICA — Vitrine</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--accent:#1f2933;--ink:#20272b;--muted:#68737b;--bg:#f7f7f5;--card:#fff;--line:#e1e5e7;--soft:#eef1f2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1120px;margin:auto;padding:0 16px}.nav{position:sticky;top:0;z-index:10;background:#ffffffee;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.navrow{min-height:62px;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-weight:950;color:var(--ink);text-decoration:none}.btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 15px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:850;text-decoration:none;cursor:pointer}.primary{background:var(--accent);border-color:var(--accent);color:#fff}.hero{margin:18px 0 36px;background:#fff;border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:0 15px 45px #18231d0b}.cover{height:min(48vw,430px);min-height:240px;background:#e9edef center/cover no-repeat}.heroBody{padding:24px}.eyebrow{font-size:11px;letter-spacing:1.8px;text-transform:uppercase;font-weight:950;color:var(--accent)}h1{font:800 clamp(34px,6vw,62px)/1.03 Georgia,serif;margin:6px 0}.location,.muted{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:17px}.actions .btn{min-width:135px}.section{margin:38px 0}.section h2{font:750 clamp(28px,4vw,42px)/1.1 Georgia,serif;margin:0 0 8px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}.media{height:220px;background:var(--soft)}.media img,.media video{width:100%;height:100%;object-fit:cover}.body{padding:17px}.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:color-mix(in srgb,var(--accent) 10%,white);color:var(--accent);font-size:10px;font-weight:950}.price{font-size:19px;font-weight:950;color:var(--accent);margin-top:9px}.empty{padding:28px;text-align:center;border:1px dashed #cbd1d4;border-radius:18px;color:var(--muted);background:#fff}.contact{display:grid;grid-template-columns:1fr 1fr;gap:14px}.contactBox{padding:22px;background:#fff;border:1px solid var(--line);border-radius:20px}.share{background:var(--accent);color:#fff;border-radius:20px;padding:22px}.share p{color:#eef2f4}.share .btn{background:#fff;color:var(--accent)}.footer{padding:35px 0 60px;text-align:center;color:var(--muted);font-size:12px}@media(max-width:780px){.grid{grid-template-columns:1fr 1fr}.contact{grid-template-columns:1fr}}@media(max-width:540px){.wrap{padding:0 12px}.grid{grid-template-columns:1fr}.actions .btn{width:100%}}</style></head><body><header class="nav"><div class="wrap navrow"><a class="brand" href="/">WASSAFRICA</a><a class="btn primary" href="/auth?next=/smartlink">Créer ma vitrine</a></div></header><main id="app" class="wrap"><div class="empty" style="margin-top:24px">Ouverture de la vitrine…</div></main><footer class="wrap footer">WASSAFRICA — Connecter l’Afrique. Ouvrir le monde.</footer><script>(async()=>{const db=supabase.createClient('https://dzifpwqrqnvssfhwjccj.supabase.co','sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV'),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));const safe=v=>{try{const u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:null}catch{return null}};const money=(v,c)=>v==null?'Prix sur demande':new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0}).format(Number(v||0))+' '+(c||'XOF');const slug=decodeURIComponent(location.pathname.replace(/^\/+/, '').split('/')[0]||'');function contact(b){location.href='/auth?next='+encodeURIComponent('/inbox?business='+b.id)}function whatsapp(b){const p=String(b.phone||'').replace(/[^0-9]/g,'');if(!p)return contact(b);location.href='https://wa.me/'+p+'?text='+encodeURIComponent('Bonjour '+(b.name||'')+', je viens de voir votre vitrine WASSAFRICA : '+location.href)}function card(p,type){const image=type==='service'?safe(p.metadata?.cover_url||p.metadata?.image_url):safe(p.image_url);return '<article class="card"><div class="media">'+(image?'<img loading="lazy" src="'+esc(image)+'" alt="'+esc(p.title)+'">':'<div style="height:100%;display:grid;place-items:center;font-size:52px">'+(type==='service'?'🧰':'🛍️')+'</div>')+'</div><div class="body"><span class="tag">'+(type==='service'?'SERVICE':p.product_type==='digital'?'PRODUIT DIGITAL':'PRODUIT')+'</span><h3>'+esc(p.title)+'</h3><p class="muted">'+esc(p.description||'')+'</p>'+(p.price!=null?'<div class="price">'+money(p.price,p.currency)+'</div>':'')+'<div class="actions"><button class="btn primary" onclick="window.__waContact()">💬 '+(type==='service'?'Demander':'Commander')+'</button></div></div></article>'}async function load(){if(!slug||['auth','dashboard','inbox','market','smartlink','vitrine'].includes(slug)){$('app').innerHTML='<div class="empty" style="margin-top:24px">Cette vitrine n’est pas disponible.</div>';return}const l=await db.from('smart_links').select('id,business_id,title,description,is_public').eq('slug',slug).eq('is_public',true).maybeSingle();if(l.error||!l.data){$('app').innerHTML='<div class="empty" style="margin-top:24px">Cette vitrine n’est pas disponible.</div>';return}const bq=await db.from('businesses').select('id,owner_id,name,description,presentation,city,country,logo_url,cover_image_url,phone,accent_color').eq('id',l.data.business_id).maybeSingle();if(bq.error||!bq.data){$('app').innerHTML='<div class="empty" style="margin-top:24px">Impossible de charger cette activité.</div>';return}const b=bq.data;document.documentElement.style.setProperty('--accent',/^#[0-9a-f]{6}$/i.test(b.accent_color||'')?b.accent_color:'#1f2933');const [mq,pq,sq]=await Promise.all([db.from('smart_link_media').select('kind,public_url,sort_order').eq('smart_link_id',l.data.id).order('sort_order',{ascending:true}),db.from('products').select('id,title,description,price,currency,image_url,product_type').eq('business_id',b.id).eq('is_published',true).order('created_at',{ascending:false}).limit(60),db.from('marketplace_services').select('id,title,description,price,currency,status,metadata').eq('seller_id',b.owner_id).eq('status','published').order('created_at',{ascending:false}).limit(60)]);const media=mq.data||[],products=pq.data||[],services=sq.data||[];const cover=safe(b.cover_image_url);const gallery=media.filter(x=>x.kind==='gallery'||x.kind==='image').map(x=>safe(x.public_url)).filter(Boolean).slice(0,6);const videos=media.filter(x=>x.kind==='video').map(x=>safe(x.public_url)).filter(Boolean).slice(0,3);const name=b.name||l.data.title||'Activité WASSAFRICA';window.__waContact=()=>contact(b);document.title=name+' — WASSAFRICA';$('app').innerHTML='<section class="hero"><div class="cover" style="'+(cover?'background-image:url(\''+esc(cover)+'\')':'')+'"></div><div class="heroBody"><div class="eyebrow">WASSAFRICA · VITRINE</div><h1>'+esc(name)+'</h1>'+(b.city||b.country?'<div class="location">📍 '+esc([b.city,b.country].filter(Boolean).join(' · '))+'</div>':'')+'<p class="muted">'+esc(b.presentation||b.description||l.data.description||'Découvrez cette activité, ses produits, ses services et son univers.')+'</p><div class="actions"><button class="btn primary" onclick="window.__waContact()">💬 Parler</button>'+(b.phone?'<button class="btn" onclick="window.__waWhatsapp()">WhatsApp</button>':'')+'<button class="btn" onclick="navigator.share?navigator.share({title:document.title,url:location.href}):navigator.clipboard?.writeText(location.href)">↗ Partager</button></div></div></section>'+(gallery.length?'<section class="section"><h2>Notre activité</h2><p class="muted">Des images réelles de cette activité.</p><div class="grid">'+gallery.map(x=>'<article class="card"><div class="media"><img loading="lazy" src="'+esc(x)+'" alt=""></div></article>').join('')+'</div></section>':'')+(videos.length?'<section class="section"><h2>En vidéo</h2><div class="grid">'+videos.map(x=>'<article class="card"><video controls preload="metadata" src="'+esc(x)+'"></video></article>').join('')+'</div></section>':'')+'<section class="section"><h2>Produits & offres</h2><p class="muted">Ce que cette activité vend réellement sur WASSAFRICA.</p>'+(products.length?'<div class="grid">'+products.map(p=>card(p,'product')).join('')+'</div>':'<div class="empty">Aucun produit publié pour le moment.</div>')+'</section><section class="section"><h2>Services</h2><p class="muted">Les prestations proposées.</p>'+(services.length?'<div class="grid">'+services.map(s=>card(s,'service')).join('')+'</div>':'<div class="empty">Aucun service publié pour le moment.</div>')+'</section><section class="section"><div class="contact"><article class="contactBox"><div class="eyebrow">CONTACT DIRECT</div><h2>'+esc(name)+'</h2><p class="muted">Une question, une commande ou une demande ? Entrez directement en conversation.</p><div class="actions"><button class="btn primary" onclick="window.__waContact()">💬 Parler maintenant</button>'+(b.phone?'<button class="btn" onclick="window.__waWhatsapp()">WhatsApp</button>':'')+'</div></article><article class="share"><div class="eyebrow" style="color:#fff">POUR LES BUSINESS</div><h2>Votre activité mérite sa propre vitrine.</h2><p>Produits, services, images et conversation depuis un seul lien.</p><a class="btn" href="/smartlink">Créer ma vitrine</a></article></div></section>';window.__waWhatsapp=()=>whatsapp(b)}load().catch(e=>{$('app').innerHTML='<div class="empty" style="margin-top:24px">Impossible de charger cette vitrine. Réessayez.</div>'})})()</script></body></html>
