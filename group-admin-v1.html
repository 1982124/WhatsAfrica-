<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration du groupe — WASSAFRICA</title><style>body{margin:0;background:#f6f8f5;color:#172019;font:15px system-ui}.wrap{max-width:900px;margin:auto;padding:16px}.top{background:#075e54;color:#fff;padding:14px}.card{background:#fff;border:1px solid #dfe7e1;border-radius:16px;padding:16px;margin:12px 0}.row{display:flex;gap:10px;align-items:center;padding:12px 0;border-top:1px solid #e8eeea}.grow{flex:1}.btn{border:1px solid #ccd9d4;background:#fff;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer}.primary{background:#0b9489;color:#fff}.danger{color:#a11}.muted{color:#68746e;font-size:13px}select{padding:9px;border:1px solid #ccd9d4;border-radius:10px}@media(max-width:600px){.row{align-items:flex-start;flex-wrap:wrap}.row select{margin-left:auto}}</style><script src="/brand-normalizer.js"></script>
<script src="/brand-observer.js"></script></head><body><header class="top"><div class="wrap"><b>WASSAFRICA</b> · Administration du groupe</div></header><main class="wrap"><div id="app">Chargement…</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(async()=>{const db=supabase.createClient('https://dzifpwqrqnvssfhwjccj.supabase.co','sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV'),parts=location.pathname.split('/').filter(Boolean),gid=decodeURIComponent(parts[parts.length-1]==='admin'?parts[parts.length-2]||'':parts[parts.length-1]||''),$=id=>document.getElementById(id);let me=null,group=null;const esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));const name=async id=>{const r=await db.from('profiles').select('public_display_name,display_name,first_name,last_name').eq('user_id',id).maybeSingle();const p=r.data||{};return p.public_display_name||p.display_name||[p.first_name,p.last_name].filter(Boolean).join(' ')||'Membre'};async function init(){me=(await db.auth.getSession()).data.session?.user;if(!me)return location.href='/auth?next='+encodeURIComponent(location.pathname);if(!gid)return $('app').innerHTML='<div class="card">Identifiant du groupe manquant.</div>';const g=await db.from('groups').select('id,name,is_business,owner_id').eq('id',gid).maybeSingle();if(g.error||!g.data)return $('app').innerHTML='<div class="card">Groupe introuvable.</div>';group=g.data;const a=await db.rpc('is_group_admin',{p_group_id:gid,p_user_id:me.id});if(a.error||!a.data)return $('app').innerHTML='<div class="card"><b>Accès refusé.</b><div class="muted">Seuls le propriétaire et les administrateurs de ce groupe peuvent gérer ses membres.</div></div>';render()}async function render(){const m=await db.from('group_members').select('user_id,role,created_at').eq('group_id',gid).order('created_at');const rows=m.data||[];const people=await Promise.all(rows.map(async x=>({x,n:await name(x.user_id)})));$('app').innerHTML='<div class="card"><h1>⚙️ '+esc(group.name)+'</h1><div class="muted">'+(group.is_business?'Groupe professionnel':'Groupe public')+' · Gestion des administrateurs</div><p>Le propriétaire et les administrateurs peuvent gérer les membres et modérer les publications/commentaires.</p><a class="btn" href="/groups/'+gid+'">← Retour au groupe</a></div><div class="card"><h2>👥 Membres et administrateurs</h2><div class="muted">Un administrateur peut être nommé ou retiré par un administrateur existant. Le propriétaire reste le niveau supérieur.</div>'+ (people.length?people.map(({x,n})=>'<div class="row"><div class="grow"><b>'+esc(n)+'</b><div class="muted">'+(x.user_id===group.owner_id?'👑 Propriétaire':x.role==='admin'?'🛡️ Administrateur':'Membre')+'</div></div>'+ (x.user_id===group.owner_id?'<span class="muted">Propriétaire</span>': '<select data-role="'+x.user_id+'"><option value="member" '+(x.role==='member'?'selected':'')+'>Membre</option><option value="admin" '+(x.role==='admin'?'selected':'')+'>Administrateur</option></select><button class="btn danger" data-remove="'+x.user_id+'">Retirer</button>')+'</div>').join(''):'<div class="muted">Aucun membre.</div>')+'</div><div class="card"><h2>🛡️ Règles</h2><ul><li>Un auteur reste le seul utilisateur autorisé à <b>modifier le texte de sa propre publication</b>.</li><li>Les administrateurs peuvent modérer en supprimant les publications/commentaires problématiques.</li><li>Les administrateurs ne peuvent pas modifier à la place de l’auteur.</li></ul></div>';document.querySelectorAll('[data-role]').forEach(s=>s.onchange=async()=>{const r=await db.from('group_members').update({role:s.value}).eq('group_id',gid).eq('user_id',s.dataset.role);if(r.error)alert(r.error.message);await render()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=async()=>{if(!confirm('Retirer ce membre du groupe ?'))return;const r=await db.from('group_members').delete().eq('group_id',gid).eq('user_id',b.dataset.remove);if(r.error)alert(r.error.message);await render()})}init().catch(e=>{$('app').innerHTML='<div class="card">Erreur de chargement.</div>';console.error(e)})})();</script></body></html>
