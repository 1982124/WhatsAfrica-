<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WhatsAfrica — Prix par marché</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#f7f2e9;--card:#fffdf9;--ink:#20242b;--muted:#77766f;--line:#e5ddd1;--green:#287b36;--deep:#173c22;--gold:#e5aa2f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{max-width:980px;margin:auto;padding:20px 14px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}.brand{font-size:22px;font-weight:950}.brand b{color:var(--gold)}a{color:var(--green);font-weight:800;text-decoration:none}.hero{background:linear-gradient(120deg,var(--deep),#2d7835 58%,#d59b27);color:#fff;border-radius:22px;padding:24px;margin-bottom:16px}.hero h1{margin:5px 0;font:700 34px Georgia,serif}.hero p{margin:8px 0;line-height:1.55;color:#f4f1e8}.toolbar,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}label{font-size:12px;font-weight:850;color:var(--muted)}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff;font:inherit}button{border:0;border-radius:11px;padding:11px 14px;background:var(--green);color:#fff;font-weight:900;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card h2{margin:0 0 4px}.muted{color:var(--muted)}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.calc{margin-top:12px;padding:12px;border-radius:12px;background:#f1eadc}.calc strong{font-size:20px}.actions{display:flex;gap:8px;margin-top:12px}.status{font-weight:800;min-height:20px}.ok{color:var(--green)}.err{color:#b13d2e}.note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:10px}@media(max-width:680px){.toolbar,.grid,.row{grid-template-columns:1fr}.field.full{grid-column:auto}.hero h1{font-size:29px}}</style></head><body><main class="wrap"><header class="top"><div class="brand">Whats<b>Africa</b></div><a href="/dashboard">← Mon espace</a></header><section class="hero"><div>PRICING TRANSFRONTALIER</div><h1>Un prix adapté à chaque marché.</h1><p>Définissez le prix de vente local sans modifier l'identité du produit. Le coût rendu peut intégrer transport, douane, taxes et autres frais. Le client voit le prix du marché sélectionné.</p></section><section class="toolbar"><div class="field"><label>Marché cible</label><select id="country"><option value="ML">Mali</option><option value="TG">Togo</option><option value="BF">Burkina Faso</option><option value="CI">Côte d’Ivoire</option><option value="SN">Sénégal</option><option value="BJ">Bénin</option><option value="GH">Ghana</option><option value="NG">Nigeria</option></select></div><div class="field"><label>Produit</label><select id="product"><option>Chargement…</option></select></div><div class="field full"><div class="status" id="status"></div></div></section><section id="editor"></section></main><script>const db=supabase.createClient('https://dzifpwqrqnvssfhwjccj.supabase.co','sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV');const $=id=>document.getElementById(id);let products=[],current=null;const n=v=>Math.max(0,Number(v)||0);const money=v=>new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0}).format(n(v))+' FCFA';function setStatus(t,ok=false){$('status').className='status '+(ok?'ok':'err');$('status').textContent=t}function render(){current=products.find(p=>p.id===$('product').value);if(!current){$('editor').innerHTML='';return}const c=current.cost||{};const m=current.market||{};const reference=c.reference_price??current.price??0;const landed=reference+n(c.transport_cost)+n(c.customs_cost)+n(c.tax_cost)+n(c.handling_cost)+n(c.other_cost);const suggested=landed+n(c.margin_amount);$('editor').innerHTML=`<article class="card"><h2>${esc(current.title)}</h2><div class="muted">Prix de référence catalogue : ${money(reference)}</div><div class="row"><div class="field"><label>Prix de référence</label><input id="reference" type="number" min="0" step="1" value="${reference}"></div><div class="field"><label>Transport / unité</label><input id="transport" type="number" min="0" step="1" value="${n(c.transport_cost)}"></div><div class="field"><label>Douane / importation</label><input id="customs" type="number" min="0" step="1" value="${n(c.customs_cost)}"></div><div class="field"><label>Taxes</label><input id="tax" type="number" min="0" step="1" value="${n(c.tax_cost)}"></div><div class="field"><label>Manutention / frais</label><input id="handling" type="number" min="0" step="1" value="${n(c.handling_cost)}"></div><div class="field"><label>Autres frais</label><input id="other" type="number" min="0" step="1" value="${n(c.other_cost)}"></div><div class="field"><label>Marge</label><input id="margin" type="number" min="0" step="1" value="${n(c.margin_amount)}"></div><div class="field"><label>Prix de vente ${esc($('country').value)}</label><input id="sale" type="number" min="0" step="1" value="${m.sale_price??suggested}"></div></div><div class="calc">Coût rendu estimé : <strong id="landed">${money(landed)}</strong><br>Prix conseillé selon la marge : <strong id="suggested">${money(suggested)}</strong><br>Prix publié actuel : <strong id="published">${m.sale_price!=null?money(m.sale_price):'Aucun prix marché'}</strong></div><div class="field" style="margin-top:12px"><label>Promotion facultative</label><input id="promo" type="number" min="0" step="1" value="${m.promotion_price??''}" placeholder="Prix promotionnel"></div><div class="actions"><button id="save">Publier le prix ${esc($('country').value)}</button></div><div class="note">Le prix affiché au client est un prix commercial du vendeur pour ce marché. Ne le présentez comme prix officiel du fabricant que si vous disposez de l'autorisation ou de la source contractuelle correspondante.</div></article>`;['reference','transport','customs','tax','handling','other','margin'].forEach(id=>$(id).oninput=calc);$('save').onclick=save;calc()}function calc(){const landed=n($('reference').value)+n($('transport').value)+n($('customs').value)+n($('tax').value)+n($('handling').value)+n($('other').value);$('landed').textContent=money(landed);$('suggested').textContent=money(landed+n($('margin').value))}function esc(v){return String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}async function load(){const {data:{user}}=await db.auth.getUser();if(!user){setStatus('Connectez-vous pour gérer vos prix.');$('editor').innerHTML='<div class="card"><a href="/auth?next=/market-pricing">Ouvrir la connexion</a></div>';return}const b=await db.from('businesses').select('id').eq('owner_id',user.id).limit(1).maybeSingle();if(b.error||!b.data){setStatus('Aucun commerce associé à ce compte.');return}const p=await db.from('products').select('id,title,price,currency').eq('business_id',b.data.id).order('created_at',{ascending:false});products=p.data||[];if(!products.length){setStatus('Aucun produit à tarifer.');return}const country=$('country').value;const [m,c]=await Promise.all([db.from('product_market_prices').select('*').eq('country_code',country).in('product_id',products.map(x=>x.id)),db.from('product_market_costs').select('*').eq('country_code',country).in('product_id',products.map(x=>x.id))]);const mm=new Map((m.data||[]).map(x=>[x.product_id,x])),cc=new Map((c.data||[]).map(x=>[x.product_id,x]));products=products.map(x=>({...x,market:mm.get(x.id)||null,cost:cc.get(x.id)||null}));$('product').innerHTML=products.map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join('');render()}async function reload(){const val=$('product').value;await load();if([...$('product').options].some(o=>o.value===val)){$('product').value=val;render()}}async function save(){const user=(await db.auth.getUser()).data.user;if(!user||!current)return;const country=$('country').value;const cost={product_id:current.id,country_code:country,reference_price:n($('reference').value),transport_cost:n($('transport').value),customs_cost:n($('customs').value),tax_cost:n($('tax').value),handling_cost:n($('handling').value),other_cost:n($('other').value),margin_amount:n($('margin').value)};const market={product_id:current.id,country_code:country,currency:current.currency||'XOF',sale_price:n($('sale').value),promotion_price:$('promo').value===''?null:n($('promo').value),is_active:true};setStatus('Enregistrement…',true);const a=await db.from('product_market_costs').upsert(cost,{onConflict:'product_id,country_code'});const b=await db.from('product_market_prices').upsert(market,{onConflict:'product_id,country_code'});if(a.error||b.error){setStatus((a.error||b.error).message);return}setStatus('Prix du marché enregistré. Le nouveau prix sera utilisé par le checkout sécurisé.',true);await reload()}$('country').onchange=()=>load();$('product').onchange=render;load().catch(e=>setStatus(e.message||'Impossible de charger le pricing.'));</script></body></html>
