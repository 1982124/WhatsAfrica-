<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WhatsAfrica — SmartLink</title><meta name="theme-color" content="#120f1f"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>
:root{--bg:#120f1f;--panel:#1c1832;--panel2:#241e3f;--gold:#e8a83c;--teal:#17a889;--cream:#f6f1e4;--muted:#f6f1e477;--danger:#d96a50}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--cream);font-family:Inter,system-ui,Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1100px;margin:auto;padding:0 18px}.nav{position:sticky;top:0;z-index:20;background:#120f1fee;border-bottom:1px solid #ffffff12;backdrop-filter:blur(14px)}.navrow{height:64px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font:700 21px Georgia,serif}.brand b{color:var(--gold)}.hero{padding:70px 0 50px}.eyebrow{color:var(--teal);font:11px monospace;letter-spacing:2px;text-transform:uppercase}.hero h1{font:600 clamp(40px,7vw,70px)/1.02 Georgia,serif;max-width:820px;margin:14px 0}.hero p{max-width:700px;color:#f6f1e4aa;font-size:17px;line-height:1.65}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.btn{border:0;border-radius:999px;padding:11px 17px;font-weight:750}.primary{background:var(--gold);color:var(--bg)}.secondary{background:transparent;color:var(--cream);border:1px solid #ffffff22}.section{padding:42px 0;border-top:1px solid #ffffff10}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.tile,.panel{background:var(--panel);border:1px solid #ffffff10;border-radius:20px;padding:20px}.tile h3{font:600 19px Georgia,serif;margin:0 0 7px}.tile p,.sub{color:var(--muted);line-height:1.5;font-size:13px}.modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:16px;z-index:60}.modal.open{display:flex}.box{width:min(480px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid #ffffff18;border-radius:22px;padding:22px}.close{float:right;background:none;border:0;color:var(--muted);font-size:22px}.field{margin:11px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field textarea{width:100%;background:var(--bg);color:var(--cream);border:1px solid #ffffff18;border-radius:10px;padding:11px}.password{display:flex;gap:8px}.password input{flex:1}.show{background:var(--panel2);color:var(--cream);border:1px solid #ffffff18;border-radius:10px;padding:0 12px}.msg{color:var(--danger);font-size:12px;min-height:18px;margin:7px 0}.app{display:none;min-height:100vh}.app.on{display:block}.appnav{padding:12px 16px;border-bottom:1px solid #ffffff10;display:flex;justify-content:space-between;align-items:center}.tabs{display:flex;gap:6px;overflow:auto;padding:10px 16px;border-bottom:1px solid #ffffff10}.tab{background:transparent;color:var(--muted);border:0;padding:9px 13px;border-radius:999px;white-space:nowrap}.tab.active{background:var(--panel2);color:var(--cream)}.screen{max-width:1050px;margin:auto;padding:22px 16px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px}.product-card{overflow:hidden;background:var(--panel);border:1px solid #ffffff10;border-radius:18px}.product-card img{width:100%;height:180px;object-fit:cover;background:#0e0c17;display:block}.product-body{padding:14px}.product-body h3{margin:0 0 5px;font:600 19px Georgia,serif}.price{color:var(--gold);font-weight:800;margin-top:10px}.link{color:var(--gold);word-break:break-all}.chatlog{height:48vh;overflow:auto;background:#0f0d19;border-radius:15px;padding:10px;display:flex;flex-direction:column;gap:8px}.bubble{max-width:84%;padding:10px 13px;border-radius:16px;line-height:1.5;font-size:14px;white-space:pre-wrap}.mine{align-self:flex-end;background:var(--teal);color:#04231c}.theirs{align-self:flex-start;background:#ffffff0c}.composer{display:flex;gap:8px;margin-top:10px}.composer input{flex:1;background:var(--panel);color:var(--cream);border:1px solid #ffffff12;border-radius:999px;padding:12px}.hint{font-size:11px;color:var(--muted);line-height:1.45}.drop{border:1px dashed #ffffff25;border-radius:16px;padding:18px;background:#ffffff04}.empty{text-align:center;padding:35px;color:var(--muted)}.toast{position:fixed;right:16px;bottom:16px;background:var(--panel2);border:1px solid #ffffff18;border-radius:12px;padding:12px 15px;z-index:90;display:none}.public-hero{padding:50px 0 25px}.source{font-size:11px;color:var(--muted)}
</style></head><body>
<div id="public"></div>
<div id="app" class="app"><div class="appnav"><div class="brand">Whats<b>Africa</b></div><div><span id="user-label" class="hint"></span> <button class="btn secondary" onclick="signOut()">Sortir</button></div></div><div class="tabs"><button class="tab active" onclick="showScreen('home',this)">Accueil</button><button class="tab" onclick="showScreen('business',this)">Mon SmartLink</button><button class="tab" onclick="showScreen('assistant',this)">Assistant commercial</button><button class="tab" onclick="showScreen('broadcast',this)">Diffuser</button></div><div id="screen" class="screen"></div></div>
<div id="auth" class="modal"><div class="box"><button class="close" onclick="closeAuth()">×</button><h2 id="auth-title">Créer mon espace</h2><p class="sub">Email + mot de passe. Rien de plus compliqué.</p><div id="name-field" class="field"><label>Nom affiché</label><input id="auth-name" placeholder="Ex. José Coach"></div><div class="field"><label>Email</label><input id="auth-email" type="email" autocomplete="email" placeholder="vous@exemple.com"></div><div class="field"><label>Mot de passe</label><div class="password"><input id="auth-password" type="password" autocomplete="new-password" placeholder="Au moins 8 caractères"><button class="show" type="button" onclick="togglePassword()">Afficher</button></div></div><div id="auth-msg" class="msg"></div><button id="auth-submit" class="btn primary" style="width:100%" onclick="submitAuth()">Créer mon espace</button><button id="auth-switch" class="btn secondary" style="width:100%;margin-top:8px" onclick="toggleAuthMode()">J'ai déjà un compte</button><p class="hint">Un compte = un SmartLink gratuit d'essai. Les fonctionnalités premium sont liées à l'abonnement.</p></div></div>
<div id="toast" class="toast"></div>
<script>
const SUPABASE_URL='https://dzifpwqrqnvssfhwjccj.supabase.co';const SUPABASE_ANON_KEY='sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV';const supa=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let authMode='signup',currentUser=null,profile=null,business={articles:[]},chatHistory=[];const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));const slugPath=decodeURIComponent(location.pathname.replace(/^\//,'').replace(/\/$/,''));
function toast(t){const x=$('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2600)}
function openAuth(mode){authMode=mode;$('auth-title').textContent=mode==='signup'?'Créer mon espace':'Se connecter';$('name-field').style.display=mode==='signup'?'block':'none';$('auth-submit').textContent=mode==='signup'?'Créer mon espace':'Se connecter';$('auth-switch').textContent=mode==='signup'?'J’ai déjà un compte':'Créer un compte';$('auth-msg').textContent='';$('auth').classList.add('open');}
function closeAuth(){$('auth').classList.remove('open')}
function toggleAuthMode(){openAuth(authMode==='signup'?'login':'signup')}
function togglePassword(){const i=$('auth-password'),b=document.querySelector('.show');i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'Afficher':'Masquer'}
async function submitAuth(){const email=$('auth-email').value.trim(),password=$('auth-password').value,name=$('auth-name').value.trim();$('auth-msg').textContent='';if(!email||password.length<8||(authMode==='signup'&&!name)){ $('auth-msg').textContent='Complétez les champs requis.';return }let r=authMode==='signup'?await supa.auth.signUp({email,password,options:{data:{display_name:name}}}):await supa.auth.signInWithPassword({email,password});if(r.error){$('auth-msg').textContent=r.error.message;return}if(authMode==='signup'&&!r.data.session){$('auth-msg').textContent='Compte créé. Vérifiez votre email si la confirmation est activée.';return}closeAuth();await boot(r.data.session?.user)}
async function boot(user){if(!user){const s=await supa.auth.getSession();user=s.data.session?.user}if(!user)return;currentUser=user;const p=await supa.from('profiles').select('*').eq('user_id',user.id).maybeSingle();if(p.error){$('auth-msg').textContent=p.error.message;$('auth').classList.add('open');return}if(p.data)profile=p.data;else{const name=user.user_metadata?.display_name||user.email.split('@')[0];const slug=await uniqueSlug(name);const ins=await supa.from('profiles').insert({user_id:user.id,display_name:name,country:'Mali',smartlink_slug:slug,bio:'Bienvenue sur mon SmartLink WhatsAfrica.'}).select().single();if(ins.error){$('auth-msg').textContent=ins.error.message;$('auth').classList.add('open');return}profile=ins.data}await loadBusiness();loadChat();$('public').style.display='none';$('app').classList.add('on');$('user-label').textContent=profile.display_name;showScreen('home')}
async function uniqueSlug(name){const base=(name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,35)||'user');for(let i=0;i<8;i++){const slug=base+'-'+Math.random().toString(36).slice(2,6);const q=await supa.from('profiles').select('id').eq('smartlink_slug',slug).maybeSingle();if(!q.data)return slug}return base+'-'+Date.now().toString(36).slice(-6)}
async function loadBusiness(){const r=await supa.from('articles').select('*').eq('owner_slug',profile.smartlink_slug).order('created_at',{ascending:false});business.articles=r.data||[]}
function showScreen(which,el){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));if(el)el.classList.add('active');({home:renderHome,business:renderBusiness,assistant:renderAssistant,broadcast:renderBroadcast}[which]||renderHome)()}
function renderHome(){$('screen').innerHTML=`<div class="panel"><div class="eyebrow">Votre espace</div><h1 style="font:600 34px Georgia,serif;margin:9px 0">${esc(profile.display_name)}</h1><p class="sub">Votre SmartLink est à la fois votre vitrine et une porte de découverte vers WhatsAfrica.</p><div class="link">${esc(location.origin+'/'+profile.smartlink_slug)}</div><div class="actions"><button class="btn primary" onclick="copyLink()">Copier le lien</button><button class="btn secondary" onclick="showScreen('business')">Gérer mon SmartLink</button></div></div><div class="section"><div class="grid"><div class="tile"><h3>🖼️ Vitrine visuelle</h3><p>${business.articles.length} produit(s)/service(s) avec images et informations commerciales.</p></div><div class="tile"><h3>🤖 Assistant commercial</h3><p>Il répond à partir de vos données réelles, notamment les prix enregistrés.</p></div><div class="tile"><h3>🌍 Découverte</h3><p>Votre SmartLink aide aussi les visiteurs à découvrir d'autres activités WhatsAfrica.</p></div></div></div>`}
function productCard(a){return `<article class="product-card">${a.image_url?`<img src="${esc(a.image_url)}" alt="${esc(a.title)}" loading="lazy" onerror="this.style.display='none'">`:''}<div class="product-body"><h3>${esc(a.title)}</h3><div class="sub">${esc(a.description||'')}</div>${a.price?`<div class="price">${esc(a.price)} ${esc(a.currency||'FCFA')}</div>`:''}${a.source_url?`<div class="source" style="margin-top:8px">Importé depuis votre site</div>`:''}</div></article>`}
function renderBusiness(){$('screen').innerHTML=`<div class="panel"><div class="eyebrow">SmartLink</div><h2 style="font:600 32px Georgia,serif;margin:8px 0">${esc(profile.display_name)}</h2><p>${esc(profile.bio||'Présentez votre activité.')}</p><div class="link">${esc(location.origin+'/'+profile.smartlink_slug)}</div><div class="actions"><button class="btn primary" onclick="copyLink()">Partager</button><button class="btn secondary" onclick="editProfile()">Modifier ma présentation</button></div></div><div class="section"><div class="panel"><div class="eyebrow">Import intelligent</div><h2 style="font:600 25px Georgia,serif;margin:8px 0">Votre site e-commerce devient votre SmartLink</h2><p class="sub">Collez simplement le lien de votre site. WhatsAfrica récupère les informations publiques disponibles, les images et les produits structurés. Vous vérifiez avant d'enregistrer.</p><div class="field"><input id="site-url" placeholder="https://monsite.com" inputmode="url"></div><button class="btn primary" onclick="importSite()">Analyser mon site →</button><div id="import-result" style="margin-top:14px"></div></div></div><div class="section"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><div class="eyebrow">Votre catalogue</div><h2 style="font:600 26px Georgia,serif;margin:7px 0">Produits & services</h2></div><button class="btn secondary" onclick="addProduct()">+ Ajouter</button></div><div class="cards" style="margin-top:15px">${business.articles.length?business.articles.map(productCard).join(''):'<div class="empty">Ajoutez votre premier produit/service ou importez votre site e-commerce.</div>'}</div></div>`}
async function editProfile(){const bio=prompt('Votre description',profile.bio||'');if(bio===null)return;const r=await supa.from('profiles').update({bio}).eq('id',profile.id);if(r.error)return toast(r.error.message);profile.bio=bio;renderBusiness()}
async function addProduct(){const title=prompt('Nom du produit/service');if(!title)return;const description=prompt('Description')||'';const price=prompt('Prix (ex. 18000)')||'';const image_url=prompt('URL de l’image (optionnel)')||'';const r=await supa.from('articles').insert({owner_slug:profile.smartlink_slug,title,description,price,currency:'FCFA',kind:'produit',image_url});if(r.error)toast(r.error.message);else{await loadBusiness();renderBusiness()}}
async function importSite(){const url=$('site-url').value.trim();if(!url)return toast('Entrez le lien de votre site.');const box=$('import-result');box.innerHTML='<div class="status">Analyse du site en cours…</div>';try{const r=await fetch('/api/import-site',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Import impossible');const items=data.products||[];if(!items.length){box.innerHTML='<div class="hint">Aucun produit structuré n’a été détecté. Vous pouvez ajouter vos produits manuellement.</div>';return}box.innerHTML=`<div class="drop"><b>${items.length} élément(s) détecté(s)</b><p class="sub">Vérifiez puis importez ceux que vous voulez afficher.</p><div class="cards">${items.map((a,i)=>`<div class="product-card"><div class="product-body">${a.image_url?`<img src="${esc(a.image_url)}" style="height:120px;width:100%;object-fit:cover;border-radius:10px;margin-bottom:10px">`:''}<h3>${esc(a.title)}</h3><div class="sub">${esc(a.description||'')}</div>${a.price?`<div class="price">${esc(a.price)} ${esc(a.currency||'FCFA')}</div>`:''}<button class="btn primary" style="margin-top:10px" onclick="saveImported(${i})">Ajouter</button></div></div>`).join('')}</div></div>`;window._imported={items,source:data.source_url};}catch(e){box.innerHTML=`<div class="msg">${esc(e.message)}</div>`}}
async function saveImported(i){const a=window._imported?.items?.[i];if(!a)return;const r=await supa.from('articles').insert({owner_slug:profile.smartlink_slug,title:a.title,description:a.description||'',price:a.price||'',currency:a.currency||'FCFA',kind:a.kind||'produit',image_url:a.image_url||'',source_url:window._imported.source});if(r.error)toast(r.error.message);else{toast('Produit ajouté à votre SmartLink.');await loadBusiness();renderBusiness()}}
function chatKey(){return currentUser?`wa-chat-${currentUser.id}-${profile.smartlink_slug}`:'wa-chat'}function loadChat(){try{chatHistory=JSON.parse(localStorage.getItem(chatKey())||'[]')}catch{chatHistory=[]}}function saveChat(){try{localStorage.setItem(chatKey(),JSON.stringify(chatHistory.slice(-40)))}catch{}}
function renderAssistant(){const html=chatHistory.length?chatHistory.map(m=>`<div class="bubble ${m.role==='user'?'mine':'theirs'}">${esc(m.content)}</div>`).join(''):'<div class="bubble theirs">Bonjour 👋 Je suis votre assistant commercial. Posez-moi une question sur votre activité.</div>';$('screen').innerHTML=`<div class="panel"><div class="eyebrow">Votre assistant commercial</div><h2 style="font:600 31px Georgia,serif;margin:8px 0">Parlez comme un client.</h2><p class="sub">Les réponses restent visibles jusqu'à ce que vous choisissiez de les effacer.</p><div id="chatlog" class="chatlog">${html}</div><div class="composer"><input id="ask" placeholder="Ex. Combien coûtent mes chaussures homme ?" onkeydown="if(event.key==='Enter')askAssistant()"><button class="btn primary" onclick="askAssistant()">Envoyer</button></div><button class="btn secondary" style="margin-top:8px" onclick="clearChat()">Effacer la conversation</button></div>`;const l=$('chatlog');l.scrollTop=l.scrollHeight}
function clearChat(){chatHistory=[];saveChat();renderAssistant()}
async function askAssistant(){const input=$('ask'),text=input.value.trim();if(!text)return;const log=$('chatlog');chatHistory.push({role:'user',content:text});saveChat();log.innerHTML+=`<div class="bubble mine">${esc(text)}</div>`;input.value='';log.scrollTop=log.scrollHeight;try{const r=await fetch('/api/assistant',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,history:chatHistory.slice(-11,-1),business:{display_name:profile.display_name,country:profile.country,bio:profile.bio,smartlink_slug:profile.smartlink_slug,articles:business.articles}})});const data=await r.json().catch(()=>({}));const answer=data.answer||data.error||'L’assistant n’a pas pu répondre.';chatHistory.push({role:'assistant',content:answer});saveChat();log.innerHTML+=`<div class="bubble theirs">${esc(answer)}</div>`;log.scrollTop=log.scrollHeight}catch(e){const answer='Le service est momentanément indisponible. Réessayez dans quelques instants.';chatHistory.push({role:'assistant',content:answer});saveChat();log.innerHTML+=`<div class="bubble theirs">${answer}</div>`}}
function renderBroadcast(){$('screen').innerHTML='<div class="panel"><div class="eyebrow">Diffusion privée</div><h2 style="font:600 31px Georgia,serif">Un message, plusieurs conversations privées.</h2><p class="sub">Architecture prévue pour livrer le même contenu séparément à chaque contact.</p></div>'}
async function copyLink(){await navigator.clipboard?.writeText(location.origin+'/'+profile.smartlink_slug);toast('Lien copié.')}
async function signOut(){await supa.auth.signOut();location.href='/'}
async function renderPublic(slug){const p=await supa.from('profiles').select('display_name,country,smartlink_slug,bio').eq('smartlink_slug',slug).maybeSingle();if(!p.data){renderLanding();return}const a=await supa.from('articles').select('*').eq('owner_slug',slug).order('created_at',{ascending:false});const items=a.data||[];$('public').innerHTML=`<header class="nav"><div class="wrap navrow"><div class="brand">Whats<b>Africa</b></div><button class="btn secondary" onclick="openAuth('signup')">Créer mon SmartLink</button></div></header><main class="wrap"><section class="public-hero"><div class="eyebrow">${esc(p.data.country||'Afrique')} · SmartLink WhatsAfrica</div><h1 style="font:600 clamp(38px,7vw,64px)/1.05 Georgia,serif;margin:12px 0">${esc(p.data.display_name)}</h1><p class="sub" style="font-size:16px;max-width:760px">${esc(p.data.bio||'Découvrez cette activité.')}</p><div class="actions"><button class="btn primary" onclick="openVisitorAssistant('${esc(slug)}')">Parler à l’assistant commercial</button></div></section><section class="section"><div class="eyebrow">Produits & services</div><h2 style="font:600 30px Georgia,serif;margin:8px 0 18px">Découvrez l’offre</h2><div class="cards">${items.length?items.map(productCard).join(''):'<div class="empty">Cette activité n’a pas encore ajouté de produits ou services.</div>'}</div></section><section class="section"><div class="panel"><div class="eyebrow">Découvrir WhatsAfrica</div><h2 style="font:600 26px Georgia,serif">Cette page est aussi une porte d’entrée vers le réseau.</h2><p class="sub">Explorez d’autres SmartLinks et découvrez des activités, produits et services.</p><button class="btn secondary" onclick="location.href='/'">Découvrir la plateforme</button></div></section></main>`}
function openVisitorAssistant(slug){alert('L’assistant visiteur sera relié à ce SmartLink avec les mêmes données commerciales. Pour le moment, utilisez l’espace propriétaire pour tester la conversation.')}
function renderLanding(){$('public').innerHTML=`<header class="nav"><div class="wrap navrow"><div class="brand">Whats<b>Africa</b></div><div class="actions" style="margin:0"><button class="btn secondary" onclick="openAuth('login')">Se connecter</button><button class="btn primary" onclick="openAuth('signup')">Créer mon espace</button></div></div></header><main><section class="hero"><div class="wrap"><div class="eyebrow">Réseau · SmartLink · Commerce</div><h1>Votre identité numérique africaine. Votre business.</h1><p>Créez votre SmartLink, importez votre site e-commerce et laissez <b>Votre assistant commercial</b> travailler à partir de vos vraies informations.</p><div class="actions"><button class="btn primary" onclick="openAuth('signup')">Créer mon SmartLink →</button><button class="btn secondary" onclick="location.href='/'+''">Découvrir</button></div></div></section><section class="section"><div class="wrap"><div class="grid"><div class="tile"><h3>🖼️ Une vitrine qui vend</h3><p>Images, produits, services et prix sont visibles immédiatement.</p></div><div class="tile"><h3>🔗 Importez votre site</h3><p>Collez un lien e-commerce : WhatsAfrica récupère les informations publiques structurées disponibles.</p></div><div class="tile"><h3>🤖 Votre assistant commercial</h3><p>Il répond avec vos données réelles et ne doit jamais inventer un prix.</p></div></div></div></section></main>`}
(async()=>{const s=await supa.auth.getSession();if(s.data.session){await boot(s.data.session.user)}else if(slugPath){await renderPublic(slugPath)}else renderLanding()})();
</script></body></html>
