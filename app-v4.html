async function renderLanding(){const r=await supa.from('profiles').select('display_name,country,smartlink_slug,bio').not('smartlink_slug','is',null).limit(12);const list=r.data||[];$('public').innerHTML=`<header class="nav"><div class="wrap navrow"><div class="brand">Whats<b>Africa</b></div><div class="actions" style="margin:0"><button class="btn secondary" onclick="openAuth('login')">Se connecter</button><button class="btn primary" onclick="openAuth('signup')">Créer mon espace</button></div></div></header><main><section class="hero"><div class="wrap"><div class="eyebrow">Réseau · SmartLink · Commerce</div><h1>Votre identité numérique africaine. Votre business.</h1><p>Créez votre SmartLink, importez votre site e-commerce et laissez <b>Votre assistant commercial</b> travailler à partir de vos vraies informations.</p><div class="actions"><button class="btn primary" onclick="openAuth('signup')">Créer mon SmartLink →</button><button class="btn secondary" onclick="document.getElementById('discover').scrollIntoView({behavior:'smooth'})">Découvrir</button></div></div></section><section class="section"><div class="wrap"><div class="grid"><div class="tile"><h3>🖼️ Une vitrine qui vend</h3><p>Images, produits, services et prix visibles immédiatement.</p></div><div class="tile"><h3>🔗 Importez votre site</h3><p>Un lien e-commerce peut devenir le point de départ de votre catalogue.</p></div><div class="tile"><h3>🤖 Votre assistant commercial</h3><p>Il répond avec les données réelles de votre activité et évite les inventions.</p></div></div></div></section><section id="discover" class="section"><div class="wrap"><div class="eyebrow">Découvrir</div><h2>Les activités du réseau</h2><div class="cards">${list.length?list.map(p=>`<div class="panel"><div class="eyebrow">${esc(p.country||'Afrique')}</div><h3>${esc(p.display_name)}</h3><p class="sub">${esc((p.bio||'Découvrez cette activité.').slice(0,180))}</p><button class="btn secondary" onclick="location.href='/${encodeURIComponent(p.smartlink_slug)}'">Découvrir →</button></div>`).join(''):'<div class="hint">Les premières activités apparaîtront ici.</div>'}</div></div></section></main><footer class="wrap hint" style="padding:40px 0">WhatsAfrica — simplicité devant, robustesse derrière.</footer>`}
(async()=>{const s=await supa.auth.getSession();if(s.data.session){await boot(s.data.session.user)}else if(slug){await renderPublic(slug)}else await renderLanding()})();
