-width:88%;padding:9px 12px;border-radius:14px;margin:7px 0;white-space:pre-wrap}.bot{background:#ffffff0b}.user{margin-left:auto;background:#18a98b;color:#06241e}.composer{display:flex;gap:8px;margin-top:8px}.composer input{flex:1;min-width:0;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0a101c;color:#fff}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:14px;z-index:60}.modal.show{display:flex}.modalbox{width:min(620px,100%);max-height:90vh;overflow:auto;background:#151e30;border:1px solid var(--line);border-radius:20px;padding:18px}.field{margin:10px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.field input,.field textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0a101c;color:#fff;font:inherit}.field textarea{min-height:90px}.notice{padding:11px;border-radius:11px;background:#18a98b18;color:#a4eedc}.error{color:#ffaaa0}.footer{text-align:center;color:#ffffff55;padding:30px}.hidden{display:none!important}@media(max-width:850px){.contacts{grid-template-columns:1fr 1fr}.services,.products{grid-template-columns:1fr 1fr}}@media(max-width:560px){.cover{height:190px}.poster h1{font-size:31px}.posterbody{padding:18px}.contacts,.services,.products{grid-template-columns:1fr}.media{height:210px}.row .btn{min-width:100%}}</style></head><body><header class="nav"><div class="wrap navrow"><a class="brand" href="/">Whats<b>Africa</b></a><a class="btn" href="/market">🛍️ Marché</a></div></header><main class="wrap" id="page"><div class="empty">Chargement de la vitrine…</div></main><footer class="wrap footer">WhatsAfrica — Communiquez. Découvrez. Vendez. Grandissez.</footer><div class="modal" id="modal"><div class="modalbox"><div class="row"><button class="btn" id="close">Fermer</button></div><div id="modalContent"></div></div></div><script>const U='https://dzifpwqrqnvssfhwjccj.supabase.co',K='sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV',db=supabase.createClient(U,K),$=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m])),safe=v=>{try{const u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:null}catch{return null}},money=(v,c)=>v==null?'Prix sur demande':new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0}).format(Number(v||0))+' '+(c||'XOF');const slug=decodeURIComponent(location.pathname.replace(/^\/+/, '').split('/')[0]||'');let link,business,products=[],services=[],payments=[],history=[];async function load(){if(!slug)return fail('Smart Link introuvable');const l=await db.from('smart_links').select('id,business_id,owner_id,slug,title,description,is_public').eq('slug',slug).eq('is_public',true).maybeSingle();if(l.error||!l.data)return fail('Cette vitrine n’existe pas ou n’est pas publique.');link=l.data;const b=await db.from('businesses').select('id,owner_id,name,description,country,city,logo_url,template,accent_color,phone,delivery_enabled,delivery_fee,payment_methods,email,address,website_url,cover_image_url,presentation,services,tagline').eq('id',link.business_id).maybeSingle();if(b.error)throw b.error;business=b.data||{id:link.business_id,name:link.title,description:link.description,services:[]};const [pr,sv,pl]=await Promise.all([db.from('products').select('id,title,description,price,currency,image_url,video_url,stock,is_published,category').eq('business_id',link.business_id).eq('is_published',true).order('created_at',{ascending:false}).limit(80),db.from('marketplace_services').select('id,title,description,category,price,currency,delivery_mode,metadata,status').eq('seller_id',business.owner_id).eq('status','published').order('created_at',{ascending:false}).limit(80),db.from('public_payment_links').select('id,business_id,product_id,smart_link_id,provider,label,url,is_active').eq('is_active',true).or('smart_link_id.eq.'+link.id+',business_id.eq.'+link.business_id)]);if(pr.error)throw pr.error;if(sv.error)console.warn('services',sv.error);if(pl.error)console.warn('payments',pl.error);products=pr.data||[];services=sv.data||[];payments=pl.data||[];document.documentElement.style.setProperty('--a',/^#[0-9a-f]{6}$/i.test(business.accent_color||'')?business.accent_color:'#e8a83c');render()}function fail(t){$('page').innerHTML='<div class="empty"><h1>'+esc(t)+'</h1><a class="btn primary" href="/">Ouvrir WhatsAfrica</a></div>'}function contactHtml(){const map=business.address?'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent([business.address,business.city,business.country].filter(Boolean).join(', ')):'';return '<div class="contacts">'+(business.address?'<div class="contact"><b>📍 ADRESSE</b>'+esc(business.address)+(map?'<br><a target="_blank" rel="noopener" href="'+esc(map)+'">Ouvrir dans Maps →</a>':'')+'</div>':'')+(business.city||business.country?'<div class="contact"><b>🌍 ZONE</b>'+esc([business.city,business.country].filter(Boolean).join(' · '))+'</div>':'')+(business.email?'<div class="contact"><b>✉️ E-MAIL</b><a href="mailto:'+esc(business.email)+'">'+esc(business.email)+'</a></div>':'')+(business.phone?'<div class="contact"><b>📞 TÉLÉPHONE</b><a href="tel:'+esc(business.phone)+'">'+esc(business.phone)+'</a></div>':'')+(business.website_url?'<div class="contact"><b>🌐 SITE</b><a target="_blank" rel="noopener" href="'+esc(safe(business.website_url)||'#')+'">Visiter →</a></div>':'')+'</div>'}function productCard(p){const im=safe(p.image_url),vid=safe(p.video_url);const media=vid?'<video controls preload="metadata" poster="'+esc(im||'')+'" src="'+esc(vid)+'"></video>':im?'<img loading="lazy" src="'+esc(im)+'" alt="'+esc(p.title)+'">':'🛍️';const pay=payments.find(x=>x.product_id===p.id)||payments.find(x=>x.smart_link_id===link.id)||payments.find(x=>x.business_id===business.id);return '<article class="product"><div class="media">'+media+'<span class="badge">PRODUIT</span></div><div class="pbody"><h3>'+esc(p.title)+'</h3>'+(p.category?'<div class="muted">'+esc(p.category)+'</div>':'')+'<div class="muted">'+esc((p.description||'').slice(0,240))+'</div><div class="price">'+money(p.price,p.currency)+'</div><div class="row"><button class="btn primary" data-buy="'+esc(p.id)+'">🛒 Commander</button>'+(pay?'<a class="btn" target="_blank" rel="noopener" href="'+esc(pay.url)+'">💳 Payer</a>':'')+'</div></div></article>'}function serviceCard(s){const meta=s.metadata&&typeof s.metadata==='object'?s.metadata:{};const im=safe(meta.image_url||meta.image);return '<article class="service"><div class="icon">'+(im?'<img src="'+esc(im)+'" alt="'+esc(s.title)+'" style="width:100%;height:100%;object-fit:cover">':'🧰')+'</div><div class="servicebody"><h3>'+esc(s.title)+'</h3>'+(s.category?'<div class="muted">'+esc(s.category)+'</div>':'')+'<div class="muted">'+esc(s.description||'Service proposé par cette entreprise.')+'</div>'+(s.price!=null?'<div class="price">'+money(s.price,s.currency)+'</div>':'')+'<div class="row"><button class="btn primary" data-service="'+esc(s.title)+'">💬 Demander</button></div></div></article>'}function render(){const logo=safe(business.logo_url),cover=safe(business.cover_image_url)||logo;const bs=Array.isArray(business.services)?business.services:[];const inline=bs.map((x,i)=>({id:'inline-'+i,title:String(x),description:'Solution proposée par '+business.name,category:'Service'}));const allServices=[...inline,...services];$('page').innerHTML='<section class="hero"><article class="poster">'+(cover?'<img class="cover" src="'+esc(cover)+'" alt="Image de présentation de '+esc(business.name)+'">':'')+'<div class="posterbody">'+(logo?'<img class="logo" src="'+esc(logo)+'" alt="Logo '+esc(business.name)+'">':'')+'<div class="ey">VITRINE BUSINESS WHATS AFRICA</div><h1 class="h1">'+esc(business.name||link.title)+'</h1>'+(business.tagline?'<div class="tagline">'+esc(business.tagline)+'</div>':'')+'<p class="text">'+esc(business.presentation||business.description||link.description||'')+'</p><div class="meta">'+(business.template?'<span class="pill">🎨 '+esc(business.template)+'</span>':'')+(business.country?'<span class="pill">🌍 '+esc(business.country)+'</span>':'')+'</div>'+contactHtml()+'<div class="actions"><button class="btn primary" id="share">🔗 Partager la vitrine</button><button class="btn" id="assistantBtn">🤝 Assistant commercial</button>'+(business.phone?'<a class="btn" href="tel:'+esc(business.phone)+'">📞 Contacter</a>':'')+'</div></div></article></section><section class="section"><div class="sectionhead"><h2>🧰 Services & solutions</h2><span class="muted">'+allServices.length+' offre'+(allServices.length>1?'s':'')+'</span></div><div class="services">'+(allServices.length?allServices.map(serviceCard).join(''):'<div class="empty">Cette entreprise n’a pas encore publié de service.</div>')+'</div></section><section class="section"><div class="sectionhead"><h2>🛍️ Produits</h2><span class="muted">'+products.length+' produit'+(products.length>1?'s':'')+'</span></div><div class="products">'+(products.length?products.map(productCard).join(''):'<div class="empty">Aucun produit publié pour le moment.</div>')+'</div></section><section class="section assistant" id="assistant"><div class="ey">ASSISTANT COMMERCIAL</div><h2>Une question ?</h2><div class="chat" id="chat"><div class="bubble bot">Bonjour 👋 Je connais cette vitrine, ses services et ses produits. Dites-moi ce que vous cherchez.</div></div><div class="composer"><input id="q" maxlength="2000" placeholder="Ex. Quel produit me conseillez-vous ?"><button class="btn primary" id="send">Envoyer</button></div></section>';$('share').onclick=share;$('assistantBtn').onclick=()=>$('assistant').scrollIntoView({behavior:'smooth'});$('send').onclick=()=>ask($('q').value);$('q').onkeydown=e=>{if(e.key==='Enter')ask($('q').value)};document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>checkout(products.find(p=>p.id===b.dataset.buy)));document.querySelectorAll('[data-service]').forEach(b=>b.onclick=()=>{ $('q').value='Je suis intéressé par le service « '+b.dataset.service+' ». Pouvez-vous m’aider ?';$('assistant').scrollIntoView({behavior:'smooth'});$('q').focus()})}async function share(){const d={title:business.name,text:business.tagline||'Découvrez cette activité sur WhatsAfrica',url:location.href};try{if(navigator.share)await navigator.share(d);else if(navigator.clipboard)await navigator.clipboard.writeText(location.href)}catch{}}function append(role,text){const d=document.createElement('div');d.className='bubble '+role;d.textContent=text;$('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight;return d}async function ask(t){t=String(t||'').trim();if(!t)return;append('user',t);$('q').value='';const wait=append('bot','…');try{const r=await fetch('/api/assistant',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:t,history:history.slice(-10),business:{display_name:business.name,country:business.country,bio:business.presentation||business.description,smartlink_slug:slug,delivery_enabled:!!business.delivery_enabled,delivery_fee:business.delivery_fee||0,payment_methods:business.payment_methods||['cash_on_delivery'],articles:[...products.map(p=>({id:p.id,title:p.title,description:p.description,price:p.price,currency:p.currency||'XOF',kind:'produit',stock:p.stock})),...services.map(s=>({id:s.id,title:s.title,description:s.description,price:s.price,currency:s.currency||'XOF',kind:'service'}))]}})});const d=await r.json();wait.remove();const a=d.answer||d.error||'Service indisponible.';append('bot',a);history.push({role:'user',content:t},{role:'assistant',content:a})}catch(e){wait.remove();append('bot','Connexion momentanément indisponible.')}}function checkout(p){if(!p)return;$('modalContent').innerHTML='<h2>Commander : '+esc(p.title)+'</h2><div class="field"><label>Nom</label><input id="buyerName" autocomplete="name"></div><div class="field"><label>Téléphone</label><input id="buyerPhone" inputmode="tel" autocomplete="tel"></div><div class="field"><label>Ville</label><input id="city" value="'+esc(business.city||'')+'"></div><div class="field"><label>Adresse de livraison</label><textarea id="address"></textarea></div><div class="field"><label>Livraison / retrait</label><input id="delivery" value="'+(business.delivery_enabled?'Livraison':'Retrait')+'"></div><div class="field"><label>Paiement</label><input id="payment" value="'+esc(Array.isArray(business.payment_methods)?business.payment_methods[0]||'À confirmer':'À confirmer')+'"></div><button class="btn primary" id="confirm">Confirmer la commande</button><p id="orderMsg"></p>';$('modal').classList.add('show');$('confirm').onclick=async()=>{const btn=$('confirm');btn.disabled=true;try{const s=await db.auth.getSession(),r=await db.rpc('create_guest_order',{p_business_id:business.id,p_smart_link_id:link.id,p_buyer_name:$('buyerName').value.trim(),p_buyer_phone:$('buyerPhone').value.trim(),p_delivery_city:$('city').value.trim(),p_delivery_address:$('address').value.trim(),p_delivery_method:$('delivery').value.trim(),p_payment_method:$('payment').value.trim(),p_items:[{product_id:p.id,quantity:1,unit_price:p.price,title:p.title}],p_idempotency_key:crypto.randomUUID(),p_buyer_user_id:s.data.session?.user?.id||null});if(r.error)throw r.error;const id=r.data?.id||r.data?.order_id,token=r.data?.tracking_token;if(!id||!token)throw new Error('Référence de suivi indisponible.');$('orderMsg').innerHTML='<div class="notice"><b>Commande enregistrée.</b><br>Référence : '+esc(id)+'<br>Conservez votre code de suivi pour le suivi.</div>'}catch(e){$('orderMsg').innerHTML='<span class="error">'+esc(e.message||'Impossible d’enregistrer la commande.')+'</span>'}finally{btn.disabled=false}}}$('close').onclick=()=>$('modal').classList.remove('show');load().catch(e=>fail(e.message||'Erreur de chargement.'));</script></body></html>
