<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#075e54"><title>Communauté — WhatsAfrica</title><style>body{margin:0;background:#f6f8f5;color:#172019;font:15px system-ui,-apple-system,sans-serif}.wrap{max-width:900px;margin:auto;padding:12px}.top{background:#075e54;color:#fff}.topin{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{color:#fff;text-decoration:none;font-size:23px;font-weight:950}.btn{border:1px solid #dfe7e1;background:#fff;border-radius:12px;padding:10px 13px;font-weight:850;cursor:pointer;text-decoration:none;color:#172019;display:inline-flex;justify-content:center;align-items:center}.primary{background:#0b9489;border-color:#0b9489;color:#fff}.hero,.members,.postbox,.post{margin-top:12px;background:#fff;border:1px solid #dfe7e1;border-radius:18px;padding:16px}.hero{padding:0;overflow:hidden}.hero img{width:100%;height:230px;object-fit:cover;display:block}.body{padding:18px}.muted{color:#68746e;line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.members-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.search{display:flex;gap:8px;margin:14px 0}.search input{flex:1;min-width:0;padding:12px;border:1px solid #b8d7d2;border-radius:12px;font:inherit}.member{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid #e5ebe7}.avatar{width:46px;height:46px;border-radius:50%;background:#dcebe8;display:grid;place-items:center;color:#075e54;font-weight:900;flex:none;background-size:cover;background-position:center}.member-main{min-width:0;flex:1}.name{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;color:#68746e}.status{min-height:20px;margin-top:8px}.err{color:#a32121;font-weight:800}.ok{color:#087b45;font-weight:800}.empty{text-align:center;padding:20px;color:#68746e}.message{white-space:nowrap}.post time{display:block;color:#68746e;font-size:12px;margin-top:7px}@media(max-width:560px){.wrap{padding:9px}.members-head{align-items:flex-start;flex-direction:column}.search{position:sticky;top:0;background:#fff;padding:4px 0;z-index:2}.member .message{padding:9px 10px}.hero img{height:190px}}</style></head><body><header class="top"><div class="wrap topin"><a class="brand" href="/">WhatsAfrica</a><a class="btn" href="/groups">← Communautés</a></div></header><main class="wrap"><section id="hero" class="hero"><div class="body">Chargement…</div></section><section class="members"><div class="members-head"><div><h2 style="margin:0">👥 Membres</h2><div class="muted">Choisissez directement un membre pour lui envoyer un message privé.</div></div><a class="btn primary" href="/inbox">💬 Mes discussions</a></div><div class="search"><input id="filter" placeholder="🔎 Rechercher un membre…" autocomplete="off"></div><div id="memberList"><div class="empty">Chargement des membres…</div></div><div id="memberStatus" class="status muted"></div></section><section id="composer" class="postbox" style="display:none"><b>💬 Discussion de la communauté</b><textarea id="body" maxlength="4000" placeholder="Écrivez un message à la communauté…" style="width:100%;min-height:80px;margin-top:9px;padding:10px;border:1px solid #dfe7e1;border-radius:12px;box-sizing:border-box;font:inherit"></textarea><button id="publish" class="btn primary" style="margin-top:8px">Publier</button><div id="postStatus" class="status muted"></div></section><section><h2>Discussion</h2><div id="posts"><div class="post muted">Chargement…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(function(){const db=supabase.createClient('https://dzifpwqrqnvssfhwjccj.supabase.co','sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV'),$=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));const groupId=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||'');let me=null,rows=[];async function session(){return (await db.auth.getSession()).data.session}async function load(){if(!groupId)throw Error('Communauté introuvable');const g=await db.from('groups').select('id,name,description,is_business,owner_slug,image_url,image_alt').eq('id',groupId).maybeSingle();if(g.error)throw g.error;if(!g.data)throw Error('Communauté introuvable');const x=g.data;$('hero').innerHTML=`${x.image_url?`<img src="${esc(x.image_url)}" alt="${esc(x.image_alt||x.name)}">`:''}<div class="body"><div class="muted">${x.is_business?'💼 Communauté business':'👥 Communauté'}</div><h1 style="margin:7px 0">${esc(x.name)}</h1><p class="muted">${esc(x.description||'Un espace WhatsAfrica pour échanger et avancer ensemble.')}</p><div class="actions"><button id="join" class="btn primary">Rejoindre la communauté</button><button id="share" class="btn">↗️ Partager</button></div><div id="heroStatus" class="status muted"></div></div>`;me=(await session())?.user||null;const mine=me?await db.from('group_members').select('user_id').eq('group_id',groupId).eq('user_id',me.id).maybeSingle():{data:null};if(mine.data){$('join').textContent='✓ Vous êtes membre';$('join').disabled=true;$('composer').style.display='block'}$('join').onclick=async()=>{const s=await session();if(!s){location.href='/auth?next='+encodeURIComponent(location.pathname);return}const r=await db.from('group_members').insert({group_id:groupId,user_id:s.user.id,role:'member'});if(r.error&&!String(r.error.message).toLowerCase().includes('duplicate')){return msg('heroStatus','Impossible de rejoindre : '+r.error.message,true)}$('join').textContent='✓ Vous êtes membre';$('join').disabled=true;$('composer').style.display='block';await loadMembers();await loadPosts()};$('share').onclick=async()=>{try{if(navigator.share)await navigator.share({title:x.name,text:x.description||'Communauté WhatsAfrica',url:location.href});else{await navigator.clipboard.writeText(location.href);msg('heroStatus','✓ Lien copié',false)}}catch(e){}};await loadMembers();await loadPosts()}function msg(id,t,error){$(id).textContent=t;$(id).className='status '+(error?'err':'ok')}async function loadMembers(){const r=await db.from('group_members').select('user_id,role,created_at').eq('group_id',groupId).order('created_at',{ascending:true}).limit(500);if(r.error){$('memberList').innerHTML='<div class="empty">La liste des membres est momentanément indisponible.</div>';return}const ids=(r.data||[]).map(x=>x.user_id);if(!ids.length){rows=[];$('memberList').innerHTML='<div class="empty">Aucun membre pour le moment.</div>';return}const p=await db.from('profiles').select('user_id,display_name,public_display_name,first_name,last_name,country,profile_image_url,profile_photo_url,avatar_url,public_phone,smartlink_slug').in('user_id',ids);const by=new Map((p.data||[]).map(x=>[x.user_id,x]));rows=(r.data||[]).map(m=>{const x=by.get(m.user_id)||{};const name=x.public_display_name||x.display_name||[x.first_name,x.last_name].filter(Boolean).join(' ')||'Membre WhatsAfrica';return {...m,...x,name,avatar:x.avatar_url||x.profile_photo_url||x.profile_image_url||''}});renderMembers()}function renderMembers(){const q=$('filter').value.trim().toLowerCase();const shown=rows.filter(x=>!q||[x.name,x.country,x.smartlink_slug].join(' ').toLowerCase().includes(q));$('memberList').innerHTML=shown.length?shown.map(x=>{const self=me&&x.user_id===me.id;return `<div class="member"><div class="avatar" ${x.avatar?`style="background-image:url('${esc(x.avatar)}')"`:''}>${x.avatar?'':esc(x.name.slice(0,1).toUpperCase())}</div><div class="member-main"><div class="name">${esc(x.name)} ${x.role==='owner'?'👑':''}${self?' · Vous':''}</div><div class="meta">${esc(x.country||'Afrique')}</div></div>${self?'':`<button class="btn primary message" data-user="${esc(x.user_id)}" data-phone="${esc(x.public_phone||'')}" data-waid="${esc(x.smartlink_slug||'')}" data-name="${esc(x.name)}">💬 Message</button>`}</div>`}).join(''):'<div class="empty">Aucun membre ne correspond à votre recherche.</div>';document.querySelectorAll('[data-user]').forEach(b=>b.onclick=()=>startChat(b.dataset.user,b.dataset.phone,b.dataset.waid,b.dataset.name))}$('filter').oninput=renderMembers;async function startChat(userId,phone,waid,name){const s=await session();if(!s){location.href='/auth?next='+encodeURIComponent(location.pathname);return}msg('memberStatus','Ouverture de la discussion avec '+name+'…',false);$('memberList').style.pointerEvents='none';try{let r=await db.rpc('start_direct_conversation_by_user_id',{p_user_id:userId});if(!r.error&&r.data?.[0]?.conversation_id)return location.href='/inbox?conversation='+encodeURIComponent(r.data[0].conversation_id);r=await db.rpc('start_direct_conversation_by_identifier',{p_identifier:waid||phone});if(!r.error&&r.data?.[0]?.conversation_id)return location.href='/inbox?conversation='+encodeURIComponent(r.data[0].conversation_id);if(phone){r=await db.rpc('start_direct_conversation_by_phone',{p_phone:phone});if(!r.error&&r.data?.[0]?.conversation_id)return location.href='/inbox?conversation='+encodeURIComponent(r.data[0].conversation_id)}throw r.error||Error('CONTACT_NOT_FOUND')}catch(e){msg('memberStatus','Impossible d’ouvrir la discussion. Le compte du membre doit être disponible pour la messagerie.',true)}finally{$('memberList').style.pointerEvents='auto'}}async function loadPosts(){const r=await db.from('group_posts').select('id,body,created_at').eq('group_id',groupId).order('created_at',{ascending:false}).limit(50);if(r.error){$('posts').innerHTML='<div class="post err">Discussion momentanément indisponible.</div>';return}$('posts').innerHTML=r.data?.length?r.data.map(p=>`<article class="post"><div>${esc(p.body)}</div><time>${new Date(p.created_at).toLocaleString('fr-FR')}</time></article>`).join(''):'<div class="post muted">Aucun message pour le moment.</div>'} $('publish').onclick=async()=>{const s=await session(),text=$('body').value.trim();if(!s){location.href='/auth?next='+encodeURIComponent(location.pathname);return}if(!text)return;$('publish').disabled=true;const r=await db.from('group_posts').insert({group_id:groupId,author_id:s.user.id,body:text});if(r.error)msg('postStatus','Impossible de publier : '+r.error.message,true);else{$('body').value='';msg('postStatus','✓ Message publié',false);await loadPosts()}$('publish').disabled=false};load().catch(e=>{$('hero').innerHTML='<div class="body"><b>Communauté introuvable.</b><p><a class="btn primary" href="/groups">Retour aux communautés</a></p></div>'})})();</script></body></html>
