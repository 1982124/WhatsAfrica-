<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d17"><title>WhatsAfrica — Communautés</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#090d17;--panel:#111827;--panel2:#18243b;--text:#f8f5eb;--muted:#98a5bb;--gold:#f2b84b;--teal:#22c7a3;--line:#26334c;--red:#ff8f8f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#273652,#090d17 42%);color:var(--text);font:15px system-ui}.wrap{max-width:1050px;margin:auto;padding:0 18px}.nav{border-bottom:1px solid var(--line);padding:14px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-weight:950;font-size:21px;color:#fff;text-decoration:none}.brand b,h1 b{color:var(--gold)}.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.gold{background:var(--gold);color:#171208}.ghost{background:transparent;color:#fff;border:1px solid var(--line)}.hero{padding:45px 0 25px}.ey{color:var(--teal);font:800 11px monospace;letter-spacing:2px}h1,h2{font-family:Georgia,serif}h1{font-size:clamp(38px,6vw,64px);margin:12px 0}.muted{color:var(--muted);line-height:1.55}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:#111827;border:1px solid var(--line);border-radius:18px;padding:18px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}input,textarea,select{width:100%;padding:12px;background:#0b1220;color:#fff;border:1px solid var(--line);border-radius:10px;margin:5px 0}textarea{min-height:100px}.modal{display:none;position:fixed;inset:0;background:#000b;place-items:center;padding:18px;z-index:10}.modal.show{display:grid}.box{width:min(500px,100%);background:#111827;border:1px solid var(--line);border-radius:18px;padding:20px}.post{border-top:1px solid var(--line);padding:14px 0}.comment{margin:7px 0;padding:8px 11px;background:#0b1220;border-radius:10px}.hidden{display:none!important}.ok{color:#5ee1b3}.err{color:var(--red)}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 9px;color:var(--muted);font-size:12px}.composer{display:flex;gap:7px}.composer input{flex:1;margin:0}.status{min-height:20px}@media(max-width:700px){.grid{grid-template-columns:1fr}.row{align-items:flex-start;flex-direction:column}.composer{flex-direction:column}.composer .btn{width:100%}}</style></head><body><header class="nav"><div class="wrap row"><a class="brand" href="/">Whats<b>Africa</b></a><div class="actions"><a class="btn ghost" href="/dashboard">Mon compte</a><button class="btn gold" id="newGroup">+ Créer une communauté</button></div></div></header><main class="wrap"><section class="hero"><div class="ey">👥 COMMUNAUTÉS</div><h1>Des groupes qui deviennent des <b>marchés de confiance.</b></h1><p class="muted">Échangez par ville, métier, secteur ou opportunité. Rejoignez une communauté, publiez, commentez et transformez l'intérêt en conversation commerciale.</p><p id="topStatus" class="status muted"></p></section><div id="groups" class="grid"><div class="card">Chargement…</div></div><section id="detail" class="hidden"></section></main><div id="modal" class="modal"><div class="box"><h2>Créer une communauté</h2><input id="name" maxlength="120" placeholder="Nom de la communauté"><textarea id="description" maxlength="5000" placeholder="Décrivez la communauté"></textarea><select id="business"><option value="false">Communauté générale</option><option value="true">Communauté business</option></select><div class="actions"><button class="btn ghost" id="close">Annuler</button><button class="btn gold" id="create">Créer</button></div><p id="status" class="status"></p></div></div><script>const db=supabase.createClient('https://dzifpwqrqnvssfhwjccj.supabase.co','sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV');let session=null,current=null,channel=null,profile=null;const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function msg(t,ok=false){$('topStatus').textContent=t;$('topStatus').className='status '+(ok?'ok':'err')}async function init(){const s=await db.auth.getSession();session=s.data.session||null;await loadGroups()}async function ensureProfile(){if(!session)return null;let r=await db.from('profiles').select('id,smartlink_slug,display_name').eq('user_id',session.user.id).maybeSingle();if(r.error)throw r.error;if(r.data)return r.data;let base=(session.user.user_metadata?.display_name||session.user.email?.split('@')[0]||'membre').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,30)||'membre';let slug=base+'-'+Math.random().toString(36).slice(2,6);let c=await db.from('profiles').insert({user_id:session.user.id,display_name:session.user.user_metadata?.display_name||session.user.email?.split('@')[0]||'Membre',country:'Mali',smartlink_slug:slug,bio:'Mon espace WhatsAfrica.'}).select('id,smartlink_slug,display_name').single();if(c.error)throw c.error;return c.data}async function loadGroups(){let r=await db.from('groups').select('id,name,description,is_business,owner_slug,created_at').order('created_at',{ascending:false});if(r.error){$('groups').innerHTML='<div class="card err">Erreur : '+esc(r.error.message)+'</div>';return}if(!r.data.length){$('groups').innerHTML='<div class="card">Aucune communauté pour le moment.</div>';return}$('groups').innerHTML=r.data.map(g=>'<article class="card"><span class="pill">'+(g.is_business?'💼 Business':'👥 Communauté')+'</span><h2>'+esc(g.name)+'</h2><p class="muted">'+esc(g.description||'')+'</p><p class="muted">Créée par '+esc(g.owner_slug||'membre')+'</p><button class="btn gold" onclick="openGroup(\''+g.id+'\')">Ouvrir</button></article>').join('')}async function openGroup(id){current=id;let r=await db.from('groups').select('*').eq('id',id).single();if(r.error){msg(r.error.message);return}let members=await db.from('group_members').select('user_id',{count:'exact',head:true}).eq('group_id',id);let mine=session?await db.from('group_members').select('user_id').eq('group_id',id).eq('user_id',session.user.id).maybeSingle():{data:null};$('detail').classList.remove('hidden');$('groups').classList.add('hidden');$('detail').innerHTML='<div class="card"><button class="btn ghost" onclick="back()">← Communautés</button> <span class="pill">'+(r.data.is_business?'💼 Business':'👥 Communauté')+'</span><h1 style="font-size:40px">'+esc(r.data.name)+'</h1><p class="muted">'+esc(r.data.description||'')+'</p><p class="muted">'+(members.count||0)+' membre(s)</p><div class="actions">'+(mine.data?'<button class="btn ghost" onclick="leaveGroup()">Quitter</button>':'<button class="btn gold" onclick="joinGroup()">Rejoindre</button>')+'</div></div><div class="card"><h2>Publications</h2><div id="posts">Chargement…</div><div class="composer"><input id="postText" maxlength="4000" placeholder="Publier dans cette communauté…"><button class="btn gold" onclick="post()">Publier</button></div></div>';await loadPosts(id);subscribe(id)}function back(){if(channel)db.removeChannel(channel);$('detail').classList.add('hidden');$('groups').classList.remove('hidden');current=null}window.openGroup=openGroup;window.back=back;async function need(){if(session)return true;alert('Connectez-vous pour rejoindre, publier ou commenter.');location.href='/dashboard';return false}async function joinGroup(){if(!await need())return;let r=await db.from('group_members').insert({group_id:current,user_id:session.user.id,role:'member'});if(r.error&&r.code!=='23505'){alert('Impossible de rejoindre : '+r.error.message);return}openGroup(current)}async function leaveGroup(){if(!await need())return;let r=await db.from('group_members').delete().eq('group_id',current).eq('user_id',session.user.id);if(r.error){alert(r.error.message);return}openGroup(current)}async function post(){if(!await need())return;let input=$('postText'),body=input.value.trim();if(!body)return;let r=await db.from('group_posts').insert({group_id:current,author_id:session.user.id,body});if(r.error){alert('Publication : '+r.error.message);return}input.value='';await loadPosts(current)}async function loadPosts(id){let r=await db.from('group_posts').select('id,author_id,body,created_at').eq('group_id',id).order('created_at',{ascending:false}).limit(50);if(r.error){$('posts').innerHTML='<p class="err">'+esc(r.error.message)+'</p>';return}$('posts').innerHTML=r.data?.length?r.data.map(p=>'<div class="post"><p>'+esc(p.body)+'</p><small class="muted">'+new Date(p.created_at).toLocaleString('fr-FR')+'</small><div id="comments-'+p.id+'">Chargement…</div><div class="composer"><input id="c-'+p.id+'" maxlength="1000" placeholder="Commenter…"><button class="btn ghost" onclick="comment(\''+p.id+'\')">Répondre</button></div></div>').join(''):'<p class="muted">Aucune publication. Soyez le premier.</p>';for(const p of r.data||[])await loadComments(p.id)}async function loadComments(pid){let r=await db.from('group_comments').select('body,created_at').eq('post_id',pid).order('created_at');let e=$('comments-'+pid);if(e)e.innerHTML=(r.data||[]).map(c=>'<div class="comment">'+esc(c.body)+' <small class="muted">'+new Date(c.created_at).toLocaleString('fr-FR')+'</small></div>').join('')||''}async function comment(pid){if(!await need())return;let input=$('c-'+pid),body=input.value.trim();if(!body)return;let r=await db.from('group_comments').insert({post_id:pid,author_id:session.user.id,body});if(r.error){alert('Commentaire : '+r.error.message);return}input.value='';await loadComments(pid)}function subscribe(id){if(channel)db.removeChannel(channel);channel=db.channel('group-'+id).on('postgres_changes',{event:'INSERT',schema:'public',table:'group_posts',filter:'group_id=eq.'+id},()=>loadPosts(id)).on('postgres_changes',{event:'INSERT',schema:'public',table:'group_comments'},()=>loadPosts(id)).subscribe()}$('newGroup').onclick=async()=>{if(!await need())return;try{profile=await ensureProfile();$('modal').classList.add('show');$('status').textContent=''}catch(e){$('status').innerHTML='<span class="err">'+esc(e.message)+'</span>'}};$('close').onclick=()=>$('modal').classList.remove('show');$('create').onclick=async()=>{if(!await need())return;let name=$('name').value.trim(),description=$('description').value.trim();if(!name||!description){$('status').innerHTML='<span class="err">Nom et description obligatoires.</span>';return}try{profile=profile||await ensureProfile();let r=await db.from('groups').insert({name,description,is_business:$('business').value==='true',owner_slug:profile.smartlink_slug}).select().single();if(r.error)throw r.error;$('status').innerHTML='<span class="ok">🟢 Communauté créée.</span>';$('name').value='';$('description').value='';await loadGroups();setTimeout(()=>{$('modal').classList.remove('show');openGroup(r.data.id)},350)}catch(e){$('status').innerHTML='<span class="err">'+esc(e.message)+'</span>'}};init();</script></body></html>
