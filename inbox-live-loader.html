<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WASSAFRICA — Messages</title></head><body><p>Ouverture sécurisée de vos messages…</p><script>(async()=>{try{const r=await fetch('/inbox-canonical-v1.html',{cache:'no-store'});if(!r.ok)throw Error('MESSAGING_PAGE_HTTP_'+r.status);let h=await r.text();
// Red-team canonical patch: remove the legacy private Broadcast subscription and use authenticated Postgres Changes.
h=h.replace(/async function subscribe\(c\)\{.*?\}async function openConv/s,(m)=>{const open='async function openConv';return 'async function subscribe(c){if(currentChannel){try{await sb.removeChannel(currentChannel)}catch{}currentChannel=null}await sb.realtime.setAuth(session.access_token);const ch=sb.channel(\'messages-v2-\'+c.id).on(\'postgres_changes\',{event:\'*\',schema:\'public\',table:\'messages_v2\',filter:\'conversation_id=eq.'+c.id+'\'},async p=>{const r=p?.new||p?.old;if(r?.conversation_id!==c.id)return;if(p.eventType===\'DELETE\')removeMessage(r.id);else upsertMessage(r);await renderMessages();await markRead()});currentChannel=ch;return new Promise((resolve,reject)=>{ch.subscribe(s=>{if(s===\'SUBSCRIBED\'){status(\'🟢 Connecté en temps réel\');resolve()}else if(s===\'CHANNEL_ERROR\'||s===\'TIMED_OUT\'){status(\'⚠️ Temps réel indisponible — resynchronisation\');reject(Error(s))}else if(s===\'CLOSED\'){reject(Error(\'CHANNEL_CLOSED\'))}})})}'+open});
// Make the active conversation observable by the canonical E2EE recovery worker.
h=h.replace('async function openConv(c){current=c;','async function openConv(c){current=c;window.__WA_CURRENT_CONVERSATION_ID=c.id;');
// Load the recovery worker in the same IndexedDB/auth context as the canonical page.
h=h.replace('</body>','<script src="/e2ee-key-recovery-canonical-v1.js"><\\/script><script src="/wa-realtime-canonical-guard.js"><\\/script></body>');document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<p>❌ Messagerie momentanément indisponible.</p><pre>'+String(e.message||e).replace(/[<>]/g,'')+'</pre>'}})();</script></body></html>
