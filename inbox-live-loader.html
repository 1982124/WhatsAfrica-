<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WASSAFRICA — Messages</title></head><body><p>Ouverture sécurisée de vos messages…</p><script>(async()=>{try{const r=await fetch('/inbox-canonical-v1.html',{cache:'no-store'});if(!r.ok)throw Error('MESSAGING_PAGE_HTTP_'+r.status);let h=await r.text();
h=h.replace('<div class="search"><input id="target" autocomplete="off" placeholder="Nom, numéro ou activité…"><button id="searchBtn" type="button" disabled>Rechercher</button></div>','<div class="search"><input id="target" autocomplete="off" placeholder="Rechercher une personne, entreprise, activité ou Smart Link…"><button id="searchBtn" type="button" disabled>Rechercher</button></div><div id="directoryScope" style="display:flex;gap:6px;margin-top:8px"><button type="button" data-scope="restricted" style="flex:1;padding:8px;border:1px solid #dce5df;border-radius:12px;font-weight:800;background:#173d2d;color:#fff">Mon réseau</button><button type="button" data-scope="global" style="flex:1;padding:8px;border:1px solid #dce5df;border-radius:12px;font-weight:800;background:#fff;color:#18231d">Tout WhatsAfrica</button></div><div id="directoryHint" style="font-size:11px;color:#748078;padding:6px 2px">Recherche restreinte : conversations, groupes et entreprises auxquels vous êtes lié.</div>');
h=h.replace(/async function subscribe\(c\)\{.*?\}async function openConv/s,()=>String.raw`async function subscribe(c){if(currentChannel){try{await sb.removeChannel(currentChannel)}catch{}currentChannel=null}await sb.realtime.setAuth(session.access_token);const ch=sb.channel('messages-v2-'+c.id).on('postgres_changes',{event:'*',schema:'public',table:'messages_v2',filter:'conversation_id=eq.'+c.id},async p=>{const r=p?.new||p?.old;if(r?.conversation_id!==c.id)return;if(p.eventType==='DELETE')removeMessage(r.id);else upsertMessage(r);await renderMessages();await markRead()});currentChannel=ch;return new Promise((resolve,reject)=>{ch.subscribe(s=>{if(s==='SUBSCRIBED'){status('🟢 Connecté en temps réel');resolve()}else if(s==='CHANNEL_ERROR'||s==='TIMED_OUT'){status('⚠️ Temps réel indisponible — resynchronisation');reject(Error(s))}else if(s==='CLOSED'){reject(Error('CHANNEL_CLOSED'))}})})}async function openConv`);

h=h.replace(/async function search\(\)\{.*?\}async function loadMessages/s,()=>String.raw`async function search(){const q=$('target').value.trim();if(!q)return;const scope=window.__WA_DIRECTORY_SCOPE||'restricted';status('Recherche '+(scope==='global'?'dans tout WhatsAfrica':'dans votre réseau')+'…');try{const rows=(await rpc('search_wassafrica_directory',{p_query:q,p_scope:scope})||[]).filter(x=>x.user_id!==user.id),box=$('list');box.innerHTML='';if(!rows.length){box.innerHTML='<div class="empty">Aucun résultat. Essayez le nom complet, une activité, une entreprise ou un Smart Link.</div>';status('Aucun résultat.');return}for(const p of rows.slice(0,50)){const d=document.createElement('div');d.className='conv';d.dataset.directoryUserId=p.user_id||'';const av=document.createElement('div');av.className='avatar';if(p.avatar_url){const im=document.createElement('img');im.src=p.avatar_url;im.alt='';av.textContent='';av.append(im)}else av.textContent=(p.display_name||'W').trim().charAt(0).toUpperCase();const main=document.createElement('div'),n=document.createElement('div'),s=document.createElement('div');n.className='name';s.className='sub';n.textContent=p.display_name||'Profil WASSAFRICA';s.textContent=[p.result_type==='business'?'🏢 Entreprise':'👤 Membre',p.city,p.country].filter(Boolean).join(' · ');main.append(n,s);d.append(av,main);d.onclick=async()=>{if(!p.user_id){status('Ce profil n’est pas encore joignable.');return}try{status('Ouverture de la conversation…');const r=await rpc('start_direct_conversation_by_user_id',{p_user_id:p.user_id}),x=Array.isArray(r)?r[0]:r;if(!x?.conversation_id)throw Error('CONTACT_NOT_FOUND');await loadList();const c=state.conversations.get(x.conversation_id)||{id:x.conversation_id,title:x.contact_name};state.conversations.set(c.id,c);renderList();await openConv(c)}catch(e){status('Impossible d’ouvrir : '+e.message)}};box.append(d)}status(rows.length+' résultat'+(rows.length>1?'s':'')+'. Sélectionnez un profil pour lui écrire.')}catch(e){status('Recherche impossible : '+e.message)}}async function loadMessages`);
h=h.replace('</body>','<script src="/e2ee-key-recovery-canonical-v1.js"><\\/script><script src="/wa-realtime-canonical-guard.js"><\\/script><script src="/wa-media-calls.js"><\\/script><script>(function(){window.__WA_DIRECTORY_SCOPE="restricted";function sync(){document.querySelectorAll("#directoryScope [data-scope]").forEach(b=>{const on=b.dataset.scope===window.__WA_DIRECTORY_SCOPE;b.style.background=on?"#173d2d":"#fff";b.style.color=on?"#fff":"#18231d"});const h=document.getElementById("directoryHint");if(h)h.textContent=window.__WA_DIRECTORY_SCOPE==="global"?"Recherche mondiale : tous les profils et entreprises publics de WhatsAfrica.":"Recherche restreinte : conversations, groupes et entreprises auxquels vous êtes lié."}document.addEventListener("click",e=>{const b=e.target.closest?.("#directoryScope [data-scope]");if(!b)return;window.__WA_DIRECTORY_SCOPE=b.dataset.scope;sync();const q=document.getElementById("target");if(q?.value.trim())document.getElementById("searchBtn")?.click()},{capture:true});sync()})();<\\/script></body>');document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<p>❌ Messagerie momentanément indisponible.</p><pre>'+String(e.message||e).replace(/[<>]/g,'')+'</pre>'}})();</script></body></html>
