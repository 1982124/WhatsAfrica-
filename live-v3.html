<!doctype html><html lang="fr"><head><script src="/i18n.js" defer></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>WASSAFRICA — Business Live</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#f7f7f5;--card:#fff;--ink:#20272b;--muted:#68737b;--line:#dfe4e6;--accent:#b78318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1100px;margin:auto;padding:16px}.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:12px}.brand{font-weight:950;color:var(--ink);text-decoration:none}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 15px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:850;cursor:pointer;text-decoration:none}.primary{background:var(--accent);border-color:var(--accent);color:#fff}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:15px}.hero{background:linear-gradient(135deg,#fff,#f0f1f1)}h1{font:800 clamp(34px,6vw,60px)/1.03 Georgia,serif;margin:7px 0}.muted{color:var(--muted)}.filters{display:flex;gap:8px;overflow:auto;margin:16px 0}.filter.active{background:var(--ink);color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.cover{height:200px;background:#eef1f2;border-radius:14px;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.empty{text-align:center;padding:40px;color:var(--muted);border:1px dashed var(--line);border-radius:18px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:15px;z-index:20}.modal.show{display:flex}.box{width:min(620px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:20px;padding:20px}.field{margin-top:11px}.field label{display:block;font-size:12px;font-weight:850;color:var(--muted);margin-bottom:5px}.input{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;font:inherit}.status{min-height:22px;margin-top:10px;font-weight:800}.err{color:#b83b32}.ok{color:#287a4d}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:540px){.grid{grid-template-columns:1fr}.actions .btn{width:100%}}</style></head><body><main class="wrap"><nav class="nav"><a class="brand" href="/">WASSAFRICA / Business Live</a><div class="actions"><a class="btn" href="/dashboard">Mon compte</a><button class="btn primary" id="create">＋ Créer un Live</button></div></nav><section class="hero"><div class="muted">🔴 OPPORTUNITÉS EN TEMPS RÉEL</div><h1>Publiez. Invitez. Convertissez.</h1><p class="muted">Une demande, une offre ou un partenariat devient une page partageable. Les invités peuvent ensuite rejoindre la conversation WASSAFRICA.</p></section><div class="filters"><button class="btn filter active" data-f="all">Tout</button><button class="btn filter" data-f="Je cherche">Demandes</button><button class="btn filter" data-f="Je propose">Offres</button><button class="btn filter" data-f="Partenariat">Partenariats</button></div><section id="list" class="grid"><div class="empty">Chargement…</div></section></main><div class="modal" id="modal"><div class="box"><h2>Créer un Business Live</h2><div class="field"><label>Type</label><select id="type" class="input"><option>Je cherche</option><option>Je propose</option><option>Partenariat</option><option>Opportunité</option></select></div><div class="field"><label>Titre *</label><input id="title" class="input" maxlength="140"></div><div class="field"><label>Teaser</label><input id="teaser" class="input" maxlength="220"></div><div class="field"><label>Catégorie</label><input id="category" class="input"></div><div class="field"><label>Description</label><textarea id="description" class="input" rows="5"></textarea></div><div class="field"><label>Ville / pays</label><input id="location" class="input"></div><div class="field"><label>Image de couverture</label><input id="cover" type="file" accept="image/jpeg,image/png,image/webp"></div><div class="actions" style="margin-top:16px"><button class="btn" id="close">Annuler</button><button class="btn primary" id="publish">Publier</button></div><div id="msg" class="status"></div></div></div><script>(async()=>{const db=supabase.createClient('https://dzifpwqrqnvssfhwjccj.supabase.co','sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV'),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));let session=null,lives=[],filter='all';const show=(t,ok=false)=>$('msg').innerHTML='<span class="'+(ok?'ok':'err')+'">'+esc(t)+'</span>';async function init(){session=(await db.auth.getSession()).data.session;if(!session){$('list').innerHTML='<div class="empty" style="grid-column:1/-1"><b>Connectez-vous pour utiliser Business Live.</b><p><a class="btn primary" href="/auth?next=/live">Se connecter</a></p></div>';return}await load()}async function load(){const r=await db.from('business_live_sessions').select('id,title,description,category,status,live_type,location,teaser,cover_image_url,created_at').in('status',['live','scheduled']).order('created_at',{ascending:false}).limit(80);if(r.error)throw r.error;lives=r.data||[];render()}function render(){const rows=lives.filter(x=>filter==='all'||String(x.live_type||'').toLowerCase()===filter.toLowerCase()||String(x.title+' '+x.description).toLowerCase().includes(filter.toLowerCase()));$('list').innerHTML=rows.length?rows.map(x=>'<article class="card"><div class="cover">'+(x.cover_image_url?'<img src="'+esc(x.cover_image_url)+'" alt="">':'<div style="height:100%;display:grid;place-items:center;font-size:55px">🔴</div>')+'</div><p class="muted">'+(x.status==='live'?'🔴 EN DIRECT':'🟡 PROGRAMMÉ')+' · '+esc(x.live_type||'Opportunité')+'</p><h2>'+esc(x.title)+'</h2><p class="muted">'+esc(x.teaser||x.description||'')+'</p><p class="muted">'+esc(x.category||'Opportunité')+(x.location?' · '+esc(x.location):'')+'</p><div class="actions"><a class="btn primary" href="/live/'+encodeURIComponent(x.id)+'">Ouvrir</a><button class="btn" onclick="navigator.share?navigator.share({title:'+JSON.stringify(x.title)+',url:location.origin+'/live/'+x.id+'}):navigator.clipboard?.writeText(location.origin+'/live/'+x.id)">🔗 Inviter</button></div></article>').join(''):'<div class="empty" style="grid-column:1/-1">Aucune opportunité dans ce filtre.</div>'}document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.f;b.classList.add('active');document.querySelectorAll('.filter').forEach(x=>{if(x!==b)x.classList.remove('active')});render()});$('create').onclick=()=>{if(!session){location.href='/auth?next=/live';return}$('modal').classList.add('show')};$('close').onclick=()=>$('modal').classList.remove('show');$('publish').onclick=async()=>{try{$('publish').disabled=true;const title=$('title').value.trim();if(!title)throw Error('Titre obligatoire.');const f=$('cover').files[0];let cover=null;if(f){if(f.size>8*1024*1024)throw Error('Image trop volumineuse.');const path=session.user.id+'/live-'+crypto.randomUUID()+'.'+(f.name.split('.').pop()||'jpg');const u=await db.storage.from('profile-media').upload(path,f,{contentType:f.type,upsert:false});if(u.error)throw u.error;cover=db.storage.from('profile-media').getPublicUrl(path).data.publicUrl}const r=await db.from('business_live_sessions').insert({host_id:session.user.id,title,description:$('description').value.trim(),category:$('category').value.trim(),live_type:$('type').value,location:$('location').value.trim(),teaser:$('teaser').value.trim()||title,cover_image_url:cover,status:'live'});if(r.error)throw r.error;show('Live publié.',true);$('modal').classList.remove('show');await load()}catch(e){show(e.message||'Publication impossible')}finally{$('publish').disabled=false}};await init()})().catch(e=>{document.getElementById('list').innerHTML='<div class="empty" style="grid-column:1/-1">Impossible de charger Business Live.</div>'})</script></body></html>
