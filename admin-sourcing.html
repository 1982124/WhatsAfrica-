<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WASSAFRICA — Sourcing</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin-sso.js"></script><style>body{font:14px system-ui;background:#f7f5ef;margin:0;color:#172016}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #ddd9cf;border-radius:16px;padding:16px;margin:12px 0}.btn{display:inline-block;padding:9px 12px;border-radius:10px;border:1px solid #1b4332;background:#1b4332;color:#fff;text-decoration:none;font-weight:800;cursor:pointer}.ghost{background:#fff;color:#1b4332}.req{border-top:1px solid #ddd9cf;padding:14px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.box{border:1px solid #ddd9cf;border-radius:10px;padding:10px}.muted{color:#68746d}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header><h1>🔎 WASSAFRICA — Sourcing opérationnel</h1><p class="muted">Demandes reçues, correspondances et suivi.</p><a class="btn ghost" href="/admin-cockpit-v3.html">← Cockpit</a> <button id="refresh" class="btn">Actualiser</button></header><section id="msg" class="card">Sécurisation…</section><section id="app" hidden><div class="card"><b id="count">—</b></div><div id="list" class="card">Chargement…</div></section></main><script>let db;const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]));async function boot(){try{for(let i=0;i<100&&!window.supabase;i++)await new Promise(r=>setTimeout(r,50));if(!window.supabase)throw new Error("SUPABASE_JS_UNAVAILABLE");const s=await WA_ADMIN_SSO.requireAdmin();db=s.db;$("msg").textContent="✓ Administrateur authentifié. Sourcing connecté à Supabase.";$("app").hidden=false;load()}catch(e){$("msg").textContent="Accès administrateur requis."}}async function load(){const r=await db.from("sourcing_requests").select("*").order("created_at",{ascending:false}).limit(200);if(r.error){$("list").textContent="Erreur: "+r.error.message;return}const rows=r.data||[];$("count").textContent=rows.length+" demande(s)";$("list").innerHTML=rows.map(x=>"<article class=req><b>"+esc(x.need)+"</b> <small>"+esc(x.status)+"</small><div class=muted>📍 "+esc([x.neighborhood,x.city,x.country].filter(Boolean).join(" · "))+"</div><p>"+esc(x.description||"")+"</p><div class=grid><div class=box><b>Demandeur</b><br>"+esc(x.requester_name||"—")+"<br>"+esc(x.requester_contact||"—")+"</div><div class=box><b>Besoin</b><br>"+esc(x.quantity||"—")+" "+esc(x.unit||"")+" · livraison: "+(x.delivery_required?"oui":"non")+"<br>Zone: "+esc(x.delivery_zone||"—")+"</div></div><p><a class=btn href="/africa-network.html?need="+encodeURIComponent(x.need||"")+"&country="+encodeURIComponent(x.country||"")+"&city="+encodeURIComponent(x.city||"")+"&neighborhood="+encodeURIComponent(x.neighborhood||"")>Voir la recherche</a></p></article>").join("")||"Aucune demande."}$("refresh").onclick=load;window.addEventListener("load",()=>boot(),{once:true});</script></body></html>
