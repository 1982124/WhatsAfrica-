(()=>{'use strict';const SB='https://dzifpwqrqnvssfhwjccj.supabase.co',KEY='sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV',AUTH='whatsafrica-auth',DB='wassafrica-msg-v20',frame=document.getElementById('wa');let fixing=false,redispatch=false,session=null,user=null,device=null;const b64=x=>{let s='';new Uint8Array(x).forEach(b=>s+=String.fromCharCode(b));return btoa(s)};function readSession(){try{const keys=[AUTH,...Array.from({length:localStorage.length},(_,i)=>localStorage.key(i)).filter(k=>k&&k!==AUTH)];for(const k of keys){try{const x=JSON.parse(localStorage.getItem(k)||'null'),s=x?.access_token?x:x?.session||x?.currentSession||x?.data?.session;if(s?.access_token&&s.user?.id)return s}catch{}}}catch{}return null}async function api(path,opt={}){const h=new Headers(opt.headers||{});h.set('apikey',KEY);if(session?.access_token)h.set('Authorization','Bearer '+session.access_token);if(opt.body&&!h.has('Content-Type'))h.set('Content-Type','application/json');const r=await fetch(SB+path,{...opt,headers:h});let d=null;try{d=await r.json()}catch{}if(!r.ok){const e=Error(d?.message||d?.details||d?.hint||d?.code||('HTTP_'+r.status));e.code=d?.code;throw e}return d}const rest=(t,q='',o={})=>api('/rest/v1/'+t+(q?'?'+q:''),o),rpc=(f,b)=>api('/rest/v1/rpc/'+f,{method:'POST',body:JSON.stringify(b)});function idb(){return new Promise((ok,no)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('k'))r.result.createObjectStore('k')};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function getIdentity(){const d=await idb();return new Promise((ok,no)=>{const q=d.transaction('k').objectStore('k').get('id:'+user.id);q.onsuccess=()=>{const v=q.result;d.close();ok(v||null)};q.onerror=()=>{d.close();no(q.error)}})}async function getDevice(){if(device)return device;const rec=await getIdentity();if(!rec?.publicJwk||!rec?.privateJwk)throw Error('DEVICE_NOT_READY');const privateKey=await crypto.subtle.importKey('jwk',rec.privateJwk,{name:'RSA-OAEP',hash:'SHA-256'},true,['decrypt']);const r=await rpc('ensure_web_device',{p_identity_public_key:rec.publicJwk}),d=Array.isArray(r)?r[0]:r;if(!d?.id)throw Error('DEVICE_NOT_AVAILABLE');return device={id:d.id,publicJwk:rec.publicJwk,privateKey}}async function wrapFor(publicJwk,key){const p=await crypto.subtle.importKey('jwk',publicJwk,{name:'RSA-OAEP',hash:'SHA-256'},true,['encrypt']);return new Uint8Array(await crypto.subtle.encrypt({name:'RSA-OAEP'},p,key))}async function addEnvelope(conversationId,d,key,version){try{await rest('conversation_key_envelopes','',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({conversation_id:conversationId,device_id:d.id,key_version:version,algorithm:'RSA-OAEP-2048-SHA256+AES-256-GCM',wrapped_key:b64(await wrapFor(d.publicJwk,key))})})}catch(e){const m=String(e.message||e).toLowerCase();if(String(e.code)!=='23505'&&!m.includes('duplicate'))throw e}}async function ensureKey(conversationId){if(!conversationId||fixing)return;fixing=true;try{session=readSession();user=session?.user||null;if(!user)throw Error('AUTH_REQUIRED');const d=await getDevice(),q='select=wrapped_key,key_version&conversation_id=eq.'+encodeURIComponent(conversationId)+'&device_id=eq.'+encodeURIComponent(d.id)+'&revoked_at=is.null&order=key_version.desc&limit=1',existing=(await rest('conversation_key_envelopes',q))?.[0];if(existing)return;const rr=await rpc('start_conversation_key_epoch',{p_conversation_id:conversationId,p_device_id:d.id}),version=Number(Array.isArray(rr)?(rr[0]?.key_version??rr[0]):(rr?.key_version??rr));if(!Number.isInteger(version)||version<1)throw Error('KEY_EPOCH_INVALID');const key=crypto.getRandomValues(new Uint8Array(32)),members=await rest('conversation_members','select=user_id&conversation_id=eq.'+encodeURIComponent(conversationId));for(const uid of [...new Set((members||[]).map(x=>x.user_id))]){const ds=await rest('user_devices','select=id,identity_public_key&user_id=eq.'+encodeURIComponent(uid)+'&device_label=e
