<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090d17"><title>WhatsAfrica — Mot de passe oublié</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>:root{--bg:#090d17;--panel:#111827;--text:#f8f5eb;--muted:#98a5bb;--gold:#f2b84b;--teal:#22c7a3;--line:#26334c}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 75% 12%,#22c7a31c,transparent 38%),var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:20px}.card{width:min(480px,100%);background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 25px 80px #0008}h1{font:700 40px Georgia,serif;margin:0 0 8px}h1 b{color:var(--gold)}h2{margin:18px 0 8px}p{color:var(--muted);line-height:1.6}label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin:16px 0 6px}input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#0b1220;color:var(--text);outline:none}input:focus{border-color:var(--teal);box-shadow:0 0 0 3px #22c7a322}.btn{width:100%;border:0;border-radius:12px;padding:13px;margin-top:16px;background:var(--gold);color:#171208;font-weight:900;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.secondary{background:transparent;color:var(--text);border:1px solid var(--line)}.msg{min-height:24px;margin-top:14px;font-size:13px}.ok{color:var(--teal)}.err{color:#ff8f8f}.back{display:inline-block;margin-top:18px;color:var(--muted);text-decoration:none}</style></head><body><main class="card"><h1>Whats<b>Africa</b></h1><h2>Mot de passe oublié</h2><p>Saisissez l’adresse e-mail de votre compte. Nous vous enverrons un lien sécurisé pour créer un nouveau mot de passe.</p><form id="form"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required placeholder="vous@exemple.com"><button class="btn" id="submit" type="submit">Envoyer le lien de réinitialisation</button></form><p id="msg" class="msg" role="alert" aria-live="polite"></p><a class="back" href="/auth">← Retour à la connexion</a></main><script>const db=window.supabase.createClient('https://dzifpwqrqnvssfhwjccj.supabase.co','sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV');const $=id=>document.getElementById(id);const next=new URLSearchParams(location.search).get('next');const safeNext=next&&next.startsWith('/')&&!next.startsWith('//')?next:'/dashboard';function msg(t,ok=false){$('msg').textContent=t;$('msg').className='msg '+(ok?'ok':'err')}$('form').onsubmit=async e=>{e.preventDefault();const email=$('email').value.trim();if(!email)return msg('Saisissez votre e-mail.');$('submit').disabled=true;msg('Envoi du lien sécurisé…',true);try{const r=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/reset-password?next='+encodeURIComponent(safeNext)});if(r.error)throw r.error;msg('Le lien de réinitialisation a été envoyé si cette adresse correspond à un compte. Vérifiez votre boîte de réception et vos spams.',true);$('submit').textContent='E-mail envoyé';}catch(e){msg(e.message||'Impossible d’envoyer le lien.')}finally{if($('submit').textContent!=='E-mail envoyé')$('submit').disabled=false}};$('email').focus();</script></body></html>
