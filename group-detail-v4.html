<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#075e54"><title>Communauté — WASSAFRICA</title><style>:root{--g:#075e54;--a:#0b9489;--bg:#f6f8f5;--line:#dfe7e1;--ink:#172019;--muted:#68746e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,sans-serif}.wrap{max-width:900px;margin:auto;padding:10px}.top{background:var(--g);color:#fff}.topin{display:flex;align-items:center;justify-content:space-between}.brand{color:#fff;text-decoration:none;font-size:23px;font-weight:950}.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;font-weight:800;cursor:pointer;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}.primary{background:var(--a);border-color:var(--a);color:#fff}.card,.post{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}.hero{padding:0;overflow:hidden}.hero img{width:100%;height:210px;object-fit:cover}.body{padding:18px}.muted,time{color:var(--muted)}.actions,.reacts{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.search input,textarea{width:100%;padding:12px;border:1px solid #b8d7d2;border-radius:12px;font:inherit}.search{margin:12px 0}.member,.comment{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #e5ebe7}.avatar{width:42px;height:42px;border-radius:50%;background:#dcebe8;display:grid;place-items:center;color:var(--g);font-weight:900;background-size:cover;background-position:center;flex:none}.sm{width:34px;height:34px;font-size:12px}.grow{flex:1;min-width:0}.name{font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta,time{font-size:12px}.post{padding:0;overflow:hidden}.posthead{display:flex;gap:9px;align-items:center;padding:14px 16px 8px}.postbody{padding:6px 16px 12px;white-space:pre-wrap;line-height:1.5}.comments{border-top </head><body><header class="top"><div class="wrap topin"><a class="brand" href="/">WASSAFRICA</a><div><button id="bell" class="btn">🔔 <span id="badge" class="badge" style="display:none">0</span></button> <a class="btn" href="/groups">← Communautés</a></div></div></header><div id="notif" class="notif hidden"><div style="display:flex;justify-content:space-between"><b>Notifications</b><button id="read" class="btn">Tout lire</button></div><div id="notifs" class="muted">Chargement…</div></div><main class="wrap"><section id="hero" class="card hero"><div class="body">Chargement…</div></section><section class="card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><div><h2 style="margin:0">👥 Membres</h2><div class="muted">Messagerie privée directe</div></div><a class="btn primary" href="/inbox">💬 Discussions</a></div><div class="search"><input id="filter" placeholder="🔎 Rechercher un membre…"></div><div id="members">Chargement…</div></section><section id="composer" class="card" style="display:none"><h2 style="margin:0 0 8px">📝 Nouveau sujet</h2><textarea id="body" maxlength="4000" placeholder="De quoi voulez-vous parler ?"></textarea><div class="actions"><button id="publish" class="btn primary">Publier</button><button id="cancel" class="btn">Annuler</button></div></section><section><div style="display:flex;justify-content:space-between;align-items:center;margin:18px 2px 8px"><div><h2 style="margin:0">💬 Conversation publique</h2><div class="muted">Sujets, réactions et commentaires.</div></div><button id="new" class="btn primary">＋ Sujet</button></div><div id="posts">Chargement…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(async()=>{const db=supabase.createClient('https://dzifpwqrqnvssfhwjccj.supabase.co','sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV'),$=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m])),gid=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||''),icons={like:'👍',love:'❤️',laugh:'😂',support:'👏'};let me=(await db.auth.getSession()).data.session?.user||null,isMember=false,profiles=new Map(),members=[];const pname=id=>{const p=profiles.get(id)||{};return p.public_display_name||p.display_name||[p.first_name,p.last_name].filter(Boolean).join(' ')||'Membre WhatsAfrica'},av=(id,sm=false)=>{const p=profiles.get(id)||{},a=p.avatar_url||p.profile_photo_url||p.profile_image_url||'',n=pname(id);return `<div class="avatar ${sm?'sm':''}" ${a?`style="background-image:url('${esc(a)}')"`:''}>${a?'':esc(n[0]?.toUpperCase()||'W')}</div>`};function msg(t,e=false){$('hero').querySelector('.status')?.remove();const d=document.createElement('div');d.className='status muted';d.textContent=t;$('hero').querySelector('.body').append(d)}async function init(){const g=await db.from('groups').select('id,name,description,is_business,image_url,image_alt').eq('id',gid).maybeSingle();if(g.error||!g.data)throw 0;const x=g.data;$('hero').innerHTML=`${x.image_url?`<img src="${esc(x.image_url)}" alt="${esc(x.image_alt||x.name)}">`:''}<div class="body"><div class="muted">${x.is_business?'💼 Communauté business':'👥 Communauté'}</div><h1 style="margin:6px 0">${esc(x.name)}</h1><p class="muted">${esc(x.description||'Un espace WhatsAfrica pour échanger ensemble.')}</p><div class="actions"><button id="join" class="btn primary">Rejoindre</button><button id="share" class="btn">↗️ Partager</button></div><div class="status muted"></div></div>`;if(me){const m=await db.from('group_members').select('user_id').eq('group_id',gid).eq('user_id',me.id).maybeSingle();isMember=!!m.data}if(isMember){$('join').textContent='✓ Vous êtes membre';$('join').disabled=true}$('join').onclick=async()=>{if(!me)return location.href='/auth?next='+encodeURIComponent(location.pathname);const r=await db.from('group_members').insert({group_id:gid,user_id:me.id,role:'member'});if(r.error&&!String(r.error.message).toLowerCase().includes('duplicate'))return msg(r.error.message,true);isMember=true;$('join').textContent='✓ Vous êtes membre';$('join').disabled=true;await loadAll();msg('✓ Vous avez rejoint la communauté')};$('share').onclick=async()=>{try{navigator.share?await navigator.share({title:x.name,url:location.href}):await navigator.clipboard.writeText(location.href)}catch(e){}};await loadAll();subscribe()}async function loadAll(){await loadMembers();await loadPosts();await notifications()}async function loadMembers(){if(!me){$('members').innerHTML='<div class="muted">Connectez-vous pour voir les membres.</div>';return}const r=await db.from('group_members').select('user_id,role').eq('group_id',gid).order('created_at').limit(500);if(r.error)return $('members').innerHTML='<div class="muted">Membres indisponibles.</div>';const ids=(r.data||[]).map(x=>x.user_id);const p=ids.length?await db.from('profiles').select('user_id,display_name,public_display_name,first_name,last_name,country,avatar_url,profile_photo_url,profile_image_url').in('user_id',ids):{data:[]};(p.data||[]).forEach(x=>profiles.set(x.user_id,x));members=r.data||[];renderMembers()}function renderMembers(){const q=$('filter').value.toLowerCase();const list=members.filter(m=>pname(m.user_id).toLowerCase().includes(q));$('members').innerHTML=list.length?list.map(m=>`<div class="member">${av(m.user_id)}<div class="grow"><div class="name">${esc(pname(m.user_id))} ${m.role==='owner'?'👑':''}</div><div class="meta">${esc((profiles.get(m.user_id)||{}).country||'Afrique')}</div></div>${m.user_id===me?.id?'':`<button class="btn primary" data-chat="${m.user_id}">💬</button>`}</div>`).join(''):'<div class="muted">Aucun membre trouvé.</div>';document.querySelectorAll('[data-chat]').forEach(b=>b.onclick=async()=>{const r=await db.rpc('start_direct_conversation_by_user_id',{p_user_id:b.dataset.chat});if(!r.error&&r.data?.[0]?.conversation_id)location.href='/inbox?conversation='+r.data[0].conversation_id})}$('filter').oninput=renderMembers;$('new').onclick=()=>{if(!me)return location.href='/auth?next='+encodeURIComponent(location.pathname);if(!isMember)return msg('Rejoignez la communauté pour publier',true);$('composer').style.display='block';$('new').style.display='none';$('body').focus()};$('cancel').onclick=()=>{$('composer').style.display='none';$('new').style.display='inline-flex'};$('publish').onclick=async()=>{const text=$('body').value.trim();if(!text)return;const r=await db.from('group_posts').insert({group_id:gid,author_id:me.id,body:text});if(r.error)return msg(r.error.message,true);$('body').value='';$('composer').style.display='none';$('new').style.display='inline-flex';await loadPosts()};async function loadPosts(){const pr=await db.from('group_posts').select('id,body,created_at,author_id').eq('group_id',gid).order('created_at',{ascending:false}).limit(50);if(pr.error)return $('posts').innerHTML='<div class="card">Conversation indisponible.</div>';const posts=pr.data||[],ids=posts.map(p=>p.id),comments=ids.length?(await db.from('group_comments').select('id,post_id,body,created_at,author_id').in('post_id',ids).order('created_at')).data||[]:[],allUsers=[...new Set([...posts.map(p=>p.author_id),...comments.map(c=>c.author_id)])];if(allUsers.length){const p=await db.from('profiles').select('user_id,display_name,public_display_name,first_name,last_name,avatar_url,profile_photo_url,profile_image_url').in('user_id',allUsers);(p.data||[]).forEach(x=>profiles.set(x.user_id,x))}const targets=[...ids,...comments.map(c=>c.id)],reactions=targets.length?(await db.from('community_reactions').select('target_type,target_id,user_id,reaction_type').in('target_id',targets)).data||:[];const by=new Map();reactions.forEach(r=>{const k=r.target_type+':'+r.target_id;if(!by.has(k))by.set(k,[]);by.get(k).push(r)});$('posts').innerHTML=posts.length?posts.map(p=>postHtml(p,comments.filter(c=>c.post_id===p.id),by)).join(''):'<div class="card muted">Aucun sujet pour le moment. Soyez le premier 👋</div>';document.querySelectorAll('[data-react]').forEach(b=>b.onclick=()=>react(b.dataset.kind,b.dataset.id,b.dataset.type));document.querySelectorAll('[data-send]').forEach(b=>b.onclick=()=>comment(b.dataset.send))}function reacts(kind,id,by){const a=by.get(kind+':'+id)||[],mine=a.find(x=>x.user_id===me?.id)?.reaction_type;return `<div class="reacts">${Object.entries(icons).map(([k,e])=>`<button class="react ${mine===k?'active':''}" data-react="1" data-kind="${kind}" data-id="${id}" data-type="${k}">${e} ${a.filter(x=>x.reaction_type===k).length||''}</button>`).join('')}</div>`}function postHtml(p,cs,by){return `<article class="post"><div class="posthead">${av(p.author_id,true)}<div class="grow"><div class="name">${esc(pname(p.author_id))}</div><time>${new Date(p.created_at).toLocaleString('fr-FR')}</time></div></div><div class="postbody">${esc(p.body)}</div><div style="padding:0 16px 10px">${reacts('post',p.id,by)}</div><div class="comments"><div class="meta">💬 ${cs.length} commentaire${cs.length>1?'s':''}</div>${cs.map(c=>`<div class="comment">${av(c.author_id,true)}<div class="grow"><div class="bubble"><b>${esc(pname(c.author_id))}</b><br>${esc(c.body)}</div><time>${new Date(c.created_at).toLocaleString('fr-FR')}</time>${reacts('comment',c.id,by)}</div></div>`).join('')}${isMember?`<div style="display:flex;gap:7px;margin-top:8px"><textarea data-input="${p.id}" rows="1" maxlength="2000" placeholder="Écrire un commentaire…"></textarea><button class="btn primary" data-send="${p.id}">Envoyer</button></div>`:'<div class="muted" style="margin-top:8px">Rejoignez la communauté pour commenter et réagir.</div>'}</div></article>`}async function react(kind,id,type){if(!me)return location.href='/auth?next='+encodeURIComponent(location.pathname);if(!isMember)return msg('Rejoignez la communauté pour réagir',true);const q=await db.from('community_reactions').select('id,reaction_type').eq('target_type',kind).eq('target_id',id).eq('user_id',me.id).maybeSingle();if(q.data){if(q.data.reaction_type===type)await db.from('community_reactions').delete().eq('id',q.data.id);else{await db.from('community_reactions').delete().eq('id',q.data.id);await db.from('community_reactions').insert({target_type:kind,target_id:id,user_id:me.id,reaction_type:type})}}else await db.from('community_reactions').insert({target_type:kind,target_id:id,user_id:me.id,reaction_type:type});await loadPosts()}async function comment(post){const input=document.querySelector(`[data-input="${CSS.escape(post)}"]`),text=input?.value.trim();if(!text)return;const r=await db.from('group_comments').insert({post_id:post,author_id:me.id,body:text});if(r.error)return msg(r.error.message,true);input.value='';await loadPosts()}async function notifications(){if(!me)return $('notifs').innerHTML='<div class="muted">Connectez-vous pour voir vos notifications.</div>';const r=await db.from('notifications').select('id,title,body,read_at,created_at').order('created_at',{ascending:false}).limit(40);if(r.error)return;const a=r.data||[],u=a.filter(x=>!x.read_at).length;$('badge').style.display=u?'inline':'none';$('badge').textContent=u>99?'99+':u;$('notifs').innerHTML=a.length?a.map(n=>`<div class="n ${n.read_at?'':'unread'}"><b>${esc(n.title)}</b><div class="muted">${esc(n.body||'')}</div><time>${new Date(n.created_at).toLocaleString('fr-FR')}</time></div>`).join(''):'<div class="muted">Aucune notification.</div>'}$('bell').onclick=()=>{$('notif').classList.toggle('hidden');notifications()};$('read').onclick=async()=>{await db.from('notifications').update({read_at:new Date().toISOString()}).eq('user_id',me.id).is('read_at',null);notifications()};function subscribe(){db.channel('community-v4-'+gid).on('postgres_changes',{event:'*',schema:'public',table:'group_posts',filter:'group_id=eq.'+gid},loadPosts).on('postgres_changes',{event:'*',schema:'public',table:'group_comments'},loadPosts).on('postgres_changes',{event:'*',schema:'public',table:'community_reactions'},loadPosts).subscribe();if(me)db.channel('notif-'+me.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:'user_id=eq.'+me.id},notifications).subscribe()}init().catch(()=>{$('hero').innerHTML='<div class="body"><b>Communauté introuvable.</b><p><a class="btn primary" href="/groups">Retour</a></p></div>'})})()</script></body></html>
