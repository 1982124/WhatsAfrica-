<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173c22"><title>Service — WhatsAfrica</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#f7f2e9;--surface:#fffdf9;--ink:#20242b;--muted:#77766f;--line:#e5ddd1;--green:#287b36;--gold:#e5aa2f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui}.wrap{max-width:920px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:22px;font-weight:950;text-decoration:none;color:var(--ink)}.brand b{color:var(--gold)}.btn{display:inline-flex;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);text-decoration:none;font-weight:850}.primary{background:var(--green);border-color:var(--green);color:#fff}.card{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:24px;overflow:hidden}.cover{min-height:300px;background:linear-gradient(135deg,#dfe9d9,#f2d58e);display:grid;place-items:center;font-size:75px}.cover img{width:100%;height:100%;min-height:300px;object-fit:cover}.body{padding:24px}.pill{font-size:11px;font-weight:900;color:var(--green)}h1{font:800 clamp(34px,6vw,52px)/1.05 Georgia,serif;margin:10px 0}.muted{color:var(--muted);line-height:1.6}.price{font-size:23px;font-weight:950;margin:18px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.notice{padding:13px;border:1px solid var(--line);border-radius:14px;background:#f4eee3;margin-top:14px}.empty{margin-top:30px;padding:35px;text-align:center;border:1px dashed var(--line);border-radius:18px}@media(max-width:560px){.actions .btn{width:100%;justify-content:center}}</style><script src="/brand-normalizer.js"></script>
</head><body><main class="wrap"><header class="top"><a class="brand" href="/">Whats<b>Africa</b></a><a class="btn" href="/market">← Marché</a></header><section id="app" class="empty">Chargement du service…</section></main><script>const db=supabase.createClient('https://dzifpwqrqnvssfhwjccj.supabase.co','sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV'),esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));const id=new URLSearchParams(location.search).get('id');function money(v,c){return new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0}).format(Number(v||0))+' '+(c||'XOF')}async function load(){if(!id)throw Error();const r=await db.from('marketplace_services').select('id,title,description,category,price,currency,delivery_mode,seller_id,metadata,status').eq('id',id).eq('status','published').maybeSingle();if(r.error)throw r.error;if(!r.data)throw Error();const s=r.data;const b=await db.from('businesses').select('id,name,city,country,phone,slug').eq('owner_id',s.seller_id).order('is_personal',{ascending:false}).limit(1).maybeSingle();const pay=await db.from('external_payment_links').select('provider,label,url').eq('service_id',s.id).eq('is_active',true).order('updated_at',{ascending:false}).limit(1).maybeSingle();const biz=b.data||{};const cover=s.metadata?.cover_url?`<img src="${esc(s.metadata.cover_url)}" alt="${esc(s.title)}">`:'🧰';const contact=biz.phone?`/contact-seller?phone=${encodeURIComponent(biz.phone)}&name=${encodeURIComponent(biz.name||'le vendeur')}`:'/inbox';$('app').className='card';$('app').innerHTML=`<div class="cover">${cover}</div><div class="body"><span class="pill">🧰 SERVICE</span><h1>${esc(s.title)}</h1><div class="muted">${esc(biz.name||'Prestataire WhatsAfrica')}${biz.city?' · '+esc(biz.city):''}${biz.country?' · '+esc(biz.country):''}</div><p class="muted">${esc(s.description||'Contactez le prestataire pour en savoir plus.')}</p>${s.category?`<div class="muted">Catégorie : ${esc(s.category)}</div>`:''}${s.delivery_mode?`<div class="muted">Mode : ${esc(s.delivery_mode)}</div>`:''}<div class="price">${money(s.price,s.currency)}</div>${pay.data?`<div class="notice">Paiement externe disponible via ${esc(pay.data.provider||'partenaire')}.</div>`:'<div class="notice">Le paiement externe n’est pas encore configuré. Vous pouvez contacter le prestataire.</div>'}<div class="actions">${pay.data?`<a class="btn primary" href="${esc(pay.data.url)}" target="_blank" rel="noopener noreferrer">🛒 ${esc(pay.data.label||'Payer maintenant')}</a>`:''}<a class="btn" href="${esc(contact)}">💬 Contacter le vendeur</a><button id="share" class="btn">↗️ Partager</button><a class="btn" href="/market">← Continuer le marché</a></div></div>`;$('share').onclick=async()=>{try{if(navigator.share)await navigator.share({title:s.title,text:`${s.title} — découvert sur WhatsAfrica`,url:location.href});else{await navigator.clipboard.writeText(location.href);$('share').textContent='✓ Lien copié'}}catch(e){}}}load().catch(()=>{$('app').innerHTML='<div class="empty"><b>Service introuvable ou non publié.</b><br><br><a class="btn primary" href="/market">Retour au Marché</a></div>'})</script></body></html>
