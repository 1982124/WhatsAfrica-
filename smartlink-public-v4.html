<!doctype html>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/brand-normalizer.js"></script><script src="/brand-observer.js"></script>
<style>
:root{--forest:#173b2a;--forest2:#214c38;--gold:#d9a441;--cream:#f7f4ec;--paper:#fff;--ink:#18201b;--muted:#69746e;--line:#dfe5df;--soft:#eef2ed;--shadow:0 16px 45px rgba(23,59,42,.08)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(1080px,100%);margin:auto;padding:0 16px}.nav{position:sticky;top:0;z-index:30;background:#f7f4ecef;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.navin{min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:21px;font-weight:950;letter-spacing:-.6px;text-decoration:none;color:var(--forest)}.nav .btn{white-space:nowrap}.btn{min-height:46px;padding:10px 14px;border-radius:13px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-weight:900;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer}.btn.primary{background:var(--gold);border-color:var(--gold);color:#211a0b}.btn.dark{background:var(--forest);border-color:var(--forest);color:#fff}.hero{margin:18px 0 34px;background:var(--forest);color:#fff;border-radius:28px;overflow:hidden;box-shadow:var(--shadow);display:grid;grid-template-columns:1.05fr .95fr;min-height:460px}.heroCopy{padding:42px;display:flex;flex-direction:column;justify-content:center}.eyebrow{font-size:11px;font-weight:950;letter-spacing:1.8px;text-transform:uppercase;color:#eadbbd}.hero h1{font:800 clamp(44px,6vw,72px)/.94 Georgia,serif;letter-spacing:-3px;margin:13px 0 17px}.hero h1 span{color:#e8c979}.lead{font-size:18px;line-height:1.55;color:#e4ece7;max-width:600px}.heroActions{display:flex;flex-wrap:wrap;gap:9px;margin-top:23px}.heroArt{min-height:100%;background:#234b38;display:grid;place-items:center;padding:30px}.art{width:min(330px,100%);aspect-ratio:1;border-radius:50%;border:1px solid #ffffff22;display:grid;place-items:center;position:relative}.art:before,.art:after{content:"";position:absolute;border:1px solid #ffffff22;border-radius:50%}.art:before{inset:13%}.art:after{inset:27%}.art svg{width:48%;position:relative;z-index:2}.trust{display:flex;gap:15px;flex-wrap:wrap;margin-top:20px;color:#d6e2db;font-size:12px}.section{margin:44px 0}.sectionHead{margin-bottom:16px}.section h2{font:800 clamp(29px,4vw,42px)/1.05 Georgia,serif;margin:0;letter-spacing:-1px}.sectionLead{margin:7px 0 0;color:var(--muted);max-width:720px}.valueGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.value{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 8px 26px rgba(23,59,42,.04)}.valueIcon{width:54px;height:54px;border-radius:16px;background:var(--soft);display:grid;place-items:center;color:var(--forest);margin-bottom:14px}.valueIcon svg{width:34px;height:34px}.value h3{margin:0 0 6px;font-size:19px}.value p{margin:0;color:var(--muted)}.offerGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 8px 26px rgba(23,59,42,.04)}.media{height:220px;background:var(--soft);display:grid;place-items:center;font-size:50px}.media img,.media video{width:100%;height:100%;object-fit:cover}.body{padding:17px}.tag{display:inline-flex;padding:5px 8px;border-radius:999px;background:var(--soft);color:var(--forest);font-size:10px;font-weight:950;letter-spacing:.5px}.card h3{font-size:19px;line-height:1.2;margin:9px 0 6px}.mini{color:var(--muted);font-size:13px;margin:0}.price{font-weight:950;font-size:19px;color:var(--forest);margin:10px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions .btn{flex:1;min-width:120px}.contact{display:grid;grid-template-columns:1fr 1fr;gap:13px}.contactCard,.shareCard{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:23px}.contactCard h2,.shareCard h2{font:800 29px/1.1 Georgia,serif;margin:8px 0}.contactMeta{color:var(--muted);font-size:13px}.shareCard{background:var(--forest);color:#fff;border-color:var(--forest)}.shareCard p{color:#dbe6df}.shareCard .btn{background:var(--gold);border-color:var(--gold);color:#211a0b}.empty{padding:28px;text-align:center;border:1px dashed var(--line);border-radius:18px;color:var(--muted);background:var(--paper)}.footer{text-align:center;color:var(--muted);font-size:12px;padding:28px 0 70px}.floating{position:fixed;right:16px;bottom:16px;z-index:40;box-shadow:0 12px 30px rgba(23,59,42,.18)}
@media(max-width:820px){.hero{grid-template-columns:1fr}.heroArt{min-height:270px}.valueGrid,.offerGrid{grid-template-columns:1fr 1fr}.contact{grid-template-columns:1fr}}
@media(max-width:560px){.wrap{padding:0 12px}.navin{min-height:58px}.nav .btn{font-size:12px;padding:9px 10px}.hero{border-radius:22px;margin-top:12px}.heroCopy{padding:29px 21px}.hero h1{font-size:48px;letter-spacing:-2.3px}.lead{font-size:16px}.heroActions{display:grid}.heroActions .btn{width:100%}.heroArt{min-height:230px;padding:20px}.art{max-width:210px}.valueGrid,.offerGrid{grid-template-columns:1fr}.section{margin:36px 0}.contactCard,.shareCard{padding:20px}.floating{left:12px;right:12px;bottom:12px;width:auto}}
</style></head>
<body><header class="nav"><div class="wrap navin"><a class="brand" href="/">WASSAFRICA</a><a class="btn dark" href="/auth?next=/smartlink">Créer mon Smart Link</a></div></header>
<main class="wrap" id="page"><div class="empty">Ouverture…</div></main><footer class="wrap footer">WASSAFRICA — Connecter l’Afrique. Ouvrir le monde.</footer><button class="btn primary floating" id="share">↗ Partager</button>
<script>
'use strict';const db=window.supabase.createClient('https://dzifpwqrqnvssfhwjccj.supabase.co','sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV');const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const safe=v=>{try{const u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:null}catch{return null}};const money=(v,c)=>v==null?'Prix sur demande':new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0}).format(Number(v||0))+' '+(c||'XOF');const slug=decodeURIComponent(location.pathname.replace(/^\/+/, '').split('/')[0]||'');let link=null,business=null,products=[],services=[];
async function track(type,entityType=null,entityId=null,metadata={}){if(!link?.id)return;try{await db.from('smart_link_events').insert({smart_link_id:link.id,event_type:type,entity_type:entityType,entity_id:entityId,metadata})}catch{}}
function icon(kind){if(kind==='talk')return '<svg viewBox="0 0 80 80" fill="none"><path d="M14 18h52v38H35L21 68l2-12h-9z" fill="#fff"/><path d="M25 32h30M25 43h20" stroke="#173b2a" stroke-width="5" stroke-linecap="round"/></svg>';if(kind==='sell')return '<svg viewBox="0 0 80 80" fill="none"><path d="M13 28h54l-5 39H18z" fill="#fff"/><path d="M22 28l7-14h22l7 14" stroke="#d9a441" stroke-width="6"/><path d="M26 43h28" stroke="#173b2a" stroke-width="5" stroke-linecap="round"/></svg>';return '<svg viewBox="0 0 80 80" fill="none"><circle cx="36" cy="36" r="21" stroke="#fff" stroke-width="7"/><path d="m52 52 14 14" stroke="#d9a441" stroke-width="7" stroke-linecap="round"/></svg>'}
function product(p){const im=safe(p.image_url),v=safe(p.video_url);return '<article class="card"><div class="media">'+(v?'<video controls preload="metadata" poster="'+esc(im||'')+'" src="'+esc(v)+'"></video>':im?'<img loading="lazy" src="'+esc(im)+'" alt="'+esc(p.title)+'">':'🛍️')+'</div><div class="body"><span class="tag">'+(p.product_type==='digital'?'PRODUIT DIGITAL':'PRODUIT')+'</span><h3>'+esc(p.title)+'</h3><p class="mini">'+esc(p.description||'Une offre présentée sur WASSAFRICA.')+'</p><div class="price">'+money(p.price,p.currency)+'</div><div class="actions"><a class="btn primary" href="/auth?next='+encodeURIComponent('/inbox?business='+business.id+'&product='+p.id)+'" data-event="product_contact" data-id="'+esc(p.id)+'">💬 Parler</a><button class="btn" data-share-item="'+esc(p.id)+'">↗ Partager</button></div></div></article>'}
function service(s){const m=s.metadata&&typeof s.metadata==='object'?s.metadata:{};const im=safe(m.image_url||m.image);return '<article class="card"><div class="media">'+(im?'<img loading="lazy" src="'+esc(im)+'" alt="'+esc(s.title)+'">':'🧰')+'</div><div class="body"><span class="tag">SERVICE</span><h3>'+esc(s.title)+'</h3><p class="mini">'+esc(s.description||'Une solution proposée par cette activité.')+'</p>'+(s.price!=null?'<div class="price">'+money(s.price,s.currency)+'</div>':'')+'<div class="actions"><a class="btn primary" href="/auth?next='+encodeURIComponent('/inbox?business='+business.id+'&service='+s.id)+'" data-event="service_contact" data-id="'+esc(s.id)+'">💬 Parler</a></div></div></article>'}
function share(){track('activity_shared','smart_link',link?.id);const text='Découvrez '+(business?.name||'cette activité')+' sur WASSAFRICA.';try{if(navigator.share)navigator.share({title:business?.name||'WASSAFRICA',text,url:location.href});else navigator.clipboard.writeText(text+'\n'+location.href).then(()=>alert('Lien copié.'))}catch{}}
function contact(mode){track(mode==='message'?'message_click':mode==='audio'?'phone_call_click':'video_call_click','business',business?.id);location.href=mode==='message'?'/auth?next='+encodeURIComponent('/inbox?business='+business.id):'/calls?business='+encodeURIComponent(business.id)}
function render(){const name=business?.name||link?.title||'Votre activité';document.title=name+' — WASSAFRICA';const cover=safe(business?.cover_image_url||business?.logo_url);$('page').innerHTML='<section class="hero"><div class="heroCopy"><div class="eyebrow">WASSAFRICA · SMART LINK</div><h1>Découvrez.<br><span>Parlez.</span><br>Faites affaire.</h1><p class="lead">'+esc(business?.description||link?.description||'Une vitrine simple pour présenter votre activité, vos offres et ouvrir une conversation directe.')+'</p><div class="heroActions"><a class="btn primary" href="#offers">🛍️ Voir les offres</a><button class="btn" onclick="share()">↗ Partager cette activité</button></div><div class="trust"><span>✓ Une vitrine claire</span><span>✓ Conversation directe</span><span>✓ Pensé pour l’Afrique</span></div></div><div class="heroArt">'+(cover?'<img src="'+esc(cover)+'" alt="" style="width:100%;height:100%;object-fit:cover">':'<div class="art">'+icon('discover')+'</div>')+'</div></section><section class="section"><div class="sectionHead"><h2>Ce que vous pouvez faire ici</h2><p class="sectionLead">Un parcours court : voir, comprendre, parler, puis revenir quand vous en avez besoin.</p></div><div class="valueGrid"><article class="value"><div class="valueIcon">'+icon('discover')+'</div><h3>Être découvert</h3><p>Une présentation claire de l’activité, du lieu et de ce qui est proposé.</p></article><article class="value"><div class="valueIcon">'+icon('talk')+'</div><h3>Parler</h3><p>Posez une question et passez directement dans une conversation WASSAFRICA.</p></article><article class="value"><div class="valueIcon">'+icon('sell')+'</div><h3>Faire avancer l’affaire</h3><p>Consultez les offres, demandez un renseignement et poursuivez la relation.</p></article></div></section><section class="section" id="offers"><div class="sectionHead"><h2>Offres</h2><p class="sectionLead">Produits et services publiés par cette activité.</p></div><div class="offerGrid">'+(products.length?products.map(product).join(''):'<div class="empty">Aucun produit publié pour le moment.</div>')+(services.length?services.map(service).join(''):'')+'</div></section><section class="section"><div class="contact"><article class="contactCard"><div class="eyebrow" style="color:var(--forest)">CONTACT</div><h2>'+esc(name)+'</h2><div class="contactMeta">'+esc([business?.city,business?.country].filter(Boolean).join(' · ')||'Activité sur WASSAFRICA')+'</div><div class="actions"><button class="btn primary" onclick="contact(\'message\')">💬 Parler</button><button class="btn" onclick="contact(\'audio\')">📞 Audio</button><button class="btn" onclick="contact(\'video\')">📹 Vidéo</button></div></article><article class="shareCard"><div class="eyebrow">LA BOUCLE</div><h2>Découvrir → parler → revenir.</h2><p>Le Smart Link n’est pas seulement une page. Il sert de point d’entrée vers une relation réelle avec l’activité.</p><button class="btn" onclick="share()">↗ Recommander</button></article></div></section>';document.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>track(b.dataset.event,b.dataset.event.includes('product')?'product':'service',b.dataset.id));document.querySelectorAll('[data-share-item]').forEach(b=>b.onclick=()=>{const item=[...products,...services].find(x=>x.id===b.dataset.shareItem);const text='Découvrez '+(item?.title||'cette offre')+' sur WASSAFRICA.';try{if(navigator.share)navigator.share({title:item?.title||'WASSAFRICA',text,url:location.href});else navigator.clipboard.writeText(text+'\n'+location.href).then(()=>alert('Lien copié.'))}catch{}})}
async function load(){if(!slug)return fail();const r=await db.from('smart_links').select('id,business_id,owner_id,slug,title,description,is_public').eq('slug',slug).eq('is_public',true).maybeSingle();if(r.error||!r.data)return fail();link=r.data;const b=link.business_id?await db.from('businesses').select('id,name,description,country,city,logo_url,cover_image_url,phone').eq('id',link.business_id).maybeSingle():null;business=b?.data||{id:link.business_id,name:link.title,description:link.description};if(link.business_id){const [p,s]=await Promise.all([db.from('products').select('id,title,description,price,currency,image_url,video_url,product_type').eq('business_id',link.business_id).eq('is_published',true).order('created_at',{ascending:false}).limit(60),db.from('services').select('id,title,description,price,currency,metadata').eq('business_id',link.business_id).eq('is_published',true).order('created_at',{ascending:false}).limit(60)]);products=p.data||[];services=s.data||[]}await track('smart_link_opened','smart_link',link.id);render()}function fail(){$('page').innerHTML='<section class="hero"><div class="heroCopy"><div class="eyebrow">WASSAFRICA</div><h1>Votre activité mérite d’être découverte.</h1><p class="lead">Cette vitrine n’est pas disponible pour le moment.</p><div class="heroActions"><a class="btn primary" href="/">Découvrir WASSAFRICA</a><a class="btn" href="/auth?next=/smartlink">Créer mon Smart Link</a></div></div><div class="heroArt"><div class="art">'+icon('discover')+'</div></div></section>'}$('share').onclick=share;load();
</script></body></html>
