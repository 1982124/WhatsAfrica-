<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>WASSAFRICA — Messagerie</title>
<style>
html,body{margin:0;min-height:100%;background:#f4f7f5;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18231d}
.wa-boot{min-height:100vh;display:grid;place-items:center;padding:24px}.wa-boot-card{width:min(560px,100%);padding:28px;border:1px solid #dfe8e3;border-radius:24px;background:#fff;box-shadow:0 20px 60px rgba(24,35,29,.08)}.wa-boot-brand{font-weight:900;font-size:20px}.wa-boot-state{margin-top:8px;color:#68756d}
</style>
</head>
<body>
<div class="wa-boot"><div class="wa-boot-card"><div class="wa-boot-brand">WASSAFRICA · Messagerie</div><div class="wa-boot-state">Chargement de l'interface sécurisée…</div></div></div>
<script>
(async()=>{
  try{
    const r=await fetch('/inbox-v25.html',{cache:'no-store',credentials:'same-origin'});
    if(!r.ok) throw new Error('MESSAGING_SHELL_'+r.status);
    let html=await r.text();
    const modernCss=`
<style id="wa-modern-shell-css">
:root{--wa-ink:#132018;--wa-muted:#718078;--wa-line:#dfe8e3;--wa-surface:#fff;--wa-soft:#f1f6f3;--wa-accent:#e6a336}
body{background:radial-gradient(circle at 15% 0%,#fff 0,#f4f7f5 42%,#eaf0ed 100%)!important}
.wrap{max-width:1380px!important;padding:18px!important}.shell{grid-template-columns:350px minmax(0,1fr)!important;gap:16px!important;min-height:calc(100vh - 36px)!important}
.card{border:1px solid var(--wa-line)!important;border-radius:24px!important;box-shadow:0 16px 50px rgba(19,32,24,.07)!important}
.sidebar{padding:16px!important;background:rgba(255,255,255,.94)!important}.brand{padding:4px 4px 12px!important}.brand h1{font-size:22px!important;letter-spacing:-.02em!important}.brand:after{content:'Privé · sécurisé · temps réel';display:block;font-size:11px;color:var(--wa-muted);position:absolute;margin-top:48px;margin-left:4px}
.new{margin-top:8px!important}.new input,.composer input,.search input{border-color:#d7e3dc!important;background:#f8fbf9!important;border-radius:14px!important}.new button,.composer button{background:var(--wa-accent)!important;border-radius:14px!important}
.search{margin-top:2px!important}.conv{padding:13px!important;border:1px solid transparent}.conv:hover{background:#f0f6f2!important;border-color:#e1ebe5!important}.avatar{width:44px!important;height:44px!important}
.chat{background:rgba(255,255,255,.96)!important}.chat-top{padding:16px 20px!important;min-height:70px!important}.chat-title b{font-size:17px!important}.chat-title span{font-size:12px!important}
.msgs{padding:20px!important}.bubble{border-radius:18px!important;box-shadow:0 4px 16px rgba(20,30,25,.045)!important}
.composer-wrap{padding:14px 16px 12px!important}.notice{font-size:11px!important}
#wa-inbox-media-actions,#wa-modern-media-launcher,#wa-inbox-call-actions{z-index:80!important}
.wa-modern-media-launcher{border:1px solid #d9e5df!important;background:#fff!important;border-radius:16px!important;box-shadow:0 8px 22px rgba(19,32,24,.08)!important}
.wa-call-bar{border-radius:16px!important}
@media(max-width:820px){.wrap{padding:8px!important}.shell{gap:8px!important}.card{border-radius:18px!important}.sidebar{min-height:220px!important}.chat{min-height:78vh!important}}
</style>`;
    const modernBoot=`<script>
(function(){
  try{
    document.title='WASSAFRICA — Messagerie';
    const app=document.getElementById('app');
    const gate=document.getElementById('gate');
    if(app){
      const top=document.createElement('div'); top.id='wa-canonical-banner';
      top.innerHTML='<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;margin-bottom:10px;border:1px solid #dfe8e3;border-radius:16px;background:#f8fbf9;color:#415047;font-size:12px"><b style="color:#17221b">WASSAFRICA</b><span>Messagerie sécurisée · Média · Audio · Vidéo · Temps réel</span></div>';
      app.parentNode.insertBefore(top,app);
    }
    if(gate) gate.setAttribute('data-canonical-shell','true');
  }catch(e){console.warn('[WASSAFRICA] shell enhancement',e)}
})();
<\/script>`;
    html=html.replace('</head>',modernCss+'</head>');
    html=html.replace('<div class="wrap">','<div class="wrap" data-wa-canonical="messaging-final">');
    html=html.replace('</body>',modernBoot+'</body>');
    document.open();document.write(html);document.close();
  }catch(e){
    document.body.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui"><div style="max-width:620px;border:1px solid #e1e8e4;border-radius:20px;padding:24px;background:#fff"><b>WASSAFRICA · Messagerie</b><p>La messagerie n’a pas pu être chargée.</p><button onclick="location.reload()">Réessayer</button></div></div>';
    console.error(e);
  }
})();
</script>
</body>
</html>
