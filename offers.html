<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WASSAFRICA — Mes offres</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f7f2e9;color:#20242b;font:15px system-ui}.wrap{max-width:1050px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:22px;font-weight:950;color:#173d2d;text-decoration:none}.btn{border:1px solid #e5ddd1;background:#fffdf9;border-radius:12px;padding:10px 13px;font-weight:850;cursor:pointer}.primary{background:#287b36;color:#fff;border-color:#287b36}.danger{color:#b42318}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.card{background:#fffdf9;border:1px solid #e5ddd1;border-radius:18px;padding:16px}.cover{width:100%;height:170px;object-fit:cover;border-radius:12px;background:#eee}.meta{color:#72736d;line-height:1.5}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.status{margin-top:14px;padding:11px;border-radius:12px;background:#fff7dd}.ok{color:#287b36}.err{color:#b42318}@media(max-width:700px){.grid{grid-template-columns:1fr}.actions .btn{width:100%}}</style><script src="/wa-media.js"></script></head><body><main class="wrap"><header class="top"><a class="brand" href="/dashboard">WASSAFRICA</a><a class="btn" href="/offer-create">+ Nouvelle offre</a></header><h1>Mes offres</h1><p class="meta">Publication, dépublication, restauration et suppression sécurisée. Une offre dépubliée peut être restaurée sans recréer ses médias.</p><div id="status" class="status">Chargement…</div><section id="grid" class="grid"></section></main><script>const db=supabase.createClient('https://dzifpwqrqnvssfhwjccj.supabase.co','sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV'),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let user;const msg=(t,ok=false)=>{$('status').textContent=t;$('status').className='status '+(ok?'ok':'err')};async function init(){const s=await db.auth.getSession();user=s.data?.session?.user;if(!user){location.href='/auth?next='+encodeURIComponent(location.pathname);return}const b=await db.from('businesses').select('id').eq('owner_id',user.id).maybeSingle();if(b.error)throw b.error;if(!b.data)throw Error('Activité introuvable');const r=await db.from('products').select('id,title,description,price,currency,image_url,product_type,is_published,digital_storage_path,digital_file_name').eq('business_id',b.data.id).order('created_at',{ascending:false});if(r.error)throw r.error;render(r.data||[])}function render(rows){$('grid').innerHTML=rows.length?rows.map(p=>'<article class="card"><img class="cover" src="'+esc(WAMedia.resolve(p.image_url,p.product_type==='digital'?'product':'product'))+'" alt="'+esc(p.title)+'"><h2>'+esc(p.title)+'</h2><div class="meta">'+esc(p.product_type)+' · '+(p.is_published?'Publié':'Brouillon / dépublié')+(p.digital_file_name?' · fichier privé présent':'')+'</div><div class="actions"><a class="btn primary" href="/product/'+encodeURIComponent(p.id)+'">Voir</a><button class="btn" data-action="toggle" data-id="'+p.id+'">'+(p.is_published?'Dépublier':'Restaurer')+'</button><button class="btn danger" data-action="delete" data-id="'+p.id+'">Supprimer</button></div></article>').join(''):'<div class="card">Aucune offre.</div>';document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(b.dataset.action,b.dataset.id))}async function act(action,id){const r=await db.from('products').select('id,title,is_published,digital_storage_path,product_type').eq('id',id).maybeSingle();if(r.error||!r.data)throw Error('Offre introuvable');const p=r.data;if(action==='toggle'){const u=await db.from('products').update({is_published:!p.is_published}).eq('id',id);if(u.error)throw u.error;msg(p.is_published?'Offre dépubliée.':'Offre restaurée et publiée.',true);return init()}if(!confirm('Supprimer définitivement cette offre ? Cette action est impossible si elle possède des droits numériques actifs.'))return;const m=await db.from('product_media').select('storage_bucket,storage_path').eq('product_id',id);if(m.error)throw m.error;const files=(m.data||[]).map(x=>({bucket:x.storage_bucket,path:x.storage_path}));if(p.digital_storage_path)files.push({bucket:'digital-products',path:p.digital_storage_path});const d=await db.from('products').delete().eq('id',id);if(d.error){msg(d.error.message||'Suppression refusée. Pour un produit numérique déjà vendu, dépubliez-le plutôt que de supprimer le produit.',false);return}for(const x of files){try{await db.storage.from(x.bucket).remove([x.path])}catch(_){}}msg('Offre supprimée. Les références DB sont nettoyées; tout objet Storage qui n’a pas pu être supprimé reste volontairement isolé et non bloquant.',true);return init()}document.addEventListener('DOMContentLoaded',()=>init().catch(e=>msg(e.message||'Impossible de charger les offres')));</script></body></html>
