<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout multi-vendeur — WASSAFRICA</title><style>body{margin:0;background:#f7f2e9;color:#20242b;font:15px system-ui}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:#fffdf9;border:1px solid #e5ddd1;border-radius:18px;padding:16px;margin:12px 0}.btn{border:1px solid #e5ddd1;background:#fffdf9;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer;text-decoration:none;color:inherit}.primary{background:#287b36;border-color:#287b36;color:#fff}.muted{color:#777}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.status{font-weight:900}.error{color:#b94a48}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="wrap"><a href="/cart" class="btn">← Panier</a><section id="app" class="card">Chargement…</section></main><script>
const db=supabase.createClient('https://dzifpwqrqnvssfhwjccj.supabase.co','sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.localStorage,storageKey:'whatsafrica-auth'}});
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),money=(v,c)=>new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0}).format(Number(v||0))+' '+(c||'XOF');
const id=new URLSearchParams(location.search).get('id');
async function load(){if(!id){$('app').innerHTML='<div class="error">Checkout introuvable.</div>';return}const s=await db.auth.getSession();if(!s.data.session){location.href='/auth?next='+encodeURIComponent(location.href);return}
const g=await db.from('checkout_groups').select('id,status,payment_status,currency,subtotal,delivery_fee,total,created_at').eq('id',id).single();if(g.error)throw g.error;
const o=await db.from('orders').select('id,business_id,status,payment_status,payment_method,total,currency,tracking_token,businesses(name),order_items(title_snapshot,quantity,line_total)').eq('checkout_group_id',id).order('created_at');
if(o.error)throw o.error;const orders=o.data||[];const pending=orders.filter(x=>x.payment_method!=='cash_on_delivery'&&x.payment_status!=='paid');$('app').innerHTML='<h1>Checkout multi-vendeur</h1><p class="muted">Chaque vendeur possède sa propre sous-commande et son propre paiement. Un paiement réussi ne valide jamais automatiquement celui d’un autre vendeur.</p><div class="card"><div class="row"><strong>Total</strong><strong>'+money(g.data.total,g.data.currency)+'</strong></div><div class="muted">Statut groupe : '+esc(g.data.status)+' · Paiement : '+esc(g.data.payment_status)+'</div></div>'+orders.map(o=>'<article class="card"><div class="row"><div><strong>'+esc(o.businesses?.name||'Vendeur')+'</strong><div class="muted">Commande #'+esc(o.id.slice(0,8))+' · '+esc(o.status)+'</div></div><strong>'+money(o.total,o.currency)+'</strong></div><div class="muted">'+(o.order_items||[]).map(i=>esc(i.title_snapshot)+' × '+i.quantity).join(' · ')+'</div><p>Paiement : <b>'+esc(o.payment_status)+'</b> · '+esc(o.payment_method)+'</p><div class="row"><a class="btn" href="/commande/'+encodeURIComponent(o.tracking_token)+'?order_id='+encodeURIComponent(o.id)">Suivre</a>'+((o.payment_method!=='cash_on_delivery'&&o.payment_status!=='paid')?'<button class="btn primary" data-pay="'+o.id+'" data-method="'+esc(o.payment_method)+'">Payer cette commande</button>':'')+'</div></article>').join('');
}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-pay]');if(!b)return;b.disabled=true;try{const r=await fetch('/api/payment-moneyfusion',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+(await db.auth.getSession()).data.session.access_token},body:JSON.stringify({order_id:b.dataset.pay,method:b.dataset.method,idempotency_key:crypto.randomUUID()+crypto.randomUUID()})});const d=await r.json();if(!r.ok)throw new Error(d.message||d.error||'Paiement impossible');if(d.payment_url)location.href=d.payment_url;else await load()}catch(err){alert(err.message||err);b.disabled=false}});
load().catch(e=>$('app').innerHTML='<div class="error">Impossible de charger le checkout : '+esc(e.message||e)+'</div>');
</script></body></html>
