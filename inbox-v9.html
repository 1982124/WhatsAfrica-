<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WASSAFRICA — Messages</title><style>body{font:15px system-ui;margin:0;background:#f5f7f6;color:#17211b}.wrap{max-width:1050px;margin:auto;padding:12px}.card{background:#fff;border:1px solid #dce5e1;border-radius:16px;padding:12px;margin:8px 0}.row{display:flex;gap:8px}.row>*{flex:1}.btn{border:0;border-radius:12px;padding:11px 14px;background:#e8a83c;font-weight:800}.muted{color:#66756e;font-size:13px}.err{color:#b42318}.ok{color:#18845d}.layout{display:grid;grid-template-columns:280px 1fr;gap:10px}.list{max-height:65vh;overflow:auto}.conv{padding:12px;border-radius:12px;cursor:pointer}.conv:hover{background:#eef4f1}.chat{min-height:65vh;display:flex;flex-direction:column}.msgs{flex:1;min-height:50vh;overflow:auto}.msg{max-width:82%;width:max-content;padding:9px 11px;border-radius:14px;background:#eef2f0;margin:6px 0;white-space:pre-wrap}.mine{margin-left:auto;background:#dcf8c6}@media(max-width:760px){.layout{grid-template-columns:1fr}}</style><script src="/brand-normalizer.js"></script>
<script src="/brand-observer.js"></script></head><body><div class="wrap"><h2>WASSAFRICA · Messages</h2><section id="gate" class="card">Démarrage sécurisé…</section><main id="app" hidden><section class="card"><b>Nouveau message</b><div class="row"><input id="target" placeholder="Nom ou numéro +223…"><button id="start" class="btn">Démarrer</button></div><div id="results"></div><div id="status" class="muted"></div></section><div class="layout"><section class="card"><b>Conversations</b><div id="list" class="list"></div></section><section class="card chat"><div id="chat" hidden><b id="title">Conversation</b><div id="secure" class="muted"></div><div id="msgs" class="msgs"></div><form id="composer" class="row"><input id="body" maxlength="4000" placeholder="Écrire un message…"><button class="btn">➤</button></form></div><div id="empty">Choisissez une conversation.</div></section></div></main></div><script>(async()=>{const gate=document.getElementById('gate');const $=id=>document.getElementById(id);const status=(t,c='')=>{$('status').textContent=t;$('status').className='muted '+c};const secure=t=>{$('secure').textContent=t};const loadScript=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(Error('SUPABASE_CDN_UNAVAILABLE'));document.head.appendChild(s)});try{await Promise.race([loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'),new Promise((_,r)=>setTimeout(()=>r(Error('SUPABASE_CDN_TIMEOUT')),8000))]);if(!window.supabase)throw Error('SUPABASE_LIBRARY_NOT_LOADED');const db=supabase.createClient('https://dzifpwqrqnvssfhwjccj.supabase.co','sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV',{auth:{persistSession:true,autoRefreshToken:true,flowType:'implicit',storageKey:'whatsafrica-auth'}});const te=new TextEncoder(),td=new TextDecoder();const b64=x=>btoa(String.fromCharCode(...new Uint8Array(x))),bytes=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));let me,dev,cur,keyBytes,ver=0,busy=false,pulse,sub;const vault=()=>new Promise((ok,no)=>{const r=indexedDB.open('wassafrica-msg-v7',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});const get=async k=>{const d=await vault();return new Promise((ok,no)=>{const r=d.transaction('k').objectStore('k').get(k);r.onsuccess=()=>{d.close();ok(r.result||null)};r.onerror=()=>no(r.error)})};const put=async(k,v)=>{const d=await vault();return new Promise((ok,no)=>{const r=d.transaction('k','readwrite').objectStore('k').put(v,k);r.transaction.oncomplete=()=>{d.close();ok()};r.onerror=()=>no(r.error)})};async function identity(){const x=await get('id:'+me.id);if(x)return{publicJwk:x.publicJwk,privateKey:await crypto.subtle.importKey('jwk',x.privateJwk,{name:'RSA-OAEP',hash:'SHA-256'},true,['decrypt'])};const g=await crypto.subtle.generateKey({name:'RSA-OAEP',modulusLength:2048,publicExponent:new Uint8Array([1,0,1]),hash:'SHA-256'},true,['encrypt','decrypt']);const publicJwk=await crypto.subtle.exportKey('jwk',g.publicKey),privateJwk=await crypto.subtle.exportKey('jwk',g.privateKey);await put('id:'+me.id,{publicJwk,privateJwk});return{publicJwk,privateKey:g.privateKey}}async function device(){const i=await identity(),r=await db.rpc('ensure_web_device',{p_identity_public_key:i.publicJwk});if(r.error)throw r.error;if(!r.data?.[0])throw Error('DEVICE_NOT_AVAILABLE');dev={id:r.data[0].id,publicJwk:i.publicJwk,privateKey:i.privateKey}}async function wrap(j,k){const x=await crypto.subtle.importKey('jwk',j,{name:'RSA-OAEP',hash:'SHA-256'},true,['encrypt']);return b64(await crypto.subtle.encrypt({name:'RSA-OAEP'},x,k))}async function unwrap(s){return new Uint8Array(await crypto.subtle.decrypt({name:'RSA-OAEP'},dev.privateKey,bytes(s)))}async function readKey(c,v=0){let q=db.from('conversation_key_envelopes').select('wrapped_key,key_version').eq('conversation_id',c).eq('device_id',dev.id).is('revoked_at',null);q=v?q.eq('key_version',v):q.order('key_version',{ascending:false}).limit(1);const r=await q.maybeSingle();if(r.error)throw r.error;if(!r.data)return null;const k=await unwrap(r.data.wrapped_key);if(!v||+r.data.key_version===ver||!keyBytes){keyBytes=k;ver=+r.data.key_version}return k}async function addEnv(c,d,k,v){const r=await db.from('conversation_key_envelopes').insert({conversation_id:c,device_id:d.id,key_version:v,algorithm:'RSA-OAEP-2048-SHA256+AES-256-GCM',wrapped_key:await wrap(d.identity_public_key,k)});if(r.error&&r.error.code!=='23505')throw r.error}async function distribute(c,k,v){const m=await db.from('conversation_members').select('user_id').eq('conversation_id',c);if(m.error)throw m.error;for(const uid of [...new Set((m.data||[]).map(x=>x.user_id))]){const q=await db.from('user_devices').select('id,identity_public_key').eq('user_id',uid).eq('device_label','Web').is('revoked_at',null).order('last_seen_at',{ascending:false}).limit(20);if(q.error)throw q.error;for(const d of q.data||[])await addEnv(c,d,k,v)}}async function ensureKey(c){await device();if(keyBytes&&cur?.id===c)return keyBytes;for(let i=0;i<8;i++){try{const k=await readKey(c);if(k){await distribute(c,k,ver);return k}}catch{}await new Promise(r=>setTimeout(r,400+i*250))}const claim=await db.rpc('claim_conversation_key_initializer',{p_conversation_id:c,p_key_version:1,p_device_id:dev.id});if(claim.error)throw claim.error;if(!claim.data){for(let i=0;i<12;i++){try{const k=await readKey(c);if(k)return k}catch{}await new Promise(r=>setTimeout(r,500))}throw Error('KEY_NOT_AVAILABLE_YET')}const k=crypto.getRandomValues(new Uint8Array(32));await addEnv(c,{id:dev.id,identity_public_key:dev.publicJwk},k,1);await distribute(c,k,1);keyBytes=k;ver=1;return k}async function peer(c){const m=await db.from('conversation_members').select('user_id').eq('conversation_id',c);if(m.error)throw m.error;const id=(m.data||[]).map(x=>x.user_id).find(x=>x!==me.id);if(!id)return{};const p=await db.from('profiles').select('display_name,public_display_name,country').eq('user_id',id).maybeSingle();return{name:p.data?.public_display_name||p.data?.display_name||'Membre WASSAFRICA',country:p.data?.country||''}}async function list(){const m=await db.from('conversation_members').select('conversation_id').eq('user_id',me.id);if(m.error)throw m.error;$('list').innerHTML='';const ids=(m.data||[]).map(x=>x.conversation_id);if(!ids.length){$('list').textContent='Aucune conversation.';return}const q=await db.from('conversations').select('id,title,created_at').in('id',ids).order('created_at',{ascending:false});if(q.error)throw q.error;for(const c of q.data||[]){const p=await peer(c.id),d=document.createElement('div');d.className='conv';d.textContent=p.name||c.title||'Conversation';d.onclick=()=>open({...c,...p});$('list').appendChild(d)}}async function find(v){$('results').innerHTML='';const r=await db.rpc('search_public_profiles',{p_query:v});if(r.error)throw r.error;const rows=(r.data||[]).filter(x=>x.user_id!==me.id);rows.slice(0,10).forEach(p=>{const d=document.createElement('div');d.className='conv';d.textContent=(p.display_name||p.public_display_name||'Membre WASSAFRICA')+' '+(p.country||'');d.onclick=()=>startUser(p);$('results').appendChild(d)});if(rows.length===1)await startUser(rows[0])}async function startUser(p){const r=await db.rpc('start_direct_conversation_by_user_id',{p_user_id:p.user_id});if(r.error)throw r.error;const x=r.data?.[0];if(!x)throw Error('CONTACT_NOT_FOUND');await open({id:x.conversation_id,title:x.contact_name||p.display_name})}async function start(){const v=$('target').value.trim();if(!v)return status('Saisissez un nom ou un numéro.','err');$('start').disabled=true;try{const p=v.replace(/[\\s().-]/g,'');if(!/^\\+?[1-9][0-9]{7,14}$/.test(p))await find(v);else{const r=await db.rpc('start_direct_conversation_by_phone',{p_phone:p.startsWith('+')?p:'+'+p});if(r.error)throw r.error;const x=r.data?.[0];if(!x)throw Error('CONTACT_NOT_FOUND');await open({id:x.conversation_id,title:x.contact_name})}}catch(e){status('Impossible : '+(e.message||e),'err')}finally{$('start').disabled=false}}async function decrypt(r,k){const m=r.encryption_metadata,kk=await crypto.subtle.importKey('raw',k,{name:'AES-GCM'},false,['decrypt']);return td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(m.iv)},kk,bytes(r.ciphertext)))}async function load(){if(!cur||!keyBytes)return;const q=await db.from('messages_v2').select('id,sender_id,created_at,ciphertext,encryption_metadata').eq('conversation_id',cur.id).order('created_at',{ascending:true}).limit(200);if(q.error)throw q.error;const nodes=[];for(const r of q.data||[]){let text='🔒 Message chiffré';try{const v=+(r.encryption_metadata?.key_version||1),k=v===ver?keyBytes:await readKey(cur.id,v);if(k)text=await decrypt(r,k)}catch(e){text='🔒 Message chiffré · '+(e.name||'erreur')}const d=document.createElement('div');d.className='msg '+(r.sender_id===me.id?'mine':'');d.textContent=text;nodes.push(d)}$('msgs').replaceChildren(...nodes);$('msgs').scrollTop=$('msgs').scrollHeight}async function sync(){if(!cur||busy)return;busy=true;try{if(!keyBytes)await ensureKey(cur.id);await load();secure('🔒 Chiffrement actif · synchronisation automatique')}catch(e){secure('⚠️ '+(e.message||e));status('Synchronisation : '+(e.message||e),'err')}finally{busy=false}}async function open(c){cur=c;keyBytes=null;ver=0;$('empty').hidden=true;$('chat').hidden=false;$('title').textContent=c.title||c.name||'Conversation';if(sub)await db.removeChannel(sub).catch(()=>{});if(pulse)clearInterval(pulse);sub=db.channel('wassafrica-msg-v9-'+c.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages_v2',filter:'conversation_id=eq.'+c.id},sync).subscribe();pulse=setInterval(sync,2000);await sync();status('Conversation prête.','ok')}async function send(e){e.preventDefault();const text=$('body').value.trim();if(!text||!cur)return;const b=$('composer').querySelector('button');b.disabled=true;try{await ensureKey(cur.id);const id=crypto.randomUUID(),iv=crypto.getRandomValues(new Uint8Array(12)),k=await crypto.subtle.importKey('raw',keyBytes,{name:'AES-GCM'},false,['encrypt']),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,te.encode(text)),r=await db.from('messages_v2').insert({id,conversation_id:cur.id,sender_id:me.id,body:null,message_type:'text',encryption_version:1,ciphertext:b64(ct),encryption_metadata:{v:2,alg:'AES-256-GCM',iv:b64(iv),conversation_id:cur.id,message_id:id,key_version:ver}});if(r.error)throw r.error;$('body').value='';await sync();status('🔒 Message envoyé.','ok')}catch(e){status('Message non envoyé : '+(e.message||e),'err')}finally{b.disabled=false}}const s=await db.auth.getSession();if(!s.data.session){gate.innerHTML='Connectez-vous pour accéder à la messagerie. <button class="btn" id="login">Se connecter</button>';$('login').onclick=()=>location.replace('/auth?next=/inbox-v9.html');return}me=s.data.session.user;gate.hidden=true;$('app').hidden=false;try{await device();await list();status('Messagerie prête.','ok')}catch(e){status('Démarrage : '+(e.message||e),'err')}$('start').onclick=start;$('composer').onsubmit=send;$('target').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();start()}}}catch(e){gate.innerHTML='❌ Démarrage impossible : <b>'+String(e.message||e).replace(/[<>]/g,'')+'</b><br><button class="btn" onclick="location.reload()">Réessayer</button>'}})();</script></body></html>
