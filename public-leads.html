<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WASSAFRICA — Leads publics</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#f5f7f6;--card:#fff;--line:#dce5e1;--text:#17211b;--muted:#66756e;--primary:#e8a83c;--mine:#dcf8c6;--soft:#eef4f1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,sans-serif}.wrap{max-width:1050px;margin:auto;padding:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:22px;font-weight:900}.muted{color:var(--muted);font-size:13px}.btn{border:0;border-radius:12px;padding:11px 14px;background:var(--primary);font-weight:850;cursor:pointer}.ghost{background:transparent;border:1px solid var(--line)}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0}.layout{display:grid;grid-template-columns:320px 1fr;gap:10px}.list{max-height:72vh;overflow:auto}.lead{padding:12px;border-radius:12px;cursor:pointer;border:1px solid transparent}.lead:hover,.lead.sel{background:var(--soft);border-color:var(--line)}.lead b{display:block}.chat{min-height:68vh;display:flex;flex-direction:column}.messages{flex:1;min-height:55vh;max-height:64vh;overflow:auto;padding:8px}.msg{max-width:82%;width:max-content;padding:9px 11px;border-radius:14px;background:#eef2f0;margin:7px 0;white-space:pre-wrap;overflow-wrap:anywhere}.business{margin-left:auto;background:var(--mine)}.composer{display:flex;gap:8px;margin-top:8px}.composer input{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit}.err{color:#b42318}.ok{color:#18845d}@media(max-width:760px){.layout{grid-template-columns:1fr}.list{max-height:30vh}.messages{min-height:45vh}}</style><script src="/brand-normalizer.js"></script>
</head><body><div class="wrap"><div class="top"><div class="brand">🌍 WASSAFRICA <span class="muted">/ Leads publics</span></div><button id="logout" class="btn ghost">Déconnexion</button></div><section class="card"><b>💬 Prospects sans compte</b><div class="muted" style="margin-top:5px">Chaque message public devient automatiquement un lead et reste pilotable ici. Le prospect n'a pas besoin de s'inscrire.</div><div id="status" class="muted" style="margin-top:6px"></div></section><div class="layout"><section class="card"><b>Nouveaux leads</b><div id="leads" class="list" style="margin-top:6px"></div></section><section class="card chat"><div id="empty" style="display:grid;place-items:center;min-height:55vh;text-align:center"><div><div style="font-size:52px">🤝</div><h2>Inbox prospects</h2><p class="muted">Sélectionnez un prospect pour répondre.</p></div></div><div id="chat" style="display:none;flex-direction:column;min-height:100%"><div style="border-bottom:1px solid var(--line);padding-bottom:10px"><b id="title">Prospect</b><div id="meta" class="muted"></div></div><div id="messages" class="messages"></div><form id="composer" class="composer"><input id="body" maxlength="4000" placeholder="Répondre au prospect…"><button id="send" class="btn">➤</button></form></div></section></div></div><script>(function(){'use strict';const URL='https://dzifpwqrqnvssfhwjccj.supabase.co',KEY='sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV',db=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.localStorage,storageKey:'whatsafrica-auth'}});const $=id=>document.getElementById(id);let user=null,current=null;function status(t,c){$('status').textContent=t;$('status').className='muted '+(c||'')}async function auth(){const s=await db.auth.getSession();user=s.data.session?.user||null;if(!user){location.href='/auth?next=/inbox/leads';return false}return true}async function list(){const r=await db.rpc('get_business_guest_inbox');if(r.error)throw r.error;const box=$('leads');box.innerHTML='';if(!r.data?.length){box.innerHTML='<div class="muted" style="padding:10px">Aucun prospect public pour le moment.</div>';return}for(const x of r.data){const d=document.createElement('div');d.className='lead'+(current?.conversation_id===x.conversation_id?' sel':'');d.dataset.id=x.conversation_id;d.innerHTML='<b></b><span class="muted"></span>';d.firstChild.textContent=x.guest_name||'Prospect anonyme';d.lastChild.textContent=(x.lead_status||'new')+' · '+new Date(x.last_message_at).toLocaleString();d.onclick=()=>open(x);box.appendChild(d)}}async function open(x){current=x;$('empty').style.display='none';$('chat').style.display='flex';$('title').textContent=x.guest_name||'Prospect anonyme';$('meta').textContent='Lead '+(x.lead_status||'new')+' · source public_message';await messages();await list()}async function messages(){if(!current)return;const r=await db.rpc('get_business_guest_messages',{p_guest_conversation_id:current.conversation_id});if(r.error)throw r.error;const box=$('messages');box.innerHTML='';for(const m of r.data||[]){const d=document.createElement('div');d.className='msg '+(m.sender_role==='business'?'business':'');d.textContent=m.body;box.appendChild(d)}box.scrollTop=box.scrollHeight}async function send(e){e.preventDefault();const input=$('body'),text=input.value.trim();if(!text||!current)return;input.disabled=true;$('send').disabled=true;try{const r=await db.rpc('reply_guest_message',{p_guest_conversation_id:current.conversation_id,p_message:text});if(r.error)throw r.error;input.value='';await messages();await list();status('Réponse envoyée.','ok')}catch(e){status(e.message||String(e),'err')}finally{input.disabled=false;$('send').disabled=false;input.focus()}}$('composer').addEventListener('submit',send);$('logout').onclick=()=>db.auth.signOut().then(()=>location.href='/auth');(async()=>{try{if(await auth()){await list();status('Inbox prospects prête.','ok');setInterval(messages,3000)}}catch(e){status(e.message||String(e),'err')}})();})();</script></body></html>
