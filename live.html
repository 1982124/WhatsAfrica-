<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#120f1f"><title>WhatsAfrica — Business Live</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#120f1f;--panel:#1c1832;--gold:#e8a83c;--teal:#17a889;--cream:#f6f1e4;--muted:#aaa39a;--red:#ff5c6c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--cream);font:15px system-ui}.wrap{max-width:900px;margin:auto;padding:0 16px}.nav{border-bottom:1px solid #ffffff14}.navrow{height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font:bold 20px Georgia}.brand b{color:var(--gold)}.btn{border:0;border-radius:999px;padding:11px 16px;font-weight:800;text-decoration:none;display:inline-flex;justify-content:center;cursor:pointer}.primary{background:var(--gold);color:var(--bg)}.secondary{background:transparent;color:var(--cream);border:1px solid #ffffff22}.danger{background:var(--red);color:#210910}.hero{text-align:center;padding:36px 0 18px}.eyebrow{font:10px monospace;letter-spacing:2px;color:var(--teal)}h1,h2{font-family:Georgia,serif}.desc{color:#f6f1e499;line-height:1.55}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:var(--panel);border:1px solid #ffffff10;border-radius:18px;padding:16px;margin:10px 0}.full{grid-column:1/-1}input,textarea,select{width:100%;padding:12px;margin:6px 0;background:#0d0b15;color:#fff;border:1px solid #ffffff18;border-radius:10px}textarea{min-height:110px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.livecard{position:relative}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#ff5c6c22;color:#ff8994;font-weight:900;font-size:12px}.meta{color:var(--muted);font-size:13px;margin-top:8px}.hidden{display:none}.msg{padding:8px 0}.chat{height:260px;overflow:auto;background:#0d0b15;border-radius:12px;padding:9px;display:flex;flex-direction:column;gap:8px}.bubble{max-width:88%;padding:9px 12px;border-radius:15px;background:#ffffff0b;white-space:pre-wrap}.mine{align-self:flex-end;background:var(--teal);color:#04231c}.composer{display:flex;gap:8px;margin-top:9px}.composer input{flex:1;margin:0}.empty{text-align:center;padding:45px 10px;color:var(--muted)}.error{color:#ff8f8f}.success{color:#57d39b}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.navrow{height:auto;padding:12px 0;flex-wrap:wrap}}
</style></head><body><header class="nav"><div class="wrap navrow"><a class="brand" href="/">Whats<b>Africa</b></a><div class="actions"><a class="btn secondary" href="/dashboard">Mon compte</a><button class="btn primary" id="createBtn">+ Créer un Business Live</button></div></div></header><main class="wrap"><section class="hero"><div class="eyebrow">FORUM BUSINESS EN TEMPS RÉEL</div><h1>🔴 Business Live</h1><p class="desc">Une demande publique peut devenir une offre, une mise en relation puis un prospect dans l’Inbox.</p></section><section id="create" class="card hidden"><h2>🔴 Créer un Business Live</h2><p class="desc">Publiez une demande, une offre ou une opportunité commerciale.</p><select id="type"><option>Je cherche un produit</option><option>Je propose un produit</option><option>Je cherche un fournisseur</option><option>Je cherche un client</option><option>Je propose un service</option><option>Partenariat</option><option>Import / Export</option><option>Opportunité</option><option>Autre</option></select><input id="title" maxlength="140" placeholder="Titre de l’opportunité"><input id="category" maxlength="80" placeholder="Catégorie"><textarea id="description" maxlength="5000" placeholder="Décrivez clairement votre demande ou votre offre"></textarea><input id="location" maxlength="120" placeholder="Ville / pays (facultatif)"><input id="starts" type="datetime-local"><div class="actions"><button class="btn secondary" id="cancelCreate">Annuler</button><button class="btn primary" id="publishBtn">Publier</button></div><p id="createMsg" class="msg"></p></section><section id="list"></section><section id="detail" class="hidden"></section></main><script>const URL='https://dzifpwqrqnvssfhwjccj.supabase.co',KEY='sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV',db=supabase.createClient(URL,KEY),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[m]));let session=null;async function auth(){const r=await db.auth.getSession();session=r.data.session||null}function requireAuth(){if(session)return true;alert('Connectez-vous pour créer, participer ou répondre à un Business Live.');location.href='/dashboard';return false}async function loadList(){let r=await db.from('business_live_sessions').select('id,host_id,business_id,title,description,category,status,starts_at,ends_at,created_at').in('status',['live','scheduled']).order('created_at',{ascending:false}).limit(50);if(r.error){$('list').innerHTML='<div class="card error">Impossible de charger les Lives : '+esc(r.error.message)+'</div>';return}if(!r.data?.length){$('list').innerHTML='<div class="card empty"><h2>Aucun Live publié pour le moment.</h2><p>Soyez le premier à créer une opportunité.</p><button class="btn primary" onclick="openCreate()">+ Créer un Business Live</button></div>';return}$('list').innerHTML='<div class="grid">'+r.data.map(x=>card(x)).join('')+'</div>'}function card(x){return '<article class="card livecard"><span class="badge">🔴 '+esc(x.status==='live'?'LIVE':'PROGRAMMÉ')+'</span><h2>'+esc(x.title)+'</h2><p class="desc">'+esc(x.description||'')+'</p><div class="meta">'+esc(x.category||'Opportunité')+(x.starts_at?' · '+new Date(x.starts_at).toLocaleString('fr-FR'):'')+'</div><div class="actions"><a class="btn primary" href="/live/'+encodeURIComponent(x.id)+'">Ouvrir le Live</a><button class="btn secondary" onclick="joinLive(\''+x.id+'\')">Participer</button></div></article>'}async function openCreate(){if(!requireAuth())return;$('create').classList.remove('hidden');$('create').scrollIntoView({behavior:'smooth'})}window.openCreate=openCreate;$('createBtn').onclick=openCreate;$('cancelCreate').onclick=()=>{$('create').classList.add('hidden');$('createMsg').textContent=''};$('publishBtn').onclick=async()=>{if(!requireAuth())return;let title=$('title').value.trim(),description=$('description').value.trim();if(!title||!description){$('createMsg').innerHTML='<span class="error">Titre et description sont obligatoires.</span>';return}let b=await db.from('businesses').select('id,name').eq('owner_id',session.user.id).maybeSingle();if(b.error){$('createMsg').innerHTML='<span class="error">Entreprise : '+esc(b.error.message)+'</span>';return}if(!b.data){$('createMsg').innerHTML='<span class="error">Créez d’abord votre activité dans le cockpit.</span>';return}let start=$('starts').value?new Date($('starts').value).toISOString():new Date().toISOString(),status=new Date(start)>new Date()?'scheduled':'live',end=new Date(new Date(start).getTime()+24*3600000).toISOString();let r=await db.from('business_live_sessions').insert({host_id:session.user.id,business_id:b.data.id,title,description,category:$('category').value.trim()||'Opportunité',status,starts_at:start,ends_at:end}).select().single();if(r.error){$('createMsg').innerHTML='<span class="error">Publication : '+esc(r.error.message)+'</span>';return}$('createMsg').innerHTML='<span class="success">🟢 Business Live publié.</span>';$('title').value='';$('description').value='';await loadList();location.hash='live-'+r.data.id};async function joinLive(id){if(!requireAuth())return;let r=await db.from('business_live_participants').upsert({session_id:id,user_id:session.user.id,joined_at:new Date().toISOString(),left_at:null},{onConflict:'session_id,user_id'});if(r.error)alert('Participation impossible : '+r.error.message);else{alert('🟢 Vous participez maintenant à ce Business Live.');openDetail(id)}}window.joinLive=joinLive;async function openDetail(id){let r=await db.from('business_live_sessions').select('id,host_id,business_id,title,description,category,status,starts_at,ends_at').eq('id',id).maybeSingle();if(!r.data){$('detail').innerHTML='<div class="card error">Live introuvable.</div>';return}let x=r.data;let pc=await db.from('business_live_participants').select('user_id',{count:'exact',head:true}).eq('session_id',id);$('detail').classList.remove('hidden');$('detail').innerHTML='<article class="card"><span class="badge">🔴 '+esc(x.status)+'</span><h1>'+esc(x.title)+'</h1><p class="desc">'+esc(x.description)+'</p><div class="meta">'+esc(x.category||'')+(x.starts_at?' · '+new Date(x.starts_at).toLocaleString('fr-FR'):'')+' · '+(pc.count??0)+' participant(s)</div><div class="actions"><button class="btn primary" id="joinDetail">Participer</button><button class="btn secondary" id="leadBtn">🎯 Devenir prospect</button></div></article><div class="card"><h2>💬 Discussion</h2><div id="chat" class="chat"></div><div class="composer"><input id="chatInput" maxlength="2000" placeholder="Écrire un message…"><button class="btn primary" id="sendMsg">Envoyer</button></div></div>';$('joinDetail').onclick=()=>joinLive(id);$('leadBtn').onclick=()=>createLead(x);$('sendMsg').onclick=()=>sendMsg(id,x);$('chatInput').onkeydown=e=>{if(e.key==='Enter')sendMsg(id,x)};await loadMessages(id);db.channel('live-'+id).on('postgres_changes',{event:'INSERT',schema:'public',table:'business_live_messages',filter:'session_id=eq.'+id},p=>appendMsg(p.new)).subscribe()}async function loadMessages(id){let r=await db.from('business_live_messages').select('id,author_id,body,created_at').eq('session_id',id).order('created_at',{ascending:true}).limit(100);$('chat').innerHTML='';(r.data||[]).forEach(appendMsg)}function appendMsg(m){let d=document.createElement('div');d.className='bubble'+(session&&m.author_id===session.user.id?' mine':'');d.textContent=m.body||'🎙️ Message vocal';$('chat')?.appendChild(d);if($('chat'))$('chat').scrollTop=$('chat').scrollHeight}async function sendMsg(id,x){if(!requireAuth())return;let body=$('chatInput').value.trim();if(!body)return;let r=await db.from('business_live_messages').insert({session_id:id,author_id:session.user.id,body});if(r.error)alert('Message : '+r.error.message);else $('chatInput').value=''}async function createLead(x){if(!requireAuth())return;let c=await db.from('conversations').insert({kind:'business_live',title:'Business Live — '+x.title,owner_id:x.host_id}).select('id').single();let r=await db.from('leads').insert({business_id:x.business_id,user_id:session.user.id,conversation_id:c.data?.id||null,source:'business_live',status:'new',priority:'normal',notes:'Prospect créé depuis Business Live : '+x.title});if(r.error)alert('Prospect : '+r.error.message);else alert('🟢 Prospect créé. Retrouvez-le dans le CRM.')}async function route(){await auth();let m=location.pathname.match(/^\/live\/([^/]+)$/);if(m){await openDetail(decodeURIComponent(m[1]));return}await loadList()}route();</script></body></html>
