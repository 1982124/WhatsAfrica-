<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WhatsAfrica — Groupes</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#f7f2e9;--surface:#fffdf9;--ink:#20242b;--muted:#77766f;--line:#e5ddd1;--green:#287b36;--deep:#173c22;--gold:#e5aa2f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui}.wrap{max-width:1100px;margin:auto;padding:18px}.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line)}.brand{font:bold 23px Georgia;text-decoration:none;color:var(--ink)}.brand b{color:var(--gold)}.btn{display:inline-flex;padding:10px 13px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:850;text-decoration:none;cursor:pointer}.primary{background:var(--green);color:#fff;border-color:var(--green)}.hero{margin-top:18px;padding:28px;border-radius:24px;background:linear-gradient(120deg,var(--deep),#2d7835 55%,#d59b27);color:#fff}.hero h1{font:700 clamp(35px,6vw,58px)/1.05 Georgia;margin:8px 0}.muted{color:var(--muted);line-height:1.55}.hero .muted{color:#f7f3e9}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:16px}.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}.cover{height:170px;border-radius:14px;background:linear-gradient(135deg,#173c22,#d59b27);display:grid;place-items:center;font-size:50px;color:#fff;margin-bottom:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.detail{margin-top:16px}.post{padding:13px 0;border-top:1px solid var(--line)}.post img{max-width:100%;max-height:420px;border-radius:12px}.empty{padding:40px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}@media(max-width:650px){.grid{grid-template-columns:1fr}.actions .btn{width:100%}}</style></head><body><main class="wrap"><nav class="nav"><a class="brand" href="/">Whats<b>Africa</b> / Groupes</a><div><a class="btn" href="/commerce">Marché</a> <a class="btn primary" href="/dashboard">Mon espace</a></div></nav><section class="hero"><div>👥 COMMUNAUTÉS</div><h1>Une invitation doit donner envie de rejoindre.</h1><p class="muted">Chaque groupe possède maintenant une page partageable : sujet, description, membres et bouton « Rejoindre ». Partagez-la par WhatsApp, SMS, e-mail ou réseaux sociaux.</p></section><section id="list" class="grid"><div class="empty">Chargement…</div></section><section id="detail" class="detail"></section></main><script>const db=supabase.createClient('https://dzifpwqrqnvssfhwjccj.supabase.co','sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV'),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));let groups=[],session=null,current=null;async function init(){session=(await db.auth.getSession()).data.session;const r=await db.from('groups').select('id,name,description,is_business,owner_slug,created_at').order('created_at',{ascending:false});if(r.error)throw r.error;groups=r.data||[];render();const id=new URLSearchParams(location.search).get('group');if(id)openGroup(id)}function share(url,title,text){if(navigator.share)return navigator.share({title,text,url});return navigator.clipboard?.writeText(url).then(()=>alert('Lien copié : '+url))}function card(g){const url=location.origin+'/groups?group='+encodeURIComponent(g.id);return '<article class="card"><div class="cover">'+(g.is_business?'💼':'👥')+'</div><span class="muted">'+(g.is_business?'Business':'Communauté')+'</span><h2>'+esc(g.name)+'</h2><p class="muted">'+esc(g.description||'')+'</p><div class="actions"><button class="btn primary" onclick="openGroup(\''+g.id+'\')">Ouvrir & rejoindre</button><button class="btn" onclick="share('+JSON.stringify(url)+','+JSON.stringify(g.name)+','+JSON.stringify('Rejoins cette communauté WhatsAfrica')+')">🔗 Inviter</button></div></article>'}function render(){$('list').innerHTML=groups.length?groups.map(card).join(''):'<div class="empty">Aucune communauté pour le moment.</div>'}async function openGroup(id){current=groups.find(g=>g.id===id);if(!current)return;const s=await db.rpc('get_group_member_summary',{p_group_id:id});const total=s.data?.total||0;const url=location.origin+'/groups?group='+encodeURIComponent(id);let mine=null;if(session)mine=(await db.from('group_members').select('user_id').eq('group_id',id).eq('user_id',session.user.id).maybeSingle()).data;const posts=await db.from('group_posts').select('id,body,image_url,created_at').eq('group_id',id).order('created_at',{ascending:false}).limit(30);$('detail').innerHTML='<div class="card"><button class="btn" onclick="closeDetail()">← Retour</button><h1>'+esc(current.name)+'</h1><p class="muted">'+esc(current.description||'')+'</p><p><b>👥 '+total+' participant(s)</b></p><div class="actions">'+(mine?'<button class="btn" onclick="leave()">Quitter</button>':'<button class="btn primary" onclick="join()">Rejoindre</button>')+'<button class="btn" onclick="share('+JSON.stringify(url)+','+JSON.stringify(current.name)+','+JSON.stringify(current.description||'Rejoins-nous sur WhatsAfrica')+')">🔗 Inviter des personnes</button></div><h2>Publications</h2>'+(posts.data?.length?posts.data.map(p=>'<div class="post">'+(p.body?'<p>'+esc(p.body)+'</p>':'')+(p.image_url?'<img src="'+esc(p.image_url)+'" alt="Publication">':'')+'</div>').join(''):'<p class="muted">Aucune publication.</p>')+'</div>';window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}function closeDetail(){$('detail').innerHTML=''}async function join(){if(!session){location.href='/auth?next='+encodeURIComponent(location.pathname+location.search);return}const r=await db.from('group_members').insert({group_id:current.id,user_id:session.user.id,role:'member'});if(r.error&&r.error.code!=='23505')return alert(r.error.message);openGroup(current.id)}async function leave(){if(!session)return;const r=await db.from('group_members').delete().eq('group_id',current.id).eq('user_id',session.user.id);if(r.error)return alert(r.error.message);openGroup(current.id)}window.openGroup=openGroup;window.closeDetail=closeDetail;window.join=join;window.leave=leave;init().catch(e=>$('list').innerHTML='<div class="empty">'+esc(e.message)+'</div>');</script></body></html>
