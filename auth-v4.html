<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071b16"><title>WhatsAfrica — Créer mon compte</title><style>body{margin:0;min-height:100vh;background:#06150f;color:#f5f7f3;font:15px system-ui;display:grid;place-items:center;padding:18px}.card{width:min(520px,100%);box-sizing:border-box;background:#f7f1df;color:#17211d;border-radius:24px;padding:28px;box-shadow:0 18px 60px #0005}.topnav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:4px}.brand{display:inline-flex;align-items:center;text-decoration:none;color:#17211d;font-size:25px;font-weight:900}.brand b{color:#e8b64b}.home{color:#21784c;text-decoration:none;font-size:12px;font-weight:900}.ey{margin-top:28px;color:#21784c;font-size:11px;font-weight:900;letter-spacing:2px}.h{font:700 36px Georgia,serif;margin:8px 0 12px}.muted{color:#68736d;line-height:1.55}.label{display:block;color:#65716b;font-size:11px;font-weight:900;letter-spacing:1px;text-transform:uppercase;margin:18px 0 7px}input{width:100%;height:50px;box-sizing:border-box;border:1px solid #d7d1c4;border-radius:13px;background:#fffdf8;padding:0 14px;font:inherit}.btn{display:block;width:100%;height:50px;border:0;border-radius:13px;margin-top:10px;font-weight:900;cursor:pointer!important;pointer-events:auto!important;position:relative;z-index:10}.btn:disabled{opacity:.65;cursor:wait!important}.btn:focus-visible,.home:focus-visible,.brand:focus-visible{outline:3px solid #e8b64b;outline-offset:3px}.primary{background:#21784c;color:#fff}.secondary{background:#fffdf8;color:#24312b;border:1px solid #d7d1c4}.notice{display:none;padding:12px 14px;border-radius:13px;margin:0 0 12px;font-size:13px;line-height:1.45}.notice.show{display:block}.ok{background:#173d2c;color:#d9f7e5}.err{background:#4b211f;color:#ffd5d2}.divider{text-align:center;color:#89928d;font-size:11px;margin:18px 0}.foot{margin-top:20px;padding-top:15px;border-top:1px solid #dcd5c8;color:#7b837f;font-size:11px}</style></head><body><main class="card"><div class="topnav"><a class="brand" href="/" aria-label="WhatsAfrica — Accueil">💬 Whats<b>Africa</b></a><a class="home" href="/">Accueil</a></div><div class="ey">ENTRÉE SÉCURISÉE</div><h1 class="h">Créer votre compte.</h1><p class="muted"><strong>Créez votre compte gratuitement avec Google ou votre e-mail.</strong> Aucun SMS n’est requis. Le numéro de téléphone reste disponible comme option.</p><div id="notice" class="notice" role="alert" aria-live="polite"></div><button type="button" id="google" class="btn secondary" aria-label="Continuer avec Google">🌐 Continuer avec Google</button><div class="divider">OU</div><label class="label" for="email">E-mail</label><input id="email" type="email" autocomplete="email" placeholder="vous@exemple.com"><button type="button" id="emailBtn" class="btn secondary">Recevoir mon lien de connexion</button><p id="emailState" class="muted" style="font-size:12px"></p><div class="divider">OU</div><label class="label" for="phone">Numéro international — optionnel</label><input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+22370000000"><button type="button" id="phoneBtn" class="btn primary">Recevoir mon code SMS</button><div id="otpBox" hidden><label class="label" for="otp">Code SMS</label><input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456"><button type="button" id="verify" class="btn primary">Vérifier et entrer</button></div><div class="foot">🔒 WhatsAfrica — votre identité vous appartient.</div></main><script>(function(){const URL='https://dzifpwqrqnvssfhwjccj.supabase.co',KEY='sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV',PROD='https://whatsafrica.vercel.app',$=id=>document.getElementById(id);let sb=null,loadPromise=null,pending='';function origin(){const h=location.hostname.toLowerCase();return h==='localhost'||h==='127.0.0.1'||h==='::1'?PROD:location.origin}function next(){const n=new URLSearchParams(location.search).get('next')||'/inbox';try{const u=new URL(n,origin());return u.origin===origin()&&u.pathname.startsWith('/')?u.pathname+u.search+u.hash:'/inbox'}catch{return'/inbox'}}const NEXT=next(),REDIRECT=origin()+'/auth?next='+encodeURIComponent(NEXT);function note(t,k){const n=$('notice');n.textContent=t;n.className='notice show '+(k||'')}function errText(e){const s=String(e?.message||e?.error_description||e||'');const l=s.toLowerCase();if(l.includes('rate')||l.includes('too many'))return'Limite temporaire atteinte. Patientez puis réessayez.';if(l.includes('redirect')||l.includes('not allowed'))return'Adresse de retour non autorisée. La configuration de redirection Supabase doit autoriser WhatsAfrica.';if(l.includes('provider')&&l.includes('google'))return'La connexion Google n’est pas encore activée côté service d’authentification.';if(l.includes('email')&&l.includes('provider'))return'Le fournisseur e-mail Supabase n’est pas activé.';if(l.includes('phone')||l.includes('sms'))return'Le SMS est momentanément indisponible. Utilisez l’e-mail ou Google.';return s||'Une erreur de connexion est survenue.'}function loadSupabase(){if(window.supabase?.createClient)return Promise.resolve(window.supabase);if(loadPromise)return loadPromise;loadPromise=new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';s.async=true;s.onload=()=>window.supabase?.createClient?resolve(window.supabase):reject(new Error('Bibliothèque d’authentification indisponible.'));s.onerror=()=>reject(new Error('Bibliothèque d’authentification indisponible. Vérifiez votre connexion Internet puis réessayez.'));document.head.appendChild(s)});return loadPromise}async function client(){if(sb)return sb;const api=await loadSupabase();sb=api.createClient(URL,KEY);return sb}async function profile(u){if(!u)return;const c=await client(),m=u.user_metadata||{},name=m.full_name||m.name||u.email||u.phone||'Utilisateur WhatsAfrica';const r=await c.from('profiles').select('id').eq('user_id',u.id).maybeSingle();if(r.error)throw r.error;if(r.data)return;const x=await c.from('profiles').insert({user_id:u.id,display_name:name,public_display_name:name,phone_public:false,identity_mode:'pseudo',country_public:true,avatar_mode:'avatar',template:'business',accent_color:'#08783b',assistant_name:null});if(x.error&&x.error.code!=='23505')throw x.error}async function finish(){const c=await client(),r=await c.auth.getSession();if(r.error){note(errText(r.error),'err');return}if(r.data.session?.user){try{await profile(r.data.session.user);location.replace(NEXT)}catch(e){note('Session créée, mais le profil WhatsAfrica n’a pas pu être préparé. Réessayez.','err')}}}function hashError(){const h=new URLSearchParams(location.hash.replace(/^#/,'').replace(/^\?/ ,''));const code=h.get('error_code')||h.get('error');const desc=h.get('error_description');if(code||desc){note(decodeURIComponent(desc||code||'Erreur d’authentification'),'err');return true}return false}async function google(){const b=$('google');try{b.disabled=true;note('Ouverture sécurisée de Google…');const c=await client(),r=await c.auth.signInWithOAuth({provider:'google',options:{redirectTo:REDIRECT,queryParams:{prompt:'select_account'}}});if(r.error)throw r.error;if(r.data?.url){location.assign(r.data.url);return}throw new Error('Google n’a pas fourni d’adresse de connexion.')}catch(e){note(errText(e),'err');b.disabled=false}}async function email(){const email=$('email').value.trim();if(!/^\S+@\S+\.\S+$/.test(email))return note('Entrez une adresse e-mail valide.','err');const b=$('emailBtn');try{b.disabled=true;note('Envoi du lien de connexion…');const c=await client(),r=await c.auth.signInWithOtp({email,options:{shouldCreateUser:true,emailRedirectTo:REDIRECT}});if(r.error)throw r.error;$('emailState').textContent='Lien envoyé. Ouvrez-le dans le même navigateur pour revenir automatiquement dans WhatsAfrica.';note('Lien e-mail envoyé. Vérifiez votre boîte de réception et vos indésirables.','ok')}catch(e){note(errText(e),'err')}finally{b.disabled=false}}async function phone(){const phone=$('phone').value.replace(/[^+0-9]/g,'');if(!/^\+[1-9][0-9]{7,14}$/.test(phone))return note('Utilisez le format international, par exemple +22370000000.','err');const b=$('phoneBtn');try{b.disabled=true;pending=phone;note('Envoi du code SMS…');const c=await client(),r=await c.auth.signInWithOtp({phone,options:{shouldCreateUser:true}});if(r.error)throw r.error;$('otpBox').hidden=false;note('Code SMS demandé.','ok');$('otp').focus()}catch(e){note(errText(e),'err')}finally{b.disabled=false}}async function verify(){const token=$('otp').value.replace(/\D/g,'');if(!pending||!/^[0-9]{6}$/.test(token))return note('Entrez le code SMS à 6 chiffres.','err');try{$('verify').disabled=true;note('Vérification…');const c=await client(),r=await c.auth.verifyOtp({phone:pending,token,type:'sms'});if(r.error)throw r.error;await profile(r.data.user);location.replace(NEXT)}catch(e){note(errText(e),'err')}finally{$('verify').disabled=false}}$('google').addEventListener('click',google);$('emailBtn').addEventListener('click',email);$('phoneBtn').addEventListener('click',phone);$('verify').addEventListener('click',verify);$('email').addEventListener('keydown',e=>{if(e.key==='Enter')email()});(async()=>{try{if(hashError())return;const c=await client(),q=new URLSearchParams(location.search);if(q.get('code')){const r=await c.auth.exchangeCodeForSession(q.get('code'));if(r.error){note(errText(r.error),'err');return}}c.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_IN'&&session)setTimeout(finish,0)});await finish()}catch(e){note(errText(e),'err')}})()})();</script><script src="/wa-globalization.js"></script></body></html>
