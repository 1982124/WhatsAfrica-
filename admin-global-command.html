<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>WASSAFRICA — Command Center</title><style>body{font:15px system-ui;margin:0;background:#fdfbf7;color:#1e1e1e}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #ddd9cf;border-radius:16px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}input,select,button{font:inherit;padding:10px;border-radius:10px;border:1px solid #ccc}input,select{width:100%;box-sizing:border-box}.btn{background:#1b4332;color:#fff;border-color:#1b4332;cursor:pointer;font-weight:800}.muted{color:#68746d}.result{white-space:pre-wrap;line-height:1.55}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="wrap"><p><a href="/admin-cockpit-v3.html">← Admin Cockpit</a> · <a href="/admin-demand-reports.html">📊 Rapports enregistrés</a> · <a href="/admin-commercial-pricing.html">Tarification Smart Link</a></p><h1>🌍 WASSAFRICA Global Command Center</h1><p class="muted">Recherche mondiale. Aucun pays n'est codé en dur. Les filtres sont transmis au moteur serveur.</p><section class="card grid"><div><label><b>Pays</b></label><input id="countries" list="countryList" placeholder="Mali, Bénin, France, Nigeria…"><datalist id="countryList"><option value="Mali"><option value="Bénin"><option value="Burkina Faso"><option value="Togo"><option value="Côte d'Ivoire"><option value="Sénégal"><option value="Nigeria"><option value="Ghana"><option value="France"><option value="États-Unis"><option value="Maroc"><option value="Algérie"><option value="Kenya"><option value="Afrique du Sud"></datalist><label style="display:block;margin-top:10px"><input id="world" type="checkbox" style="width:auto"> 🌐 Monde entier</label></div><div><label><b>Villes / zones</b></label><input id="zones" placeholder="Bamako, Cotonou, Lomé, Paris…"></div><div><label><b>Produits / thèmes</b></label><input id="products" placeholder="Super Gro, ciment, fer, moto…"></div><div><label><b>Période</b></label><select id="hours"><option value="1">1 h</option><option value="6" selected>6 h</option><option value="12">12 h</option><option value="24">24 h</option><option value="48">48 h</option><option value="168">7 jours</option></select></div><div class="full"><button id="run" class="btn">🔎 Analyser la demande mondiale</button> <button id="clear">Effacer</button></div></section><section class="card"><h2>Résultat</h2><div id="result" class="result muted">Aucun rapport lancé.</div></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const U='https://dzifpwqrqnvssfhwjccj.supabase.co',K='sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV',db=supabase.createClient(U,K),$=x=>document.getElementById(x),csv=v=>String(v||'').split(',').map(x=>x.trim()).filter(Boolean);$('run').onclick=async()=>{try{$('run').disabled=true;$('result').textContent='Analyse en cours…';const s=(await db.auth.getSession()).data.session;if(!s)throw Error('Session requise');const p=new URLSearchParams({hours:$('hours').value});const world=$('world').checked,c=csv($('countries').value),z=csv($('zones').value),pr=csv($('products').value);if(!world&&c.length)p.set('countries',c.join(','));if(z.length)p.set('zones',z.join(','));if(pr.length)p.set('products',pr.join(','));const r=await fetch('/api/demand-report?'+p,{headers:{Authorization:'Bearer '+s.access_token},cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'analyse_impossible');$('result').textContent=`✓ ${d.demand_count||0} demande(s) · ${d.cluster_count||0} regroupement(s)\nZone: ${world?'Monde entier':(c.concat(z).join(', ')||'Toutes zones')}\nProduits: ${pr.join(', ')||'Tous'}\nFenêtre: ${d.hours||$('hours').value} h\n\n📊 Le rapport complet est conservé dans Rapports enregistrés.`;}catch(e){$('result').textContent='Analyse impossible : '+e.message}finally{$('run').disabled=false}};$('clear').onclick=()=>{['countries','zones','products'].forEach(id=>$(id).value='');$('world').checked=false;$('result').textContent='Filtres effacés.'};</script></body></html>
