<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Smart Link WASSAFRICA — découvrez une activité, ses offres et contactez-la directement."><meta name="robots" content="index,follow"><title>WASSAFRICA — Smart Link</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--accent:#1f2933;--accent2:#46515c;--gold:#b78318;--ink:#172027;--bg:#f7f7f5;--muted:#68737b;--line:#e1e4e6;--card:#fff;--soft:#f0f2f3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1180px;margin:auto;padding:0 18px}.nav{position:sticky;top:0;z-index:20;background:#fffffff2;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.navrow{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:950;font-size:21px;text-decoration:none;color:var(--ink)}.brand span{color:var(--gold)}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:13px;padding:11px 15px;font-weight:850;text-decoration:none;cursor:pointer}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.hero{margin:20px 0 36px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:30px;overflow:hidden;box-shadow:0 22px 60px rgba(20,30,40,.12)}.cover{height:min(54vw,500px);min-height:300px;background:#e9ecef center/cover no-repeat;position:relative}.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#00000005 30%,#081016cc 100%)}.heroContent{position:relative;z-index:1;margin-top:-155px;padding:0 34px 34px}.identity{display:flex;align-items:flex-end;gap:18px}.logo{width:100px;height:100px;border-radius:22px;object-fit:cover;border:4px solid #fff;background:#fff;box-shadow:0 10px 30px #0004}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#f7d889;font-weight:950}.hero h1{font:800 clamp(34px,6vw,64px)/1 Georgia,serif;margin:6px 0}.location{color:#e1e7eb}.hero p{max-width:800px;font-size:18px;color:#f1f4f6}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}.actions .btn{min-width:145px}.hero .btn:not(.primary){background:#ffffff12;border-color:#ffffff35;color:#fff}.section{margin:42px 0}.section h2{font:750 clamp(28px,4vw,42px)/1.1 Georgia,serif;margin:0}.lead{color:var(--muted);max-width:780px}.gallery{display:grid;grid-template-columns:2fr 1fr 1fr;grid-auto-rows:180px;gap:10px}.gallery figure{margin:0;border-radius:20px;overflow:hidden;background:#e9ecef}.gallery figure:first-child{grid-row:span 2}.gallery img,.gallery video{width:100%;height:100%;object-fit:cover}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(20,30,40,.06)}.media{height:230px;background:#eef0f1}.media img{width:100%;height:100%;object-fit:cover}.body{padding:18px}.tag{display:inline-block;border-radius:999px;padding:5px 9px;background:var(--soft);color:var(--accent);font-size:10px;font-weight:950}.card h3{font-size:20px;line-height:1.2;margin:10px 0 7px}.mini{color:var(--muted);margin:0}.price{font-size:19px;font-weight:950;color:var(--accent);margin:12px 0}.empty{padding:28px;border:1px dashed #cbd1d5;border-radius:20px;background:#fff;color:var(--muted);text-align:center}.contact{display:grid;grid-template-columns:1fr 1fr;gap:16px}.contactCard{background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px}.share{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:24px;padding:26px}.share p{color:#e4e9ec}.share .btn{background:#fff;color:var(--accent)}.footer{text-align:center;color:var(--muted);padding:30px 0 60px;font-size:12px}.identityNote{display:inline-flex;gap:8px;align-items:center;padding:7px 10px;border-radius:999px;background:#fff4d7;color:#73520e;font-size:11px;font-weight:900;margin-top:12px}.wa{background:#fff;border-color:#ffffff;color:var(--accent)!important}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.gallery{grid-template-columns:1fr 1fr;grid-auto-rows:150px}.gallery figure:first-child{grid-column:span 2;grid-row:auto}.contact{grid-template-columns:1fr}}@media(max-width:560px){.wrap{padding:0 13px}.cover{height:65vw;min-height:250px}.heroContent{margin-top:-105px;padding:0 19px 24px}.identity{align-items:center}.logo{width:78px;height:78px;border-radius:18px}.hero h1{font-size:39px}.hero p{font-size:16px}.actions .btn{width:100%}.grid{grid-template-columns:1fr}.gallery{grid-template-columns:1fr 1fr;grid-auto-rows:130px}.gallery figure:first-child{grid-column:span 2}}</style></head><body><header class="nav"><div class="wrap navrow"><a class="brand" href="/">WASSA<span>FRICA</span></a><a class="btn primary" href="/auth?next=/smartlink">Créer mon Smart Link</a></div></header><main class="wrap" id="app"><div class="empty">Ouverture de la vitrine…</div></main><footer class="wrap footer">WASSAFRICA — Connecter l’Afrique. Ouvrir le monde.</footer><script>'use strict';const db=supabase.createClient('https://dzifpwqrqnvssfhwjccj.supabase.co','sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV');const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));const safe=v=>{try{const u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:null}catch{return null}};const color=v=>/^#[0-9a-f]{6}$/i.test(String(v||''))?String(v):'#1f2933';const money=(v,c)=>v==null?'Prix sur demande':new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0}).format(Number(v))+' '+(c||'XOF');const slug=decodeURIComponent(location.pathname.replace(/^\/+/, '').split('/')[0]||'');let link,business,products=[],services=[],media=[];async function track(type,entityType,entityId){if(!link?.id)return;try{await db.from('smart_link_events').insert({smart_link_id:link.id,event_type:type,entity_type:entityType||null,entity_id:entityId||null,metadata:{}})}catch{}}function share(){const text=`Découvrez ${business?.name||'cette activité'} sur WASSAFRICA`;try{if(navigator.share)navigator.share({title:text,text,url:location.href});else navigator.clipboard.writeText(text+'\n'+location.href).then(()=>alert('Lien copié.'))}catch{}}function whatsapp(){const phone=String(business?.phone||'').replace(/[^0-9]/g,'');const text=`Bonjour ${business?.name||''}, je viens de découvrir votre vitrine WASSAFRICA : ${location.href}`;if(phone)location.href='https://wa.me/'+phone+'?text='+encodeURIComponent(text);else share()}function contact(kind){if(kind==='message'){track('message_click','business',business.id);location.href='/auth?next='+encodeURIComponent('/inbox?business='+business.id)}if(kind==='call'&&business.phone){track('phone_call_click','business',business.id);location.href='tel:'+business.phone}if(kind==='video'){track('video_call_click','business',business.id);location.href='/calls?business='+business.id}}function offerCard(p,type='product'){const im=type==='service'?safe(p.metadata?.image_url||p.metadata?.image):safe(p.image_url);return `<article class="card"><div class="media">${im?`<img loading="lazy" src="${esc(im)}" alt="${esc(p.title)}">`:'<div style="height:100%;display:grid;place-items:center;font-size:52px">'+(type==='service'?'🧰':'🛍️')+'</div>'}</div><div class="body"><span class="tag">${type==='service'?'SERVICE':p.product_type==='property'?'BIEN':p.product_type==='digital'?'DIGITAL':'PRODUIT'}</span><h3>${esc(p.title)}</h3><p class="mini">${esc(p.description||'')}</p>${p.price!=null?`<div class="price">${money(p.price,p.currency)}</div>`:''}<div class="actions"><a class="btn primary" href="/auth?next=${encodeURIComponent('/inbox?business='+business.id+(type==='service'?'&service='+p.id:'&product='+p.id))}">💬 ${type==='service'?'Demander':'Commander'}</a></div></div></article>`}function render(){const name=business?.name||link.title||'Votre activité';const accent=color(business?.accent_color);document.documentElement.style.setProperty('--accent',accent);document.documentElement.style.setProperty('--accent2',accent);const cover=safe(business?.cover_image_url);const logo=safe(business?.logo_url);const allGallery=[cover,...media.filter(m=>m.kind==='gallery').map(m=>safe(m.public_url)),...products.map(p=>safe(p.image_url)),...services.map(s=>safe(s.metadata?.image_url||s.metadata?.image))].filter(Boolean).slice(0,9);const videos=media.filter(m=>m.kind==='video').slice(0,3);document.title=name+' — WASSAFRICA';const loc=[business?.city,business?.country].filter(Boolean).join(' · ');const desc=business?.presentation||business?.description||link.description||'Découvrez cette activité, ses offres et contactez-la directement.';$('app').innerHTML=`<section class="hero"><div class="cover" style="${cover?`background-image:url('${esc(cover)}')`:''}"></div><div class="heroContent"><div class="identity">${logo?`<img class="logo" src="${esc(logo)}" alt="Logo ${esc(name)}">`:''}<div><div class="eyebrow">WASSAFRICA · SMART LINK</div><h1>${esc(name)}</h1>${loc?`<div class="location">📍 ${esc(loc)}</div>`:''}</div></div><p>${esc(desc)}</p><div class="actions"><a class="btn primary" href="#offers">🛍️ Découvrir</a><button class="btn" onclick="contact('message')">💬 Parler</button>${business?.phone?`<button class="btn" onclick="contact('call')">📞 Appeler</button><button class="btn wa" onclick="whatsapp()">WhatsApp</button>`:''}<button class="btn" onclick="contact('video')">📹 Appel vidéo</button><button class="btn" onclick="share()">↗ Partager</button></div>${business?.accent_color?'<span class="identityNote">🎨 Identité visuelle de cette activité</span>':''}</div></section>${allGallery.length?`<section class="section"><h2>Votre activité en images</h2><p class="lead">Une présentation visuelle réelle, publiée directement par le propriétaire.</p><div class="gallery">${allGallery.map((u,i)=>`<figure><img loading="lazy" src="${esc(u)}" alt="${esc(name)} — photo ${i+1}"></figure>`).join('')}</div></section>`:''}${videos.length?`<section class="section"><h2>En vidéo</h2><p class="lead">Découvrez l'activité en mouvement.</p><div class="grid">${videos.map(v=>`<article class="card"><video controls preload="metadata" style="width:100%;height:280px;object-fit:cover" src="${esc(v.public_url)}"></video></article>`).join('')}</div></section>`:''}<section class="section" id="offers"><h2>Produits & offres</h2><p class="lead">Découvrez les produits, marchandises, biens et offres réellement publiés par cette activité.</p>${products.length?`<div class="grid">${products.map(p=>offerCard(p)).join('')}</div>`:'<div class="empty">Aucun produit publié pour le moment.</div>'}</section><section class="section"><h2>Services & solutions</h2><p class="lead">Les services et prestations de cette activité.</p>${services.length?`<div class="grid">${services.map(s=>offerCard(s,'service')).join('')}</div>`:'<div class="empty">Aucun service publié pour le moment.</div>'}</section><section class="section"><div class="contact"><article class="contactCard"><div class="eyebrow" style="color:var(--accent)">CONTACT DIRECT</div><h2>${esc(name)}</h2><p class="lead">Une question, une demande ou un besoin précis ? Entrez directement en conversation avec l'activité.</p><div class="actions"><button class="btn primary" onclick="contact('message')">💬 Parler maintenant</button>${business?.phone?`<button class="btn" onclick="contact('call')">📞 Appeler</button><button class="btn" onclick="whatsapp()">WhatsApp</button>`:''}</div></article><article class="share"><div class="eyebrow">POUR LES BUSINESS</div><h2>Votre activité mérite sa propre vitrine.</h2><p>Présentez votre réalité, vos produits, vos services et ouvrez une conversation depuis un seul lien.</p><a class="btn" href="/auth?next=/smartlink">Créer mon Smart Link</a></article></div></section>`;track('smart_link_opened','smart_link',link.id)}async function load(){if(!slug){$('app').innerHTML='<div class="empty">Smart Link introuvable.</div>';return}const l=await db.from('smart_links').select('id,business_id,owner_id,slug,title,description,is_public').eq('slug',slug).eq('is_public',true).maybeSingle();if(l.error||!l.data){$('app').innerHTML='<div class="empty">Cette vitrine n’est pas disponible.</div>';return}link=l.data;const b=await db.from('businesses').select('id,name,description,presentation,country,city,logo_url,cover_image_url,phone,accent_color').eq('id',link.business_id).maybeSingle();if(b.error){$('app').innerHTML='<div class="empty">Impossible de charger cette activité.</div>';return}business=b.data||{id:link.business_id,name:link.title,description:link.description,accent_color:'#1f2933'};const m=await db.from('smart_link_media').select('id,kind,public_url,alt_text,sort_order').eq('smart_link_id',link.id).order('sort_order',{ascending:true}).order('created_at',{ascending:true});media=m.data||[];if(link.business_id){const p=await db.from('products').select('id,title,description,price,currency,image_url,product_type').eq('business_id',link.business_id).eq('is_published',true).order('created_at',{ascending:false}).limit(60);products=p.data||[];const s=await db.from('services').select('id,title,description,price,currency,metadata').eq('business_id',link.business_id).eq('is_published',true).order('created_at',{ascending:false}).limit(60);services=s.data||[]}render()}load();</script></body></html>
