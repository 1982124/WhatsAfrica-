<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="index,follow">
<meta name="theme-color" content="#171717">
<meta name="description" content="WASSAFRICA — découvrez une activité, ses offres et son univers, puis entrez directement en conversation.">
<title>WASSAFRICA — Smart Link</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/brand-normalizer.js"></script>
<script src="/brand-observer.js"></script>
<style>
:root{--ink:#181816;--muted:#6f706b;--paper:#fbfaf6;--card:#fff;--line:#e6e3da;--accent:#b88a3b;--accent2:#ead7b2;--dark:#171717;--dark2:#24231f;--radius:24px;--shadow:0 18px 60px rgba(0,0,0,.09)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}a{text-decoration:none;color:inherit}button{font:inherit}.shell{width:min(1160px,100%);margin:auto;padding:0 18px}.nav{position:sticky;top:0;z-index:50;background:rgba(251,250,246,.9);backdrop-filter:blur(16px);border-bottom:1px solid rgba(230,227,218,.8)}.navin{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:950;letter-spacing:-.7px;font-size:21px}.navActions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:11px 15px;min-height:45px;font-weight:850;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn.primary{background:var(--accent);border-color:var(--accent);color:#17130b}.btn.dark{background:var(--dark);border-color:var(--dark);color:#fff}.hero{margin:18px 0 22px;min-height:650px;border-radius:32px;overflow:hidden;position:relative;background:var(--dark);color:#fff;display:flex;align-items:flex-end;box-shadow:var(--shadow)}.heroMedia{position:absolute;inset:0;background:radial-gradient(circle at 70% 25%,rgba(255,255,255,.14),transparent 35%),linear-gradient(135deg,#292822,#111)}.heroMedia img,.heroMedia video{width:100%;height:100%;object-fit:cover}.heroShade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.08) 10%,rgba(0,0,0,.15) 35%,rgba(0,0,0,.88) 100%)}.heroCopy{position:relative;z-index:2;width:min(800px,100%);padding:48px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2px;font-weight:950;color:#e9d8b3}.hero h1{font:800 clamp(44px,7vw,82px)/.94 Georgia,serif;letter-spacing:-3px;margin:12px 0 16px;max-width:850px}.hero h1 span{color:var(--accent2)}.heroLead{font-size:18px;color:#eceae4;max-width:690px;margin:0}.identity{display:flex;align-items:center;gap:12px;margin-bottom:17px}.avatar{width:54px;height:54px;border-radius:50%;overflow:hidden;background:#333;display:grid;place-items:center;border:1px solid rgba(255,255,255,.25);font-weight:950}.avatar img{width:100%;height:100%;object-fit:cover}.identityText strong{display:block;font-size:17px}.identityText span{color:#d7d4ca;font-size:13px}.heroActions{display:flex;flex-wrap:wrap;gap:9px;margin-top:25px}.heroActions .btn{min-width:145px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:17px}.chip{padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);font-size:12px;color:#eee}
.section{padding:54px 0}.sectionHead{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:18px}.section h2{font:800 clamp(30px,4vw,45px)/1.05 Georgia,serif;letter-spacing:-1.3px;margin:0}.sectionLead{margin:7px 0 0;color:var(--muted);max-width:700px}.tour{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.tourMain,.tourSide{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}.tourMain{min-height:340px;position:relative}.tourMain .photo{height:100%;min-height:340px;background:#dedbd1}.photo img,.photo video{width:100%;height:100%;object-fit:cover}.tourOverlay{position:absolute;left:0;right:0;bottom:0;padding:25px;background:linear-gradient(transparent,rgba(0,0,0,.78));color:#fff}.tourOverlay h3{font:750 30px/1.05 Georgia,serif;margin:0 0 5px}.tourSide{padding:24px;display:flex;flex-direction:column;justify-content:center}.tourStep{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:15px 0;border-bottom:1px solid var(--line)}.tourStep:last-child{border:0}.num{width:30px;height:30px;border-radius:50%;background:var(--accent2);display:grid;place-items:center;font-weight:950;color:#3c2d16}.tourStep strong{display:block}.tourStep span{color:var(--muted);font-size:13px}
.offers{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.offer{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.035)}.offerMedia{height:245px;background:#e9e6de}.offerMedia img,.offerMedia video{width:100%;height:100%;object-fit:cover}.placeholder{height:100%;display:grid;place-items:center;font-size:46px}.offerBody{padding:18px}.tag{display:inline-flex;padding:5px 8px;border-radius:999px;background:#f0eadc;color:#6d5224;font-size:10px;font-weight:950;letter-spacing:.7px}.offer h3{font-size:20px;line-height:1.2;margin:9px 0 6px}.desc{margin:0;color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.price{font-size:19px;font-weight:950;margin:11px 0;color:#76571f}.offerActions{display:flex;gap:8px;margin-top:12px}.offerActions .btn{flex:1}
.story{display:grid;grid-template-columns:.9fr 1.1fr;gap:14px}.storyCard{background:var(--dark);color:#fff;border-radius:var(--radius);padding:34px;min-height:330px;display:flex;flex-direction:column;justify-content:flex-end}.storyCard h3{font:800 38px/1 Georgia,serif;margin:10px 0}.storyCard p{color:#d8d5ce;max-width:580px}.facts{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fact{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:25px}.fact b{display:block;font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:6px}.fact strong{font-size:20px}
.contact{background:var(--dark);border-radius:30px;color:#fff;padding:34px;display:grid;grid-template-columns:1fr auto;gap:30px;align-items:center}.contact h2{font:800 clamp(31px,4vw,46px)/1 Georgia,serif;margin:7px 0}.contact p{color:#d5d2ca;max-width:620px}.contactActions{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end}.contactActions .btn{min-width:130px}.footer{text-align:center;color:var(--muted);font-size:12px;padding:35px 0 90px}.floating{position:fixed;right:18px;bottom:18px;z-index:60;box-shadow:0 15px 40px rgba(0,0,0,.18)}.empty{padding:28px;border:1px dashed var(--line);border-radius:18px;color:var(--muted);text-align:center;background:var(--card)}.hidden{display:none!important}
@media(max-width:850px){.tour,.story{grid-template-columns:1fr}.offers{grid-template-columns:1fr 1fr}.contact{grid-template-columns:1fr}.contactActions{justify-content:flex-start}}
@media(max-width:560px){.shell{padding:0 12px}.navin{min-height:58px}.navActions .btn:first-child{display:none}.hero{min-height:610px;border-radius:22px}.heroCopy{padding:27px 21px}.hero h1{font-size:50px;letter-spacing:-2.3px}.heroLead{font-size:16px}.heroActions{display:grid}.heroActions .btn{width:100%}.section{padding:37px 0}.sectionHead{display:block}.offers{grid-template-columns:1fr}.offerMedia{height:225px}.tourMain,.tourMain .photo{min-height:260px}.storyCard{min-height:290px;padding:25px}.facts{grid-template-columns:1fr}.contact{padding:25px}.contactActions{display:grid}.contactActions .btn{width:100%}.floating{left:12px;right:12px;width:auto}}
</style>
</head>
<body>
<header class="nav"><div class="shell navin"><a class="brand" href="/">WASSAFRICA</a><div class="navActions"><a class="btn" href="#offers">Voir les offres</a><a class="btn dark" href="/auth?next=/smartlink">Créer mon Smart Link</a></div></div></header>
<main class="shell" id="app"><div class="empty">Ouverture de l'activité…</div></main>
<footer class="shell footer">WASSAFRICA — Découvrir. Parler. Faire affaire.</footer>
<button id="shareBtn" class="btn primary floating">↗ Partager</button>
<script>
'use strict';
const SUPA='https://dzifpwqrqnvssfhwjccj.supabase.co';
const KEY='sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV';
const db=window.supabase.createClient(SUPA,KEY);
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const safe=v=>{try{const u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:null}catch{return null}};
const pathSlug=decodeURIComponent(location.pathname.replace(/^\/+/, '').split('/')[0]||'');
let link=null,business=null,products=[],services=[],media=[];
function money(v,c){if(v==null||v==='')return 'Prix sur demande';const n=Number(v);return (Number.isFinite(n)?new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0}).format(n):String(v))+' '+(c||'XOF')}
function palette(){const root=document.documentElement;const c=business?.accent_color||link?.accent_color;if(c&&/^#[0-9a-f]{6}$/i.test(c)){root.style.setProperty('--accent',c);root.style.setProperty('--accent2',c+'55')}}
async function track(type,entityType=null,entityId=null,metadata={}){if(!link?.id)return;try{await db.from('smart_link_events').insert({smart_link_id:link.id,event_type:type,entity_type:entityType,entity_id:entityId,metadata})}catch(e){}}
function mediaUrl(m){return safe(m?.url||m?.media_url||m?.file_url||m?.image_url)}
function firstImage(){const candidates=[business?.cover_image_url,business?.logo_url,link?.cover_image_url,link?.logo_url,...media.map(mediaUrl)];return candidates.map(safe).find(Boolean)||null}
function renderHero(){const cover=firstImage();const logo=safe(business?.logo_url||link?.logo_url);const name=business?.name||link?.title||'Votre activité';const city=[business?.city,business?.country].filter(Boolean).join(' · ');const cat=business?.category||link?.activity||link?.category||'Activité';return `<section class="hero"><div class="heroMedia">${cover?`<img src="${esc(cover)}" alt="">`:''}</div><div class="heroShade"></div><div class="heroCopy"><div class="identity"><div class="avatar">${logo?`<img src="${esc(logo)}" alt="">`:'W'}</div><div class="identityText"><strong>${esc(name)}</strong><span>${esc(cat)}${city?' · '+esc(city):''}</span></div></div><div class="eyebrow">WASSAFRICA · SMART LINK</div><h1>Entrez dans<br><span>l'univers de ${esc(name)}.</span></h1><p class="heroLead">${esc(business?.description||link?.description||'Découvrez notre activité, nos offres et notre façon de travailler. Si quelque chose vous intéresse, parlons-en directement.')}</p><div class="heroActions"><a class="btn primary" href="#offers" onclick="track('offers_viewed','smart_link',link?.id)">Découvrir les offres</a><button class="btn" onclick="contact('message')">💬 Parler avec nous</button></div><div class="chips"><span class="chip">✓ Présentation de l'activité</span><span class="chip">✓ Produits & services</span><span class="chip">✓ Conversation directe</span></div></div></section>`}
function renderTour(){const name=business?.name||link?.title||'cette activité';const image=media.map(mediaUrl).find(Boolean)||firstImage();return `<section class="section"><div class="sectionHead"><div><h2>Faites le tour</h2><p class="sectionLead">Comme si le propriétaire vous accueillait sur place : regardez, découvrez, posez vos questions.</p></div></div><div class="tour"><article class="tourMain"><div class="photo">${image?`<img loading="lazy" src="${esc(image)}" alt="L'univers de ${esc(name)}">`:'<div class="placeholder">⌂</div>'}</div><div class="tourOverlay"><span class="eyebrow">L'univers de l'activité</span><h3>${esc(name)}</h3><p>${esc(link?.tagline||'Une activité présentée avec son histoire, ses offres et sa manière de travailler.')}</p></div></article><article class="tourSide"><div class="tourStep"><div class="num">1</div><div><strong>Comprendre</strong><span>Qui est derrière l'activité et ce qu'elle propose.</span></div></div><div class="tourStep"><div class="num">2</div><div><strong>Explorer</strong><span>Parcourez les produits, services et contenus utiles.</span></div></div><div class="tourStep"><div class="num">3</div><div><strong>Échanger</strong><span>Une question ? Entrez directement dans la conversation.</span></div></div><div class="tourStep"><div class="num">4</div><div><strong>Revenir</strong><span>Gardez le lien et recommandez exactement cette activité.</span></div></div></article></div></section>`}
function productCard(p){const im=safe(p.image_url||p.cover_image_url);const vid=safe(p.video_url);return `<article class="offer"><div class="offerMedia">${vid?`<video controls preload="metadata" poster="${esc(im||'')}" src="${esc(vid)}"></video>`:im?`<img loading="lazy" src="${esc(im)}" alt="${esc(p.title)}">`:'<div class="placeholder">◈</div>'}</div><div class="offerBody"><span class="tag">${p.product_type==='digital'?'PRODUIT DIGITAL':'PRODUIT'}</span><h3>${esc(p.title)}</h3><p class="desc">${esc(p.description||'Découvrez cette offre et demandez directement les informations qui vous intéressent.')}</p><div class="price">${money(p.price,p.currency)}</div><div class="offerActions"><button class="btn primary" onclick="contactItem('message','product','${esc(p.id)}')">💬 En parler</button><button class="btn" onclick="shareItem('${esc(p.id)}','${esc(p.title)}')">↗</button></div></div></article>`}
function serviceCard(s){const m=s.metadata&&typeof s.metadata==='object'?s.metadata:{};const im=safe(m.image_url||m.image||s.image_url);return `<article class="offer"><div class="offerMedia">${im?`<img loading="lazy" src="${esc(im)}" alt="${esc(s.title)}">`:'<div class="placeholder">✦</div>'}</div><div class="offerBody"><span class="tag">SERVICE</span><h3>${esc(s.title)}</h3><p class="desc">${esc(s.description||'Un service présenté directement par cette activité.')}</p>${s.price!=null?`<div class="price">${money(s.price,s.currency)}</div>`:''}<div class="offerActions"><button class="btn primary" onclick="contactItem('message','service','${esc(s.id)}')">💬 En parler</button></div></div></article>`}
function renderOffers(){return `<section class="section" id="offers"><div class="sectionHead"><div><h2>Découvrez ce que nous faisons</h2><p class="sectionLead">Pas seulement une liste : les offres que vous pouvez regarder, comprendre et discuter avec le propriétaire.</p></div></div>${products.length||services.length?`<div class="offers">${products.map(productCard).join('')}${services.map(serviceCard).join('')}</div>`:'<div class="empty">Les offres seront bientôt présentées ici.</div>'}</section>`}
function renderStory(){const activity=business?.activity||link?.activity||business?.category||link?.category;const city=[business?.city,business?.country].filter(Boolean).join(' · ');return `<section class="section"><div class="story"><article class="storyCard"><div class="eyebrow">NOTRE MANIÈRE DE TRAVAILLER</div><h3>Une vraie activité.<br>Une vraie relation.</h3><p>${esc(link?.tagline||'WASSAFRICA permet de découvrir une activité comme on la découvrirait sur place, puis de parler directement avec la personne qui la fait vivre.')}</p></article><div class="facts"><article class="fact"><b>Activité</b><strong>${esc(activity||'À découvrir')}</strong></article><article class="fact"><b>Localisation</b><strong>${esc(city||'Afrique')}</strong></article><article class="fact"><b>Offres</b><strong>${products.length+services.length} présentée${products.length+services.length>1?'s':''}</strong></article><article class="fact"><b>Relation</b><strong>Conversation directe</strong></article></div></div></section>`}
function renderContact(){const name=business?.name||link?.title||'cette activité';return `<section class="section"><div class="contact"><div><div class="eyebrow">CONTINUER LA VISITE</div><h2>Une question ? Parlons-en.</h2><p>${esc(name)} est à un message de vous. Vous pouvez aussi appeler ou lancer une conversation vidéo lorsque cela est disponible.</p></div><div class="contactActions"><button class="btn primary" onclick="contact('message')">💬 Parler</button><button class="btn" onclick="contact('audio')">🎙️ Appeler</button><button class="btn" onclick="contact('video')">◉ Vidéo</button></div></div></section>`}
function render(){palette();document.title=(business?.name||link?.title||'Smart Link')+' — WASSAFRICA';$('app').innerHTML=renderHero()+renderTour()+renderOffers()+renderStory()+renderContact()}
async function load(){if(!pathSlug){$('app').innerHTML='<div class="empty">Lien introuvable.</div>';return}try{let q=db.from('smart_links').select('*').eq('slug',pathSlug).limit(1);let r=await q.maybeSingle();if(r.error||!r.data){r=await db.from('smart_links').select('*').eq('short_code',pathSlug).limit(1).maybeSingle()}if(r.error||!r.data){$('app').innerHTML='<div class="empty"><strong>Ce Smart Link n’existe pas.</strong><br>Vérifiez le lien ou demandez une nouvelle adresse.</div>';return}link=r.data;const bid=link.business_id||link.owner_id||link.profile_id;if(bid){const br=await db.from('business_profiles').select('*').eq('id',bid).maybeSingle();business=br.data||null}if(!business&&link.profile_id){const pr=await db.from('profiles').select('*').eq('id',link.profile_id).maybeSingle();business=pr.data||null}if(business?.id){const [pr,sr,mr]=await Promise.all([db.from('products').select('*').eq('business_id',business.id).order('created_at',{ascending:false}),db.from('services').select('*').eq('business_id',business.id).order('created_at',{ascending:false}),db.from('smart_link_media').select('*').eq('smart_link_id',link.id).order('sort_order',{ascending:true})]);products=pr.data||[];services=sr.data||[];media=mr.data||[]}else{products=[];services=[]}render();track('smart_link_viewed','smart_link',link.id)}catch(e){console.error(e);$('app').innerHTML='<div class="empty">Impossible d’ouvrir cette activité pour le moment.</div>'}}
function contact(mode){if(!business?.id){return}track(mode==='message'?'message_click':mode==='audio'?'phone_call_click':'video_call_click','business',business.id);if(mode==='message'){location.href='/auth?next='+encodeURIComponent('/inbox?business='+business.id)}else{location.href='/calls?business='+encodeURIComponent(business.id)+(mode==='video'?'&mode=video':'&mode=audio')}}
function contactItem(mode,type,id){track('offer_contact','business',business?.id,{type,id});location.href='/auth?next='+encodeURIComponent('/inbox?business='+business.id+'&'+type+'='+id)}
async function shareItem(id,title){track('offer_shared',type='product',id);const url=location.href+'#offers';try{if(navigator.share)await navigator.share({title,text:'Découvrez '+title+' sur WASSAFRICA.',url});else{await navigator.clipboard.writeText(url);alert('Lien copié.')}}catch(e){}}
async function share(){track('activity_shared','smart_link',link?.id);try{if(navigator.share)await navigator.share({title:business?.name||'WASSAFRICA',text:'Découvrez cette activité sur WASSAFRICA.',url:location.href});else{await navigator.clipboard.writeText(location.href);alert('Lien copié.')}}catch(e){}}
$('shareBtn').addEventListener('click',share);load();
</script>
</body>
</html>
