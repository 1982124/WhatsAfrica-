<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="index,follow"><meta name="theme-color" content="#171717"><title>WASSAFRICA — Smart Link</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/brand-normalizer.js"></script><script src="/brand-observer.js"></script><style>:root{--ink:#181816;--muted:#70716b;--paper:#faf9f5;--card:#fff;--line:#e6e3da;--accent:#b88a3b;--accent-soft:#ead7b2;--dark:#171717;--radius:24px}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif}.shell{width:min(1160px,100%);margin:auto;padding:0 18px}.nav{position:sticky;top:0;z-index:20;background:#faf9f5ee;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.navin{min-height:64px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:950;font-size:21px}.navlinks{display:flex;gap:8px}.btn{min-height:45px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 15px;font-weight:850;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px}.primary{background:var(--accent);border-color:var(--accent);color:#19140a}.dark{background:var(--dark);border-color:var(--dark);color:#fff}.hero{position:relative;min-height:650px;margin:18px 0 20px;border-radius:32px;overflow:hidden;background:#171717;color:#fff;display:flex;align-items:flex-end}.heroMedia,.heroShade{position:absolute;inset:0}.heroMedia{background:linear-gradient(135deg,#292822,#111)}.heroMedia img,.heroMedia video{width:100%;height:100%;object-fit:cover}.heroShade{background:linear-gradient(180deg,transparent 15%,rgba(0,0,0,.88) 100%)}.heroCopy{position:relative;z-index:2;padding:46px;max-width:850px}.identity{display:flex;align-items:center;gap:12px;margin-bottom:18px}.avatar{width:54px;height:54px;border-radius:50%;overflow:hidden;background:#333;display:grid;place-items:center;font-weight:950}.avatar img{width:100%;height:100%;object-fit:cover}.identity strong{display:block}.identity span{font-size:13px;color:#d5d2ca}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:950;color:#ead8b0}.hero h1{font:800 clamp(44px,7vw,82px)/.94 Georgia,serif;letter-spacing:-3px;margin:12px 0 16px}.hero h1 span{color:var(--accent-soft)}.lead{font-size:18px;color:#eceae4;max-width:700px}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:23px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:17px}.chip{padding:7px 10px;border:1px solid #ffffff22;background:#ffffff12;border-radius:999px;font-size:12px}.section{padding:52px 0}.section h2{font:800 clamp(30px,4vw,45px)/1.05 Georgia,serif;margin:0}.sub{color:var(--muted);max-width:720px}.tour{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;margin-top:18px}.tourphoto,.toursteps,.card,.story,.contact{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}.tourphoto{min-height:360px;position:relative}.tourphoto img{width:100%;height:100%;min-height:360px;object-fit:cover}.tourcaption{position:absolute;left:0;right:0;bottom:0;padding:24px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.82))}.tourcaption h3{font:750 31px/1.05 Georgia,serif;margin:7px 0}.toursteps{padding:22px}.step{display:grid;grid-template-columns:32px 1fr;gap:11px;padding:16px 0;border-bottom:1px solid var(--line)}.step:last-child{border:0}.num{width:29px;height:29px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font-weight:950}.step strong{display:block}.step span{font-size:13px;color:var(--muted)}.offers{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.card{overflow:hidden}.media{height:230px;background:#e9e6de}.media img,.media video{width:100%;height:100%;object-fit:cover}.placeholder{height:100%;display:grid;place-items:center;font-size:45px}.body{padding:17px}.tag{font-size:10px;font-weight:950;letter-spacing:.7px;background:#f0eadc;color:#6d5224;border-radius:999px;padding:5px 8px}.card h3{font-size:20px;margin:10px 0 6px}.desc{font-size:13px;color:var(--muted);margin:0}.price{font-weight:950;font-size:19px;margin:10px 0;color:#76571f}.story{display:grid;grid-template-columns:1fr 1fr;gap:0;overflow:hidden}.storycopy{background:var(--dark);color:#fff;padding:34px;min-height:300px;display:flex;flex-direction:column;justify-content:flex-end}.storycopy h3{font:800 38px/1 Georgia,serif;margin:8px 0}.storycopy p{color:#d8d5ce}.facts{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.fact{border:1px solid var(--line);border-radius:18px;padding:20px}.fact small{display:block;color:var(--muted);text-transform:uppercase;letter-spacing:1px}.fact strong{font-size:19px}.contact{background:var(--dark);color:#fff;padding:32px;display:grid;grid-template-columns:1fr auto;gap:25px;align-items:center}.contact h2{font:800 42px/1 Georgia,serif;margin:8px 0}.contact p{color:#d5d2ca}.footer{text-align:center;color:var(--muted);font-size:12px;padding:30px 0 90px}.float{position:fixed;right:18px;bottom:18px;z-index:30;box-shadow:0 14px 35px #0003}@media(max-width:850px){.tour,.story{grid-template-columns:1fr}.offers{grid-template-columns:1fr 1fr}.contact{grid-template-columns:1fr}}@media(max-width:560px){.shell{padding:0 12px}.navlinks .btn:first-child{display:none}.hero{min-height:610px;border-radius:22px}.heroCopy{padding:28px 20px}.hero h1{font-size:49px}.actions{display:grid}.actions .btn{width:100%}.section{padding:36px 0}.offers{grid-template-columns:1fr}.storycopy{min-height:280px;padding:25px}.facts{grid-template-columns:1fr}.contact{padding:25px}.contact h2{font-size:35px}.contact .actions{display:grid}.float{left:12px;right:12px;width:auto}}</style></head><body><header class="nav"><div class="shell navin"><a class="brand" href="/">WASSAFRICA</a><div class="navlinks"><a class="btn" href="#offers">Voir les offres</a><a class="btn dark" href="/auth?next=/smartlink">Créer mon Smart Link</a></div></div></header><main class="shell" id="app"><div class="card body">Ouverture de l'activité…</div></main><footer class="shell footer">WASSAFRICA — Découvrir. Parler. Faire affaire.</footer><button id="share" class="btn primary float">↗ Partager</button><script>'use strict';const db=window.supabase.createClient('https://dzifpwqrqnvssfhwjccj.supabase.co','sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV'),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),safe=v=>{try{const u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:null}catch{return null}},slug=decodeURIComponent(location.pathname.replace(/^\/+/, '').split('/')[0]||'');let link=null,business=null,products=[],services=[],media=[];const money=(v,c)=>v==null||v===''?'Prix sur demande':new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0}).format(Number(v||0))+' '+(c||'XOF');async function track(type,entityType=null,entityId=null,metadata={}){if(!link?.id)return;try{await db.from('smart_link_events').insert({smart_link_id:link.id,event_type:type,entity_type:entityType,entity_id:entityId,metadata})}catch(e){}}function palette(){const c=business?.accent_color||link?.accent_color;if(c&&/^#[0-9a-f]{6}$/i.test(c)){document.documentElement.style.setProperty('--accent',c);document.documentElement.style.setProperty('--accent-soft',c+'55')}}function imgFor(x){return safe(x?.image_url||x?.cover_image_url||x?.media_url||x?.url)}function firstImage(){return [business?.cover_image_url,business?.logo_url,link?.cover_image_url,link?.logo_url,...media.map(imgFor)].map(safe).find(Boolean)||null}function hero(){const name=business?.name||link?.title||'Votre activité',logo=safe(business?.logo_url||link?.logo_url),cover=firstImage(),city=[business?.city,business?.country].filter(Boolean).join(' · '),cat=business?.category||link?.activity||link?.category||'Activité';return `<section class="hero"><div class="heroMedia">${cover?`<img src="${esc(cover)}" alt="">`:''}</div><div class="heroShade"></div><div class="heroCopy"><div class="identity"><div class="avatar">${logo?`<img src="${esc(logo)}" alt="">`:'W'}</div><div><strong>${esc(name)}</strong><span>${esc(cat)}${city?' · '+esc(city):''}</span></div></div><div class="eyebrow">WASSAFRICA · SMART LINK</div><h1>Entrez dans<br><span>l'univers de ${esc(name)}.</span></h1><p class="lead">${esc(business?.description||link?.description||'Découvrez notre activité, nos offres et notre façon de travailler. Si quelque chose vous intéresse, parlons-en directement.')}</p><div class="actions"><a class="btn primary" href="#offers" onclick="track('offers_viewed','smart_link',link?.id)">Découvrir les offres</a><button class="btn" onclick="contact('message')">💬 Parler avec nous</button></div><div class="chips"><span class="chip">✓ Activité</span><span class="chip">✓ Offres</span><span class="chip">✓ Relation directe</span></div></div></section>`}function tour(){const name=business?.name||link?.title||'cette activité',im=media.map(imgFor).find(Boolean)||firstImage();return `<section class="section"><h2>Faites le tour</h2><p class="sub">Comme si le propriétaire vous accueillait sur place : regardez, découvrez, posez vos questions.</p><div class="tour"><article class="tourphoto">${im?`<img loading="lazy" src="${esc(im)}" alt="L'univers de ${esc(name)}">`:'<div class="placeholder">⌂</div>'}<div class="tourcaption"><div class="eyebrow">L'univers de l'activité</div><h3>${esc(name)}</h3><p>${esc(link?.tagline||'Une activité présentée avec son histoire, ses offres et sa manière de travailler.')}</p></div></article><article class="toursteps"><div class="step"><div class="num">1</div><div><strong>Comprendre</strong><span>Qui est derrière l'activité et ce qu'elle propose.</span></div></div><div class="step"><div class="num">2</div><div><strong>Explorer</strong><span>Produits, services, contenus et informations utiles.</span></div></div><div class="step"><div class="num">3</div><div><strong>Échanger</strong><span>Une question ? Parlez directement au propriétaire.</span></div></div><div class="step"><div class="num">4</div><div><strong>Revenir</strong><span>Gardez ce Smart Link et recommandez l'activité.</span></div></div></article></div></section>`}function card(p,type){const im=safe(p.image_url||p.cover_image_url),vid=safe(p.video_url),label=type==='service'?'SERVICE':p.product_type==='digital'?'PRODUIT DIGITAL':'PRODUIT';return `<article class="card"><div class="media">${vid?`<video controls preload="metadata" poster="${esc(im||'')}" src="${esc(vid)}"></video>`:im?`<img loading="lazy" src="${esc(im)}" alt="${esc(p.title)}">`:'<div class="placeholder">◈</div>'}</div><div class="body"><span class="tag">${label}</span><h3>${esc(p.title)}</h3><p class="desc">${esc(p.description||'Découvrez cette offre et demandez directement les informations qui vous intéressent.')}</p>${p.price!=null?`<div class="price">${money(p.price,p.currency)}</div>`:''}<div class="actions"><button class="btn primary" onclick="contactItem('${type}','${esc(p.id)}')">💬 En parler</button><button class="btn" onclick="shareOffer('${esc(p.id)}','${esc(p.title)}')">↗</button></div></div></article>`}function offers(){return `<section class="section" id="offers"><h2>Découvrez ce que nous faisons</h2><p class="sub">Les offres que vous pouvez regarder, comprendre et discuter avec le propriétaire.</p>${products.length||services.length?`<div class="offers">${products.map(p=>card(p,'product')).join('')}${services.map(s=>card(s,'service')).join('')}</div>`:'<div class="card body" style="margin-top:18px">Les offres seront bientôt présentées ici.</div>'}</section>`}function story(){const activity=business?.activity||link?.activity||business?.category||link?.category,city=[business?.city,business?.country].filter(Boolean).join(' · ');return `<section class="section"><div class="story"><article class="storycopy"><div class="eyebrow">NOTRE MANIÈRE DE TRAVAILLER</div><h3>Une vraie activité.<br>Une vraie relation.</h3><p>${esc(link?.tagline||'WASSAFRICA permet de découvrir une activité comme on la découvrirait sur place, puis de parler directement avec la personne qui la fait vivre.')}</p></article><div class="facts"><div class="fact"><small>Activité</small><strong>${esc(activity||'À découvrir')}</strong></div><div class="fact"><small>Localisation</small><strong>${esc(city||'Afrique')}</strong></div><div class="fact"><small>Offres</small><strong>${products.length+services.length}</strong></div><div class="fact"><small>Relation</small><strong>Conversation directe</strong></div></div></div></section>`}function contactBlock(){return `<section class="section"><div class="contact"><div><div class="eyebrow">CONTINUER LA VISITE</div><h2>Une question ? Parlons-en.</h2><p>Vous pouvez commencer par un message, puis appeler ou lancer une vidéo lorsque cela est disponible.</p></div><div class="actions"><button class="btn primary" onclick="contact('message')">💬 Parler</button><button class="btn" onclick="contact('audio')">🎙️ Appeler</button><button class="btn" onclick="contact('video')">◉ Vidéo</button></div></div></section>`}function render(){palette();document.title=(business?.name||link?.title||'Smart Link')+' — WASSAFRICA';$('app').innerHTML=hero()+tour()+offers()+story()+contactBlock()}async function load(){if(!slug)return;try{let r=await db.from('smart_links').select('*').eq('slug',slug).maybeSingle();if(r.error||!r.data)r=await db.from('smart_links').select('*').eq('short_code',slug).maybeSingle();if(r.error||!r.data){$('app').innerHTML='<div class="card body">Ce Smart Link n’existe pas.</div>';return}link=r.data;const bid=link.business_id||link.owner_id||link.profile_id;if(bid){const br=await db.from('business_profiles').select('*').eq('id',bid).maybeSingle();business=br.data||null}if(business?.id){const [pr,sr,mr]=await Promise.all([db.from('products').select('*').eq('business_id',business.id).order('created_at',{ascending:false}),db.from('services').select('*').eq('business_id',business.id).order('created_at',{ascending:false}),db.from('smart_link_media').select('*').eq('smart_link_id',link.id).order('sort_order',{ascending:true})]);products=pr.data||[];services=sr.data||[];media=mr.data||[]}render();track('smart_link_viewed','smart_link',link.id)}catch(e){console.error(e);$('app').innerHTML='<div class="card body">Impossible d’ouvrir cette activité pour le moment.</div>'}}function contact(mode){if(!business?.id)return;track(mode==='message'?'message_click':mode==='audio'?'phone_call_click':'video_call_click','business',business.id);if(mode==='message')location.href='/auth?next='+encodeURIComponent('/inbox?business='+business.id);else location.href='/calls?business='+encodeURIComponent(business.id)+'&mode='+(mode==='video'?'video':'audio')}function contactItem(type,id){track('offer_contact','business',business?.id,{type,id});location.href='/auth?next='+encodeURIComponent('/inbox?business='+business.id+'&'+type+'='+id)}async function shareOffer(id,title){track('offer_shared','product',id,{title});const url=location.href+'#offers';try{if(navigator.share)await navigator.share({title,text:'Découvrez '+title+' sur WASSAFRICA.',url});else{await navigator.clipboard.writeText(url);alert('Lien copié.')}}catch(e){}}async function share(){track('activity_shared','smart_link',link?.id);try{if(navigator.share)await navigator.share({title:business?.name||'WASSAFRICA',text:'Découvrez cette activité sur WASSAFRICA.',url:location.href});else{await navigator.clipboard.writeText(location.href);alert('Lien copié.')}}catch(e){}}$('share').addEventListener('click',share);load();</script></body></html>
