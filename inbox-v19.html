<!doctype html><html lang='fr'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>WASSAFRICA — Messages</title><style>body{font:15px system-ui,sans-serif;margin:0;background:#f5f7f6;color:#17211b}.wrap{max-width:1100px;margin:auto;padding:12px}.card{background:#fff;border:1px solid #dce5e1;border-radius:16px;padding:12px;margin:8px 0}.row{display:flex;gap:8px}.row>*{flex:1}.btn{border:0;border-radius:12px;padding:11px 14px;background:#e8a83c;font-weight:800;cursor:pointer}.btn:disabled{opacity:.55;cursor:wait}.muted{color:#66756e;font-size:13px}.err{color:#b42318}.ok{color:#18845d}.layout{display:grid;grid-template-columns:300px 1fr;gap:10px}.list{max-height:68vh;overflow:auto}.conv,.result{padding:12px;border-radius:12px;cursor:pointer}.conv:hover,.result:hover{background:#eef4f1}.chat{min-height:68vh;display:flex;flex-direction:column}.msgs{flex:1;min-height:52vh;overflow:auto}.msg{max-width:82%;width:max-content;padding:9px 11px;border-radius:14px;background:#eef2f0;margin:6px 0;white-space:pre-wrap;overflow-wrap:anywhere}.mine{margin-left:auto;background:#dcf8c6}.gate{font-weight:700}.debug{font-size:12px;white-space:pre-wrap;margin-top:8px}.result{border:1px solid #dce5e1;margin:6px 0}input{border:1px solid #dce5e1;border-radius:12px;padding:11px;font:inherit}@media(max-width:760px){.layout{grid-template-columns:1fr}.row{flex-direction:column}}</style></head><body><div class='wrap'><h2>WASSAFRICA · Messages</h2><section id='gate' class='card gate'>Initialisation 1/5 — démarrage sécurisé…</section><main id='app' hidden><section class='card'><b>Nouveau message</b><div class='row'><input id='target' autocomplete='off' placeholder='Nom ou numéro +223…'><button id='start' class='btn'>Démarrer</button></div><div id='results'></div><div id='status' class='muted'></div></section><div class='layout'><section class='card'><b>Conversations</b><div id='list' class='list'></div></section><section class='card chat'><div id='chat' hidden><b id='title'>Conversation</b><div id='secure' class='muted'></div><div id='msgs' class='msgs'></div><form id='composer' class='row'><input id='body' maxlength='4000' autocomplete='off' placeholder='Écrire un message…'><button id='send' class='btn' type='submit'>➤</button></form></div><div id='empty'>Choisissez une conversation.</div></section></div></main></div><script src='/wa-media-p2p.js'></script><script>
(async()=>{'use strict';
const $=id=>document.getElementById(id);const SB='https://dzifpwqrqnvssfhwjccj.supabase.co';const KEY='sb_publishable_olHxhduENR5AnqUwAh8Qtw_4az5UmRV';const AUTH='whatsafrica-auth';const te=new TextEncoder();const td=new TextDecoder();let session=null,user=null,device=null,current=null,keyBytes=null,keyVersion=0,busy=false,timer=null;
const gate=$('gate');const esc=v=>String(v??'').replace(/[<>]/g,'');const status=(t,c='')=>{$('status').textContent=t;$('status').className='muted '+c};const phase=t=>{gate.hidden=false;gate.textContent=t};
const b64=x=>{let s='';new Uint8Array(x).forEach(b=>s+=String.fromCharCode(b));return btoa(s)};const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const sessionLike=x=>x&&typeof x==='object'&&typeof x.access_token==='string'&&x.user?.id?x:null;
function readSession(){try{const ks=Array.from({length:localStorage.length},(_,i)=>localStorage.key(i)).filter(Boolean);for(const k of [AUTH,...ks]){try{const x=JSON.parse(localStorage.getItem(k)||'null');const s=sessionLike(x)||sessionLike(x?.session)||sessionLike(x?.currentSession)||sessionLike(x?.data?.session);if(s)return{s,key:k}}catch{}}}catch{}return null}
function saveSession(s,k){try{localStorage.setItem(k||AUTH,JSON.stringify(s))}catch{}}
async function api(path,opt={}){const h=new Headers(opt.headers||{});h.set('apikey',KEY);if(session?.access_token)h.set('Authorization','Bearer '+session.access_token);if(opt.body&&!h.has('Content-Type'))h.set('Content-Type','application/json');const r=await fetch(SB+path,{...opt,headers:h});let d=null;try{d=await r.json()}catch{}if(!r.ok){const e=new Error(d?.message||d?.error_description||d?.hint||d?.details||d?.code||'HTTP_'+r.status);e.code=d?.code;throw e}return d}
const rest=(t,p='',o={})=>api('/rest/v1/'+t+(p?'?'+p:''),o);const rpc=(f,b)=>api('/rest/v1/rpc/'+f,{method:'POST',body:JSON.stringify(b)});
function vault(){return new Promise((ok,no)=>{const r=indexedDB.open('wassafrica-msg-v19',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('k'))r.result.createObjectStore('k')};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function vg(k){const d=await vault();return new Promise((ok,no)=>{const r=d.transaction('k').objectStore('k').get(k);r.onsuccess=()=>{d.close();ok(r.result||null)};r.onerror=()=>no(r.error)})}
async function vp(k,v){const d=await vault();return new Promise((ok,no)=>{const tx=d.transaction('k','readwrite');tx.objectStore('k').put(v,k);tx.oncomplete=()=>{d.close();ok()};tx.onerror=()=>no(tx.error)})}
async function auth(){phase('Initialisation 1/5 — session…');const f=readSession();if(!f)throw Error('AUTH_REQUIRED');session=f.s;if(session.expires_at&&Date.now()/1000>Number(session.expires_at)-30){if(!session.refresh_token)throw Error('AUTH_EXPIRED');session=await api('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:session.refresh_token})});saveSession(session,f.key)}user=session.user;if(!user?.id)throw Error('AUTH_REQUIRED')}
async function identity(){const saved=await vg('id:'+user.id);if(saved){return{record:saved,privateKey:await crypto.subtle.importKey('jwk',saved.privateJwk,{name:'RSA-OAEP',hash:'SHA-256'},true,['decrypt'])}}const g=await crypto.subtle.generateKey({name:'RSA-OAEP',modulusLength:2048,publicExponent:new Uint8Array([1,0,1]),hash:'SHA-256'},true,['encrypt','decrypt']);const record={publicJwk:await crypto.subtle.exportKey('jwk',g.publicKey),privateJwk:await crypto.subtle.exportKey('jwk',g.privateKey)};await vp('id:'+user.id,record);return{record,privateKey:g.privateKey}}
async function ensureDevice(force=false){if(device&&!force)return device;phase('Initialisation 2/5 — appareil sécurisé…');const i=await identity();const r=await rpc('ensure_web_device',{p_identity_public_key:i.record.publicJwk});const d=Array.isArray(r)?r[0]:r;if(!d?.id)throw Error('DEVICE_NOT_AVAILABLE');device={id:d.id,identity_public_key:d.identity_public_key||i.record.publicJwk,privateKey:i.privateKey};return device}
async function ensureKey(c){if(keyBytes&&current?.id===c)return{key:keyBytes,version:keyVersion};try{const q='select=wrapped_key,key_version&conversation_id=eq.'+encodeURIComponent(c)+'&device_id=eq.'+encodeURIComponent(device.id)+'&revoked_at=is.null&order=key_version.desc&limit=1';const r=(await rest('conversation_key_envelopes',q))?.[0];if(r){const k=new Uint8Array(await crypto.subtle.decrypt({name:'RSA-OAEP'},device.privateKey,ub64(r.wrapped_key)));keyBytes=k;keyVersion=Number(r.key_version);return{key:k,version:keyVersion}}}catch(e){if(String(e?.message||e).includes('INVALID_DEVICE')){await ensureDevice(true);return ensureKey(c)}}const r=await rpc('start_conversation_key_epoch',{p_conversation_id:c,p_device_id:device.id});const v=Number(Array.isArray(r)?(r[0]?.key_version??r[0]):(r?.key_version??r));if(!Number.isInteger(v)||v<1)throw Error('KEY_EPOCH_INVALID');const k=crypto.getRandomValues(new Uint8Array(32));await rest('conversation_key_envelopes','',{method:'POST',body:JSON.stringify({conversation_id:c,device_id:device.id,key_version:v,algorithm:'RSA-OAEP-2048-SHA256+AES-256-GCM',wrapped_key:b64(await crypto.subtle.encrypt({name:'RSA-OAEP'},await crypto.subtle.importKey('jwk',device.identity_public_key,{name:'RSA-OAEP',hash:'SHA-256'},true,['encrypt']),k))})});keyBytes=k;keyVersion=v;return{key:k,version:v}}
async function list(){phase('Initialisation 4/5 — conversations…');const m=await rest('conversation_members','select=conversation_id&user_id=eq.'+encodeURIComponent(user.id));const ids=new Set((m||[]).map(x=>x.conversation_id));const rows=await rest('conversations','select=id,title,created_at&order=created_at.desc&limit=100');const box=$('list');box.innerHTML='';for(const c of rows||[])if(ids.has(c.id)){const d=document.createElement('div');d.className='conv';d.textContent=c.title||'Conversation directe';d.onclick=()=>openConv(c);box.appendChild(d)}if(!box.children.length)box.textContent='Aucune conversation.'}
async function find(v){$('results').innerHTML='';status('Recherche…');try{const rows=await rpc('search_public_profiles',{p_query:v});const rs=(rows||[]).filter(x=>x.user_id!==user.id);if(!rs.length){$('results').textContent='Aucun profil trouvé.';return}for(const p of rs.slice(0,10)){const d=document.createElement('div');d.className='result';d.textContent=(p.display_name||p.public_display_name||'Profil WASSAFRICA')+(p.country?' · '+p.country:'');d.onclick=()=>startUser(p);$('results').appendChild(d)}if(rs.length===1)await startUser(rs[0])}catch(e){status('Recherche impossible : '+esc(e.message||e),'err')}}
async function startUser(p){if(!p?.user_id||p.user_id===user.id)return status('Impossible : choisissez un autre membre.','err');const r=await rpc('start_direct_conversation_by_user_id',{p_user_id:p.user_id});const x=Array.isArray(r)?r[0]:r;if(!x?.conversation_id)throw Error('CONTACT_NOT_FOUND');$('results').innerHTML='';await openConv({id:x.conversation_id,title:x.contact_name||p.display_name||'Conversation directe'})}
async function start(){const v=$('target').value.trim();if(!v)return status('Saisissez un nom ou un numéro.','err');$('start').disabled=true;try{const c=v.replace(/[\s().-]/g,'');if(/^\+?[1-9][0-9]{7,14}$/.test(c)){const phone=c.startsWith('+')?c:'+'+c';const own=String(user?.phone||user?.user_metadata?.phone||'').replace(/[\s().-]/g,'');if(own&&own===phone)return status('Impossible : vous avez saisi votre propre numéro.','err');const r=await rpc('start_direct_conversation_by_phone',{p_phone:phone});const x=Array.isArray(r)?r[0]:r;if(!x?.conversation_id)throw Error('CONTACT_NOT_FOUND');await openConv({id:x.conversation_id,title:x.contact_name||'Conversation directe'})}else await find(v)}catch(e){status('Impossible : '+esc(e.message||e),'err')}finally{$('start').disabled=false}}
async function decrypt(row,k){const m=row.encryption_metadata||{};const aad=te.encode('whatsafrica:v2:'+m.conversation_id+':'+(m.message_id||row.id));const kk=await crypto.subtle.importKey('raw',k,{name:'AES-GCM'},false,['decrypt']);return td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(m.iv),additionalData:aad},kk,ub64(row.ciphertext)))}
async function load(){if(!current)return;const x=await ensureKey(current.id);const rows=await rest('messages_v2','select=id,sender_id,created_at,ciphertext,encryption_metadata,message_type,media_path,media_mime,media_duration_ms&conversation_id=eq.'+encodeURIComponent(current.id)+'&order=created_at.asc&limit=200');const nodes=[];for(const r of rows||[]){let text='🔒 Message chiffré';if(r.message_type!=='text')text='📎 '+(r.encryption_metadata?.file_name||r.message_type||'Fichier')+' · transfert local/P2P';else{try{const v=Number(r.encryption_metadata?.key_version||x.version),k=v===x.version?x.key:await ensureKey(current.id);text=await decrypt(r,k.key||k)}catch{}}const d=document.createElement('div');d.className='msg '+(r.sender_id===user.id?'mine':'');d.textContent=text;if(r.message_type!=='text')window.WA_MEDIA_P2P?.decorate(r,d);nodes.push(d)}$('msgs').replaceChildren(...nodes);$('msgs').scrollTop=$('msgs').scrollHeight;$('secure').textContent='🔒 E2EE actif · clé v'+x.version}
async function sync(){if(!current||busy)return;busy=true;try{await load();status('Synchronisé.','ok')}catch(e){$('secure').textContent='⚠️ '+esc(e.message||e);status('Synchronisation : '+esc(e.message||e),'err')}finally{busy=false}}
async function openConv(c){current=c;keyBytes=null;keyVersion=0;$('empty').hidden=true;$('chat').hidden=false;$('title').textContent=c.title||'Conversation';if(timer)clearInterval(timer);try{await window.WA_MEDIA_P2P?.setConversation(c.id)}catch(e){status('Média : '+esc(e.message||e),'err')}await sync();timer=setInterval(sync,3000)}
async function send(e){e.preventDefault();const text=$('body').value.trim();if(!text||!current)return;$('send').disabled=true;try{const x=await ensureKey(current.id);const id=crypto.randomUUID();const iv=crypto.getRandomValues(new Uint8Array(12));const aad=te.encode('whatsafrica:v2:'+current.id+':'+id);const kk=await crypto.subtle.importKey('raw',x.key,{name:'AES-GCM'},false,['encrypt']);const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:aad},kk,te.encode(text));await rest('messages_v2','',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({id,conversation_id:current.id,sender_id:user.id,body:null,message_type:'text',encryption_version:1,ciphertext:b64(ct),encryption_metadata:{v:2,alg:'AES-256-GCM',iv:b64(iv),conversation_id:current.id,message_id:id,key_version:x.version}})});$('body').value='';await sync();status('🔒 Message envoyé.','ok')}catch(e){const msg=String(e?.message||e);if(msg.includes('INVALID_DEVICE')){try{await ensureDevice(true);status('Appareil sécurisé réacquis. Rechargez la conversation.','ok')}catch{status('Message non envoyé : '+esc(msg),'err')}}else status('Message non envoyé : '+esc(msg),'err')}finally{$('send').disabled=false}}
window.addEventListener('error',e=>{phase('❌ Erreur navigateur');gate.innerHTML='❌ Erreur navigateur : <b>'+esc(e.message||e)+'</b><div class="debug">Le démarrage est arrêté.</div>'});window.addEventListener('unhandledrejection',e=>{phase('❌ Erreur asynchrone');gate.innerHTML='❌ Promesse non gérée : <b>'+esc(e.reason?.message||e.reason||e)+'</b><div class="debug">Le démarrage est arrêté.</div>'});
try{await auth();$('app').hidden=false;await ensureDevice();await list();phase('Initialisation 5/5 — messagerie prête.');setTimeout(()=>gate.hidden=true,700);$('start').onclick=start;$('composer').onsubmit=send;$('target').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();start()}};window.WA_MEDIA_P2P?.init();setTimeout(()=>window.WA_CALLS?.init?.(),800);status('Messagerie prête.','ok')}catch(e){gate.hidden=false;gate.innerHTML=e.message==='AUTH_REQUIRED'||e.message==='AUTH_EXPIRED'?'❌ Session absente ou expirée. <a class='btn' style='display:inline-block;text-decoration:none;color:#111' href='/auth?next=%2Finbox'>Se connecter</a>':'❌ Démarrage impossible : <b>'+esc(e.message||e)+'</b><div class='debug'>Le démarrage est arrêté proprement — aucun chargement infini.</div>'}
})();
</script></body></html>
